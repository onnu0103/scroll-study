を示した。"],"s":[1]},{"n":"ナッジ・ユニットとBIT","p":["英国の行動洞察チーム（BIT）は2010年に内閣府内に試行的に設置され、心理学者デイビッド・ハルパーンが率いた。","2014年に政府・慈善団体ネスタ・職員が3分の1ずつ所有する組織として分離し、2021年12月にネスタの完全子会社となった。","セイラーはBITの設立に重要な役割を果たし、他国にも同様のナッジ・ユニットが作られた。","ホワイトヘッドら（2014）は、51か国に行動科学の影響を受けた中央政府主導の取り組みがあると報告した。"],"s":[1]},{"n":"BITの代表的な実験","p":["英国の税務当局の督促状に社会規範に訴える一文を加えると、23日以内の納税額が160万ポンド超増えた。","裁判所の罰金で、執行官を送る10日前にSMSを送ると自主的な支払いが倍増し、年3000万ポンドの節約と報告された。","オーストラリアでは報告期限の前日にSMSを送ると、期限内の報告が13.5%増え、給付の停止が1.7%減った。","いずれもRCTで効果を確かめてから広げるという政策手法の例である。"]},{"n":"EAST","p":["BITがまとめた行動洞察の実践の枠組み。望ましい行動をEasy・Attractive・Social・Timelyにするという4原則の頭文字。","Easy（簡単に）：手間や手続きを減らす。既定値の活用や書類の簡素化が典型。","Attractive（魅力的に）：注意を引き、魅力的に見せる。個人に宛てた表現や目立つ表示など。","Social（社会的に）：多くの人がそうしているという規範や、他者とのつながり・約束を活用する。","Timely（適時に）：人が最も反応しやすい時点に働きかける。期限直前のリマインダーなど。"]},{"n":"スラッジ","p":["個人の行動や決定を系統的に妨げる設計上・手続き上の摩擦。複雑な書式、隠れた手数料、操作的な既定値などを含む（サンスティーン）。","しばしば設計者の利益になり利用者の不利益になる。ナッジの「暗い従兄弟」と呼ばれる。","セイラーは2018年のScience誌の論説「Nudge, not sludge」でこの問題を取り上げた。"]},{"n":"ナッジへの規範的批判","p":["サグデンらは、リバタリアン・パターナリズムが標準理論からの逸脱を「誤り」とみなし、ホモ・エコノミクスを基準にしていると批判した。","人を操作し自律性を損なう、科学的な信頼性や法の支配の点で問題がある、といった批判もある。","アラッドとルービンシュタイン（2015）の仮想的なオンライン実験では、こうした介入への否定的な態度が見られた。","一方、サンスティーン（2017）は米国でナッジが党派を超えて広く支持されていると報告した。","人々が本当に得をしたかの評価は難しく、企業の利益を高め消費者の厚生を下げる場合もありうる。"],"s":[1]},{"n":"ナッジの効果量をめぐる論争","p":["メルテンスら（PNAS）の包括的なメタ分析は、ナッジは有効で、出版バイアスは中程度だと結論した。","マイヤーら（2022, PNAS）は同じデータを出版バイアスを補正して再分析し、ナッジ全体の効果を示す証拠は残らないとした。","サズィら（2022）は、強いナッジと効果がほぼないナッジが混在するので、平均効果より効果の条件の解明が必要だと論じた。","デラヴィーニャとリノス（2022, Econometrica）は、英米のナッジ・ユニットの未公刊RCT（対象2300万人超）を分析した。","その効果は、学術誌に公刊された研究が示すよりかなり小さかった。"],"s":[10]}]},{"u":"行動ファイナンス","items":[{"n":"効率的市場仮説との対立","p":["ファーマ（1970）は市場の効率性を、過去の価格（弱度）、公開情報（準強度）、私的情報（強度）の3つの形に分けた。","行動ファイナンスは、投資家のバイアスと裁定の限界によって、価格が本源的価値から乖離しうると考える。","効率性の検証は資産価格モデルの検証と切り離せない（結合仮説問題）ため、決着は難しい。","2013年のノーベル賞は、効率性を支持するファーマと、批判的なシラー、そしてハンセンが同時に受賞した。"]},{"n":"過剰反応（勝者・敗者効果）","p":["デボンとセイラー（1985, 1987）は、直近で大きく下落した「敗者」株が、上昇した「勝者」株をその後上回ることを示した。","投資家がニュースに過剰反応し、のちに修正が起きるという解釈と整合する。","敗者株の方がシステマティック・リスクが高いだけだという、リスクに基づく代替説明もある。","セイラーの価格反応のモデルは、過小反応・調整・過剰反応の3局面からなる。"],"s":[1]},{"n":"ディスポジション効果","p":["値上がりした株を早く売り、値下がりした株を持ち続ける傾向。シェフリンとスタットマン（1985）が命名した。","オディーン（1998）はディスカウント証券会社の1万口座（1987〜93年）を分析し、年間の利益実現率は14.8%、損失実現率は9.8%だった。","12月には節税のための損失確定売りが増え、利益実現率10.8%、損失実現率12.8%と逆転した。","説明として、価値関数の形、購入価格を参照点とする心の会計、後悔の回避、自己制御が挙げられる。","投資信託の運用担当者にも、個人投資家より弱いながら同じ効果が見られた（フラッツィーニ2006）。"],"s":[1]},{"n":"株式プレミアムと近視眼的損失回避","p":["米国株の平均的な超過収益は約6%だが、妥当なリスク回避度のモデルでは1%未満しか説明できない（メーラとプレスコット1985）。","ベナルツィとセイラー（1995, QJE）は、損失回避と頻繁な成績評価（近視眼）の組み合わせで説明する近視眼的損失回避を提案した。","投資家が成績を1年ごとに評価すると仮定すると、観察される株式プレミアムが説明できる。","評価の頻度が高いほど株式を危険に感じるという予測は、ラボ実験でも支持された（セイラーら1997など）。"],"s":[1]},{"n":"ノイズトレーダーと限定的裁定","p":["誤った信念で売買するノイズトレーダーがいると、価格がファンダメンタルズから外れるリスクが生じる（デロングら1990）。","価格の誤りが残るには、合理的な裁定取引に限界があることが必要である（シュライファーとヴィシュニー1997）。","裁定には資金や期間の制約があり、乖離が一時的に広がると裁定者が損失を被るため、誤りがすぐに修正されないことがある。"],"s":[1]},{"n":"価格の誤りの実例","p":["クローズドエンド型ファンドは平均して純資産価値より割安で取引される。リー、シュライファー、セイラー（1991）はノイズトレーダーで説明した。","ラモントとセイラー（2003）は、子会社株の一部を上場させた親会社の残りの価値（スタブ値）を調べた。","9社で正、3社でわずかに負、6社で明確に負のスタブ値となり、親会社が保有する子会社株より安く評価される例があった。","一物一価が成り立たない明白な誤りが続く例として、限定的裁定の議論で引かれる。"],"s":[1]},{"n":"シラーと過剰ボラティリティ","p":["シラー（1981, AER）は、株価がその後の配当の変化で正当化されるより大きく変動していることを示した。","『根拠なき熱狂』（2000年3月）で株式市場がバブルだと警告し、第2版（2005）で住宅市場にも警鐘を鳴らした。","2003年に論文「住宅市場にバブルはあるか」を共著し、2007年9月には米住宅市場の崩壊が迫っていると予測した。","カール・ケースとのケース・シラー住宅価格指数や、景気循環調整後株価収益率（CAPE）の開発でも知られる。"]},{"n":"バブル","p":["資産価格が、長期的なファンダメンタルズで正当化できる水準を大きく上回る期間。","歴史的な例に、オランダのチューリップ狂（1634〜37年）、英国の南海泡沫（1720年）、ドットコム・バブル、2000年代の米住宅バブルがある。","行動面の説明として、群集行動、より愚かな買い手に転売できるという期待、過去の高収益の外挿が挙げられる。","スミス、スチャネク、ウィリアムズ（1988）以来、実験市場でもバブルと暴落が繰り返し観察され、専門のトレーダーでも起こる。","ファーマは、終わりを事前に予測できない限りバブルは識別できないとして懐疑的である。"]},{"n":"素朴な分散（1/n）","p":["ベナルツィとセイラー（2001, AER）：確定拠出年金の加入者の一部は、提示されたファンドに均等に拠出する「1/n戦略」を取る。","そのため、株式への配分がメニュー中の株式ファンドの割合に強く左右される。","リードとローウェンスタイン（1995）のハロウィーンの実験では、子どもはお菓子をまとめて選ぶと多様性に偏り、1つずつ選ぶとそうならなかった。","選択を一括で行うか逐次に行うかによって、結果が変わることを示す例である。"]},{"n":"過信・ホームバイアス・過剰売買","p":["過信、特に自分の情報の精度の過大評価は、株式トレーダーの売買が多すぎることを説明しうる（ダニエルら1998）。","経営者の過信は、企業価値を損なう買収と結び付けられている（マルメンディアとテイト2008）。","ホームバイアス：国際分散投資の観点から合理的な水準を超えて、自国の資産を多く保有する傾向。","確証バイアスによって、自分の投資戦略に不利な証拠を軽視することもある。"]}]},{"u":"二重過程理論と神経経済学","items":[{"n":"システム1とシステム2","p":["カーネマン『ファスト＆スロー』（2011）が広めた区分。システム1は速く自動的・感情的で無意識的、システム2は遅く努力を要し論理的で意識的。","例：「2＋2」の答えはシステム1が即座に出し、17×24の暗算はシステム2が担う。","直観的な判断は自然に浮かぶシステム1の産物で、熟慮的なシステム2がそれを点検し修正しうる。","カーネマンは、物事が順調なとき、つまりほとんどの時間はシステム2は必要ないと述べた。","合理的経済人を、システム2の完璧な推論とシステム1の低い計算コストを併せ持つ存在だと評した（2003）。"],"s":[9]},{"n":"属性代替とWYSIATI","p":["属性代替：難しい問いに、関連するより易しい問いの答えで代わりに答えてしまう仕組み（カーネマン2002, 2011）。","リンダ問題は、確率の問いを「どれだけ典型的に見えるか」の問いで代用した例として説明される。","WYSIATI（見たものがすべて）：手元の情報だけで一貫した物語を作り、知らない情報の存在をほとんど考えない傾向。","少ない情報からの過信や、根拠の弱い即断を説明する概念として使われる。"],"s":[9]},{"n":"経験効用とピーク・エンドの法則","p":["カーネマンは、その瞬間に快苦を感じる「経験する自己」と、経験を振り返って評価する「記憶する自己」を区別した。","ピーク・エンドの法則：経験の記憶による評価は、最も強烈な時点と終わりの時点の感覚でほぼ決まる。","冷水実験（1993）：14℃の水に60秒手を入れる試行と、その後15℃で30秒延長する試行では、長い方を繰り返す人が多かった。","大腸内視鏡の無作為化試験（2003）では、終了時に器具を3分間留置した群が検査をより不快でなかったと評価し、再検査も受けやすかった。","経験の長さが振り返りの評価にほとんど影響しない「持続時間の無視」を伴う。"]},{"n":"神経経済学の成立と手法","p":["意思決定を経済学・心理学・神経科学の統合で説明しようとする学際分野。脳の知見を経済モデルの改良に生かすことも目指す。","2002年にプリンストンで開かれた会合が、現在の神経経済学会の始まりとされる。","手法はfMRI・PET、脳波（事象関連電位）、経頭蓋磁気刺激（TMS）、脳損傷患者の研究、皮膚電気反応などの生理指標など。","パドア＝スキオッパとアサド（2006）は、ジュースを選ぶサルの眼窩前頭皮質のニューロン活動を記録した。"],"s":[13]},{"n":"公正さと罰の脳活動","p":["サンフィーら（2003）は、最後通牒ゲームの不公正な提案が、嫌悪感と関わる前部島皮質を活動させることを示した。","ガバイら（2014）のメタ分析は、不公正な提案と、島皮質・前帯状皮質・右背外側前頭前野などとの関連をまとめた。","クノッホら（2006）は、TMSで右背外側前頭前野の働きを乱すと、不公正な提案を受け入れる人が増えることを示した。"],"s":[13,12]},{"n":"時間選好・損失回避の脳","p":["マクルーアら（2004）：即時の報酬を含む選択では辺縁系が強く活動し、外側前頭前野はどちらの選択でも同程度に活動した。","トムら（2007）は、損失回避が負の感情に関わる領域の活動増加を伴わないことを報告した。","デ・マルティーノ、カメラー、アドルフス（2010）：扁桃体を損傷した患者では金銭の損失回避が消えたが、リスク回避は正常だった。","フィオリッロら（2003）は、サルのドーパミン神経の活動が報酬の不確実性と相関することを示した。"],"s":[13]},{"n":"オキシトシンと信頼","p":["コスフェルドら（2005）は、オキシトシンを投与すると全般的なリスク選好は変わらずに、信頼ゲームでの信頼が高まると報告した。","この研究はのちにネイヴら（2015）によって疑問視され、効果の頑健性が問われている。","最後通牒ゲームでは、オキシトシンが寛大な提案を偽薬と比べて80%増やしたという報告もある。"],"s":[13,12]},{"n":"神経経済学への批判","p":["標本の小さい研究が多く、分野の多くは「学術的なマーケティングの誇大宣伝」だという批判がある（ハリソン2008）。","脳部位と「価値」などの構成概念の結び付きが弱く、脳活動から心的過程を推し量る逆推論が分野を損ねたと指摘される。","ルービンシュタインは、標準的な実験は選択の手続きについてほとんど情報を与えないと論じた。"],"s":[13]}]},{"u":"研究方法","items":[{"n":"ラボ実験の誕生","p":["チェンバリン（1948, JPE）の教室での市場実験は、最初の市場実験であるだけでなく最初の経済実験とされる。","ヴァーノン・スミスは1955年秋に経済学原論を教え、翌学期の初日に最初の市場実験を行った。","スミス（1962, JPE）は、ダブルオークションなどの集中的な取引形態で、価格と取引量が競争均衡の値に収束することを示した。","売り手の期待収入が競売方式によって変わることなど、市場制度の重要性を実験で示した。"],"s":[0]},{"n":"実験経済学の方法論","p":["スミス（1976, AER）の誘発価値理論は、金銭報酬で被験者の選好を統制するという経済実験の原理を初めて明確にした。","実験経済学では、実際の金銭報酬で動機づけること、被験者を欺かないことが規範とされる（心理学の実験との違い）。","電力自由化などの新しい市場制度を、実施前にラボで試す「風洞実験」もスミスが開拓した。","社会的選好の研究では、最後通牒・独裁者・公共財・信頼の各ゲームが標準的な道具となった。"],"s":[0]},{"n":"フィールド実験","p":["現実の環境で処置を無作為に割り当てる実験。参加者が実験と気づかなければホーソン効果を避けられる。","外的妥当性が高く、観察研究の偏りを測る基準にもなる（ハリソンとリスト2004, JEL）。","一方で費用と時間がかかり追試が難しく、倫理的な問題、不遵守や脱落、参加者間の波及効果が課題となる。","結果が特定の地域や政治状況に結び付き、一般化が難しいことがある。"]},{"n":"RCTと政策評価","p":["処置群と対照群を無作為に分けて効果を推定するRCTは、ナッジ・ユニットの標準的な手法である。","無作為化により、処置の効果を事前の群間の違いから切り離せる点が、観察研究に対する利点である。","BITは税の督促状や裁判所のSMSなどをRCTで検証し、効果のあった介入を広げた。","ナッジ・ユニットのRCTの効果は、学術誌に公刊された研究の効果よりかなり小さかった（デラヴィーニャとリノス2022）。"],"s":[10]},{"n":"外的妥当性とWEIRD批判","p":["多くの研究が、西洋の・教育を受けた・工業化された・豊かな・民主的な社会（WEIRD）の被験者に偏るという批判がある。","小さな効果量と標本の多様性の乏しさが一般化を制限していることは、研究者自身も認めている。","小規模社会での最後通牒ゲーム（ヘンリックら）のように、文化による行動の違いが実際に見つかっている。"],"s":[12]}]},{"u":"主要な研究者とノーベル賞","items":[{"n":"ハーバート・サイモン","p":["1916〜2001年。1978年ノーベル経済学賞。授賞理由は「経済組織内の意思決定過程に関する先駆的研究」。","全知で合理的に利潤を最大化する企業家を、知識の限られた複数の協力する意思決定者に置き換えた。","ニューウェルと初期の人工知能プログラム「論理理論家」（1956）を作り、1975年にチューリング賞を共同受賞した。","主著『経営行動』（1947）は博士論文に基づく。"],"s":[7]},{"n":"カーネマンとトヴェルスキー","p":["カーネマン（1934〜2024）は2002年、「心理学研究の洞察を経済学に統合した」業績でノーベル賞を受賞した。","共同研究者のトヴェルスキー（1937〜1996）は受賞前に亡くなった。ノーベル賞は故人には授与されない。","カーネマンは自らを経済学者ではなく心理学者とし、行動経済学の創始者は自分ではなくセイラーだと述べた。","合理性から1つずつ逸脱を加えていく行動経済学のモデル化を、累積的でないとして批判的に見ていた。","晩年に『ノイズ』（2021, シボニー、サンスティーンと共著）を著し、2024年3月27日に死去した。"],"s":[0,9]},{"n":"ヴァーノン・スミス","p":["1927年生まれ。2002年にカーネマンとともにノーベル賞を受賞した。","授賞理由は「特に代替的な市場メカニズムの研究において、ラボ実験を実証経済分析の道具として確立した」こと。","実験経済学の基礎を築き、信頼できる経済実験の基準となる方法を開発した。","論文「経済学における構成主義的合理性と生態学的合理性」（2003, AER）で合理性の2つの見方を論じた。"],"s":[0]},{"n":"ロバート・シラー","p":["2013年、ファーマ、ハンセンとともに「資産価格の実証分析」でノーベル賞を受賞した。","行動ファイナンスの先駆者とされ、株価の過剰変動（1981）や『根拠なき熱狂』（2000）で知られる。","セイラーとともに、全米経済研究所（NBER）の行動経済学プロジェクトを1991〜2015年に共同主宰した。","アカロフとの共著『アニマル・スピリット』（2009）、『ナラティブ経済学』（2019）がある。"],"s":[1]},{"n":"リチャード・セイラー","p":["1945年生まれ。2017年ノーベル賞。授賞理由は「行動経済学への貢献」で、心理学的に現実的な仮定を経済分析に組み込んだと評された。","限定合理性（心の会計）、社会的選好（公正さ）、自己制御の欠如（プランナー・ドゥアー）の3つの心理的特性を経済分析に持ち込んだ。","1987年からJEPで「アノマリー」欄を連載し、論集『The Winner's Curse』（1992）にまとめた。","行動経済学の歴史を描いた『Misbehaving』（2015）、サンスティーンとの『ナッジ』（2008）がある。","1993年にラッセル・フラーと資産運用会社フラー＆セイラーを共同設立した。"],"s":[1]}]},{"u":"再現性の問題","items":[{"n":"心理学の再現性危機","p":["オープン・サイエンス・コラボレーション（2015）は心理学の100研究を追試し、元研究で有意だった97件のうち再現は36%だった。","追試で得られた効果量は、平均して元の研究の約半分だった。","メニー・ラボの取り組みでは、60のラボが28の知見を大標本で追試し、半数が再現されなかった。","かつて確立したと考えられた自我消耗やパワーポーズなどの知見が疑われるようになった。","事前登録やデータの公開が、こうした問題への対策として広がった。"],"s":[11]},{"n":"経済学実験の再現性","p":["2016年のScience誌の研究では、AERとQJEに2011〜14年に載った18の実験経済学研究のうち約61%が再現された。","2018年のNature Human Behaviour誌の研究では、NatureとScienceに載った21の社会・行動科学研究のうち約62%が再現された。","どちらもカメラーらによる大規模な追試で、心理学の追試結果より高い再現率だった。"],"s":[11]},{"n":"自我消耗","p":["意志力は使うと減る資源だという仮説。バウマイスターら（1998）は、チョコを我慢した人が後の難しいパズルで早く諦めたと報告した。","ハガーら（2010）のメタ分析は、198の独立した検定から中程度の効果量（d≒0.6）を得た。","カーターとマッカローが出版バイアスを補正すると効果は小さく（d≒0.2）、ゼロと有意に異ならなかった。","ハガーら（2016）の約20余りのラボ・2141人による統一手順の追試では、効果は確認されなかった。","ヴォースら（2021）の36ラボ・3531人の追試でもd=0.06と、2010年のメタ分析より1桁小さかった。"],"s":[14]},{"n":"社会的プライミング","p":["高齢者に関する語に触れると歩く速度が遅くなるというバージら（1996）の研究は、2010年代初めの直接追試で再現されなかった。","カーネマン『ファスト＆スロー』のプライミングを扱う第4章は、再現可能性の指標（Rインデックス）が14と評価された。","カーネマンはこれに対し、「検出力の低い研究を信頼しすぎた」と認めた。"],"s":[11]},{"n":"署名研究の不正（2012年PNAS）","p":["シュー、マザール、ジーノ、アリエリー、ベイザーマン（2012, PNAS）は、書類の冒頭で署名させると不正申告が減ると報告した。","データ・コラーダは2021年8月17日、同論文の保険会社のフィールド実験のデータに捏造の証拠があると公表した。","同論文は2021年に撤回された。Excelのメタデータは、アリエリーがファイルを作成し最後に編集したことを示していた。","アリエリーは、デューク大学の3年間の調査はデータの改ざんを認めたが、自分が故意に偽データを使った証拠はなかったと説明した。"]},{"n":"ジーノ事件","p":["2023年6月、データ・コラーダはジーノが関わった4論文に偽のデータが含まれると4本の記事で指摘した。","ハーバード・ビジネススクールは同月にジーノを無給の休職とし、1200ページの内部報告は研究不正を認定した。","未撤回だった3論文も撤回され、2025年5月にハーバードは終身在職権を取り消し、雇用を終了した。","ジーノは2023年8月に2500万ドルの訴訟を起こしたが、2024年9月にデータ・コラーダ側への請求はすべて棄却された。"]},{"n":"頑健性が争われている知見","p":["損失回避は「頑健でない」とする再メタ分析（2025）がある一方、大規模メタ分析（2024）は平均λ≒2を支持している。","ナッジの平均効果は、出版バイアスを補正すると消えるという再分析がある（マイヤーら2022）。","オキシトシンが信頼を高めるという研究も、のちに疑問視された。","アリエリーらの2008年の論文「正直な人の不正直さ」には懸念表明が付されている。","データ・コラーダの3人は2011年に偽陽性の問題を論じ、2014年に「pハッキング」という語を作った。"],"s":[5,10]}]}]},{"id":"stats","name":"統計学","full":"統計学（統計検定2級レベル）","group":"教養・専門","desc":"データの要約から推定・検定・回帰まで、データで判断する方法論","asOf":"統計検定2級 出題範囲表（2018年12月14日版）と公式試験概要（2026年11月確認）に基づく","aliases":["統計","統計検定","統計検定2級","推測統計","データ分析の基礎"],"sources":[{"t":"統計検定 2級（公式・試験概要）","u":"https://www.toukei-kentei.jp/grade/grade2/"},{"t":"統計検定2級 出題範囲表（2018/12/14）","u":"https://www.toukei-kentei.jp/hubfs/files/grade_range/grade2_hani_20181214.pdf"},{"t":"統計検定3級 出題範囲表（2018/12/14）","u":"https://www.toukei-kentei.jp/hubfs/files/grade_range/grade3_hani_20181214.pdf"},{"t":"統計検定 よくある質問（CBT方式試験）","u":"https://www.toukei-kentei.jp/faq"},{"t":"ScienceDaily: ASA statement on statistical significance and p-values (2016)","u":"https://www.sciencedaily.com/releases/2016/03/160307092305.htm"},{"t":"APS Observer: Statistics Organization Speaks Out on p Values","u":"https://www.psychologicalscience.org/observer/statistics-organization-speaks-out-on-p-values"},{"t":"FORRT Glossary: p-value（ASA 2016の定義）","u":"https://forrt.org/glossary/p-value/"},{"t":"佐藤俊哉「ASA声明と疫学研究におけるP値」計量生物学38(2)","u":"https://www.jstage.jst.go.jp/article/jjb/38/2/38_109/_article"},{"t":"Wasserstein & Lazar (2016) The ASA's statement on p-values（要約ページ）","u":"https://mattlee821.github.io/papers/statistics/wasserstein_2016_26820252.html"},{"t":"立教大学 社会情報教育研究センター『統計調査士試験 対策コンテンツ』第2版","u":"https://rikkyo.repo.nii.ac.jp/record/10239/files/%E7%B5%B1%E8%A8%88%E8%AA%BF%E6%9F%BB%E5%A3%AB%E5%AF%BE%E7%AD%96%E3%82%B3%E3%83%B3%E3%83%86%E3%83%B3%E3%83%84%E7%AC%AC2%E7%89%88.pdf"},{"t":"講義スライド「推定と検定」（UMIN health-stat）","u":"https://plaza.umin.ac.jp/~health-stat/wpsystem/wp-content/uploads/2017/01/chapter5_slide.pdf"},{"t":"講談社『統計検定2級 対策テキスト&問題集』目次","u":"https://www.kodansha.co.jp/book/products/0000426974"},{"t":"技術評論社『目指せ！合格 統計検定2級』目次","u":"https://gihyo.jp/dp/ebook/2026/978-4-297-15711-1"},{"t":"アガルート「統計検定2級とは」（2026年10月更新）","u":"https://www.agaroot.jp/datascience/column/grade2/"}],"units":[{"u":"統計学の基礎とデータ","items":[{"n":"統計検定2級の試験形式","p":["CBT方式で4〜5肢選択問題を35問程度、試験時間90分。100点満点中60点以上で合格となる。","受験料は一般7,000円・学割5,000円（税込）。申込と運営はオデッセイコミュニケーションズが担う。","電卓は四則演算・％・√ができる普通電卓1台まで持込可。関数電卓・金融電卓等は不可。統計数値表は会場で配布。","試験直後に結果レポートが表示される。同一種別の再受験は前回から7日（168時間）以上空ける必要がある。","大学基礎課程（1・2年次）レベルを問い、3・4級の内容を含む。2級のPBT（紙）方式は2021年で終了した。"],"s":[0,3,13]},{"n":"記述統計と推測統計","p":["記述統計は手元のデータを表・グラフ・要約統計量で整理する。推測統計は標本から母集団の性質を推し量る。","母集団の特性値（母平均μ・母分散σ²）を母数、標本から計算する x̄・s² などを統計量と呼ぶ。","推測統計の柱は推定（点推定・区間推定）と仮説検定の2つである。","統計量は標本ごとに値が変わる確率変数であり、その分布を標本分布という。"],"s":[1,10]},{"n":"質的変数と量的変数","p":["質的変数（カテゴリカルデータ）は分類を表す（血液型・満足度など）。量的変数は数値の大小や差に意味がある。","量的変数は、個数のように飛び飛びの値をとる離散型と、身長のように連続的な値をとる連続型に分かれる。","質的変数は棒グラフ・円グラフ・帯グラフ、量的変数はヒストグラム・箱ひげ図・幹葉図で表すのが基本。","番号で符号化した質的変数（男=1、女=2など）の平均値は意味をもたない。"],"s":[1,2]},{"n":"尺度水準（4つの尺度）","p":["名義尺度：区別のみ意味がある（性別・郵便番号）。代表値として使えるのは最頻値。","順序尺度：順序に意味があるが間隔は等しくない（順位・5段階評価）。中央値・四分位数が使える。","間隔尺度：差に意味があるが原点0が任意（摂氏温度・西暦）。「20℃は10℃の2倍」のような比は無意味。","比例尺度：絶対的な原点0をもち比にも意味がある（身長・金額）。変動係数が使えるのはこの尺度。","名義・順序尺度は質的変数、間隔・比例尺度は量的変数に対応する。上位の尺度ほど許される演算が多い。"],"s":[2]},{"n":"データソースと公的統計","p":["公的統計は国や自治体が作成する統計。統計法に基づき、特に重要なものは基幹統計に指定される。","国勢調査は日本に住むすべての人・世帯を対象とする全数調査で、5年ごとに行われる。","公的統計には、調査を行って作る調査統計と、届出など行政記録を集計する業務統計がある。","既存データを使うときは、用語の定義・調査時点・対象範囲・調査方法を確認してから比較する。"],"s":[1,2,9]}]},{"u":"1変数データの記述","items":[{"n":"度数分布表とヒストグラム","p":["度数分布表は階級・階級値（階級の中央の値）・度数・相対度数・累積相対度数で構成する。","相対度数＝度数÷総度数。累積相対度数は最後の階級で1になる。","度数分布表からの平均は、各階級を階級値で代表させて Σ(階級値×度数)÷n で求める（近似値）。","階級幅が不等なヒストグラムは、面積が度数に比例するよう高さを度数÷階級幅にする。","幹葉図は元の値を残したまま分布の形を示せる。累積度数グラフからは中央値や四分位数を読める。"],"s":[1,2]},{"n":"分布の形状と歪度・尖度","p":["右に裾が長い分布（所得分布など）では一般に 平均値＞中央値＞最頻値 となりやすい。","左に裾が長い分布では逆に平均値＜中央値となりやすい。対称な単峰分布では3つがほぼ一致する。","歪度は標準化した値の3乗の平均。正なら右に裾が長く、負なら左に裾が長く、0なら対称。","尖度は標準化した値の4乗の平均で正規分布では3。3を引いて正規分布を0とする定義もある。","峰が2つ以上ある多峰分布は性質の異なる集団の混在を疑い、層別して分析する。"],"s":[1]},{"n":"平均値・中央値・最頻値","p":["平均値 x̄＝Σxᵢ/n。外れ値の影響を強く受ける。","中央値は小さい順に並べた中央の値で、nが偶数なら中央2つの平均。外れ値に頑健である。","最頻値は度数が最大の値（度数分布表では度数最大の階級の階級値）。名義尺度にも使える。","偏差の和 Σ(xᵢ−x̄) は常に0。Σ(xᵢ−a)² は a＝平均値で、Σ|xᵢ−a| は a＝中央値で最小になる。","例：1, 2, 3, 4, 100 の平均値は22、中央値は3。外れ値1つで平均値だけが大きく動く。"],"s":[1,2]},{"n":"分散と標準偏差","p":["分散は偏差の2乗の平均 Σ(xᵢ−x̄)²/n。母分散の推定に使う不偏分散は n−1 で割る。","2級の範囲表は「分散（n−1で割る）」と明記する。問題文がどちらの定義かを必ず確認する。","計算公式：（nで割る）分散＝（x²の平均）−（平均）²。例：2, 4, 6 は 56/3−16＝8/3。","標準偏差は分散の正の平方根で、元データと同じ単位をもつ。"],"s":[1]},{"n":"範囲・四分位数・四分位範囲","p":["範囲＝最大値−最小値。外れ値1つで大きく変わる。","第1四分位数Q1・中央値Q2・第3四分位数Q3でデータを小さい順に4等分する。","四分位範囲 IQR＝Q3−Q1 は中央の約50%の広がり。四分位偏差は IQR/2。","四分位数の求め方には複数の流儀があり、ソフトウェアによって値が少し異なる。","五数要約は最小値・Q1・中央値・Q3・最大値の5つで分布を要約する。"],"s":[1,2]},{"n":"箱ひげ図と外れ値","p":["箱はQ1〜Q3、箱内の線が中央値、ひげは最小値・最大値まで伸ばす。平均値を＋印で加えることもある。","よく使う外れ値の基準：Q1−1.5×IQR 未満、または Q3＋1.5×IQR を超える値。","例：Q1＝10、Q3＝20 なら IQR＝10 で、−5未満または35超が外れ値。ひげは外れ値を除く範囲までとする。","複数群の比較に向くが、多峰性など分布の細かな形は読み取れない。ヒストグラムと対応づけて読む。"],"s":[1,2]},{"n":"変動係数","p":["変動係数 CV＝標準偏差÷平均値。単位に依存しない相対的な散らばりの指標である。","例：平均50kg・SD5kg（CV＝0.1）と平均1000円・SD200円（CV＝0.2）では後者の相対的ばらつきが大きい。","比例尺度で平均値が正のときに使う。間隔尺度（摂氏温度など）では意味をもたない。","データを定数倍しても CV は変わらないが、定数を加えると平均だけが変わるため CV は変わる。"],"s":[1,2]},{"n":"標準化・z得点・偏差値","p":["標準化 z＝(x−x̄)/s。標準化したデータは平均0、標準偏差1になる。","偏差値＝50＋10z。平均点なら50、平均より1標準偏差上なら60。","平均やばらつきの異なるテストの成績を比較できる。例：平均60点・SD10点で80点なら z＝2。","正規分布を仮定すると z≧2（偏差値70以上）は上位約2.3%。"],"s":[1,2]},{"n":"一次変換と統計量の変化","p":["y＝ax＋b と変換すると、平均は a x̄＋b、分散は a²倍、標準偏差は |a| 倍になる。","中央値・四分位数も同じ一次変換を受け、範囲とIQRは |a| 倍になる。定数bはばらつきに影響しない。","例：華氏 F＝1.8C＋32 なら、平均は1.8倍して32を足し、標準偏差は1.8倍。","x→ax＋b、y→cy＋d のとき相関係数は ac＞0 なら不変、ac＜0 なら符号だけ反転する。"],"s":[1]},{"n":"ローレンツ曲線とジニ係数","p":["ローレンツ曲線は小さい順に並べ、累積人数比を横軸、累積所得比を縦軸にとった曲線である。","完全に平等なら45度の均等分布線に一致し、不平等なほど下に膨らむ。","ジニ係数＝均等分布線とローレンツ曲線で囲まれた面積の2倍。0（完全平等）に近いほど平等。","例：2人の所得が0と100ならジニ係数は0.5。n人の有限データでは最大値は (n−1)/n。"],"s":[1]}]},{"u":"2変数データと時系列","items":[{"n":"散布図と共分散","p":["散布図は2つの量的変数の関係（向き・強さ・直線性・外れ値）を目で確かめる図である。","共分散 s_xy＝Σ(xᵢ−x̄)(yᵢ−ȳ)/n。正なら右上がり、負なら右下がりの傾向。","計算公式：s_xy＝（xyの平均）−x̄ȳ。","共分散は単位に依存する（cm→mで1/100）ため、値の大小で関係の強さは比べられない。","層別した散布図では、全体と層内とで異なる傾向が見えることがある。"],"s":[1,2]},{"n":"相関係数","p":["相関係数 r＝s_xy/(s_x s_y)、−1≦r≦1。分子と分母で n か n−1 かをそろえれば同じ値になる。","|r|＝1 は全点が1本の直線上にあるとき。r＝0 は直線的な関係がないことを示す。","例：x＝1,2,3、y＝2,4,5 では偏差積和3、Σ偏差²が2と14/3で、r＝3/√(28/3)≒0.98。","相関行列は複数変数の相関係数を並べた対称行列で、対角成分は1。"],"s":[1,2]},{"n":"相関係数を読むときの注意","p":["r は直線的関係の強さだけを測る。−1〜1で対称な x と y＝x² のような曲線関係では r≒0 になりうる。","外れ値1点で r は大きく変わる。数値だけでなく必ず散布図を確認する。","選抜などで範囲を絞った標本では r が小さく出やすい（選抜効果・切断効果）。","性質の異なる集団を混ぜると、層内にない相関が全体で現れたり消えたりする。"],"s":[1,2]},{"n":"擬相関と偏相関係数","p":["擬相関（見かけの相関）：第3の変数zが x と y の両方に影響し、直接の関係がないのに相関が現れる。","例：アイスの売上と水難事故件数は、ともに気温が高いと増えるため正の相関を示す。","偏相関係数 r_xy·z＝(r_xy−r_xz r_yz)/√((1−r_xz²)(1−r_yz²))。zの影響を除いた相関。","例：r_xy＝0.5、r_xz＝r_yz＝0.7 なら r_xy·z＝0.01/0.51≒0.02 で、相関はほぼzで説明される。"],"s":[1,2]},{"n":"クロス集計表（分割表）","p":["2つの質的変数の度数を行×列の表にまとめたもの。行和・列和を周辺度数という。","関連は行比率（行和に対する割合）か列比率で比べる。どちらで割るかは比較の目的で決める。","2変数が独立なら各セルの期待度数＝行和×列和÷総度数。観測度数とのずれで関連をみる。","関連の有無はχ²独立性検定で判断する。視覚化にはモザイク図や帯グラフを使う。"],"s":[1,2]},{"n":"時系列の変動要因","p":["時系列は傾向変動（トレンド）・循環変動・季節変動・不規則変動に分けて捉える。","季節変動は1年周期の規則的な変動で、月次・四半期データに現れる。","季節の影響は前年同月比をとるか、季節調整済み系列を使って取り除く。","要因を足し合わせる加法モデルと、掛け合わせる乗法モデルがある。"],"s":[1,2]},{"n":"指数化・成長率・幾何平均","p":["指数化：基準時点を100として 当期値÷基準時点の値×100 で表し、推移や系列間の比較をしやすくする。","成長率（変化率）＝(当期−前期)÷前期。例：100→120 は20%増。","複数期の平均成長率は幾何平均で求める：1＋r̄＝((1＋r₁)(1＋r₂)…(1＋r_n))^(1/n)。","例：＋10%の翌期に−10%なら 1.1×0.9＝0.99。算術平均は0%だが平均成長率は約−0.5%。","幾何平均は正の値にしか使えないため、成長率そのものではなく (1＋成長率) の積で計算する。"],"s":[1,2]},{"n":"移動平均","p":["連続するk期の平均を1期ずつずらして求め、短期の変動をならしてトレンドを見やすくする。","3項移動平均は (x_{t−1}＋x_t＋x_{t＋1})/3 を時点tの値とする。","月次データの季節変動を除くには12項移動平均を使う。偶数項では中心化（隣り合う2つの平均）が必要。","項数を増やすほど滑らかになるが、系列の両端で計算できない時点が合計（項数−1）個生じる。"],"s":[1,2]},{"n":"自己相関とコレログラム","p":["ラグkの自己相関（系列相関）は、x_t と k期前の x_{t−k} との相関である。","標本自己相関 r_k＝Σ(x_t−x̄)(x_{t＋k}−x̄)/Σ(x_t−x̄)²。分子の和は t＝1〜n−k。","コレログラムはラグkを横軸、r_kを縦軸にとった図。ラグ0では常に1。","季節性のある月次データではラグ12の自己相関が高く、トレンドがあると自己相関がゆっくり減衰する。"],"s":[1]}]},{"u":"データの収集と研究デザイン","items":[{"n":"全数調査と標本調査","p":["全数調査は母集団全体を調べる（国勢調査など）。標本誤差はないが、費用と時間がかかる。","標本調査は母集団の一部を調べて全体を推測する。無作為抽出なら標本誤差を確率的に評価できる。","電球の寿命試験のような破壊検査は全数調査ができないため、標本調査を用いる。","推定精度は主に標本サイズnで決まり、母集団が標本より十分大きければ母集団の大きさにほぼよらない。"],"s":[1,2,9,10]},{"n":"単純無作為抽出と系統抽出","p":["単純無作為抽出：抽出枠（名簿）から乱数を使い、どのn個の組も同じ確率で選ばれるように抽出する。","系統抽出：最初の1つを乱数で決め、以後は一定間隔で抽出する。間隔＝母集団の大きさ÷標本サイズ。","例：800人から40人を選ぶなら間隔は20。1〜20から乱数で開始番号を決める。","名簿の並びに抽出間隔と一致する周期があると、系統抽出の標本は偏る。"],"s":[1,9]},{"n":"層化抽出","p":["母集団を性別・年代などの層に分け、各層から無作為に抽出する。","層内が均質で層間の差が大きいほど、同じnの単純無作為抽出より推定精度が上がる。","比例配分は各層の標本数を層の大きさに比例させ、ネイマン配分は層の大きさ×層の標準偏差に比例させる。","割当法（クォータ法）は構成比を層に合わせるが、層内の選び方が無作為でない有意抽出である。"],"s":[1,9]},{"n":"集落抽出と多段抽出","p":["集落（クラスター）抽出：学校・地区などの集団を無作為に選び、選んだ集団の中は全員を調べる。","集落内が似た者同士だと、同じ人数の単純無作為抽出より精度が落ちやすいが、調査費用は抑えられる。","多段抽出：市町村→地区→世帯のように段階を分けて抽出し、全国名簿を作る手間を省く。","層化抽出は全層から抽出し、集落抽出は一部の集落を丸ごと調べる点で発想が逆。大規模調査では層化多段抽出が多い。"],"s":[1,9]},{"n":"標本誤差と非標本誤差","p":["標本誤差は一部だけを調べることによる推定値のずれ。nを増やせば小さくなる。","標本誤差の大きさの目安は標準誤差。例：比率なら √(p(1−p)/n)。","非標本誤差は無回答・誤回答・集計ミス・名簿の不備などによる誤差。全数調査でも生じる。","非標本誤差はnを増やしても減らない。調査票の設計や回収率の向上で抑える。"],"s":[1,9,10]},{"n":"調査で生じるバイアス","p":["選択バイアス：標本の選ばれ方が母集団を代表しない（例：ネット調査はネット利用者に偏る）。","自己選択バイアス：自発的な応募者だけの回答（視聴者投票など）は関心の強い層に偏る。","無回答バイアス：回答しなかった人と回答者の特性が違うと、回収した結果が偏る。","回答バイアス：質問の言い回しや誘導、社会的に望ましい答えへの傾きで回答が歪む。","カバレッジの偏り：抽出枠が母集団全体を覆っていない（例：固定電話の名簿）と、漏れた層が欠ける。"],"s":[1]},{"n":"観察研究と実験研究","p":["実験研究は研究者が処理（介入）を割り付ける。観察研究は介入せず、既にある状態を観察・記録する。","処理を無作為に割り付けた実験では、群間の差を処理の因果効果と解釈しやすい。","観察研究は交絡の影響を受けやすく、関連があっても因果とは言えない。実験が倫理的に無理な場合に使う。","観察研究にはコホート研究（要因→結果を追跡）、症例対照研究（結果から過去の要因をみる）、横断研究がある。"],"s":[1,2]},{"n":"無作為化と交絡","p":["交絡因子は処理と結果の両方に関係する第3の変数。群間で偏ると処理の効果と区別できない。","処理を無作為に割り付けると、既知・未知の交絡因子が平均的に群間で均等になる。","ランダム化比較試験（RCT）は因果効果を推定する標準的な方法である。","観察研究では層別・回帰による調整・マッチングで既知の交絡に対処するが、未知の交絡は残る。","無作為抽出は標本の代表性（一般化）、無作為割付けは群の比較可能性（因果推論）のためで、目的が違う。"],"s":[1]}]},{"u":"確率とベイズの定理","items":[{"n":"事象と確率の基本","p":["標本空間Ωの部分集合を事象という。0≦P(A)≦1、P(Ω)＝1。","同様に確からしい場合 P(A)＝Aの場合の数÷全体の場合の数。","余事象 P(Aᶜ)＝1−P(A)。「少なくとも1回」は余事象を使うと計算しやすい。","例：サイコロを3回投げて少なくとも1回6が出る確率は 1−(5/6)³＝91/216≒0.42。"],"s":[1,11]},{"n":"場合の数（順列・組合せ）","p":["順列 nPr＝n!/(n−r)!、組合せ nCr＝n!/(r!(n−r)!)。","例：5人から3人を選ぶ組合せは10通り、選んで1列に並べる順列は60通り。","重複を許してn種類からr回選んで並べる方法は n^r 通り。","nCr＝nC(n−r)。組合せは二項分布・超幾何分布の確率の計算に現れる。"],"s":[11,12]},{"n":"加法定理","p":["加法定理：P(A∪B)＝P(A)＋P(B)−P(A∩B)。","A と B が排反（A∩B＝∅）なら P(A∪B)＝P(A)＋P(B)。","3事象では P(A∪B∪C)＝ΣP(A)−ΣP(A∩B)＋P(A∩B∩C)。","例：トランプ52枚からハートまたは絵札を引く確率は 13/52＋12/52−3/52＝22/52。"],"s":[1]},{"n":"条件付き確率と乗法定理","p":["条件付き確率 P(B|A)＝P(A∩B)/P(A)（P(A)＞0）。Aが起きたもとでBが起こる確率。","乗法定理：P(A∩B)＝P(A)P(B|A)＝P(B)P(A|B)。","例：10本中3本当たりのくじを戻さずに2本引き、2本とも当たる確率は 3/10×2/9＝1/15。","P(B|A) と P(A|B) は一般に異なる。両者の取り違えは典型的な誤り（検察官の誤謬）。"],"s":[1,2]},{"n":"事象の独立","p":["A と B が独立 ⇔ P(A∩B)＝P(A)P(B) ⇔ P(B|A)＝P(B)。","排反と独立は別の概念。P(A)＞0、P(B)＞0 の排反事象は独立にならない。","独立試行とは各回の結果が互いに影響しない試行（硬貨投げ、復元抽出など）。","3事象の独立には、2つずつの独立に加えて P(A∩B∩C)＝P(A)P(B)P(C) も必要である。"],"s":[1,2]},{"n":"全確率の公式とベイズの定理","p":["B₁,…,B_k が互いに排反で全体を覆うとき、全確率の公式 P(A)＝Σ P(Bᵢ)P(A|Bᵢ)。","ベイズの定理：P(Bᵢ|A)＝P(Bᵢ)P(A|Bᵢ)/Σⱼ P(Bⱼ)P(A|Bⱼ)。結果から原因の確率を逆算する。","P(Bᵢ) を事前確率、P(Bᵢ|A) を事後確率と呼ぶ。","例：工場A・Bが60%・40%を生産し不良率2%・5%。不良品がA製である確率は 0.012/0.032＝0.375。"],"s":[1,11]},{"n":"ベイズの定理と検査の的中率","p":["感度＝P(陽性|病気)、特異度＝P(陰性|健康)、陽性的中率＝P(病気|陽性)。","例：有病率1%・感度90%・特異度95%の検査で陽性なら、病気である確率は約15%にとどまる。","計算：0.01×0.9＝0.009、0.99×0.05＝0.0495、0.009÷(0.009＋0.0495)≒0.154。","有病率（事前確率）が低いと、精度の高い検査でも陽性的中率は低い。基準率の無視に注意する。"],"s":[1,11]},{"n":"ベイズ統計の入口","p":["ベイズ統計は母数を確率分布で表し、事後分布∝尤度×事前分布 として観測データで更新する。","例：成功確率θの事前分布を一様分布（ベータ(1,1)）とし、n回中x回成功なら事後分布はベータ(x＋1, n−x＋1)。","ベータ(a,b)の平均は a/(a＋b)。例：10回中7回成功なら事後平均は 8/12≒0.67。","事後分布から作る信用区間は「θがこの区間にある確率95%」と読める。頻度論の信頼区間はこう読めない。","得られた事後分布は、次のデータに対する事前分布として逐次更新に使える。"]}]},{"u":"確率変数と期待値・分散","items":[{"n":"離散型と連続型の確率変数","p":["離散型は確率関数 P(X＝x) で分布を表し、ΣP(X＝x)＝1。","連続型は確率密度関数 f(x) で表し、P(a≦X≦b)＝∫ₐᵇ f(x)dx、全体の積分は1。1点の確率は0。","累積分布関数 F(x)＝P(X≦x) は単調非減少で0から1へ。連続型では F′(x)＝f(x)。","密度 f(x) の値そのものは確率ではなく、1を超えることもある。"],"s":[1,11]},{"n":"期待値の定義と性質","p":["期待値：離散なら E(X)＝Σ x P(X＝x)、連続なら E(X)＝∫ x f(x)dx。","E(aX＋b)＝aE(X)＋b。E(X＋Y)＝E(X)＋E(Y) は独立でなくても成り立つ。","X と Y が独立なら E(XY)＝E(X)E(Y)。","例：サイコロの目の期待値は (1＋2＋…＋6)/6＝3.5。"],"s":[1,11]},{"n":"分散の定義と性質","p":["V(X)＝E[(X−μ)²]＝E(X²)−{E(X)}²。","V(aX＋b)＝a²V(X)、標準偏差は |a| 倍。定数bは分散に影響しない。","例：サイコロの目は E(X²)＝91/6 なので V(X)＝91/6−3.5²＝35/12≒2.92。","Z＝(X−μ)/σ と標準化すると E(Z)＝0、V(Z)＝1。"],"s":[1,11]},{"n":"同時分布と共分散","p":["同時確率 P(X＝x, Y＝y) を一方の変数について足し合わせると、他方の周辺分布が得られる。","独立 ⇔ すべての x, y で P(X＝x, Y＝y)＝P(X＝x)P(Y＝y)。","Cov(X,Y)＝E[(X−μ_X)(Y−μ_Y)]＝E(XY)−E(X)E(Y)。相関係数 ρ＝Cov(X,Y)/(σ_X σ_Y)。","独立なら共分散0だが逆は成り立たない。例：Xが−1,0,1を等確率でとり Y＝X² なら Cov＝0 だが従属。","2変量正規分布に従う X, Y では、無相関（ρ＝0）と独立が同値になる。"],"s":[1,11]},{"n":"確率変数の和・差の分散","p":["V(X±Y)＝V(X)＋V(Y)±2Cov(X,Y)。V(aX＋bY)＝a²V(X)＋b²V(Y)＋2abCov(X,Y)。","独立なら V(X＋Y)＝V(X−Y)＝V(X)＋V(Y)。差をとっても分散は足し算になる。","例：独立な X, Y の分散が4と9なら、X−Y の標準偏差は √13≒3.6。","独立同分布のn個の和の分散は nσ²、その平均の分散は σ²/n。"],"s":[1]},{"n":"チェビシェフの不等式","p":["平均μ・標準偏差σをもつ任意の分布で P(|X−μ|≧kσ)≦1/k²（k＞0）。","例：k＝2 なら平均±2σの外側にある確率は25%以下。正規分布なら実際は約4.6%。","分布の形を仮定しない代わりに評価は粗い。","標本平均に適用すると大数の弱法則が導かれる。"],"s":[1]}]},{"u":"主要な確率分布","items":[{"n":"ベルヌーイ分布と二項分布","p":["成功確率pのベルヌーイ試行1回の X∈{0,1} は E(X)＝p、V(X)＝p(1−p)。","二項分布 B(n,p)：P(X＝k)＝nCk p^k (1−p)^(n−k)（k＝0,…,n）。独立なn回の試行の成功回数。","E(X)＝np、V(X)＝np(1−p)。","例：硬貨を10回投げて表がちょうど3回の確率は 10C3/2¹⁰＝120/1024≒0.117。","成功確率が同じ独立な B(n₁,p) と B(n₂,p) の和は B(n₁＋n₂,p)（再生性）。"],"s":[1,2]},{"n":"ポアソン分布","p":["P(X＝k)＝e^(−λ) λ^k/k!（k＝0,1,2,…）。E(X)＝V(X)＝λ。","一定の時間・範囲でまれに起こる事象の回数（来客数・事故件数など）のモデルである。","二項分布で n が大きく p が小さく np＝λ が一定のときの極限として得られる（ポアソン近似）。","例：λ＝2 のとき、1回も起こらない確率は P(X＝0)＝e⁻²≒0.135。","独立な Po(λ₁) と Po(λ₂) の和は Po(λ₁＋λ₂) に従う。"],"s":[1]},{"n":"幾何分布と負の二項分布","p":["幾何分布：初めて成功するまでの試行回数Xで P(X＝k)＝(1−p)^(k−1) p、E(X)＝1/p、V(X)＝(1−p)/p²。","失敗回数で定義する流儀もあり、その場合は平均が (1−p)/p になる（分散は同じ）。","例：サイコロで初めて1が出るまでの回数の期待値は 1/(1/6)＝6回。","無記憶性：P(X＞s＋t | X＞s)＝P(X＞t)。離散分布でこの性質をもつのは幾何分布である。","負の二項分布：r回成功するまでの失敗回数。平均 r(1−p)/p、分散 r(1−p)/p²。"],"s":[1]},{"n":"超幾何分布","p":["N個中M個が当たりの集団から非復元でn個取り出すときの当たり数X：P(X＝k)＝MCk·(N−M)C(n−k)/NCn。","E(X)＝nM/N。p＝M/N とおけば二項分布と同じ np。","V(X)＝np(1−p)(N−n)/(N−1)。二項分布の分散に有限母集団修正がかかった形である。","N がnより十分大きければ二項分布 B(n, M/N) で近似できる。"],"s":[1]},{"n":"一様分布","p":["連続一様分布 U(a,b) の密度は f(x)＝1/(b−a)（a≦x≦b）。","E(X)＝(a＋b)/2、V(X)＝(b−a)²/12。例：U(0,1) は平均1/2、分散1/12。","P(c≦X≦d)＝(d−c)/(b−a) で、区間の長さに比例する。","離散一様分布（1〜nの整数を等確率）は E＝(n＋1)/2、V＝(n²−1)/12。n＝6 なら 35/12。"],"s":[1,11]},{"n":"指数分布","p":["密度 f(x)＝λe^(−λx)（x≧0）。E(X)＝1/λ、V(X)＝1/λ²。","累積分布関数 F(x)＝1−e^(−λx)、したがって P(X＞x)＝e^(−λx)。","単位時間あたり平均λ回起こるランダムな事象（ポアソン過程）の待ち時間・間隔の分布である。","例：平均10分間隔（λ＝0.1）のとき、20分以上待つ確率は e⁻²≒0.135。","無記憶性 P(X＞s＋t | X＞s)＝P(X＞t) をもつ。故障率が時間によらず一定の寿命モデル。"],"s":[1]},{"n":"正規分布","p":["N(μ,σ²) の密度は f(x)＝(1/√(2πσ²)) exp(−(x−μ)²/(2σ²))。μを中心に左右対称なベル型。","μ±σ に約68.3%、μ±1.96σ に95%、μ±2σ に約95.4%、μ±3σ に約99.7% が含まれる。","X〜N(μ,σ²) なら aX＋b〜N(aμ＋b, a²σ²)。独立な正規確率変数の和も正規分布（再生性）。","標準化 Z＝(X−μ)/σ は標準正規分布 N(0,1) に従う。"],"s":[1,11]},{"n":"標準正規分布表の使い方","p":["数値表には上側確率 P(Z≧z) を与えるものと累積確率 Φ(z) を与えるものがあり、まずどちらかを確認する。","主な上側確率点：5%→1.645、2.5%→1.96、1%→2.326、0.5%→2.576。","対称性 P(Z≦−z)＝P(Z≧z) を使い、下側確率や両側確率を求める。","例：N(50,10²) で70以上の確率は z＝(70−50)/10＝2 より約0.0228。"],"s":[0,1]},{"n":"二項分布の正規近似と連続修正","p":["n が大きいとき B(n,p) は N(np, np(1−p)) で近似できる。目安は np と n(1−p) がともに5以上程度。","連続修正：P(X≦k) は正規分布の P(Y≦k＋0.5)、P(X≧k) は P(Y≧k−0.5) で近似する。","例：B(100, 0.5) で P(X≦55) は (55.5−50)/5＝1.1 より約0.864（正確な値もほぼ0.864）。","標本比率 p̂＝X/n は近似的に N(p, p(1−p)/n) に従う。"],"s":[1,2]}]},{"u":"標本分布と極限定理","items":[{"n":"標本平均の分布と標準誤差","p":["母平均μ・母分散σ²の母集団からの無作為標本n個について E(X̄)＝μ、V(X̄)＝σ²/n。","標準誤差 SE＝σ/√n。σが未知なら不偏標準偏差sで代用して s/√n とする。","SEを半分にするには標本サイズを4倍にする必要がある。","母集団が正規分布なら、nによらず X̄〜N(μ, σ²/n) が厳密に成り立つ。","標準偏差は個々の値のばらつき、標準誤差は推定値（X̄）のばらつきで、別の量である。"],"s":[1,10]},{"n":"有限母集団修正","p":["大きさNの有限母集団から非復元抽出すると V(X̄)＝(σ²/n)·(N−n)/(N−1)。","(N−n)/(N−1) を有限母集団修正という。抽出率 n/N が小さければほぼ1で無視できる。","例：N＝1000、n＝100 なら 900/999≒0.90 で、分散は復元抽出の約9割になる。","全数調査（n＝N）では修正項が0となり、標本平均の分散は0になる。"],"s":[1]},{"n":"大数の法則","p":["独立同分布の標本平均 X̄ は、n→∞ で母平均μに確率収束する（大数の弱法則）。","例：硬貨投げで表の相対頻度は、投げる回数を増やすと0.5に近づく。","短期の偏りが後で「埋め合わされる」わけではない。そう考えるのはギャンブラーの誤謬である。","推定量の一致性の根拠となる。チェビシェフの不等式から導ける。"],"s":[1,12]},{"n":"中心極限定理","p":["分散が有限なら母集団の分布によらず、nが大きいと X̄ は近似的に N(μ, σ²/n) に従う。","標準化した (X̄−μ)/(σ/√n) は近似的に N(0,1)。和 ΣXᵢ は近似的に N(nμ, nσ²)。","二項分布の正規近似は、ベルヌーイ確率変数の和に中心極限定理を適用した特別な場合である。","母集団分布の歪みが大きいほど、正規近似が良くなるのに大きなnが必要になる。"],"s":[1,12]},{"n":"χ²分布","p":["独立な標準正規変数 Z₁,…,Z_k の2乗和は自由度kのχ²分布に従う。平均k、分散2k。","正規母集団からの標本では (n−1)s²/σ²〜χ²(n−1)（s²は不偏分散）。","値は0以上で右に裾が長い。自由度が大きくなると正規分布に近づく。","上側5%点：自由度1で3.84、自由度2で5.99、自由度5で11.07。"],"s":[1]},{"n":"t分布","p":["Z〜N(0,1) と W〜χ²(k) が独立なら T＝Z/√(W/k) は自由度kのt分布に従う。","正規母集団からの標本では (X̄−μ)/(s/√n)〜t(n−1)。σの代わりにsを使うとt分布になる。","0を中心に左右対称で、正規分布より裾が重い。自由度→∞で標準正規分布に近づく。","上側2.5%点：t(9)＝2.262、t(15)＝2.131、t(29)＝2.045（正規分布では1.96）。"],"s":[1,10]},{"n":"F分布","p":["独立な U〜χ²(m)、V〜χ²(n) について F＝(U/m)/(V/n) は自由度(m,n)のF分布に従う。","正規2母集団からの標本では (s₁²/σ₁²)/(s₂²/σ₂²)〜F(n₁−1, n₂−1)。","下側点は上側点の逆数で求める：F_{1−α}(m,n)＝1/F_α(n,m)。","T〜t(k) なら T²〜F(1,k)。分散分析・回帰の検定や等分散の検定に使う。"],"s":[1]}]},{"u":"推定","items":[{"n":"点推定と推定量の性質","p":["推定量は標本の関数で確率変数、推定値はデータを代入して得た具体的な数値である。","不偏性：E(θ̂)＝θ。例：標本平均 X̄ は母平均μの不偏推定量。","一致性：n→∞ で θ̂ が真の値θに確率収束する。","有効性：不偏推定量どうしでは分散が小さいほうが良い。平均二乗誤差 MSE＝分散＋(バイアス)²。"],"s":[1,12]},{"n":"不偏分散","p":["不偏分散 s²＝Σ(xᵢ−x̄)²/(n−1) は E(s²)＝σ² を満たす。","nで割った標本分散の期待値は (n−1)σ²/n で、母分散を過小評価する。","n−1で割るのは、μの代わりに x̄ を使ったことで自由度が1減るためである。","s² は σ² の不偏推定量だが、その平方根 s は σ の不偏推定量ではない（やや小さめ）。","例：2, 4, 6 の不偏分散は 8/2＝4（nで割ると8/3）。"],"s":[1,10]},{"n":"信頼区間の考え方","p":["信頼係数95%の区間：同じ方法で標本抽出と区間作成を繰り返すと、約95%の区間が真の母数を含む。","母数は定数なので、作った1つの区間について「母数が95%の確率で入る」とは解釈しない。","一般形は 推定値±臨界値×標準誤差。信頼係数を上げると幅は広がり、nを増やすと幅は 1/√n に比例して狭まる。","大標本なら母集団が正規分布でなくても、中心極限定理により近似的な区間が作れる。"],"s":[1,10]},{"n":"母平均の区間推定（σ既知）","p":["正規母集団・σ既知：x̄±z_{α/2}·σ/√n。95%なら x̄±1.96σ/√n。","例：n＝25、x̄＝50、σ＝10 なら 50±1.96×2 で [46.08, 53.92]。","90%なら1.645、99%なら2.576 を使う。","誤差（半幅）をe以下にする標本サイズは n≧(z_{α/2}σ/e)²。"],"s":[1,10,11]},{"n":"母平均の区間推定（σ未知）","p":["正規母集団・σ未知：x̄±t_{α/2}(n−1)·s/√n（sは不偏標準偏差）。","例：n＝10、x̄＝20、s＝3 なら 20±2.262×3/√10＝20±2.15。","t分布の臨界値はzより大きいため、小標本ほど区間が広くなる。nが大きければ t≒z。"],"s":[1,10,11]},{"n":"母比率の区間推定と標本サイズ","p":["大標本での母比率の信頼区間：p̂±z_{α/2}√(p̂(1−p̂)/n)。","例：n＝400、p̂＝0.3 なら 0.3±1.96×√(0.21/400)≒0.3±0.045。","誤差をe以下にする標本サイズは n≧(z_{α/2}/e)²·p(1−p)。pが不明なら最大となる p＝0.5 を使う。","例：95%で誤差±3%以内なら (1.96/0.03)²×0.25≒1067.1 より1068人以上が必要。"],"s":[1,11]},{"n":"母分散の区間推定","p":["正規母集団：[(n−1)s²/χ²_{α/2}(n−1), (n−1)s²/χ²_{1−α/2}(n−1)]（χ²_αは上側α点）。","大きいほうのχ²点で割った値が下限になる。χ²分布は非対称なので s² を中心とした対称な区間にはならない。","例：n＝10、s²＝4 なら 36/19.02≒1.89 から 36/2.70≒13.3 まで。","母集団の正規性の仮定からのずれに弱い。"],"s":[1,11]},{"n":"母平均の差の区間推定","p":["分散既知：(x̄₁−x̄₂)±z_{α/2}√(σ₁²/n₁＋σ₂²/n₂)。","等分散を仮定：(x̄₁−x̄₂)±t_{α/2}(n₁＋n₂−2)·s_p√(1/n₁＋1/n₂)。","併合分散 s_p²＝((n₁−1)s₁²＋(n₂−1)s₂²)/(n₁＋n₂−2)。","等分散を仮定しないならウェルチの近似自由度を使う。対応のあるデータは差の1標本問題として扱う。"],"s":[1,11]},{"n":"比率の差・分散比・相関の区間推定","p":["母比率の差：(p̂₁−p̂₂)±z_{α/2}√(p̂₁(1−p̂₁)/n₁＋p̂₂(1−p̂₂)/n₂)。","母分散の比 σ₁²/σ₂²：下限 (s₁²/s₂²)/F_{α/2}(n₁−1,n₂−1)、上限 (s₁²/s₂²)·F_{α/2}(n₂−1,n₁−1)。","相関係数はフィッシャーのz変換 z＝(1/2)ln((1＋r)/(1−r)) を使う。zは近似的に分散 1/(n−3) の正規分布。","z±1.96/√(n−3) で区間を作り、逆変換（tanh）で r の尺度に戻す。"],"s":[1]}]},{"u":"仮説検定の考え方","items":[{"n":"帰無仮説と対立仮説","p":["帰無仮説H₀は「差がない・効果がない」など否定したい仮説、対立仮説H₁は示したい仮説である。","H₀を棄却できればH₁を採択する。棄却できなくてもH₀が正しいと証明されたわけではない。","仮説は母数についての主張（例：H₀：μ＝50）であり、標本統計量についての主張ではない。","仮説・有意水準・片側か両側かは、データを見る前に決めておく。"],"s":[1,10,12]},{"n":"検定の手順と棄却域","p":["手順：①仮説を立てる ②有意水準αを決める ③検定統計量を計算 ④棄却域またはp値で判定 ⑤結論。","有意水準αはH₀が正しいのに棄却してしまう確率の上限。慣例で5%や1%を使う。","棄却域はH₀のもとで検定統計量がとりにくい範囲（確率α）。両側5%のz検定なら |Z|≧1.96。","例：H₀：μ＝50、σ＝10、n＝25、x̄＝54 なら Z＝(54−50)/(10/√25)＝2.0 で、両側5%で棄却。"],"s":[1,10]},{"n":"p値","p":["p値：H₀が正しいと仮定したとき、観測値と同じかそれより極端な検定統計量が得られる確率。","p≦α ならH₀を棄却する。棄却域を使った判定と同じ結論になる。","例：両側検定で Z＝2.0 なら p＝2×0.0228≒0.046。","p値は「H₀が正しい確率」でも「結果が偶然だけで生じた確率」でもない。"],"s":[1,4,6]},{"n":"両側検定と片側検定","p":["両側検定（H₁：μ≠μ₀）は棄却域を両裾にα/2ずつ、片側検定（H₁：μ＞μ₀など）は片方の裾にαをとる。","有意水準5%の臨界値は、片側で1.645、両側で±1.96。","効果が予想した方向に出たとき、片側検定のp値は両側検定のp値の半分になる。","どちらを使うかは研究目的から事前に決める。結果を見てから片側に切り替えるのは不適切である。"],"s":[1,10]},{"n":"第1種の過誤と第2種の過誤","p":["第1種の過誤：H₀が真なのに棄却する誤り（偽陽性）。その確率が有意水準α。","第2種の過誤：H₀が偽なのに棄却しない誤り（偽陰性）。その確率をβと書く。","標本サイズが一定ならαを小さくするほどβは大きくなる（トレードオフ）。","裁判のたとえ：無実の人を有罪にするのが第1種、真犯人を無罪にするのが第2種の過誤。"],"s":[1,10,12]},{"n":"検出力","p":["検出力＝1−β。H₀が偽のとき正しくH₀を棄却できる確率である。","標本サイズ・真の効果・有意水準が大きいほど、母集団のばらつきσが小さいほど検出力は高い。","例：H₀：μ＝50、σ＝10、n＝25、片側5%。棄却域は x̄≧53.29、真のμ＝54なら検出力≒0.64。","研究計画の段階で、検出力80%などを目標に必要な標本サイズを決める。"],"s":[1]},{"n":"検定と信頼区間の関係","p":["両側有意水準αの検定で H₀：θ＝θ₀ が棄却されない ⇔ θ₀ が信頼係数1−αの信頼区間に含まれる。","例：μの95%信頼区間が [46.1, 53.9] なら、H₀：μ＝55 は5%で棄却、H₀：μ＝50 は棄却されない。","信頼区間は効果の大きさと不確かさも示すため、p値と合わせて報告するのが望ましい。"],"s":[1,5]}]},{"u":"各種の検定","items":[{"n":"母平均の検定（z・1標本t）","p":["σ既知：Z＝(x̄−μ₀)/(σ/√n) を標準正規分布と比べる。","σ未知：T＝(x̄−μ₀)/(s/√n) を自由度n−1のt分布と比べる（1標本t検定）。","例：n＝16、x̄＝52、s＝4、H₀：μ＝50 なら T＝2/(4/4)＝2.0 で、t₀.₀₂₅(15)＝2.131 未満なので両側5%で棄却できない。","前提は観測の独立性と母集団の正規性（小標本の場合）。大標本ならzで近似できる。"],"s":[1,10]},{"n":"2標本t検定（等分散）","p":["独立な2群で等分散を仮定：T＝(x̄₁−x̄₂)/(s_p√(1/n₁＋1/n₂))、自由度 n₁＋n₂−2。","併合分散 s_p²＝((n₁−1)s₁²＋(n₂−1)s₂²)/(n₁＋n₂−2)。","母分散が既知なら Z＝(x̄₁−x̄₂)/√(σ₁²/n₁＋σ₂²/n₂) を標準正規分布と比べる。","2群の比較は一元配置分散分析と同等で、F＝T² が成り立つ。"],"s":[1,11]},{"n":"ウェルチのt検定","p":["等分散を仮定しない2標本の検定：T＝(x̄₁−x̄₂)/√(s₁²/n₁＋s₂²/n₂)。","近似自由度 ν＝(s₁²/n₁＋s₂²/n₂)²/[(s₁²/n₁)²/(n₁−1)＋(s₂²/n₂)²/(n₂−1)]。","ν は整数とは限らず、min(n₁,n₂)−1 以上 n₁＋n₂−2 以下の値をとる。","等分散かどうか不明なとき、F検定の結果で手法を切り替えず最初からウェルチ検定を使う考え方も有力。"],"s":[1,11]},{"n":"対応のあるt検定","p":["同じ対象の前後比較など対になったデータは、差 dᵢ＝xᵢ−yᵢ を1つの標本として扱う。","T＝d̄/(s_d/√n)、自由度 n−1（nはペアの数）。","例：差が 1,2,3,2,2 なら d̄＝2、s_d＝√0.5、T≒6.32 で t₀.₀₂₅(4)＝2.776 を超え有意。","対応を無視して独立2標本の検定をすると、個体差が誤差に入り検出力が下がる。"],"s":[1,11]},{"n":"母比率の検定","p":["H₀：p＝p₀ の検定統計量 Z＝(p̂−p₀)/√(p₀(1−p₀)/n)。分母にはH₀の値p₀を使う。","例：100回中60回表、H₀：p＝0.5 なら Z＝0.1/0.05＝2.0 で、両側5%で棄却。","正規近似は np₀ と n(1−p₀) が十分大きいときに使う。小標本では二項分布の確率を直接計算する。"],"s":[1]},{"n":"母比率の差の検定","p":["H₀：p₁＝p₂ のもとで併合比率 p̂＝(x₁＋x₂)/(n₁＋n₂) を計算する。","Z＝(p̂₁−p̂₂)/√(p̂(1−p̂)(1/n₁＋1/n₂))。","区間推定では併合せず、各群の比率で標準誤差を計算する点が検定と異なる。","2×2分割表の連続修正なしのχ²独立性検定と同等で、χ²＝Z² が成り立つ。"],"s":[1]},{"n":"母分散の検定（χ²検定）","p":["正規母集団で H₀：σ²＝σ₀²：χ²＝(n−1)s²/σ₀² を自由度n−1のχ²分布と比べる。","両側検定では上側α/2点と下側α/2点（上側1−α/2点）の両方を棄却の境界に使う。","例：n＝10、s²＝8、σ₀²＝4 なら χ²＝18.0。上側2.5%点19.02未満で両側5%では棄却されない。","正規性の仮定からのずれに敏感である。"],"s":[1,11]},{"n":"等分散のF検定","p":["H₀：σ₁²＝σ₂²：F＝s₁²/s₂² を自由度(n₁−1, n₂−1)のF分布と比べる。","大きいほうの不偏分散を分子にすると、両側検定は上側α/2点との比較だけで済む。","例：n₁＝n₂＝10 で両側5%なら、F₀.₀₂₅(9,9)≒4.03 を超えると等分散を棄却する。","分散分析のF検定（平均の比較）とは目的が違う。正規性からのずれに敏感である。"],"s":[1,11]},{"n":"χ²適合度検定","p":["観測度数Oᵢと理論上の期待度数Eᵢから χ²＝Σ(Oᵢ−Eᵢ)²/Eᵢ を計算する。","自由度はカテゴリ数k−1。母数をm個データから推定したときは k−1−m。","例：サイコロを60回投げると各目の期待度数は10。χ²が χ²₀.₀₅(5)＝11.07 を超えれば一様でないと判断。","期待度数が小さい（目安5未満）カテゴリは隣と併合してから検定する。"],"s":[1,12]},{"n":"χ²独立性検定","p":["r×c分割表で期待度数 Eᵢⱼ＝行和×列和÷総数、χ²＝Σ(O−E)²/E を計算する。","自由度は (r−1)(c−1)。2×2表なら1で、5%の臨界値は3.84。","2×2表では χ²＝n(ad−bc)²/((a＋b)(c＋d)(a＋c)(b＋d)) で直接計算できる。","例：a＝30、b＝20、c＝20、d＝30 なら期待度数はすべて25で χ²＝4.0。3.84を超えるので独立性を棄却。","イェーツの連続修正では |ad−bc| から n/2 を引いて計算する。期待度数が小さいときに使われる。"],"s":[1,12]}]},{"u":"回帰分析","items":[{"n":"単回帰と最小二乗法","p":["モデル yᵢ＝β₀＋β₁xᵢ＋εᵢ。残差平方和 Σ(yᵢ−ŷᵢ)² を最小にする係数を求める（最小二乗法）。","傾き b₁＝s_xy/s_x²＝r·s_y/s_x、切片 b₀＝ȳ−b₁x̄。","回帰直線は必ず平均点 (x̄, ȳ) を通り、残差の和は0になる。","例：x̄＝5、ȳ＝20、s_xy＝6、s_x²＝2 なら b₁＝3、b₀＝5 で ŷ＝5＋3x。","yをxで回帰した直線と、xをyで回帰した直線は |r|＝1 のとき以外一致しない。"],"s":[1,2]},{"n":"回帰係数の解釈と予測","p":["傾き b₁ は、xが1単位増えたときのyの予測値の平均的な変化量である。","切片は x＝0 のときの予測値。x＝0 がデータの範囲外なら実質的な意味をもたないことがある。","データの範囲外への予測（外挿）は信頼性が低い。","観察データの回帰係数は関連の大きさを示すもので、因果効果とは限らない。","log y をxで回帰すると、係数bが小さいとき「xが1増えるとyが約100b%変化」と読める。"],"s":[1,12]},{"n":"変動の分解と決定係数","p":["総平方和 S_T＝Σ(yᵢ−ȳ)² は回帰平方和 S_R＝Σ(ŷᵢ−ȳ)² と残差平方和 S_E＝Σ(yᵢ−ŷᵢ)² の和に分かれる。","決定係数 R²＝S_R/S_T＝1−S_E/S_T。yの変動のうち回帰で説明できる割合で0〜1の値をとる。","単回帰では R²＝r²。例：r＝0.8 なら R²＝0.64。","R² が高くても、因果関係やモデルの正しさが保証されるわけではない。"],"s":[1]},{"n":"回帰係数の検定と区間推定","p":["単回帰の誤差分散の推定値 s²＝S_E/(n−2)。その平方根sを回帰の標準誤差という。","傾きの標準誤差 SE(b₁)＝s/√Σ(xᵢ−x̄)²。","H₀：β₁＝0 の検定は t＝b₁/SE(b₁) を自由度n−2のt分布と比べる。ソフトが出力するt値・p値はこれ。","β₁の信頼区間は b₁±t_{α/2}(n−2)·SE(b₁)。重回帰では自由度が n−p−1（pは説明変数の数）。","単回帰では傾きのt値の2乗が分散分析表のF値に等しい。"],"s":[1,12]},{"n":"残差分析（回帰診断）","p":["誤差の仮定：独立、平均0、等分散、推測を行うときは正規分布。","残差を予測値やxに対してプロットし、曲線状のパターン（非線形）や扇形の広がり（不等分散）がないか見る。","残差の正規性は正規Q-Qプロットで確認する。点が直線上に並べば正規分布に近い。","時系列データでは残差の自己相関を確認する。外れ値や影響力の大きい点は係数を大きく動かす。"],"s":[1]},{"n":"重回帰と偏回帰係数","p":["モデル y＝β₀＋β₁x₁＋…＋β_p x_p＋ε を最小二乗法で推定する。","偏回帰係数 bⱼ は、他の説明変数を一定に保ったまま xⱼ が1単位増えたときのyの変化を表す。","説明変数どうしに相関があると、単回帰の係数と重回帰の偏回帰係数は値や符号まで変わりうる。","単位の違う変数の係数は大きさを比べられない。比べるなら標準化偏回帰係数を使う。"],"s":[1,12]},{"n":"自由度調整済み決定係数とF検定","p":["R² は説明変数を追加すると減ることがない。そのため変数の取捨選択の基準には向かない。","自由度調整済み決定係数 R̄²＝1−{S_E/(n−p−1)}/{S_T/(n−1)}。R² 以下で、負になることもある。","回帰全体の検定（H₀：β₁＝…＝β_p＝0）：F＝(S_R/p)/(S_E/(n−p−1))、自由度(p, n−p−1)。","ソフトの出力では係数表（推定値・標準誤差・t値・p値）、R²、R̄²、F値を対応づけて読む。"],"s":[1,12]},{"n":"多重共線性","p":["説明変数どうしの相関が強いと、係数の標準誤差が大きくなり推定が不安定になる。","症状：全体のF検定やR²は高いのに個々のt検定が有意にならない、係数の符号が予想と逆になる。","診断指標 VIFⱼ＝1/(1−Rⱼ²)（Rⱼ²は xⱼ を他の説明変数で回帰した決定係数）。10超が目安とされる。","対処：相関の高い変数の一方を除く、変数をまとめて合成変数にする。"],"s":[1]},{"n":"ダミー変数","p":["質的変数を0/1の変数に置き換えて回帰式に入れる。例：男性＝0、女性＝1。","k個のカテゴリにはk−1個のダミー変数を使う。k個すべて入れると切片と完全な多重共線性になる。","ダミー変数の係数は、他の変数を一定としたときの基準カテゴリとの平均的な差を表す。","ダミー変数と量的変数の積（交互作用項）を加えると、グループごとの傾きの違いも表せる。"],"s":[1]}]},{"u":"分散分析と実験計画","items":[{"n":"フィッシャーの3原則","p":["反復：同じ処理を複数回繰り返し、誤差の大きさを評価できるようにする。","無作為化：処理の割付けや実験の順序をランダムにし、系統的な偏りを偶然誤差に変える。","局所管理（ブロック化）：条件のそろったブロック内で処理を比べ、ブロック間の差を誤差から除く。","乱塊法は、各ブロック内で全処理を無作為な順に割り付ける計画で、3原則をすべて満たす。"],"s":[1]},{"n":"処理群・対照群と盲検化","p":["処理群（介入あり）を対照群（無処理・既存の処理・プラセボ）と比べて効果を測る。","効果のない偽薬でも改善が起こるプラセボ効果があるため、偽薬を与えた群と比較する。","二重盲検：被験者も評価者もどの群かを知らない状態で行い、期待による偏りを防ぐ。","対照群のない前後比較だけでは、自然な経過や平均への回帰と処理の効果を区別できない。"],"s":[1,2]},{"n":"一元配置分散分析の平方和分解","p":["k群・全体N個のデータで、総平方和 S_T＝群間平方和 S_A＋群内（残差）平方和 S_E。","S_A＝Σnᵢ(ȳᵢ−ȳ)²、S_E＝ΣΣ(yᵢⱼ−ȳᵢ)²（ȳᵢは第i群の平均、ȳは全体平均）。","自由度は群間 k−1、群内 N−k、全体 N−1 で、群間と群内の和が全体になる。","前提：各群は正規分布に従い分散が等しく、観測は互いに独立。"],"s":[1,11,12]},{"n":"一元配置の分散分析表とF検定","p":["平均平方 MS_A＝S_A/(k−1)、MS_E＝S_E/(N−k)。F＝MS_A/MS_E を F(k−1, N−k) と比べる。","H₀は「全群の母平均が等しい」。棄却されても、どの群の間に差があるかまではわからない。","例：k＝3、N＝15、S_A＝40、S_E＝60 なら F＝20/5＝4.0。F₀.₀₅(2,12)≒3.89 を超え有意。","MS_E は誤差分散σ²の推定値。2群なら等分散の2標本t検定と同じ結論になる（F＝t²）。"],"s":[1,11,12]},{"n":"二元配置分散分析と交互作用","p":["因子A（a水準）と因子B（b水準）の効果を同時に調べる。","繰り返しなし：S_T＝S_A＋S_B＋S_E、自由度は a−1、b−1、(a−1)(b−1)。乱塊法の解析と同じ形。","繰り返しあり（各セルr回）：交互作用 S_AB（自由度(a−1)(b−1)）を分離でき、誤差の自由度は ab(r−1)。","交互作用は一方の因子の効果が他方の水準で変わること。水準ごとの平均を結んだ線が平行でなければ疑う。"],"s":[1,11]},{"n":"多重比較","p":["3群以上で2群ずつ5%のt検定を繰り返すと、全体で1回以上誤って棄却する確率が5%を超える。","独立なm回の検定で第1種の過誤が少なくとも1回起こる確率は 1−(1−α)^m。α＝0.05、m＝3 で約14%。","ボンフェローニ法：各検定の有意水準を α/m にする。簡単だが保守的（検出力が下がる）。","全ペアの比較にはテューキー法、対照群との比較にはダネット法などの専用の方法がある。"],"s":[11]}]},{"u":"統計の誤用と注意点","items":[{"n":"p値のよくある誤解","p":["誤：p値は帰無仮説が正しい確率。正：H₀が正しいと仮定したとき、観測以上に極端な結果が出る確率。","誤：p＝0.04 は「結果が偶然である確率が4%」。p値は仮説の真偽の確率を与えない。","p＞0.05 は「効果がない」ことの証明ではない。検出力不足で差を見逃しているだけかもしれない。","p値が小さくても効果が大きいとは限らない。nが非常に大きければ、ごく小さな差でもpは小さくなる。","p＝0.049 と p＝0.051 の間に本質的な違いはない。閾値の前後で結論を白黒に分けない。"],"s":[4,5,6]},{"n":"ASA声明（2016）の6原則","p":["2016年3月、米国統計学会（ASA）がp値と統計的有意性に関する声明を公表（Wasserstein & Lazar）。","原則1・2：p値はデータと特定の統計モデルとの不整合の程度を示しうるが、仮説が真である確率は測らない。","原則3・4：科学的結論や意思決定をp値が閾値を超えたかだけで決めない。適切な推論には完全な報告と透明性が要る。","原則5・6：p値や有意性は効果の大きさや結果の重要性を測らない。p値だけでは仮説の証拠として不十分。","背景には、p値の誤用・誤解が広がり、研究結果の再現性の危機の一因と指摘されたことがある。"],"s":[4,5,7,8]},{"n":"p-hackingと出版バイアス","p":["p-hacking：有意になるまで分析方法・変数・外れ値処理・部分集団を変えたり、データを追加したりすること。","有意な結果だけを選んで報告すると、報告されたp値は解釈できなくなる（ASA声明の原則4）。","出版バイアス：有意な結果ほど論文になりやすく、文献全体で効果が過大評価される。","例：本当は効果のない20個の仮説を5%で検定すると、平均1個は偶然に有意になる。","対策：解析計画の事前登録、実施した全分析の報告、多重比較の調整、追試による確認。"],"s":[8,4]},{"n":"シンプソンのパラドックス","p":["層ごとに見ると同じ傾向なのに、層を合算すると傾向が逆転する現象である。","原因：層（交絡因子）によって処理群の構成比と成功率の水準が大きく違うこと。","仮想例：薬Aは軽症19/20・重症40/80、薬Bは軽症72/80・重症8/20。両層でAが上だが合計はA59%、B80%。","上の例ではAに重症者が偏っている。どちらの集計を採るかは、因果の構造を考えて判断する。"],"s":[1]},{"n":"疑似相関と因果の誤認","p":["相関の背後には、偶然、逆の因果、第3の変数による擬相関、選択による相関などの可能性がある。","例：小学生の靴のサイズと読解力の相関は、学年（年齢）という共通の要因で生じる。","トレンドをもつ2つの時系列は、無関係でも高い相関を示しやすい。","集団単位の相関をそのまま個人に当てはめる誤りを生態学的誤謬という。","因果の判断には、無作為化実験、時間的な順序、用量反応関係、他の説明の排除などを総合する。"],"s":[1,2]},{"n":"生存者バイアス","p":["選抜や脱落を経て「残った」対象だけを分析することで生じる偏りで、選択バイアスの一種である。","例：成功した企業だけを調べて共通点を成功要因とみなすと、同じ特徴をもつ失敗企業を見落とす。","例：帰還した戦闘機の被弾箇所だけで補強箇所を決めると、撃墜された機体の致命的な被弾箇所を見落とす。","例：現存する投資信託だけの平均成績は、成績不振で償還されたファンドが除かれて過大になる。","対策：分析対象がどのように選ばれたかを確認し、脱落・失敗した対象も含むデータを集める。"],"s":[1]}]}]},{"id":"phil","name":"哲学・倫理学","full":"哲学・倫理学（西洋・東洋・日本の思想史と主要分野）","group":"教養・専門","desc":"存在・知識・善と正義を問う思想の歴史と、分野別の主要な論点","asOf":"2026年11月7日時点：Stanford Encyclopedia of Philosophy各項目の公開版の記述に基づく","aliases":["哲学","倫理学","倫理","西洋哲学","思想史"],"sources":[{"t":"Stanford Encyclopedia of Philosophy 目次（以下に挙げない各項目を含む）","u":"https://plato.stanford.edu/contents.html"},{"t":"SEP「Presocratic Philosophy」","u":"https://plato.stanford.edu/archives/sum2021/entries/presocratics/"},{"t":"SEP「Socrates」","u":"https://plato.stanford.edu/entries/socrates/"},{"t":"SEP「Aristotle」","u":"https://plato.stanford.edu/entries/aristotle/"},{"t":"SEP「Rationalism vs. Empiricism」","u":"https://plato.stanford.edu/entries/rationalism-empiricism/"},{"t":"SEP「Immanuel Kant」","u":"https://plato.stanford.edu/entries/kant/"},{"t":"SEP「David Hume」","u":"https://plato.stanford.edu/archives/win2023/entries/hume/"},{"t":"SEP「Existentialism」","u":"https://plato.stanford.edu/entries/existentialism/"},{"t":"SEP「Friedrich Nietzsche」","u":"https://plato.stanford.edu/entries/nietzsche/"},{"t":"SEP「The Analytic/Synthetic Distinction」","u":"https://plato.stanford.edu/entries/analytic-synthetic/"},{"t":"SEP「John Rawls」","u":"https://plato.stanford.edu/entries/rawls/"},{"t":"SEP「Consequentialism」","u":"https://plato.stanford.edu/entries/consequentialism/"},{"t":"SEP「Aristotle's Logic」","u":"https://plato.stanford.edu/entries/aristotle-logic/"},{"t":"SEP「Japanese Confucian Philosophy」","u":"https://plato.stanford.edu/entries/japanese-confucian/"},{"t":"SEP「Epistemology」","u":"https://plato.stanford.edu/entries/epistemology/"}],"units":[{"u":"古代ギリシア：自然哲学からプラトン","items":[{"n":"ミレトス学派とアルケー","p":["タレスは前6世紀初め頃に活動し、万物の根源（アルケー）を水とした。","タレスが前585年の日食を予言したという伝承があるが、史実ではない可能性が高いとされる。","アナクシマンドロスは根源を無限定なもの（ト・アペイロン）とし、そこから熱と冷などの対立物が生じるとした。","アナクシメネスは根源を空気とし、その濃縮と希薄化によってさまざまな事物が生じると説明した。"],"s":[1]},{"n":"ピュタゴラスとヘラクレイトス","p":["ピュタゴラスはサモス出身で、前6世紀最後の四半世紀に南イタリアのクロトンへ移った。","数によって秩序づけられた宇宙と魂の輪廻を説いたとされるが、数学的宇宙論を本人に帰すことには疑問がある。","クセノファネスはコロフォン出身で、虹を雲として説明するなど自然現象を神話によらず説明し、唯一の最も偉大な神を説いた。","ヘラクレイトスはエフェソスの人で前6世紀末〜前5世紀初めに活動し、万物は単一のロゴスに従うとし、秩序の原理を火で象徴した。","ヘラクレイトスは、対立物は争いと変化のうちで一つに結びつくと説いた。"],"s":[1]},{"n":"エレア派（パルメニデス・ゼノン）","p":["パルメニデスはエレアの人で前510年頃生まれ。あるものはあり、あらぬことはありえないと論じた。","知りうるのは「あるもの」だけであり、生成・変化・多数性は見かけにすぎないとした。","ゼノンは前490年頃生まれ。運動や多数性を認めると矛盾に陥ることを示す逆説（アキレスと亀など）を提示した。","サモスのメリッソス（前440年頃活動）は唯一・不変・無限の存在を主張し、空虚を否定した。"],"s":[1]},{"n":"多元論と原子論","p":["エンペドクレスは、土・水・空気・火の四つの根が愛と争いによって結合と分離を繰り返すとした。","アナクサゴラスは前5世紀半ばに著述し、万物は混合物であり、それとは別の知性（ヌース）が宇宙の回転を始めたとした。","レウキッポスとデモクリトスは、実在するのは原子（アトム）と空虚だけだとする原子論を説いた。","デモクリトスは前460年頃アブデラに生まれた。甘さなどの性質は約束事にすぎず、原子と空虚こそが実在だとした。"],"s":[1]},{"n":"ソフィストの時代","p":["ソフィストは報酬を受けて若者に弁論の技術を教えた職業的教師で、富と名声を得る者もいた。","プラトン『プロタゴラス』は、前433/2年頃にプロタゴラス、プロディコス、ヒッピアスが一堂に会する場面を描く。","前427年のゴルギアスのアテネ訪問は、弁論術の教育が流行するきっかけとなった。","ソクラテスは報酬を取らず、自分は教師ではないと主張した点でソフィストと区別される。"],"s":[2]},{"n":"ソクラテスの生涯と裁判","p":["ソクラテスは前469〜前399年。前399年5〜6月、不敬神と若者を堕落させた罪で告発され、死刑判決を受けた。","友人カイレフォンが受けたデルフォイの神託を機に、人々を吟味する使命を負ったと『弁明』で語る。","ダイモニオンは幼い頃から聞こえた内なる声で、行為を禁じる働きをした。良心と同じものではないとされる。","『クリトン』では脱獄を勧められても、不正をすることも不正に報復することも正しくないとして拒んだ。"],"s":[2]},{"n":"問答法とソクラテス問題","p":["勇気や魂のあり方を相手に問い、その答えを吟味する問答（エレンコス）を好んだ。","重要なことは何も知らないと称して相手に語らせながら議論の主導権を握る態度は、ソクラテスの皮肉（エイロネイア）と呼ばれる。","「吟味されない生は人間にとって生きるに値しない」（『弁明』38a）は彼の生き方を示す言葉である。","主な情報源はプラトン、クセノフォン、アリストファネス『雲』（前423年）で、描写が食い違う（ソクラテス問題）。"],"s":[2]},{"n":"プラトンのイデア論と想起説","p":["プラトンは前429?〜前347年。イデア（形相）は永遠・不変で、感覚的事物の範型となる存在とされる。","善・美・等しさなどがイデアの例で、なかでも善のイデアは容易に知りえない究極のものとされる。","『メノン』では、魂は生まれる前に知ったイデアを想起でき、学ぶとは想起することだとされる。奴隷の少年が幾何の答えに導かれる。","想起説は、知っていれば探究は不要、知らなければ探しようがないという探究のパラドクスへの応答である。","『パイドン』ではイデアは仮設と呼ばれ、後期の『パルメニデス』ではイデア論自体が批判的に検討される。"],"s":[0,4]},{"n":"『国家』と対話篇の時期区分","p":["対話篇を初期・中期・後期に分ける区分は広く用いられるが、論争のある仮説である。","初期には『クリトン』『エウテュプロン』『ゴルギアス』『プロタゴラス』など、中期には『パイドン』『饗宴』『国家』『パイドロス』が入る。","後期には『ソピステス』『政治家』『ティマイオス』『ピレボス』『法律』などが数えられ、主に文体上の特徴で区別される。","『国家』は魂を三つの部分に分け、各部分が自分の仕事を果たすことを魂における正義と定義する。","『国家』では、より深い洞察をもつ哲学者が倫理的に優れ、最良の統治者は統治より神的実在の観照を好むとされる。"],"s":[0]}]},{"u":"アリストテレスとヘレニズム","items":[{"n":"アリストテレスの生涯と著作","p":["前384年マケドニア地方のスタゲイラに生まれ、前322年エウボイア島のカルキスで没した。","17歳頃アテネに出てプラトンのアカデメイアに学び、前347年のプラトンの死まで在籍した。","前343年、フィリッポス王の求めで13歳のアレクサンドロスの教育係となった。","前335年、アテネのリュケイオン（アポロン・リュケイオスの体育場）に学園を開いた。","著作は論理学の『オルガノン』、理論学（『自然学』『形而上学』『霊魂論』など）、実践学、制作学（『弁論術』『詩学』）に分類される。"],"s":[3]},{"n":"四原因説と質料形相論","p":["完全な説明には質料因・形相因・作用因・目的因の四原因を挙げる必要があるとした。","銅像でいえば、素材の銅が質料因、形が形相因、彫刻家が作用因、像が果たす目的が目的因にあたる。","個物は質料と形相の結合体であり（質料形相論）、変化を通じて存続するのが質料、新たに得られるのが形相である。","可能態は単なる可能性ではない。可能的にFである質料に形相が与えられ、現実にFとなる（現実態）。"],"s":[3]},{"n":"実体とカテゴリー","p":["存在の基本的な種類として、実体・性質・量・関係・場所・時間・位置・所有・能動・受動の十のカテゴリーを挙げた。","他のカテゴリーはすべて実体に依存して存在するため、実体が中心的なカテゴリーとなる。","『カテゴリー論』では、この人やこの馬のような個体が第一実体、その種や類が第二実体とされる。","『形而上学』では実体を質料と形相から分析し、形相こそがより範型的な実体だと論じる。"],"s":[3,0]},{"n":"アリストテレスの倫理学","p":["『ニコマコス倫理学』は『政治学』などとともに、行為に関わる実践学に属する。","エウダイモニアは通常「幸福」と訳されるが、徳倫理学では「人間としての開花・繁栄」と訳すことが好まれる。","徳（アレテー）は人間の能力の卓越性で、習慣づけられた性向であり、過剰と不足の中間（中庸）とされる。","実践知（フロネーシス）は、状況のどの特徴が重要かを見抜き、よく行為するための知である。","徳のある人と、欲求に抗ってかろうじて正しく行う抑制のある人とを区別した。"],"s":[3,0]},{"n":"ストア派","p":["前300年頃キティオンのゼノンが創始。名はアテネのアゴラにあった彩色柱廊（ストア・ポイキレ）に由来する。","クリュシッポスは前230年頃〜前206年に学頭を務めた体系化の担い手。ストア派は哲学を論理学・自然学・倫理学の一体とみた。","目的は自然と一致して生きることで、善は徳のみ。健康や富は善でも悪でもないが「優先されるもの」がある。","情念は善悪どちらでもないものを善や悪と誤る判断から生じ、賢者は情念から自由である（アパテイア）。","人類は理性を共有して一つの普遍的な国をなすとした（世界市民主義）。ローマではセネカ、エピクテトス、マルクス・アウレリウスが出た。"],"s":[0]},{"n":"エピクロスの快楽主義","p":["エピクロスは前341〜前270年。前307/6年にアテネへ戻り「庭園」を購入して学園を営んだ。","原子と空虚の原子論を採り、原子のわずかな逸れが非決定性をもたらすとした。逸れの記述は主にルクレティウス『事物の本性について』による。","目標は身体の苦痛のない状態（アポニア）と心の動揺のない状態（アタラクシア）であり、安定した静的快楽を重んじた。","欲求を、自然で必要なもの、自然だが不必要なもの、不死・富・名声のような空虚なものに分けた。","「死は我々にとって何ものでもない」。我々が存在するとき死はなく、死が来たとき我々は存在しないからである。"],"s":[0]},{"n":"古代懐疑派","p":["ピュロン（前365/60頃〜前275/70頃）を祖とするピュロン主義は、あらゆる主張への判断保留（エポケー）を説く。","対立する議論が等しい力をもつ（イソステネイア）ので判断を保留し、その結果として心の平静（アタラクシア）が得られる。","セクストス・エンペイリコス（160頃〜210頃）の著作が主要な資料である。","アイネシデモスの十の方式、アグリッパの五つの方式（不一致・無限後退・相対性・仮設・循環）が知られる。","アカデメイア派のアルケシラオスはストア派の真理基準を批判し、カルネアデスは「説得的なもの」を行為の基準とした。"],"s":[0]}]},{"u":"中世哲学","items":[{"n":"プロティノスと新プラトン主義","p":["プロティノスは204年頃〜270年。弟子ポルピュリオスが論考を9篇ずつ6部の『エンネアデス』に編んだ。","第一原理である「一者」は絶対的に単純で、あらゆる述語づけを超え、善と同一視される。","一者から知性（ヌース）、知性から魂が段階的に生じ（流出）、下位のものほど不完全になる。","魂は観照と倫理的浄化によって源へと還り、一者との合一に至りうる。","質料は形相を完全に欠く非存在であり、世界における悪の第一の原因とされた。"],"s":[0]},{"n":"アウグスティヌス","p":["354年北アフリカのタガステに生まれ430年に没した。391年にヒッポで司祭となり、396年頃に司教となった。","373年頃からマニ教の聴講者で、386年に新プラトン派の書物を読み、同年夏に回心、387年復活祭にミラノでアンブロシウスから受洗した。","『告白』は396〜400年頃の執筆。『神の国』は410年のローマ略奪の2年後の412年に起筆し、426年に完成。地上の国と神の国を対比する。","悪は実体ではなく善の欠如・腐敗だとした。「私が欺かれるなら、私は存在する」（『神の国』11.26）はデカルトのコギトと比較される。","原罪後の人間は恩寵なしに罪の欲望に抗えないとしてペラギウス派と対立し、同派は418年に異端とされた。"],"s":[0]},{"n":"アンセルムスと存在論的証明","p":["アンセルムスは1033〜1109年。1093年にカンタベリー大司教となった。","『モノロギオン』は1075〜76年、『プロスロギオン』は1077〜78年、『クール・デウス・ホモ』は1095〜98年の著作。","『プロスロギオン』で神を「それより大きなものが考えられえない何か」と捉え、そこから神の実在を導いた。","修道士ガウニロは、同じ論法なら最も完全な島の実在も導けると反論した（失われた島）。","標語は「理解を求める信仰」。信仰は劣った知ではなく、神への能動的な愛という意志の状態とされる。"],"s":[0]},{"n":"トマス・アクィナス","p":["1225年ロッカセッカ生まれ、1274年3月7日フォッサノーヴァで没。家族の反対を押してドミニコ会に入った。","アルベルトゥス・マグヌスに学び、パリ大学神学部でドミニコ会の講座を担当した。","アリストテレスを「哲学者」と呼んで受容し、信仰と哲学の新たな共存関係を築いた。","神の存在を運動など経験的事実から後天的に示す「五つの道」を提示した。神の本質は存在そのものとされる。","1277年にパリで断罪された219命題には彼の説も含まれたが、この断罪はのちに撤回された。"],"s":[0]},{"n":"普遍論争","p":["ポルピュリオス（234頃〜305頃）が『エイサゴーゲー』で保留した、類や種は実在するか等の三つの問いが発端である。","ボエティウス（480頃〜524頃）は注釈で、普遍は一つの事物でも事物の集まりでもありえず、抽象により心の中に存在するとした。","アベラール（1079〜1142）は、述語となりうる語こそが厳密な意味での普遍だとした。","トマスは、共通本性は知性に把握されて初めて普遍となるとした。普遍を事物の内や前に認める実在論は「古い道」と呼ばれる。","オッカムの意味論的な唯名論はビュリダンらに体系化され、「新しい道」を開いた。"],"s":[0]}]},{"u":"近代：ベーコンと合理論","items":[{"n":"ベーコンのイドラと帰納法","p":["ベーコンは1561〜1626年。1618年に大法官となったが、1621年に収賄で弾劾され失脚した。","『随筆集』初版1597年、『学問の進歩』1605年。『ノヴム・オルガヌム』（1620年）は『大革新』の一部である。","人間本性に由来する種族のイドラ、個人の教育や習慣に由来する洞窟のイドラを指摘した。","言葉が思考を支配する市場のイドラ、伝統的学説や誤った論証に由来する劇場のイドラも挙げた。","三段論法による論証を退け、実験で補正した感覚から存在・不在・程度の表と除外を用いて法則へ至る帰納法を説いた。"],"s":[0]},{"n":"デカルトの生涯と著作","p":["1596年3月31日ラ・エー生まれ。1649年女王クリスティナの招きでスウェーデンへ渡り、1650年2月11日に没した。","1633年のガリレイ断罪を受け、完成していた『世界論』の刊行を見送った。","『方法序説』（1637年）は『屈折光学』『気象学』『幾何学』の三試論を付して刊行された。","『省察』は1641年刊で、7組の反論と答弁を含む。『哲学原理』は1644年刊。","『精神指導の規則』は1628年頃に放棄された未完の草稿である。"],"s":[0]},{"n":"方法的懐疑とコギト","p":["『省察』は知識の可能性への懐疑から始まるが、デカルトは懐疑論者ではなく、懐疑を第一原理へ至る手段とした。","疑いうるものをすべて退けた末に、考えている私の存在は疑いえないとした（我思う、ゆえに我あり）。","アウグスティヌスの「私が欺かれるなら、私は存在する」は、コギトに先立つ反懐疑論の議論として比較される。","神の存在証明は『省察』の第三省察と第五省察にあり、『哲学原理』では順序が逆になる。"],"s":[0]},{"n":"デカルトの心身二元論","p":["精神の本性は思考、物体の本性は長さ・幅・深さへの延長であるとして、両者を別の実体とした。","実体とは他に依存せず存在しうるものだが、厳密にこれを満たすのは神だけだとした。","ボヘミアのエリーザベト王女は、精神と身体がどのように相互作用するのかを問いただした。","マルブランシュは機会原因論、ライプニッツは予定調和によって、相互作用なしに心身の対応を説明しようとした。"],"s":[0]},{"n":"スピノザの一元論","p":["スピノザは1632年アムステルダム生まれ、1677年ハーグ没。1656年7月27日にユダヤ共同体から破門された。","『神学・政治論』は1670年に匿名で刊行。『エチカ』は定義・公理から定理を順に証明する形で書かれ、死後に友人が刊行した。","実体は神ただ一つで、無限の属性のうち人間が知るのは思惟と延長のみ。個物は神のうちにある様態である。","「神すなわち自然」。自然には偶然がなく、神は世界を別様には生みえなかったとする決定論をとった。","各事物は自己の存在に固執しようと努める（コナトゥス）。直観知による神への知的愛を至福とした。"],"s":[0]},{"n":"ライプニッツのモナド論","p":["1646年7月1日ライプツィヒ生まれ、1716年11月14日没。1672年からのパリ滞在中に微分法を構想した。","『形而上学叙説』1686年、『弁神論』1710年、『モナドロジー』1714年。『人間知性新論』は1704年完成、1765年刊。","真の実体は非空間的で心に似た単純実体モナドであり、各モナドは自分の視点から宇宙を表出する。","被造実体間に因果作用はなく、神が定めた予定調和によって心と身体も一致する（同調する二つの振り子のたとえ）。","充足理由律から、神は無数の可能世界から最善の世界を選んだとし、識別不可能者同一の原理も導いた。"],"s":[0,4]}]},{"u":"イギリス経験論と社会契約説","items":[{"n":"ホッブズの自然状態と主権","p":["『市民論』は1642年（ラテン語）、『リヴァイアサン』は1651年に英語で刊行され、1668年にラテン語改訂版が出た。","共通の権力がない自然状態は、競争・不信・名誉欲から万人の万人に対する戦争状態となる。","そこでの人生は「孤独で、貧しく、不快で、残忍で、短い」と表現される。","自然権は自己保存に必要と判断することを何でも行う自由で、事実上あらゆるものへの権利となる。","人々は信約で権利を譲渡して主権者に服し、主権は分割も制限もされない。服従の義務は主権者が保護を与える限り続く。"],"s":[0]},{"n":"ロックの経験論","p":["ロックは1632〜1704年。『人間知性論』（1689年）の第1巻で生得的な原理を否定した。","心は経験以前には白紙（タブラ・ラサ）であり、観念の材料は外界の感覚と心の働きの内省から得られる。","心は単純観念を作れないが、それらを結合して実体・様態・関係の複合観念をつくる。","延長・固性・形・運動は物そのものの一次性質、色・味・匂いは知覚者に観念を生む力としての二次性質である。","性質を支える実体一般を「何か分からないもの」と呼んだ。この考えはのちにバークリーらに批判された。"],"s":[4,0]},{"n":"ロックの政治思想","p":["『統治二論』は、人々がなぜ自然状態を離れて政府をつくるのかを論じた。","自然状態の人間は自然法の下にあり、生存の手段である生命・自由・健康・財産を守る権利をもつ。","各人は自然法の執行権をもち、この権利が正当な抵抗（革命）を正当化する根拠と結びつく。","人々は同意によって自然状態を離れ、権利の一部を政府に委ねるが、残りの権利は保持する。","『寛容についての書簡』は匿名で刊行された。『教育に関する考察』は1693年刊。"],"s":[0]},{"n":"バークリーの非物質論","p":["バークリーは1685〜1753年、アイルランドのキルケニー近郊出身。1734年にクロインの主教となった。","『視覚新論』1709年、『人知原理論』1710年、『ハイラスとフィロナスの三つの対話』1713年。","実在するのは精神とその観念だけで、心から独立した物質的実体はないとした（存在するとは知覚されることである）。","ロックの抽象観念を退け、二次性質に向けられる相対性の議論は一次性質にも当てはまると論じた。","神が感覚観念を引き起こし自然の秩序を支える。なおバークリーを単純に経験論者に分類することには異論がある。"],"s":[4,0]},{"n":"ヒュームの知覚論と因果論","p":["ヒュームは1711〜1776年。『人間本性論』1739〜40年、『人間知性研究』1748年、『道徳原理研究』1751年。","知覚は生き生きとした印象と、その写しである観念に分かれ、単純観念は単純印象に由来する（コピー原理）。","知識は否定すると矛盾する「観念の関係」と、否定しても矛盾しない「事実の問題」に分かれる（ヒュームのフォーク）。","原因と結果の必然的結合は観察できず、恒常的連接の経験から生じる習慣による心の傾向にすぎない。","『自然宗教に関する対話』は死後の1779年刊。『イングランド史』は1754〜62年に6巻で刊行された。"],"s":[6]},{"n":"ヒュームの道徳論と自我","p":["「理性は情念の奴隷であり、またそうあるべきだ」。理性だけでは行為を動機づけることも情念に対抗することもできない。","道徳的な是認・否認は理性の結論ではなく観察者の感情であり、共感がその仕組みを説明する。","徳とは本人や他人にとって有用または快い性質で、一般的観点に立つ観察者に是認されるものである。","自我は持続する実体ではなく「知覚の束」であり、実体という観念は心がつくる虚構だとした。","「である」から「べきである」は導けないという主張は「ヒュームの法則」と呼ばれる。"],"s":[6,0]},{"n":"ルソーの自然人と一般意志","p":["1712年ジュネーヴ生まれ、1778年没。『人間不平等起源論』1755年、『新エロイーズ』1761年、『社会契約論』『エミール』1762年。","自己保存に向かう自己愛と、他人との比較で地位や承認を求める利己愛（自尊心）を区別した。","自然状態の人間はほぼ孤立して生き、自由と改善可能性によって動物と区別され、他者の苦しみへの憐れみをもつ。","一般意志は共通の利益をめざす市民全体の意志で法の源泉であり、私的意志や部分団体の意志とは区別される。","主権は人民全体にある。「自由であるよう強制される」（第1編第7章）は一般意志への服従が他人への依存から守る意と解される。"],"s":[0]}]},{"u":"カントとヘーゲル","items":[{"n":"カントの生涯と主著","p":["1724年4月22日ケーニヒスベルク生まれ、1804年2月12日没。生涯の大半を同地で過ごし教えた。","『純粋理性批判』1781年（第2版1787年）、『プロレゴメナ』1783年、『道徳形而上学の基礎づけ』1785年。","『実践理性批判』1788年、『判断力批判』1790年で三批判が揃った。","『永遠平和のために』1795年、『人倫の形而上学』（法論・徳論）1797年。"],"s":[5]},{"n":"コペルニクス的転回","p":["認識が対象に従うのではなく対象が認識に従うと考える転換を、観察者の側を回転させたコペルニクスになぞらえた。","空間と時間は物自体の性質ではなく、人間の感性的直観の主観的形式である。","我々が経験するのは現象のみで、物自体は理論的には認識できない（超越論的観念論）。","実体や原因などのカテゴリーは判断の論理形式に由来する悟性のアプリオリな概念で、悟性は自然の立法者とされる。","物自体は認識できないが、実践的な目的のためにはそれについての信念が正当化されうるとした。"],"s":[5]},{"n":"分析判断と総合判断","p":["述語が主語概念に含まれる分析判断と、含まれない総合判断の近代的な区別は『純粋理性批判』で導入された。","カントは7+5=12のような算術を総合判断とし、アプリオリな総合判断を重要な知識の源とみた。","フレーゲは『算術の基礎』（1884年）で、定義を置き換えると論理的真理になる文を分析的とした。","論理実証主義は論理学と数学を分析的とし、アプリオリな総合判断を否定した。","クワインは、分析性は同義性や必然性などと循環的にしか説明できないとして区別そのものを批判した。"],"s":[9]},{"n":"善意志と義務","p":["無条件に善いのは善意志だけで、勇気や知力、幸福さえ条件つきでしか善くない。善意志は「宝石のように輝く」。","義務に適合していても利己心や同情から出た行為には道徳的価値がなく、義務から行う行為にこそ価値がある。","格率とは「目的Eを実現するため状況CでAする」という形の、行為者の主観的な方針である。","仮言命法は欲する目的を条件として命じ、定言命法は理性的意志をもつ者に無条件に命じる。"],"s":[0]},{"n":"定言命法の諸定式","p":["普遍的法則の定式：自分の格率が同時に普遍的法則となることを欲しうる、そのような格率に従ってのみ行為せよ。","人間性の定式：人間性を単に手段としてではなく常に同時に目的として扱え。他人を手段として使うこと自体は禁じない。","自律の定式と目的の国の定式は、理性的存在者が普遍的法則に従うだけでなくその立法者でもあることを表す。","意志が自ら立てた法に従うのが自律、法を外に求めるのが他律であり、他律からは道徳的に欠けた行為が生じる。","例として、自殺と偽りの約束の禁止は完全義務、才能の開発と他者への援助は不完全義務とされる。"],"s":[0]},{"n":"ヘーゲルの生涯と弁証法","p":["1770年シュトゥットガルト生まれ、1831年没。『精神現象学』1807年、『大論理学』1812・1813・1816年。","ハイデルベルク時代の1817年に『エンチクロペディー』、ベルリン時代に『法の哲学』（1820/21年）を刊行した。","弁証法は規定的否定によって進み、あるカテゴリーの矛盾は、前段階を契機として含むより高いカテゴリーで解決される。","止揚（アウフヘーベン）とは、先行する契機が否定されつつ新たな全体の中で保存され働き続けることをいう。","『精神現象学』では、自己意識は他の自己意識による承認を必要とし、承認をめぐる闘争が描かれる。"],"s":[0]},{"n":"ヘーゲルの人倫と歴史哲学","p":["人倫（ジットリヒカイト）は慣習に由来する倫理的秩序で、家族・市民社会・国家からなる。","家族は愛と感情による結合、市民社会は市場を介した結合で、国家が両者の一面性を調停する。","精神（ガイスト）は社会制度としての客観的精神を経て、絶対精神へと展開する。","世界史を、精神が自己意識に至る解放の過程とみた。ポパーはこの目的論的歴史観を批判した。","私有財産の廃止を説いたのちのマルクスと異なり、経済を国家の枠組みの中に保ち福祉的介入で補った。"],"s":[0]}]},{"u":"19世紀の思想","items":[{"n":"ベンサムの功利主義","p":["ベンサムは1748年2月15日〜1832年6月6日、ロンドンの人。『統治論断片』（1776年）を匿名で刊行した。","『統治論断片』で「最大多数の最大幸福」を正邪の尺度とした。同じ定式はベッカリーア（1764年）にもみられる。","『道徳および立法の諸原理序説』（1780年印刷、1789年刊）は、人類は苦痛と快楽という二人の主権者の支配下にあると説く。","快苦の値は強度・持続性・確実性・遠近・多産性・純粋性・範囲で測られる。「快楽計算」の名は本人のものではない。","制裁として物理的・政治的・道徳的・宗教的の四つを挙げた。自然権を「竹馬に乗ったナンセンス」と批判した。"],"s":[0,11]},{"n":"J.S.ミルの功利主義と自由論","p":["ミルは1806年5月20日〜1873年5月7日。『論理学体系』1843年、『自由論』1859年、『功利主義』1861年。","快楽には量だけでなく質の違いがあり、両方を十分に知る者が選ぶ快楽が上位とされる。知性・感情・想像力の快楽が高級。","人が実際に欲することが望ましさの唯一の証拠だとして幸福の望ましさを示したが、この証明はムーアに批判された。","『自由論』は、他者の行為の自由への干渉が正当化される唯一の目的は自己防衛だとし、これを功利主義的根拠で擁護した。","20歳頃に精神的危機に陥りロマン派の詩などで回復した。1830年にハリエット・テイラーと出会い、1851年に結婚した。"],"s":[0,11]},{"n":"ショーペンハウアーの厭世観","p":["1788年2月22日ダンツィヒ生まれ、1860年9月21日フランクフルト没。学位論文『充足理由律の四つの根について』1813年。","主著『意志と表象としての世界』は1818年12月刊（扉の年記は1819年）、第2版1844年。『余録と補遺』1851年。","世界は充足理由律に従う表象であり、その内なる実在は盲目的で目的をもたない意志（物自体）である。","生は苦痛と退屈の間を絶えず揺れ動く。芸術はこの苦から一時離れさせ、とくに音楽は意志そのものの写しとされる。","道徳の基礎は他者の苦しみを自分のものと認める同情にあり、生への意志の否定（禁欲）を最高の境地とした。"],"s":[0]},{"n":"キルケゴールの実存思想","p":["1813年5月5日コペンハーゲン生まれ、1855年11月11日没。多くの著作を偽名で発表した。","『あれか、これか』と『おそれとおののき』は1843年、『不安の概念』1844年、『死に至る病』1849年。","実存は、享楽的な美的段階、選択と責任の倫理的段階、神への信仰の宗教的段階へと深まる。","『おそれとおののき』は、神の命に従いイサクを捧げようとするアブラハムに倫理の目的論的停止をみる。","群衆に対して「単独者」を擁護し、絶対知を称するヘーゲルの体系や、制度化された国教会を批判した。"],"s":[7,0]},{"n":"マルクスの疎外論と宗教批判","p":["マルクスは1818〜1883年。「ヘーゲル法哲学批判序説」（1843年）で宗教を有害な幻想を生む「民衆のアヘン」と呼んだ。","宗教は物質的な疎外への応答であり、物質的生活が解放されれば消えていくとした。","『経済学・哲学草稿』（1844年）は、労働の生産物・生産活動・他者・人間の類的本質からの四つの疎外を論じる。","『フォイエルバッハに関するテーゼ』は1845年、エンゲルスとの『ドイツ・イデオロギー』は1845〜46年に書かれた。"],"s":[0]},{"n":"唯物史観と剰余価値","p":["「経済学批判」序言（1859年）は、経済構造を土台とし、法的・政治的制度を上部構造とする見方を示す。","生産力は発展する傾向をもち、生産関係が生産力の桎梏になると、その経済構造は革命によって置き換えられる。","イデオロギーは支配階級に奉仕する誤った観念で、現存秩序を自然で必然的なものに見せる（カメラ・オブスクラのたとえ）。","労働日は賃金分を生む必要労働と剰余価値を生む剰余労働からなり、剰余価値があらゆる利潤の源泉である。","労働力は自らの価値より多くの価値を生む唯一のものであり、それゆえ可変資本と呼ばれる。"],"s":[0]},{"n":"ニーチェの生涯と著作","p":["1844年10月15日レッケン生まれ、1900年没。1869年、24歳でバーゼル大学の古典文献学教授となった。","1879年に健康を害して辞職し、1889年1月にトリノで倒れて以後回復しなかった。","『悲劇の誕生』1872年、『人間的な、あまりに人間的な』1878年、『曙光』1881年、『悦ばしき知識』1882年（増補版1887年）。","『ツァラトゥストラはこう語った』1883〜85年、『善悪の彼岸』1886年、『道徳の系譜学』1887年、『偶像の黄昏』1888年。","『力への意志』は妹エリーザベトが遺稿から編んだもので、誤解を招く編集とされる。若い頃はショーペンハウアーに傾倒した。"],"s":[8]},{"n":"神の死と永劫回帰","p":["「神は死んだ」は単なる無神論ではなく、キリスト教信仰が信じられなくなり、それに基づく道徳が脅かされる事態を指す。","ニヒリズムとは最高の諸価値がその価値を失う事態である。力への意志は抵抗を克服する衝動と解されることが多い。","『道徳の系譜学』は、良い／悪いの貴族的道徳に対し、弱者の怨恨（ルサンチマン）が善／悪の奴隷道徳を生んだとする。","永劫回帰は『悦ばしき知識』の末尾で導入され、自分の人生の無限の反復を肯定できるかを問う。","運命愛（アモール・ファティ）は必然を美しいものとして愛すること。知は常にある視点からのもの（遠近法主義）とされる。"],"s":[8]}]},{"u":"現象学と実存主義","items":[{"n":"フッサールの現象学","p":["1859年4月8日プロスニッツ生まれ、1938年4月27日没。『論理学研究』1900〜01年、『イデーンI』1913年。","ブレンターノから、意識は常に何かについての意識だという志向性の考えを受け継いだが、心理学による哲学の基礎づけは退けた。","自然的態度がもつ世界の存在への信念を停止するのがエポケー（判断中止）で、世界を疑ったり捨てたりすることではない。","意識の作用（ノエシス）と、その相関者として志向された対象（ノエマ）を区別した。「事象そのものへ」が標語である。","『デカルト的省察』（1931年仏語版）、『危機』（1936年）。科学以前の日常経験の世界を生活世界と呼んだ。"],"s":[0]},{"n":"ハイデガーの現存在分析","p":["1889年9月26日メスキルヒ生まれ、1976年5月26日フライブルク没。『存在と時間』（1927年）をフッサールに献じた。","中心の問いは存在の意味であり、存在を理解する存在者である人間を現存在（ダーザイン）と呼んだ。","現存在のあり方は世界内存在であり、道具はまず実践的な関わりの中で手元にあるもの（用具的存在）として出会われる。","道具が壊れたときなど距離をとって眺めると、物は眼前にあるもの（事物的存在）として現れる。","1933年4月にフライブルク大学総長となりナチ党員となった。1934年4月に総長を辞したが、党員であり続けた。"],"s":[7,0]},{"n":"死への存在と本来性","p":["日常の自己は社会的規範としての「ひと（ダス・マン）」に埋没しており、そのあり方を頽落と呼ぶ。","死は「現存在の絶対的な不可能性の可能性」とされ、死への先駆が自己を個別化し、自らの可能性を選ばせる。","本来性とは「ひと」に解消されず自らの実存を引き受けることで、死への先駆と決意性に結びつく。","人間は自らの存在を根底から支配できない状況に投げ込まれている（被投性）。不安がその存在への気遣いを露わにする。","後期には存在の歴史、言語、技術の危険を主題とし、計算的でない思考を求めた。"],"s":[7,0]},{"n":"サルトルの実存主義","p":["サルトルは1905〜1980年。『嘔吐』1938年、『存在と無』1943年、講演「実存主義はヒューマニズムである」は1945年末で1946年刊。","人間には存在に先立つ固定した本性がなく、選択によって自らをつくる（実存は本質に先立つ）。","物の存在である即自存在に対し、意識である対自存在は「それがあるところのものであらず、あらぬところのものである」。","人間は自由の刑に処せられている。自己欺瞞は自らの自由や事実性を否認することで、給仕を演じるカフェの給仕が例とされる。","他者に見られると自分が対象であることを意識する（鍵穴を覗いて恥じる例）。『弁証法的理性批判』第1巻は1960年。"],"s":[7,0]},{"n":"ボーヴォワール『第二の性』","p":["1908年1月9日パリ生まれ、1986年4月14日没。『両義性の倫理学』1947年、『第二の性』1949年。","「人は女に生まれるのではない、女になるのだ」（『第二の性』）は、生物学的性と社会的性の区別を意識させた。","『両義性の倫理学』は、実存主義こそ悪の問題を真剣に扱う哲学だとし、自由・責任・他者への呼びかけを軸に倫理を描いた。","1929年にサルトルと「本質的な愛」の協定を結んだ。長くサルトルの弟子とみなされたが、独自の貢献が再評価されている。"],"s":[0,7]},{"n":"カミュの不条理と反抗","p":["カミュは1913〜1960年。1942年6月に『異邦人』、同年10月に『シーシュポスの神話』を刊行した。","不条理とは、人生の意味を問わずにいられない衝動と、十分な答えが得られないこととの隔たりである。","『反抗的人間』は抑圧と不正への反抗を中心概念とし、「私は反抗する、ゆえに我々はある」と述べた。","1957年ノーベル文学賞。『反抗的人間』をめぐってサルトルと決裂し、自らが実存主義者であることを否定した。"],"s":[0,7]},{"n":"実存主義という呼称と周辺","p":["実存主義は統一的な体系ではなく、第二次大戦後のフランスで表面化した重なり合う思想群で、源流は19世紀にある。","「実存主義」の語は1943年にマルセルが導入した。自ら実存主義者と称したのはサルトルとボーヴォワールだけである。","客観的で超然とした哲学を退け、一人称的で身体をもち状況に置かれた経験を重視する点で共通する。","ヤスパースは、価値や真理と信じたものが崩れる「限界状況」から逃げず向き合うべきだとした。","メルロ＝ポンティは『知覚の現象学』（1945年）で身体性と状況に媒介された自由を論じた。"],"s":[7]}]},{"u":"分析哲学と科学哲学","items":[{"n":"フレーゲの論理学と意義・意味","p":["1848年11月8日ヴィスマル生まれ、1925年7月26日没。『概念記法』（1879年）は最初の述語論理と呼ばれる。","『算術の基礎』1884年、『算術の基本法則』1893・1903年。数学を論理から導く論理主義を企てた。","1902年6月16日付のラッセルの手紙が基本法則Vから矛盾（ラッセルのパラドクス）が生じることを指摘した。","「意義と意味」（1892年）：「明けの明星」と「宵の明星」は同じ金星を指す（意味は同じ）が、意義が異なる。","語の意味は単独でなく文の文脈の中で問え、という文脈原理を掲げた。"],"s":[9,0]},{"n":"ラッセルの記述理論","p":["ラッセルは1872年5月18日〜1970年2月2日。1901年にラッセルのパラドクスを発見した。","「指示について」（1905年）の記述理論は「現在のフランス王は禿げている」を存在と唯一性を含む主張に分析する。","ホワイトヘッドとの『プリンキピア・マテマティカ』は1910・1912・1913年に3巻で刊行。逆理への対処として型理論を用いた。","『哲学の諸問題』1912年。直知による知識と記述による知識を区別した（1911年の論文）。","1918年の講義で論理的原子論を示した。1950年にノーベル文学賞を受けた。"],"s":[0]},{"n":"前期ウィトゲンシュタイン","p":["1889年4月26日ウィーン生まれ、1951年没。『論理哲学論考』は1921年ドイツ語、1922年英語で刊行された。","冒頭は「世界は成立していることがらの総体である」。命題は現実の像であるとする写像理論を説いた。","論理形式のように、語ることができず示されるだけのものがあるとした。","結びは「語りえぬものについては沈黙せねばならない」。本書は登り終えたら投げ捨てるべき梯子にたとえられる。"],"s":[0]},{"n":"後期ウィトゲンシュタイン","p":["1929年にケンブリッジに戻った。後期の主著『哲学探究』は死後の1953年に刊行された。","言語ゲーム：言葉の意味は生活形式に埋め込まれた活動の中で生じ、多くの場合、語の意味はその使用である（43節）。","家族的類似：同じ語の用法に共通の本質はなく、重なり合い交差する類似の網があるだけだとした（66節）。","私的言語論：私的な感覚だけを指す言語は正誤の公共的基準を欠くので有意味になりえない。","規則に従うことの逆説（201節）はクリプキらの懐疑的解釈を生んだ。哲学は混乱を解く治療的な活動とされる。"],"s":[0]},{"n":"ウィーン学団と論理実証主義","p":["1922年にマッハの講座を継いだシュリックの下、1924〜1936年に定期的な討論が行われた。","1929年、カルナップ、ハーン、ノイラートが署名した宣言「科学的世界把握――ウィーン学団」を発表した。","経験的に検証（のちに確証）可能な言明だけを認識的に有意味とし、形而上学を偽ではなく無意味として退けた。","論理学と数学は分析的とされ、科学の統一がめざされた。プロトコル命題の性格をめぐる論争も起きた。","1936年にシュリックが殺害され成員は亡命した。エイヤー『言語・真理・論理』（1936年）が英語圏に広めた。"],"s":[0,9]},{"n":"クワインの全体論","p":["クワインは1908年6月25日〜2000年12月25日。「経験主義の二つのドグマ」を1951年に発表した。","分析性・同義性・定義・必然性は互いを用いてしか説明できず、分析性の独立した説明はないと論じた。","言明は個別にではなく一団として経験に向き合う（全体論）。いかなる言明も改訂を免れない。","論理や数学を中心に、経験を周縁に置く信念の網の目というイメージを示した。『ことばと対象』1960年。","認識論は自然科学の一章、心理学の一章になるとする自然化された認識論を唱えた。"],"s":[9,0]},{"n":"帰納の問題","p":["ヒュームは、過去から未来への推論を、論証的推論も蓋然的推論も正当化できないと論じた。","「未来は過去に似る」という斉一性の原理を正当化しようとすると、証明すべきことを前提する循環に陥る。","我々が原因から結果を予期するのは理性ではなく習慣による。","ポパーはヒュームの帰納批判を受け入れ、科学は実際には帰納を用いず演繹的にテストすると主張した。"],"s":[6,0]},{"n":"ポパーの反証主義","p":["ポパーは1902年7月28日ウィーン生まれ、1994年没。『開かれた社会とその敵』1945年、『科学的発見の論理』（英訳）1959年。","反証可能性を科学と非科学の境界設定基準とした。普遍理論は一つの反例で反証されうるが、有限の証拠では検証できない。","知識は暫定的・推測的で、大胆な推測と反駁を通じて進む（『推測と反駁』1963年）。厳しいテストに耐えた理論は確証される。","マルクス主義は失敗した予測をその場しのぎの修正で守り教条化し、精神分析はどんな行動も説明できてテスト不能だとした。","1974年、ミラーとティヒーが真理近似性の形式的定義の欠陥を示し、ポパーもそれを認めた。"],"s":[0]},{"n":"クーンのパラダイム論","p":["クーンは1922〜1996年。物理学者から科学史・科学哲学者となり『科学革命の構造』（1962年）を著した。","パラダイムは科学者集団が共有する前提（のちに専門母型と呼ぶ）で、狭義には模範となる研究例を指す。","通常科学はパラダイム内のパズル解きであり、変則事例の蓄積が危機を招き、科学革命に至る。","異なるパラダイムの理論は共通の尺度をもたない（通約不可能性）。転換はアヒルとウサギの図のゲシュタルト転換にたとえられた。","相対主義・非合理主義との批判に、正確さ・無矛盾性・範囲・単純性・多産性の五つの価値で応じた（1977年）。"],"s":[0]}]},{"u":"現代の社会・政治哲学","items":[{"n":"フランクフルト学派","p":["社会研究所は1923年にマルクス主義研究の拠点として創設され、ホルクハイマーが1930〜1958年に所長を務めた。","アドルノ（1903〜1969）とホルクハイマーは亡命先で『啓蒙の弁証法』を書き、1944年に限定版、1947年に改訂版を刊行した。","「神話はすでに啓蒙であり、啓蒙は神話に退行する」。目的と手段の計算に縮減された道具的理性を批判した。","文化産業は娯楽を規格化・商品化し、独立した判断を育てるのではなく既存秩序を強化するとした。","アドルノに『ミニマ・モラリア』1951年、『否定弁証法』1966年。ハーバーマスはアドルノの学生で助手でもあった。"],"s":[0]},{"n":"フーコーの考古学","p":["フーコーは1926年10月15日ポワティエ生まれ、1984年6月25日パリ没。『狂気の歴史』1961年、『臨床医学の誕生』1963年。","ある時代に考えうることの範囲を、個人の意識の下で定める思考の体系（エピステーメー）を分析した。","この方法を考古学と呼び、『知の考古学』（1969年）で定式化した。","『臨床医学の誕生』と『言葉と物』（1966年）は構造主義的な歴史とされ、ソシュールの言語論との関係が指摘される。","『言葉と物』は、人間とはカント以後に成立した認識論的概念だと論じた。"],"s":[0]},{"n":"フーコーの権力論","p":["『監獄の誕生』（1975年）で系譜学を導入した。思考の様式が偶然的な歴史から生じたことを示す方法で、名はニーチェに由来する。","権力と知は不可分であり、たとえば試験は力の行使と真理の確立を結びつける。","規律権力は階層的な監視・規格化する判断・試験を通じて逸脱を矯正し、「従順な身体」をつくる。","ベンサムの一望監視施設（パノプティコン）では、囚人はいつ見られているか分からないため自らを律するようになる。","『性の歴史』第1巻（1976年）で、殺す権利としての主権権力に対し、生を管理し最適化する生権力を論じた。"],"s":[0]},{"n":"ロールズの原初状態","p":["ロールズは1921〜2002年。『正義論』1971年、『政治的リベラリズム』1993年、『万民の法』1999年、『公正としての正義』2001年。","公正としての正義は、自由で平等な市民が公正な条件で協働する社会の構想である。","原初状態の当事者は無知のヴェールの背後で、人種・階級・性別・才能・善の構想を知らずに正義原理を選ぶ。","当事者は最も不利な場合に得る基本財を最大化するマキシミン推論をとり、功利主義より二原理を選ぶとされる。","基本財は、基本的権利と自由、移動と職業選択の自由、職務の権限、所得と富、自尊の社会的基盤である。"],"s":[10]},{"n":"正義の二原理と重なり合う合意","p":["第一原理：各人は基本的諸自由の十分な体系への平等な権利をもつ。自由は経済的利益と引き換えにできない。","第二原理：不平等は、公正な機会均等の下で開かれた職務に伴い、最も不遇な人々の利益になる場合に限る（格差原理）。","第一原理は第二原理に優先し、第二原理の中では公正な機会均等が格差原理に優先する。","反照的均衡：個別事例についての熟慮された判断と一般原理を相互に修正し、整合させることで正当化する。","重なり合う合意：異なる包括的教説をもつ市民が、それぞれの理由から同じ政治的な正義構想を支持すること。"],"s":[10]},{"n":"ノージックとリバタリアニズム","p":["ノージック『アナーキー・国家・ユートピア』（1974年）はリバタリアニズムの代表的著作である。","経験機械：望む快い経験を与える機械につながることを多くの人が拒むとして、快楽だけを善とする快楽主義を批判した。","ロールズは、リバタリアンの構想は基本的自由を行使する手段を保障せず、過大な不平等を許すとして退けた。"],"s":[10,11]},{"n":"社会契約説の比較","p":["ホッブズは自然状態を戦争状態とみて、平和のため分割されない絶対的主権への服従を説いた。","ロックは自然法の下にある自然状態から同意で政府をつくるとし、人民は権利の一部を保持し抵抗しうるとした。","ルソーは人民全体を主権者とし、共通の利益をめざす一般意志を法の源泉とした。","ロールズは歴史上の契約ではなく、無知のヴェールの下での仮説的な選択として正義原理を導いた。"],"s":[0,10]},{"n":"契約主義と契約説","p":["契約説（コントラクタリアニズム）はホッブズに由来し、道徳を自己利益的な主体の相互利益的な協力とみる（ゴティエ1986年）。","契約主義（コントラクチュアリズム）はスキャンロン『われわれが互いに負うもの』（1998年）に代表される。","スキャンロンは、誰も合理的に拒否できない原理によって許されない行為を不正とする。不正とは正当化できないことである。","ロールズは全員が同意するだろう原理を求めるが、契約主義は無知のヴェールを用いず、各自は自分の状況を知っている。","契約の当事者になれない動物や、見返りを与えられない将来世代をどう扱うかが難点とされる。"],"s":[0,10]}]},{"u":"東洋思想","items":[{"n":"孔子と『論語』","p":["孔子は伝統的に前551〜前479年とされる。魯と深く結びつき、魯で官途についたのち諸国で仕官を求めた。","『論語』は20篇からなり、伝統的に弟子による記録とされるが、その権威には現代の学者から疑問も出ている。","仁は他者の立場から何が善いかを考えて人に接することで、中核的な徳の中で最も広い。","礼は社会での自分の位置を自覚し儀礼的な役割を果たすことで、正しい実践には真心からの敬意を要する。","君子は修養を積んだ理想的人格。孝はもと祖先祭祀と結びつき、のちに親への振る舞いや目上への忠と結びついた。"],"s":[0]},{"n":"孟子の性善説","p":["孟子は前4世紀の人で、孔子の孫の子思の門人に学んだとされる。","人の本性は善であり、善になりうる生来の傾向をもつとした（性善説）。","惻隠・羞悪・辞譲・是非の心を、仁・義・礼・智の「四端」（四つの芽）とした。","井戸に落ちそうな子を見れば誰でも利害抜きに驚き憐れむとし、惻隠の心のない者は人ではないと述べた。","力による強制は効果がないとし、仁による統治と道徳的感化を重んじた。"],"s":[0]},{"n":"荀子の性悪説","p":["荀子は前310年頃に生まれ、前238年以後に没した前3世紀の儒家である。","「性悪」篇で、生まれつきの衝動に従えば害が生じるので性は悪いとした。この「悪」はアウグスティヌス的な悪とは異なる。","善は作為（偽）によって後天的に得られるものであり、本性を変えること（化性）が目標である。","礼は聖王が定めた恣意的でない規範で、師の導きを要する。天の運行は規則的で人事に介入しないとした。","門下に韓非（前233年没）や李斯（前208年没）がいる。名は本来の適切さをもたないが、実に対応すべきだとした。"],"s":[0]},{"n":"老子と道・無為","p":["『史記』は老子を楚の人で周の記録官とし、孔子と会い、関令尹喜の求めで書を著したと伝えるが、史実性は疑問視される。","『老子』は前5世紀後半から書き留められ、前4世紀に集成され、前3世紀半ばに比較的安定したとみられる。","1973年の馬王堆帛書（前168年封墓）では徳経が先に置かれ、1993年発見の郭店楚簡（前300年頃）は現存最古の老子である。","現行本は81章で道経（1〜37章）と徳経（38〜81章）からなる。道は名づけえず「字して道と曰う」（25章）。","無為は全くの不作為でなく私欲に駆られずに行うこと。水や柔弱を尊び、小国寡民を理想とし、仁義の提唱を衰退の徴とした。"],"s":[0]},{"n":"荘子の相対主義","p":["荘子は前4世紀後半に活躍した。郭象（312年没）が52篇を33篇に整理し、内篇・外篇・雑篇に分けた。","内篇（1〜7篇）、とくに第2篇の斉物論が荘子自身の教えを反映する可能性が高いとされる。","是非の判断は語る者の立場に依存するとする相対主義をとり、その懐疑は穏やかな認識上の謙虚さとされる。","濠水のほとりで恵施と、魚の楽しみを知りうるかを論じた。第2篇には視点の転換を夢にたとえる話がある。","真人や逍遥遊といった理想像は皮肉を込めて用いられているとも読まれ、解釈が分かれる。"],"s":[0]},{"n":"朱子学","p":["朱熹（朱子）は1130年福建の尤渓生まれ、1200年没。南宋の人で、周敦頤・張載・程顥・程頤の思想を総合した。","理は事物に内在する筋目、気は凝集して事物となるものであり、理を倫理的・存在論的に優先させた。","人の本性は理であって基本的に善だが、各人の気の稟受によって条件づけられるとした。","『大学』の格物致知を、事物・書物・人事の理を窮めて知を推し広める方法とし、敬による修養と対にした。","『大学』『論語』『孟子』『中庸』の四書に注釈を付けた。元代にその四書が科挙の基準とされた。"],"s":[0]},{"n":"陽明学","p":["王陽明は1472〜1529年。若い頃、友人と竹を見つめてその理を窮めようとして病に倒れた逸話がある。","心即理：理は各人の心に完全に備わっており、心の外に事はないとした。","知行合一：知っていて行わない者はおらず、知っているのに行わない者はまだ知らないのだとした。","孟子に由来する良知を十分に推し広めること（致良知）を説き、格物を「物を正す」と読んで朱子と異なった。","朱子の論敵であった陸九淵（陸象山、1139〜1193）とともに陸王の学（心学）と呼ばれる。"],"s":[0]},{"n":"ブッダの教え","p":["ブッダは前450年頃に活動した。かつては前560〜前480年頃とされたが、前405年頃に没したとする学者が多くなった。","四諦：苦がある、苦には無知と渇愛的な執着という原因がある、苦は滅しうる、滅に至る道がある。","無我：身体と四つの心的要素からなる五蘊のいずれも自己ではないとする。","苦・無常・無我を三相とし、これらへの無知が苦を生む因果の中心にあるとする。","永遠論と断滅論の間の中道を説いた。業は主に意志としての行為とその果報との因果関係である。"],"s":[0]},{"n":"大乗仏教と空","p":["上座部では阿羅漢が理想とされ、阿羅漢は死に際して涅槃に入るとされる。","大乗の菩薩は一切衆生を救うために仏となる誓願を立て、すべての者が解脱するまで輪廻にとどまる。","龍樹（ナーガールジュナ）は『中論』で空の思想を論じた。","寂天（シャーンティデーヴァ、7世紀後半〜8世紀半ば）は『入菩提行論』などを著した。","在家の五戒は不殺生・不偸盗・不邪淫・不妄語・不飲酒。悲（カルナー）は他者が苦から離れることを願う心である。"],"s":[0]}]},{"u":"日本思想","items":[{"n":"道元と日本の禅","p":["道元は1200年生まれの禅僧で曹洞宗の開祖。『正法眼蔵』に「現成公案」「仏性」などの巻がある。","只管打坐：自我の関心や欲望を離れてひたすら坐ること。坐禅は悟りの手段ではない（修証一等）。","身心脱落は心身の二元が消える悟りの体験とされる。存在と時間は切り離せないとする「有時」を説いた。","白隠（1685〜1768）は近世臨済禅を代表し、約1700の公案を体系化して五つの段階に分けた。"],"s":[0]},{"n":"江戸の朱子学","p":["藤原惺窩（1561〜1619）は朱子学派の儒者に数えられる。","林羅山（1583〜1657）は朱子学の一貫した唱道者で、理と気の形而上学を説き、人の本性は理であり善だとした。","羅山は聖賢の心はその言葉に現れるとして言葉を重んじ、疑いを理解への一歩として評価した。","山崎闇斎（1619〜1682）は正統的な朱子学者で、『大学』に従う君主の修身を政治思想の中心に置いた。","貝原益軒（1630〜1714）は『大疑録』で朱子学への疑問を記した。『女大学』は彼に帰せられる。"],"s":[13]},{"n":"日本陽明学と山鹿素行","p":["中江藤樹（1608〜1648）と熊沢蕃山（1619〜1691）は陽明学派の思想家である。","山鹿素行（1622〜1685）は古学派の思想家で、武士の教えをまとめた『武教小学』を著した。","素行は『聖教要録』で正統的朱子学を批判し、中国ではなく日本こそが真の中華（中朝）だと論じたこともある。","吉田松陰（1830〜1859）の儒学の系統は素行に遡る。"],"s":[13]},{"n":"伊藤仁斎と荻生徂徠","p":["伊藤仁斎（1627〜1705）は『論語』『孟子』を重んじ、『語孟字義』を著した古学の思想家である。","仁斎は気を唯一の実体とし理を従属させた。理を「死字」、道を「活字」と呼び、仏教を批判した。","仁斎は仁の本質を愛とし、その実践として忠恕（自分を偽らず他人を思いやること）を重んじた。","荻生徂徠（1666〜1728）は『弁名』で、語の正しい定義が社会と政治の秩序を支えると論じ、六経を重んじた。","徂徠は聖人である先王の道を礼楽・法・政治とし、心による自己統御より外的な統治の手段を重視した。"],"s":[13]},{"n":"もののあはれと「いき」","p":["本居宣長は『源氏物語』研究を通じて「もののあはれ」を文学論の前面に押し出し、それがこの物語の中心主題だと示した。","『源氏物語』は11世紀初めに紫式部が書いた物語で、もののあはれが大きな役割を果たしている。","九鬼周造（1888〜1941）は『「いき」の構造』の初稿を1926年に書き、1929年の帰国後まもなく刊行した。"],"s":[0]},{"n":"西田幾多郎と京都学派","p":["西田幾多郎（1870〜1945）は、禅の経験の根底をあらゆる対立を断ち切る「絶対無」として捉えた。","「絶対矛盾的自己同一」「見るものなくして見る」などの語を生み出した。","西田や西谷啓治らは京都学派と呼ばれ、禅の非二元的な経験を哲学の言葉で論じた。"],"s":[0]}]},{"u":"認識論・形而上学・論理学","items":[{"n":"合理論と経験論","p":["合理論は直観と演繹による知識や、生得的な知識・概念を認め、経験論は経験以外に知識と概念の源泉はないとする。","デカルト・スピノザ・ライプニッツを大陸合理論、ロック・ヒューム・リードをイギリス経験論とする分類は単純化である。","ロックは心を経験が書き込む白紙とし、ライプニッツは石目の入った大理石にたとえて心の生得的な寄与を擁護した。","ライプニッツは、矛盾律に基づく必然的な理性の真理と、有限の分析では確定しない偶然的な事実の真理を区別した。","カントは形而上学の基本原理は経験から取り出せないと論じた。"],"s":[4,0]},{"n":"知識の正当化と懐疑論","p":["認識論は知識や正当化など「認知的成功」を研究し、知覚・内観・記憶・理性・証言を知識の源泉として検討する。","正当化の無限後退を避けるため、基礎的信念に支えられるとする基礎づけ主義と、信念の相互支持とする整合説が対立する。","内在主義は正当化を水槽の脳の複製とも共有される内的要因に求め、外在主義は外界との関係を要求する。","信頼できる過程や源泉から形成された信念が正当化されるとする信頼性主義は、外在主義の代表である。","アプリオリな正当化は経験に依存しない正当化で、経験論者はそれを分析的真理に限る。"],"s":[14]},{"n":"知識の分析とゲティア問題","p":["伝統的分析では、知識とは正当化された真なる信念（JTB）である。","エドマンド・ゲティアは、正当化された真なる信念がたまたま真であるだけで知識とはいえない事例を示した。","見せかけの納屋の事例：偽物の納屋が並ぶ地域で偶然本物を見て「納屋だ」と信じても、真であるのは運による。","ゲティア事例は、知識には運を排除する条件が必要であることを示し、JTB分析の修正を促した。"],"s":[14]},{"n":"実体をめぐる諸説","p":["実体の語はギリシア語ウーシアに由来し、アリストテレスは個体を第一実体、その種や類を第二実体とした。","デカルトは独立に存在しうるものを実体とし、思惟する精神と延長する物体の二種の被造的実体を認めた。","スピノザは同じ基準から実体は神すなわち自然の一つだけとし、ライプニッツは神に依存し世界を映すモナドを実体とした。","ヒュームは実体を虚構とみなし、個物は性質の束にすぎないとした。","現代では性質の束とみる束説と、性質の担い手を要するとする基体説（アームストロングの「薄い個物」）が対立する。"],"s":[0]},{"n":"自由意志と決定論","p":["因果的決定論：ある時点の世界のあり方と自然法則によって、その後の出来事がすべて定まるという説である。","宿命論は何をしても起こることは定まっているとする説で、自然法則に基づく決定論とは区別される。","ホッブズやヒュームら古典的な両立論者は、自由の反対は決定論ではなく外的な強制だとした。","非両立論の帰結論証はギネット（1966年）、ヴァン・インワーゲン（1975・1983年）らが定式化した。","フランクファート（1969年）は他行為可能性がなくても責任がありうる事例を示し、P.F.ストローソン（1962年）は責任を反応的態度から捉えた。"],"s":[0]},{"n":"人格の同一性","p":["持続の問題とは、過去や未来のある存在が今の自分と同一であるための条件は何かという問いである。","ロックは人格を、異なる時と場所で自分を同じ思考するものとみなせる知的存在と定義した。記憶説は彼に帰されることが多いが異論もある。","記憶説には、記憶の連続は推移的でないという反論と、記憶が同一性を前提してしまうという循環の反論がある。","脳の左右半球を別々の身体に移す分裂の事例は、心理的連続説に難題を突きつける。","パーフィットは生存で重要なのは同一性ではなく心理的連結性と連続性だとした。動物説は我々を生物とみる。"],"s":[0]},{"n":"演繹と帰納","p":["演繹は前提から結論が必然的に帰結する推論で、アリストテレスの推論（シュロギスモス）はこれにあたる。","帰納は個別から普遍へ進む推論で、アリストテレスは第一原理の知識の基礎とした。","帰納は結論が前提の内容を超える拡張的推論であり、前提が真でも結論の真は保証されない。","説明的な仮説を生み出す推論としてのアブダクションはパースに由来する。","妥当な論証でも前提が偽なら結論は偽でありうる。妥当で前提がすべて真の論証を健全という。"],"s":[12,0]},{"n":"三段論法","p":["定言命題はA（すべてのbはaである）、E（どのbもaでない）、I（あるbはaである）、O（あるbはaでない）の四種。","二つの前提は媒概念を共有し、結論の述語を大概念、結論の主語を小概念と呼ぶ。","媒概念が一方の主語で他方の述語、両方の述語、両方の主語のどれかで三つの格が区別される。","第一格のBarbara、Celarent、Darii、Ferioのように、妥当な式には中世に記憶用の名が付けられた。","「すべてのAはB」と「あるAはBでない」は矛盾対当で、一方が真なら他方は必ず偽となる。"],"s":[12]},{"n":"主な誤謬","p":["アリストテレス『詭弁論駁論』は妥当に見えて妥当でない論証などを扱い、現代の誤謬分類はこれをよく再現している。","人身攻撃：主張の中身ではなく、主張する人の性格や立場を攻撃して主張を退ける誤謬。","藁人形論法：相手の主張を歪めて弱い形にすり替え、それを論駁して勝ったとみなす誤謬。","論点先取：証明すべき結論を前提にこっそり含めてしまう誤謬で、循環論法の一種である。","後件肯定（PならばQ、Q、ゆえにP）は形式的誤謬。他に誤った二分法、早まった一般化、滑り坂論法などがある。"],"s":[12]}]},{"u":"倫理学と心の哲学","items":[{"n":"義務論","p":["義務論は行為の正しさを帰結だけで決めず、義務や権利による制約を重んじる立場で、カントがその代表である。","カントは例外を許さない完全義務と、実行の仕方や程度に幅のある不完全義務を区別した。","移植外科医の事例（フット1967年、トムソン1976年）：一人を殺して臓器で五人を救うことを多くの人は忌まわしいと判断する。","この直観は帰結主義が個人の権利を見落とすことを示すとされ、帰結主義側は規則帰結主義などで応じた。"],"s":[0,11]},{"n":"功利主義の展開と批判","p":["古典的功利主義はベンサム、ミル、シジウィック（『倫理学の方法』初版1874年）で、行為帰結主義と快楽主義を結びつけた。","行為帰結主義は個々の行為をその帰結で評価し、規則帰結主義は行為が従う規則の帰結で評価する。","選好の充足を善とする選好功利主義や、美や知識も内在的善に数えるムーアの理想的功利主義もある。","古典的功利主義は各人の利益を等しく数える公平性をもつが、個人的選択の余地を残さないという要求過多の批判がある。","ウィリアムズは、溺れる妻を救うときに帰結を計算するのは「一つ余計な考え」だと批判した（1981年）。"],"s":[11]},{"n":"徳倫理学","p":["徳倫理学は義務や帰結ではなく徳と性格を中心に置く、規範倫理学の第三の立場である。","アンスコム「現代道徳哲学」（1958年）を契機に、1950年代末から英米で復興した。","フット『徳と悪徳』（1978年）、ハーストハウス『徳倫理学について』（1999年）が代表的な著作である。","「正直なことをせよ」のような徳の語による規則（v規則）で、行為の指針を与えられると応じる。","行為の指針にならない、自己中心的だ、状況が行動を左右するという心理学の知見と衝突する、などの批判がある。"],"s":[0]},{"n":"メタ倫理学","p":["認知主義は道徳的言明が真偽をもつ信念を表すとし、非認知主義は信念でない態度を表すとする。","情動主義（エイヤー、スティーヴンソン）は、道徳語は主に感情を表出し、他人に同じ感情を起こさせるとした。","ヘア（1952年）の指令主義は道徳文を命令文に近いとし、ブラックバーンやギバードは表出主義（準実在論）を展開した。","ムーアの未決問題論法（1903年）は、善をある自然的性質で定義しても「それは善か」がなお問いうると論じる。","マッキー（1977年）の誤謬理論は道徳的事実の存在を否定する。ギーチ（1965年）は非認知主義に埋め込み問題を突きつけた。"],"s":[0]},{"n":"トロッコ問題","p":["1967年にフットが示した思考実験に由来し、トムソン（1976年）らが議論を発展させた。","暴走する路面電車の進路を切り替えれば、5人が助かる代わりに別の線路の1人が死ぬ。切り替えは許されるかを問う。","切り替えを許す人の多くが、移植のために健康な1人を殺すことは許さない。この判断の違いをどう説明するかが課題となる。","殺すことと死なせること、意図することと予見することの区別などを検討する道具として使われる。","自動運転車の設計をめぐって参照されるが、現実の車がこの種の選択に直面するかには疑問も出されている。"],"s":[11,0]},{"n":"生命倫理","p":["安楽死は本人の意思による自発的、意思を確認できない非自発的、本人の意思に反する反自発的に分けられる。","致死薬の投与など積極的に死をもたらす積極的安楽死と、延命治療を差し控える・中止する消極的安楽死が区別される。","容認論は本人の自己決定（自律）と福利を根拠とし、反対論は生命の神聖さや滑り坂論を根拠とする。","インフォームド・コンセントは、十分な説明を受けて理解した患者の自発的な同意を医療行為の前提とする考え方である。"]},{"n":"環境倫理と将来世代","p":["人間の利益だけを道徳的配慮の対象とする人間中心主義と、自然や生物そのものに価値を認める非人間中心主義が対立する。","将来世代は現在世代に見返りを与えられないため、相互利益に基づく契約説では扱いにくい。","動物は契約の当事者になれないため契約説から外れやすいが、功利主義は動物の苦痛をそれ自体として悪とみなす。","スキャンロンは、動物の利益を後見人が代弁する可能性を示唆した。"],"s":[0]},{"n":"AI倫理","p":["主な論点はプライバシーと監視、行動の操作、意思決定の不透明性、偏り、人とロボットの関係、雇用への影響である。","偏りは人間の偏見、認知の近道、欠陥のあるデータから入り込み、技術的な公平化には限界があるとされる。","自律的システムでは責任が設計者・運用者・制度に分散し、「責任の空白」（マティアス2004年）が問題になる。","ムーア（2006年）は、倫理的影響を与える主体、暗黙的・明示的・完全な倫理的主体を区別した。","グッド（1965年）は最初の超知能機械が人類最後の発明になると述べ、ボストロム（2014年）は制御問題を論じた。"],"s":[0]},{"n":"心身問題と二元論","p":["デカルトの実体二元論は心と身体の相互作用を認めるが、異なる実体がどう作用し合うかが難問となる。","随伴現象説は、心的出来事は物理的出来事に引き起こされるが物理的世界に影響を与えないとし、ハクスリーが広めた。","性質二元論は、非物質的な実体を立てずに、意識が非物理的な性質を含むと主張する。","ライル（1949年）はデカルト的二元論を、多くの人が受け入れている「公式の教義」と呼んで批判した。","論理的行動主義は心的語を行動の傾向性と同一視したが、行動を伴わない心的状態もあるとして批判された。"],"s":[0]},{"n":"心脳同一説と機能主義","p":["心脳同一説（プレイス1956年、ファイグル1958年、スマート1959年）は心的状態の型を神経状態の型と同一視する。","同一説では、脳の構造が異なる生物は我々と同じ心的状態をもてないことになる。","機能主義は心的状態を物理的構成ではなく、刺激・他の心的状態・行動との因果的役割によって定義する。","同じ心的状態は異なる物理状態で実現されうる（多重実現可能性）。パトナム（1960・1967年）は機械状態説を唱えた。","逆転クオリアや、中国の全人口が機能を模倣するブロックの「中国国民」による欠如クオリアの反論がある。"],"s":[0]},{"n":"中国語の部屋","p":["サールが1980年の論文「心・脳・プログラム」で提示した。27人の研究者の論評とサールの応答が併せて掲載された。","中国語を解さない人が部屋で英語の規則書に従い中国語の記号を操作すると、外からは中国語話者がいるように見える。","標的はプログラムされたコンピュータが文字通り理解するとする「強いAI」で、道具とみる「弱いAI」ではない。","統語論はそれだけでは意味論に十分でないと主張し、チューリング（1950年）のテストに合格しても理解は示されないとした。","システム応答・ロボット応答・脳シミュレータ応答・他人の心の応答などの反論がある。"],"s":[0]},{"n":"意識のハードプロブレム","p":["チャーマーズ（1995年）は、機能や情報処理を説明する「易しい問題」と、主観的経験がなぜ生じるかの「難しい問題」を区別した。","レヴァイン（1983年）は、物理過程と意識を理解可能な形で結ぶ説明がないことを「説明のギャップ」と呼んだ。","ネーゲル（1974年）は、ある生物であることが「どのようなことか」があるとき、その生物は意識をもつとした（コウモリの例）。","ジャクソン（1982年）のメアリーは、色を初めて見て新しいことを知るなら物理的事実が全てではないと論じる。","物理的に人間と同一で意識を欠くゾンビの想像可能性が物理主義批判に使われる。ブロックは現象的意識とアクセス意識を区別した。"],"s":[0]}]}]},{"id":"law","name":"法学（憲法・民法・刑法）","full":"法学入門（憲法・民法・刑法・行政法・会社法の基礎）","group":"教養・専門","desc":"社会のルールである法の仕組みと主要な法分野の基礎","asOf":"2026年11月1日時点で施行されている法令に基づく（公布済み・未施行の改正はその旨を記載）","aliases":["法律","法学","憲法","民法","刑法"],"sources":[{"t":"法務省「民法等の一部を改正する法律（父母の離婚後等の子の養育に関する見直し）について」","u":"https://www.moj.go.jp/MINJI/minji07_00357.html"},{"t":"法務省「父母の離婚後の子の養育に関するルールが改正されました」解説資料","u":"https://www.moj.go.jp/content/001425814.pdf"},{"t":"法務省「性犯罪関係の法改正等 Q&A」","u":"https://www.moj.go.jp/keiji1/keiji12_00200.html"},{"t":"法務省 広報誌「拘禁刑の導入」","u":"https://www.moj.go.jp/KANBOU/KOHOSHI/no89/3.html"},{"t":"新日本法規「法令改正情報：刑法等の一部を改正する法律（拘禁刑の創設等）」","u":"https://www.sn-hoki.co.jp/article/pickup_hourei/pickup_hourei2218296"},{"t":"法務省「民法（債権関係）改正の概要」説明資料","u":"https://www.moj.go.jp/content/001259610.pdf"},{"t":"法務省「法定利率について」","u":"https://www.moj.go.jp/MINJI/minji07_00366.html"},{"t":"法務省「民法の一部を改正する法律（成年年齢関係）について」","u":"https://www.moj.go.jp/MINJI/minji07_00218.html"},{"t":"法務省「民法（成年年齢関係）改正 Q&A」","u":"https://www.moj.go.jp/MINJI/minji07_00238.html"},{"t":"法務省「民法及び家事事件手続法の一部を改正する法律について（相続法の改正）」","u":"https://www.moj.go.jp/MINJI/minji07_00222.html"},{"t":"法務省「相続登記の申請義務化に関するQ&A」","u":"https://www.moj.go.jp/MINJI/minji05_00565.html"},{"t":"法務省「住所等変更登記の義務化・スマート変更登記について」","u":"https://www.moj.go.jp/MINJI/minji05_00687.html"},{"t":"法務省「民法等の一部を改正する法律案」（令和4年法律第102号・嫡出推定制度の見直し等）と法律案要綱","u":"https://www.moj.go.jp/MINJI/minji07_00314.html"},{"t":"法務省「民法等の一部を改正する法律案」（令和8年法律第45号・成年後見制度と遺言制度の見直し）と法律案要綱","u":"https://www.moj.go.jp/MINJI/minji07_00389.html"},{"t":"法務省「裁判員制度」（制度の概要・裁判員の仕事・対象事件・よくある質問）","u":"https://www.moj.go.jp/keiji1/saibanin_seido_index.html"}],"units":[{"u":"法学の基礎と裁判制度","items":[{"n":"法の分類","p":["公法は国家と私人の関係（憲法・刑法・行政法）、私法は私人同士の関係（民法・商法）を規律する。","労働法や社会保障法のように、私人間の関係に国家が介入して弱い立場の者を守る法を社会法という。","実体法は権利義務の中身（民法・刑法）を、手続法はその実現の手順（民事訴訟法・刑事訴訟法）を定める。","強行法規は当事者の合意で排除できない。任意法規は当事者が異なる意思を示せばその意思が優先する（民法91条）。"]},{"n":"法源と法の効力","p":["法源は成文法（憲法・法律・命令・条例・条約）と不文法（慣習法・判例法・条理）に分けられる。","公序良俗に反しない慣習は、法令が認めた場合や法令に規定がない事項について法律と同一の効力をもつ（法の適用に関する通則法3条）。","特別法は一般法に優先し（例：商法は民法の特別法）、同順位の法では新しい法が古い法に優先する。","法律は施行期日の定めがなければ、公布の日から起算して20日を経過した日から施行される（通則法2条）。","法律不遡及の原則があり、特に刑罰法規の遡及適用は憲法39条で禁止される。"]},{"n":"法の解釈の方法","p":["文理解釈は条文の文言どおりに読む方法、論理解釈は法全体の体系や立法趣旨から意味を確定する方法である。","拡張解釈は文言の意味を広げ、縮小解釈は狭める。どちらも文言の可能な意味の範囲内で行う。","類推解釈は規定のない類似の事案に規定を及ぼし、反対解釈は規定のない事案に逆の結論を導く。","勿論解釈は、規定の趣旨からみて他の事案にはなおさら当てはまるとして同じ結論を導く解釈である。","刑法では被告人に不利な類推解釈は罪刑法定主義に反し許されないが、拡張解釈は許されうる。"]},{"n":"裁判所の種類と三審制","p":["裁判所は最高裁判所と下級裁判所（高等・地方・家庭・簡易裁判所）からなる（憲法76条1項）。","高等裁判所は8か所、地方裁判所と家庭裁判所は各50か所、簡易裁判所は438か所に置かれている。","第一審判決への不服申立てを控訴、控訴審判決への不服申立てを上告といい、原則3回まで審理を受けられる。","民事で簡裁が第一審なら控訴は地裁、上告は高裁へ。刑事は簡裁の判決でも控訴先は高裁である。","簡裁は訴額140万円以下の民事事件と軽微な刑事事件を、家裁は離婚などの家事事件と少年事件を扱う。"]},{"n":"民事・刑事・行政の手続き","p":["民事訴訟は私人間の紛争を原告の訴えで審理し、訴えの取下げや和解など手続の開始・終了を当事者に委ねる。","刑事訴訟は検察官の起訴で始まり、検察官は犯罪の嫌疑があっても情状により起訴しないことができる（起訴便宜主義）。","刑事裁判では無罪推定が働き、検察官が合理的な疑いを超える程度まで有罪を立証しなければならない。","行政訴訟は行政事件訴訟法に基づき処分の取消しなどを求める訴訟で、被告は原則として国や公共団体である。","60万円以下の金銭支払請求は、簡裁で原則1回の期日で審理を終える少額訴訟を利用できる。"]},{"n":"裁判員制度","p":["2009年に始まった制度で、国民が刑事裁判に参加し、有罪か無罪かと有罪の場合の刑を裁判官と一緒に決める。","対象は殺人・強盗致死傷・傷害致死・現住建造物等放火など一定の重大な刑事事件で、民事事件は対象外である。","原則として裁判員6人と裁判官3人で審理し、裁判員は証人や被告人に質問することもできる。","有罪とするには裁判官と裁判員のそれぞれ1人以上を含む過半数の賛成が必要で、満たなければ無罪となる。","裁判員は選挙権のある人から事件ごとに選ばれ、2023年以降は18歳・19歳も選ばれる可能性がある。"],"s":[14]}]},{"u":"憲法の基本原理と人権総論","items":[{"n":"日本国憲法の成立と三大原理","p":["1946年11月3日に公布、1947年5月3日に施行された。大日本帝国憲法の改正手続を経て成立した。","三大原理は国民主権・基本的人権の尊重・平和主義で、前文と本文に示されている。","天皇は日本国と日本国民統合の象徴で、その地位は主権の存する日本国民の総意に基づく（1条）。","天皇は国政に関する権能を有せず、国事行為には内閣の助言と承認が必要で、内閣が責任を負う（3条・4条）。","国事行為には国会の指名に基づく首相の任命、法律の公布、国会の召集、衆議院の解散などがある（6条・7条）。"]},{"n":"平和主義と最高法規性","p":["9条1項は、国際紛争を解決する手段としての戦争・武力による威嚇・武力の行使を永久に放棄する。","9条2項は、陸海空軍その他の戦力の不保持と国の交戦権の否認を定める。","砂川事件（1959年最高裁大法廷）は、安保条約は高度の政治性をもち、一見極めて明白に違憲でない限り司法審査の対象外とした。","憲法は国の最高法規で、これに反する法律・命令・詔勅・国務に関する行為は効力を有しない（98条1項）。","憲法尊重擁護義務を負うのは天皇・摂政・国務大臣・国会議員・裁判官その他の公務員で、国民は挙げられていない（99条）。"]},{"n":"憲法改正の手続き","p":["各議院の総議員の3分の2以上の賛成で国会が発議し、国民投票で過半数の賛成を得て承認される（96条1項）。","国民投票法では、賛成票が投票総数（賛成票と反対票の合計）の2分の1を超えれば承認となる。","国民投票は国会の発議から60日以後180日以内に行われ、最低投票率の定めはない。","国民投票の投票権は18歳以上の日本国民がもつ。","承認された改正は天皇が国民の名で直ちに公布する。日本国憲法は施行以来一度も改正されていない。"]},{"n":"人権の享有主体","p":["八幡製鉄事件（1970年最高裁大法廷）は、法人にも性質上可能な限り人権規定が適用され、政治献金もできるとした。","マクリーン事件（1978年最高裁大法廷）は、外国人にも権利の性質上日本国民のみを対象とするものを除き人権が保障されるとした。","同判決は、在留期間の更新を法務大臣の広い裁量とし、在留中の政治活動を不許可の事情として考慮できるとした。","1995年の最高裁判決は、93条2項の「住民」は日本国民を指すとしつつ、定住外国人に地方選挙権を与える立法は禁止されないとした。","未成年者も人権の主体だが、心身の未成熟を理由に選挙権の年齢制限など一定の制約を受ける。"]},{"n":"人権の私人間効力","p":["人権規定は本来国家権力を名あて人とするため、私人同士の関係に適用されるかが問題となる。","三菱樹脂事件（1973年最高裁大法廷）は、憲法19条・14条は私人相互の関係を直接規律するものではないとした。","同判決は、企業が思想を理由に本採用を拒否しても、それだけで直ちに違法とはいえないとした。","判例は民法1条や90条（公序良俗）などの一般条項を通じて憲法の趣旨を考慮する間接適用説に立つ。","日産自動車事件（1981年最高裁）は、女子の定年を男子より低く定めた就業規則を民法90条により無効とした。"]},{"n":"公共の福祉と違憲審査基準","p":["人権は公共の福祉による制約を受ける。12条・13条のほか、22条・29条にも公共の福祉の文言がある。","二重の基準論は、精神的自由の規制は厳格に、経済的自由の規制は比較的緩やかに審査すべきとする考え方である。","規制目的二分論では、積極目的規制は明白性の原則で、消極目的規制はより厳格な合理性の基準で審査する。","漠然としていたり過度に広汎だったりする表現規制は、それ自体で違憲無効とされうる（明確性の理論）。","徳島市公安条例事件（1975年最高裁大法廷）は、通常の判断能力をもつ一般人が基準を読み取れるかで明確性を判断した。"]},{"n":"幸福追求権と新しい人権","p":["13条の幸福追求権は、憲法に列挙されていない新しい人権の根拠となる包括的な権利とされる。","京都府学連事件（1969年最高裁大法廷）は、みだりに容ぼう・姿態を撮影されない自由を13条で保障されるとした。","「宴のあと」事件（1964年東京地裁）は、私生活をみだりに公開されない権利としてプライバシー権を認めた。","エホバの証人輸血拒否事件（2000年最高裁）は、輸血を拒む意思決定の権利を人格権として尊重すべきとし病院側の賠償責任を認めた。","2023年10月の最高裁大法廷決定は、性別変更に生殖能力をなくすことを求める特例法の要件を13条違反とした。"]}]},{"u":"自由権","items":[{"n":"思想・良心と学問の自由","p":["19条の思想・良心の自由は内心にとどまる限り絶対的に保障され、思想を告白させられない沈黙の自由を含む。","謝罪広告事件（1956年最高裁大法廷）は、単に事態の真相を告白し陳謝の意を表する程度の謝罪広告の強制を合憲とした。","2011年の最高裁判決は、卒業式での君が代起立斉唱の職務命令を思想・良心の自由の間接的な制約にとどまり合憲とした。","23条の学問の自由は研究・研究発表・教授の自由を含み、それを支える制度として大学の自治が保障される。","東大ポポロ事件（1963年最高裁大法廷）は、実社会の政治的社会的活動にあたる学生集会は大学の自治を享有しないとした。"]},{"n":"信教の自由と政教分離","p":["20条は信教の自由を保障し、宗教団体の特権・政治上の権力行使と、国の宗教的活動を禁止する。89条は宗教団体への公金支出を禁じる。","津地鎮祭事件（1977年最高裁大法廷）は、目的が宗教的意義をもち効果が宗教を援助・助長等するかで判断する目的効果基準で合憲とした。","愛媛玉串料事件（1997年最高裁大法廷）は、県が靖国神社などに玉串料を公金から支出したことを20条3項・89条違反とした。","空知太神社事件（2010年最高裁大法廷）は、市有地を神社施設のために無償で使わせていたことを89条・20条1項後段違反とした。","那覇孔子廟事件（2021年最高裁大法廷）は、市が公園内の孔子廟の土地使用料を全額免除したことを20条3項違反とした。"]},{"n":"表現の自由と検閲","p":["21条1項は集会・結社・言論・出版その他一切の表現の自由を保障し、2項は検閲を禁止し通信の秘密を保障する。","税関検査事件（1984年最高裁大法廷）は、検閲を行政権が表現物の発表前に内容を審査し不適当なものの発表を禁止することと定義した。","同判決は、税関検査は事前に発表そのものを禁止するものではないとして検閲に当たらないとした。","北方ジャーナル事件（1986年最高裁大法廷）は、裁判所による出版物の事前差止めは厳格かつ明確な要件のもとでのみ許されるとした。","博多駅事件（1969年最高裁大法廷決定）は、報道の自由は21条で保障され、取材の自由も21条の精神に照らし十分尊重に値するとした。"]},{"n":"職業選択の自由と規制目的","p":["22条1項は職業選択の自由を保障し、判例は選んだ職業を遂行する営業の自由も含まれるとする。","小売市場事件（1972年最高裁大法廷）は、中小企業保護の積極目的規制を、著しく不合理であることが明白な場合に限り違憲とし合憲とした。","薬事法距離制限事件（1975年最高裁大法廷）は、薬局の配置規制を消極目的規制とし、より緩やかな手段で足りるとして違憲とした。","22条は居住・移転の自由も保障し、2項で外国に移住する自由と国籍を離脱する自由を保障する。"]},{"n":"財産権と損失補償","p":["29条1項は財産権を保障し、2項は財産権の内容を公共の福祉に適合するように法律で定めるとする。","森林法共有林事件（1987年最高裁大法廷）は、持分2分の1以下の共有者の分割請求を否定する規定を29条違反とした。","奈良県ため池条例事件（1963年最高裁大法廷）は、災害防止のための財産権の制限は条例でもでき、補償も不要とした。","29条3項により私有財産を公共のために用いるには正当な補償が必要で、判例は同項を直接の根拠に補償を請求する余地を認める。"]},{"n":"人身の自由と適正手続","p":["18条は奴隷的拘束を禁止し、犯罪による処罰の場合を除いて意に反する苦役に服させられないとする。","31条は法律の定める手続によらなければ刑罰を科されないとし、手続の適正や処罰内容の法定・適正も求めると解されている。","第三者所有物没収事件（1962年最高裁大法廷）は、所有者に告知・弁解・防御の機会を与えない没収を31条・29条違反とした。","成田新法事件（1992年最高裁大法廷）は、31条の保障は行政手続にも及びうるが、常に事前の告知・聴聞が必要ではないとした。"]},{"n":"被疑者・被告人の権利","p":["逮捕には現行犯の場合を除き裁判官が発する令状が必要で（33条）、住居の捜索や押収にも令状が必要である（35条）。","公務員による拷問と残虐な刑罰は絶対に禁止される（36条）。判例は死刑を残虐な刑罰に当たらないとする（1948年最高裁大法廷）。","37条は公平な裁判所の迅速な公開裁判、証人審問権、弁護人依頼権（国選弁護人を含む）を保障する。","38条は自己に不利益な供述の強要を禁じ、強制による自白の証拠能力を否定し、自白だけでの有罪を禁じる。","39条は実行時に適法だった行為の処罰（遡及処罰）と、同一の犯罪について重ねて刑事責任を問うことを禁じる。"]}]},{"u":"平等・社会権・参政権","items":[{"n":"法の下の平等","p":["14条1項は人種・信条・性別・社会的身分・門地による政治的・経済的・社会的関係での差別を禁止する。","判例は、事柄の性質に応じた合理的な根拠のある区別は許されるとする相対的平等の立場をとる。","尊属殺重罰規定事件（1973年最高裁大法廷）は、刑を死刑か無期懲役に限る点が極端に重いとして14条違反とした。規定は1995年に削除された。","国籍法事件（2008年最高裁大法廷）は、出生後に父が認知した子の国籍取得に父母の婚姻を求める規定を14条違反とした。","14条2項・3項は華族その他の貴族制度を認めず、栄典の授与は特権を伴わないとする。"]},{"n":"家族と平等をめぐる判例","p":["2013年の最高裁大法廷決定は、嫡出でない子の相続分を嫡出子の2分の1とする規定を14条違反とし、同年の改正で削除された。","再婚禁止期間事件（2015年最高裁大法廷）は、女性の6か月の再婚禁止期間のうち100日を超える部分を違憲とした。","再婚禁止期間は2016年の改正で100日に短縮され、2024年4月1日施行の改正で廃止された。","夫婦同氏を定める民法750条は、2015年の最高裁大法廷判決と2021年の大法廷決定でいずれも合憲とされた。","24条は婚姻が両性の合意のみに基づいて成立するとし、家族の法律は個人の尊厳と両性の本質的平等に立脚すべきとする。"],"s":[12]},{"n":"生存権","p":["25条1項は健康で文化的な最低限度の生活を営む権利を保障し、2項は社会福祉・社会保障等の向上に努める国の責務を定める。","朝日訴訟（1967年最高裁大法廷）は、25条1項は国の責務の宣言で、個々の国民に具体的権利を与えたものではないと述べた。","堀木訴訟（1982年最高裁大法廷）は、制度の具体化は立法府の広い裁量に委ねられ、著しく合理性を欠く場合のみ違憲になるとした。","生存権の法的性格について、プログラム規定説・抽象的権利説・具体的権利説が対立してきた。"]},{"n":"教育を受ける権利と労働基本権","p":["26条は教育を受ける権利と、保護する子女に普通教育を受けさせる義務を定め、義務教育は無償とする。","判例（1964年最高裁大法廷）は、義務教育の無償は授業料を徴収しないことを意味するとした。教科書の無償は法律による措置である。","旭川学テ事件（1976年最高裁大法廷）は、国も必要かつ相当と認められる範囲で教育内容を決定する権能をもつとした。","28条は勤労者の団結権・団体交渉権・団体行動権（争議権）を保障し、27条は勤労の権利と義務を定める。","全農林警職法事件（1973年最高裁大法廷）は、国家公務員の争議行為の一律禁止を合憲とした。"]},{"n":"選挙権と一票の格差","p":["15条は公務員の選定罷免権、成年者による普通選挙、投票の秘密を保障する。選挙権年齢は2016年施行の改正で18歳以上となった。","被選挙権は衆議院議員・市町村長・地方議会議員が25歳以上、参議院議員・都道府県知事が30歳以上である。","1976年の最高裁大法廷判決は衆議院の定数配分を違憲としたが、事情判決の法理により選挙自体は無効としなかった。","在外日本人選挙権事件（2005年最高裁大法廷）は、在外国民の選挙権行使を制限していた公職選挙法を違憲とした。","在外国民審査事件（2022年最高裁大法廷）は、在外国民に最高裁裁判官の国民審査を認めない国民審査法を違憲とした。"]},{"n":"国務請求権","p":["16条の請願権は国や地方公共団体に希望を述べる権利で、請願をしたことを理由に差別待遇を受けない。","17条は公務員の不法行為による損害の賠償請求権を保障し、これを具体化したのが国家賠償法である。","郵便法事件（2002年最高裁大法廷）は、書留郵便の故意・重過失による損害などで国の責任を免除する規定を17条違反とした。","32条は裁判を受ける権利を、40条は抑留・拘禁された後に無罪となった者の刑事補償請求権を保障する。","旧優生保護法事件（2024年7月最高裁大法廷）は、不妊手術を強いた規定を13条・14条違反とし、国が除斥期間で責任を免れることを認めなかった。"]}]},{"u":"統治機構","items":[{"n":"国会の地位と議員の特権","p":["国会は国権の最高機関で国の唯一の立法機関である（41条）。衆議院と参議院の二院制をとる（42条）。","衆議院議員の任期は4年で解散がある。参議院議員の任期は6年で3年ごとに半数を改選し、解散はない（45条・46条）。","議員定数は衆議院465人（小選挙区289・比例代表176）、参議院248人で、両議院の議員を兼ねることはできない（48条）。","議員は会期中は法律の定める場合を除き逮捕されず、院内での演説・討論・表決について院外で責任を問われない（50条・51条）。","
