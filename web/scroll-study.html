両議院は国政調査権をもち、証人の出頭・証言や記録の提出を求めることができる（62条）。"]},{"n":"国会の会期と緊急集会","p":["常会は毎年1回召集される（52条）。臨時会は、いずれかの議院の総議員の4分の1以上の要求があれば内閣が召集を決定しなければならない（53条）。","衆議院解散の日から40日以内に総選挙を行い、選挙の日から30日以内に国会（特別会）を召集する（54条1項）。","衆議院の解散中に国に緊急の必要があるとき、内閣は参議院の緊急集会を求めることができる（54条2項）。","緊急集会でとった措置は臨時のもので、次の国会開会後10日以内に衆議院の同意がなければ効力を失う（54条3項）。","両議院の議事は総議員の3分の1以上の出席で開き、原則として出席議員の過半数で決し、可否同数なら議長が決める（56条）。"]},{"n":"衆議院の優越","p":["法律案は、衆議院で可決し参議院が異なる議決をしても、衆議院が出席議員の3分の2以上で再可決すれば法律となる（59条2項）。","参議院が衆議院可決の法律案を受け取って60日以内（休会中を除く）に議決しないとき、衆議院は否決とみなすことができる（59条4項）。","予算は衆議院が先に審議し、両院協議会でも一致しないか参議院が30日以内に議決しないと衆議院の議決が国会の議決となる（60条）。","条約の承認にも予算と同様の衆議院の優越があるが、衆議院の先議権はない（61条）。","首相の指名で両院が異なり両院協議会でも一致しないか、参議院が10日以内に指名しないと衆議院の議決が国会の議決となる（67条2項）。"]},{"n":"内閣と議院内閣制","p":["行政権は内閣に属する（65条）。内閣は首相とその他の国務大臣で組織され、全員が文民でなければならない（66条）。","首相は国会議員の中から国会の議決で指名される。国務大臣は首相が任命し、その過半数は国会議員から選ぶ（67条・68条）。","首相は国務大臣を任意に罷免できる。国務大臣は在任中、首相の同意がなければ訴追されない（68条2項・75条）。","内閣は行政権の行使について、国会に対し連帯して責任を負う（66条3項）。","内閣は法律の執行、外交関係の処理、条約の締結（国会の承認が必要）、予算の作成、政令の制定、恩赦の決定などを行う（73条）。"]},{"n":"衆議院の解散と内閣総辞職","p":["衆議院で不信任決議案が可決（信任決議案が否決）されたとき、内閣は10日以内に衆議院が解散されない限り総辞職する（69条）。","首相が欠けたときと、衆議院議員総選挙の後に初めて国会が召集されたときも、内閣は総辞職する（70条）。","実際には69条の場合に限らず、天皇の国事行為を定める7条を根拠に内閣の判断で衆議院が解散されている。","苫米地事件（1960年最高裁大法廷）は、衆議院の解散は高度の政治性をもつ統治行為で司法審査の対象外とした。","総辞職した内閣は、新たに首相が任命されるまで引き続き職務を行う（71条）。"]},{"n":"司法権の独立と裁判官","p":["特別裁判所の設置は禁止され、行政機関は終審として裁判できない。裁判官は良心に従い独立して職権を行う（76条）。","裁判官は心身の故障で職務不能と裁判で決定された場合と公の弾劾によらなければ罷免されず、行政機関は懲戒できない（78条）。","最高裁長官は内閣の指名に基づき天皇が任命し、他の最高裁判事は内閣が任命する。最高裁は長官と14人の判事で構成される。","最高裁裁判官は任命後初の衆議院総選挙の際と、その後10年を経過した後初の総選挙の際に国民審査を受ける（79条）。","下級裁判所の裁判官は最高裁が指名した者の名簿によって内閣が任命し、任期は10年で再任されうる（80条）。"]},{"n":"司法権の限界と違憲審査制","p":["司法権が及ぶのは法律上の争訟で、板まんだら事件（1981年最高裁）は信仰対象の価値判断が前提の訴えはこれに当たらないとした。","富山大学事件（1977年最高裁）は、大学の単位認定は一般市民法秩序と直接関係しない限り司法審査の対象外とした（部分社会論）。","2020年の最高裁大法廷判決は判例を変更し、地方議会議員に対する出席停止の懲罰も司法審査の対象となるとした。","警察予備隊違憲訴訟（1952年最高裁大法廷）は、具体的事件を離れて抽象的に違憲審査はできないとした（付随的審査制）。","81条により最高裁は違憲審査の終審裁判所で、下級裁判所も審査権をもつ。違憲の裁判には最高裁裁判官8人以上の意見の一致が必要である。"]},{"n":"財政","p":["国の財政を処理する権限は国会の議決に基づいて行使しなければならない（財政民主主義、83条）。","新たに租税を課し、または変更するには法律または法律の定める条件によることが必要である（租税法律主義、84条）。","旭川市国民健康保険条例事件（2006年最高裁大法廷）は、保険料に84条は直接適用されないが、その趣旨は及ぶとした。","予算は内閣が作成して国会に提出する（86条）。予備費は国会の議決に基づき設け、内閣の責任で支出し、事後に国会の承諾を得る（87条）。","決算はすべて毎年会計検査院が検査し、内閣は次の年度に検査報告とともに国会に提出する（90条）。"]},{"n":"地方自治","p":["92条の「地方自治の本旨」は、住民の意思で行う住民自治と、国から独立した団体が自ら行う団体自治からなる。","地方公共団体の長と議会の議員は、住民が直接選挙する（93条2項）。","地方公共団体は法律の範囲内で条例を制定できる（94条）。徳島市公安条例事件は、両者の趣旨・目的・内容・効果を比べて抵触を判断するとした。","1つの地方公共団体だけに適用される特別法は、その住民投票で過半数の同意を得なければ国会は制定できない（95条）。","地方自治法の直接請求では、条例の制定改廃と事務監査は有権者の50分の1以上、議会の解散と首長・議員の解職は原則3分の1以上の署名が必要である。"]}]},{"u":"民法総則","items":[{"n":"民法の基本原則と能力","p":["私権は公共の福祉に適合しなければならず、権利の行使と義務の履行は信義に従い誠実に行い、権利の濫用は許されない（1条）。","宇奈月温泉事件（1935年大審院）は、わずかな土地の侵害を口実に不当に高い買取りを迫る妨害排除請求を権利の濫用とした。","権利能力（権利・義務の主体となる資格）は出生によって始まる（3条1項）。胎児は相続などでは既に生まれたものとみなされる。","意思能力がない状態でした法律行為は無効である（3条の2）。2020年4月施行の改正で明文化された。"],"s":[5]},{"n":"成年年齢18歳と未成年者","p":["2022年4月1日施行の改正で、成年年齢は20歳から18歳に引き下げられた。","同改正で女性の婚姻開始年齢は16歳から18歳に引き上げられ、男女とも18歳になった。","未成年者が親の同意なくした契約は原則として取り消せるが、18歳・19歳はこの取消権を使えなくなった。","単に権利を得または義務を免れる行為や、処分を許された財産（小遣いなど）の処分は未成年者が単独でできる（5条）。","飲酒・喫煙と、競馬・競輪・オートレース・モーターボート競走の年齢制限は20歳のまま維持された。"],"s":[7,8]},{"n":"制限行為能力者制度","p":["制限行為能力者は未成年者・成年被後見人・被保佐人・被補助人の4種類である。","成年被後見人の法律行為は、日用品の購入その他日常生活に関する行為を除いて取り消すことができる（9条）。","被保佐人が借財・保証・不動産の売買など13条1項の重要な行為をするには保佐人の同意が必要である。","相手方は1か月以上の期間を定めて追認するかを催告できる（20条）。制限行為能力者が詐術を用いたときは取り消せない（21条）。","2026年6月公布の改正で後見・保佐を廃止して補助に一元化する。施行は公布から2年6か月以内の政令で定める日である。"],"s":[13]},{"n":"心裡留保と虚偽表示","p":["真意でないと知りながらした意思表示（心裡留保）は原則有効だが、相手方が真意でないと知りまたは知ることができたときは無効である（93条1項）。","心裡留保による無効は善意の第三者に対抗できない（93条2項、2020年改正で新設）。","相手方と通じてした虚偽の意思表示（通謀虚偽表示）は無効である（94条1項）。","虚偽表示の無効は善意の第三者に対抗できない（94条2項）。判例は第三者に無過失も登記も求めない。","判例は、真の権利者が虚偽の外観の作出に関与した場合にも94条2項を類推適用して善意の第三者を保護する。"]},{"n":"錯誤","p":["錯誤が法律行為の目的と取引上の社会通念に照らして重要なものであれば、意思表示を取り消せる（95条1項）。改正前は無効とされていた。","動機の錯誤（基礎事情の錯誤）は、その事情が法律行為の基礎とされていることが表示されていたときに限り取り消せる（95条2項）。","表意者に重大な過失があるときは取り消せない。ただし相手方が錯誤を知りまたは重過失で知らなかったときや、同じ錯誤に陥っていたときは取り消せる（95条3項）。","錯誤による取消しは、善意でかつ過失がない第三者に対抗できない（95条4項）。"],"s":[5]},{"n":"詐欺と強迫","p":["詐欺または強迫による意思表示は取り消すことができる（96条1項）。","第三者が詐欺をした場合は、相手方がその事実を知りまたは知ることができたときに限り取り消せる（96条2項）。","詐欺による取消しは善意・無過失の第三者に対抗できない（96条3項）。強迫による取消しは善意の第三者にも対抗できる。","第三者による強迫の場合は、相手方が強迫の事実を知らなくても取り消せる。","判例は、取消し後に現れた第三者との関係は、取消しによる復帰的な物権変動と第三者への譲渡を対抗問題（177条）として処理する。"]},{"n":"代理・無権代理・表見代理","p":["代理人が本人のためにすることを示して（顕名）した意思表示は、本人に対して直接効力を生じる（99条）。","代理権のない者がした契約は、本人が追認しなければ本人に効力を生じず（113条）、追認すると契約時にさかのぼって有効となる（116条）。","相手方は本人に追認するか催告でき、確答がなければ追認拒絶とみなされる（114条）。善意の相手方は本人の追認前なら取り消せる（115条）。","無権代理人は代理権を証明できず本人の追認も得られないとき、相手方の選択に従い履行または損害賠償の責任を負う（117条）。","代理権授与の表示（109条）、権限外の行為（110条）、代理権消滅後の行為（112条）では、信頼した相手方を保護するため本人が責任を負う（表見代理）。"]},{"n":"無効と取消し","p":["無効な行為は初めから効力がなく、追認しても原則として効力を生じない（119条）。","取り消された行為は初めから無効であったものとみなされる（121条）。","無効・取消しの場合、給付を受けた者は原状回復義務を負うが、制限行為能力者は現に利益を受けている限度で返還すれば足りる（121条の2）。","取消権は追認をすることができる時から5年、行為の時から20年を経過すると時効によって消滅する（126条）。","取り消せるのは、制限行為能力者や錯誤・詐欺・強迫により意思表示をした者、その代理人・承継人などに限られる（120条）。"]},{"n":"時効の基本ルール","p":["時効の効力は起算日にさかのぼる（144条）。当事者が援用しなければ、裁判所は時効によって裁判できない（145条）。","2020年の改正で、時効の「中断」は「更新」に、「停止」は「完成猶予」に再編された。","裁判上の請求をすると手続中は時効の完成が猶予され、確定判決などで権利が確定すると時効が更新され新たに進行する（147条）。","催告は6か月間完成を猶予するだけで更新はしない（150条）。協議を行う旨の書面での合意でも完成が猶予される（151条）。","債務者が権利を承認すると時効は更新される（152条）。時効の利益はあらかじめ放棄できない（146条）。"],"s":[5]},{"n":"取得時効と消滅時効","p":["所有の意思をもって平穏・公然と他人の物を20年間占有すると所有権を取得する。占有開始時に善意・無過失なら10年である（162条）。","債権は、権利を行使できることを知った時から5年、または権利を行使できる時から10年のいずれか早いほうで時効消滅する（166条1項）。","人の生命・身体の侵害による損害賠償請求権は、権利を行使できる時からの期間が20年に延長されている（167条）。","2020年の改正で、職業別の短期消滅時効と商事消滅時効（5年）は廃止された。","所有権は消滅時効にかからない。債権・所有権以外の財産権は、権利を行使できる時から20年で時効消滅する（166条2項）。"],"s":[5]}]},{"u":"物権","items":[{"n":"物権の性質と物権変動","p":["物権は物を直接・排他的に支配する権利で、民法その他の法律が定めるもの以外は創設できない（物権法定主義、175条）。","民法上の物権は占有権・所有権・地上権・永小作権・地役権・入会権・留置権・先取特権・質権・抵当権である。","物権の設定・移転は、当事者の意思表示のみによって効力を生じる（意思主義、176条）。","同じ物に物権と債権が競合すると原則として物権が優先する。ただし登記した不動産賃借権は後の物権取得者にも対抗できる（605条）。"]},{"n":"不動産の対抗要件","p":["不動産の物権の得喪・変更は、登記をしなければ第三者に対抗できない（177条）。","二重譲渡では先に登記を備えた者が優先し、契約の先後や単なる善意・悪意は問われない。","判例は、単なる悪意者は177条の第三者に含まれるが、背信的悪意者は含まれないとする。","不法占拠者や全くの無権利者に対しては、登記がなくても所有権を主張できる。","判例は、取消し後・解除後・時効完成後に現れた第三者との優劣を登記の先後で決める。"]},{"n":"動産・占有と即時取得","p":["動産の譲渡は引渡しが対抗要件で（178条）、引渡しには現実の引渡し・簡易の引渡し・占有改定・指図による占有移転がある。","取引行為によって平穏・公然・善意・無過失で動産の占有を始めた者は、その動産の権利を即時に取得する（192条）。","判例は、占有改定による引渡しでは即時取得は成立しないとする。","盗品・遺失物は、被害者・遺失者が盗難・遺失の時から2年間、占有者に回復を請求できる（193条）。","占有を奪われた者は、奪われた時から1年以内に占有回収の訴えを提起できる（200条・201条3項）。"]},{"n":"所有権と相隣関係","p":["所有者は法令の制限内で、自由にその所有物の使用・収益・処分をすることができる（206条）。","他の土地に囲まれて公道に通じない土地の所有者は、公道に出るためその周囲の土地を通行できる（210条）。","2023年4月施行の改正で、越境した竹木の枝は、催告しても相当期間内に切除されないときなどに土地所有者が自ら切り取れるようになった（233条）。","同改正で、他の土地を使わなければ電気・ガス・水道などを引き込めない場合の設備設置権が明文化された（213条の2）。"]},{"n":"共有","p":["各共有者は持分に応じて共有物の全部を使用でき（249条）、各共有者の持分は相等しいものと推定される（250条）。","共有物の変更には共有者全員の同意が必要だが、形状または効用の著しい変更を伴わない軽微な変更は持分価格の過半数で決められる（251条・252条）。","管理に関する事項は持分価格の過半数で決し、保存行為は各共有者が単独でできる（252条）。","各共有者はいつでも共有物の分割を請求できるが、5年を超えない期間内は分割しない特約もできる（256条）。","2023年4月施行の改正で、所在等不明共有者の持分を裁判所の決定を経て取得・譲渡できる制度が設けられた（262条の2・262条の3）。"]},{"n":"担保物権の種類と性質","p":["法律上当然に生じる法定担保物権は留置権・先取特権、当事者の契約で設定する約定担保物権は質権・抵当権である。","担保物権には付従性・随伴性・不可分性・物上代位性という通有性がある。ただし留置権には物上代位性がない。","留置権は、他人の物の占有者がその物に関して生じた債権の弁済を受けるまで、その物を留置できる権利である（295条）。","質権の設定は、債権者に目的物を引き渡すことで効力を生じる（344条）。","非典型担保である譲渡担保・所有権留保を定める新法が2025年6月に公布された。施行は公布から2年6か月以内の政令で定める日である。"]},{"n":"抵当権","p":["抵当権は、債務者などが占有を移さずに不動産を担保に供し、債権者が他の債権者に先立って弁済を受けられる権利である（369条）。","抵当権の効力は目的不動産に付加して一体となった物に及び（370条）、判例は設定当時の従物にも及ぶとする。","目的物の売却・賃貸・滅失で債務者が受ける金銭などにも、払渡し前に差し押さえれば抵当権を行使できる（物上代位、372条・304条）。","土地と建物が同一所有者に属し、抵当権の実行で所有者が別々になったときは、建物のために法定地上権が成立する（388条）。","根抵当権は、一定の範囲に属する不特定の債権を極度額の限度で担保する抵当権である（398条の2）。"]}]},{"u":"債権総論","items":[{"n":"2020年債権法改正の要点","p":["民法の債権関係の規定を約120年ぶりに大きく見直した改正で、一部を除き2020年4月1日に施行された。","主な内容は、消滅時効の整理・統一、法定利率の引下げと変動制、保証人の保護、債権譲渡の見直し、定型約款の新設である。","意思能力を欠く者の法律行為の無効や、将来債権を譲渡できることなど、判例・解釈で認められていたルールが明文化された。","売主の瑕疵担保責任は契約不適合責任に改められ、錯誤の効果は無効から取消しに変わった。"],"s":[5]},{"n":"債務不履行","p":["債務者が債務の本旨に従った履行をしないとき、または履行が不能のとき、債権者は損害賠償を請求できる（415条1項）。","不履行が契約などの債務の発生原因と取引上の社会通念に照らして債務者の責めに帰することができない事由によるときは、賠償責任を負わない。","履行不能のとき債権者は履行を請求できない（412条の2第1項）。契約時に既に不能でも損害賠償の請求は妨げられない（同条2項）。","不確定期限のある債務は、期限到来後に履行の請求を受けた時か期限到来を知った時のいずれか早い時から遅滞となる（412条2項）。","履行遅滞中に当事者双方の責めに帰することができない事由で履行不能になったときも、債務者の責めに帰すべき不能とみなされる（413条の2）。"]},{"n":"損害賠償と法定利率","p":["賠償の範囲は通常生ずべき損害で、特別の事情による損害は当事者がその事情を予見すべきであったときに賠償する（416条）。","債務不履行やその損害の発生・拡大について債権者に過失があれば、裁判所はこれを考慮して責任と額を定める（過失相殺、418条）。","金銭債務の不履行の損害賠償額は法定利率で定め、債権者は損害を証明する必要がなく、債務者は不可抗力を抗弁にできない（419条）。","法定利率は2020年4月に年5%から年3%に引き下げられ、3年ごとに見直す変動制となり、商事法定利率は廃止された（404条）。","2026年4月1日から2029年3月31日までの期間も、法定利率は年3%のまま変わらない。"],"s":[5,6]},{"n":"契約の解除と危険負担","p":["相手方が債務を履行しないとき、相当の期間を定めて催告し、期間内に履行がなければ解除できる。不履行が軽微なときは解除できない（541条）。","履行不能、債務者の明確な履行拒絶、定期行為の時期の経過などの場合は、催告せずに直ちに解除できる（542条）。","2020年の改正で解除に債務者の帰責事由は不要となった。ただし債権者の責めに帰すべき不履行では債権者は解除できない（543条）。","当事者双方の責めに帰することができない事由で履行不能になったとき、債権者は反対給付の履行を拒むことができる（536条1項）。","双務契約の当事者は、相手方が債務の履行を提供するまで自己の債務の履行を拒める（同時履行の抗弁権、533条）。"]},{"n":"債権者代位権と詐害行為取消権","p":["債権者は自己の債権を保全するため必要があるとき、債務者に属する権利を代わりに行使できる（債権者代位権、423条）。","登記請求権の代位のように、特定の債権を保全するためなら債務者の資力にかかわらず代位できる（423条の7）。","債権者は、債務者が債権者を害することを知ってした行為の取消しを裁判所に請求できる（詐害行為取消権、424条）。","詐害行為取消請求の訴えは、債権者が詐害行為を知った時から2年、行為の時から10年を経過すると提起できない（426条）。","取消債権者は、受益者などに金銭や動産を直接自分に引き渡すよう求めることができる（424条の9）。"]},{"n":"保証","p":["保証契約は書面（または電磁的記録）でしなければ効力を生じない（446条2項・3項）。","通常の保証人には催告の抗弁権と検索の抗弁権があるが、連帯保証人にはない（452条〜454条）。","個人が保証人となる根保証契約は、極度額を定めなければ効力を生じない（465条の2）。","事業用の貸金債務を個人が保証するには、原則として契約前1か月以内に公正証書で保証意思を表示する必要がある。経営者等は例外（465条の6以下）。","主債務者が期限の利益を失ったとき、債権者はそれを知った時から2か月以内に個人の保証人へ通知しなければならない（458条の3）。"],"s":[5]},{"n":"債権譲渡","p":["債権は原則として譲渡でき、まだ発生していない将来の債権も譲渡できる（466条1項・466条の6）。","2020年の改正で、譲渡制限特約があっても債権譲渡は有効とされた。悪意・重過失の譲受人に対し債務者は履行を拒める。預貯金債権は例外。","債務者に対抗するには、譲渡人から債務者への通知または債務者の承諾が必要である（467条1項）。","債務者以外の第三者に対抗するには、確定日付のある証書による通知または承諾が必要である（467条2項）。","判例は、確定日付のある通知が複数あるときは、通知が債務者に到達した先後で譲受人の優劣を決める。"],"s":[5]}]},{"u":"契約各論と不法行為","items":[{"n":"契約の成立と定型約款","p":["契約は申込みに対して相手方が承諾したときに成立し、法令に特別の定めがある場合を除き書面などの方式は不要である（522条）。","2020年の改正で承諾の発信主義の規定は削除され、承諾も相手方に到達した時に効力を生じる（97条1項）。","定型約款とは、定型取引において契約の内容とすることを目的として準備された条項の総体をいう（548条の2）。","定型約款を契約内容とする合意や表示があれば個別条項に合意したとみなされるが、信義則に反し相手方の利益を一方的に害する条項は除かれる。","相手方の一般の利益に適合する場合などには、定型約款準備者は相手方と合意せずに約款を変更できる（548条の4）。"],"s":[5]},{"n":"売買と手付","p":["売買は財産権の移転と代金の支払を約束することで成立する諾成・双務・有償の契約である（555条）。","解約手付が交付されると、相手方が履行に着手するまでは、買主は手付を放棄し、売主は倍額を現実に提供して解除できる（557条）。","判例は、手付は特別の意思表示がない限り解約手付と推定されるとする。","他人の物の売買も有効で、売主はその権利を取得して買主に移転する義務を負う（561条）。"]},{"n":"契約不適合責任","p":["引き渡された目的物が種類・品質・数量について契約の内容に適合しないとき、買主は修補・代替物引渡しなどの追完を請求できる（562条）。","相当の期間を定めて追完を催告し、期間内に追完がないときは、買主は不適合の程度に応じて代金の減額を請求できる（563条）。","買主は415条による損害賠償の請求と、541条・542条による解除もできる（564条）。","種類・品質の不適合は、買主が知った時から1年以内に売主へ通知しないと権利を失う。売主が悪意・重過失なら制限はない（566条）。","改正前の瑕疵担保責任と異なり、不適合が「隠れた」ものである必要はなく、契約の内容に適合するかが基準となる。"]},{"n":"賃貸借と敷金","p":["賃貸借の存続期間は50年を超えることができない（604条）。不動産賃借権は登記すれば第三者に対抗できる（605条）。","賃借人は賃貸人の承諾なく賃借権の譲渡・転貸ができない（612条）。判例は背信的行為と認めるに足りない特段の事情があれば解除を認めない。","敷金は賃借人の債務を担保する金銭で、賃貸借が終了し物が返還されたとき、未払賃料などを差し引いた残額を返還する（622条の2）。","賃借人は、通常の使用による損耗と経年変化については原状回復義務を負わない（621条）。","借地借家法では借地権の存続期間は30年以上で、建物の賃貸人は正当事由がなければ更新拒絶や解約申入れができない（3条・28条）。"],"s":[5]},{"n":"請負と委任","p":["請負は仕事の完成を約束し、その結果に報酬を支払う契約で、報酬は原則として目的物の引渡しと同時に支払う（632条・633条）。","請負の目的物の契約不適合には売買の規定が準用され、注文者は不適合を知った時から1年以内に通知しなければならない（637条）。","注文者は仕事が完成する前であれば、いつでも損害を賠償して請負契約を解除できる（641条）。","委任の受任者は、報酬の有無にかかわらず善良な管理者の注意をもって事務を処理する義務を負い、特約がなければ報酬を請求できない（644条・648条）。","委任は各当事者がいつでも解除できるが、相手方に不利な時期の解除などは、やむを得ない事由がない限り損害を賠償する（651条）。"]},{"n":"一般不法行為","p":["故意または過失によって他人の権利または法律上保護される利益を侵害した者は、生じた損害を賠償する責任を負う（709条）。","成立要件は、故意・過失、権利・法益の侵害、損害の発生、行為と損害の因果関係、加害者の責任能力である。","財産以外の損害も賠償の対象となり、精神的苦痛に対する慰謝料を請求できる（710条）。","責任を弁識する知能のない未成年者や、精神上の障害で弁識能力を欠く状態にある者は賠償責任を負わない（712条・713条）。","責任無能力者が責任を負わない場合は監督義務者が賠償責任を負うが、監督義務を怠らなかったことを証明すれば免れる（714条）。"]},{"n":"使用者責任と特殊不法行為","p":["事業のために他人を使用する者は、被用者が事業の執行について第三者に加えた損害を賠償する責任を負う（使用者責任、715条）。","使用者は被用者の選任・監督に相当の注意をしたことを証明すれば免責されるが、実際に認められることはほとんどない。","判例は、行為の外形から職務の範囲内とみえれば「事業の執行について」に当たるとする（外形標準説）。","土地の工作物の瑕疵による損害は、まず占有者が責任を負い、占有者が必要な注意をしていたときは所有者が無過失責任を負う（717条）。","数人が共同の不法行為で他人に損害を加えたときは、各自が連帯して賠償責任を負う（719条）。"]},{"n":"過失相殺と不法行為の時効","p":["被害者に過失があったときは、裁判所はこれを考慮して損害賠償の額を定めることができる（722条2項）。","判例は、過失相殺には被害者に事理を弁識する能力があれば足り、責任能力までは必要ないとする。","判例は、被害者と身分上・生活関係上一体をなす者（幼児の親など）の過失も被害者側の過失として考慮できるとする。","不法行為の損害賠償請求権は、損害と加害者を知った時から3年、不法行為の時から20年で時効消滅する（724条）。","人の生命・身体を害する不法行為では、損害と加害者を知った時からの期間が5年に延長されている（724条の2）。"],"s":[5]}]},{"u":"親族","items":[{"n":"婚姻の成立と効力","p":["婚姻は18歳にならなければできない（731条）。重婚や、直系血族・3親等内の傍系血族の間の婚姻はできない（732条・734条）。","婚姻は戸籍法の定めに従って届け出ることで効力を生じる（739条）。","夫婦は婚姻の際に定めるところに従い、夫または妻の氏を称する（750条）。","夫婦は同居・協力・扶助の義務を負い、日常の家事に関する債務については連帯して責任を負う（752条・761条）。","2026年4月施行の改正で、夫婦間の契約は婚姻中いつでも取り消せるとした規定は削除された。"],"s":[1,7]},{"n":"離婚の方法と原因","p":["離婚には協議離婚・調停離婚・審判離婚・裁判離婚があり、協議離婚は届出によって成立する（763条・764条）。","裁判離婚の原因は、不貞行為、悪意の遺棄、3年以上の生死不明、その他婚姻を継続し難い重大な事由である（770条）。","2026年4月施行の改正で、「強度の精神病にかかり回復の見込みがない」ことは裁判離婚の原因から削除された。","離婚訴訟を起こす前には、原則として家庭裁判所の調停を経なければならない（調停前置主義）。","1987年の最高裁大法廷判決は、有責配偶者からの離婚請求も、長期間の別居や未成熟子がいないことなどの条件のもとで認めうるとした。"],"s":[1]},{"n":"財産分与と養育費","p":["離婚した者の一方は相手方に財産分与を請求できる。2026年4月施行の改正で、請求できる期間は離婚後2年から5年に延びた。","同改正で財産分与の考慮要素が明示され、財産の形成・維持への寄与の程度は原則として2分の1ずつとされた。","養育費債権に先取特権が付与され、父母間で取り決めた文書があれば差押えを申し立てられる（子1人当たり月8万円まで）。","取決めがなくても、子を主に監護する親は子1人当たり月2万円の法定養育費を請求できる。施行日前に離婚した場合には適用されない。","父母は婚姻の有無にかかわらず子を扶養する責務を負い、子が親と同程度の生活を維持できる水準が求められる（生活保持義務）。"],"s":[0,1]},{"n":"嫡出推定と嫡出否認","p":["2024年4月1日施行の改正で、婚姻成立後200日以内に生まれた子も夫の子と推定されるようになった（772条）。","婚姻の解消後300日以内に生まれた子でも、母が再婚した後に生まれた場合は再婚後の夫の子と推定される。","嫡出否認の訴えは夫だけでなく子と母も提起でき、子の利益を害することが明らかでなければ前夫も否認できる（774条）。","否認の訴えの期間は1年から3年に延び、父は子の出生を知った時から、子と母は子の出生の時から起算する（777条）。","同じ改正で、女性の再婚禁止期間を定めた733条は削除された。"],"s":[12]},{"n":"認知と養子","p":["嫡出でない子は父の認知によって法律上の父子関係が生じ、認知の効力は出生の時にさかのぼる（779条・784条）。","成年の子を認知するにはその子の承諾が、胎児を認知するには母の承諾が必要である（782条・783条）。","2024年4月施行の改正で、認知無効の訴えは原則として7年以内に提起しなければならないとされた（786条）。","養親となるには20歳に達していることが必要で、成年年齢の引下げ後も20歳のまま維持された（792条）。","特別養子縁組は実方との親族関係を終了させる縁組で、2020年4月施行の改正で養子の年齢上限が原則6歳未満から15歳未満に引き上げられた。"],"s":[12]},{"n":"親権","p":["成年に達しない子は父母の親権に服し、婚姻中は父母が共同して親権を行う（818条）。","親権には子の監護・教育の権利義務と、子の財産の管理・財産上の行為の代理が含まれる（820条・824条）。","2022年12月施行の改正で懲戒権の規定（822条）は削除され、子の人格の尊重と体罰など有害な言動の禁止が定められた（821条）。","2026年4月施行の改正で、親権は子の利益のために行使しなければならないことが明記された。","親権者と子の利益が相反する行為については、家庭裁判所が選任する特別代理人が子を代理する（826条）。"],"s":[1,12]},{"n":"離婚後の共同親権","p":["2024年5月公布の改正民法が2026年4月1日に施行され、離婚後も父母の双方を親権者とする共同親権を選べるようになった。","協議離婚では父母の協議で共同親権か単独親権かを決め、協議が調わないときや裁判離婚では家庭裁判所が子の利益の観点から定める。","虐待のおそれやDVのおそれなどで共同して親権を行うことが困難なときは、家庭裁判所は必ず単独親権と定める。","共同親権でも、監護・教育に関する日常の行為や、子の利益のため急迫の事情がある場合は、父母の一方が単独で親権を行使できる。","特定の事項で父母の意見が対立するときは、家庭裁判所が親権を行使する者を指定できる。"],"s":[0,1]}]},{"u":"相続","items":[{"n":"相続人と代襲相続","p":["配偶者は常に相続人となり、血族は子（第1順位）、直系尊属（第2順位）、兄弟姉妹（第3順位）の順に相続人となる（887条・889条・890条）。","胎児は相続については既に生まれたものとみなされる（886条）。","相続人となる子・兄弟姉妹が相続開始以前に死亡し、または欠格・廃除で相続権を失ったときは、その子が代襲相続する（887条2項・889条2項）。","子の代襲は孫・ひ孫へと再代襲されるが、兄弟姉妹の代襲はその子（おい・めい）までである。","相続放棄は代襲原因にならないため、相続を放棄した者の子は代襲相続しない。"]},{"n":"法定相続分","p":["配偶者と子が相続人の場合は各2分の1、配偶者と直系尊属の場合は配偶者3分の2・直系尊属3分の1である（900条）。","配偶者と兄弟姉妹が相続人の場合は、配偶者4分の3・兄弟姉妹4分の1である。","同順位の血族が複数いれば均等に分ける。嫡出でない子の相続分は2013年の改正で嫡出子と同じになった。","父母の一方だけを同じくする兄弟姉妹の相続分は、父母の双方を同じくする兄弟姉妹の2分の1である（900条4号）。"]},{"n":"承認・放棄と欠格・廃除","p":["相続人は、自己のために相続の開始があったことを知った時から3か月以内に、単純承認・限定承認・放棄のいずれかを選ぶ（915条）。","期間内に限定承認も放棄もしなかったときや、相続財産を処分したときは単純承認したものとみなされる（921条）。","限定承認は相続人全員が共同して行う（923条）。放棄は家庭裁判所への申述で行い、初めから相続人でなかったものとみなされる（939条）。","被相続人を故意に死亡させて刑に処せられた者や、遺言書を偽造・破棄・隠匿した者などは当然に相続人になれない（相続欠格、891条）。","遺留分をもつ推定相続人が虐待や重大な侮辱などをしたとき、被相続人は家庭裁判所に廃除を請求できる（892条）。"]},{"n":"遺産分割","p":["共同相続人はいつでも協議で遺産を分割でき、協議が調わないときは家庭裁判所に分割を請求できる（907条）。","婚姻期間20年以上の夫婦間で居住用不動産を遺贈・贈与したときは、持戻し免除の意思表示があったと推定される（903条4項）。","各相続人は遺産分割前でも、預貯金額の3分の1に法定相続分を掛けた額（同一金融機関で150万円まで）を単独で払い戻せる。","2023年4月施行の改正で、相続開始から10年を過ぎた後の遺産分割では、原則として特別受益や寄与分を主張できなくなった。","相続人でない親族が無償で療養看護などをして財産の維持・増加に貢献したときは、相続人に特別寄与料を請求できる（1050条）。"],"s":[9]},{"n":"遺言の方式","p":["15歳に達した者は遺言をすることができる（961条）。普通方式の遺言は自筆証書・公正証書・秘密証書の3種類である（967条）。","自筆証書遺言は全文・日付・氏名を自書し押印する（968条）。2019年1月13日以降、財産目録は自書不要だが各頁に署名押印が必要である。","公正証書遺言は、証人2人以上の立会いのもとで遺言者が趣旨を口授し、公証人が筆記して作成する（969条）。","2026年6月公布の改正で、自筆証書遺言・秘密証書遺言などの押印要件は廃止される。施行は公布から1年以内の政令で定める日である。","同改正で、法務局の遺言書保管官の前で全文を口述するなどして作る保管証書遺言が新設される（公布から3年以内に施行）。"],"s":[9,13]},{"n":"遺言書保管制度と検認","p":["自筆証書遺言は法務局（遺言書保管所）に保管を申請でき、この制度は2020年7月10日に始まった。","法務局に保管された自筆証書遺言は、家庭裁判所の検認が不要である。","保管制度を使わない自筆証書遺言と秘密証書遺言は、相続開始後に家庭裁判所の検認を受けなければならない。公正証書遺言は不要（1004条）。","遺言者が死亡すると、遺言者があらかじめ指定した者（3名まで）に遺言書が保管されていることを通知する制度がある。","遺言はいつでも遺言の方式で撤回でき、前の遺言と抵触する後の遺言があれば抵触する部分は撤回したものとみなされる（1022条・1023条）。"]},{"n":"遺留分","p":["遺留分は兄弟姉妹以外の相続人に認められ、直系尊属のみが相続人なら遺産の3分の1、それ以外は2分の1が全体の遺留分となる（1042条）。","2019年7月1日施行の改正で、遺留分減殺請求は侵害額に相当する金銭の支払を求める遺留分侵害額請求に改められた（1046条）。","受遺者などが直ちに金銭を用意できないときは、裁判所が支払に相当の期限を与えることができる。","算定の基礎に入れる生前贈与は原則として相続開始前1年間のものだが、相続人への特別受益にあたる贈与は10年間のものが入る（1044条）。","遺留分侵害額請求権は、相続の開始と侵害する贈与・遺贈を知った時から1年、相続開始の時から10年で消滅する（1048条）。"],"s":[9]},{"n":"配偶者居住権","p":["配偶者居住権は、相続開始時に被相続人所有の建物に住んでいた配偶者が、終身または一定期間その建物に無償で住み続けられる権利である。","配偶者居住権は遺産分割や遺贈などによって取得でき、2020年4月1日に施行された（1028条）。","配偶者居住権は登記すれば第三者に対抗でき（1031条）、譲渡することはできない（1032条）。","配偶者短期居住権は、遺産分割が終わるまでなど比較的短い期間、配偶者が無償で建物に住み続けられる権利である（1037条）。","建物の取得者は配偶者短期居住権の消滅を申し入れられるが、配偶者は申入れから6か月間は住み続けられる。"],"s":[9]},{"n":"相続登記・住所変更登記の義務化","p":["2024年4月1日から、相続で不動産を取得したことを知った日から3年以内に相続登記を申請することが義務となった。","遺産分割で不動産を取得した者は、遺産分割の日から3年以内にその内容に応じた登記をしなければならない。","正当な理由なく怠ると10万円以下の過料の対象となる。施行前に開始した相続も対象で、2027年3月31日までの登記が必要である。","相続人申告登記は自分が相続人であることを法務局に申し出る簡易な方法で、申し出た相続人は義務を履行したとみなされる。","2026年4月1日から住所・氏名の変更登記も変更から2年以内の義務となり、違反は5万円以下の過料の対象。施行前の変更は2028年3月末まで。"],"s":[10,11]}]},{"u":"刑法総論","items":[{"n":"罪刑法定主義","p":["どのような行為が犯罪となり、どのような刑罰が科されるかを、あらかじめ法律で定めておかなければならないとする原則である。","憲法31条（法定手続の保障）と39条（遡及処罰の禁止）がその根拠とされる。","派生原則として、慣習刑法の排除、刑罰法規の不遡及、類推解釈の禁止、絶対的不定期刑の禁止、明確性の原則がある。","条例の罰則について、判例（1962年最高裁大法廷）は法律による相当程度に具体的で限定された委任があれば許されるとした。"]},{"n":"犯罪の成立要件と責任能力","p":["犯罪は、構成要件に該当し、違法で、有責な行為である。","違法性阻却事由には正当防衛・緊急避難のほか、法令または正当な業務による行為（正当行為、35条）がある。","心神喪失者の行為は罰せず、心神耗弱者の行為はその刑を必ず減軽する（39条）。","14歳に満たない者の行為は罰しない（41条）。","違法性の意識の可能性や適法行為の期待可能性がない場合にも責任が否定されうるとする考え方がある。"]},{"n":"因果関係","p":["結果の発生を要件とする犯罪では、実行行為と結果との間に因果関係がなければ既遂にならない。","条件説は「その行為がなければその結果は生じなかった」という条件関係があれば因果関係を認める。","相当因果関係説は、条件関係に加え、その行為からその結果が生じることが社会通念上相当といえることを求める。","判例は行為の危険が結果に現実化したかを重視し、大阪南港事件（1990年最高裁決定）は第三者の暴行が介在しても因果関係を認めた。"]},{"n":"故意と過失","p":["罪を犯す意思（故意）がない行為は罰しない。ただし法律に特別の規定がある過失犯は処罰される（38条1項）。","結果の発生を確実とは思わなくても、生じてもかまわないと認容していれば未必の故意として故意が認められる。","重い罪に当たる事実を知らずに罪を犯した者は、その重い罪によって処断されない（38条2項）。","法律を知らなかったとしても故意がなかったとはいえない。ただし情状により刑を減軽できる（38条3項）。","判例は、認識した事実と発生した事実が同じ構成要件の範囲内で符合すれば故意を認める（法定的符合説）。"]},{"n":"正当防衛","p":["急迫不正の侵害に対して、自己または他人の権利を防衛するため、やむを得ずにした行為は罰しない（36条1項）。","「急迫」とは法益侵害が現に存在するか間近に迫っていることで、過去の侵害や将来予想される侵害には認められない。","自分の権利だけでなく、他人の権利を守るための防衛も正当防衛となる。","防衛の程度を超えた行為は過剰防衛となり、情状により刑を減軽または免除できる（36条2項）。","判例は、侵害を予期したうえで積極的に加害する意思で侵害に臨んだ場合には急迫性を否定する。"]},{"n":"緊急避難","p":["自己または他人の生命・身体・自由・財産に対する現在の危難を避けるため、やむを得ずにした行為は、生じた害が避けようとした害を超えなければ罰しない（37条1項）。","正当防衛と違い、危難と無関係な第三者の法益を害する場合を含むため、要件がより厳格である。","他に避ける方法がないこと（補充性）と、生じた害が避けようとした害を超えないこと（法益の権衡）が必要である。","程度を超えた行為は過剰避難となり、情状により刑を減軽または免除できる（37条1項ただし書）。","業務上特別の義務がある者には、自己の危難についての緊急避難の規定は適用されない（37条2項）。"]},{"n":"未遂と中止犯","p":["犯罪の実行に着手してこれを遂げなかった者は、その刑を減軽することができる（43条本文、任意的減軽）。","自己の意思により犯罪を中止したときは、刑を必ず減軽または免除する（43条ただし書、中止犯）。","未遂を処罰するのは、各本条で定める場合に限られる（44条）。","結果の発生がおよそ不可能な不能犯は処罰されない。","実行の着手前の準備である予備は、殺人・強盗・放火など特別の規定がある場合に限って処罰される。"]},{"n":"共犯","p":["2人以上共同して犯罪を実行した者は、すべて正犯とする（共同正犯、60条）。","練馬事件（1958年最高裁大法廷）は、共謀に加わった者は実行行為を分担しなくても共同正犯になるとした（共謀共同正犯）。","人を教唆して犯罪を実行させた者には、正犯の刑を科する（教唆犯、61条）。","正犯を幇助した者は従犯とし、従犯の刑は正犯の刑を減軽する（62条・63条）。","拘留または科料のみに処すべき罪の教唆者・従犯は、特別の規定がなければ罰しない（64条）。"]},{"n":"刑罰の種類と拘禁刑","p":["主刑は死刑・拘禁刑・罰金・拘留・科料で、付加刑は没収である（9条）。","2025年6月1日施行の改正刑法で懲役と禁錮が廃止され、拘禁刑に一本化された。","拘禁刑では刑事施設に拘置し、改善更生のため必要な作業を行わせ、または必要な指導を行うことができる。作業は一律の義務ではない。","有期拘禁刑は1月以上20年以下で、加重するときは30年まで上げ、減軽するときは1月未満に下げることができる（12条・14条）。","罰金は1万円以上、科料は1000円以上1万円未満、拘留は1日以上30日未満である（15条〜17条）。"],"s":[3,4]},{"n":"執行猶予","p":["3年以下の拘禁刑または50万円以下の罰金を言い渡すとき、情状により1年以上5年以下の期間、刑の全部の執行を猶予できる（25条1項）。","2025年6月施行の改正で、再度の全部執行猶予を言い渡せる刑の上限が1年以下から2年以下の拘禁刑に引き上げられた（25条2項）。","再度の執行猶予には、情状に特に酌量すべきものがあることが必要である。","猶予の言渡しを取り消されることなく猶予期間を経過すると、刑の言渡しは効力を失う（27条）。","同改正で、猶予期間内の罪で起訴されていれば期間経過後も刑の言渡しの効力が続き、猶予を取り消せる仕組みが設けられた。"],"s":[4]}]},{"u":"刑法各論と性犯罪改正","items":[{"n":"生命・身体に対する罪","p":["殺人罪の法定刑は死刑または無期もしくは5年以上の拘禁刑である（199条）。","傷害罪は15年以下の拘禁刑または50万円以下の罰金（204条）。暴行を加えたが傷害に至らなければ暴行罪となる（208条）。","殺意なく身体を傷害し、その結果人を死亡させたときは傷害致死罪で、3年以上の有期拘禁刑となる（205条）。","業務上必要な注意を怠って人を死傷させた者は業務上過失致死傷罪となる（211条）。"]},{"n":"窃盗と強盗","p":["他人の財物を窃取した者は窃盗罪で、10年以下の拘禁刑または50万円以下の罰金となる（235条）。","判例は窃盗罪の成立に、権利者を排除し他人の物を自己の所有物として利用・処分する意思（不法領得の意思）を求める。","暴行・脅迫を用いて他人の財物を強取した者は強盗罪で、5年以上の有期拘禁刑。暴行・脅迫は相手の反抗を抑圧する程度のものが必要である（236条）。","窃盗犯が財物の取り返しを防ぐためなどに暴行・脅迫をすると、事後強盗罪として強盗と同じく扱われる（238条）。","強盗が人を負傷させると無期または6年以上の拘禁刑、死亡させると死刑または無期拘禁刑となる（強盗致死傷罪、240条）。"]},{"n":"詐欺・恐喝・横領・背任","p":["人を欺いて財物を交付させた者は詐欺罪で、10年以下の拘禁刑となる（246条）。欺く行為・錯誤・交付行為・財物の移転の因果の流れが必要。","人を恐喝して財物を交付させた者は恐喝罪で、10年以下の拘禁刑となる（249条）。","自己の占有する他人の物を横領すると横領罪で5年以下の拘禁刑、業務上占有する物なら業務上横領罪で10年以下の拘禁刑となる（252条・253条）。","他人のためにその事務を処理する者が、自己や第三者の利益を図り任務に背いて本人に財産上の損害を加えると背任罪となる（247条）。","配偶者・直系血族・同居の親族の間で窃盗・詐欺・横領などを犯したときは刑が免除される（親族相盗例、244条）。"]},{"n":"放火と住居侵入","p":["現に人が住居に使用し、または現に人がいる建造物などに放火して焼損すると、死刑または無期もしくは5年以上の拘禁刑となる（108条）。","判例は、火が媒介物を離れて目的物が独立して燃焼を続ける状態になれば「焼損」にあたるとする（独立燃焼説）。","放火罪は不特定または多数の人の生命・財産を危険にさらす公共危険罪である。","正当な理由なく人の住居や人が看守する建造物などに侵入すると住居侵入罪で、3年以下の拘禁刑または10万円以下の罰金となる（130条）。"]},{"n":"名誉毀損と侮辱","p":["公然と事実を摘示して人の名誉を毀損すると、その事実が真実かどうかにかかわらず名誉毀損罪となる（230条）。","公共の利害に関する事実で、公益を図る目的があり、真実であると証明されたときは罰しない（230条の2）。","判例は、真実の証明がなくても、確実な資料・根拠に照らし真実と誤信したことに相当の理由があれば犯罪は成立しないとする。","事実を摘示せず公然と人を侮辱すると侮辱罪。2022年7月施行の改正で拘留・科料のみから引き上げられ、現在は1年以下の拘禁刑・30万円以下の罰金・拘留・科料。","名誉毀損罪と侮辱罪は、告訴がなければ公訴を提起できない親告罪である（232条）。"],"s":[4]},{"n":"不同意性交等罪・わいせつ罪","p":["2023年7月13日施行の改正で、強制性交等罪は不同意性交等罪（177条）に、強制わいせつ罪は不同意わいせつ罪（176条）に改められた。","同意しない意思を形成・表明・全うすることが困難な状態にさせ、またはその状態に乗じて性交等・わいせつな行為をすると処罰される。","原因となる行為・事由は、暴行・脅迫、心身の障害、アルコール・薬物、睡眠など、不意打ち、恐怖・驚愕、虐待による心理反応、地位による影響力の8類型。","婚姻関係の有無にかかわらず成立することが明記された。性交等には膣・肛門に陰茎以外の身体の一部や物を挿入する行為も加わった。","法定刑は、不同意性交等罪が5年以上の有期拘禁刑、不同意わいせつ罪が6月以上10年以下の拘禁刑である。"],"s":[2]},{"n":"性交同意年齢と新設罪","p":["性交同意年齢は13歳から16歳に引き上げられ、16歳未満の者への性交等・わいせつな行為は同意の有無にかかわらず処罰される。","ただし相手が13歳以上16歳未満の場合は、行為者が5歳以上年長であるときに限り、年齢だけを理由に処罰される。","年齢差が5歳未満でも、8類型などによる不同意の要件を満たせば処罰されうる。","16歳未満の者に、わいせつ目的で威迫・偽計・利益供与などの手段で面会を要求する行為などを罰する面会要求等罪が新設された（182条）。","同罪は、16歳未満の者に性的な姿態の写真や動画を撮って送るよう要求する行為も処罰の対象とする。"],"s":[2]},{"n":"性犯罪の公訴時効と撮影罪","p":["2023年の改正で性犯罪の公訴時効期間は5年延長され、不同意性交等罪は15年、不同意わいせつ罪は12年となった。","被害者が18歳未満の場合は、犯罪が終わった時から被害者が18歳になる日までの期間が公訴時効期間に加算される。","例えば12歳で不同意性交等罪の被害に遭った場合、被害者が33歳に達するまで公訴時効は完成しない。","性的姿態撮影等処罰法により、性的な部位や下着などをひそかに撮影する行為などが性的姿態等撮影罪として処罰される。","同法は、撮影した記録の提供・公然陳列やそのための保管、ライブストリーミングによる配信とその記録も処罰する。"],"s":[2]}]},{"u":"行政法・会社法の入口","items":[{"n":"法律による行政の原理","p":["行政は法律に従って行わなければならないとする原理で、法律の優位・法律の留保・法律の法規創造力からなる。","法律の留保について、通説・実務は国民の権利を制限し義務を課す行政には法律の根拠が必要とする（侵害留保説）。","行政機関が定める法規命令には、法律の委任による委任命令と、法律を執行するための執行命令がある。","行政組織内部の基準である行政規則（通達など）は、原則として国民や裁判所を拘束しない。"]},{"n":"行政行為の効力と瑕疵","p":["行政行為（処分）は、行政庁が法律に基づき一方的に国民の権利義務を具体的に決める行為である。","違法な行政行為でも、権限ある機関に取り消されるまでは有効とされる（公定力）。不服申立期間などを過ぎると国民から争えなくなる（不可争力）。","判例は、重大かつ明白な瑕疵がある行政行為は無効で、公定力が及ばずいつでも無効を主張できるとする。","取消しは成立時の瑕疵を理由にさかのぼって効力を失わせ、撤回は後発的な事情を理由に将来に向かって効力を失わせる。","行政行為には条件・期限・負担・撤回権の留保などの附款を付けることができ、法律が認める場合や裁量の範囲内で許される。"]},{"n":"行政手続法","p":["処分・行政指導・届出・命令等制定の手続の共通事項を定め、行政運営の公正の確保と透明性の向上を図る法律で、1994年に施行された。","申請に対する処分では、審査基準の設定・公表、標準処理期間の設定（努力義務）、拒否する場合の理由の提示が定められている。","不利益処分のうち許認可の取消しなど重いものには聴聞を、それ以外には弁明の機会の付与を原則として行う（13条）。","行政指導は相手方の任意の協力によって実現されるもので、従わなかったことを理由に不利益な取扱いをしてはならない（32条）。","命令等を定めるときは原則として意見公募手続（パブリックコメント）を行い、意見提出期間は30日以上とする（39条）。"]},{"n":"行政不服審査法","p":["行政庁の処分や不作為への不服を行政機関に申し立てる制度で、2014年の全部改正（2016年4月施行）で原則として審査請求に一本化された。","審査請求は、処分があったことを知った日の翌日から3か月以内、処分があった日の翌日から1年以内にしなければならない（18条）。","審査請求では処分に関与していない職員が審理員として審理し、原則として行政不服審査会などに諮問したうえで裁決する。","行政不服審査では違法な処分だけでなく、裁量の行使が不適切な不当な処分も是正の対象となる点で行政訴訟と異なる。","法律に特別の定めがなければ、審査請求をせずに直ちに取消訴訟を提起することもできる（自由選択主義、行政事件訴訟法8条）。"]},{"n":"行政事件訴訟","p":["行政事件訴訟は、抗告訴訟・当事者訴訟・民衆訴訟・機関訴訟の4類型である（行政事件訴訟法2条）。","抗告訴訟には取消訴訟・無効等確認訴訟・不作為の違法確認訴訟・義務付け訴訟・差止め訴訟などがあり、義務付けと差止めは2004年改正で法定された。","取消訴訟は、処分があったことを知った日から6か月以内、処分の日から1年以内に提起しなければならない（14条）。","取消訴訟の原告適格は処分の取消しを求める「法律上の利益を有する者」にあり、処分の相手方以外の第三者にも認められうる（9条）。","取消訴訟を起こしても処分の効力や執行は原則として止まらない（執行不停止の原則、25条1項）。"]},{"n":"国家賠償法","p":["公権力の行使にあたる公務員が職務を行うについて故意・過失で違法に他人に損害を加えたときは、国または公共団体が賠償する（1条1項）。","判例は公務員個人は被害者に直接責任を負わないとする。公務員に故意・重大な過失があれば、国などはその公務員に求償できる（1条2項）。","判例は、客観的に職務執行の外形を備えていれば、公務員が私的な目的でした行為も職務を行うについてにあたるとする（外形標準説）。","道路・河川などの公の営造物の設置・管理に瑕疵があって損害が生じたときは、国などは過失がなくても賠償責任を負う（2条）。"]},{"n":"株式会社と株主総会","p":["株主の責任は、その有する株式の引受価額を限度とする有限責任である（会社法104条）。会社法は2006年5月に施行された。","株主総会と取締役は、すべての株式会社に置かなければならない機関である（326条1項）。","取締役会設置会社の株主総会は、会社法と定款で定めた事項に限って決議できる（295条2項）。","普通決議は議決権の過半数をもつ株主が出席し、出席株主の議決権の過半数で決する（309条1項）。","定款変更・合併・解散などの特別決議は、議決権の過半数をもつ株主が出席し、出席株主の議決権の3分の2以上で決する（309条2項）。"]},{"n":"取締役と機関設計","p":["取締役の任期は原則として選任後2年以内に終わる最終の事業年度の定時総会の終結時までで、非公開会社は定款で10年まで延ばせる（332条）。","公開会社・監査役会設置会社・監査等委員会設置会社・指名委員会等設置会社は取締役会を必ず置き、取締役は3人以上とする（327条・331条5項）。","大会社（資本金5億円以上または負債総額200億円以上）は会計監査人を置かなければならない（328条）。","指名委員会等設置会社は指名・監査・報酬の3委員会を置き、業務の執行は取締役会が選任する執行役が担う。","監査役の任期は原則4年で（336条）、監査役会は3人以上の監査役で組織し、その半数以上を社外監査役とする（335条3項）。"]}]}]},{"id":"econ","name":"経済学（ミクロ・マクロ）","full":"経済学（ミクロ経済学・マクロ経済学と日本経済）","group":"教養・専門","desc":"希少な資源の配分と一国経済の動きを、市場・政策・データから学ぶ","asOf":"2026年11月7日時点：日本銀行2026年10月30日会合・展望レポート、総務省2026年9月分統計に基づく","aliases":["経済学","ミクロ経済学","マクロ経済学","経済原論","経済"],"sources":[{"t":"日本銀行「当面の金融政策運営について」（2026年10月30日）","u":"https://www.boj.or.jp/mopo/mpmdeci/mpr_2026/k261030a.pdf"},{"t":"日本銀行「（参考）ETFの売却ペースの見直しに関する決定（2026年10月）」","u":"https://www.boj.or.jp/mopo/mpmdeci/mpr_2026/k261030c.pdf"},{"t":"日本銀行「経済・物価情勢の展望（2026年10月）基本的見解」","u":"https://www.boj.or.jp/mopo/outlook/gor2610a.pdf"},{"t":"日本銀行「金融市場調節方針の変更について」（2026年9月18日）","u":"https://www.boj.or.jp/mopo/mpmdeci/mpr_2026/k260918a.pdf"},{"t":"日本銀行「金融市場調節方針の変更について」（2026年6月16日）","u":"https://www.boj.or.jp/mopo/mpmdeci/mpr_2026/k260616a.pdf"},{"t":"日本銀行「長期国債の買入れ計画について」（2026年6月16日）","u":"https://www.boj.or.jp/mopo/mpmdeci/mpr_2026/k260616b.pdf"},{"t":"日本銀行「金融政策の枠組みの見直しについて」（2024年3月19日）","u":"https://www.boj.or.jp/mopo/mpmdeci/state_2024/k240319a.htm"},{"t":"日本銀行「金融市場調節方針の変更および長期国債買入れの減額計画の決定について」（2024年7月31日）","u":"https://www.boj.or.jp/mopo/mpmdeci/state_2024/k240731a.htm"},{"t":"日本銀行「金融市場調節方針の変更について」（2025年1月24日）","u":"https://www.boj.or.jp/mopo/mpmdeci/state_2025/k250124a.htm"},{"t":"日本銀行「金融市場調節方針の変更について」（2025年12月19日）","u":"https://www.boj.or.jp/mopo/mpmdeci/state_2025/k251219a.htm"},{"t":"日本銀行「量的・質的金融緩和」等の関連資料","u":"https://www.boj.or.jp/mopo/outline/ref_qqe.htm"},{"t":"日本銀行 高田創審議委員 札幌市金融経済懇談会 講演資料（2026年9月2日）","u":"https://www.boj.or.jp/about/press/koen_2026/data/ko260902a2.pdf"},{"t":"総務省統計局「労働力調査（基本集計）」月次結果","u":"https://www.stat.go.jp/data/roudou/sokuhou/tsuki/index.htm"},{"t":"総務省統計局「2025年基準 消費者物価指数の解説」","u":"https://www.stat.go.jp/data/cpi/2025/kaisetsu/pdf/1.pdf"},{"t":"第一生命経済研究所「消費者物価（全国2026年9月）」","u":"https://www.dlri.co.jp/report/macro/666835.html"}],"units":[{"u":"経済学の基礎と需給分析","items":[{"n":"希少性・機会費用と生産可能性","p":["欲求に比べ資源が限られる「希少性」のため選択が必要になる。何を・どのように・誰のために生産するかが経済の基本問題である。","機会費用は、ある選択のために諦めた選択肢のうち最大の価値。大学進学なら学費に加え、働けば得られた所得も含む。","埋没費用は既に支払い回収できない費用で、今後の意思決定では無視すべきもの。「元を取る」ための継続は誤り。","生産可能性フロンティア（PPF）は資源を全て使った最大生産の組合せ。原点に対し凹型なのは機会費用逓増を表す。","PPFの内側は失業など資源が遊休している非効率な点。技術進歩や資源の増加でPPFは外側にシフトする。"]},{"n":"需要曲線とそのシフト","p":["需要曲線は各価格での需要量を示す。他の条件一定なら価格が上がると需要量は減り（需要の法則）、右下がりになる。","価格の変化は曲線上の移動（需要量の変化）、所得・嗜好・関連財の価格・人口の変化は曲線のシフト（需要の変化）。","代替財の値上がりは需要を右シフト、補完財の値上がりは左シフトさせる。例：コーヒーの値上げで紅茶の需要が増える。","市場需要曲線は個人の需要曲線を価格ごとに水平方向に足し合わせて得る（公共財は垂直和となる点と対比）。"]},{"n":"供給曲線とそのシフト","p":["供給曲線は各価格での供給量を示し通常は右上がり。完全競争では操業停止点より上の限界費用曲線に一致する。","原材料費・賃金の上昇は供給曲線を左（上）へ、技術進歩や生産者の増加は右（下）へシフトさせる。","1単位t円の従量税は、供給曲線を上方にt円だけ平行移動させるのと同じ効果を持つ。","供給の価格弾力性は短期ほど小さく長期ほど大きい。設備や人員の調整に時間がかかるためである。"]},{"n":"市場均衡と比較静学","p":["需要量＝供給量となる価格が均衡価格。均衡より高い価格では超過供給、低い価格では超過需要が生じる。","計算例：需要D=100−P、供給S=2P−20なら、100−P=2P−20よりP=40、取引量Q=60となる。","需要の増加（右シフト）は価格・数量をともに上げ、供給の増加（右シフト）は価格を下げ数量を増やす。","需要と供給が同時に増えると数量は必ず増えるが、価格の上下はシフト幅の大小次第で不確定になる。"]},{"n":"市場均衡の安定性","p":["ワルラス的調整：超過需要があれば価格が上がる。価格が均衡より高いとき超過供給となる市場はワルラス安定である。","マーシャル的調整：需要価格が供給価格を上回れば生産量が増える。費用逓減産業など長期の数量調整で用いる。","右下がりの供給曲線では両者の判定が逆になる。供給曲線が需要曲線より急ならワルラス安定・マーシャル不安定。","くもの巣理論：供給が前期の価格で決まる場合、供給曲線の傾きが需要曲線より急（絶対値で大）なら価格は収束する。"]},{"n":"需要の価格弾力性","p":["価格弾力性＝需要量の変化率÷価格の変化率（絶対値）。1より大きければ弾力的、1より小さければ非弾力的という。","直線の需要曲線上でも弾力性は一定でない。価格が高い（数量が少ない）ほど大きく、中点でちょうど1になる。","弾力的なら値下げで総収入（P×Q）が増え、非弾力的なら値上げで増える。弾力性が1の点で総収入は最大となる。","代替財が多い財、ぜいたく品、支出割合の大きい財、長期ほど弾力性は大きい。生活必需品は小さい。","計算例：価格が10%上がり需要量が5%減れば、弾力性は0.5で非弾力的となる。"]},{"n":"所得弾力性と交差弾力性","p":["所得弾力性＝需要量の変化率÷所得の変化率。正なら上級財（正常財）、負なら下級財（劣等財）である。","上級財のうち所得弾力性が1を超える財を奢侈品（ぜいたく品）、0〜1の財を必需品と呼ぶ。","交差弾力性＝X財の需要量の変化率÷Y財の価格の変化率。正なら代替財、負なら補完財、0なら独立財。","エンゲルの法則：所得が増えると消費支出に占める食料費の割合（エンゲル係数）は下がる。食料は必需品である。"]}]},{"u":"消費者行動の理論","items":[{"n":"効用と限界効用逓減","p":["効用は財の消費から得る満足。限界効用は消費を1単位増やしたときの効用の増加分で、通常は逓減する。","総効用は限界効用が正である限り増え続け、限界効用が0になる点で最大となる。","基数的効用は効用の大きさ自体に意味を持たせ、序数的効用は順序だけを問題にする。無差別曲線分析は序数的。","水とダイヤモンドの逆説：価格は総効用でなく限界効用に対応するため、豊富な水は安く、希少なダイヤは高い。"]},{"n":"無差別曲線と限界代替率","p":["無差別曲線は同じ効用をもたらす2財の組合せの軌跡。右上の曲線ほど効用が高く、2本の曲線は交わらない。","通常は右下がりで原点に凸。凸性は限界代替率逓減（X財が増えるほどY財で測ったX財の価値が下がる）を表す。","限界代替率（MRS）は無差別曲線の接線の傾きの絶対値で、X財の限界効用÷Y財の限界効用に等しい。","完全代替財の無差別曲線は右下がりの直線、完全補完財（右の靴と左の靴など）はL字型になる。"]},{"n":"予算制約線","p":["予算制約式はPx·X＋Py·Y＝M。縦軸切片M/Py、横軸切片M/Px、傾きの絶対値は価格比Px/Pyである。","所得Mが増えると予算線は外側に平行移動し、Pxが下がると縦軸切片を軸に横軸切片が外側へ回転する。","所得と全ての価格が同率で上がると予算線は変わらない。選択は相対価格と実質所得で決まる。","同額なら現物給付より現金給付の方が選べる組合せが広く、効用は同じか高くなる（予算線の比較で示せる）。"]},{"n":"最適消費の条件","p":["最適消費点は予算線と無差別曲線の接点で、MRS＝Px/Py（主観的な交換比率＝市場の交換比率）が成り立つ。","同じ条件は限界効用均等の法則MUx/Px＝MUy/Pyとも書ける。1円あたりの限界効用が全ての財で等しくなる。","計算例：U=XY、Px=2、Py=4、M=80なら、MRS=Y/X=1/2と予算式よりX=20、Y=10となる。","U=X^aY^b（コブ＝ダグラス型）では所得のa/(a+b)をX財に支出し、X=aM/{(a+b)Px}となる。","完全代替財などでは、一方の財だけを買う端点解（コーナー解）になることがある。"]},{"n":"所得変化と上級財・下級財","p":["所得が増えたとき需要が増える財が上級財（正常財）、減る財が下級財（劣等財）である。","所得消費曲線は所得変化に伴う最適点の軌跡。エンゲル曲線は所得と1財の需要量の関係を示す。","2財モデルで両方が下級財になることはない。所得の増加分は必ずどちらかの財の支出に回るためである。","価格消費曲線は1財の価格変化に伴う最適点の軌跡で、ここから個人の需要曲線が導かれる。"]},{"n":"代替効果と所得効果","p":["価格変化の効果は、相対価格の変化による代替効果と、実質所得の変化による所得効果に分解できる。","ヒックス分解は元の効用を保つ補償、スルツキー分解は元の消費点が買える補償で代替効果を測る。","代替効果は常に価格と逆方向（値下がりで需要増）に働く。所得効果の向きは上級財か下級財かで変わる。","上級財は両効果が同方向で需要曲線は右下がり。下級財は所得効果が逆向きだが、通常は代替効果が上回る。"]},{"n":"ギッフェン財","p":["ギッフェン財は価格が下がると需要量が減る財で、需要曲線が右上がりになる例外である。","成立条件は、下級財であり、かつ逆向きの所得効果が代替効果を上回ること。ギッフェン財は必ず下級財である。","下級財が全てギッフェン財ではない点に注意。支出割合の大きい安価な主食などが典型例とされる。","高価格ゆえに需要が増えるヴェブレン効果とは別の概念。ギッフェン財は通常の効用最大化の枠内で説明される。"]},{"n":"労働供給と余暇の選択","p":["労働供給は余暇と所得（消費）の選択として分析する。予算線の傾きは賃金率で、余暇の機会費用は賃金である。","賃金上昇の代替効果は余暇を減らし労働を増やす。余暇が上級財なら所得効果は余暇を増やし労働を減らす。","高賃金の領域で所得効果が代替効果を上回ると、労働供給曲線は後方屈曲型（途中から左に曲がる形）になる。","異時点間の選択では今期と来期の消費を利子率で交換する。今期消費1単位の相対価格は来期消費(1+r)単位である。"]}]},{"u":"生産者行動の理論","items":[{"n":"生産関数と限界生産力","p":["生産関数は投入（労働L・資本K）と最大生産量の関係。代表例はコブ＝ダグラス型Y=AK^αL^(1−α)。","限界生産力（MP）は投入を1単位増やした時の産出増。他の投入を固定すると逓減する（収穫逓減の法則）。","平均生産力AP=Y/L。MPがAPを上回る間はAPが上昇し、MP曲線はAPの最大点を通る。","短期は資本など一部の投入が固定される期間、長期は全ての投入を調整できる期間と定義する。"]},{"n":"等量曲線と費用最小化","p":["等量曲線は同じ産出量を生む投入の組合せ。傾きの絶対値は技術的限界代替率で、MPL/MPKに等しい。","等費用線wL+rK=Cの傾きは要素価格比w/r。費用最小化点では技術的限界代替率＝w/rが成り立つ。","同じ条件はMPL/w＝MPK/rとも書ける。1円あたりの限界生産力が全ての生産要素で等しくなる。","賃金が相対的に上がると、同じ産出量を労働を減らし資本を増やして生産するようになる（要素代替）。"]},{"n":"短期費用の分類","p":["総費用TC＝固定費用FC＋可変費用VC。固定費用は生産量0でもかかり、短期では避けられない。","平均費用AC＝TC/Q、平均可変費用AVC＝VC/Q、平均固定費用AFC＝FC/Q。AFCは生産量とともに下がり続ける。","限界費用MCは生産を1単位増やしたときの費用増で、総費用曲線の接線の傾き（dTC/dQ）に等しい。","限界生産力が逓減すると限界費用は逓増する。費用曲線は生産関数を裏返したものといえる。","例：TC=Q^3−6Q^2+18Q+32なら、FC=32、AVC=Q^2−6Q+18、MC=3Q^2−12Q+18となる。"]},{"n":"平均費用と限界費用の関係","p":["MC曲線はAVC曲線とAC曲線のそれぞれの最低点を下から上へ通過する。","MC＜ACの範囲ではACは下がり、MC＞ACの範囲ではACは上がる。平均点と追加した1人の点数の関係と同じ理屈。","AVCの最低点はACの最低点より左（少ない生産量）にある。両者の差であるAFCが生産増で縮むためである。","図では、原点から総費用曲線に引いた接線の接点がAC最低点、縦軸のFCの点から引いた接線の接点がAVC最低点。"]},{"n":"長期費用と規模の経済","p":["長期平均費用（LAC）曲線は、各設備規模の短期平均費用曲線を下から包む包絡線である。","LACが右下がりの範囲は規模の経済、右上がりは規模の不経済。LACの最低点の規模を最小効率規模という。","全投入をk倍して産出がk倍を超えれば規模に関して収穫逓増、k倍なら一定、k倍未満なら逓減である。","コブ＝ダグラス型AK^aL^bは、a+b>1で収穫逓増、a+b=1で収穫一定、a+b<1で収穫逓減となる。","範囲の経済は複数の財を1企業でまとめて生産すると安くなること。規模の経済とは別の概念である。"]},{"n":"利潤最大化条件","p":["利潤＝総収入−総費用。完全競争企業は価格受容者で限界収入＝価格のため、P＝MCとなる量を生産する。","MC曲線の右上がり部分で価格と交わる必要がある（2階の条件）。右下がり部分での交点は利潤最小点である。","計算例：TC=Q^2+10、P=20なら、MC=2Q=20よりQ=10、利潤は200−110=90となる。","経済学の費用は機会費用（正常利潤）を含む。経済学的利潤が0でも、会計上の利潤は正で事業は続く。"]},{"n":"損益分岐点と操業停止点","p":["損益分岐点はMCとACの交点（AC最低点）。価格がこれを下回ると利潤が負（赤字）になる。","操業停止点はMCとAVCの交点（AVC最低点）。価格がこれを下回ると生産をやめた方が損失が小さい。","両点の間の価格では赤字でも、収入で可変費用を賄い固定費用の一部を回収できるため短期では操業を続ける。","計算例：TC=Q^3−6Q^2+18Q+32なら、操業停止点はQ=3・P=9、損益分岐点はQ=4・P=18となる。","短期供給曲線は操業停止点より上のMC曲線。長期では固定費用がなく、価格がLAC最低点未満なら退出する。"]},{"n":"労働需要と限界生産物価値","p":["企業は労働の限界生産物価値（P×MPL）が賃金wに等しくなるまで雇う。実質賃金w/P＝MPLとも書ける。","限界生産力が逓減するため、労働需要曲線は右下がりになる。賃金が上がると雇用量は減る。","生産物市場で独占なら限界収入生産物（MR×MPL）で評価するため、雇用は完全競争の場合より少なくなる。","需要独占（買手独占）の企業は賃金と雇用を競争水準より低くする。この場合、最低賃金の導入が雇用を増やしうる。"]}]},{"u":"完全競争と余剰分析","items":[{"n":"完全競争市場の条件","p":["条件は、①多数の売り手と買い手、②財の同質性、③完全情報、④参入・退出の自由。各主体は価格受容者となる。","個々の企業が直面する需要曲線は市場価格の高さで水平（完全弾力的）になる。","完全競争企業では、限界収入＝平均収入＝価格が成り立つ。","どの条件が欠けるかで、独占・寡占・独占的競争・情報の非対称性などの市場の型が区別される。"]},{"n":"長期均衡と参入・退出","p":["超過利潤があれば新規参入で供給が増え価格が下がり、損失があれば退出で供給が減り価格が上がる。","長期均衡ではP＝MC＝LACの最低点となり、経済学的利潤（超過利潤）は0になる。","費用一定産業の長期供給曲線は水平。参入で要素価格が上がる費用逓増産業では右上がりになる。","長期均衡では最小効率規模での生産（生産の効率）とP＝MC（配分の効率）が同時に実現する。"]},{"n":"消費者余剰と生産者余剰","p":["消費者余剰は支払ってもよい額と実際の支払額の差の合計で、需要曲線と価格線の間の面積で表す。","生産者余剰は価格と限界費用の差の合計で、価格線と供給曲線の間の面積。固定費用を引く前の利潤に当たる。","総余剰＝消費者余剰＋生産者余剰（＋税収−補助金）。完全競争均衡で総余剰は最大になる。","計算例：需要P=100−Q、供給P=Qなら均衡はQ=50・P=50。消費者余剰・生産者余剰は各1250、総余剰2500。","政策や独占で失われる総余剰を死荷重（厚生損失）という。図では通常、三角形の面積で測る。"]},{"n":"課税の効果と税の帰着","p":["従量税は供給曲線を税額分だけ上にシフトさせ、取引量が減り、買手の価格は上がり売手の手取りは下がる。","税の実質的な負担は法律上の納税者に関係なく、価格弾力性の小さい側がより多く負う（税の帰着）。","需要P=100−Q、供給P=Qに従量税20を課すと、Q=40、買手価格60、売手手取り40、税収800、死荷重100。","線形の需給では死荷重は税額の2乗に比例する。需要・供給が非弾力的な財ほど課税の死荷重は小さい。","従価税は価格の一定割合を課すため、供給曲線を回転させるようにシフトさせる。"]},{"n":"補助金の効果","p":["従量補助金は供給曲線を補助額だけ下にシフトさせ、取引量を増やし、買手価格を下げ売手の受取価格を上げる。","補助金の総額は消費者余剰と生産者余剰の増加分の合計を上回り、その差が死荷重となる。","需要P=100−Q、供給P=Qに1単位20の補助金なら、Q=60、買手40、売手60、補助金総額1200、死荷重100。","補助金の恩恵も、価格弾力性の小さい側がより多く受ける。税の帰着と同じ考え方である。"]},{"n":"価格規制の効果","p":["均衡より低い上限価格（家賃統制など）は超過需要（品不足）を生み、取引量が減って死荷重が発生する。","均衡より高い下限価格（最低賃金・農産物の価格支持など）は超過供給（失業・売れ残り）を生む。","均衡価格より高い上限価格や、低い下限価格は拘束力がなく、市場の結果に影響しない。","上限価格の下では行列・闇市場・品質低下が起きやすく、買える人の選ばれ方次第で余剰はさらに減りうる。","数量規制は供給曲線を割当量で垂直にし、需要価格と供給価格の差は割当を得た者のレント（超過利得）になる。"]},{"n":"貿易と関税の余剰分析","p":["小国が貿易を始めると国内価格は国際価格に一致する。輸入国では消費者余剰の増加が生産者余剰の減少を上回る。","輸出国では生産者余剰の増加が消費者余剰の減少を上回る。どちらの場合も総余剰は貿易前より増える。","小国の輸入関税は国内価格を関税分だけ上げ輸入量を減らす。過剰生産と過少消費の2つの三角形が死荷重となる。","大国の関税は国際価格を押し下げる（交易条件の改善）ため、適度な関税で自国の総余剰が増えうる（最適関税）。","同じ輸入量なら関税と輸入割当の価格効果は同じだが、関税の差額は政府収入、割当の差額は割当保有者のものになる。"]},{"n":"パレート効率と厚生経済学","p":["パレート効率とは、誰かの効用を下げずには他の誰の効用も上げられない状態。分配の公平性は問わない。","エッジワース・ボックスで2人の無差別曲線が接する点の軌跡が契約曲線で、その上の点はパレート効率的である。","交換の効率は全員のMRSが等しいこと、生産と交換の同時の効率はMRS＝限界変形率（PPFの傾き）が条件となる。","第1定理：完全競争均衡はパレート効率的。第2定理：凸性などの下で、任意の効率的配分は再分配と競争で実現できる。","所得分配の不平等はローレンツ曲線とジニ係数（0で完全平等、1に近いほど不平等）で測る。"]}]},{"u":"不完全競争","items":[{"n":"独占企業の利潤最大化","p":["独占企業は右下がりの市場需要曲線に直面し、限界収入MR＝限界費用MCとなる量を選び、需要曲線上で価格を付ける。","線形の需要P=a−bQの限界収入はMR=a−2bQ。縦軸切片は需要曲線と同じで、傾きは2倍になる。","計算例：需要P=100−Q、MC=20なら、MR=100−2Q=20よりQ=40、P=60。完全競争ならQ=80、P=20。","MCが正なら独占企業は需要の価格弾力性が1より大きい（弾力的な）領域で生産する。MR>0が必要なためである。","独占企業には供給曲線が存在しない。価格と数量の対応が需要曲線の形に依存するためである。"]},{"n":"独占の死荷重と市場支配力","p":["独占はP＞MCとなり取引量が過小で死荷重が生じる。前例の死荷重は（80−40）×（60−20）÷2＝800。","ラーナー指数＝（P−MC）/Pは市場支配力の指標で、利潤最大化の下では需要の価格弾力性の逆数に等しい。","独占の弊害には死荷重のほか、X非効率（費用削減努力の不足）やレント・シーキング（独占維持のための浪費）がある。","参入障壁の源泉は、特許・免許などの法的規制、重要資源の独占、規模の経済、ネットワーク外部性などである。"]},{"n":"価格差別","p":["第1種（完全）価格差別は各消費者の最大支払意思額で売る。数量は効率的で死荷重はないが、消費者余剰は0になる。","第2種は購入量に応じた価格（数量割引・二部料金）、第3種は学割のように市場を分けて別の価格を付ける。","第3種価格差別では各市場でMR＝MCとし、需要の価格弾力性が小さい市場ほど高い価格を付ける。","成立条件は、市場支配力があること、顧客（市場）を区別できること、転売ができないことである。"]},{"n":"自然独占と料金規制","p":["自然独占は固定費用が大きく平均費用が広い範囲で逓減し、1社で供給する方が安い産業。電力網や水道などが例。","限界費用価格形成（P＝MC）は効率的だが、平均費用が限界費用を上回るため赤字となり補助金が必要になる。","平均費用価格形成（P＝AC）は赤字を避けられるが、P＞MCとなるため死荷重が残る。","二部料金制は従量料金をMCに合わせて効率を保ち、固定費は基本料金で回収する方法である。","ヤードスティック規制は他地域の同業者の費用を基準に料金を定め、事業者間の間接的な競争で費用削減を促す。"]},{"n":"独占的競争","p":["独占的競争は、多数の企業が差別化された製品を売り参入・退出が自由な市場（チェンバリン）。飲食店などが例。","短期には各企業が右下がりの需要曲線に直面してMR＝MCで行動し、超過利潤を得ることがある。","長期には参入で各企業の需要曲線が左にシフトし、平均費用曲線と接する点で超過利潤が0になる。","長期均衡はLAC最低点より左で生産され、過剰設備が生じる。またP＞MCで配分も非効率である。"]},{"n":"寡占とクールノー競争","p":["寡占は少数の企業が市場を占め、互いの行動が利潤に影響し合う（戦略的相互依存）市場である。","クールノー競争は、各社が相手の生産量を所与として自社の生産量を同時に決める。反応曲線の交点が均衡となる。","計算例：P=100−(q1+q2)、MC=10の2社なら、反応関数q1=(90−q2)/2より各社30、P=40となる。","クールノー均衡の総生産量は独占より多く完全競争より少ない。前例では独占45、クールノー60、完全競争90。","n社の線形クールノー競争では総生産量が競争水準のn/(n+1)倍となり、nが増えると完全競争に近づく。"]},{"n":"シュタッケルベルク競争","p":["先導者が先に生産量を決め、追随者は反応関数に従う。先導者は追随者の反応を織り込んで生産量を選ぶ。","前例（P=100−Q、MC=10）では先導者45、追随者22.5、P=32.5。先導者の利潤はクールノー時より大きい。","総生産量67.5はクールノー均衡（60）より多く、価格は低くなる。","後ろ向き帰納法で解く逐次手番ゲームの典型例で、結果は部分ゲーム完全均衡となる。"]},{"n":"ベルトラン競争","p":["ベルトラン競争は各社が価格を同時に決める。同質財で限界費用が同じなら、2社でも価格は限界費用まで下がる。","少数の企業でも完全競争と同じ結果になることを、ベルトランのパラドックスという。","製品差別化、生産能力の制約、繰り返し取引があると、価格は限界費用を上回りうる。","屈折需要曲線（スウィージー）は、値上げには追随されず値下げには追随されると予想するため価格が硬直的になると説明する。"]}]},{"u":"ゲーム理論","items":[{"n":"ゲームの要素と支配戦略","p":["ゲームはプレイヤー・戦略・利得で表す。同時手番は利得表（標準形）、逐次手番はゲームの木（展開形）で示す。","支配戦略は、相手がどの戦略をとっても他の戦略より利得が高い戦略。全員が支配戦略をとる状態が支配戦略均衡。","支配される戦略を順に消していく方法（逐次消去）で均衡の候補を絞り込める。","ゼロサムゲームでは一方の利得が他方の損失となり、ミニマックス（マキシミン）戦略で解を求める。"]},{"n":"ナッシュ均衡","p":["ナッシュ均衡は、相手の戦略を所与としたとき、誰も自分だけ戦略を変えて得をできない戦略の組である。","見つけ方：利得表で相手の各戦略に対する自分の最適反応に印を付け、両者の印がそろうセルを探す。","支配戦略均衡は必ずナッシュ均衡だが、逆は成り立たない。ナッシュ均衡が複数あることもある。","男女の争い（デート先の選択）は純粋戦略のナッシュ均衡が2つあるゲームで、調整の問題を表す。"]},{"n":"囚人のジレンマ","p":["2人とも「自白」が支配戦略で均衡となるが、2人とも「黙秘」すれば双方の利得が高い。個人と集団の合理性がずれる。","ナッシュ均衡がパレート非効率になる典型例で、カルテル破り・軍拡競争・値下げ競争・環境問題に当てはまる。","1回限りのゲームでは、事前に協力を約束しても拘束力がなければ守られない。","協調の実現には、拘束力のある契約、罰則、繰り返しによる将来の報復の可能性などが必要となる。"]},{"n":"混合戦略","p":["混合戦略は純粋戦略を確率的に選ぶ戦略。純粋戦略の均衡がないコイン合わせでも混合戦略の均衡は存在する。","混合戦略均衡では、各自は相手の純粋戦略どうしが無差別になるように自分の確率を選ぶ。","プレイヤーも戦略も有限のゲームには、混合戦略まで含めれば必ずナッシュ均衡が存在する（ナッシュの定理）。","サッカーのPKで蹴る方向や守る方向を読まれないようランダムにするのは混合戦略の例である。"]},{"n":"逐次手番と部分ゲーム完全均衡","p":["逐次手番ゲームはゲームの木で表し、最後の手番から順に最適な行動を求める（後ろ向き帰納法）。","部分ゲーム完全均衡は全ての部分ゲームでナッシュ均衡となる戦略の組で、信憑性のない脅しを排除する。","参入阻止ゲームで「参入されたら値下げ戦争」という脅しは、実行時に既存企業が損をするなら信憑性がない。","後戻りできない設備投資などのコミットメントは、脅しに信憑性を与え相手の行動を変えうる。"]},{"n":"繰り返しゲームと協調","p":["終わりが決まった有限回の囚人のジレンマでは、最終回から後ろ向きに考えると毎回裏切りが均衡になる。","無限回（終わりが不確定）の繰り返しでは、割引因子が十分大きければトリガー戦略による協調が均衡となる。","トリガー戦略は相手が一度でも裏切れば以後永久に裏切る戦略。しっぺ返し戦略は相手の前回の手をまねる。","協調が続く条件：協調を続ける利得の割引現在価値≧1回裏切る利得＋その後の罰の利得の割引現在価値。","フォーク定理：十分忍耐強いプレイヤーの間では、多様な協調的結果が繰り返しゲームの均衡になりうる。"]}]},{"u":"市場の失敗と情報の経済学","items":[{"n":"外部性と市場の失敗","p":["外部性は市場取引を通さずに他者に影響を与えること。公害は外部不経済、ワクチン接種や教育は外部経済の例。","外部不経済では社会的限界費用（私的限界費用＋外部限界費用）が私的限界費用を上回り、市場は過剰生産になる。","外部経済では社会的限界便益が私的限界便益を上回り、市場での生産・消費は過少になる。","市場の失敗の主な原因は、外部性・公共財・情報の非対称性・独占など不完全競争・費用逓減産業である。","価格の変化を通じた影響（金銭的外部性）は、技術的外部性と異なり市場の失敗の原因とはならない。"]},{"n":"ピグー税と排出量取引","p":["ピグー税は最適生産量での外部限界費用に等しい税を課し、私的限界費用を社会的限界費用に一致させる。","外部経済には同じ考え方でピグー補助金を与え、生産・消費を社会的に最適な水準まで増やす。","ピグー税の難点は、政府が外部費用の大きさを正確に知る必要があることである。","排出量取引は排出総量を決めて排出枠を売買させ、削減費用の低い主体から削減させる。炭素税は価格を決める手法。","一律の排出基準（直接規制）は簡明だが、削減費用が企業ごとに違うと社会全体の削減費用が最小にならない。"]},{"n":"コースの定理","p":["取引費用が0で権利（所有権）が明確なら、権利をどちらに与えても当事者間の交渉で効率的な配分が実現する。","権利の帰属は効率性には影響しないが、誰が補償を払うかという所得分配には影響する。","例：操業で工場が100得て住民が150失うなら、権利がどちらにあっても交渉の結果、操業は行われない。","当事者が多い、情報が不完全などで取引費用が大きい現実の公害では、政府の介入が必要になりやすい。"]},{"n":"公共財の性質","p":["公共財は非競合性（多くの人が同時に消費できる）と非排除性（対価を払わない人を排除できない）を持つ財。","両方を満たす純粋公共財は国防・灯台・一般道路など。片方だけを満たすものを準公共財という。","非競合的だが排除可能なものはクラブ財（有料放送など）、競合的だが排除困難なものは共有資源（漁場など）。","共有資源は各自が過剰に使い枯渇しやすい（共有地の悲劇）。漁獲枠の設定や所有権の付与が対策になる。"]},{"n":"公共財の最適供給","p":["非排除性のため対価を払わずに利用するフリーライダーが生じ、市場に任せると公共財は過少供給になる。","公共財の社会的需要曲線は個人の需要曲線を数量ごとに垂直に足し合わせて得る（私的財は水平和）。","サミュエルソン条件：各人の限界代替率（限界便益）の合計＝限界変形率（限界費用）で最適供給量が決まる。","例：限界便益がA=20−Q、B=30−Q、限界費用30なら、50−2Q=30よりQ=10が最適となる。","リンダール・メカニズムは各人の限界便益に応じた負担で合意を目指すが、選好を偽る誘因が残る。"]},{"n":"逆選択","p":["逆選択は取引前の情報の非対称性で、質の悪い財や高リスクの人ばかりが市場に残る現象。アカロフのレモン市場が典型。","買手が平均的な品質しか分からないと平均に見合う価格しか払わず、良質な財の売手が退出して市場が縮む。","保険では高リスクの人ほど加入したがり、保険料が上がって低リスクの人が抜ける。公的な強制加入が対策となる。","対策には品質保証・検査・評判・資格のほか、情報を持つ側のシグナリング、持たない側のスクリーニングがある。"]},{"n":"モラルハザード","p":["モラルハザードは契約後に相手の行動を観察できないことで生じる非効率。保険加入後に注意を怠る行動が典型。","依頼人（プリンシパル）が代理人（エージェント）の努力を監視できない、エージェンシー問題として分析される。","対策は、免責や自己負担（共同保険）、成果に連動した報酬（ストックオプション等）、監視の強化である。","預金保険や「大きすぎて潰せない」救済の期待が銀行の過度なリスクテイクを招くのもモラルハザードの例。","逆選択は「隠された情報（契約前）」、モラルハザードは「隠された行動（契約後）」の問題と区別する。"]},{"n":"シグナリングとスクリーニング","p":["シグナリングは情報を持つ側が費用のかかる行動で自分の質を示すこと。スペンスの教育シグナルが代表例。","シグナルが機能するには、質の高い者ほどその行動の費用が低いことが必要。教育が生産性を上げなくても機能しうる。","スクリーニングは情報を持たない側が複数の契約を示して選ばせ、相手の型を見分けること（自己選択）。","例：保険会社が免責額の高い安い保険と免責なしの高い保険を用意すると、低リスク者と高リスク者が分かれる。"]}]},{"u":"GDP・物価・失業","items":[{"n":"GDPの定義と範囲","p":["GDPは一定期間に国内で生産された付加価値の合計。総産出額から中間投入額を差し引いて求める。","フローの概念で、株式・土地の売買益、中古品の取引額（仲介手数料は含む）、年金などの移転支出は含まない。","市場で取引されない家事労働やボランティアは含まないが、持ち家の帰属家賃と農家の自家消費は含む。","市場価格のない公共サービスは、人件費などの費用で評価して政府最終消費支出に計上する。","例：小麦100を使いパン屋が250のパンを売れば、付加価値は100＋150＝250で最終生産物の価値と一致する。"]},{"n":"三面等価と国民所得の諸概念","p":["生産・分配・支出のどの面から見てもGDPは事後的に等しい（三面等価）。売れ残りは在庫投資として支出に含める。","支出面のGDP＝民間最終消費支出＋政府最終消費支出＋総固定資本形成＋在庫変動＋輸出−輸入。","GNI＝GDP＋海外からの所得の純受取。日本は対外資産からの収益が大きく、GNIがGDPを上回る。","NNP（国民純生産）＝GNP−固定資本減耗。要素費用表示の国民所得NI＝NNP−（間接税−補助金）。","日本のGDPは内閣府が国民経済計算（SNA）として作成し、四半期別速報（QE）は1次速報・2次速報の順に出る。"]},{"n":"名目GDPと実質GDP","p":["名目GDPはその年の価格で、実質GDPは基準となる価格（日本は連鎖方式）で評価し、物価変動の影響を除く。","経済成長率は通常、実質GDPの増加率で測る。四半期の前期比を年率に換算した数値もよく使われる。","計算例：基準年に価格10で100個、今年は価格12で110個なら、名目1320、実質1100で実質成長率は10%。","名目成長率≒実質成長率＋GDPデフレーター上昇率。デフレ期には名目が実質を下回る「名実逆転」が起きる。","1人当たり実質GDPは生活水準の目安だが、余暇・環境・所得分配の状態は反映しない。"]},{"n":"GDPデフレーター","p":["GDPデフレーター＝名目GDP÷実質GDP×100。国内で生産された全ての財・サービスの価格動向を表す。","比較時点の数量で加重するパーシェ型の性質を持ち、ラスパイレス型のCPIとは算式が異なる。","輸入は控除項目のため、原油など輸入価格が上がるとCPIが上がってもGDPデフレーターは下がることがある。","前の例（名目1320、実質1100）ではデフレーターは120で、基準年から物価が20%上がったことを示す。"]},{"n":"消費者物価指数（CPI）","p":["総務省統計局が作成。家計が買う財・サービスの価格を基準年の購入数量で加重したラスパイレス型の指数。","2025年基準では589品目を採用し、ウエイトは家計調査の2025年の消費支出に基づく。","持ち家の帰属家賃を総合に含む。補助系列に「生鮮食品を除く総合」「生鮮食品及びエネルギーを除く総合」がある。","ラスパイレス型は安くなった財への買い替えや品質向上を反映しにくく、上方バイアスを持ちやすい。","GDPデフレーターと違い輸入品を含み、設備投資財は含まない。対象は家計の消費に限られる。"],"s":[13]},{"n":"失業率と労働力調査","p":["完全失業率＝完全失業者÷労働力人口×100。労働力人口は15歳以上の就業者と完全失業者の合計である。","完全失業者は、仕事がなく、仕事があればすぐ就け、調査期間中に求職活動をした者。求職を諦めた人は非労働力人口。","労働力調査によると、2026年9月の完全失業率（季節調整値）は2.4%で前月より0.1ポイント低下した。","同月の完全失業者は169万人（前年同月比15万人減）、就業者は6896万人（同33万人増）。","有効求人倍率（厚生労働省）は求職者1人当たりの求人数で、失業率とともに労働需給の指標となる。"],"s":[12]},{"n":"失業の種類と自然失業率","p":["摩擦的失業は転職などの職探しの過程で生じる失業。構造的失業は求職者と求人の技能・地域の不一致による。","需要不足失業（循環的失業）は景気後退による。ケインズは労働需要の不足による非自発的失業を重視した。","自然失業率は需要不足失業がなく、摩擦的・構造的失業のみが存在するときの失業率である。","UV分析（ベバリッジ曲線）は欠員率と失業率の関係。曲線上の動きは景気、曲線のシフトは構造的変化を示す。","オークンの法則：実質GDPが潜在GDPを下回るほど失業率が上がるという経験則である。"]}]},{"u":"総需要とIS-LM分析","items":[{"n":"ケインズ型消費関数","p":["C＝a＋cY（a：基礎消費、c：限界消費性向、0<c<1）。消費は今期の可処分所得に依存する（絶対所得仮説）。","平均消費性向C/Y＝a/Y＋cは所得の増加とともに低下し、常に限界消費性向より大きい。","限界消費性向＋限界貯蓄性向＝1。貯蓄関数はS＝−a＋(1−c)Yとなる。","クズネッツの長期データでは平均消費性向がほぼ一定で、短期の関係と食い違った（消費関数論争）。","節約のパラドックス：皆が貯蓄を増やそうとすると所得が減り、社会全体の貯蓄は増えないことがある。"]},{"n":"恒常所得仮説とライフサイクル仮説","p":["フリードマンの恒常所得仮説：消費は長期的に見込まれる恒常所得に比例し、一時的な所得の変動の影響は小さい。","モディリアーニのライフサイクル仮説：生涯の所得と資産を一生の消費に平準化し、現役期に貯蓄し老後に取り崩す。","デューゼンベリーの相対所得仮説：消費は過去の最高所得に影響され、所得が減っても下がりにくい（歯止め効果）。","これらの仮説では、一時的な減税や給付金の消費刺激効果は小さく、恒久的な減税の効果は大きくなる。"]},{"n":"投資の決定理論","p":["ケインズの投資の限界効率理論：投資の収益率（限界効率）が利子率を上回る投資が実行され、利子率低下で投資が増える。","現在価値の計算：1年後の110万円は利子率10%なら現在価値100万円。将来の収益を利子率で割り引いて比べる。","トービンのq＝企業の市場価値÷資本の再取得費用。qが1を上回ると投資が増える。","加速度原理：投資は産出量の変化分に比例する。必要資本係数をvとすればI＝vΔYとなる。","新古典派の投資理論は、資本の限界生産物と資本の使用者費用（実質利子率＋減耗率など）が等しくなるよう資本を調整する。"]},{"n":"45度線分析とGDPギャップ","p":["総需要C＋I＋Gと総供給Y（45度線）の交点で均衡国民所得が決まる。物価一定で需要が生産を決める（有効需要の原理）。","計算例：C=20+0.8Y、I=30、G=10なら、Y=20+0.8Y+40よりY=300となる。","完全雇用国民所得で総需要が総供給を下回る差がデフレ・ギャップ、上回る差がインフレ・ギャップである。","ギャップは需要の過不足額で測る。所得の不足額はデフレ・ギャップ×乗数となる点に注意。","内閣府や日本銀行は、実際のGDPと潜在GDPの乖離率（需給ギャップ）を推計している。"]},{"n":"乗数効果","p":["投資乗数＝1/(1−c)＝1/限界貯蓄性向。c=0.8なら乗数は5で、投資が10増えると均衡所得は50増える。","政府支出乗数は1/(1−c)、定額税の租税乗数は−c/(1−c)。同額なら減税より政府支出増の方が効果が大きい。","均衡予算乗数は1：政府支出と定額税を同額増やすと、所得はちょうどその額だけ増える。","比例税（税率t）があると乗数は1/{1−c(1−t)}、限界輸入性向mがあると1/(1−c+m)に小さくなる。","乗数効果は支出が次々に他者の所得となる波及過程で、無限等比級数の和として導ける。"]},{"n":"IS曲線","p":["IS曲線は財市場を均衡させる利子率と国民所得の組合せ。利子率低下→投資増→所得増のため右下がりになる。","投資の利子弾力性が大きいほど、また乗数が大きいほど、IS曲線は緩やか（水平に近い）になる。","政府支出増・減税・独立投資の増加はIS曲線を右へシフトさせる。シフト幅は乗数×需要の増加額である。","IS曲線より右上の点は財市場の超過供給、左下の点は超過需要の状態にある。","投資が利子率に全く反応しなければ、IS曲線は垂直になる。"]},{"n":"LM曲線と貨幣需要","p":["LM曲線は貨幣市場を均衡させる利子率と所得の組合せ。所得増→取引需要増→利子率上昇のため右上がりになる。","ケインズの流動性選好説：貨幣需要は取引動機・予備的動機（所得に依存）と投機的動機（利子率に依存）からなる。","利子率が高いと債券価格は低く、値上がりを見込んで債券を持つため貨幣需要は減る。債券価格と利子率は逆に動く。","マネーストックの増加はLM曲線を右（下）へ、物価上昇は実質貨幣残高M/Pを減らしLM曲線を左へシフトさせる。","貨幣需要の利子弾力性が大きいほどLMは水平に近く、無限大（流動性の罠）で水平、0（古典派）で垂直になる。"]},{"n":"IS-LM分析と政策の有効性","p":["IS曲線とLM曲線の交点で財市場と貨幣市場が同時に均衡し、利子率と国民所得が決まる（物価は一定）。","例：IS:Y=300−10r、LM:Y=200+10r（貨幣需要0.2Y−2r＝貨幣供給40）なら、r=5、Y=250となる。","財政拡大はISを右シフトさせ所得と利子率を上げる。金融緩和はLMを右シフトさせ所得を上げ利子率を下げる。","流動性の罠（LM水平）では金融政策は無効で、利子率が上がらないため財政政策の効果が最大になる。","投資が利子非弾力的（IS垂直）でも金融政策は無効。LMが垂直（古典派ケース）なら財政政策が無効になる。"]},{"n":"クラウディングアウト","p":["財政支出の拡大が利子率を上げて民間投資を減らし、所得増加の一部を打ち消すことをクラウディングアウトという。","LMが急（貨幣需要の利子弾力性が小）でISが緩やか（投資の利子弾力性が大）なほど、クラウディングアウトは大きい。","LMが垂直なら完全なクラウディングアウトで所得は変わらず、LMが水平なら利子率が上がらず発生しない。","財政拡大と同時に金融緩和を行えば利子率の上昇を抑え、クラウディングアウトを防げる（ポリシー・ミックス）。","変動相場制の開放経済では、金利上昇→自国通貨高→純輸出減という経路でも財政政策の効果が相殺される。"]}]},{"u":"AD-AS分析と経済学派","items":[{"n":"総需要（AD）曲線","p":["AD曲線は財市場と貨幣市場を同時に均衡させる物価と国民所得の組合せで、IS-LM分析から導かれる。","物価下落→実質貨幣残高M/P増→LM右シフト→利子率低下→投資増となり、AD曲線は右下がりになる（ケインズ効果）。","物価下落で実質資産が増え消費が増えるピグー効果（実質残高効果）も、ADが右下がりになる理由である。","財政拡大・金融緩和はADを右へシフトさせる。流動性の罠などではピグー効果を除くとADは垂直になる。"]},{"n":"総供給（AS）曲線","p":["AS曲線は物価と経済全体の生産量の関係で、労働市場の想定によって形が変わる。","古典派は賃金が伸縮的で常に完全雇用と考え、AS曲線は完全雇用国民所得の水準で垂直になる。","ケインズ派は名目賃金の下方硬直性を想定し、物価上昇で実質賃金が下がり雇用が増えるためASは右上がりになる。","短期のASは右上がり、長期のASは潜在GDPの水準で垂直とするのが標準的な整理である。","生産性の上昇や労働力・資本の増加は、長期AS曲線を右へシフトさせる。"]},{"n":"需要・供給ショックとインフレ","p":["AD右シフトによる物価上昇をディマンド・プル・インフレ、AS左シフトによる物価上昇をコスト・プッシュ・インフレという。","原油高騰などの負の供給ショックは、物価上昇と生産減少が同時に起きるスタグフレーションを招く。","供給ショックに需要拡大で対応すれば物価がさらに上がり、引き締めれば不況が深まるという政策のジレンマがある。","デフレーションは物価の持続的な下落。実質債務負担の増加（負債デフレ）や実質金利の上昇で需要を下押しする。"]},{"n":"フィリップス曲線","p":["フィリップスは英国の長期データから、失業率と名目賃金上昇率の間の負の関係を見いだした（1958年）。","サミュエルソンとソローは賃金上昇率を物価上昇率に置き換え、失業率とインフレ率のトレードオフとして示した。","この見方では、政策当局は低失業と低インフレを同時には実現できず、曲線上の組合せを選ぶことになる。","1970年代のスタグフレーションで高インフレと高失業が並存し、安定したトレードオフという見方は崩れた。"]},{"n":"期待と自然失業率仮説","p":["期待で修正されたフィリップス曲線：π＝πe−β(u−u*)。予想インフレ率πeが上がると曲線は上方にシフトする。","フリードマン＝フェルプスの自然失業率仮説：長期にはπ＝πeとなり失業率は自然失業率に戻るため、長期の曲線は垂直。","適応的期待の下では、拡張政策は短期的に失業を減らすが、期待が追いつくとインフレだけが残る。","インフレを加速させない失業率をNAIRUといい、自然失業率とほぼ同じ意味で使われる。","ニュー・ケインジアン・フィリップス曲線では、今期のインフレ率は将来の予想インフレ率と需給ギャップで決まる。"]},{"n":"古典派経済学","p":["セイの法則（供給はそれ自らの需要を生み出す）を前提に、需要不足による失業や売れ残りは生じないと考える。","価格・賃金・利子率は伸縮的で、利子率が貯蓄と投資を一致させる（貸付資金説）。","フィッシャーの交換方程式MV＝PY：流通速度Vと実質所得Yが一定なら、貨幣量の増加は物価を比例的に上げる。","ケンブリッジ方程式M＝kPY（k：マーシャルのk）。貨幣は実物経済に影響しない（貨幣の中立性・古典派の二分法）。","失業は自発的失業と摩擦的失業のみで、賃金が伸縮的なら非自発的失業は生じないとした。"]},{"n":"ケインズ経済学","p":["ケインズは『雇用・利子および貨幣の一般理論』（1936年）で、有効需要の大きさが国民所得と雇用を決めると説いた。","名目賃金の下方硬直性などにより、非自発的失業を伴う不完全雇用均衡が続きうるとした。","利子率は貯蓄と投資ではなく、貨幣の需要と供給で決まるとした（流動性選好説）。","不況期には財政政策による総需要の管理が有効だとし、戦後の先進国のマクロ経済政策の土台となった。"]},{"n":"マネタリズム","p":["フリードマンらは、貨幣需要は安定しており、貨幣量の変動が名目所得の主な決定要因であると主張した。","裁量的政策は認知・実施・効果のラグのため経済を不安定化させうるとし、貨幣を一定率で増やすk%ルールを唱えた。","長期には貨幣は実物経済に影響せず、インフレは「いつでもどこでも貨幣的現象」だとした。","財政政策はクラウディングアウトのため効果が小さいと評価した。"]},{"n":"新しい古典派と合理的期待","p":["ルーカスらは、人々が利用可能な全ての情報を使い、体系的な誤りをしない予想（合理的期待）を立てると仮定した。","政策無効命題：予想された金融政策は実質GDPや失業率に影響せず、予想外の政策だけが一時的に効果を持つ。","ルーカス批判：政策が変わると人々の行動様式も変わるため、過去のデータで推計したモデルで政策を評価できない。","実物的景気循環（RBC）理論は、景気変動を技術ショックへの最適な反応とみなし、貨幣的要因を重視しない。","ニュー・ケインジアンは合理的期待を取り入れつつ、価格の硬直性（メニューコスト等）から政策の有効性を説明する。"]}]},{"u":"貨幣・金融政策と財政","items":[{"n":"貨幣の機能","p":["貨幣の三機能は、交換手段（決済手段）・価値尺度（計算単位）・価値保蔵手段である。","物々交換には「欲求の二重の一致」が必要だが、貨幣は交換にかかる取引費用を大幅に下げる。","現代の貨幣は金と交換できない不換紙幣で、その価値は発行主体への信認に支えられている。","インフレは価値保蔵機能を損ない、ハイパーインフレでは交換手段としても使われにくくなる。","決済に使える預金は貨幣に含まれる。クレジットカードは後払いの信用であり、貨幣そのものではない。"]},{"n":"マネタリーベースとマネーストック","p":["マネタリーベース＝日本銀行券発行高＋貨幣（硬貨）流通高＋日銀当座預金。中央銀行が直接供給する通貨である。","マネーストックは金融部門から経済全体に供給される通貨の残高（国や金融機関の保有分を除く）。日本銀行が統計を作る。","M1＝現金通貨＋預金通貨、M3＝M1＋準通貨（定期預金など）＋CD。M2は預金の範囲を国内銀行等に限る。","広義流動性はM3に投資信託・国債・金融債などを加えた、最も広い通貨の指標である。"]},{"n":"信用創造と信用乗数","p":["銀行は預金の一部を準備として残し残りを貸す。貸出が別の銀行の預金となる連鎖で預金が膨らむ（信用創造）。","計算例：本源的預金100、準備率10%なら預金総額は100÷0.1＝1000、新たに生まれた預金は900となる。","信用乗数（貨幣乗数）＝M/H＝(c+1)/(c+r)。cは現金預金比率、rは準備預金比率、Hはマネタリーベース。","例：c=0.1、r=0.1なら乗数5.5。量的緩和期には日銀当座預金が積み上がり、乗数は大きく低下した。"]},{"n":"金融政策の手段","p":["主な手段は、公開市場操作（国債買入れ・資金供給オペなど）、当座預金への付利、貸出制度、準備率操作である。","日本銀行は無担保コールレート（オーバーナイト物）の誘導目標を政策金利とし、金融政策決定会合で決める。","補完当座預金制度の付利金利は短期金利の下限、補完貸付制度の基準貸付利率は上限として働く。","2026年9月の利上げで付利金利は1.25%、基準貸付利率は1.5%となった（いずれも9月24日適用）。","かつての公定歩合は2006年に「基準割引率および基準貸付利率」と改称され、政策金利としての役割を終えた。"],"s":[3]},{"n":"金融政策の波及経路","p":["金利経路：政策金利の引下げが市場金利・貸出金利を下げ、設備投資・住宅投資・耐久財消費を刺激する。","為替経路：金利低下は内外金利差を通じて自国通貨安を招き、純輸出を増やし輸入物価を押し上げる。","資産価格経路：株価・地価の上昇が資産効果やトービンのqを通じて消費・投資を増やす。","信用経路：担保価値の上昇や銀行の貸出余力の拡大により、企業や家計の借入制約が緩む。","期待経路：将来の政策運営の約束（フォワードガイダンス）が予想インフレ率や長期金利に働きかける。"]},{"n":"実質金利と中立金利","p":["フィッシャー方程式：実質金利≒名目金利−予想インフレ率。投資や消費の判断は実質金利に左右される。","中立金利は景気を過熱も冷却もさせない金利水準。名目中立金利＝自然利子率＋予想インフレ率である。","テイラー・ルール（1993年）：i＝r*＋π＋0.5(π−π*)＋0.5×需給ギャップ。インフレ上昇以上に金利を上げる。","日銀審議委員の講演資料は、2026年8月25日時点の日本の実質政策金利を−1.24%（名目1.00%）と試算した。","自然利子率は観測できず推計の幅が大きい。同資料は日本の名目中立金利の試算値を1.1〜2.5%程度と紹介している。"],"s":[11]},{"n":"非伝統的金融政策","p":["名目金利はゼロ付近より大きく下げにくい（ゼロ金利制約）。そこで量・資産・期待に働きかける政策が使われる。","日本銀行は1999年にゼロ金利政策と時間軸政策、2001〜06年に当座預金残高を目標とする量的緩和を実施した。","フォワードガイダンスは将来の政策の約束により、短期金利の予想を通じて長期金利を下げる。","マイナス金利政策は当座預金の一部に負の金利を課し、イールドカーブ・コントロールは長期金利を目標水準に操作する。","副作用として、金融機関の収益悪化、債券市場の機能低下、中央銀行の財務悪化、財政規律の緩みが指摘される。"]},{"n":"財政の3機能と自動安定化装置","p":["マスグレイブの財政の3機能：資源配分機能（公共財の供給）、所得再分配機能、経済安定化機能。","累進所得税や失業給付は景気に応じて自動的に税収・支出が変わり、変動を和らげる（ビルト・イン・スタビライザー）。","景気に応じて政府が意図的に支出や税を変えるのが裁量的財政政策（フィスカル・ポリシー）である。","裁量的政策には認知・決定・実施・効果のラグがあり、財政政策は予算の議決が必要なため決定ラグが長い。","租税原則は公平（水平的・垂直的）・中立・簡素。所得税は累進的、消費税は所得に対して逆進的な性質を持つ。"]},{"n":"リカードの等価定理","p":["国債で財源を賄っても将来の増税で償還されるなら、合理的な家計は増税に備えて貯蓄を増やし、消費は変わらない。","したがって国債発行と現在の課税は経済効果が同じになり、国債による減税は景気を刺激しない。","バローは、親が子への遺産で将来の負担に備えるとして、償還が次世代になる場合にも拡張した（バローの中立命題）。","流動性制約、近視眼的な行動、遺産動機の欠如などがあると成立せず、現実には完全には成り立たないとされる。"]},{"n":"財政の持続可能性","p":["プライマリーバランス（基礎的財政収支）＝税収等−国債費（元利払い）を除く歳出。黒字なら政策経費を税等で賄える。","債務残高対GDP比は、PBが均衡し名目金利が名目成長率以下なら上昇しない（ドーマー条件）。","債務比率の変化≒（名目金利−名目成長率）×債務比率−PB対GDP比。金利上昇は利払費を通じて財政を圧迫する。","日本の債務残高対GDP比は主要先進国の中で最も高い水準にある。","国債には公共事業等の財源となる建設国債（財政法4条）と、特例法に基づく特例国債（赤字国債）がある。"]}]},{"u":"経済成長と景気循環","items":[{"n":"ハロッド＝ドーマー・モデル","p":["保証成長率Gw＝s/v（s：貯蓄率、v：必要資本係数）。資本の完全利用を保つ成長率で、例：s=0.2、v=4なら5%。","自然成長率Gn＝労働力人口の増加率（＋技術進歩率）。完全雇用を保つ成長率である。","現実の成長率がGwから外れると乖離が拡大していく（ナイフ・エッジ、不安定性原理）。","貯蓄率と資本係数が固定されているため、Gw＝Gnとなる均斉成長は偶然にしか成り立たない。"]},{"n":"ソロー・モデル","p":["新古典派成長モデル。資本と労働が代替可能で、規模に関して収穫一定・限界生産力逓減の生産関数を仮定する。","1人当たり資本の変化Δk＝sf(k)−(n+δ)k。sf(k)＝(n+δ)kとなる定常状態に収束し、均衡は安定である。","例：f(k)=√k、s=0.2、n+δ=0.1なら、0.2√k=0.1kよりk=4、1人当たり所得y=2となる。","貯蓄率の上昇は定常状態の1人当たり所得の水準を上げるが、長期の成長率は変えない（水準効果）。","定常状態での1人当たり所得の持続的な成長は、外生的な技術進歩でしか説明できない。"]},{"n":"黄金律と収束仮説","p":["黄金律は定常状態の1人当たり消費を最大にする資本水準で、資本の限界生産力＝n+δが条件となる。","コブ＝ダグラス型では、黄金律を実現する貯蓄率は資本分配率αに等しい。","黄金律より資本が多い状態は動学的に非効率で、貯蓄を減らすと今も将来も消費が増える。","絶対的収束は貧しい国ほど速く成長する仮説、条件付き収束は同じ定常状態を持つ国の間で収束する仮説。","実証的には世界全体での絶対的収束は確認されず、条件付き収束を支持する結果が多い。"]},{"n":"成長会計と全要素生産性","p":["成長会計：経済成長率＝TFP上昇率＋資本分配率×資本増加率＋労働分配率×労働増加率。","コブ＝ダグラス型Y=AK^αL^(1−α)の両辺の変化率をとって導かれる。αは資本分配率に当たる。","全要素生産性（TFP）は資本・労働の投入増で説明できない成長部分で、ソロー残差とも呼ばれる。","計算例：成長率3%、資本増加率4%、労働増加率1%、資本分配率0.3なら、TFP上昇率＝3−1.2−0.7＝1.1%。"]},{"n":"内生的成長理論","p":["内生的成長理論は技術進歩や人的資本の蓄積をモデルの中で説明し、長期の成長率が政策で変わりうるとする。","AKモデルY＝AKでは資本の限界生産力が逓減せず、成長率＝sA−δとなって貯蓄率が長期成長率を高める。","ローマーは知識の非競合性と波及効果（スピルオーバー）が収穫逓減を打ち消すとした。","ルーカスは人的資本の外部性を重視した。研究開発・教育・知的財産の保護が成長政策の焦点となる。"]},{"n":"景気循環の類型と指標","p":["キチン波（約40か月・在庫投資）、ジュグラー波（約10年・設備投資）、クズネッツ波（約20年・建設投資）が代表的。","コンドラチェフ波は約50年周期の長期波動で、シュンペーターは技術革新（イノベーション）の群生で説明した。","内閣府の景気動向指数には先行・一致・遅行指数があり、CI（変化の大きさ）とDI（波及度）で作成される。","景気の山・谷（景気基準日付）は、内閣府の景気動向指数研究会の議論を経て事後的に判定される。","サミュエルソンの乗数・加速度原理の相互作用モデルは、需要側から景気の循環的変動を説明する。"]}]},{"u":"開放経済と国際経済","items":[{"n":"比較優位と貿易の利益","p":["リカードの比較生産費説：各国が機会費用の低い財（比較優位財）に特化して交換すれば、両国の消費可能量が増える。","絶対優位がなくても、比較優位は必ずどちらかの財に存在する。","例：A国は布1単位に労働2・ワインに4、B国は布3・ワイン3なら、布の機会費用はA国0.5・B国1でA国が布に比較優位。","交易条件が両国の国内の交換比率（機会費用）の間に決まれば、両国とも貿易の利益を得る。"]},{"n":"ヘクシャー＝オリーン定理","p":["各国は自国に相対的に豊富な生産要素を集約的に使う財に比較優位を持ち、それを輸出する。","要素価格均等化定理：自由貿易により、生産要素が国際移動しなくても各国の要素価格は均等化に向かう。","ストルパー＝サミュエルソン定理：ある財の相対価格が上がると、その財に集約的な要素の実質報酬が上がる。","リプチンスキー定理：財価格一定で、ある要素が増えるとその要素集約的な財の生産が増え、他方の財は減る。","レオンチェフの逆説：資本豊富とみられた米国の輸出品が、輸入品より労働集約的だったという実証結果。"]},{"n":"国際収支の構成","p":["経常収支＋資本移転等収支−金融収支＋誤差脱漏＝0。日本は2014年1月分以降この新形式（IMF第6版）で公表。","経常収支は貿易・サービス収支、第一次所得収支（投資収益など）、第二次所得収支（無償資金援助など）からなる。","金融収支は直接投資・証券投資・金融派生商品・その他投資・外貨準備からなり、対外資産の純増をプラスで表す。","近年の日本の経常黒字は、貿易収支よりも対外投資から得る第一次所得収支の黒字が主因である。","Jカーブ効果：通貨安の直後は輸入価格の上昇が先に効いて貿易収支が悪化し、数量の調整後に改善する。"]},{"n":"貯蓄・投資バランス","p":["Y＝C＋I＋G＋EX−IMとY＝C＋S＋Tから、(S−I)＋(T−G)＝EX−IM（ISバランス）が導かれる。","経常黒字は国内の貯蓄超過（民間の貯蓄超過＋財政黒字）に等しく、対外純資産の増加を意味する。","民間の貯蓄超過が一定なら、財政赤字の拡大は経常収支を悪化させる（1980年代米国の「双子の赤字」）。","ISバランスは事後的な恒等式であり、それ自体は因果関係を示さない。","ライフサイクル仮説に従えば、高齢化で家計の貯蓄率が下がると経常黒字は縮小しやすい。"]},{"n":"購買力平価","p":["絶対的購買力平価：為替レート＝自国物価÷外国物価。同じ財は同じ価格になるという一物一価の法則に基づく。","相対的購買力平価：為替レートの変化率≒自国のインフレ率−外国のインフレ率。インフレ率の高い国の通貨は減価する。","例：同じハンバーガーが日本で500円、米国で4ドルなら、購買力平価は1ドル＝125円となる。","非貿易財・輸送費・関税などのため短期には成り立ちにくく、主に長期の為替水準の目安とされる。","実質為替レート＝名目為替レート（円/ドル）×米国物価÷日本物価。値が大きいほど日本の財の価格競争力が高い。"]},{"n":"金利平価と為替の変動","p":["カバーなし金利平価：自国金利≒外国金利＋自国通貨の予想減価率。高金利通貨は将来の減価が予想されている。","カバー付き金利平価は先物為替レートを使う関係で、裁定取引により比較的よく成り立つ。","日米の金利差が広がると米ドル資産で運用する魅力が高まり、円安・ドル高の圧力がかかる。","円安は輸出企業の円建て収益を増やす一方、輸入物価を上げて家計の実質所得を減らす。"]},{"n":"マンデル＝フレミング（変動相場）","p":["資本移動が完全な小国開放経済では、国内金利は世界金利に等しく、BP曲線は水平になる。","変動相場制の財政拡大：金利上昇圧力→資本流入→自国通貨高→純輸出減となり、所得は増えない（財政政策は無効）。","変動相場制の金融緩和：金利低下圧力→資本流出→自国通貨安→純輸出増となり、所得が増える（金融政策は有効）。","資本移動が不完全な場合や大国の場合は、どちらの政策も一定の効果を持つ。"]},{"n":"固定相場制と国際金融のトリレンマ","p":["固定相場制の財政拡大：通貨高圧力を抑える自国通貨売り介入で貨幣量が増え、所得が大きく増える（財政政策は有効）。","固定相場制の金融緩和：通貨安圧力を抑える介入で貨幣量が元に戻るため、所得は変わらない（金融政策は無効）。","国際金融のトリレンマ：為替相場の安定・自由な資本移動・独立した金融政策の3つは同時に実現できない。","日本や米国は資本移動の自由と金融政策の独立を選んで変動相場制をとり、ユーロ圏は域内で金融政策を共通化した。","固定相場のブレトン・ウッズ体制は1971年のニクソン・ショックで揺らぎ、1973年に主要国は変動相場制へ移行した。"]}]},{"u":"日本銀行の政策と日本経済","items":[{"n":"日本銀行と物価安定の目標","p":["日本銀行法は日銀の理念を、物価の安定を図ることを通じて国民経済の健全な発展に資することと定めている。","金融政策は総裁・副総裁2人・審議委員6人の計9人の政策委員会が、年8回の金融政策決定会合で多数決により決める。","日銀は2013年1月、消費者物価の前年比上昇率2%を「物価安定の目標」として導入し、政府と共同声明を出した。","2%とする理由には、物価指数の上方バイアス、景気悪化時の利下げ余地の確保、海外中央銀行との整合性がある。","経済・物価情勢の展望（展望レポート）を年4回公表し、政策委員の成長率・物価の見通しを示す。"]},{"n":"量的・質的金融緩和（2013年〜）","p":["2013年4月4日導入。金融市場調節の操作目標を無担保コールレートからマネタリーベースに変更した。","マネタリーベースを年60〜70兆円増やし、長期国債・ETFの保有を大幅に拡大して2年程度での2%達成を目指した。","2014年10月31日に拡大し、マネタリーベースの増加ペースを年80兆円に引き上げた。","買い入れる国債の平均残存期間の長期化やETF・J-REITなどリスク資産の買入れが「質的」緩和の中身である。","当初目指した2年程度での2%達成はできず、目標の達成見通し時期は繰り返し後ずれした。"],"s":[10]},{"n":"マイナス金利とYCC","p":["2016年1月29日、日銀当座預金の一部に−0.1%を適用するマイナス金利付き量的・質的金融緩和を決めた。","当座預金を3階層に分け、基礎残高に+0.1%、マクロ加算残高に0%、政策金利残高に−0.1%を適用した。","2016年9月21日に長短金利操作付き量的・質的金融緩和（YCC）を導入し、短期−0.1%、10年金利ゼロ%程度を目標とした。","同時に、消費者物価上昇率の実績が安定的に2%を超えるまでマネタリーベース拡大を続けると約束した（オーバーシュート型）。","YCCは2022年12月、2023年7月・10月に柔軟化され、10年金利は最終的に1%を上限の目途とする運用となった。"],"s":[10]},{"n":"2024年3月の枠組み見直し","p":["2024年3月19日、2%目標の持続的・安定的な実現が見通せる状況に至ったとして、マイナス金利とYCCを終えた。","政策金利を無担保コールレート0〜0.1%程度とし、当座預金（所要準備額相当部分を除く）に0.1%を付利した。","ETFとJ-REITの新規買入れを終了し、CP・社債等の買入れは段階的に減らして1年後をめどに終了するとした。","長期国債は概ね同程度の金額（月6兆円程度）で買入れを続け、長期金利急上昇時は機動的に対応するとした。","政策金利の決定は賛成7・反対2。2007年2月以来、17年ぶりの利上げとなった。"],"s":[6]},{"n":"利上げの経緯（2024〜26年）","p":["2024年7月31日に政策金利を0.25%程度へ引き上げ（8月1日適用）、同時に長期国債買入れの減額計画を決めた。","2025年1月24日に0.5%程度へ（1月27日適用）、同年12月19日に0.75%程度へ（12月22日適用）引き上げた。","2026年1月・3月の会合は0.75%で据え置き、いずれも1.0%への利上げを求める委員1人の議案が否決された。","2026年6月16日に1.0%程度へ（6月17日適用）、9月18日に1.25%程度へ（9月24日適用）引き上げた。","2026年9月の利上げは賛成7・反対2で、反対の2委員は物価・景気の加速が見られないとして据え置きを主張した。"],"s":[7,8,9,4,3]},{"n":"2026年11月時点の金融政策","p":["2026年10月30日の会合で政策金利を1.25%程度に据え置いた（賛成8・反対1）。1.5%への利上げ議案は否決された。","2026年11月時点で無担保コールレートの誘導目標は1.25%程度、補完当座預金の付利金利1.25%、基準貸付利率1.5%。","2026年10月展望レポートの見通し中央値：コアCPIは2026年度+2.5%、2027年度+2.6%、2028年度+2.0%。","同見通しの実質GDP成長率は2026年度+0.7%、2027年度+0.7%、2028年度+0.8%。物価は上振れリスクの方が大きい。","日銀は、見通しが実現していけば引き続き政策金利を引き上げ、金融緩和の度合いを調整する方針を示している。"],"s":[0,2,3]},{"n":"国債買入れ減額とETF売却","p":["2024年7月、長期国債の月間買入れ額を原則四半期ごとに4,000億円程度減らし、2026年1〜3月に約3兆円とする計画を決定。","2026年4月以降は減額幅を四半期ごと2,000億円程度とし、月間買入れは2026年10〜12月2.3兆円、2027年1〜3月2.1兆円程度。","2026年6月の決定で、2027年4月以降は月間2兆円程度の買入れを続け、長期金利急上昇時は機動的に増額するとした。","保有ETFの売却ペースを年間簿価3,300億円程度から8,600億円程度（時価約2.46兆円）へ引き上げ、2027年1月に開始。","新ペースは市場の売買代金の0.1%程度に当たり、処分完了まで約43年（従来約112年）の計算。J-REITは年50億円程度。"],"s":[7,5,1,0]},{"n":"日本の物価・金利・雇用の現状","p":["2026年9月の全国CPI（2025年基準）は、生鮮食品を除く総合が前年同月比+2.1%（8月+1.7%）に伸びが拡大した。","同月の生鮮食品及びエネルギーを除く総合は前年同月比+2.4%で、8月の+1.9%から伸びが高まった。","展望レポート（2026年10月）は、コアCPI前年比が足もと2%程度、予想物価上昇率も2%程度にあると評価した。","日銀審議委員の講演資料によると、2026年8月25日時点の10年国債利回りは2.89%、30年は4.06%だった。","2026年9月の完全失業率（季節調整値）は2.4%と低く、労働需給は引き締まった状態が続いている。"],"s":[14,2,11,12]}]}]},{"id":"python","name":"プログラミング（Python）","full":"プログラミング言語Python（入門〜中級）","group":"教養・専門","desc":"環境構築から文法・標準ライブラリ・テスト・最新版の新機能まで","asOf":"Python 3.15（3.15.2）の公式ドキュメントと What's New 3.12〜3.15 に基づく（2026年11月時点）","aliases":["Python","パイソン","Python3","Pythonプログラミング","プログラミング"],"sources":[{"t":"Python チュートリアル（docs.python.org）","u":"https://docs.python.org/3/tutorial/index.html"},{"t":"Python 標準ライブラリ：組み込み関数","u":"https://docs.python.org/3/builtins/functions.html"},{"t":"Python 標準ライブラリ：組み込み型","u":"https://docs.python.org/3/builtins/stdtypes.html"},{"t":"Python 標準ライブラリ：組み込み例外","u":"https://docs.python.org/3/builtins/exceptions.html"},{"t":"Python 言語リファレンス：式（演算子の優先順位）","u":"https://docs.python.org/3/reference/expressions.html"},{"t":"Python モジュール索引（collections・itertools・functools・pathlib・dataclasses・enum・typing・json・re・logging・datetime・random・math・copy・unittest・asyncio 等の各リファレンス）","u":"https://docs.python.org/3/py-modindex.html"},{"t":"Python Packaging User Guide：Writing your pyproject.toml","u":"https://packaging.python.org/en/latest/guides/writing-pyproject-toml/"},{"t":"Python Setup and Usage：Using Python on Windows","u":"https://docs.python.org/3/using/windows.html"},{"t":"Python Packaging User Guide：Tool recommendations","u":"https://packaging.python.org/en/latest/guides/tool-recommendations/"},{"t":"Python Packaging User Guide：Project Summaries","u":"https://packaging.python.org/en/latest/key_projects/"},{"t":"What's New In Python 3.12","u":"https://docs.python.org/3/whatsnew/3.12.html"},{"t":"What's New In Python 3.13","u":"https://docs.python.org/3.13/whatsnew/3.13.html"},{"t":"What's new in Python 3.14","u":"https://docs.python.org/3/whatsnew/3.14"},{"t":"What's new in Python 3.15（日本語版）","u":"https://docs.python.org/ja/3.15/whatsnew/3.15.html"},{"t":"python.org：Python 3.15.2 リリースページ","u":"https://www.python.org/downloads/release/python-3152/"}],"units":[{"u":"環境と開発ツール","items":[{"n":"Pythonの入手とインストール","s":[14,7,13],"p":["公式の配布元は python.org で、2026年11月時点の最新安定版は3.15系（3.15.2は2026年10月25日公開）","Windows は Python install manager が推奨で、py install 3.15 で導入し py list で導入済みの版を一覧する","install manager 導入後は python・py・pymanager が使え、複数の版を使い分けるときは py を使う","従来の Windows 用フルインストーラーは3.14で非推奨となり、3.16以降は作られない","free-threading 版は末尾に t を付け py install 3.15t で入れ、py -V:3.15t などで起動する"]},{"n":"インタプリタの起動と実行","s":[0],"p":["python script.py で実行し、引数は sys.argv に文字列のリストで入る（sys.argv[0] はスクリプト名）","python -c 'print(1)' はコード文字列を、python -m モジュール名 はモジュールをスクリプトとして実行する","引数なしで起動すると >>> と継続行 ... の対話モードになり、式の値が表示され直前の値は _ に入る","対話モードの終了は Unix で Ctrl-D、Windows で Ctrl-Z、または quit() を入力する","python -i script.py は実行後に対話モードへ入る。ソースファイルの既定エンコーディングは UTF-8"]},{"n":"仮想環境 venv","s":[0,10],"p":["python -m venv .venv で作成し、コマンドを実行した Python の版がそのまま環境に入る","有効化は macOS・Linux が source .venv/bin/activate、Windows が .venv\\Scripts\\activate","有効化するとプロンプトに環境名が付き、python がその環境の実行ファイルを指す。戻すには deactivate",".venv という名前は多くのシェルで隠され、環境変数定義用の .env ファイルとも衝突しない","3.12から venv は setuptools を事前に入れない。必要なら環境内で pip install setuptools を実行する"]},{"n":"pip によるパッケージ管理","s":[0],"p":["pip は既定で PyPI からパッケージを入手し、python -m pip install 名前 の形で実行する","版の固定は python -m pip install requests==2.6.0、最新版への更新は --upgrade を付ける","要求どおりの版が入っていれば再実行しても何もしない。削除は uninstall、詳細表示は show を使う","python -m pip freeze > requirements.txt で一覧を保存し、install -r requirements.txt で再現する","python -m pip list で、その環境に導入済みのパッケージを一覧表示する"]},{"n":"パッケージ管理ツールの選択肢","s":[8,9],"p":["PyPA の Tool recommendations は多くの作業で特定のツールを一律に推奨せず、主な選択肢を列挙する","仮想環境は標準の venv か多機能な virtualenv、CLI アプリは pipx でアプリごとに隔離して入れる","uv は Rust 製のパッケージ・プロジェクト管理ツールで、仮想環境・ロック・Python の版の管理も扱う","Poetry・PDM・Hatch は依存関係の導入と環境の隔離をまとめて扱うワークフローツールである","conda は言語を問わないパッケージ・環境管理系で、科学技術系ソフトの導入手段に挙げられる"]},{"n":"pyproject.toml","s":[6],"p":["[build-system] にビルドに必要な requires と build-backend を書くことが強く推奨される","[project] に name（必須）、version、dependencies、requires-python などのメタデータを書く","追加機能の依存は [project.optional-dependencies] に置き、pip install pkg[gui] の形で導入する","[project.scripts] に spam-cli = \"spam:main_cli\" と書くと、導入時にコマンドの入口が作られる","dynamic = [\"version\"] とすると版をビルドバックエンドが算出し、ツール固有の設定は [tool.xxx] に置く"]}]},{"u":"基本文法と組み込み型","items":[{"n":"変数と名前","s":[0],"p":["代入は値に名前を結び付ける操作で、b = a はオブジェクトを複製せず同じものを指す","名前は英字・数字・_ で作り、数字では始められない。1abc = 3 は SyntaxError になる","class や if などのキーワードは名前に使えず、match・case・type は文脈依存のソフトキーワード","list = [1] と組み込み名を上書きすると list('ab') が TypeError になり、del list で元に戻る","PEP 8 では関数・変数は lowercase_with_underscores、クラスは UpperCamelCase、字下げは空白4つ"]},{"n":"型と動的型付け","s":[1,2],"p":["型は値の側にあり、同じ名前に int を入れた後で str を代入してもよい（動的型付け）","type(x) は型そのものを返し、isinstance(x, (int, float)) はサブクラスも含めて判定する","bool は int のサブクラスで、True + True は 2、isinstance(True, int) は True","暗黙の変換は限定的で '5' + 1 は TypeError。int('5') + 1 のように明示的に変換する","input() は常に str を返す（末尾の改行は除かれる）。数値にするなら int(input()) とする"]},{"n":"算術演算子","s":[0,2,4],"p":["/ は常に float を返し 6 / 3 は 2.0。// は切り捨て除算、% は剰余、** はべき乗","x == (x // y) * y + x % y が成り立ち、divmod(x, y) は (x // y, x % y) を返す","int と float を混ぜると float に変換され、4 * 3.75 - 1 は 14.0 になる","i += 1 のような複合代入はあるが i++ は SyntaxError。++i は単項プラス2回で値は変わらない","0 ** 0 は 1 と定義され、pow(38, -1, mod=97) は剰余の逆元 23 を返す（3.8以降）"]},{"n":"演算子の優先順位","s":[4,0],"p":["主な演算子を優先度の低い順に並べると lambda、if-else、or、and、not、比較、|、^、&、シフト、+ -、* / // %、単項、**","** は左の単項演算子より強く -3**2 は -9。右側の単項は先に結び付き 2**-1 は 0.5","** は右結合で 2**3**2 は 512。ほかの二項演算子は左結合で 10 - 4 - 3 は 3","比較・in・not in・is・is not は同じ優先順位で連鎖でき、ビット演算より弱く not より強い","A and not B or C は (A and (not B)) or C と解釈される。迷うときは括弧で明示する"]},{"n":"比較と論理演算","s":[2,4,0],"p":["a < b <= c は a < b and b <= c と同じ意味だが、b は1回しか評価されない","異なる型は原則等しくないが数値は値で比べ 1 == 1.0 は True。1 < 'a' は TypeError","and・or は短絡評価し最後に評価したオペランドを返す。'' or 'b' は 'b'、0 and 1 は 0","not は常に True か False を返し、比較より弱いため not a == b は not (a == b)","シーケンスは辞書式に比べ (1, 2) < (1, 2, -1) は True。NaN は自分自身とも等しくない"]},{"n":"整数 int","s":[2],"p":["int は精度が無制限で、2 ** 100 もそのまま計算でき、オーバーフローしない","0b1010（2進）・0o17（8進）・0xff（16進）のリテラルがあり、1_000_000 と _ で区切れる","int(3.99) は 3（0方向へ切り捨て）、int('ff', 16) は 255、int('3.14') は ValueError","既定では4300桁を超える int と str の相互変換が ValueError になり、sys.set_int_max_str_digits で変更する","bin(5) は '0b101'、hex(255) は '0xff'、(-37).bit_length() は 6 を返す"]},{"n":"浮動小数点数 float","s":[0],"p":["float は IEEE 754 の倍精度（53ビット）で、0.1 は2進で正確に表せず近い値で保持される","0.1 + 0.2 は 0.30000000000000004 になり、0.1 + 0.2 == 0.3 は False","比較は math.isclose(a, b) を使い、0 付近の比較では abs_tol の指定が必要になる","float('inf') と float('nan') が作れ、1e3 は 1000.0 という float のリテラルである","正確な十進計算は decimal.Decimal('0.1')、有理数は fractions.Fraction(1, 3) を使う"]},{"n":"文字列 str の基本","s":[0,2,5,10],"p":["'...' と \"...\" は同等で、三重引用符で複数行を書ける。隣接リテラル 'Py' 'thon' は連結される","str は不変で s[0] = 'J' は TypeError。変えるには 'J' + s[1:] のように新しい文字列を作る","範囲外の添字 s[42] は IndexError だが、スライス s[4:42] は範囲外でもエラーにならない","r'C:\\name' のような raw 文字列はエスケープを処理しない。末尾を奇数個の \\ にはできない","3.12から '\\d' のような無効なエスケープは SyntaxWarning を出し、将来は SyntaxError になる予定"]},{"n":"文字列メソッド","s":[2],"p":["s.split() は連続する空白で区切り空要素を除くが、'a,,b'.split(',') は ['a', '', 'b'] を返す","','.join(['a', 'b']) は 'a,b' を返し、要素に str 以外があると TypeError になる","strip('ab') は引数を文字の集合とみなして両端から除き、'abcba'.strip('ab') は 'c'","接頭辞・接尾辞の除去は removeprefix('test_')・removesuffix('.py') を使い、lstrip と混同しない","find は見つからないと -1、index は ValueError。startswith(('a', 'b')) は複数候補を判定する"]},{"n":"f文字列と書式指定","s":[0,10],"p":["f'{式}' で値を埋め込み、f'{x=}' は 'x=10' のように式と値を並べて表示する","f'{pi:.3f}' は小数3桁、f'{n:,}' は3桁区切り、f'{r:.1%}' は百分率、f'{n:05d}' は0埋め","幅と寄せは f'{s:>10}'（右）・f'{s:<10}'（左）・f'{s:^10}'（中央）、f'{s:*^9}' で埋め文字を指定","!r は repr()、!s は str()、!a は ascii() を適用する。波括弧そのものは {{ と }} で書く","f'{x:{w}.2f}' のように、書式指定の中にも {} で式を入れ子にして幅などを可変にできる"]},{"n":"None と真偽値の判定","s":[2,4],"p":["None は値が無いことを表す NoneType の唯一のオブジェクトで、return の無い関数は None を返す","None との比較は == ではなく x is None と書く","偽になるのは None・False・0・0.0・0j・''・()・[]・{}・set()・range(0) などで、他は原則真","'0'・' '・[0] は空ではないので真になる","独自クラスは __bool__ が False か __len__ が 0 を返すと偽になり、どちらも無ければ常に真"]}]},{"u":"データ構造","items":[{"n":"list の操作","s":[0],"p":["append(x) は1要素を末尾に、extend(iter) は展開して追加し、insert(i, x) は位置を指定して挿入する","remove(x) は最初の一致を削除し無ければ ValueError、pop() は末尾を取り出し空なら IndexError","sort()・reverse()・insert() などの破壊的メソッドは None を返すので a = a.sort() は誤り","del a[0] で要素、del a[2:4] で範囲を削除する。index(x) で位置、count(x) で個数を得る","先頭からの取り出しはリストでは遅いため、キューには collections.deque の popleft() を使う"]},{"n":"スライス","s":[0],"p":["s[start:stop:step] は start を含み stop を含まない。s[:i] + s[i:] は常に s と等しい","負の添字は末尾から数え、s[-2:] は末尾2要素、s[::-1] は逆順、s[::2] は1つおきになる","リストのスライスは新しいリスト（浅いコピー）を返し、a[:] は全体のコピーになる","スライス代入で置換や削除ができ、a[2:5] = [] は範囲の削除、a[:] = [] は全要素を消す","スライスは範囲外でもエラーにならず、'Python'[10:] は '' を返す"]},{"n":"tuple","s":[0,2],"p":["タプルを作るのは括弧ではなくカンマで、(1) は int、(1,) や 1, が要素1個のタプルになる","t = 1, 2, 3 はパック、x, y, z = t はアンパックで、異なる種類の値を位置で扱う用途に向く","タプル自体は不変で t[0] = 5 は TypeError だが、中に入れたリストの内容は変更できる","要素がすべてハッシュ可能なら辞書のキーにでき、([1], 2) はハッシュできない","a, b = b, a は右辺を先に評価するため、一時変数なしで値を入れ替えられる"]},{"n":"dict","s":[0,2],"p":["キーはハッシュ可能である必要があり、{[1]: 2} は TypeError: unhashable type: 'list'","無いキーの d['x'] は KeyError、d.get('x', 0) は既定値を返し、'x' in d でキーの有無を調べる","3.7以降は挿入順が保たれ、list(d) はキーを挿入順に、d.items() は (キー, 値) の組を返す","d | other は結合した新しい辞書、d |= other はその場で更新し、重複キーは右側が勝つ（3.9以降）","1 と True と 1.0 は等しくハッシュも同じため、{1: 'a', True: 'b'} は {1: 'b'} になる"]},{"n":"set と frozenset","s":[0,2],"p":["set は重複なし・順序なしの集合で、空集合は set() と書く。{} は空の辞書になる","a | b（和）・a & b（積）・a - b（差）・a ^ b（対称差）・a <= b（部分集合）で演算する","set(xs) で重複を除けるが順序は保たれない。順序を保つなら list(dict.fromkeys(xs)) を使う","set は変更可能でハッシュできず、frozenset は不変でハッシュ可能なので辞書のキーにできる","集合内包表記 {c for c in 'abracadabra' if c not in 'abc'} は {'r', 'd'} になる"]},{"n":"ミュータブルとイミュータブル","s":[0,2],"p":["list・dict・set は変更可能、int・float・str・tuple・frozenset は変更不可（イミュータブル）","不変オブジェクトの s += 'c' は新しいオブジェクトを作るため、先に t = s とした t は元のまま","a = b = [] のように可変オブジェクトを共有すると、a.append(1) の結果が b にも見える","t = (1, [2]) で t[1] += [3] は TypeError になるが、中のリストは [2, 3] に変わってしまう","辞書のキーや集合の要素にはハッシュ可能なオブジェクトが必要で、可変の list や dict は使えない"]},{"n":"内包表記","s":[0],"p":["[x**2 for x in range(10)] は空リストに append するループと同じ結果を簡潔に作る","絞り込みは [x for x in xs if x >= 0]、値の変換は [x if x > 0 else 0 for x in xs] と書く","for を重ねると左側が外側のループになり、[(x, y) for x in a for y in b] と書ける","{x: x**2 for x in (2, 4)} は辞書内包表記。要素をタプルにするなら [(x, x**2) for x in r] と括弧が必須","内包表記のループ変数は外側に漏れず、終了後に参照すると NameError になる"]},{"n":"アンパック","s":[0],"p":["a, *rest = [1, 2, 3] で a は 1、rest は [2, 3]。first, *_, last で両端だけ取り出せる","要素数が合わないと ValueError になり、多すぎれば too many values、少なければ not enough values と出る","(m, n), o = (1, 2), 3 のように入れ子の構造もそのまま分解できる","[*a, *b] でリストを連結し、{**d1, **d2} で辞書を結合すると後のキーが優先される","呼び出し側の f(*args) は位置引数、f(**kwargs) はキーワード引数として展開して渡す"]},{"n":"ソート","s":[0,1,2],"p":["sorted(x) は新しいリストを返し元を変えない。list.sort() はその場で並べ替え None を返す","key=len や key=str.lower で比較キーを、reverse=True で降順を指定する（キーワード専用）","ソートは安定で、等しいキーの要素は元の順序を保つため、段階的に複数キーで並べ替えられる","比較できない型が混ざると、[None, 1] の整列のように TypeError になる","文字列はコードポイント順で、sorted(['b', 'B', 'a']) は ['B', 'a', 'b'] になる"]},{"n":"ループの補助関数","s":[0,1],"p":["enumerate(xs, start=1) は (番号, 要素) の組を返し、手作業のカウンタが不要になる","zip(a, b) は最短の入力で止まり、strict=True を付けると長さの不一致を ValueError にできる","d.items() でキーと値、reversed(seq) で逆順、sorted(set(xs)) で重複を除いて整列しながら回す","反復中の辞書の要素数を変えると RuntimeError、反復中のリストから削除すると要素を取りこぼす","反復中に変更が必要なら新しいリストを作るか、for x in xs[:] のようにコピーを回す"]}]},{"u":"制御構文","items":[{"n":"if 文と条件式","s":[0,4],"p":["if・elif・else で分岐し、ブロックの範囲はインデント（空白4つが推奨）で表す","条件式 x if C else y は C を先に評価し、真なら x、偽なら y を値とする","条件には任意のオブジェクトを使え、if items: はリストが空でないかの判定になる","何もしないブロックには pass を置く。... も仮置きに使われるが、言語上の特別な意味は無い","switch 文は無く、多分岐は elif の連鎖か3.10以降の match 文で書く"]},{"n":"for 文と range","s":[0],"p":["for はイテラブルから要素を順に取り出して回し、添字を数えるループではない","range(5) は 0〜4、range(2, 10, 3) は 2, 5, 8 を生成し、終点は含まない","range は要素を全部は作らない省メモリな列で、print(range(10)) は range(0, 10) と表示される","負のステップも使え range(5, 0, -2) は 5, 3, 1。添字と要素が両方必要なら enumerate を使う","ループ変数はループの終了後も残り、最後に代入された値を保持する"]},{"n":"while 文とループ制御","s":[0],"p":["while 条件: は条件が真の間繰り返し、無限ループは while True: と break で書く","break は最も内側のループを抜け、continue は残りを飛ばして次の反復へ進む","for・while の else 節は、break されずにループが終わったときだけ実行される","else 節は「見つからなかった」場合の処理に使え、return や例外で抜けたときも実行されない","do-while 構文や多重ループを一度に抜ける構文は無く、関数にして return するなどで対応する"]},{"n":"代入式（セイウチ演算子）","s":[0,4],"p":[":= は式の途中で代入しその値を返す（3.8以降）。if (n := len(a)) > 10: のように使う","if や while の条件では括弧なしで書けるが、式文として y := 5 だけを書くと SyntaxError","while chunk := f.read(9000): で読み込みと終了判定を1行にまとめられる","内包表記の条件で [y for x in xs if (y := f(x)) > 0] と計算結果を再利用できる","式の中の代入に = は使えないため、== と書き間違える C 言語風の不具合を防げる"]},{"n":"match 文の基本","s":[0],"p":["3.10で入った構造的パターンマッチで、上から照合し最初に一致した case だけを実行する","case _: は常に一致するワイルドカードで、どの case にも一致しなければ何も実行されない","case 401 | 403: で複数パターンをまとめ、case int(n) if n >= 500: でガード条件を付ける","裸の名前は値を捕捉する変数になり、case RED: の後に別の case があると SyntaxError になる","定数との照合は Color.RED のようなドット付き名前で行い、True・False・None は is で比較される"]},{"n":"match 文の構造パターン","s":[0],"p":["case ['go', direction]: は長さと値で照合し、case ['drop', *items]: で残りをリストで受ける","シーケンスパターンはリストやタプルに一致するが、str やイテレータには一致しない","マッピングパターン {'type': 'user', 'name': name} は余分なキーを無視して一致する","クラスパターン Point(x=0, y=0) は属性で照合し、位置指定には __match_args__ が要る（dataclassは自動）","as で部分パターンに名前を付けられ、ガードは値を捕捉した後に評価される"]}]},{"u":"関数","items":[{"n":"関数の定義と戻り値","s":[0],"p":["def で定義し return で値を返す。return が無いか、値なしの return なら None を返す","複数の値は return a, b でタプルとして返し、x, y = f() で受け取る","関数は第一級オブジェクトで、変数への代入、引数としての受け渡し、戻り値にできる","本体先頭の文字列は docstring になり help(f) や f.__doc__ で読める。1行目は短い要約にする","呼び出しのたびに新しいローカル名前空間が作られ、関数内の代入はそこに入る"]},{"n":"位置引数とキーワード引数","s":[0],"p":["位置引数はキーワード引数より前に書き、f(a=1, 2) は SyntaxError になる","キーワード引数は順序を問わず、parrot(action='VOOM', voltage=1000) のように名前で渡せる","同じ引数を位置とキーワードで二重に渡すと TypeError: got multiple values for argument","必須引数の不足や未知のキーワードも TypeError になり、エラー文に引数名が示される"]},{"n":"デフォルト引数の落とし穴","s":[0],"p":["デフォルト値は関数定義時に一度だけ評価され、定義した時点の値が使われる","def f(a, L=[]) は呼び出し間で同じリストを共有し、f(1) が [1]、続く f(2) が [1, 2] を返す","対策は L=None を既定値にし、本体で if L is None: L = [] と新しく作ること","def f(t=time.time()) も定義時の時刻に固定され、呼び出した時刻にはならない","デフォルト付きの引数の後にデフォルト無しの引数を置くと SyntaxError になる"]},{"n":"可変長引数 *args と **kwargs","s":[0],"p":["*args は余った位置引数をタプルに、**kwargs は余ったキーワード引数を辞書にまとめて受け取る","*args より後ろの引数はキーワード専用になり、def concat(*args, sep='/') と書ける","**kwargs は最後に置き、kwargs のキーは呼び出しで渡した順序を保つ","呼び出し側では list(range(*[3, 6])) が [3, 4, 5] になり、f(**d) は辞書をキーワード引数に展開する","def wrapper(*args, **kwargs): return func(*args, **kwargs) で任意の引数をそのまま中継できる"]},{"n":"位置専用・キーワード専用引数","s":[0],"p":["def f(a, b, /, c, *, d): では / より前が位置専用、* より後ろがキーワード専用になる","位置専用の引数をキーワードで渡すと TypeError（positional-only arguments passed as keyword）","キーワード専用を位置で渡すと takes 3 positional arguments but 4 were given の TypeError","位置専用は名前に意味が無い引数や API 互換の維持に、キーワード専用は呼び出しの可読性向上に使う","位置専用にした名前は **kwds のキーとして再利用でき、def foo(name, /, **kwds) が成り立つ"]},{"n":"ラムダ式","s":[0],"p":["lambda 引数: 式 は単一の式だけを持つ無名関数で、通常の def の糖衣構文である","代入や return などの文は書けず、式の値がそのまま戻り値になる","pairs.sort(key=lambda p: p[1]) のように、小さな関数を引数に渡す用途が典型である","外側の変数を参照でき、make_incrementor(42) のようにラムダを返す関数も作れる","ラムダの __name__ は '<lambda>' で、トレースバックでは区別しにくい"]},{"n":"スコープと LEGB","s":[0],"p":["名前はローカル→外側の関数→グローバル（モジュール）→組み込みの順に探される（LEGB）","global・nonlocal の宣言が無ければ、代入は常に最も内側のスコープに名前を作る","関数内で代入する名前は関数全体でローカル扱いになり、代入前に読むと UnboundLocalError","UnboundLocalError は NameError のサブクラスで、cannot access local variable と表示される","if や for はスコープを作らないが、内包表記の変数は外に漏れない"]},{"n":"global と nonlocal","s":[0],"p":["global x は関数内からモジュールの x に代入し、未定義ならモジュールに新しく作る","nonlocal x は外側の関数の x を再束縛し、外側に束縛が無いと SyntaxError になる","参照するだけなら宣言は不要で、再代入するときだけ必要になる","lst.append(1) のような変更は再代入ではないので、宣言しなくても外側のオブジェクトに反映される","チュートリアルの scope_test では、local 代入は外に影響せず global 代入はモジュールの名前を変える"]},{"n":"クロージャ","s":[0],"p":["外側の変数を参照する内側の関数を返すと、外側の実行が終わった後もその変数を保持し続ける","クロージャが捕捉した変数は f.__closure__ のセルに格納されている","変数は呼び出し時に参照されるため、[lambda: i for i in range(3)] はどれも 2 を返す","定義時の値を固定するには、lambda i=i: i のようにデフォルト引数で束縛する","カウンタのように外側の変数を更新するクロージャには nonlocal 宣言が必要になる"]},{"n":"デコレータ","s":[5],"p":["@deco を def の直前に書くと func = deco(func) と同じで、関数を受け取り関数を返す","functools.wraps(func) を付けないと、包んだ関数の __name__ や __doc__ が wrapper のものになる","wraps は元の関数を __wrapped__ 属性に保存し、__module__ や __qualname__ なども写す","引数付きの @repeat(3) は「デコレータを返す関数」で、関数を3段に入れ子にして作る","@a と @b を重ねると関数に近い下側から適用され、f = a(b(f)) と同じになる"]}]},{"u":"例外処理","items":[{"n":"try と except","s":[0],"p":["try 節で例外が起きると残りを飛ばし、型が一致する最初の except 節だけが実行される","except は指定クラスとそのサブクラスに一致するため、具体的な例外ほど先に書く","except (ValueError, TypeError) as e: で複数の型をまとめ、e で例外オブジェクトを受け取る","except ... as e の e はブロックの終わりで削除され、その後に参照すると NameError になる","一致する except が無ければ外側の try へ伝わり、最後まで処理されなければプログラムが止まる"]},{"n":"else と finally","s":[0,12],"p":["else 節は try 節で例外が起きなかったときだけ実行され、try で守る範囲を最小にできる","finally 節は例外の有無にかかわらず最後に必ず実行され、後片付けに使う","except で処理されなかった例外は、finally の実行後に再送出される","try 内の return より先に finally が実行され、finally 内の return は戻り値を上書きする","3.14から finally を return・break・continue で抜けると SyntaxWarning が出る（PEP 765）"]},{"n":"例外の階層","s":[3,0],"p":["全例外の基底は BaseException で、通常の例外は Exception のサブクラスとして定義される","KeyboardInterrupt と SystemExit は Exception を継承しないので except Exception では捕まらない","KeyError・IndexError は LookupError の子、ZeroDivisionError は ArithmeticError の子である","FileNotFoundError・PermissionError・TimeoutError は OSError の子で、errno に応じて選ばれる","ModuleNotFoundError は ImportError の子、RecursionError は RuntimeError の子である"]},{"n":"raise と再送出","s":[0,4],"p":["raise ValueError('msg') で送出し、raise ValueError はクラスを引数なしで生成する省略形である","except 節の中で引数なしの raise を書くと、捕捉中の例外をそのまま再送出する","例外の引数は e.args にタプルで入り、str(e) や print(e) で表示される","except Exception で広く捕まえる場合は、ログを出した後に raise で再送出するのが勧められる","assert 条件, 'msg' は偽なら AssertionError を送出するが、python -O では除去される"]},{"n":"例外の連鎖と注記","s":[0,3],"p":["except 中に別の例外が起きると元の例外が __context__ に入り、During handling of ... と表示される","raise New from exc は直接の原因を __cause__ に記録し、direct cause として表示される","raise New from None は連鎖の表示を抑え、__suppress_context__ が True になる","e.add_note('文脈') で注記を追加でき（3.11以降）、__notes__ に入り追加順にトレースバックへ出る","add_note に文字列以外を渡すと TypeError になる"]},{"n":"独自の例外クラス","s":[0,3],"p":["独自例外は BaseException ではなく Exception を直接または間接に継承して作る","名前は標準の例外にならい、末尾を Error にするのが慣例である","class AppError(Exception) を基底にし ConfigError(AppError) と階層化すると、まとめて捕まえられる","追加情報は属性に持たせ、__init__ で super().__init__(msg) を呼ぶと str(e) に反映される"]},{"n":"ExceptionGroup と except*","s":[0,3],"p":["ExceptionGroup('msg', [OSError(1), ValueError(2)]) は複数の例外を束ねて送出する（3.11以降）","except* OSError はグループ中の該当する例外だけを処理し、一致しなかった例外は再送出される","同じ try に except と except* は混在できず、except* ブロック内では return・break・continue も不可","ExceptionGroup は Exception 系だけを包め、KeyboardInterrupt を含めるなら BaseExceptionGroup を使う","eg.split(ValueError) は（一致した部分, 残り）の組を、subgroup は一致した部分だけを返す"]}]},{"u":"モジュールとファイル","items":[{"n":"import の書き方","s":[0],"p":["import fibo はモジュール名だけを名前空間に加え、中の関数は fibo.fib のように参照する","from fibo import fib は名前を直接取り込み、この場合 fibo という名前は定義されない","import fibo as fib や from fibo import fib as fibonacci で別名を付けられる","from mod import * は _ で始まらない名前を全部取り込むが、既存の名前を隠しやすく対話用にとどめる","モジュールは1セッションで一度だけ実行され、編集後は importlib.reload(mod) で再読み込みする"]},{"n":"__name__ と \"__main__\"","s":[0],"p":["スクリプトとして実行したファイルの __name__ は '__main__'、import されたときはモジュール名になる","if __name__ == '__main__': の下の処理は直接実行したときだけ動き、import では動かない","モジュールに簡単なコマンドライン操作やテスト実行の入口を付ける目的で使われる","python -m pkg.mod で実行した場合も、そのモジュールの __name__ は '__main__' になる"]},{"n":"モジュール検索パス","s":[0,11],"p":["import は組み込みモジュールを確かめた後、sys.path を先頭から探し最初に見つかったものを使う","sys.path はスクリプトのあるディレクトリ、PYTHONPATH、site-packages を含む既定値から作られる","スクリプトのディレクトリは標準ライブラリより前にあるため、自作の random.py が標準の random を隠す","3.13以降はこの衝突によるエラーで、標準ライブラリと同名のファイルの改名を促すメッセージが出る","コンパイル結果は __pycache__/mod.cpython-313.pyc などに保存され、速くなるのは読み込みだけである"]},{"n":"パッケージと相対インポート","s":[0],"p":["パッケージはモジュールをまとめたディレクトリで、__init__.py を置く（空でもよい）","import sound.effects.echo のように、ドット区切りでサブモジュールを指定する","パッケージ内では from . import echo や from ..filters import equalizer と相対インポートできる","メインとして実行するモジュールは属するパッケージが無いので、相対インポートできず絶対インポートを使う","__init__.py の __all__ = ['echo', 'surround'] は from pkg import * で取り込む名前を決める"]},{"n":"open() と読み書き","s":[0,1],"p":["mode は 'r'（既定・読み込み）、'w'（中身を消して書く）、'a'（追記）、'x'（既存なら FileExistsError）","'b' を付けるとバイナリモードで bytes を扱い、同時に encoding を渡すと ValueError になる","テキストモードは読み込み時に \\r\\n などの改行を \\n に変換するため、画像などはバイナリで開く","f.read() は全体、f.readline() は改行付きの1行を返し、ファイルの終わりでは '' を返す","for line in f: で1行ずつ読むと省メモリ。f.write(s) は書き込んだ文字数を返す"]},{"n":"文字エンコーディング","s":[0,13],"p":["3.15から encoding を省略すると、ロケールに関係なく UTF-8 が使われる（PEP 686）","3.14以前は省略時の符号化がロケール依存で、特に Windows では UTF-8 以外になることがあった","どの版でも同じ結果にするには open(p, encoding='utf-8') と明示するのが安全である","ロケールの符号化を使うなら encoding='locale' を指定し、全体を旧動作に戻すなら PYTHONUTF8=0","符号化が合わないと UnicodeDecodeError になる。JSON ファイルは UTF-8 で読み書きする"]},{"n":"with 文とコンテキストマネージャ","s":[0,5],"p":["with open(p) as f: はブロックを抜けると、例外が起きた場合も含めて自動的にファイルを閉じる","with も close() も使わないと、書き込みがディスクに反映されない可能性がある","閉じた後の f.read() は ValueError: I/O operation on closed file になる","__enter__ の戻り値が as の変数に入り、__exit__ が真を返すとブロック内の例外は抑止される","contextlib.contextmanager を付けたジェネレータでは、yield の前が準備、後が後片付けになる"]},{"n":"pathlib の基本","s":[5],"p":["Path('/srv') / 'data' / 'a.txt' のように / 演算子でパスを組み立てる","p.name は 'a.tar.gz'、p.stem は 'a.tar'、p.suffix は '.gz'、p.suffixes は ['.tar', '.gz']","p.parent は親を返し、p.with_suffix('.zip') や p.with_name('b.txt') は差し替えた新しいパスを返す","PurePath は文字列上の操作だけを行い、Path はファイルシステムにアクセスする具象クラスである","Path.cwd() は作業ディレクトリ、Path.home() はホーム、resolve() は .. やリンクを解決した絶対パス"]},{"n":"pathlib のファイル操作","s":[5],"p":["exists()・is_file()・is_dir() で状態を調べ、3.14からはアクセス不能でも OSError でなく False を返す","read_text(encoding='utf-8') と write_text(s, encoding='utf-8') で一度に読み書きできる","mkdir(parents=True, exist_ok=True) は途中のディレクトリも作り、既にあってもエラーにしない","glob('*.py') はイテレータを返し、rglob('*.py') や '**/*.py' で再帰的に探す。順序は不定","unlink(missing_ok=True) は rm -f 相当で、3.14から copy()・copy_into()・move()・move_into() が加わった"]}]},{"u":"クラスとオブジェクト","items":[{"n":"クラス定義とメソッド","s":[0,1],"p":["class Dog: で定義し Dog('Fido') で生成すると、__init__ が自動で呼ばれて初期化する","d.bark() は Dog.bark(d) と等価で、第1引数の self は慣例の名前にすぎない","@classmethod はクラスを cls で受け取り、Dog.from_str(s) のような代替コンストラクタに使う","@staticmethod は self も cls も受け取らない、クラス内に置いた普通の関数である","インスタンス属性は代入時に作られて obj.__dict__ に格納され、del obj.x で削除できる"]},{"n":"クラス属性とインスタンス属性","s":[0],"p":["クラス直下で代入した変数はクラス属性で全インスタンスが共有し、self.x への代入はインスタンス属性","同名ならインスタンス属性が優先され、d.kind = 'wolf' は d にだけ属性を作り Dog.kind は変わらない","クラス属性に tricks = [] を置くと全インスタンスが1つのリストを共有し、d の追加が e にも見える","インスタンスごとの可変データは __init__ の中で self.tricks = [] と作る","インスタンスに無い属性はクラス、さらに基底クラスへと順に探される"]},{"n":"継承と super()","s":[0],"p":["class Cat(Animal): で継承し、同名のメソッドを定義すると上書き（オーバーライド）になる","super().__init__(name) で基底の初期化を呼ぶ。呼び忘れると基底側の属性が作られない","isinstance(c, Animal) はサブクラスのインスタンスにも True、issubclass(bool, int) も True","多重継承 class D(B, C): の探索順は MRO で決まり、D.__mro__ や D.mro() で確認できる","super() は MRO 上の次のクラスを呼ぶため、ひし形継承でも D→B→C→A と各クラスが一度ずつ呼ばれる"]},{"n":"名前マングリングと非公開","s":[0],"p":["Python にアクセス制限は無く、先頭に _ を付けた名前は「内部用」を示す慣習にとどまる","__spam（先頭に _ が2つ以上、末尾は1つ以下）はクラス内で _クラス名__spam に置き換えられる","マングリングはサブクラスとの名前衝突を防ぐ仕組みで、obj._Acc__secret のように外から触れてしまう","__init__ のように前後に __ が付く名前は特殊メソッドで、マングリングの対象外である"]},{"n":"特殊メソッド","s":[1,2],"p":["__repr__ は開発者向けの曖昧さの無い表現、__str__ は print 用で、未定義なら __repr__ が使われる","__len__ は len()、__getitem__ は添字に対応し、__getitem__ だけでも for や in が使える","__contains__ は in、__iter__ は反復、__call__ はインスタンスを関数のように呼べるようにする","__enter__ と __exit__ を定義すると、with 文で使えるコンテキストマネージャになる","__slots__ = ('x',) を定義すると __dict__ が作られず、未定義の属性への代入は AttributeError"]},{"n":"演算子オーバーロード","s":[1,12],"p":["a + b は a.__add__(b) を呼び、NotImplemented が返ると b.__radd__(a) を試す","扱えない型には例外でなく NotImplemented を返すのが作法で、両側とも未対応なら TypeError になる","sum() は 0 + 最初の要素 から計算を始めるため、独自型を合計するには __radd__ が必要になる","a += b は __iadd__ を呼び、無ければ __add__ で新しいオブジェクトを作って再代入する","3.14から NotImplemented を真偽値として評価すると TypeError になる"]},{"n":"__eq__ と __hash__","s":[1,2,5],"p":["既定の == は同一性で比べるため、別々に作った同じ内容のインスタンスは等しくならない","__eq__ だけを定義すると __hash__ が None になり、辞書のキーや集合の要素にできなくなる","a == b ならば hash(a) == hash(b) でなければならず、1 == 1.0 なので hash(1) == hash(1.0)","__ne__ は既定で __eq__ の結果を反転して返す","functools.total_ordering は __eq__ と __lt__ などから、残りの比較メソッドを補う"]},{"n":"property","s":[1,5],"p":["@property を付けたメソッドは属性のように読め、計算値や検証付きのアクセスを提供する","@x.setter で代入時の処理を定義し、範囲外の値に ValueError を送出するなどの検証ができる","setter の無いプ
