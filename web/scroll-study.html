の構成（120〜150語）","p":["POINTS4つのうち2つを使って理由を書き、序論・本論・結論の構成にする","序論で立場を明示し、本論は使うPOINTごとに1段落、結論で立場を言い換えて再提示する","語数配分の一例：序論25語、本論各45語、結論25語","自作TOPIC例：Should governments do more to reduce food waste?"],"s":[6]},{"n":"理由の展開のしかた","p":["理由が妥当でも、説明や具体例がないと説得力が不足する","「安いから」「便利だから」で終えず、誰にどのような影響があるかまで書く","展開の型：First, 理由. For example, 具体例. As a result, 影響.","Yes の理由だけ、No の理由だけで書き、反対側の理由を混ぜない"],"s":[8]},{"n":"使える表現","p":["立場：I believe that …／I do not think that …","列挙：First, … Second, …／Another reason is that …","因果：lead to（〜につながる）、result in（〜という結果になる）、because of","結論：For these reasons, …／In conclusion, …"]},{"n":"トピックの傾向","p":["2級は「社会性のある話題」：技術の導入、環境、働き方、教育、観光など","準1級は「社会性の高い話題」：都市と地方、医療・高齢化、AI、環境政策、教育制度など","2026年度第2回の2級は公共交通への自動運転バス導入の是非、準1級は都市部の安全性が出題された","個人の好みより、社会全体への利点・欠点で論じる問いが中心"],"s":[0,1,4,6]},{"n":"書き終えた後の見直し","p":["三単現のs、時制、冠詞・複数形、主語と動詞の一致を確認する","語数を数える。意見論述の語数は「目安」、要約は指定範囲","解答欄の外に書いていないか確認する（欄外は採点されない）","同じ語・同じ文型が続いていたら別の表現に置き換える"],"s":[3,4,6,8]}]},{"u":"2級：二次面接","items":[{"n":"2級面接の全体像","p":["面接委員1人との個人面接で約7分","問題カードには60語程度のパッセージと3コマのイラストが印刷されている","流れ：黙読20秒→音読→No.1→No.2→カードを裏返す→No.3→No.4","評価：応答内容、発音、語彙、文法、語法、情報量、積極的にコミュニケーションを図ろうとする意欲や態度"],"s":[0,11]},{"n":"音読","p":["黙読の20秒で、意味の切れ目と読みにくい語の発音を確認する","主語の後、関係詞・接続詞の前、前置詞句の前など意味のまとまりで区切って読む","名詞・動詞などの内容語を強く、冠詞・前置詞などの機能語を弱く読む","つまずいたら言い直して先へ進む。速さより正確さと聞き取りやすさを優先する"],"s":[0]},{"n":"No.1：パッセージの質問","p":["According to the passage, how／why …? の形でパッセージの内容を問う","答えは本文の by doing so や in this way の直前の文にあることが多い","How の質問は By doing … で、Why の質問は Because S V … で答える","本文をそのまま読むと they・it が不明確になるので、指す内容を具体的にして答える"],"s":[11]},{"n":"No.2：3コマイラストの説明","p":["3コマのイラストの展開を説明する。考える時間は20秒","カードに印刷された書き出し文から始め、各コマを1〜2文の過去形で描写する","吹き出しのせりふは間接話法（told her that …／asked him to …）にする","コマの間に時間の表示があれば、それを文頭に使って次のコマへつなぐ"],"s":[0,11]},{"n":"No.3：カード関連の意見","p":["カードを裏返した後、Some people say that …. What do you think about that? の形で問われる","カードのトピックに関連した事象や意見について述べる","I agree.／I disagree. で立場を示し、理由を2文程度で補う"],"s":[0,11]},{"n":"No.4：日常・社会の意見","p":["Do you think …? に Yes／No で答え、Why?／Why not? と聞かれて理由を述べる","カードのトピックに直接関係しない、日常生活の一般的な事柄も含まれる","理由は一般論＋具体例の2文程度：It saves money. For example, …"],"s":[0,11]},{"n":"2級面接の態度と注意","p":["面接中のメモ・写真撮影・録音は禁止","自然な流れの聞き返し（Pardon?／Could you say that again?）は減点されないが、不自然・繰り返しは減点","意欲や態度も評価に含まれるので、入室から退室まで相手を見て、はっきり話す","沈黙を避け、考える間は Let me see. などでつなぐ","退室後は速やかに会場を出て、待機中の受験者と話さない"],"s":[0]}]},{"u":"準1級：二次面接","items":[{"n":"準1級面接の全体像","p":["面接委員1人との個人面接で約8分","流れ：4コマのイラストを見て1分で考える→2分でナレーション→No.1〜No.4の質問","評価：ナレーション、応答の内容、発音、語彙、文法、語法、情報量、意欲や態度","話題は社会性の高い分野で、過去には在宅勤務、チャイルドシート、護身術などが出た"],"s":[1]},{"n":"1分間の準備","p":["指示文 This is a story about … を読み、物語の主人公と主題をつかむ","メモは取れないので、各コマの「誰が・何をして・どうなったか」を頭の中で組み立てる","4コマ目の状況はNo.1で問われるので、登場人物の気持ちまで考えておく"],"s":[1,12]},{"n":"2分間のナレーション","p":["カードの書き出し文（Your story should begin with the following sentence）を必ず使う","各コマ2〜3文で、過去形を基本に話す。コマ間の時間表示（That evening など）を文頭に使う","せりふは間接話法にし、看板や画面の文字情報も描写に入れる","1コマ30秒前後を目安にし、2分以内に4コマすべてを話し切る"],"s":[1,12]},{"n":"No.1：仮定の質問","p":["Please look at the fourth picture. If you were the …, what would you be thinking? の形","I'd be thinking, \"…\" と直接話法で、登場人物の心情を2文程度で答える","後悔（I should have …）や今後の決意（I'll …）を入れると内容が深まる","No.1の後、問題カードを裏返して置くよう指示される"],"s":[12]},{"n":"No.2・No.3：トピック関連","p":["カードのトピックに関連した内容について、Should …?／Do you think …? の形で問われる","結論→理由→具体例の順で3文前後にまとめる","両面を認めつつ立場を示す表現：That's true to some extent, but …","将来の予測を問われたら、増える・減る・変わらないのどれかを明確にしてから理由を述べる"],"s":[1,12]},{"n":"No.4：社会性のある質問","p":["カードのトピックにやや関連した、社会性のある内容が問われる","2024年度から話題導入文が付き、Today, many people … の後に Do you think …? と続く","政府・企業・地域社会など社会全体の視点で理由を述べる","自作例：Do you think the government should do more to support small businesses?"],"s":[1,2,12]},{"n":"準1級面接の態度と注意","p":["面接中のメモ・写真撮影・録音は禁止","自然な流れの聞き返しは減点されないが、不自然な聞き返しや繰り返しは減点対象","答えに詰まっても沈黙せず、Well, I think … と話し始めてから考えをまとめる","意欲や態度も評価観点なので、面接委員を見て十分な声量で話す"],"s":[1]}]}]},{"id":"kanken","name":"漢検（2級・準2級）","full":"日本漢字能力検定 2級・準2級","group":"資格試験","desc":"常用漢字の読み書き・熟語・送り仮名などを問う漢字検定の2級と準2級","asOf":"2026年度の審査基準・検定料と、2026年度第1回以降の出題形式の報告に基づく（2026年11月確認）","aliases":["漢検","漢字検定","日本漢字能力検定","漢検2級","漢検準2級"],"sources":[{"t":"日本漢字能力検定協会「各級の概要（出題内容・審査基準・合格基準・採点基準）」","u":"https://www.kanken.or.jp/kanken/grades/overview/"},{"t":"日本漢字能力検定協会「2024年度 公開会場 検定実施時間の変更および顔写真提出級追加のお知らせ」","u":"https://www.kanken.or.jp/kanken/topics/2023/2024_1.html"},{"t":"日本漢字能力検定協会「2026年度 日本漢字能力検定 改定のお知らせ（個人受検）」","u":"https://www.kanken.or.jp/kanken/topics/data/20251014_2026kankenkaitei_kojin.pdf"},{"t":"日本漢字能力検定協会「2026年度 日本漢字能力検定 改定のお知らせ（団体受検）」","u":"https://www.kanken.or.jp/kanken/topics/data/20251014_2026kankenkaitei_dantai.pdf"},{"t":"日本漢字能力検定協会「審査基準改定（2012年度）」","u":"https://www.kanken.or.jp/kanken/guideline/"},{"t":"共同通信PRワイヤー「自宅で受検できる『漢検オンライン』新たに2~4級を増設」（2024年9月）","u":"https://kyodonewsprwire.jp/release/202409267049"},{"t":"リセマム「2026年度 漢検の検定料・受検方法」（2025年11月）","u":"https://resemom.jp/article/2025/11/19/84039.html"},{"t":"旺文社「2020年度からの漢検の配当級変更について」","u":"https://www.obunsha.co.jp/pdf/support/kanken2020.pdf"},{"t":"高橋書店「高橋の漢検シリーズ（2026年度 2級・準2級の出題形式の一部変更）」","u":"https://www.takahashishoten.co.jp/houjin/kanken-poster/"},{"t":"漢字辞典オンライン「漢検準2級の漢字一覧（328字）」","u":"https://kanji.jitenon.jp/cat/kyu02j"},{"t":"漢字辞典オンライン「漢検2級の漢字一覧」","u":"https://kanji.jitenon.jp/cat/kyu02"},{"t":"漢検準2級 出る順 無料練習問題（分野別問題）","u":"https://derujun-jun2kyu.com/"},{"t":"漢字検定WEB問題集「漢検2級 問題一覧」","u":"https://kanken.jitenon.jp/mondai02"},{"t":"漢検クエスト「漢検2級 過去問対策（2025年度版）」","u":"https://kanken-kanzenkouryaku.com/2kyu-2025/"},{"t":"漢検クエスト「漢検準2級 過去問対策（2025年度版）」","u":"https://kanken-kanzenkouryaku.com/2jkyu-2025/"}],"units":[{"u":"共通：漢検の概要と受検方式","items":[{"n":"漢検の級と2級・準2級の位置","p":["日本漢字能力検定協会が実施し、10級から1級まで12の級がある。準2級は3級の上、2級は準1級の下に位置する。","2級は「高校卒業・大学・一般程度」で対象2136字、準2級は「高校在学程度」で対象1951字。","2級は常用漢字すべてを読み書き活用できるレベルとされ、常用漢字の範囲では最上位の級にあたる。","年齢・学歴などの受検資格の制限はなく、どの級からでも受検できる。下の級の合格は条件ではない。"],"s":[0]},{"n":"個人受検（公開会場の紙の検定）","p":["紙で解答する検定（PBT）は年3回。2026年度は6月21日、10月18日、2027年2月14日（いずれも日曜）に実施。","2024年度から公開会場の時間割が変わり、2級は11:50〜12:50（2限）、準2級は13:40〜14:40（3限）。どちらも60分。","公開会場では1級・準1級・2級・準2級・3級で顔写真の提出が必要（3級は2024年度に追加）。"],"s":[1,6]},{"n":"団体受検（準会場）","p":["学校・塾・企業などが準会場となって行う団体受検があり、検定料は公開会場より安い。","近くに公開会場がない人などのために、一般受検者を受け入れる「地域開放型準会場」があり、漢検ホームページで案内されている。","地域開放型準会場では、一般の受検者も準会場の検定料で受検できる。","2026年度から志願者がWEBで直接申し込んで支払う方式が加わり、PBT団体受検のFAX申込は廃止された。"],"s":[2,3,6]},{"n":"漢検CBT","p":["パソコンで解答する方式で、全国47都道府県の200か所以上のCBT会場で随時実施される。日程は会場ごとに異なる。","2級・準2級もCBTで受検できる。2026年度の検定料は2級4,800円、準2級3,800円（税込）。","印刷費や物流費を抑えられることから、紙の公開会場より検定料が低く設定されている。"],"s":[2,6]},{"n":"漢検オンライン（自宅受検）","p":["タブレット端末を使い自宅などで受検する方式。2024年10月に2〜4級が加わり、2〜10級を受検できるようになった。","検定日は原則毎週日曜。開始前に監督員とつなぎ、本人と周辺環境を確認する。確認できないと受検できない。","2〜7級の検定時間は60分。結果は検定日の約14日後以降にPDFで通知され、合格者にはオープンバッジも発行される。","2026年度の検定料は2級4,800円、準2級3,800円。準会場で受けるオンラインは2級3,800円、準2級2,800円。"],"s":[5,6]},{"n":"検定料（2026年度）","p":["受検日が2026年4月1日以降の検定から検定料が改定された（税込）。準会場の料金改定は10年以上ぶり。","2級：公開会場（紙）5,200円、CBT・漢検オンライン各4,800円、準会場（紙）4,200円。","準2級：公開会場（紙）4,200円、CBT・漢検オンライン各3,800円、準会場（紙）3,200円。","準2級の料金は4級〜準2級で共通の区分。CBT・漢検オンラインは紙の公開会場より安く設定されている。"],"s":[2,3,6]}]},{"u":"共通：常用漢字表と採点基準","items":[{"n":"常用漢字表の構成","p":["2010年11月30日に内閣告示された常用漢字表は2136字・4388音訓を収め、漢検2〜10級の字種・字体・読みの基準となる。","2010年の改定で196字が加わり、勺・錘・銑・脹・匁の5字が外された。","本表のほか、熟字訓や当て字など特別な読みをする語を集めた「付表」がある（116語）。","漢検は2012年度第1回検定から、この常用漢字表に対応した審査基準で実施している。"],"s":[0,4]},{"n":"採点基準：字の書き方","p":["筆画を正しく明確に書いた字だけが採点の対象。くずした字や乱雑な字は採点の対象外になる。","字種・字体は常用漢字表による。旧字体（例：國・學）で書いた答えは正答と認められない。","筆順は文部省編『筆順指導の手びき』（1958年）の原則による。常用漢字ごとの筆順は『漢検要覧』の一覧に従う。"],"s":[0]},{"n":"採点基準：読み・仮名遣い・部首","p":["読みは常用漢字表に示された音訓による。表にない読みで答えても正答の根拠にはならない。","仮名遣いは内閣告示「現代仮名遣い」による（例：鼻血＝はなぢ、稲妻＝いなずま、世界中＝せかいじゅう）。","送り仮名は内閣告示「送り仮名の付け方」による。","部首は『漢検要覧 2〜10級対応』収録の部首一覧による。辞書によって部首が異なる字も漢検の基準で答える。"],"s":[0]},{"n":"2010年改定で変わった音訓","p":["既存の字に新しい訓が加わった（例：私＝わたし、他＝ほか、全て＝すべて、育む＝はぐくむ、委ねる＝ゆだねる）。","応える（こたえる）、関わる（かかわる）、描く（かく）、混む（こむ）、要（かなめ）、鑑みる（かんがみる）も2010年に加わった訓。","逆に、畝の「せ」、疲の「つからす」、浦の「ホ」の3つの音訓は削除された。"]}]},{"u":"2級：審査基準と試験形式","items":[{"n":"2級の程度と対象漢字","p":["程度は「すべての常用漢字を理解し、文章の中で適切に使える」。対象は常用漢字2136字すべて。","準2級までの1951字に2級配当漢字185字を加えた範囲で、下の級の漢字も含めた全体から出題される。","2020年度の配当変更で2級配当は196字から185字に減った。都道府県名の11字が7級（小学4年配当）へ移ったため。"],"s":[0,7,13]},{"n":"2級の審査基準（領域・内容）","p":["読み書き：音読みと訓読みを正しく理解し、送り仮名や仮名遣いに注意して正しく書けることを求める。","熟語の構成、対義語・類義語・同音同訓異字の理解に加え、熟字訓・当て字（例：海女＝あま、玄人＝くろうと）の理解も基準。","四字熟語は典拠のあるものを理解していること（例：鶏口牛後、呉越同舟）。","部首は、部首を識別して漢字の構成と意味を理解していることが求められる。"],"s":[0]},{"n":"2級の大問構成と配点","p":["読み30問×1点（30点）、部首10問×1点（10点）、熟語の構成10問×2点（20点）。","四字熟語は書き取り10問＋意味5問で各2点（30点）。対義語5問・類義語5問で各2点（20点）。","同音・同訓異字10問（20点）、誤字訂正5問（10点）、送りがな5問（10点）、書き取り25問（50点）。合計200点。","2026年度第1回以降、部首の大問に代わって音訓読み（10問×1点）が出題されたと報告されている。協会の廃止発表はない。"],"s":[8,13]},{"n":"2級の合格基準と検定時間","p":["200点満点で80％程度（160点前後）が合格の目安。準2級の70％程度より高い。","検定時間は60分。公開会場では2024年度から2限（11:50〜12:50）に実施（2023年度までは1限）。","書き取り50点と読み30点で全体の4割を占める。ここで大きく落とすと80％に届きにくい。"],"s":[0,1]}]},{"u":"2級：配当漢字の特徴と例","items":[{"n":"2級配当185字の成り立ち","p":["2級配当漢字は、2010年の常用漢字表改定で加わった196字から、2020年度に7級へ移った11字を除いた185字。","7級へ移った11字：茨・媛・岡・熊・埼・鹿・栃・奈・梨・阪・阜（いずれも都道府県名に使う字）。","挨拶・曖昧・語彙のように、日常でよく使うのに以前は常用漢字表に入っていなかった字が多い。","𠮟・塡・剝・頰は常用漢字表で許容字体（叱・填・剥・頬）が併記されている。"],"s":[7,10,13]},{"n":"体・医療に関わる2級配当字","p":["訓読みの名詞：顎（あご）、膝（ひざ）、肘（ひじ）、尻（しり）、眉（まゆ）、頰（ほお）、股（また）、脇（わき）、喉（のど）。","爪は「つめ」のほか「つま」とも読む（爪先＝つまさき）。眉は音で眉間（みけん）、眉目（びもく）。","腎臓（じんぞう）、脊椎（せきつい）、咽喉（いんこう）、腫瘍（しゅよう）、潰瘍（かいよう）、脳梗塞（のうこうそく）。","瞳孔（どうこう）、嗅覚（きゅうかく）、臼歯（きゅうし）、唾液（だえき）、捻挫（ねんざ）、哺乳（ほにゅう）。"],"s":[10]},{"n":"心情・態度を表す2級配当字","p":["嫉妬（しっと）、羨望（せんぼう）、怨念（おんねん）、畏敬（いけい）、羞恥（しゅうち）、憂鬱（ゆううつ）。","傲慢（ごうまん）、軽蔑（けいべつ）、嘲笑（ちょうしょう）、罵倒（ばとう）、謙遜（けんそん）、真摯（しんし）。","萎縮（いしゅく）、臆病（おくびょう）、貪欲（どんよく）、恣意的（しいてき）、親睦（しんぼく）、溺愛（できあい）。"],"s":[10]},{"n":"硬い漢語に使う2級配当字","p":["破綻（はたん）、進捗（しんちょく）、払拭（ふっしょく）、隠蔽（いんぺい）、頓挫（とんざ）、毀損（きそん）。","緻密（ちみつ）、明瞭（めいりょう）、汎用（はんよう）、比喩（ひゆ）、所詮（しょせん）、勾配（こうばい）。","刹那（せつな）、沙汰（さた）、三昧（ざんまい）、挫折（ざせつ）、斬新（ざんしん）、彙報（いほう）。","拉致（らち）、賄賂（わいろ）、辛辣（しんらつ）、戦慄（せんりつ）、山麓（さんろく）、籠城（ろうじょう）。"],"s":[10,12]},{"n":"読み方に注意する2級配当字","p":["憧の音はショウのみ。憧憬は本来「しょうけい」だが、常用漢字表の備考に「どうけい」とも示される。訓は憧れる（あこがれる）。","貼の音はチョウ。貼付は本来「ちょうふ」だが、常用漢字表の備考に「てんぷ」とも示される。訓は貼る（はる）。","頃（ころ）、誰（だれ）、虹（にじ）、謎（なぞ）、嵐（あらし）、箸（はし）は訓だけを持つ字。","丼は「どんぶり」「どん」（牛丼＝ぎゅうどん）。弥の表内の読みは訓の「や」だけで、弥生（やよい）は付表の語。"],"s":[10]},{"n":"2級配当字の訓読み（動詞など）","p":["綻びる（ほころびる）、嘲る（あざける）、蔑む（さげすむ）、諦める（あきらめる）、羨む（うらやむ）、妬む（ねたむ）。","萎える（なえる）、拭う（ぬぐう）、拭く（ふく）、乞う（こう）、溺れる（おぼれる）、潰す（つぶす）、遡る（さかのぼる）。","呪う（のろう）、蹴る（ける）、湧く（わく）、賭ける（かける）、塞ぐ（ふさぐ）、狙う（ねらう）、捉える（とらえる）。","貪る（むさぼる）、罵る（ののしる）、詣でる（もうでる）、匂う（におう）、煎る（いる）、剝がす（はがす）。"],"s":[10,12]},{"n":"形・字体に注意する2級配当字","p":["完璧の璧は下が「玉」。壁（かべ）の下は「土」で別字。書き取りで取り違えやすい。","貪（むさぼる）は「今」＋「貝」、貧（まずしい）は「分」＋「貝」で、形が似ている。","塡は装塡（そうてん）・補塡（ほてん）、剝は剝奪（はくだつ）・剝製（はくせい）で使う。いずれも許容字体（填・剥）がある。"],"s":[10]}]},{"u":"準2級：審査基準と試験形式","items":[{"n":"準2級の程度と対象漢字","p":["程度は「常用漢字のうち1951字を理解し、文章の中で適切に使える」。レベルは高校在学程度。","3級までの1623字に準2級配当漢字328字を加えた1951字が対象。","2019年度までは1940字だった。2020年度の配当変更で2級配当の11字が7級へ移り、準2級の対象に含まれるようになった。","同じ改定で潟・佐・崎・滋・縄の5字が準2級配当から7級へ移った。"],"s":[0,7,9]},{"n":"準2級の審査基準（領域・内容）","p":["1951字の読み書きを習得し、音読み・訓読み、送り仮名・仮名遣い、熟語の構成を正しく理解していることを求める。","熟字訓・当て字の例として審査基準に「硫黄（いおう）」「相撲（すもう）」が挙がる。","対義語・類義語・同音同訓異字の理解、典拠のある四字熟語（例：驚天動地、孤立無援）の理解も基準。","部首は、部首を識別して漢字の構成と意味を理解していることが求められる（2級と同じ文言）。"],"s":[0]},{"n":"準2級の大問構成と配点","p":["2級と同じ9分野・200点満点。読み30問×1点、部首10問×1点、熟語の構成10問×2点。","四字熟語は書き取り10問＋意味5問（各2点で30点）、対義語・類義語は各5問（各2点で20点）。","同音・同訓異字10問（20点）、誤字訂正5問（10点）、送りがな5問（10点）、書き取り25問（50点）。"],"s":[14]},{"n":"準2級の合格基準と検定時間","p":["200点満点の70％程度（140点前後）が合格の目安。2級（80％程度）より10ポイント低い。","検定時間は60分。公開会場では2024年度から3限（13:40〜14:40）に実施（2023年度までは2限）。","対象字数は2級より185字少ないが、出題分野・問題数・配点の構成は2級と同じ。"],"s":[0,1,14]},{"n":"2026年度からの出題の変化","p":["高橋書店は、2級・準2級で2026年度第1回検定から出題形式の一部変更が確認されたと報告している（2026年7月時点の情報）。","従来の部首（10問×1点）の大問が出ず、1つの漢字の音読みと訓読みを答える「音訓読み」（10問×1点）が出たとの報告がある。","報告された形式例（非公式）：「畏敬の念をいだく」の畏敬→いけい、「たたりを畏れる」の畏→おそ、のように同じ字の音と訓を別の文で問う。","協会から部首問題廃止の発表はなく、公式サイトの出題内容・審査基準には「部首・部首名」が残る。部首と音訓の両方に備える。"],"s":[0,8]}]},{"u":"準2級：配当漢字の特徴と例","items":[{"n":"準2級配当328字の概要","p":["準2級で新たに学ぶ漢字は328字（1951字−1623字）。中学校までに学ばない、高校段階の字が中心。","制度・法律・歴史の語に使う字（勅・詔・璽・爵・嫡など）や、硬い文章語に使う字が多い。","テイ（偵・貞・艇・逓・呈・廷・亭・邸）やダ（惰・堕・妥・駄）のように、同じ音の字がまとまって配当されている。"],"s":[9]},{"n":"制度・法律・歴史の語に使う字","p":["詔書（しょうしょ）・詔（みことのり）、勅語（ちょくご）、御璽（ぎょじ）、国璽（こくじ）、朕（ちん）。","爵位（しゃくい）、嫡子（ちゃくし）、嗣子（しし）、諸侯（しょこう）、元帥（げんすい）、大尉（たいい）。","弾劾（だんがい）、訴訟（そしょう）、法廷（ほうてい）、謄本（とうほん）、定款（ていかん）、贈賄（ぞうわい）。","罷免（ひめん）、更迭（こうてつ）、管轄（かんかつ）、逓信（ていしん）、俸給（ほうきゅう）、頒布（はんぷ）。"],"s":[9]},{"n":"音読みで出やすい準2級配当字","p":["逐次（ちくじ）、漸次（ぜんじ）、凡庸（ぼんよう）、可塑性（かそせい）、遺憾（いかん）、折衷（せっちゅう）。","威嚇（いかく）、消耗（しょうもう）、殉職（じゅんしょく）、泰斗（たいと：その道の大家）、謹呈（きんてい）、勲功（くんこう）。","酪農（らくのう）、硫酸（りゅうさん）、捕虜（ほりょ）、下痢（げり）、窯業（ようぎょう）、紡績（ぼうせき）。","放逐（ほうちく）、侮辱（ぶじょく）、勧奨（かんしょう）、旋回（せんかい）、傑出（けっしゅつ）、斉唱（せいしょう）。"],"s":[9,11]},{"n":"訓読みで出やすい準2級配当字","p":["1字の名詞：畝（うね）、岬（みさき）、堀（ほり）、坪（つぼ）、塚（つか）、窯（かま）、漆（うるし）、繭（まゆ）。","霜（しも）、藻（も）、襟（えり）、靴（くつ）、蚊（か）、虞（おそれ）。且つ（かつ）、但し（ただし）はつなぎの語。","賄う（まかなう）、唆す（そそのかす）、偽る（いつわる）、懲りる（こりる）、醸す（かもす）、憤る（いきどおる）。","据える（すえる）、挟む（はさむ）、挑む（いどむ）、拒む（こばむ）、砕く（くだく）、渇く（かわく）、癒える（いえる）。"],"s":[9]},{"n":"同じ音の準2級配当字","p":["テイ：偵察（ていさつ）、貞淑（ていしゅく）、艦艇（かんてい）、逓減（ていげん）、贈呈、法廷、料亭、邸宅（ていたく）。","ダ：惰性（だせい）、堕落（だらく）、妥協（だきょう）、駄作（ださく）。カツ：管轄、褐色、一喝（いっかつ）、渇望。","ショウ：吉祥（きっしょう）、訴訟、硝煙（しょうえん）、表彰、岩礁、化粧、奨励、賠償など、ショウの字が多い。","モウ：盲点（もうてん）、消耗（しょうもう）。カク：核心、威嚇（いかく）。同音・同訓異字の問題で組にされやすい。"],"s":[9,11]},{"n":"形の似た準2級配当字","p":["徹（てつ：徹底・貫徹）と撤（てつ：撤回・撤去）。徹は「貫き通す」、撤は「取り除く」の意味で区別する。","弊（へい：弊害・疲弊）と幣（へい：貨幣・紙幣）。下が廾なら弊、巾なら幣。2級配当の蔽（隠蔽）も形が近い。","斉（せい：一斉）と斎（さい：書斎）、析（せき：分析）と折（せつ）、侯（こう：諸侯）と候（こう：天候）。","憤（ふん：憤慨）は忄、墳（ふん：古墳）は土、噴（ふん：噴火）は口。部首で意味を区別する。"],"s":[9]}]},{"u":"共通：読み","items":[{"n":"読み問題の形式と出題例","p":["文中の――線部の読みをひらがなで書く。30問×1点で計30点。","音読みの熟語に加え、送り仮名の付いた訓読み（例：生臭い、偽る、病む、辛うじて）も出る。","準2級の例：勲功（くんこう）、旋回（せんかい）、勧奨（かんしょう）、放逐（ほうちく）、殉職（じゅんしょく）。","2級の例：彙報（いほう）、刹那（せつな）、溺愛（できあい）、甚大（じんだい）、尚早（しょうそう）、雪渓（せっけい）。"],"s":[11,12,13]},{"n":"音読みと訓読みの基本","p":["音読みは中国語の発音に由来する読み、訓読みは漢字に同じ意味の日本語を当てた読み。","1字に複数の音がある字が多い（例：行＝コウ・ギョウ・アン、納＝ノウ・ナッ・ナ・ナン・トウ）。","答えは常用漢字表に示された音訓で書く。表にない読みは、一般に通じても正答の根拠にならない。","訓読みは――線の漢字部分だけを読み、送り仮名は答えに含めない（例：偽って→いつわ、畏れる→おそ）。"],"s":[0,8,11]},{"n":"特別な音訓（用法の狭い読み）","p":["常用漢字表には、特定の語や限られた語にだけ使う音訓が示されており、読み誤りやすい。","建立（こんりゅう）、久遠（くおん）、出納（すいとう）、境内（けいだい）、夏至（げし）、仮病（けびょう）。","遊説（ゆうぜい）、相殺（そうさい）、殺生（せっしょう）、献立（こんだて）、格子（こうし）、拍子（ひょうし）。","行脚（あんぎゃ）、由緒（ゆいしょ）、音頭（おんど）、老若（ろうにゃく）、成就（じょうじゅ）、言質（げんち）。"]},{"n":"同じ字の読み分け","p":["納：納得（なっとく）、納屋（なや）、納戸（なんど）、出納（すいとう）、納入（のうにゅう）。","発端（ほったん）、発作（ほっさ）、静脈（じょうみゃく）、愛想（あいそ）、反物（たんもの）、修行（しゅぎょう）。","神：神主（かんぬし）、神々しい（こうごうしい）。施：施策（しさく）、施錠（せじょう）、布施（ふせ）。","懸：懸念（けねん）の「ケ」と懸賞（けんしょう）の「ケン」。同じ字でも熟語によって音が変わる。"]},{"n":"付表の語（熟字訓・当て字）","p":["熟語全体にひとまとまりの読みを当てた語で、1字ずつには分けられない（例：小豆＝あずき、田舎＝いなか）。","審査基準の例は、2級が海女（あま）・玄人（くろうと）、準2級が硫黄（いおう）・相撲（すもう）。","固唾（かたず）、為替（かわせ）、雪崩（なだれ）、名残（なごり）、老舗（しにせ）、師走（しわす）、数珠（じゅず）。","草履（ぞうり）、足袋（たび）、凸凹（でこぼこ）、行方（ゆくえ）、寄席（よせ）、若人（わこうど）、猛者（もさ）、仲人（なこうど）。","祝詞（のりと）、山車（だし）、桟敷（さじき）、時雨（しぐれ）、五月雨（さみだれ）、日和（ひより）、息吹（いぶき）。"],"s":[0]},{"n":"重箱読み・湯桶読み","p":["熟語の読みは「音＋音」「訓＋訓」のほか、「音＋訓」の重箱読みと「訓＋音」の湯桶読みがある。","重箱読みの例：重箱（じゅうばこ）、本棚（ほんだな）、台所（だいどころ）、番組（ばんぐみ）、王様（おうさま）。","湯桶読みの例：湯桶（ゆとう）、手本（てほん）、見本（みほん）、荷物（にもつ）、身分（みぶん）、合図（あいず）。"]},{"n":"音訓読み問題（2026年度〜）","p":["非公式の報告によると、同じ漢字を熟語の中の音読みと文中の訓読みの2通りで読ませ、1問1点で計10点。","報告された例（非公式）：「畏敬の念をいだく」→いけい、「たたりを畏れる」→おそ。訓は送り仮名を除いた部分を答える。","対策は読み問題と同じで、1字ごとに音と訓をセットで覚える（例：憤慨＝ふんがい／憤る＝いきどおる）。","音と訓で印象が離れる字は特に確認する（例：懐古＝かいこ／懐＝ふところ、窯業＝ようぎょう／窯＝かま）。"],"s":[8]},{"n":"読み誤りやすい訓読み","p":["承る（うけたまわる）、賜る（たまわる）、携える（たずさえる）、懇ろ（ねんごろ）、謹んで（つつしんで）。","甚だしい（はなはだしい）、唆す（そそのかす）、辛うじて（かろうじて）、生臭い（なまぐさい）、憤り（いきどおり）。","免れるの常用漢字表の訓は「まぬかれる」で、備考に「まぬがれる」とも、と示されている。"],"s":[11,12]}]},{"u":"共通：部首","items":[{"n":"部首問題の形式と基準","p":["漢字の部首を答える問題で10問×1点。2級では部首を書いて答える。","部首は『漢検要覧 2〜10級対応』の部首一覧による。辞書と部首が異なる字は漢検の基準で覚える。","2026年度第1回以降、この大問の代わりに音訓読みが出たとの報告があるが、協会は部首の廃止を発表していない。"],"s":[0,8]},{"n":"部首の7分類と部首名","p":["位置による7分類：へん（左）、つくり（右）、かんむり（上）、あし（下）、たれ（上から左へ垂れる）、にょう（左から下）、かまえ（囲む）。","たれの例：疒（やまいだれ）、广（まだれ）、尸（しかばね）。にょうの例：辶（しんにょう）、走（そうにょう）、廴（えんにょう）。","かまえの例：門（もんがまえ）、囗（くにがまえ）、冂（けいがまえ）、行（ぎょうがまえ）、凵（うけばこ）。"]},{"n":"部首を間違えやすい字（準2級配当）","p":["泰＝氺（したみず）、臭＝自（みずから）、凹＝凵（うけばこ）、弊＝廾（こまぬき・にじゅうあし）。","寡＝宀（うかんむり）、扉＝戸（とだれ）、奔＝大、妥＝女、衡＝行（ぎょうがまえ）、升＝十。","虞＝虍（とらかんむり）、閥＝門、畝＝田、衷＝衣（ころも）、殻＝殳（るまた・ほこづくり）。","瓶＝瓦（かわら）、摩＝手（て）、呉＝口、栽＝木、駄＝馬（うまへん）、薫＝艹、逸＝辶。"],"s":[11]},{"n":"部首を間違えやすい字（常用漢字全般）","p":["弔＝弓、剛＝刂（りっとう）、碁＝石、囚＝囗（くにがまえ）、愁＝心、献＝犬、累＝糸、窮＝穴（あなかんむり）。","甚＝甘（あまい）、翻＝羽（はね）、憾＝忄（りっしんべん）。翻を「番」、憾を「心」と答えるのは誤り。","再＝冂（けいがまえ・まきがまえ・どうがまえ）。夢＝夕、問＝口、売＝士、黙＝黒のように見た目と違う部首もある。"],"s":[12]},{"n":"字そのものが部首になる字","p":["斉（せい）・面（めん）のように、字全体が部首になる字がある。","麻・竜・革・鬼・香も字全体が部首。2級配当の亀も字全体が部首になる。","斎（書斎）の部首は斉で、示ではない。"],"s":[11]},{"n":"形の似た部首の区別","p":["肖・肢・胴など体に関わる字の月は⺼（にくづき）。望・朝の月（つき）とは由来が違うが、どちらも「月」と書く。","栽＝木、裁＝衣、載＝車で、共通する部分は部首ではない。","衣と衤（ころもへん）、示と礻（しめすへん）、心と忄・⺗（したごころ）は同じ部首の形の変化（例：慕＝⺗）。","戈（ほこづくり：戦・我）と殳（るまた：殻・殴）は別の部首。"],"s":[11]}]},{"u":"共通：熟語の構成","items":[{"n":"出題形式と5つの型","p":["2字熟語の組み立てをア〜オの5つから選ぶ。10問×2点で計20点。","ア：同じような意味の字を重ねたもの（例：身体）。イ：反対または対応の意味の字を重ねたもの（例：開閉）。","ウ：上の字が下の字を修飾しているもの（例：和食）。","エ：下の字が上の字の目的語・補語になっているもの（例：耐熱）。オ：上の字が下の字の意味を打ち消しているもの（例：不明）。"],"s":[11]},{"n":"ア：同じような意味の組み合わせ","p":["2字が似た意味を持つ：疾患（しっかん）、擬似（ぎじ）、把握（はあく）、繁茂（はんも）、隠蔽（いんぺい）。","各字の意味に置き換えて比べる。疾も患も「病気」、把も握も「つかむ」の意味なのでア。","岩石、選択、尊敬のように、2字の意味がほぼ重なるものが典型。"],"s":[11,12]},{"n":"イ：反対・対応の組み合わせ","p":["意味が反対の字を重ねる：繁閑（はんかん：忙しい・暇）、粗密（そみつ：粗い・細かい）、功罪（こうざい）。","緩急（かんきゅう）、哀歓（あいかん）、贈答（ぞうとう）、需給（じゅきゅう）、硬軟、禍福（かふく）も同じ型。","「師弟」「主従」のように、反対ではなく対になる関係もイに含む。"],"s":[11,12]},{"n":"ウ：修飾・被修飾の関係","p":["上の字が下の字を説明する：墨汁（墨の汁）、岐路（分かれ道）、和食（日本の料理）。","「上の字の＋下の字」「上の字に（く）＋下の字」と読めればウ（例：急増＝急に増える、激突＝激しく突き当たる）。","名詞を修飾する型と、動詞を修飾する型の両方がある。上の字が副詞のように働くものもウ。"],"s":[11,12]},{"n":"エ：目的語・補語の関係","p":["上が動作、下がその対象：迎賓（賓客を迎える）、殉教（教えに殉じる）、懐郷（故郷を懐かしむ）、赴任（任地に赴く）。","造幣（貨幣を造る）、耐熱（熱に耐える）、登山（山に登る）、就職（職に就く）も同じ型。","上の字を動詞として読み、下の字に「を」「に」を付けて返って読めればエ。"],"s":[11,12]},{"n":"オ：打ち消しの関係","p":["上に打ち消しの字（不・未・非・無）が付く：不明、未納（みのう）、未踏（みとう）、非常、無謀（むぼう）。","未は「まだ〜していない」、非は「〜ではない」、無は「〜がない」、不は「〜しない・〜でない」の意味を加える。","判定の最初に上の字が不・未・非・無かどうかを確かめると、オを素早く見分けられる。"],"s":[11,12]},{"n":"型を見分ける手順","p":["①上が打ち消しの字ならオ。②上が動作で、下が「を・に」で受ける対象ならエ。","③2字の意味が反対・対ならイ、似ていればア。④上が下を説明していればウ。","迷ったら1字ずつ訓読みや意味に置き換えて文にする（例：赴任＝任に赴く→エ）。","アとウの区別：繁茂（繁る・茂る）は2字が対等に並ぶのでア、墨汁（墨の汁）は上が下を限定するのでウ。"],"s":[11]}]},{"u":"共通：四字熟語","items":[{"n":"四字熟語の出題形式","p":["問1は語群のひらがなを漢字に直して四字熟語の空欄を補う（10問×2点）。語群の語は一度ずつ使う。","問2は示された意味に合う四字熟語を問1の中から選ぶ（5問×2点）。四字熟語全体で30点。","2級では「紳士（しゅくじょ）」→淑女のように、四字のうち2字分を漢字で書く形が出る。"],"s":[12,13,14]},{"n":"典拠のある四字熟語（審査基準の例）","p":["審査基準は典拠のある四字熟語の理解を求め、例に2級は鶏口牛後・呉越同舟、準2級は驚天動地・孤立無援を挙げる。","鶏口牛後（けいこうぎゅうご）：大きな集団の末端にいるより、小さな集団の長になるほうがよいということ。","呉越同舟（ごえつどうしゅう）：仲の悪い者同士が同じ場に居合わせること。共通の困難に協力する意にも使う。","驚天動地（きょうてんどうち）：世間を大いに驚かせること。孤立無援（こりつむえん）：仲間がなく助けもないこと。"],"s":[0]},{"n":"2級で出る四字熟語の例","p":["旧態依然（きゅうたいいぜん）：昔のままで進歩がない。二者択一（にしゃたくいつ）：二つのうち一つを選ぶ。","明哲保身（めいてつほしん）：賢く道理に従い身を安全に保つ。克己復礼（こっきふくれい）：私欲に勝ち礼に従う。","甘言蜜語（かんげんみつご）：人に取り入るための甘い言葉。賢良方正（けんりょうほうせい）：賢く善良で行いが正しい。","紳士淑女（しんししゅくじょ）、汚名返上（おめいへんじょう）、冷酷無情（れいこくむじょう）、奇奇怪怪（ききかいかい）。"],"s":[12]},{"n":"準2級で出る四字熟語の例","p":["面目躍如（めんもくやくじょ）：その人らしさが生き生きと表れる。馬耳東風（ばじとうふう）：意見を聞き流す。","率先垂範（そっせんすいはん）：先頭に立って手本を示す。比翼連理（ひよくれんり）：男女の情愛が深い。","少壮気鋭（しょうそうきえい）：若く意気盛ん。機略縦横（きりゃくじゅうおう）：状況に応じ策略を自在に使う。","徹頭徹尾（てっとうてつび）：最初から最後まで。空理空論（くうりくうろん）：現実離れして役に立たない理論。"],"s":[11]},{"n":"意味を押さえたい四字熟語","p":["隠忍自重（いんにんじちょう）：苦しさをこらえ軽はずみな行動をしない。反対の意味の語に軽挙妄動（けいきょもうどう）。","泰然自若（たいぜんじじゃく）：落ち着いて動じない。付和雷同（ふわらいどう）：自分の考えなく他人に同調する。","換骨奪胎（かんこつだったい）：先人の作品を土台に独自のものを作る。千載一遇（せんざいいちぐう）：またとない好機。","外柔内剛（がいじゅうないごう）：外見は穏やかだが芯は強い。内憂外患（ないゆうがいかん）：内にも外にも心配事がある。"]},{"n":"書き誤りやすい四字熟語","p":["異口同音（×異句）、五里霧中（×夢中）、危機一髪（×一発）、単刀直入（×短刀）、絶体絶命（×絶対）。","自画自賛（×自我）、言語道断（×同断）、厚顔無恥（×無知）、心機一転（×心気）、意味深長（×慎重）。","付和雷同（×不和）、首尾一貫（×一環）、暗中模索（×模策）、二束三文（×二足）、前代未聞（×未問）。","縦横無尽（×無人）、臨機応変（×応辺）、傍若無人（×房若）、温故知新（×温古）、無我夢中（×霧中）。"]},{"n":"構造で覚える四字熟語","p":["同じ字をくり返す型：徹頭徹尾、空理空論、奇奇怪怪。前後の2字が対になる型：栄枯盛衰、針小棒大。","似た意味の2字熟語を重ねる型：冷酷無情（冷酷≒無情）、勇猛果敢、公明正大。","数字を含む型：一騎当千、千載一遇、二束三文、七転八倒（しちてんばっとう）。数字の書き誤りに注意する。","主語と述語の型：意気消沈（意気が消沈する）、大器晩成（大器は晩成する）。"]}]},{"u":"共通：対義語・類義語","items":[{"n":"対義語・類義語の出題形式","p":["語群のひらがなを一度ずつ使って漢字に直し、対義語5問・類義語5問を完成させる。各2点で計20点。","答えは2字熟語の全体を書く。字形の誤りも失点になるため書き取りの力も必要。","語群の語は一度しか使えないので、確実な組から埋めると残りが絞れる。"],"s":[11,13,14]},{"n":"準2級の対義語の例","p":["疎遠（そえん）⇔親密、受諾（じゅだく）⇔拒否、総合⇔分析、理論⇔実践、醜悪（しゅうあく）⇔美麗。","勤勉⇔怠惰（たいだ）、隆起⇔陥没（かんぼつ）、慶事⇔弔事（ちょうじ）、繁栄⇔衰退、模倣⇔創造。","1字ずつ反対になる組（受諾⇔拒否は受⇔拒・諾⇔否）と、語全体の意味で対になる組（総合⇔分析）がある。"],"s":[11]},{"n":"2級の対義語の例","p":["絶賛⇔酷評（こくひょう）、尊敬⇔侮辱（ぶじょく）、記名⇔匿名（とくめい）、貧乏⇔裕福、進出⇔撤退。","謙虚⇔傲慢（ごうまん）、曖昧⇔明瞭（めいりょう）、凡庸（ぼんよう）⇔非凡、緩慢⇔敏速。","記名⇔匿名のように1字（名）を共有し、残りの字（記⇔匿）が対立する組もある。"],"s":[12]},{"n":"類義語の例","p":["準2級：策謀≒計略、強情≒頑固（がんこ）、根底≒基盤、難点≒欠陥（けっかん）、倫理≒道徳。","2級：飢餓≒飢渇（きかつ）、辛抱≒忍耐、検討≒吟味（ぎんみ）、積載≒搭載（とうさい）、背徳≒堕落（だらく）。","定番の組：永遠≒恒久、互角≒伯仲（はくちゅう）、架空≒虚構、手柄≒功績、熟知≒精通、傍観≒座視。"],"s":[11,12]},{"n":"解き方の手順","p":["類義語は語の中心の意味を言い換える（例：根底＝物事の土台→基盤）。","対義語は、語群の読みから候補の熟語を作り、問題の語と字ごと・意味ごとに対応するか確かめる。","問題の語と同じ字を含む答えもある（例：飢餓≒飢渇）。同じ字があっても候補から外さない。"],"s":[11,12]}]},{"u":"共通：同音・同訓異字と誤字訂正","items":[{"n":"同音・同訓異字の形式","p":["2つの文の同じ読みのカタカナを、それぞれ漢字に直す。10問×2点で計20点。","音が同じ字（同音異字）と、訓が同じ字（同訓異字）の両方が出る。文の意味から熟語を確定させて書く。","準2級の例：カク心（核心）／威カク（威嚇）、円カツ（円滑）／管カツ（管轄）、ムネ（棟）／ムネ（胸）。"],"s":[11]},{"n":"同音異字の例","p":["モウ：網羅（もうら）、盲点（もうてん）、本望（ほんもう）、消耗（しょうもう）。","キョウ：恭順（きょうじゅん）、矯正（きょうせい）、享受（きょうじゅ）、挟撃（きょうげき）。","ケン：謙虚（けんきょ）、顕著（けんちょ）、懸賞（けんしょう）、献身（けんしん）。","ソウ：喪失（そうしつ）、捜索（そうさく）、挿入（そうにゅう）、浴槽（よくそう）、海藻（かいそう）。"],"s":[9,11]},{"n":"同訓異字の例","p":["おかす：犯す（法や罪）、侵す（権利や領土）、冒す（危険や病）。","はかる：図る（計画）、計る（時間）、測る（長さ）、量る（重さ）、謀る（悪事）、諮る（会議に問う）。","おさめる：収める（成果）、納める（税）、治める（国）、修める（学問）。つとめる：努める・勤める・務める。","すすめる：勧める（勧誘）、薦める（推薦）、進める（前進）。かえりみる：顧みる（過去）、省みる（反省）。"]},{"n":"誤字訂正の形式","p":["文中に、同じ読みの誤った漢字が1字含まれる。その誤字と正しい漢字を記す。5問×2点で計10点。","誤字は正しい字と同じ音で、形も似ていることが多い（例：撤廃を「徹廃」とする）。","誤字のままでも実在する語になる場合がある（例：黒煙→黒鉛、軌道→気道）。文脈で判断する。"],"s":[11,12]},{"n":"誤字訂正の例（準2級）","p":["一斉の訓練を「一勢」、卓越した表現を「卓悦」、措置を「措致」とする誤り。","探査を「担査」、駆除を「苦除」とする誤り。熟語の意味から正しい字を確定させる。","文中の熟語を1語ずつ音読みし、同音の別字に置き換わった形になっていないか確かめる。"],"s":[11]},{"n":"誤字訂正の例（2級）","p":["撤廃を「徹廃」、駐在所を「抽在所」、妨害を「坊害」とする誤り。","黒煙を「黒鉛」、軌道を「気道」とする誤り。誤った形も実在語なので見落としやすい。","取り違えやすい組：徹（貫く）と撤（取り去る）、璧（完璧）と壁、講（講義）と構、専門の門と問。"],"s":[12]}]},{"u":"共通：漢字と送りがな","items":[{"n":"出題形式と例","p":["――線のカタカナを漢字1字と送りがな（ひらがな）に直す。5問×2点で計10点。","準2級の例：オシイ→惜しい、ムクイル→報いる、タズサワッテ→携わって、ホコラシイ→誇らしい、マドワセ→惑わせ。","2級の例：オビヤカサレル→脅かされる、ホコロビル→綻びる、アザケル→嘲る、ツチカウ→培う、ナガメル→眺める。","基準は内閣告示「送り仮名の付け方」。活用語尾を送る原則と、個別の例外の語をあわせて覚える。"],"s":[0,11,12]},{"n":"通則1：活用語尾を送る","p":["動詞・形容詞・形容動詞は活用語尾を送る（例：書く、生きる、考える、荒い、潔い、賢い）。","語幹が「し」で終わる形容詞は「し」から送る（例：著しい、惜しい、悔しい、恋しい、珍しい）。","「か」「やか」「らか」を含む形容動詞はそこから送る（例：暖かだ、静かだ、穏やかだ、健やかだ、明らかだ、滑らかだ）。","例外の動詞：明らむ、味わう、哀れむ、慈しむ、教わる、脅かす、関わる、食らう、異なる、逆らう、捕まる、群がる、和らぐ、揺する。","例外の形容詞など：明るい、危ない、危うい、大きい、少ない、小さい、冷たい、平たい、新ただ、同じだ、盛んだ、惨めだ。"]},{"n":"通則2：含まれる語に合わせる","p":["活用語尾以外の部分に他の語を含む語は、含まれる語の送り方に合わせる（例：動かす〔動く〕、照らす〔照る〕）。","浮かぶ〔浮く〕、生まれる〔生む〕、押さえる〔押す〕、捕らえる〔捕る〕、勇ましい〔勇む〕、輝かしい〔輝く〕。","喜ばしい〔喜ぶ〕、晴れやかだ〔晴れる〕、重たい〔重い〕、憎らしい〔憎い〕、清らかだ〔清い〕、細かい〔細かだ〕。","試験例の誇らしい〔誇る〕、惑わせる〔惑う〕や、恥ずかしい〔恥じる〕、頼もしい〔頼む〕もこの規則による。","読み誤るおそれがなければ送り仮名を省く許容（例：浮ぶ、生れる、押える）もあるが、通常は本則の形で書く。"],"s":[11]},{"n":"通則3：名詞は送らない","p":["活用のない名詞には送り仮名を付けない（例：月、花、男、彼、何）。","例外として最後の音節を送る語：辺り、哀れ、勢い、幾ら、後ろ、傍ら、幸い、幸せ、互い、便り、半ば、情け、斜め、独り、誉れ、自ら、災い。","数を数える「つ」を含む語は「つ」を送る（例：一つ、二つ、幾つ）。"]},{"n":"通則4：活用語から転じた名詞","p":["動詞・形容詞から転じた名詞はもとの語の送り方による（例：動き、仰せ、恐れ、薫り、曇り、調べ、届け、願い、晴れ）。","「さ」「み」「げ」が付いた名詞も同じ（例：暑さ、大きさ、正しさ、確かさ、明るみ、重み、憎しみ、惜しげ）。","例外で送り仮名を付けない語：謡、虞、趣、氷、印、頂、帯、畳、恋、志、次、隣、富、恥、話、光、舞、折。"]},{"n":"通則5：副詞・連体詞・接続詞","p":["最後の音節を送る（例：必ず、更に、少し、既に、再び、全く、最も、来る〈きたる〉、去る、及び、且つ、但し）。","例外：明くる、大いに、直ちに、並びに、若しくは は別の送り方をし、「又」は送り仮名を付けない。","他の語を含む語はその語の送り方による（例：併せて、至って、恐らく、従って、絶えず、例えば、努めて、辛うじて）。"]},{"n":"送りがなで迷いやすい語","p":["承る（うけたまわる）、志す（こころざす）、潔い（いさぎよい）、快い（こころよい）、試みる（こころみる）。","携わる（たずさわる）と携える（たずさえる）、著す（あらわす）と著しい（いちじるしい）は同じ字で送り方が違う。","催す（もよおす）、賄う（まかなう）、報いる（むくいる）、培う（つちかう）、眺める（ながめる）、綻びる（ほころびる）。","疑わしい〔疑う〕、恥ずかしい〔恥じる〕のように、もとの動詞の部分を残して送る語は通則2で判断する。"],"s":[11,12]}]},{"u":"共通：書き取り","items":[{"n":"書き取りの形式と配点","p":["文中のカタカナを漢字に直す。25問×2点の50点で、全分野で最も配点が大きい。","音読みの熟語と訓読みの語の両方が出る。読みの知識がそのまま書き取りの得点にもつながる。","筆画を正しく明確に書いた字だけが採点対象。くずした字や旧字体は正答にならない。"],"s":[0,13,14]},{"n":"準2級配当字の書き取り例","p":["寛容（かんよう）、頑固（がんこ）、遮断（しゃだん）、漆黒（しっこく）、繊維（せんい）、懸念（けねん）、醸造（じょうぞう）。","顕著（けんちょ）、謙虚（けんきょ）、矯正（きょうせい）、懇談（こんだん）、購入（こうにゅう）、償う（つぐなう）。","懸念（けねん）の懸は「ケ」、懸賞（けんしょう）では「ケン」と読む同じ字。読み方が違っても字は変わらない。"],"s":[9]},{"n":"2級配当字の書き取り例","p":["挨拶（あいさつ）、曖昧（あいまい）、語彙（ごい）、憂鬱（ゆううつ）、破綻（はたん）、進捗（しんちょく）。","完璧（かんぺき）、謙遜（けんそん）、緻密（ちみつ）、比喩（ひゆ）、親戚（しんせき）、元旦（がんたん）。","1字の訓：嵐（あらし）、鍋（なべ）、箸（はし）、枕（まくら）、膝（ひざ）、袖（そで）、裾（すそ）、崖（がけ）、柿（かき）、鍵（かぎ）。"],"s":[10]},{"n":"形の似た字の書き分け","p":["微（び：微妙）と徴（ちょう：徴収）、綱（つな）と網（あみ）、遣（けん：派遣）と遺（い：遺産）。","侯（こう：諸侯）と候（こう：天候）、析（せき：分析）と折（せつ：骨折）、斉（せい：一斉）と斎（さい：書斎）。","璧（完璧）は下が玉、壁は下が土。貪（貪欲）は今＋貝、貧（貧困）は分＋貝。","崇（すう：崇拝）は山の下に宗。形の似た祟（たたる）は常用漢字ではない別字。"]},{"n":"同音の熟語の書き分け","p":["保障（地位や権利を守る）・保証（確かだと請け合う）・補償（損害を償う）は意味で書き分ける。","追求（利益を追い求める）・追究（真理を明らかにする）・追及（責任を問いただす）。","対象（目標とするもの）・対照（比べ合わせる）・対称（つり合っている）。異議（反対意見）と意義（価値）も区別する。"]}]}]},{"id":"psy","name":"心理学","full":"心理学（概論〜公認心理師試験基礎）","group":"教養・専門","desc":"心の働きと行動を科学的に探る学問の基礎を、歴史から臨床まで一望する","asOf":"公認心理師試験出題基準 令和9年版・DSM-5-TRに基づく（2026年11月時点）","aliases":["心理学概論","公認心理師試験","基礎心理学","心理学入門","Psychology"],"sources":[{"t":"公認心理師試験出題基準・ブループリント 令和9年版（日本心理研修センター）","u":"https://www.jccpp.or.jp/files/items/104/File/blue_print_2027.pdf"},{"t":"OpenStax Psychology 2e: 1.2 History of Psychology","u":"https://openstax.org/books/psychology-2e/pages/1-2-history-of-psychology"},{"t":"Introductory Psychology 2e (OpenStax, LibreTexts版)","u":"https://socialsci.libretexts.org/Bookshelves/Psychology/Introductory_Psychology/Introductory_Psychology_2e_(OpenStax)"},{"t":"Psychology (Noba Project, LibreTexts版)","u":"https://socialsci.libretexts.org/Bookshelves/Psychology/Introductory_Psychology/Psychology_(Noba)"},{"t":"Noba: The Replication Crisis in Psychology","u":"https://socialsci.libretexts.org/Bookshelves/Psychology/Introductory_Psychology/Psychology_(Noba)/Chapter_2%3A_Psychology_as_Science/2.8%3A_The_Replication_Crisis_in_Psychology"},{"t":"Noba: Attention","u":"https://socialsci.libretexts.org/Bookshelves/Psychology/Introductory_Psychology/Psychology_(Noba)/Chapter_7%3A_Cognition_and_Language/7.9%3A_Attention"},{"t":"Noba: Judgment and Decision Making","u":"https://socialsci.libretexts.org/Bookshelves/Psychology/Introductory_Psychology/Psychology_(Noba)/Chapter_7%3A_Cognition_and_Language/7.7%3A_Judgement_and_Decision_Making"},{"t":"Noba: Conformity and Obedience","u":"https://socialsci.libretexts.org/Bookshelves/Psychology/Introductory_Psychology/Psychology_(Noba)/Chapter_12%3A_Social_Part_II/12.3%3A_Conformity_and_Obedience"},{"t":"Noba: Attachment Through the Life Course","u":"https://socialsci.libretexts.org/Bookshelves/Psychology/Introductory_Psychology/Psychology_(Noba)/Chapter_6%3A_Development/6.8%3A_Attachment_Through_the_Life_Course"},{"t":"Noba: Therapeutic Orientations","u":"https://socialsci.libretexts.org/Bookshelves/Psychology/Introductory_Psychology/Psychology_(Noba)/Chapter_9%3A_Psychological_Disorders_and_Treatments/9.02%3A_Therapeutic_Orientations"},{"t":"OpenStax Psychology 2e: Measures of Intelligence","u":"https://socialsci.libretexts.org/Bookshelves/Psychology/Introductory_Psychology/Introductory_Psychology_2e_(OpenStax)/07%3A_Thinking_and_Intelligence/7.06%3A_Measures_of_Intelligence"},{"t":"OpenStax Psychology 2e: Personality Assessment","u":"https://socialsci.libretexts.org/Bookshelves/Psychology/Introductory_Psychology/Introductory_Psychology_2e_(OpenStax)/11%3A_Personality/11.9%3A_Personality_Assessment"},{"t":"子安増生・丹野義彦編『公認心理師エッセンシャルズ 第2版』見本（有斐閣）","u":"https://www.yuhikaku.co.jp/static_files/T17445.pdf"},{"t":"河合塾KALS 第6回公認心理師試験ブループリント新規追加キーワード解説","u":"https://www.kspub.co.jp/download/a153241f57067faadfc78319de27d44ba9b1c7ec.pdf"},{"t":"河合塾KALS 第4回公認心理師試験ブループリント新規追加キーワード解説","u":"https://www.kspub.co.jp/download/76b59790d11c15f78aa9cad35146ce660b931f51.pdf"}],"units":[{"u":"心理学の成り立ちと学派","items":[{"n":"ヴントと構成主義","p":["1879年、ヴントがライプツィヒ大学に心理学実験室を開設し、これが科学としての心理学の出発点とされる。","訓練された観察者による内観（内的知覚）と、千分の1秒単位の反応時間測定を主な方法とした。","意識を感覚などの要素に分け結合の法則を探る要素主義をとった。主著『生理学的心理学綱要』（1873–74年）。","晩年の『民族心理学』では、言語・神話・慣習など実験では扱えない高次の精神を文化から研究した。","弟子ティチェナーが米国で構成主義を広めたが、内観の主観性と検証の難しさから後に衰退した。"],"s":[1,3,12]},{"n":"機能主義と米国の心理学","p":["W.ジェームズは『心理学原理』（1890年）で意識を絶えず流れる連続体（意識の流れ）とし、要素への還元を退けた。","機能主義は意識の内容ではなく、心が環境への適応にどう役立つかを問い、ダーウィンの進化論の影響を受けた。","デューイやエンジェルらシカゴ学派が発展させ、教育などの応用分野や後の行動主義に道を開いた。","ホールは1883年に米国初の心理学実験室を開き、1892年にアメリカ心理学会（APA）を創設した。","ウォッシュバーンは1894年に米国の女性で初めて心理学博士号を得た。カルキンスはハーバードに学位授与を拒まれた。"],"s":[1,3]},{"n":"行動主義と新行動主義","p":["ワトソンは1913年の論文で、意識ではなく観察可能な行動を対象とする客観的科学としての行動主義を宣言した。","刺激と反応（S-R）の結びつきで行動を説明し、パヴロフの条件反射研究を理論の土台とした。","新行動主義のトールマンは認知地図や目的的行動を、ハルは動因や習慣強度を媒介変数（S-O-R）として導入した。","スキナーはオペラント条件づけを体系化し、行動の原因を環境の随伴性に求める徹底的行動主義を唱えた。"],"s":[1,3]},{"n":"ゲシュタルト心理学","p":["ヴェルトハイマーが1912年に仮現運動（ファイ現象）の研究を発表し、ケーラー、コフカとともに創始した。","「全体は部分の総和とは異なる」とし、意識を要素の寄せ集めとみる要素主義（構成主義）を批判した。","知覚の体制化（群化の要因、図と地）や、ケーラーによるチンパンジーの洞察学習などを研究した。","主要メンバーは1920〜30年代に米国へ渡り（ナチス政権からの亡命を含む）、レヴィンの場の理論などに影響を与えた。"],"s":[1,2]},{"n":"精神分析と新フロイト派","p":["フロイト（1856–1939）はブロイアーと『ヒステリー研究』（1895年）を著し、『夢解釈』（1900年）で無意識論を展開した。","心をイド（快楽原則）・自我（現実原則）・超自我（良心）で捉え、自我は不安を防衛機制で処理するとした。","口唇期・肛門期・男根期・潜伏期・性器期の心理性的発達を想定し、男根期のエディプス・コンプレックスを重視した。","ユングは分析心理学で集合的無意識と元型を、アドラーは個人心理学で劣等感の補償と共同体感覚を説いた。","フロイト理論の多くは現代の実証研究で支持されておらず、反証が難しい点も批判される。"],"s":[2,3]},{"n":"人間性心理学","p":["精神分析の決定論と行動主義の還元主義に反対する「第三勢力」として、1950〜60年代に台頭した。","人間の主体性、成長への潜在力、主観的経験を重視し、自己実現を中心概念とする。","マズローは欲求階層説（1943年）を唱え、最上位に自己実現の欲求を置いた。","ロジャーズは来談者中心療法を創始し、無条件の肯定的配慮・共感的理解・純粋性（自己一致）を重視した。"],"s":[1,2]},{"n":"認知革命と現代の潮流","p":["1950年代、言語学・神経科学・計算機科学の発展を背景に、行動主義が避けた心的過程の研究が復活した。","ミラーの論文「マジカルナンバー7±2」（1956年）は認知心理学の古典で、最も多く引用される論文の一つ。","チョムスキーは1959年にスキナーの『言語行動』を書評で批判し、言語の生得的基盤を主張した。","ナイサーの『認知心理学』（1967年）は、この分野で最初の体系的な教科書とされる。","現在は認知神経科学への展開に加え、生物・心理・社会の要因を統合する生物心理社会モデルが重視される。"],"s":[1,3,0]}]},{"u":"研究法と研究倫理","items":[{"n":"心理学の主な研究法","p":["基本的な研究法に観察法・実験法・質問紙法（調査法）・検査法・面接法・事例研究法がある。","因果関係を確かめられるのは実験法で、相関研究は変数間の関連を示すにとどまる。","事例研究は少数の稀な事例から豊かな情報を得られるが、結果の一般化には限界がある。","アーカイブ研究は既存の記録を分析するため安価だが、何が記録されたかを研究者は統制できない。","数量化して分析する量的研究に対し、質的研究は語りの分析や参与観察などから意味や過程を探る。"],"s":[12,2,3]},{"n":"実験法と変数","p":["独立変数は研究者が操作する変数、従属変数はその影響を見るために測定する変数である。","実験群と統制群を設け、無作為割り当てで群を等質にすると、群間差を独立変数の効果と推論できる。","無作為抽出は母集団から標本を選ぶ手続き、無作為割り当ては標本を条件へ振り分ける手続きで、別の概念。","操作的定義とは、概念をどのような手続きで操作・測定するかを具体的に定めたものである。","独立変数と連動して従属変数に影響する剰余変数（交絡変数）があると、原因を特定できなくなる。"],"s":[2,3]},{"n":"実験計画とバイアスの統制","p":["被験者間計画は条件ごとに別の参加者を、被験者内計画は同じ参加者に全条件を割り当てる。","被験者内計画では、練習や疲労による順序効果を相殺するため条件の順序をカウンターバランスする。","参加者が期待に沿おうとする要求特性や、実験者の期待による偏りを防ぐため二重盲検法を用いる。","プラセボ効果は処置への期待だけで生じる変化で、統制群に偽薬などを与えて効果を切り分ける。","準実験は既存の群（例：既婚と未婚）を比べるため無作為割り当てがなく、群の事前差が因果推論を弱める。"],"s":[2,3]},{"n":"観察法と面接法","p":["自然観察法は生態学的妥当性が高い一方、状況を統制できず、多くの時間と費用がかかる。","観察者が対象集団の一員として加わる参加観察と、加わらずに観察する非参加観察がある。","観察者バイアスを抑えるため、複数の観察者の評定の一致度（評定者間信頼性）を確認する。","面接法は質問の自由度により、構造化面接・半構造化面接・非構造化面接に分けられる。","臨床にはインテーク面接や査定面接があり、子どもの被害聴取には誘導を避ける司法面接が用いられる。"],"s":[2,12,0]},{"n":"調査法と発達研究デザイン","p":["質問紙調査は多数のデータを低コストで集められるが、虚偽や記憶違いなど自己報告の歪みを受ける。","結果を一般化するには、無作為抽出による十分な大きさの代表的な標本が必要である。","評定尺度には、同意の程度を段階で答えるリッカート法や、対になる形容詞の間で評定するSD法がある。","横断研究は異なる年齢群を一度に比べられ効率的だが、世代の違い（コホート効果）が混入する。","縦断研究は同一個人を追跡して変化を捉えるが、費用がかかり、時間とともに参加者の脱落が増える。"],"s":[2,14]},{"n":"研究倫理","p":["インフォームド・コンセントでは目的・手続・危険を説明し、参加は任意で、いつでも不利益なく撤回できる。","欺瞞（ディセプション）を用いた研究では、終了後のデブリーフィングで真の目的と欺瞞の理由を説明する。","タスキーギ梅毒研究（1932–72年）は治療法確立後も黒人男性に治療を行わず、1974年の国家研究法の契機となった。","研究不正の典型は捏造・改ざん・盗用で、貢献のない者を著者にするギフト・オーサーシップも不適切とされる。","人を対象とする研究は倫理審査委員会（IRB）、動物実験は動物実験委員会の承認を得て実施する。"],"s":[2,12]},{"n":"再現性問題とオープンサイエンス","p":["2015年、オープン・サイエンス・コラボレーションは主要3誌の100研究を追試し、有意な結果の再現は約36%だった。","再現率は分野で異なり、JPSP掲載の社会心理学研究は23%、JEP:LMC掲載の認知心理学研究は48%だった。","背景に小標本による検定力不足、出版バイアス、p値の操作（p-hacking）、結果を見てからの仮説設定がある。","対策として事前登録、登録報告（レジスタード・レポート）、データ・材料の公開、多施設共同追試が広まった。","ベムの予知研究（2011年）の追試失敗や、シュターペルによるデータ捏造の発覚も危機意識を強めた。"],"s":[4]},{"n":"再現されなかった有名な知見","p":["高齢者を連想させる語のプライミングで歩行が遅くなるとした研究（1996年）は、2012年の追試で再現されなかった。","「教授」を思い浮かべると知識問題の成績が上がるとした研究（1998年）も、複数の追試で再現されなかった。","パワーポーズ（2010年）のホルモン変化は約200人の追試で再現されず、第一著者も2016年に効果を否定した。","ペンを歯でくわえて笑顔を作る顔面フィードバック研究（1988年）は、2016年の17研究室の追試で再現されなかった。","カーネマンは2012年、行動プライミング研究の再現性について研究者に公開書簡で警鐘を鳴らした。"],"s":[4]}]},{"u":"心理統計と測定","items":[{"n":"尺度水準と記述統計","p":["スティーブンスの尺度水準は名義・順序・間隔・比率の4つで、水準により使える統計量が異なる。","間隔尺度は目盛りの差が等しいが原点は任意（例：摂氏温度）、比率尺度は絶対的な原点をもつ（例：長さ）。","代表値は平均値・中央値・最頻値。平均値は外れ値に影響されやすく、歪んだ分布では中央値が適する。","散布度には範囲・分散・標準偏差などがあり、正規分布では平均±1SDに約68%、±2SDに約95%が入る。","標準得点z＝（得点−平均）÷標準偏差。偏差値は50＋10zで、平均50・標準偏差10に換算したもの。"],"s":[0,3,10,12]},{"n":"相関と回帰","p":["ピアソンの相関係数rは−1〜+1の値をとり、直線的な関係の方向と強さを示す。0付近は直線的関係がない。","相関は因果を意味しない。第三の変数（交絡）や逆方向の因果の可能性を排除できないためである。","錯誤相関は、実際には関連がないのに関連があると思い込むことで、確証バイアスがそれを強める。","回帰分析は予測変数から基準変数を予測し、重回帰分析では複数の予測変数の影響を同時に推定する。","曲線的な関係、外れ値、選抜による範囲の制限があると、相関係数は関係の強さを正しく表さない。"],"s":[2,3]},{"n":"仮説検定の考え方","p":["帰無仮説（差や関連がない）が正しいと仮定して、観測値以上に極端な結果が得られる確率がp値である。","p値が有意水準（通常.05）を下回れば帰無仮説を棄却する。p値は帰無仮説が正しい確率ではない。","第1種の誤りは正しい帰無仮説を棄却すること（確率α）、第2種の誤りは誤った帰無仮説を棄却し損ねること（β）。","検定力（1−β）は実在する効果を検出できる確率で、標本サイズ・効果量・有意水準で決まる。","大標本では些細な差も有意になるため、効果量（コーエンのdなど）と信頼区間の報告が推奨される。"],"s":[3,4]},{"n":"主な検定と推定","p":["t検定は2群の平均値差を、分散分析（ANOVA）は3群以上や複数要因の平均値差を検定する。","分散分析で有意なら多重比較で差のある群を特定する。交互作用とは、ある要因の効果が他の要因の水準で異なること。","χ²検定は度数データの独立性や適合度を、ノンパラメトリック検定は正規分布を仮定できないデータを扱う。","点推定は母数を1つの値で、区間推定は信頼区間で示す。誤差の幅は標本サイズの平方根に反比例する。","メタ分析は複数研究の効果量を統合して全体の効果を推定するが、出版バイアスの影響に注意が要る。"],"s":[0,3]},{"n":"多変量解析","p":["因子分析は多数の観測変数間の相関を少数の潜在因子で説明する手法で、探索的と確認的がある。","主成分分析は変数の情報を少数の合成変数に要約する手法で、潜在因子を仮定する因子分析とは目的が異なる。","重回帰の標準偏回帰係数は他の変数の影響を除いた寄与を示すが、予測変数間の多重共線性に注意する。","構造方程式モデリング（SEM）は潜在変数を含む因果モデルを立て、適合度指標でデータとの当てはまりを評価する。","クラスター分析は、似た特徴をもつ対象をまとめて群に分類する手法である。"],"s":[0]},{"n":"信頼性と妥当性","p":["信頼性は測定の一貫性・安定性、妥当性は測りたいものを実際に測れている程度を指す。","妥当であるには信頼性が必要だが、信頼性が高くても妥当とは限らない（狂った秤は一貫して誤る）。","信頼性の推定法には再検査法、平行検査法、折半法、内的一貫性（クロンバックのα係数）がある。","妥当性は内容的妥当性、基準関連妥当性（併存的・予測的）、構成概念妥当性（収束的・弁別的）で検討する。","研究計画では、因果推論の確かさを内的妥当性、結果の一般化可能性を外的妥当性と呼ぶ。"],"s":[2,0]}]},{"u":"脳・神経の働き","items":[{"n":"ニューロンとシナプス","p":["ニューロンは細胞体・樹状突起・軸索からなり、グリア細胞が作る髄鞘（ミエリン）が伝導を速める。","静止膜電位は約−70mVで、閾値（約−55mV）を超えると活動電位が生じ、ピークは約+30mVに達する。","活動電位は全か無かの法則に従い、刺激の強さは発火の頻度で伝えられる。","化学シナプスでは神経伝達物質がシナプス間隙へ放出されて受容体に結合し、余剰分は再取り込みされる。","グリアは支持・絶縁・栄養運搬・免疫を担い、その数はニューロンとほぼ1対1との推定がある。"],"s":[2,0]},{"n":"神経伝達物質","p":["グルタミン酸は主要な興奮性伝達物質で学習・記憶に、GABAは主要な抑制性伝達物質で不安の抑制に関わる。","ドパミンは報酬と運動に関与し、黒質のドパミン神経の変性がパーキンソン病の原因となる。","セロトニンは気分・睡眠・食欲に関わり、SSRIはその再取り込みを阻害して作用を強める。","アセチルコリンは筋収縮と記憶に、ノルアドレナリンは覚醒と注意に関わる（青斑核が主な起始核）。","作動薬（アゴニスト）は受容体で伝達物質と同様に働き、拮抗薬（アンタゴニスト）は受容体を遮断する。"],"s":[2,0]},{"n":"大脳皮質の機能局在と半球","p":["前頭葉は運動野・前頭前野（計画や実行機能）・ブローカ野（発話産出）を含み、頭頂葉には体性感覚野がある。","側頭葉は聴覚野とウェルニッケ野（言語理解）を含み記憶にも関わる。後頭葉には一次視覚野がある。","ゲージ（1848年）は鉄棒が前頭葉を貫いた後の人格変化で知られるが、その程度は誇張された可能性がある。","左右の半球は約2億本の軸索からなる脳梁で結ばれ、各半球は主に反対側の身体の感覚と運動を担う。","脳梁を切断した分離脳患者は、左視野に示した物を言葉で言えないが左手では選べる（スペリー、ガザニガ）。"],"s":[2]},{"n":"皮質下構造と脳幹","p":["視床は嗅覚以外の感覚情報を大脳皮質へ中継し、視床下部は体温・摂食・内分泌などの恒常性を調節する。","海馬は新しい宣言的記憶の形成に、扁桃体は恐怖などの情動処理と情動的な記憶に関わる。","延髄は呼吸・心拍・血圧を、橋は睡眠の調節を担い、小脳は平衡・運動の協調・手続き的記憶に関与する。","脳幹の網様体は覚醒水準を調節し、中脳の黒質と腹側被蓋野はドパミンを産生して運動・報酬・依存に関わる。"],"s":[2]},{"n":"自律神経系と内分泌系","p":["末梢神経系は体性神経系と自律神経系に分かれ、自律神経系は交感神経系と副交感神経系からなる。","交感神経は瞳孔散大・心拍増加・気管支拡張・消化と唾液分泌の抑制を起こし、闘争−逃走反応を担う。","副交感神経は瞳孔縮小・心拍低下・消化促進・膀胱収縮を起こし、休息と回復を担う。","ストレス時には視床下部−下垂体−副腎皮質（HPA）系が働き、副腎皮質からコルチゾールが分泌される。","下垂体は他の内分泌腺を制御し、副腎髄質はアドレナリン、松果体はメラトニンを分泌する。"],"s":[2,3]},{"n":"脳機能と生理指標の計測","p":["脳波（EEG）はミリ秒単位の高い時間分解能をもつが空間分解能は低い。事象関連電位は多数試行の加算平均で得る。","fMRIは血中酸素濃度の変化（BOLD信号）を測る間接指標で、空間分解能は数mmと高いが時間分解能は秒単位。","PETは放射性トレーサーで代謝を画像化する方法で、時間分解能が非常に低く、放射線被曝を伴う。","皮膚電気活動は交感神経支配の汗腺活動を反映し、筋電図は目に見えない表情筋の微細な活動も捉える。","心拍は交感・副交感の両方の支配を受け、瞳孔径は心的努力の指標として用いられる。"],"s":[3,2]},{"n":"睡眠と概日リズム","p":["睡眠はノンレム睡眠（N1〜N3）とレム睡眠からなり、約90分の周期で一晩に4〜5回繰り返す。","N3は脳波に徐波（デルタ波）が多い深い睡眠で夜の前半に多く、レム睡眠は明け方に向けて長くなる。","レム睡眠中は急速眼球運動と骨格筋の弛緩がみられ、起こすと鮮明な夢を報告することが多い。","概日リズムは視床下部の視交叉上核が主時計となって光で同調し、松果体のメラトニン分泌を調節する。"],"s":[0]},{"n":"高次脳機能障害","p":["ブローカ失語は発話が非流暢で理解は比較的保たれ、ウェルニッケ失語は流暢だが理解障害と錯語が目立つ。","失行は麻痺がないのに目的に沿った動作ができず、失認は感覚に異常がないのに対象を認知できない状態。","右頭頂葉などの損傷では、左側の空間や物に注意が向かない半側空間無視が生じやすい。","行政上の高次脳機能障害は、記憶障害・注意障害・遂行機能障害・社会的行動障害を主な症状とする。","支援には認知リハビリテーション、生活訓練、就労移行支援などが組み合わされる。"],"s":[0,2]}]},{"u":"感覚・知覚・注意","items":[{"n":"精神物理学と信号検出理論","p":["ウェーバーは1830年代、弁別閾（丁度可知差異）が基準刺激の強度に比例すること（ΔI/I＝一定）を示した。","フェヒナーは『精神物理学原論』（1860年）で、感覚の大きさは刺激強度の対数に比例すると定式化した。","スティーブンスはマグニチュード推定法から、感覚量が刺激強度のべき乗に比例するべき法則を示した。","絶対閾は刺激を50%の確率で検出できる最小強度で、極限法・恒常法・調整法などで測定する。","信号検出理論は反応をヒット・ミス・誤警報・正棄却に分け、感度（d′）と判断基準を分離して評価する。"],"s":[2,3]},{"n":"視覚の仕組みと色覚","p":["錐体は明所での色覚と高い視力を担い中心窩に集中し、桿体は暗所視を担い網膜の周辺部に多い。","視神経が眼球を出る部分には視細胞がなく盲点となる。暗所に移ると錐体から桿体優位へと暗順応が進む。","三色説（ヤング、ヘルムホルツ）は3種の錐体で、反対色説（ヘリング）は赤−緑・黄−青・白−黒の対で色覚を説明する。","両説は段階説で統合され、網膜では三色的、その後の神経段階では反対色的に符号化される。補色残像は後者で説明される。","ヒューベルとウィーゼルは視覚野の特徴検出細胞と視覚発達の臨界期を示し、1981年にノーベル賞を受けた。"],"s":[2,3]},{"n":"知覚の体制化","p":["視野は注目される図と背景の地に分かれ、ルビンの盃では図と地が反転して顔と盃が交互に見える。","ゲシュタルトの群化の要因には、近接・類同・よい連続・閉合・共通運命などがある。","プレグナンツの法則：知覚はできるだけ単純で規則的な、よいまとまりをとろうとする。","知覚は刺激駆動のボトムアップ処理と、知識や期待によるトップダウン処理の相互作用で成り立つ。","事前の言語的プライミングなどによる知覚的構えは、多義図形の見え方を偏らせる。"],"s":[2]},{"n":"奥行き知覚と運動知覚","p":["両眼手がかりは両眼視差と輻輳、単眼手がかりは線遠近法・重なり・相対的大きさ・きめの勾配・運動視差など。","ギブソンとウォークの視覚的断崖（1960年）は、這える乳児が深く見える側へ進むのを避けることを示した。","仮現運動は静止画を適切な時間間隔で続けて示すと動いて見える現象で、映画やアニメーションの原理である。","誘導運動は雲が動くと月が動いて見える現象、運動残効は滝を見続けた後に静止物が逆向きに動いて見える現象。","自動運動は暗室で静止した光点が動いて見える現象で、シェリフの集団規範の研究に用いられた。"],"s":[2,14]},{"n":"知覚の恒常性と錯視","p":["恒常性とは、網膜像が変わっても対象の大きさ・形・明るさ・色をほぼ一定に知覚する性質である。","大きさの恒常性は距離の手がかりに支えられ、手がかりを除くと網膜像の大きさに近い見え方になる。","ミュラー・リヤー錯視は矢羽の向きで同じ長さの線分が違って見える。ポンゾ錯視なども幾何学的錯視の例。","エイムズの部屋は、歪んだ部屋を特定の位置から見ると同じ身長の人が極端に大小異なって見える。","顔は倒立させると認識しにくく（倒立効果）、目と口だけ反転した顔も、全体を倒立させると異様さに気づきにくい（サッチャー錯視）。"],"s":[2,13]},{"n":"選択的注意の理論","p":["チェリー（1953年）は両耳分離聴の追唱課題で、無視した側の音声が英語からドイツ語に変わっても気づかれにくいと示した。","ブロードベント（1958年）のフィルター説は、物理的特徴で早期に選択し、非注意の情報は意味まで処理されないとした。","トリーズマン（1960年）の減衰説は、非注意情報は遮断されず弱められ、自分の名前など重要な情報は通過しうるとした。","ドイチュとドイチュ（1963年）の後期選択説は、すべての入力が意味まで処理され、意識に上る段階で選択されるとした。","選択がどの段階で起こるかは課題によるとする多重モード説（ジョンストンとハインツ、1978年）もある。"],"s":[5]},{"n":"注意の限界をめぐる現象","p":["非注意性盲目：シモンズとチャブリス（1999年）では、パスを数える課題中に約半数がゴリラに気づかなかった。","変化の見落とし（チェンジ・ブラインドネス）は、注意が向いていないと画面の大きな変化にも気づかない現象。","ストループ効果（1935年）は、色名の単語が別の色で書かれていると、インクの色を答えるのが遅れる現象。","トリーズマンらの特徴統合理論（1980年）は、色や形などの特徴を結びつけて物体を知覚するには焦点的注意が要るとする。","運転中の携帯電話での会話はハンズフリーでも運転を損なうが、ラジオを聞く場合は同様の低下はみられない。"],"s":[5,2]}]},{"u":"学習","items":[{"n":"馴化・鋭敏化と刻印づけ","p":["馴化は無害な刺激の反復で反応が減ること、鋭敏化は強い刺激を受けた後に反応が増大することである。","馴化には刺激特定性があり、別の刺激には反応が回復する（脱馴化）。乳児の弁別能力の研究に応用される。","ローレンツは、孵化直後のハイイロガンのひなが最初に見た動く対象を追うようになる刻印づけを示した。","刻印づけは生後早期の臨界期（敏感期）に成立しやすく、いったん成立すると変わりにくい。","ティンバーゲンらは、鍵刺激が生得的解発機構を介して定型的な行動パターンを引き起こすとした。"],"s":[14,0]},{"n":"古典的条件づけ","p":["パヴロフは犬の消化研究中に、肉粉（無条件刺激）と音（中性刺激）を対提示すると音だけで唾液が出ることを見出した。","対提示後の音を条件刺激、音による唾液分泌を条件反応と呼ぶ。対提示で反応が強まる段階を獲得という。","条件刺激だけを示し続けると消去されるが、休止後に自発的回復が起こり、消去は新たな抑制的学習とされる。","般化は条件刺激に似た刺激にも反応すること、弁別は特定の刺激にだけ反応するよう分化することである。","ワトソンとレイナー（1920年）は乳児アルバートに白ネズミと大きな音を対提示し、恐怖の条件づけと般化を示した。"],"s":[2,3]},{"n":"条件づけの理論と生物学的制約","p":["ガルシアとケーリング（1966年）：ラットは味と内臓不快を結びつけたが、光や音と内臓不快は結びつけにくかった。","味覚嫌悪学習は1回の経験で、しかも数時間の遅延があっても成立し、化学療法を受ける患者にもみられる。","セリグマンの準備性：ヘビやクモなど、進化の過程で危険だった対象への恐怖は条件づけられやすい。","カミン（1969年）のブロッキング：すでに無条件刺激を予測する刺激があると、追加された刺激は条件づけられにくい。","レスコーラ＝ワグナー・モデル（1972年）は、学習量が予測と実際の無条件刺激との差（予測誤差）で決まるとする。"],"s":[2,3]},{"n":"オペラント条件づけ","p":["ソーンダイクは問題箱でのネコの試行錯誤学習から、満足をもたらす反応が強まる効果の法則を提唱した。","スキナーはスキナー箱で、ラットのレバー押しなど自発的な反応（オペラント）と結果の関係を研究した。","三項随伴性：弁別刺激のもとで反応が生じ、結果が伴う。弁別刺激は反応が強化される機会を知らせる。","シェイピングは目標行動に近い反応を段階的に強化して新しい行動を形成する方法（逐次接近法）である。","一次強化子は食物など生得的な価値をもち、二次強化子は賞賛・お金・トークンなど一次強化子との連合で価値をもつ。"],"s":[2,3]},{"n":"強化と罰の4分類","p":["正の強化は好ましい刺激を与えて行動を増やし、負の強化は嫌悪刺激を取り除いて行動を増やす。","正の罰は嫌悪刺激を与えて行動を減らし、負の罰は好ましい刺激を取り除いて行動を減らす（タイムアウトなど）。","「正・負」は刺激の付加・除去を、「強化・罰」は行動の増加・減少を表す。負の強化を罰と混同するのは典型的な誤り。","例：シートベルトを締めると警告音が止むため着用が増えるのは負の強化である。","トークン・エコノミーは望ましい行動にトークン（二次強化子）を与え、後で報酬と交換させる技法である。"],"s":[2]},{"n":"強化スケジュール","p":["毎回強化する連続強化は獲得が速く、ときどき強化する部分強化は消去されにくい（部分強化効果）。","固定比率（FR）は一定回数ごとに強化し、反応率が高く強化直後に休止が生じる（例：出来高払い）。","変動比率（VR）は強化までの回数が不定で、高く安定した反応率を示し、最も消去されにくい（例：ギャンブル）。","固定間隔（FI）は一定時間後の最初の反応を強化し、強化直後に休み、時間が近づくと反応が増える。","変動間隔（VI）は不定の時間ごとに強化し、中程度で安定した反応率を示す。"],"s":[2]},{"n":"回避学習と学習性無力感","p":["逃避学習は嫌悪刺激から逃れる反応、回避学習は予告信号に反応して嫌悪刺激そのものを避ける反応の学習である。","マウラーの二要因説：古典的条件づけで信号に恐怖が生じ、回避反応は恐怖低減による負の強化で維持される。","セリグマンとマイヤー（1967年）：逃れられない電撃を受けた犬は、後に逃げられる状況でも逃げようとしなかった。","人の抑うつへの適用では、失敗を内的・安定的・全般的に帰属する悲観的な帰属様式が脆弱性とされた。","マイヤーとセリグマン（2016年）は神経科学の知見から、受動性は既定の反応で、学習されるのは統制可能性だと再解釈した。"],"s":[3]},{"n":"観察学習と認知的学習","p":["バンデューラ、ロス、ロス（1961年）：大人がボボ人形を攻撃するのを見た子どもは、同様の攻撃行動を示した。","モデルが罰される場面を見ると模倣は減り（代理罰）、報酬を受ける場面を見ると増える（代理強化）。","観察学習は注意・保持・運動再生・動機づけの4過程からなり、直接の強化なしに学習が成立する。","ケーラーは、チンパンジーが棒や箱を使って届かないバナナを取る場面から、見通しによる洞察学習を示した。","トールマンとホンジック（1930年）：報酬なしで迷路を探索したラットは、報酬導入後すぐ報酬群並みになった（潜在学習）。"],"s":[2,3]}]},{"u":"記憶","items":[{"n":"多重貯蔵モデル","p":["アトキンソンとシフリン（1968年）は、情報が感覚記憶→短期記憶→長期記憶へ移る多重貯蔵モデルを示した。","スパーリング（1960年）は部分報告法で、視覚情報が1秒足らずの間だけ大量に保持されること（アイコニック・メモリ）を示した。","短期記憶の容量はミラー（1956年）が7±2チャンクとしたが、コーワンは約4±1と見積もった。","ピーターソンら（1959年）：リハーサルを妨げると3文字の再生率は3秒後約80%から18秒後約10%に下がった。","自由再生の系列位置曲線では初頭効果と新近性効果がみられ、再生前に遅延を挟むと新近性効果だけが消える。"],"s":[2,3]},{"n":"ワーキングメモリ","p":["バデリーとヒッチ（1974年）は短期記憶を、情報を保持しながら処理する作業場としてワーキングメモリと捉え直した。","構成要素は、言語音を保つ音韻ループ、視覚・空間情報を扱う視空間スケッチパッド、両者を制御する中央実行系。","バデリー（2000年）は、各成分と長期記憶の情報を統合する第4の成分としてエピソード・バッファを加えた。","音韻ループの存在は、長い単語ほど覚えにくい語長効果などによって裏づけられる。","ワーキングメモリ容量の個人差は、読解や推論、学業成績と関連する。"],"s":[2,3]},{"n":"長期記憶の分類","p":["長期記憶は言葉で表せる宣言的（顕在）記憶と、意識的な想起を伴わない非宣言的（潜在）記憶に大別される。","タルヴィング（1972年）は宣言的記憶を、個人的な出来事のエピソード記憶と一般的な知識の意味記憶に分けた。","非宣言的記憶には手続き記憶（技能）、プライミング、古典的条件づけによる情動反応などが含まれる。","プライミングは、先行経験が意識されないまま後の処理を促進・変化させる現象で、潜在記憶の代表例である。","展望記憶は予定を適切な時に思い出して実行する記憶、自伝的記憶は自己に関わる出来事の記憶である。"],"s":[2,3]},{"n":"符号化と検索","p":["クレイクとロックハート（1972年）の処理水準説：形態や音韻より意味的に深く処理した情報ほどよく記憶される。","自己参照効果：自分に関連づけて処理した情報は記憶されやすい（ロジャーズら、1977年）。","タルヴィングとトムソン（1973年）の符号化特殊性原理：検索手がかりは記銘時の情報と一致するほど有効である。","ゴドンとバデリー（1975年）では、ダイバーが水中か陸上で学習・想起し、学習時と同じ環境の方がよく再生できた。","思い出すこと自体が記憶を強める（テスト効果、ローディガーとカーピック、2006年）。"],"s":[2,3]},{"n":"忘却","p":["エビングハウス（1885年）は無意味綴りと節約法で自らの記憶を測り、忘却は学習直後に急速でその後緩やかになると示した。","減衰説は時間とともに記憶痕跡が薄れるとするが、使わないことだけで忘却が起こるとは実証しにくい。","干渉説：以前の学習が新しい記憶を妨げる順向干渉と、新しい学習が以前の記憶を妨げる逆向干渉がある。","検索失敗説：手がかりを与えると思い出せることがあり、貯蔵されていても取り出せない場合がある。","シャクター（2001年）は記憶の7つの罪として、一過性・不注意・妨害・誤帰属・被暗示性・バイアス・固執を挙げた。"],"s":[3,2]},{"n":"偽りの記憶","p":["バートレット（1932年）は、記憶をスキーマに基づく再構成とみなし、想起のたびに変容しうるとした。","ロフタスとパーマー（1974年）：「激突した」と問うと速度推定が高く、1週間後に無かった割れたガラスを報告しやすかった。","事後情報効果：後から与えられた誤情報が元の記憶に取り込まれる（一時停止標識を徐行標識と問われた研究、1978年）。","ロフタスとピックレル（1995年）は、偽の「モールで迷子」体験を約4分の1の参加者に思い出させた。","DRM手続では、関連語のリストを学習した後、提示されていない中心語を高い確率で誤って再認する。"],"s":[3,2]},{"n":"目撃証言と記憶研究の応用","p":["DNA鑑定で冤罪と判明した事例の約7割に、誤った目撃証言が関わっていた。","共同目撃者と話し合った細部は、話し合っていない細部に比べて正確さが大きく下がる（記憶の同調）。","推奨される面通し手続は、二重盲検での実施、偏りのない教示、適切なフィラーの選定、識別直後の確信度の記録などである。","閃光記憶（フラッシュバルブ記憶）は確信度が高いまま保たれるが、内容の一貫性は日常の記憶と同様に低下する。","催眠や誘導的なイメージ法で「回復」された記憶は、正確性に強い疑問がある。"],"s":[3,2]},{"n":"健忘と記憶の神経基盤","p":["H.M.は1953年にてんかん治療で両側の内側側頭葉を切除され、重い前向性健忘となった（スコヴィルとミルナー、1957年）。","H.M.は新しい出来事を覚えられない一方、鏡映描写などの運動技能は上達し、宣言的記憶と手続き記憶の解離を示した。","逆向性健忘は発症前の記憶の喪失で、発症に近い記憶ほど失われやすく、古い記憶は残りやすい時間的勾配を示す。","コルサコフ症候群はビタミンB1欠乏などによる健忘症候群で、作話を伴うことがある。","記憶の固定化には、シナプスのレベルで数時間、システムのレベルで数週間以上かかるとされる。"],"s":[3,2]}]},{"u":"思考と言語","items":[{"n":"問題解決","p":["アルゴリズムは手順どおりに行えば必ず解に至る方法、ヒューリスティックは速いが誤りうる経験則である。","ニューウェルとサイモンは問題解決を問題空間の探索とみなし、目標と現状の差を縮める手段−目標分析を示した。","機能的固着：ドゥンカー（1945年）のロウソク問題では、画鋲の箱を台として使う発想が妨げられた。","心的構え：ルーチンスの水がめ問題では、繰り返し使った複雑な解き方に固執し、簡単な解き方を見落とす。","洞察は解が突然ひらめく現象で、問題からいったん離れる孵化の期間がひらめきを助けると論じられる。"],"s":[2]},{"n":"推論","p":["演繹推論は前提から論理的に必然の結論を導き、帰納推論は個別の事例から一般法則を蓋然的に導く。","ウェイソン選択課題（1966年）では、「表が母音なら裏は偶数」を確かめるのに必要な2枚を正しく選べる人は少ない。","同じ論理構造でも、飲酒年齢の規則のような社会的契約の文脈にすると正答率が大きく上がる（主題化効果）。","確証バイアスは仮説を支持する証拠ばかり探し反証を軽視する傾向で、ウェイソンの2-4-6課題でも示された。","信念バイアスは、結論がもっともらしいかどうかに引きずられて、論理的な妥当性を誤って判断する傾向である。"],"s":[2]},{"n":"ヒューリスティクスとバイアス","p":["トヴェルスキーとカーネマン（1974年、Science誌）は、経験則が系統的な判断の偏りを生むことを体系化した。","代表性ヒューリスティック：典型例との類似で判断し基準率を無視する。リンダ問題では連言錯誤が生じる。","利用可能性ヒューリスティック：思い出しやすい事例ほど、その頻度や確率を高く見積もる。","係留と調整：最初に示された数値（アンカー）に推定が引きずられ、本人が影響を否定しても効果が残る。","後知恵バイアスは結果を知った後で「予測できた」と感じる傾向。バイアスを知るだけでは是正は難しい。"],"s":[2,6]},{"n":"プロスペクト理論と二重過程","p":["プロスペクト理論（カーネマンとトヴェルスキー、1979年）：結果は参照点からの利得・損失で評価され、損失を重く感じる。","フレーミング効果（1981年）：同じ事態でも「救える」と示すと確実な案が、「死ぬ」と示すと賭けの案が好まれる。","臓器提供の同意率は、明示的な同意を要する国で4〜44%、拒否しない限り同意とみなす国で86〜100%だった（2003年）。","サイモンの限定合理性：人は認知能力・時間・費用の制約の下で、最適ではなく満足できる解を選ぶ。","直観的で速いシステム1と熟慮的で遅いシステム2を区別する（スタノヴィッチとウェスト、2000年）。"],"s":[6]},{"n":"言語の構造と言語相対性","p":["音素は意味を区別する最小の音の単位、形態素は意味をもつ最小の単位である。","統語論は語を並べて文を作る規則、意味論は語や文の意味、語用論は文脈の中での意味の使われ方を扱う。","グライスの会話の公理（量・質・関係・様態）は、言外の意味（含意）の理解を説明する語用論の基礎概念である。","乳児は当初あらゆる言語の音素を聞き分けるが、1歳頃までに母語で使う音素の区別に特化していく。","言語が思考を決めるとするサピア＝ウォーフ仮説の強い版は支持されず、色名が2語のダニ族も色を同等に区別できた。"],"s":[2,3,13]},{"n":"言語獲得の理論と過程","p":["スキナー（1957年）は言語を強化で学習される行動とみたが、チョムスキーは生得的な普遍文法と言語獲得装置を仮定した。","ブルーナーは養育者の支援を言語獲得支援システムと呼び、トマセロの用法基盤モデルは具体的な用例から文法を築くとする。","喃語は生後数か月から現れ、初語は12〜18か月頃、2語文は18〜24か月頃に現れる。","子どもは規則を例外にも当てはめる過剰一般化（英語の「mouses」など）を示し、規則を抽出していることがわかる。","レネバーグは言語獲得の臨界期を唱えた。1970年に保護されたジーニーは語彙は増えたが文法を十分に習得できなかった。"],"s":[2,0]}]},{"u":"動機づけ・感情・ストレス","items":[{"n":"動機づけの理論と欲求階層","p":["動因低減説では、恒常性からのずれが生理的欲求と動因を生み、それを低減した行動が習慣として強まる。","覚醒理論では人は最適な覚醒水準を求め、低すぎれば刺激を探し、高すぎれば下げようとする。","ヤーキーズ・ドッドソンの法則（1908年）：覚醒と成績は逆U字の関係で、難しい課題ほど最適な覚醒水準は低い。","マズロー（1943年）の欲求階層：生理的→安全→所属と愛→承認→自己実現。下位が満たされると上位が現れるとした。","欲求階層説は実証的な支持が乏しく主観的だと批判される。晩年のマズローは自己超越の段階も構想した。"],"s":[2]},{"n":"内発的動機づけと自己決定理論","p":["デシ（1971年）のパズル実験では、解くたびに金銭報酬を受けた群は、自由時間に自発的に取り組む時間が減った。","外的報酬が内発的動機づけを損なう現象をアンダーマイニング効果（過剰正当化効果）という。","予期された有形の報酬は内発的動機づけを下げやすいが、予期しない報酬や言語的な賞賛は下げにくい。","デシとライアンの自己決定理論は、自律性・有能感・関係性という3つの基本的心理欲求の充足を重視する。","外発的動機づけは自律性の低い順に、外的調整・取り入れ的調整・同一化的調整・統合的調整に分けられる。"],"s":[2,3]},{"n":"原因帰属と自己効力感","p":["ワイナーは成功・失敗の原因を、所在（内的・外的）、安定性、統制可能性の3次元で整理した。","失敗を努力不足（内的・不安定・統制可能）に帰属すると、次に努力しようとする動機づけが保たれやすい。","バンデューラ（1977年）の自己効力感は、ある行動をうまく遂行できるという確信で、結果期待とは区別される。","自己効力感の源泉は、遂行行動の達成、代理経験、言語的説得、生理的・情動的状態の4つである。","ロッター（1966年）は、結果を自分の行動によるとみる内的統制と、運や他者によるとみる外的統制を区別した。"],"s":[2]},{"n":"自我消耗と自己制御の再現性","p":["バウマイスターら（1998年）は、チョコレートを我慢した群が解けないパズルを早く諦めたとして自我消耗を唱えた。","自己制御を有限の資源とみるこの説は、2016年の23研究室による事前登録追試で効果がほぼゼロだった。","2021年の36研究室による大規模追試でも効果は極めて小さく、自我消耗は再現性が強く疑われる知見となった。","マシュマロ・テストの待機時間と後年の学業成績の関連は、2018年の大規模追試で原研究よりかなり小さかった。","その関連は家庭背景や早期の認知能力を統制するとさらに弱まり、幼児期の自制心の予言力は疑問視されている。"],"s":[3]},{"n":"感情の諸理論","p":["ジェームズ＝ランゲ説（末梢起源説）は、身体反応の知覚こそが感情体験だとする（「泣くから悲しい」）。","キャノン＝バード説（中枢起源説）は、視床からの信号で身体反応と感情体験が同時かつ独立に生じるとする。","シャクターとシンガー（1962年）の二要因説：生理的覚醒とその原因の認知的なラベルづけで感情が決まる。","ラザルスは刺激の認知的評価が感情に先立つとし、ザイアンスは認知を経ない感情もあるとして論争した。","ダマシオのソマティック・マーカー仮説は身体信号が意思決定を導くとし、バレットは感情を脳が構成する予測とみる。"],"s":[2,13]},{"n":"基本感情と表情","p":["ダーウィン（1872年）は表情の普遍性を論じ、エクマンは孤立した文化の人々も表情を同じ感情と結びつけると示した。","エクマンの基本感情は喜び・驚き・悲しみ・恐れ・嫌悪・怒りの6つで、のちに軽蔑が加えられた。","表示規則は場面に応じて表情を出し分ける文化的な規範で、日本人は他者の前で否定的な表情を抑えやすいと報告された。","ルドゥーは、恐怖刺激が視床から扁桃体へ直接向かう速い経路と、皮質を経由する遅い経路で処理されることを示した。","ラッセルの円環モデルは、感情を快−不快と覚醒の高低の2次元上に配置する次元論である。"],"s":[2]},{"n":"ストレスとコーピング","p":["セリエの汎適応症候群：ストレッサーに対し、警告反応期→抵抗期→疲憊期と進む非特異的な反応。","ラザルスとフォークマン（1984年）：一次評価（脅威か）と二次評価（対処できるか）を経てストレス反応が生じる。","コーピングは、問題そのものに働きかける問題焦点型と、情動を調整する情動焦点型に大別される。","ホームズとレイ（1967年）の社会的再適応評価尺度は、生活上の出来事の負担を配偶者の死を100点として得点化した。","ストレスへの抵抗力に関わる概念に、ハーディネス、レジリエンス、首尾一貫感覚（アントノフスキー）がある。"],"s":[13]}]},{"u":"発達","items":[{"n":"発達研究の方法と基本論点","p":["乳児研究では選好注視法（ファンツ）、馴化・脱馴化法、期待違反法などにより言葉を使わずに認知を調べる。","ほかに視覚的断崖、鏡の自己認知を調べるルージュテスト、養育者の無表情への反応を見るスティルフェイス実験がある。","発達の主要な論点は、遺伝と環境、連続か段階（非連続）か、普遍性と文化差などである。","ゲゼルは成熟を重視し、一卵性双生児の階段登り訓練の研究で、早すぎる訓練の効果は小さいことを示した。","サメロフの相互規定的作用モデルは、子どもと環境が時間とともに互いに影響し合って発達が進むとみる。"],"s":[14,0]},{"n":"ピアジェの認知発達理論","p":["子どもはシェマに情報を取り込む同化と、シェマを作り変える調節によって均衡化しながら発達するとした。","感覚運動期（0〜2歳）は感覚と運動で外界を知り、見えなくても物は存在し続けるという対象の永続性を獲得する。","前操作期（2〜7歳）は象徴機能が発達するが、自己中心性（三つの山問題）や保存の未獲得がみられる。","具体的操作期（7〜11歳）は保存や可逆性を理解し、形式的操作期（11、12歳〜）は抽象的・仮説演繹的に考える。","批判：期待違反法では乳児がより早く対象の永続性を示し（ベイラージョン）、発達はより連続的ともされる。"],"s":[2]},{"n":"ヴィゴツキーの社会文化的理論","p":["高次の精神機能は、まず他者との相互作用の中で現れ、のちに個人の内部に取り込まれる（内化）とした。","発達の最近接領域は、子どもが独力でできる水準と、大人や仲間の援助があればできる水準との間の領域である。","子どもの状態に応じて援助を調整し、徐々に外していく支援を足場かけ（スキャフォールディング）という。","子どもの独り言（自己中心的言語）を、思考の道具となる内言へ移る途中の現象とみて、ピアジェと見解が分かれた。"],"s":[2]},{"n":"エリクソンの心理社会的発達","p":["生涯を8段階に分け、各段階に心理社会的危機を置いた。乳児期は基本的信頼対不信である。","幼児前期は自律性対恥・疑惑、遊戯期は自発性対罪悪感、学童期は勤勉性対劣等感である。","青年期は同一性（アイデンティティ）対同一性拡散で、社会的責任が猶予されるモラトリアムの時期でもある。","成人前期は親密性対孤立、成人期は世代性（生殖性）対停滞、老年期は統合対絶望である。","マーシャ（1966年）は危機と傾倒の有無から、同一性達成・モラトリアム・早期完了・同一性拡散の4地位を示した。"],"s":[2]},{"n":"愛着理論と養育","p":["ボウルビィは、乳児が養育者への近接を求める愛着を進化的に適応的なものとし、養育者を安全基地と位置づけた。","ハーロウ（1958年）の子ザルは、ミルクの出る針金製の代理母より布製の代理母にしがみつき、接触の快の重要性を示した。","養育者との経験は内的作業モデルとして表象され、後の対人関係への期待に影響すると考えられている。","バウムリンドは養育態度を権威ある（民主的）・権威主義的・許容的に分け、のちにマッコビーとマーティンが無関与（放任）を加えた。","早期の愛着と後の人間関係との関連は確率的なもので、その後の経験によって変わりうる。"],"s":[8,2]},{"n":"ストレンジ・シチュエーション法","p":["エインズワースが開発。約1歳の子と養育者の分離と再会を含む約20分の手続きで愛着の質を評価する。","安定型（B型）は分離で泣いても再会時に慰められて探索に戻る。米国の標本では約6割を占める。","回避型（A型）は分離に動揺せず再会時に養育者を避け、アンビヴァレント型（C型）は強く動揺し再会時に怒りを示す。","メインとソロモン（1990年）は、接近と回避が混在する無秩序・無方向型（D型）を加えた。","養育者の敏感性は安定型を予測し、敏感性を高める介入で安定型が増えた（ファン・デン・ブーム、1994年）。"],"s":[8,2]},{"n":"心の理論","p":["プレマックとウッドラフ（1978年）は、チンパンジーが他者の意図を推測できるかを問い「心の理論」の語を用いた。","ウィマーとパーナー（1983年）の誤信念課題は、登場人物の誤った信念に基づく行動の予測を求め、4歳未満では難しい。","バロン＝コーエンら（1985年）のサリーとアン課題では、自閉症児の多くが誤信念課題に失敗した。","乳児の視線から暗黙の誤信念理解を示したとする研究は、追試の結果が一貫せず議論が続いている。","メンタライゼーションは、自他の行動を意図や感情などの心的状態から理解する能力を指す（フォナギーら）。"],"s":[3,0]},{"n":"道徳性の発達","p":["ピアジェは、子どもの道徳判断が結果を重視する他律的な段階から、動機を重視する自律的な段階へ移るとした。","コールバーグは前慣習的・慣習的・脱慣習的の3水準6段階を示し、最も高い段階に達する人は少ないとした。","ハインツのジレンマでは、盗むか否かの結論ではなく、その判断の理由づけによって段階を評定した。","ギリガン（1982年）は正義中心の理論が男性に偏っていると批判し、配慮と責任を重んじるケアの倫理を示した。","道徳的推論の段階と、実際の道徳的行動は必ずしも一致しない。"],"s":[2]},{"n":"成人期・老年期の発達","p":["アーネット（2000年）は18歳から20代半ばを、模索の続く成人形成期（エマージング・アダルトフッド）と呼んだ。","加齢により流動性知能は低下しやすいが、結晶性知能は維持・上昇しやすい。","カーステンセンの社会情動的選択性理論：残り時間が限られると感じると、情動的に満たされる親しい関係を優先する。","バルテスは補償を伴う選択的最適化（SOC）理論を、トーンスタムは物質的・合理的な視点を超える老年的超越を唱えた。","身体機能が低下しても高齢者の主観的幸福感が保たれやすい現象を、エイジング・パラドックスという。"],"s":[2,14,13]}]},{"u":"人格と知能","items":[{"n":"人格の類型論","p":["クレッチマー（1921年）は体型と気質を結びつけ、細長型を分裂気質、肥満型を循環気質、闘士型を粘着気質とした。","シェルドンは、内胚葉型・中胚葉型・外胚葉型の体型と気質との対応を論じた。","ユングは心的エネルギーの向きで内向型と外向型を分け、思考・感情・感覚・直観の4機能と組み合わせた。","類型論は全体像をつかみやすい一方、中間的な人を扱いにくく、人を固定的に捉える危険がある。"],"s":[2]},{"n":"人格の特性論","p":["オールポートとオドバート（1936年）は辞書から人を記述する語を約4,500語抽出し、語彙研究の出発点となった。","オールポートは特性を、人格全体を支配する主特性、中心特性、状況に依存する二次特性に分けた。","キャッテルは因子分析で16の根源特性を見出し、16PF質問紙を作成した。","アイゼンクは外向性−内向性と神経症傾向の2次元を立て、のちに精神病傾向を加えた。","語彙仮説：人々にとって重要な個人差は、日常言語の単語として符号化されているとする考え方。"],"s":[2]},{"n":"ビッグファイブとHEXACO","p":["5因子は開放性・誠実性・外向性・協調性・神経症傾向（OCEAN）で、コスタとマクレーはNEO-PI-Rで測定した。","5因子は多くの文化で見出され、誠実性は中年期にかけて、協調性は高齢期にかけて高まる傾向がある。","アシュトンとリーのHEXACOモデルは、正直さ−謙虚さ（H）を加えた6因子モデルである。","ダーク・トライアドはマキャヴェリアニズム・自己愛傾向・サイコパシーの3特性で、H因子の低さと強く関連する。","特性は健康・学業・職業上の成果を予測し、とくに誠実性は職務遂行と安定して関連する。"],"s":[2,13]},{"n":"一貫性論争と相互作用論","p":["ミシェル（1968年）は、特性と状況を越えた行動との相関が.30程度にとどまると指摘し、人間−状況論争を起こした。","行動は似た状況の中では一貫しており、「この状況ならこう振る舞う」という状況と行動のパターンとして安定する。","多くの場面の行動を集計すると、特性による行動の予測力は高まる。","現在は、人と状況の相互作用で行動を説明する相互作用論が主流である。","バンデューラの相互決定主義は、認知などの個人要因・行動・環境が互いに影響し合うとする。"],"s":[2]},{"n":"人格の遺伝・環境と気質","p":["ミネソタ双生児研究（1979〜99年）では、別々に育った一卵性双生児も人格がよく似ていた。","双生児研究では人格特性の個人差の4〜5割程度が遺伝で説明され、家族が共有する環境の影響は小さい。","人格は多数の遺伝子の小さな効果の積み重ねとエピジェネティックな調節を受け、単一の遺伝子では決まらない。","トマスとチェス（1977年）は乳児の気質を、扱いやすい・扱いにくい・慣れるのに時間がかかる、の3型に分けた。","子の気質と環境の要求がかみ合うか（適合のよさ）が、その後の適応を左右するとされる。"],"s":[2]},{"n":"知能の構造理論","p":["スピアマン（1904年）は課題間の正の相関から、一般因子gと課題固有の特殊因子sを想定した（2因子説）。","サーストンは知能を、言語理解・数・空間・記憶・推理など7つの基本的精神能力からなるとした（多因子説）。","キャッテルとホーンは、新奇な問題を解く流動性知能と、経験で蓄積される結晶性知能を区別した。","キャロル（1993年）は400以上のデータを再分析して3層モデルを示し、これを統合したCHC理論が現代の知能検査の基盤となった。","ガードナー（1983年）の多重知能論は、のちに博物的知能を加え8つの知能を挙げるが、実証的支持の乏しさが批判される。"],"s":[3,2]},{"n":"知能検査の歴史とIQ","p":["ビネーとシモン（1905年）は学業に困難を抱える子を見出すため最初の実用的な知能検査を作り、1908年の改訂版で精神年齢を導入した。","シュテルンが提案した知能指数（精神年齢÷生活年齢×100）は、ターマンのスタンフォード・ビネー（1916年）で採用された。","ウェクスラーは1939年にウェクスラー・ベルビュー知能検査を作り、同年齢集団内の位置で示す偏差IQを用いた。","偏差IQは平均100・標準偏差15で、約68%が85〜115の範囲に入り、130以上は約2%である。","フリン効果：IQ得点は世代を追って上昇してきたが、知能そのものの上昇を意味するとは限らない。"],"s":[10,3]},{"n":"主な個別式知能検査","p":["WAIS-IV（日本版2018年）は16〜90歳が対象で、言語理解・知覚推理・ワーキングメモリー・処理速度の4指標を出す。","WISC-V（日本版2021年）は5〜16歳が対象で、言語理解・視空間・流動性推理・ワーキングメモリー・処理速度の5指標をもつ。","WPPSI-III（日本版2017年）は2歳6か月〜7歳3か月の幼児を対象とする。","田中ビネー知能検査V（2003年）は2歳〜成人が対象で、13歳以下は精神年齢と比率IQ、14歳以上は偏差IQを用いる。","知的発達症の診断は知能検査の結果と適応機能の評価を合わせて行い、重症度は適応機能によって判断する。"],"s":[10,0]}]},{"u":"社会心理学","items":[{"n":"帰属理論","p":["ハイダー（1958年）は、人が行動の原因を内的な傾性か外的な状況に求める素朴な帰属の過程を論じた。","ケリーの共変モデルは、合意性・弁別性・一貫性の3つの情報の組み合わせから原因を推論するとする。","基本的帰属錯誤（ロス、1977年）は他者の行動を内的要因に帰属しすぎる傾向で、集団主義文化では弱いとされる。","行為者−観察者バイアス：自分の行動は状況に、他者の行動は性格に帰属しやすい（ジョーンズとニスベット、1971年）。","成功は自分、失敗は外的要因のせいにするセルフ・サービング・バイアスや、被害者非難を招く公正世界信念がある。"],"s":[2]},{"n":"認知的不協和と態度の理論","p":["フェスティンガー（1957年）は、矛盾する認知による不快な緊張（不協和）を、認知や行動を変えて低減するとした。","フェスティンガーとカールスミス（1959年）では、退屈な課題を面白いと伝えた報酬1ドル群が20ドル群より課題を高く評価した。","厳しい入会儀礼を経た集団ほど好まれる、努力の正当化もみられる（アロンソンとミルズ、1959年）。","ベムの自己知覚理論は、不協和を想定せず、人は自分の行動を観察して自らの態度を推論するとした。","ハイダーのバランス理論は、自分・他者・対象の3者関係の符号の積が正のとき均衡状態になるとする。"],"s":[2]},{"n":"態度変容と説得","p":["精緻化見込みモデル（ペティとカシオッポ、1986年）：動機と能力が高いと中心ルート、低いと周辺ルートで処理される。","中心ルートによる態度変容は持続しやすく、周辺ルートは専門家らしさや魅力などの手がかりに依存し変わりやすい。","フット・イン・ザ・ドアは小さな依頼の後に大きな依頼をし、ドア・イン・ザ・フェイスは大きな依頼を断らせてから本命を頼む。","マクガイアの接種理論は、弱い反論に前もって触れると説得への抵抗力が高まるとする。","ザイアンスの単純接触効果は、繰り返し接するだけで対象への好意が高まる現象である。"],"s":[3,2]},{"n":"同調","p":["シェリフ（1935年）は自動運動を用い、曖昧な状況では個人の判断が集団の規範へ収束することを示した。","アッシュの線分判断実験では、サクラの誤答に76%が少なくとも1回同調し、全体では約3分の1の試行で同調した。","同調は多数派が数人に増えるまで強まり、その後は頭打ちになる。1人でも異論者がいると大きく減る。","嫌われないための規範的影響と、他者を正しい判断の手がかりとする情報的影響が区別される。","モスコヴィッチは、一貫した主張を続ける少数派が多数派に影響を与えうることを示した。"],"s":[7,2]},{"n":"服従","p":["ミルグラム（1963年）では、教師役の65%が実験者の指示で最大の450Vまで電撃を与え続けた（実際の電撃はない）。","服従率は、生徒役と同室にすると40%、生徒役の手を押さえさせると30%、電話で指示すると約2割に下がった。","ほかの教師役が拒否すると服従は大きく減り、女性参加者の服従率は男性と同程度だった。","参加者に強いストレスを与えた倫理的問題から研究倫理の整備が進み、完全な追試は現在許されない。","バーガー（2009年）の150Vで止める部分的追試でも、約半世紀前と似た服従傾向が示された。"],"s":[7,2]},{"n":"スタンフォード監獄実験の問題","p":["ジンバルドーら（1971年）は男子大学生24人を看守役と囚人役に無作為に割り当て、大学地下の模擬監獄で観察した。","看守役の虐待がエスカレートし、2週間の予定が6日で中止されたと報告された。","後に公開された記録から、看守役への指示や実験者側の関与、要求特性があったと指摘され、妥当性が強く批判されている。","BBC監獄研究（ライカーとハスラム、2002年実施）では、看守役が自然に暴君化することはなかった。","「役割を与えれば人は残虐になる」という教科書的な解釈は、過度な単純化だと指摘されている。"],"s":[2,4]},{"n":"社会的促進と社会的手抜き","p":["トリプレット（1898年）は、自転車選手が単独で走るより他者と競う方が速いことを見出した。","ザイアンス（1965年）は、他者の存在が優勢反応を強めるため、単純課題では促進、複雑課題では抑制が生じると説明した。","ラタネら（1979年）の拍手・叫び課題では、1人あたりの音量が2人で単独時の66%、6人で36%に低下した。","社会的手抜きは、個人の貢献が評価されるようにすると減り、集団が大きいほど生じやすい。","匿名性が高まり自己意識が薄れると、規範による抑制が弱まる没個性化が生じる。"],"s":[3]},{"n":"集団の意思決定","p":["集団極性化：討議によって、集団の判断がもともと優勢だった方向へより極端になる（リスキー・シフトなど）。","モスコヴィッチとザヴァローニ（1969年）は、討議によってフランス人学生の態度が一層極端になることを示した。","ジャニスの集団浅慮は、凝集性の高い集団が全員一致を優先して不合理な決定に至る現象で、ピッグス湾事件が例とされる。","集団浅慮の防止策として、外部の意見の導入、匿名投票、すべての選択肢の検討などが勧められる。","隠れたプロフィール課題では、集団は共有された情報ばかりを話し合い、個人だけが持つ重要情報が生かされにくい。"],"s":[3,2]},{"n":"偏見と集団間関係","p":["ステレオタイプは集団への認知、偏見は感情、差別は行動の側面として区別される。","タジフェルの最小条件集団の実験では、恣意的な集団分けだけで内集団ひいきが生じ、社会的アイデンティティ理論につながった。","シェリフの泥棒洞窟実験では、集団間の競争で敵意が生じ、協力が必要な上位目標の導入で緩和された。","フィスクらのステレオタイプ内容モデルは、集団を温かさと能力の2次元で評価し、それに応じて感情が異なるとする。","IAT（グリーンワルドら、1998年）は反応時間で潜在的態度を測るが、個人の行動を予測する力は低いとの批判がある。"],"s":[3,2,13]},{"n":"援助行動と傍観者効果","p":["ダーリーとラタネ（1968年）の発作実験では、自分だけが聞いていると思うと85%、他に4人いると思うと31%が発作中に援助に動いた。","傍観者効果は、責任の分散と、他者の無反応から緊急でないと判断する多元的無知によって説明される。","研究の契機となったキティ・ジェノヴィーズ事件（1964年）の「38人が傍観」という報道は、後に誇張だったとされた。","公共の場の監視カメラ映像の分析（2020年）では、争いの約9割で少なくとも1人の傍観者が介入していた。","援助の動機を説明する理論に、共感−利他性仮説（バトソン）、否定的状態解除モデル、互恵的利他主義などがある。"],"s":[3]}]},{"u":"精神障害と診断","items":[{"n":"DSM-5-TRと診断の考え方","p":["DSMは米国精神医学会の診断・統計マニュアルで、初版は1952年、DSM-III（1980年）で操作的診断基準を導入した。","DSM-5（2013年）は多軸評定を廃止し、自閉スペクトラム症のような次元的（スペクトラム）な捉え方を一部導入した。","DSM-5-TR（2022年）は本文の改訂版で、新たに遷延性悲嘆症を加えた。","WHOのICD-11は2022年に発効し、複雑性PTSDやゲーム障害などを含む。","症状が苦痛や機能の障害を伴うことが要件となる。過剰診断や正常な反応の病理化を懸念する批判もある。"],"s":[2,0]},{"n":"抑うつ症と双極症","p":["うつ病は、抑うつ気分か興味・喜びの喪失を含む9症状のうち5つ以上が、2週間以上ほぼ毎日続くことで診断する。","持続性抑うつ症は抑うつ気分が2年以上（子ども・青年は1年以上）続く。うつ病は女性に多く、差は思春期に現れる。","DSM-5ではうつ病の死別反応の除外規定が削除され、重篤気分調節症と月経前不快気分障害が加わった。","双極I型は1週間以上の躁病エピソードで、双極II型は4日以上の軽躁病エピソードと抑うつエピソードで診断する。","双極症の薬物療法はリチウムなどの気分安定薬が中心で、抗うつ薬の単独使用は躁転を招くおそれがある。"],"s":[3,2]},{"n":"不安症群","p":["不安症群には、限局性恐怖症・社交不安症・パニック症・広場恐怖症・全般不安症・分離不安症・場面緘黙などがある。","パニック発作は数分以内にピークに達し、パニック症では次の発作への持続的な心配や回避が1か月以上続く。","全般不安症は過剰な心配が6か月以上多くの日にあり、落ち着きのなさ・疲れやすさなど6症状のうち3つ以上を伴う。","クラークの認知モデル：動悸などの身体感覚を破局的に解釈することが不安を高め、パニックの悪循環を生む。","曝露を中心とする認知行動療法は薬物療法と同程度に有効で効果が持続しやすい。ベンゾジアゼピン系は依存に注意。"],"s":[2,3]},{"n":"強迫症と心的外傷関連症群","p":["強迫症は強迫観念と強迫行為からなり、DSM-5で不安症群から独立した強迫症および関連症群に移された。","関連症群には醜形恐怖症・ためこみ症・抜毛症・皮膚むしり症が含まれる。強迫症には曝露反応妨害法が有効。","PTSDは侵入症状、回避、認知と気分の否定的変化、覚醒度と反応性の変化が1か月以上続くことで診断する。","PTSDの危険因子は外傷の重さ、直後の社会的支援の乏しさ、その後のストレスなどで、社会的支援は保護因子となる。","遷延性悲嘆症は、近しい人の死から12か月以上（子どもは6か月以上）強い思慕や没頭が続き、生活に支障をきたす状態。"],"s":[3,2]},{"n":"統合失調症","p":["陽性症状は幻覚・妄想・まとまりのない会話や行動、陰性症状は情動表出の減少・意欲欠如・会話の貧困などである。","2つ以上の症状が1か月以上（活動期）あり、障害の徴候が前駆期や残遺期を含め6か月以上続くことで診断する。","生涯有病率は約1%で、多くは青年期後期から成人早期に発症する。多重人格（解離性同一症）とは別の障害である。","養子研究などから、遺伝的脆弱性と環境ストレスの双方が関与する脆弱性−ストレスモデルが支持される。","抗精神病薬はドパミンD2受容体を遮断し、定型薬ではパーキンソニズムや遅発性ジスキネジアなどの錐体外路症状が出やすい。"],"s":[2]},{"n":"神経発達症群","p":["自閉スペクトラム症は、社会的コミュニケーションの持続的な欠陥と、限定された反復的な行動・興味の2領域で診断する。","DSM-5で自閉性障害やアスペルガー障害などが自閉スペクトラム症に統合され、感覚の過敏・鈍麻も基準に含まれた。","ADHDは不注意と多動・衝動性を特徴とし、症状のいくつかが12歳以前からあり、2つ以上の場面でみられる。","限局性学習症（読字・書字表出・算数）、発達性協調運動症、知的発達症、チック症も神経発達症群に含まれる。","MMRワクチンと自閉症を結びつけた1998年の論文は不正により撤回され、大規模研究でも関連は否定されている。"],"s":[2,0]},{"n":"パーソナリティ症","p":["文化的な期待から著しく偏り、広範で柔軟性を欠く内的体験と行動の様式で、青年期か成人早期に始まる。","A群（奇妙・風変わり）は猜疑性・シゾイド・統合失調型、B群（演技的・感情的）は反社会性・境界性・演技性・自己愛性。","C群（不安・恐怖）は回避性・依存性・強迫性で、強迫性パーソナリティ症は強迫症とは別のものである。","反社会性は18歳以上で15歳以前からの素行の問題を要する。境界性には弁証法的行動療法（リネハン）が用いられる。","DSM-5は第III部に、機能の障害と病的特性の次元で評価する代替モデルを示した。"],"s":[2,3]},{"n":"その他の主な精神障害","p":["神経認知障害群には認知症と軽度認知障害（MCI）があり、MCIから認知症へは1年に5〜15%程度が移行するとされる。","物質使用障害はDSM-5で乱用と依存が統合され、ギャンブル障害も物質関連障害および嗜癖性障害群に含まれた。","神経性やせ症は低体重・肥満恐怖・体型認知の歪みを、神経性過食症は過食と代償行動の反復を特徴とする。","解離症群には、解離性同一症、解離性健忘（解離性遁走を含む）、離人感・現実感消失症がある。","身体症状症は身体症状に関する過度な思考・感情・行動が特徴で、ストレスで悪化する身体疾患である心身症とは異なる。"],"s":[14,0]}]},{"u":"心理療法とアセスメント","items":[{"n":"精神分析的心理療法","p":["フロイトの精神分析は最初の体系的な心理療法で、自由連想、夢分析、抵抗や転移の解釈を中心とする。","転移は患者が過去の重要な人物への感情を治療者に向けること、逆転移は治療者の側に生じる感情反応である。","現在は頻度を減らし対人関係にも焦点を当てる精神力動的心理療法が中心で、短期療法には一定の実証的支持がある。","長期の精神力動療法の有効性を示すメタ分析もあるが、その方法をめぐって評価は分かれている。"],"s":[9,2]},{"n":"来談者中心療法","p":["ロジャーズが1940年代に非指示的療法として始め、のちに来談者中心療法、パーソン・センタード・アプローチへ発展した。","治療者の条件として、無条件の肯定的配慮、共感的理解、純粋性（自己一致）を重視した。","自己概念と経験の不一致が不適応を生み、受容的な関係の中で両者の一致が進むと考える。","傾聴や感情の反射・明確化を用いる。その効果は良好な治療関係などの共通要因によるところが大きいとの見方がある。"],"s":[9,2]},{"n":"行動療法と応用行動分析","p":["M.C.ジョーンズ（1924年）は、ウサギを怖がる少年ピーターにおやつを与えながら段階的にウサギを近づけ恐怖を除いた。","ウォルピ（1958年）は、リラクセーションと不安階層表を用いて弱い刺激から慣らしていく系統的脱感作法を開発した。","曝露療法は不安刺激に回避せず直面して消去学習を促す方法で、仮想現実を用いる曝露もPTSDなどに使われる。","嫌悪療法は、望ましくない行動を不快な刺激と結びつける（例：アルコール依存に対する抗酒薬）。","応用行動分析は行動の機能分析に基づきオペラント条件づけで支援する方法で、自閉スペクトラム症の療育にも用いられる。"],"s":[2]},{"n":"認知行動療法とその展開","p":["ベックは1960年代にうつ病の認知療法を開発し、自動思考や否定的スキーマ、自己・世界・将来への否定的見方を扱った。","エリスが1950年代に始めた論理療法（現在のREBT）は、出来事A・信念B・結果Cの図式で非合理的信念を論駁する。","CBTは12〜16回程度の構造化された面接が典型で、うつ病・不安症・PTSDなど多くの障害で第一選択とされる。","アクセプタンス＆コミットメント・セラピー（ヘイズら）は、思考を消そうとせず距離をとり、価値に沿った行動を促す。","マインドフルネス認知療法はうつ病の再発予防を、弁証法的行動療法は境界性パーソナリティ症の治療を主な目的とする。"],"s":[9,2]},{"n":"家族療法と地域での支援","p":["家族療法は問題を家族システムの相互作用から捉え、問題を示す人をIP（患者とみなされた人）と呼ぶ。","構造派（ミニューチン）、戦略派、ミラノ派、多世代派（ボーエン）などの学派がある。","集団療法では、悩みが自分だけではないと知る普遍性の体験や相互の支え合いが変化を促し、自助グループもこれを生かす。","キャプランは予防を、発生を防ぐ一次予防、早期発見・対応の二次予防、再発防止と社会復帰の三次予防に分けた。","動機づけ面接は、変化に対する両価的な気持ちを探り、本人の中にある変化への動機を引き出す協働的な面接法である。"],"s":[0]},{"n":"心理療法の効果研究","p":["エビデンスに基づく実践とは、最良の研究知見と臨床的専門性を、患者の特性や価値観と統合して判断することである。","多くのメタ分析で心理療法は無治療より明らかに有効であり、療法の種類による差は小さいとの結果も多い。","治療同盟（作業同盟）などの共通要因が、療法の違いを越えて効果に寄与するという立場がある。","うつ病の比較研究では、反応率がCBT43%、薬物50%、プラセボ25%と報告された（デルビースら、2005年）。","うつ病ではCBTと薬物療法の効果は全体として同程度で、どちらを選ぶかは障害や本人の事情による。"],"s":[9,2]},{"n":"心理アセスメントの基本","p":["アセスメントは面接・行動観察・心理検査などで情報を集め、生物心理社会モデルに沿って統合的に理解する過程である。","目的に応じて複数の検査を組み合わせるテストバッテリーを組み、各検査の長所と限界を補い合う。","ケース・フォーミュレーションは、問題の成り立ちと維持要因について仮説を立て、支援計画に結びつけるものである。","検査の前にインフォームド・コンセントを得て、結果は受け手が理解できる言葉でフィードバックする。","検査は標準化された手続きで実施し、信頼性・妥当性・規準集団を確認したうえで解釈する。"],"s":[0,14]},{"n":"質問紙法と作業検査法","p":["MMPIは1943年に公刊された。MMPI-2（1989年）は567項目、MMPI-2-RF（2008年）は338項目からなる。","MMPIは10の臨床尺度に加え、L（虚偽）尺度などの妥当性尺度で回答の歪みを検出する。","YG性格検査はギルフォードの理論をもとに矢田部達郎らが作成し、120項目・12尺度からなる。","質問紙法は実施と採点が容易で客観的だが、意図的な歪曲や社会的望ましさの影響を受けやすい。","内田クレペリン精神検査は、1桁の数字の連続加算を休憩をはさみ前半・後半各15分行い、作業曲線から特徴をみる。"],"s":[11,0]},{"n":"投影法と描画法","p":["ロールシャッハ・テスト（1921年）は10枚のインクブロットを用い、エクスナーの包括システムで標準化が進んだ。","TAT（マレーとモーガン、1930年代）は曖昧な絵から物語を作らせ、欲求−圧力の観点などから解釈する。","P-Fスタディ（ローゼンツァイク）は欲求不満場面の絵への応答から、アグレッションの方向と型を評価する。","文章完成法（SCT）は書き出しに続けて文を完成させ、バウムテスト（コッホ）は実のなる木を描かせる。","投影法は意識的な歪曲を受けにくい一方、信頼性・妥当性は質問紙法より低く、文化的な偏りも指摘される。"],"s":[11]},{"n":"神経心理学的検査と発達検査","p":["MMSEは30点満点の認知機能検査で、日本版MMSE-Jでは23点以下で認知症、24〜27点で軽度認知障害が疑われる。","改訂長谷川式簡易知能評価スケール（HDS-R）は30点満点で、20点以下で認知症が疑われる。","ウィスコンシン・カード分類検査やトレイルメイキング検査は、遂行機能や注意の評価に用いられる。","新版K式発達検査は、姿勢・運動、認知・適応、言語・社会の3領域で発達年齢と発達指数を求める。","適応行動の評価にはヴァインランド適応行動尺度などが用いられ、知的発達症の診断にも使われる。"],"s":[14,0]}]}]},{"id":"behecon","name":"行動経済学","full":"行動経済学（Behavioral Economics）","group":"教養・専門","desc":"心理学の知見を取り入れ、人間の実際の経済的意思決定を説明する経済学","asOf":"2026年11月時点で確認できた研究・公式資料に基づく","aliases":["行動経済","Behavioral Economics","Behavioural Economics"],"sources":[{"t":"NobelPrize.org: The Prize in Economic Sciences 2002 プレスリリース（カーネマン、スミス）","u":"https://www.nobelprize.org/prizes/economic-sciences/2002/press-release/"},{"t":"スウェーデン王立科学アカデミー: Richard H. Thaler: Integrating Economics with Psychology（2017年経済学賞の科学的背景）","u":"https://www.kva.se/app/uploads/2017/10/scibackeken17.pdf"},{"t":"Kahneman & Tversky (1979) Prospect Theory: An Analysis of Decision under Risk, Econometrica 47(2)","u":"https://econreadinggroup.github.io/assets/Kahneman%20%26%20Tversky%20(1979,%20ECTA).pdf"},{"t":"Tversky & Kahneman (1974) Judgment under Uncertainty: Heuristics and Biases, Science 185","u":"https://sites.stat.washington.edu/peter/498.Sp16/Tversky.pdf"},{"t":"Tversky & Kahneman (1992) Advances in Prospect Theory, Journal of Risk and Uncertainty 5","u":"https://psych.fullerton.edu/mbirnbaum/psych466/articles/Tversky_Kahneman_JRU_92.pdf"},{"t":"Brown, Imai, Vieider & Camerer (2024) Meta-analysis of Empirical Estimates of Loss Aversion, JEL 62(2)","u":"https://www.aeaweb.org/doi/10.1257/jel.20221698"},{"t":"Charness, Karni & Levin (2010) On the conjunction fallacy in probability judgment, Games and Economic Behavior 68","u":"https://www.umass.edu/preferen/You%20Must%20Read%20This/Charness-Karni-Levin-Linda.pdf"},{"t":"Herbert A. Simon ノーベル記念講演（1978）Rational Decision-Making in Business Organizations","u":"https://www.nobelprize.org/uploads/2018/06/simon-lecture.pdf"},{"t":"Mark J. Machina: Non-Expected Utility Theory（International Encyclopedia of the Social Sciences）","u":"https://www.encyclopedia.com/social-sciences/applied-and-social-sciences-magazines/non-expected-utility-theory"},{"t":"Starmer & Sugden (2025) What Daniel Kahneman Thought about Economics, Environmental and Resource Economics 88","u":"https://link.springer.com/article/10.1007/s10640-025-01031-8"},{"t":"Wikipedia: Nudge theory","u":"https://en.wikipedia.org/wiki/Nudge_theory"},{"t":"Wikipedia: Replication crisis","u":"https://en.wikipedia.org/wiki/Replicability_crisis"},{"t":"Wikipedia: Ultimatum game","u":"https://en.wikipedia.org/wiki/Ultimatum_game"},{"t":"Wikipedia: Neuroeconomics","u":"https://en.wikipedia.org/wiki/Neuroeconomics"},{"t":"Wikipedia: Ego depletion","u":"https://en.wikipedia.org/wiki/Ego_depletion"}],"units":[{"u":"伝統的経済学と限定合理性","items":[{"n":"合理的経済人（ホモ・エコノミクス）","p":["一貫して合理的で、狭い自己利益を最適に追求する主体という経済モデル上の人間像。安定した選好と高度な計算能力を仮定する。","原型はJ・S・ミルの1836年の論考で、人間を富を欲する存在として抽象化した。用語自体はミルの批判者が19世紀末に使い始めた。","英語のeconomic manはイングラム（1888）に、ラテン語形はパレート（1906）に遡るとされる。","ここでの「合理的」は目標を最小の費用で追求するという意味で、目標そのものの倫理的な善し悪しは問わない。","行動経済学は、限定合理性・社会的選好・不安定な選好の観点から、この仮定を実験で問い直した。"]},{"n":"期待効用理論","p":["各結果の効用を確率で重み付けした期待値でくじを評価する理論。D・ベルヌーイが1738年にサンクトペテルブルクのパラドックスの解として提案した。","のちに客観的・主観的な不確実性の両方について公理化された。中心的な経験的公理は独立性公理である。","独立性公理：2つのくじに同じ要素を同じ確率で混ぜても、くじの間の選好順序は変わらないという条件。","合理的なリスク選好の本質として規範的に支持される一方、記述理論としては実験で系統的な違反が見つかった。","プロスペクト理論（1979）は、記述モデルとしての期待効用理論への批判と、それに代わる理論として提示された。"],"s":[8,2]},{"n":"アレのパラドックス","p":["モーリス・アレが1952年にパリの国際会議で示し、1953年にEconometrica誌（21巻4号）に発表した選択問題。","1A：100万ドルを確実に得る。1B：89%で100万ドル、10%で500万ドル、1%で0。多くの人が1Aを選ぶ。","2A：11%で100万ドル。2B：10%で500万ドル。多くの人が2Bを選び、1Aとの組み合わせは独立性公理に反する。","両問の差は「89%で100万ドル」という共通の結果を入れ替えただけで、共通結果効果の代表例とされる。実際の金銭を賭けた実験でも再現された。","カーネマンとトヴェルスキー（1979）は同型の問題で、確実な結果を過大に好む「確実性効果」として整理した。"],"s":[8,2]},{"n":"エルスバーグのパラドックス","p":["ダニエル・エルスバーグが1961年にQJE誌で発表。壺に赤玉30個と、比率不明の黒玉・黄玉が計60個、合計90個入っている。","「赤なら100ドル」と「黒なら100ドル」では赤を、「赤か黄なら」と「黒か黄なら」では黒か黄を選ぶ人が多い。","黒と黄にどんな確率を割り当ててもこの組み合わせは説明できず、サヴェッジ流の主観的期待効用と矛盾する。","確率の分からない状況そのものを嫌う「曖昧さ回避」を示す。ケインズ『確率論』（1921）にも類似の議論がある。","説明モデルとしてギルボアとシュマイドラー（1989）のマキシミン期待効用やショケ期待効用がある。"],"s":[8]},{"n":"非期待効用理論の展開","p":["アレ型の違反は、独立性公理の系統的な違反の少なくとも2つの型の特殊例と位置づけられ、代替理論の開発を促した。","1950年代のエドワーズの確率加重モデル（のちのプロスペクト理論の原型）は、不自然な予測を生む問題を抱えていた。","クイギン（1982）の順位依存期待効用は、結果の順位に応じて確率を変換することでその問題を避け、アレ型の違反に適合する。","マキシミン期待効用やショケ期待効用は、アレ型とエルスバーグ型の両方の逸脱を扱える。","累積プロスペクト理論（1992）も順位依存の考え方を取り入れ、確率優越を満たすよう改良された。"],"s":[8,4]},{"n":"限定合理性","p":["サイモンが提唱。情報の不完全さと計算能力の限界のため、人は経済学が想定する全知の最適化を行えないとする考え方。","サイモン自身、初期には「全知に届かない合理性」という残余カテゴリーとして定義したと1978年の講演で述べた。","のちに、限られた計算と不完全な情報のもとでの選択を積極的に記述する理論として位置づけ直した。","代表論文に「合理的選択の行動モデル」（1955, QJE）がある。全知で利潤最大化する企業家という古典的な企業像を退けた。"],"s":[7]},{"n":"満足化（サティスファイシング）","p":["最適な選択肢ではなく、願望水準を満たす「十分によい」選択肢が見つかった時点で探索をやめる選択の仕方。","satisfy（満足させる）とsuffice（足りる）の合成語。サイモンが1956年の論文（Psychological Review）で導入した。","選択肢が初めから与えられない現実では探索が必要であり、限定合理性の理論には探索の理論が要るとサイモンは論じた。","願望水準は固定されず、よい選択肢が多い恵まれた環境では上がり、厳しい環境では下がる。","サイアートとマーチ『企業の行動理論』（1963）が、願望水準の考えを企業理論に発展させた。"],"s":[7]},{"n":"手続き的合理性と組織","p":["サイモンは、結果の最適性を問う「実質的合理性」（経済学）と、判断過程の合理性を問う「手続き的合理性」（心理学）を区別した。","選択は問題の客観的性質だけでなく、用いられるヒューリスティックな過程に依存するため、過程のモデルが不可欠だとした。","『経営行動』（1947）では、組織を、複雑さと不確実性のもとで人間の理解力・計算力の限界に対処する仕組みとして捉えた。","組織の目標を具体的な行動に結び付けられない時は、下位目標を基準に判断が行われると論じた。"],"s":[7]}]},{"u":"判断のヒューリスティクス","items":[{"n":"ヒューリスティクスとバイアス研究","p":["トヴェルスキーとカーネマン（1974, Science 185巻）は、不確実な状況での判断が少数のヒューリスティクスに頼ることを示した。","取り上げたのは代表性、利用可能性、アンカリングと調整の3つ。普段は役に立つが、系統的で予測可能な誤りを生む。","ここでのバイアスはランダムな誤差ではなく、一定の方向に偏る系統的なずれを指す。","2002年のノーベル賞では、人の判断が確率の基本原理から系統的に外れる近道に頼ることを示した点が評価された。"],"s":[3,0]},{"n":"代表性ヒューリスティック","p":["対象がある類型にどれだけ似ているか（代表的か）で確率を判断する方法。類似度は本来、確率を決める要因の一部にすぎない。","病院問題：1日約45人生まれる大病院と約15人の小病院で、男児が60%を超える日が多いのはどちらかを問う。","回答者数は大病院21・小病院21・ほぼ同じ53。標本が小さいほどばらつくので正解は小病院だが、標本の大きさが無視された。","予測可能性への無感応：教育実習の授業の評価と、5年後の教師としての成功の予測がほぼ同じ値になり、予測の不確かさが無視された。","入力が類型に合うほど、また互いに似た情報が重なるほど確信が強まる「妥当性の錯覚」も生じる。"],"s":[3]},{"n":"偶然の誤解と少数の法則","p":["人は短い系列にも母集団の性質が表れると期待し、表裏表裏裏表を表表表裏裏裏よりランダムらしいと感じる。","ルーレットで赤が続くと次は黒が「出るはず」と考えるのが賭博者の誤謬。偶然は自己修正的な過程ではない。","研究者も小標本の結果を過信する「少数の法則」を信じがちで、標本数が少なすぎる研究計画を立てる原因になる。"],"s":[3]},{"n":"平均への回帰の誤解","p":["極端な成績の次は平均に近づくという統計的な回帰を、人はしばしば因果関係で説明してしまう。","飛行教官は「上手な着陸を褒めると次は悪くなり、下手な着陸を叱ると次は良くなる」と結論したが、回帰で説明できる現象だった。","その結果、褒めることの効果を過小に、叱ることの効果を過大に評価する誤った教訓が生まれやすい。"],"s":[3]},{"n":"基準率の無視","p":["個別の情報が与えられると、事前確率（基準率）を十分に考慮しなくなる傾向。代表性ヒューリスティックの帰結とされる。","技師70人・弁護士30人の群と、30人・70人の群で、人物の描写から技師である確率を判断させても、答えはほぼ同じだった。","ベイズの定理に従えば、両条件のオッズの比は描写ごとに（0.7/0.3）²≒5.44倍異なるはずだった。","何の手がかりもない描写（ディック）では、基準率にかかわらず技師である確率を0.5と答えた。"],"s":[3]},{"n":"連言錯誤（リンダ問題）","p":["「AかつB」の確率を、その構成要素Aだけの確率より高く判断する誤り。確率の基本法則（連言の確率は各要素以下）に反する。","リンダ問題：社会問題に関心の強い女性リンダについて「銀行員でフェミニスト運動に参加」を「銀行員」より確からしいと判断する。","トヴェルスキーとカーネマン（1983）は回答者の85%がこの誤りを犯したと報告した。","チャーネスら（2010）の追試では、報酬なしの個人で58.1%、正答に4ドルの報酬を付けると33.0%に下がった。","相談を認めるとさらに減り、報酬付きでは2人組13.2%、3人組10.4%だった。著者らは経済分析への影響は小さいと結論した。"],"s":[6]},{"n":"利用可能性ヒューリスティック","p":["事例の思い出しやすさ・想像しやすさで頻度や確率を判断する方法。想起の容易さは実際の頻度以外の要因にも左右される。","有名人を多く含む性別の名簿を聞かせると、実際の人数と関係なく、その性別の人の方が多かったと判断された。","英語ではrで始まる単語の方が3文字目がrの単語より多いと判断されがちだが、実際は後者の方が多い。","10人から2人の委員会と8人の委員会を作る組み合わせ数の推定中央値は70と20だった。正解はどちらも45。","錯誤相関：もっともらしい連想（疑い深さと絵の中の奇妙な目など）があると、両者の共起頻度が過大に見積もられる。"],"s":[3]},{"n":"アンカリングと調整","p":["初期値（アンカー）から調整して推定する際、調整が不十分で推定値がアンカーに引き寄せられる現象。","運命の輪で出た10か65を見た後、国連加盟国に占めるアフリカ諸国の割合の推定中央値は25%と45%に分かれた。","8×7×6×…×1を短時間で推定させると中央値2250、1×2×…×8では512。正解は40320で、どちらも大きく過小だった。","連言事象（全段階の成功が必要な計画）の確率は過大に、選言事象（どこか1つの故障で止まる系）の確率は過小に評価される。","アンカーが明らかに無関係な数値であっても、判断に影響する点が特徴である。"],"s":[3]}]},{"u":"判断のバイアス","items":[{"n":"過信","p":["ムーアとヒーリー（2008）は過信を、自分の能力の過大評価、他者と比べた過大評価、自分の判断の精度の過大評価の3つに整理した。","スヴェンソン（1981）の調査では、米国の運転者の93%が自分の運転は中央値より上手いと評価した。","トヴェルスキーとカーネマン（1974）でも、主観的な1〜99パーセンタイル区間の外に真値が落ちる割合は約30%だった。","易しい課題では他者より上だと思いやすいが、難しい課題ではこれが逆転することがある（クルーガー1999）。"],"s":[3]},{"n":"計画錯誤","p":["作業の所要時間や費用を、過去の経験に反して楽観的に見積もる傾向。カーネマンとトヴェルスキーが1979年に提唱した。","ビューラーら（1994）：心理学の学生37人の卒業論文の予測完了日数は平均33.9日、実際は平均55.5日だった。","「最悪の場合」の予測でさえ平均48.6日で実際より短く、予測した期間内に終えた学生は約30%だった。","対策として、似た事例の実績の分布から予測する「参照クラス予測」がある。","長く複雑な課題で強く表れ、単純な課題では消えたり逆転したりする。"]},{"n":"後知恵バイアス","p":["結果を知った後に、その出来事が実際以上に予測可能だったと感じる傾向。「最初から分かっていた」効果、忍び寄る決定論とも呼ぶ。","フィッシュホフ（1975）は、4通りの結末のうち「正解」を教えられた参加者が、その結末の確率を高く評価することを示した。","フィッシュホフとベイス（1975）では、ニクソンの訪中・訪ソの結果を知った後、実現した出来事への自分の事前予測を過大に思い出した。","医療事故の評価や裁判で、当事者に過度に高い予見可能性を求める判断につながりうる。","完全には除去できず、別の結果がありえた理由を考えさせる方法が低減に有効とされる。"]},{"n":"確証バイアス","p":["既存の信念を支持する方向に情報を探し、解釈し、記憶する傾向。英国の心理学者ピーター・ウェイソンの実験で注目された。","2-4-6課題（ウェイソン1960）：真の規則は「増加する3つの数」だが、参加者は仮説に合う例ばかり試し、狭すぎる規則を答えた。","クレイマンとハ（1987）は、これを仮説に合う事例で確かめる「正事例検証方略」として再解釈した。","ロード、ロス、レッパー（1979）では、死刑の賛成派も反対派も、自説に反する架空の研究をより弱いと評価した。","投資判断や臨床診断で、初期の判断に固執し反証を無視する原因になる。"]},{"n":"ヒューリスティクス研究への批判","p":["古典的な知見の多くは無報酬の仮想的な質問によるもので、経済学者はインセンティブがあれば誤りが減るかを問題にしてきた。","リンダ問題の誤答率は報酬と相談で大きく下がり、チャーネスら（2010）は経済分析への影響は小さいと結論した。","セイラーらの研究でも初期は仮想質問が中心だったが、のちに実際の金銭を伴う市場実験（KKT 1990など）で検証された。"],"s":[6,1]}]},{"u":"プロスペクト理論","items":[{"n":"プロスペクト理論の成立","p":["カーネマンとトヴェルスキーが1979年にEconometrica誌（47巻2号）で発表した、リスク下の意思決定の記述理論。","期待効用理論が記述モデルとして失敗することを示し、それに代わるモデルとして提案された。","主な実験は、イスラエルの学生と大学教員に仮想的な賭け（イスラエル・ポンド建て）を選ばせる形式で行われた。","一部の問題はストックホルム大学とミシガン大学の集団でも試され、結果はほぼ同じだった。","カーネマン自身は、この理論を合理的選択の規範ではなく「純粋に記述的」なものと位置づけた。"],"s":[2,9]},{"n":"確実性効果","p":["確実な結果を、単に確からしい結果より過大に重視する傾向。アレのパラドックスを一般化した現象。","問題3（N=95）：4000を確率0.8で得るか、3000を確実に得るか。80%が確実な3000を選んだ。","問題4：4000を確率0.2か、3000を確率0.25か。65%が4000の方を選び、確率を同じ比で縮めると選好が逆転した。","アレ型の問題1・2（N=72）では、回答者の61%が両問とも多数派の（期待効用理論と矛盾する）選択をした。","3000を0.90か6000を0.45かでは86%が前者を、確率を0.002と0.001にすると73%が6000の方を選んだ。"],"s":[2]},{"n":"反射効果","p":["利得の問題の符号を反転させて損失の問題にすると、選好が鏡に映したように反転する現象。","確実な−3000と、確率0.8の−4000では92%が賭けを選び、損失の領域ではリスク追求的になった。","−3000を確率0.002か、−6000を確率0.001かでは70%が前者を選び、利得の場合（73%が6000）と逆になった。","利得ではリスク回避、損失ではリスク追求という組み合わせは、凹型の効用関数を持つ期待効用理論では説明しにくい。"],"s":[2]},{"n":"孤立効果と編集段階","p":["選択肢に共通する要素を捨て、異なる部分だけで比較する傾向を孤立効果と呼ぶ。分解の仕方によって選好が変わる。","2段階ゲーム（問題10、141人）では第2段階だけを見て78%が確実な3000を選び、同値な問題4の多数派と逆になった。","1000のボーナス後は84%が「確実に500得る」を選び、2000のボーナス後は69%が「50%で1000失う」賭けを選んだ。最終資産は同じ。","評価の前に「編集」段階を仮定し、符号化・結合・分離・相殺・単純化・優越の検出という操作を挙げた。","1992年の累積版では編集段階が削られたが、カーネマンは元の版を好んでいたとされる。"],"s":[2,9]},{"n":"価値関数と参照点","p":["価値は最終的な資産額ではなく、参照点からの利得と損失に対して定義される。","利得では凹（リスク回避的）、損失では概ね凸（リスク追求的）のS字型で、参照点で傾きが最も急になる。","参照点から遠ざかるほど変化の影響が小さくなる性質を「感応度逓減」と呼ぶ。","過去の損失を受け入れていないと選択が損失として符号化され、普段なら受け入れない賭けを選ぶリスク追求が起こりうる。","例：2000失った直後の人は、選択を「確率0.5で−2000か、確実に−1000か」と捉え、賭けに傾きやすい。"],"s":[2,4]},{"n":"損失回避","p":["同じ大きさなら、損失の影響が利得の影響より大きいという性質。価値関数は損失側で傾きが急になる。","カーネマンの定義では「損失への反応は、対応する利得への反応より強い」。","トヴェルスキーとカーネマン（1991）は、持ち物を手放したがらないなど、リスクのない選択にも損失回避を拡張した。","保有効果、現状維持バイアス、ディスポジション効果、株式プレミアムパズルなどの説明に広く使われる。"],"s":[2,4]},{"n":"損失回避係数の推定","p":["損失回避係数λは、損失が同額の利得の何倍に重く感じられるかを表す。","トヴェルスキーとカーネマン（1992）の推定値（中央値）はλ=2.25で、「損失は利得の約2倍」の根拠としてよく引かれる。","ブラウン、今井、ヴィーダー、カメラー（2024, JEL）は150論文・607推定値をメタ分析し、平均λ=1.955とした。","95%信用区間は1.820〜2.102。生の推定値は平均1.97・中央値1.69で、ばらつきが大きい。","フィールド実験はラボ実験より、くじの選択課題は調査より高い推定値になる傾向があった。出版バイアスは結論を覆すほどではないとした。"],"s":[4,5]},{"n":"損失回避への批判","p":["ギャル（2006）とギャルとラッカー（2018）は、保有効果や現状維持は損失回避より心理的な慣性で説明できると主張した。","少額の賭けでは損失回避が現れないことがあると報告されている。","イェキアムは損失回避の一般性に疑問を呈し、イェキアムとツァイフ（2025）は「損失回避は頑健でない」とする再メタ分析を発表した。","一方でムルクヴァらは5つの標本で損失回避を再現しており、大きさと適用範囲をめぐる論争が続いている。"]},{"n":"確率加重","p":["選択肢は客観確率pそのものではなく、決定加重π(p)で評価される。小さな確率は過大に重み付けされる。","劣確実性：π(p)+π(1−p)<1が成り立ち、確実な場合に比べて不確実な見込み全体が割り引かれる。","劣比例性：確率の比が同じなら、確率が小さいほど加重の比は1に近づく。問題3・4のような選好逆転を説明する。","加重関数は中間域ではかなり平坦で、0と1の近くで急に変化する形が想定された。","小確率の過大評価は、宝くじと保険がともに魅力的に見えることの一因とされた。"],"s":[2]},{"n":"リスク態度の4分割パターン","p":["高い確率の利得ではリスク回避、高い確率の損失ではリスク追求となる。","低い確率の利得ではリスク追求（宝くじ）、低い確率の損失ではリスク回避（保険）となる。","価値関数の感応度逓減と、0付近で凹・1付近で凸となる確率加重関数の組み合わせから生じる。","1979年の論文では、一定確率でしか補償されない「確率的保険」を80%が拒否し、凹型効用の期待効用理論の予測と逆になった。"],"s":[4,2]},{"n":"累積プロスペクト理論","p":["トヴェルスキーとカーネマンが1992年にJournal of Risk and Uncertainty（5巻）で発表した改訂版。","個々の確率ではなく累積分布を変換する順位依存の決定加重を採用し、確率優越を常に満たすようにした。","確率既知のリスクだけでなく不確実性下の見込みや任意個の結果に適用でき、利得と損失で別の加重関数を許す。","バークレーとスタンフォードの大学院生25人（報酬は定額25ドル）の実験から、価値関数の指数は利得・損失とも0.88と推定された。","損失回避係数λ=2.25、確率加重のパラメータは利得0.61、損失0.69と推定された。"],"s":[4,9]}]},{"u":"フレーミングと保有効果","items":[{"n":"フレーミング効果","p":["論理的に同じ選択肢でも、表現の枠組み（フレーム）の違いで選好が変わる現象。表現によらず選好は一定という前提に反する。","トヴェルスキーとカーネマン（1981, Science）の「アジアの病気」問題は、同じ対策を「助かる人数」か「死ぬ人数」かで示すと選好が逆転する例。","利得として表現すると確実な案が、損失として表現するとリスクのある案が好まれ、参照点の移動で説明される。","治療の成績を「生存率90%」で示すか「死亡率10%」で示すかで受け止め方が変わる例もよく使われる。","文言の表面的な変更で生死に関わる選択が変わるべきではない、という点で誤りと見なされる。"],"s":[9]},{"n":"保有効果","p":["自分が所有する物を、所有していない同じ物より高く評価する傾向。セイラーが1980年に命名した。","カーネマン、クネッチ、セイラー（1990）：無作為にマグカップを配ると、売り手の受取意思額の中央値は買い手の支払意思額の約2倍だった。","無作為に配ったなら約半数が取引されるはずだが、実際に持ち主が変わったマグは半数を大きく下回った。","手放すことは損失、手に入れることは利得として評価されるため、損失回避で説明される。","セイラー（1980）：死亡リスク0.001を取り除くのに200ドルしか払わない人が、同じリスクを負う対価には1万ドルを求める。"],"s":[1]},{"n":"保有効果をめぐる論争","p":["タンセルとハミット（2014）のメタ分析は、76研究・337推定値から受取意思額と支払意思額の比の幾何平均を3.28とした。","プロットとツァイラー（2005）は、両者の差は被験者の誤解を招く実験設計から生じると反論した。","モアウェッジら（2009）は、損失回避ではなく所有そのものが保有効果を生むと主張した。","心理的慣性（ギャル）や参照価格による説明もあり、メカニズムについては異論が多い。"],"s":[1]},{"n":"現状維持バイアス","p":["現状（何もしないこと）を、他の選択肢より過度に選びやすい傾向。サミュエルソンとゼックハウザー（1988）が実証した。","相続した資金の運用先を選ぶ仮想課題で、ある選択肢を「現状」として示すと、その選択肢の人気が大きく上がった。","電力会社の顧客調査では、高信頼・高料金の顧客の60.2%、低信頼・低料金の顧客の58.3%が自分の現状のプランを選んだ。","自動車保険の既定がNJ州は安価型、PA州は高価型で、既定から変更したのはNJで20%、PAで25%にとどまった（ジョンソンら1993）。","原因に損失回避、後悔回避、取引費用、心理的慣性などがある。リトフとバロン（1992）は不作為バイアスとの関係を論じた。"]},{"n":"サンクコスト効果","p":["すでに支払って回収できない費用（サンクコスト）が、将来の選択に影響してしまう現象。合理的には将来の費用と便益だけで判断すべき。","セイラー（1980）はバスケットボールの観戦券の例で、払った代金が悪天候でも観戦に出かける判断を左右することを論じた。","心の会計の観点では、使わずに終えると「勘定」が損失のまま閉じるため、それを避けようとすると解釈される。","損失の確定を避けたい心理は、値下がり株を売れないディスポジション効果とも共通する。"],"s":[1]}]},{"u":"心の会計","items":[{"n":"心の会計とは","p":["人が経済的な結果を符号化・分類・評価する暗黙の会計の仕組み。セイラー（1985, 1999）が体系化した。","家計を請求書用・休暇用などの勘定に分け、勘定間の移動を制限するため、貯蓄があるのに高金利のローンを使うことがある。","1000クローナの時計で100クローナ得するためなら遠くの店まで行くが、1万クローナの時計では行かない。額でなく比率で評価する例。","15ドルの計算機が5ドル安くなるなら20分運転するが、高価な品で同じ5ドルなら運転しない、という同型の例も知られる。","支出は通常、予算期間と費目という2つの勘定の中で評価される。"],"s":[1]},{"n":"お金の非代替性","p":["標準理論ではお金はどの勘定でも同じ（代替可能）だが、実際は出所や用途のラベルで扱いが変わる。","ヘイスティングスとシャピロ（2013）：2008年にガソリン価格が約50%下落すると、ハイオクへの切り替えが標準モデルの予測の14倍になった。","米国の食料支援SNAPの給付は、他の所得と代替的には扱われないことが示された（ヘイスティングスとシャピロ2018）。","セイラー（1990）はJEPの「アノマリー」欄で、貯蓄・代替可能性・心の勘定の問題を論じた。"],"s":[1]},{"n":"快楽的編集（分離と統合）","p":["複数の利得は別々に、複数の損失はまとめて評価する方が好まれる。価値関数の利得側の凹性と損失側の凸性から導かれる。","大きな利得と小さな損失が組み合わさる場合は、統合して評価する方が好まれる。","小さな利得と大きな損失の場合は分離する方がよく、「不幸中の幸い（シルバーライニング）」効果と呼ばれる。"]},{"n":"取引効用","p":["購入の総効用は、財そのものから得る獲得効用と、取引の「お得さ」から得る取引効用の和とされる。","取引効用は実際の価格と参照価格（公正と感じる価格）の差で決まり、お得な取引は効用を加え、割高な取引は効用を減らす。","財の価値は同じでも、値引きの見せ方や価格の比較対象によって購買意欲が変わることを説明する。"],"s":[1]},{"n":"ハウスマネー効果と損益分岐効果","p":["直前に利益を得た人は、その後により大きなリスクを取りやすい。利益が別勘定に入り、損失の痛みが和らぐためとされる。","セイラーとジョンソン（1990）が示し、損失の領域では損を取り戻せる賭けを好む「損益分岐効果」も報告した。","ポストら（2008）は、高額賞金のテレビ番組「ディール・オア・ノー・ディール」のデータで両方の効果を確認した。"],"s":[1]},{"n":"支払いの痛みとクレジットカード","p":["支払いには「支払いの痛み」という負の感情が伴い、その強さは支出額とそれが減らす勘定の大きさとの関係で決まる（プレレクとローウェンスタイン1998）。","クレジットカード払いは支払いが先送りされ、大きな請求にまとめられるため、支払意思額を高める（プレレクとシメスター2001）。","支払いと消費の時点が離れるほど、消費の際に費用を意識しにくくなる。"]},{"n":"タクシー運転手と所得目標","p":["カメラーら（1997）：ニューヨークのタクシー運転手は1日の所得目標を持ち、届かないことを損失と感じているようだった。","そのため、稼ぎやすい日に早く切り上げ、稼ぎにくい日に長く働くという、標準理論と逆の行動が見られた。","ファーバー（2005, 2008）は別のデータを用いてこの結論に異議を唱えた。","クロフォードとメン（2011）は日単位の参照点依存選好を支持し、フェアとゲッテ（2007）も自転車便の実験で支持した。"],"s":[1]}]},{"u":"時間選好と自己制御","items":[{"n":"指数割引と双曲割引","p":["標準理論の指数割引は単位期間あたりの割引率が一定で、時間がたっても選好の順序は変わらない。","双曲割引は近い将来ほど割引が急で、遠い将来では緩やかになるモデル。時間とともに選好が変わる時間不整合を生む。","エインズリーは、小さく早い報酬と大きく遅い報酬の選択を、双曲線型の価値と遅延の関係で記述した。","選好の逆転は最初にラットやハトの実験で見つかった（エインズリー1974など）。"]},{"n":"セイラー（1981）の割引実験","p":["被験者は「今の15ドル」を「3か月後の30ドル」「1年後の60ドル」「3年後の100ドル」とそれぞれ同等と答えた。","これは年率の割引率が277%、139%、63%と、期間が長いほど下がることを意味する。","利得は損失より、少額は高額より強く割り引かれるという結果も得られた。","ストロッツ（1956）の時間不整合の仮説に対し、人間の双曲割引を初めて実験で示した研究とされる。"],"s":[1]},{"n":"選好の逆転","p":["エインズリーとヘンデル（1983）：多くの人が「今の50ドル」を「6か月後の100ドル」より好むが、3か月後50ドルと9か月後100ドルでは後者を好む。","どちらの報酬も遠い時は大きく遅い方を選べるのに、片方が目前に迫ると小さく早い方に乗り換える。","3か月後の50ドルを選ぶ人も、12か月後50ドルと18か月後100ドルでは後者を選び、即時性の興奮だけでは説明できない。","リード（2001）は、遅延を細かく区切るほど割引が大きくなる「劣加法的割引」でも双曲的な形が生じると指摘した。"]},{"n":"準双曲割引（β-δモデル）","p":["現在と将来の間にだけ追加の割引βを掛け、それ以降は一定率δで割り引くモデル。双曲割引を離散時間で近似する。","フェルプスとポラック（1968）が最初に考え、レイブソン（1997）が非流動的な資産と貯蓄の分析に使って広めた。","指数割引の扱いやすさを保ちながら、現在の報酬を特別に重視する性質（現在バイアス）を表現できる。","オドノヒューとラビン（1999, 2001）は先延ばしの分析にこのモデルを用いた。"],"s":[1]},{"n":"現在バイアス","p":["より大きな将来の報酬を待たずに、小さくても今すぐ得られる報酬を選ぶ傾向。双曲割引と関連する。","計画時には将来の自分が我慢すると考えていても、その時が来ると計画を破ってしまう。","先延ばし、貯蓄不足、ダイエットの挫折などの説明に使われる。","大学生のデータに頼りすぎて結論を急いでいるという、測定方法への批判もある（アンダーセンら2014）。"]},{"n":"プランナー・ドゥアーモデル","p":["セイラーとシェフリン（1981）は、近視眼的な「ドゥアー（実行者）」と長期志向の「プランナー（計画者）」の2つの自己を想定した。","プランナーは費用のかかる意志力を使うか、経験則などのルールを課してドゥアーを抑える。","自らをマストに縛らせて誘惑を断ったオデュッセウスの話は、短期の選択肢を取り除く解決策の典型とされる。","強制的な年金制度は総貯蓄を増やすという予測が導かれる。"],"s":[1]},{"n":"コミットメント装置","p":["将来の自分の選択肢を前もって制限したり高コストにしたりして、誘惑に対抗する仕組み。","古典的な例はクリスマス・クラブ（年末まで引き出せない積立）で、ストロッツとセイラーがともに取り上げた。","嫌酒薬アンタビュースや肥満治療薬、「空腹時に買い物をしない」といった規則もコミットメントの例に挙げられる。","非流動的な資産（すぐに現金化できない資産）を持つことも、貯蓄のコミットメントとして働く（レイブソン1997）。"],"s":[1]},{"n":"SMarTプラン","p":["セイラーとベナルツィが設計した「明日はもっと貯蓄しよう（Save More Tomorrow）」。将来の昇給分の一部を貯蓄に回すと今約束する。","増額は最初の昇給から始まり、昇給のたびに上限まで上がる。参加者はいつでも脱退できる。","手取りが減らない昇給時に増額するため、現在バイアスと名目の手取り減への抵抗を避けられる設計である。","3社で試され、一対一の面談を用いた方式が最も効果的だった。主要な要素は米国の2006年年金保護法に取り入れられた。","2011年までに米国で約410万人が自動増額プランに加入し、2013年までに年間貯蓄を76億ドル増やしたと推計された。"],"s":[1]}]},{"u":"社会的選好","items":[{"n":"公正さの感覚（KKT 1986）","p":["カーネマン、クネッチ、セイラー（1986）は、トロントとバンクーバーの電話調査で人々の公正さの判断を調べた。","大雪の翌朝に雪かき用シャベルを15ドルから20ドルに値上げすることを、82%が不公正と答えた。","競争相手のいない地域でスーパーが5%高い価格を付けることは、76%が不公正と評価した。","名目賃金の引き下げは、インフレ下で名目賃金を据え置く（実質では下がる）ことより不公正と見なされた。","公正さへの配慮は、不況期に企業が賃下げをためらう賃金の硬直性の説明にもなる。"],"s":[1]},{"n":"最後通牒ゲーム","p":["提案者が金額の分け方を提案し、応答者が受諾すれば提案どおりに分け、拒否すれば両者とも0になるゲーム。","1回限りなら、後ろ向き帰納法による部分ゲーム完全均衡は「最小額を提案し、応答者は必ず受諾」である。","ギュート、シュミットベルガー、シュヴァルツェ（1982）の実験が有名。KKT（1986）でも典型的な提案は半々に近く、約25%未満の取り分は多くが拒否された。","オーステルベークら（2004）の37研究のレビューでは、提案者は典型的にパイの約40%を提示した。","低い提案の拒否は、自分の取り分を犠牲にして不公正な相手を罰する行動と解釈される。"],"s":[12,1]},{"n":"最後通牒ゲームの文化差と賭け金","p":["ヘンリックらは15の小規模社会で実験し、提案や拒否の傾向が社会によって大きく異なることを示した。","贈与の慣習が強い社会では提案額が高く、応答者が高すぎる提案を拒否することもあった。","アンダーセンら（2011）のインドでの実験では、賭け金を大きくするほど拒否率がゼロに近づいた。","賭け金を上げても提案は半々に近づくという報告（インドネシアでの100ドルの実験など）もあり、結果は一様でない。"],"s":[12]},{"n":"独裁者ゲーム","p":["提案者（独裁者）が決めた分配を受け手が拒否できないゲーム。戦略的な配慮を除いた分配の好みを測る。","KKT（1986）はコーネル大学の学生に20ドルを「18対2」か「10対10」で分けさせ、76%が等分を選んだ。","エンゲル（2011）の129論文・616処置のメタ分析では、平均で28%を与え、36%は全額を取り、17%が等分した。","実験者にも誰がどう分けたか分からない二重匿名化（ホフマンら1994）では、全額を取る人が大きく増えた。","受け手から「取る」選択肢を加えると気前のよさが減り（リスト2007など）、利他性か評判への配慮かが議論される。"],"s":[1]},{"n":"第三者罰","p":["KKT（1986）の第2段階では、学生の74%が自分の取り分を1ドル減らしてでも、公正だった相手に報い、不公正だった相手を罰した。","自分が被害を受けていなくても、不公正な行為を罰するために費用を払う人がいることを示す。","この知見は、フェールとフィッシュバッハー（2004）の第三者罰の実験や、間接互恵性の研究につながった。"],"s":[1]},{"n":"公共財ゲーム","p":["各自が手持ちの一部を共同基金に拠出し、合計を何倍かにして全員に均等に配るゲーム。社会的ジレンマの典型。","自分の拠出1単位の戻りが1単位を下回る設定では、利己的なら全員が拠出0になるのがナッシュ均衡である。","実際の拠出は0〜100%と幅広く、繰り返すと拠出の割合は低下していくが、0まで落ちることはまれである。","フェールとゲヒター（2000, AER）は、拠出の少ない者を費用をかけて罰せる条件では拠出が高くなることを示した。","罰する能力と意志が協力を支えることは、オストロムら（1992）の実験でも示された。"],"s":[1]},{"n":"信頼ゲーム","p":["送り手が手持ちの一部を受け手に送ると実験者が3倍にし、受け手がそこからいくら返すかを決める逐次ゲーム。","バーグ、ディックハウト、マッケイブ（1995, Games and Economic Behavior）が「投資ゲーム」として導入した。","理論上の部分ゲーム完全均衡は「何も送らない」だが、実験でそうなることはまれである。","米国とスウェーデンの双生児研究（チェザリーニら2008）では、信頼ゲームでの行動に遺伝の影響が見られた。"]},{"n":"互恵性と贈与交換","p":["互恵性とは、親切には親切で、不親切には罰で応える傾向。相手の意図に反応する点で単純な利他性と異なる。","ラビン（1993）は、相手の意図を考慮する「公正さ均衡」の理論モデルを提案した。","アカロフ（1982）の「公正な賃金には努力で応える」という仮説を、フェール、キルヒシュタイガー、リードル（1993）が実験で支持した。","ニーズィーとリスト（2006, Econometrica）は、労働市場の贈与交換をフィールド実験で検証した。","チャーネスとラビン（2002）は、不平等回避と他の形の互恵性を実験で区別した。"],"s":[1]},{"n":"不平等回避モデル","p":["フェールとシュミット（1999）：効用は自分の利得から、相手より少ない不利な不平等（α）と多い有利な不平等（β）の不満を引いたもの。","最後通牒ゲームの低額提案の拒否や、公共財ゲームでのただ乗りへの罰を、1つのモデルで説明できる。","ボルトンとオッケンフェルス（2000）のERCモデルは、金額だけでなく相対的な取り分が行動を動かすとする。","ビンモアとシェイクド（2010）は、パラメータを事後的に選べるので標準理論より当てはまって当然だと批判した。","ブロスナンとドゥ・ヴァール（2003）は、オマキザルが不平等な報酬より何も受け取らないことを選ぶ例を報告した。"],"s":[1]}]},{"u":"ナッジと選択アーキテクチャ","items":[{"n":"ナッジとは","p":["選択肢を禁じたり経済的誘因を大きく変えたりせずに、人々の行動を予測可能な方向に変える選択環境の工夫。","セイラーとサンスティーン『ナッジ』（2008）で広まり、2021年に最終版（ファイナル・エディション）が出た。","既定値、表示の仕方、選択肢の並べ方、通知のタイミングなどを変えることが典型的な手段である。","英米にナッジ・ユニットが作られ、米国では2015年に行動科学の知見を政策に生かす大統領令が出された。"],"s":[10,1]},{"n":"リバタリアン・パターナリズム","p":["セイラーとサンスティーンが2003年に提唱（AER論文、シカゴ大学ロー・レビュー論文）。ナッジを支える規範的な立場。","選ぶ人を「本人自身の判断で」より良くする方向に選択に影響を与えることを目指す。","選択を拒否（オプトアウト）できるので自由主義的、本人の利益を目指すので温情主義的、と説明される。","「撞着語法ではない」とする論文に対し、ミッチェル（2004〜05）は「撞着語法だ」と反論した。","カメラーら（2003）は、非合理な人を助け合理的な人にはほとんど影響しない「非対称的パターナリズム」を提案した。"],"s":[1]},{"n":"選択アーキテクチャ","p":["選択肢を意思決定者にどう提示するかの設計。セイラーとサンスティーンの造語で、中立な提示方法は存在しないとされる。","道具として、デフォルト、誤りの予期、対応関係の理解、フィードバック、複雑な選択の構造化、インセンティブが挙げられる。","選択肢が多すぎると選ぶ意欲や満足が下がる「選択過剰」も論点で、アイエンガーとレッパー（2000）が知られる。","設計者と利用者の利害が一致しないと、利用者に不利な「ダークパターン」になりうる。"]},{"n":"デフォルト効果","p":["能動的に選ばなかった場合に適用される既定の選択肢が、結果を大きく左右する現象。","理由として、比較の手間、変更の取引費用、既定値が参照点となる損失回避、政策側の推奨という受け止めが挙げられる。","ジョンソンとゴールドスタイン（2003, Science）は、国ごとの臓器提供の意思表示率の差の主因は同意方式（オプトインかオプトアウトか）だと論じた。","ナッジに懐疑的な研究者も、デフォルトのように効果の大きいナッジがあることは認めている（サズィら2022）。"],"s":[10]},{"n":"年金の自動加入","p":["マドリアンとシェア（2001）：401(k)年金に自動加入を導入すると、加入率が49%から86%に上がった。","英国の全国的な年金貯蓄の自動加入では、脱退率は約12%にとどまった（セイラー2015）。","チェティら（2014）はデンマークのデータで、自動加入が他の貯蓄を押しのけず、負債も増やさないこと
