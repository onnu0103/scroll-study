<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学びタイムライン</title>
<style>
/* 言語化タイムラインと同じX風の1カラム。学習項目ごとのタブに、Claudeが書いたポストだけが流れる */
:root{
  --bg:#ffffff; --text:#0f1419; --sub:#536471; --line:#eff3f4; --raise:#f7f9f9;
  --accent:#1d9bf0; --like:#f91880; --rt:#00ba7c; --ng:#f4212e;
  --hover:rgba(15,20,25,.035); --veil:rgba(255,255,255,.86); --shade:rgba(0,0,0,.4);
  --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Segoe UI",Meiryo,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --text:#e7e9ea; --sub:#71767b; --line:#2f3336; --raise:#16181c;
    --hover:rgba(231,233,234,.035); --veil:rgba(0,0,0,.72); --shade:rgba(91,112,131,.4);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{overscroll-behavior-y:contain;margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
svg.i{width:18.75px;height:18.75px;fill:currentColor;flex:none}

.shell{display:flex;justify-content:center;min-height:100%}
.col{width:100%;max-width:600px;min-height:100vh;border-left:1px solid var(--line);border-right:1px solid var(--line);padding-bottom:72px}
.rail,.side{display:none}

/* ヘッダー */
.top{position:sticky;top:0;z-index:20;background:var(--veil);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;justify-content:space-between;height:53px;padding:0 16px}
.me{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#536471;color:#fff;font-size:13px;font-weight:700}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;letter-spacing:.02em}
.logo b{width:30px;height:30px;border-radius:9px;background:var(--text);color:var(--bg);display:grid;place-items:center;font-size:17px}
.topbar .ghost{width:32px}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;height:53px;padding:0 14px;color:var(--sub);font-weight:500;position:relative;white-space:nowrap}
.tab:hover{background:var(--hover)}
.tab[aria-selected="true"]{color:var(--text);font-weight:700}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:56px;max-width:80%;height:4px;border-radius:2px;background:var(--accent)}
.tab.add{flex:0 0 52px;font-size:22px;color:var(--accent);font-weight:400}
.topgen{display:flex;align-items:center;gap:8px;padding:6px 16px;border-top:1px solid var(--line);color:var(--sub);font-size:13px}
.topgen span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stopb{color:var(--accent);font-weight:700;font-size:13px;padding:4px 10px;border-radius:999px}
.stopb:hover{background:rgba(29,155,240,.1)}

/* 投稿 */
.post{border-bottom:1px solid var(--line);padding:12px 16px 4px;transition:background .15s}
.post:hover{background:var(--hover)}
.rtline{display:flex;align-items:center;gap:8px;color:var(--sub);font-size:13px;font-weight:700;margin:-2px 0 4px 28px}
.rtline svg{width:16px;height:16px}
.row{display:flex;gap:12px}
.avcol{display:flex;flex-direction:column;align-items:center;flex:none;width:40px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px;flex:none}
.av.emo{font-size:22px}
.tline{flex:1;width:2px;background:var(--line);margin-top:4px;min-height:12px}
.main{flex:1;min-width:0;padding-bottom:4px}
.meta{display:flex;align-items:center;gap:4px;min-width:0;white-space:nowrap;color:var(--sub)}
.nm{color:var(--text);font-weight:700;overflow:hidden;text-overflow:ellipsis}
.badge{width:17px;height:17px;fill:var(--accent);flex:none}
.hd{overflow:hidden;text-overflow:ellipsis;min-width:0}
.auto{border:1px solid var(--line);border-radius:4px;font-size:11px;padding:0 4px;line-height:16px;flex:none}
.txt{white-space:normal;overflow-wrap:anywhere;margin-top:2px}
.txt.clamp{display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden}
.more{color:var(--accent);margin-top:2px}
.tag{color:var(--accent)}
.g{text-decoration:underline dotted 1.5px;text-underline-offset:4px;text-decoration-color:var(--accent);cursor:pointer}
.extra{margin-top:10px}
.extra:empty{display:none}

.acts{display:flex;justify-content:space-between;max-width:425px;margin:8px 0 0 -8px;color:var(--sub)}
.act{display:flex;align-items:center;gap:0;font-size:13px;min-height:34px;padding:0 4px 0 0;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap}
.act .ic{display:grid;place-items:center;width:32px;height:32px;margin-right:-2px;border-radius:50%}
@media (max-width:360px){ .act.views span:last-child{display:none} }
.act.reply:hover,.act.views:hover,.act.share:hover,.act.bm:hover{color:var(--accent)}
.act.reply:hover .ic,.act.views:hover .ic,.act.share:hover .ic,.act.bm:hover .ic{background:rgba(29,155,240,.1)}
.act.rt:hover,.act.rt.on{color:var(--rt)} .act.rt:hover .ic{background:rgba(0,186,124,.1)}
.act.like:hover,.act.like.on{color:var(--like)} .act.like:hover .ic{background:rgba(249,24,128,.1)}
.act.bm.on{color:var(--accent)}
.act.like.on .ic{animation:pop .3s ease}
@keyframes pop{50%{transform:scale(1.25)}}
.grp{display:flex}
.grp .act{padding:0}

.showthread{display:flex;align-items:center;gap:12px;color:var(--accent);padding:8px 0 10px;width:100%;text-align:left}
.showthread .dots{width:40px;display:flex;justify-content:center}
.showthread .dots i{width:2px;height:16px;background:var(--line);display:block;border-radius:1px}
.thread .row{padding-top:4px}
.thread .rep .main{padding-bottom:8px}
.thread .rep:not(:last-child) .avcol::after{content:"";flex:1;width:2px;background:var(--line);margin-top:4px;min-height:12px}
.replying{color:var(--sub);font-size:14px}
.replying span{color:var(--accent)}
.typing{display:inline-flex;gap:4px;padding:8px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--sub);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.25}}
.cut{color:var(--sub);font-size:13px}

/* 4択 */
.poll{display:flex;flex-direction:column;gap:8px}
.opt{border:1px solid var(--accent);color:var(--accent);border-radius:999px;min-height:38px;padding:6px 16px;font-weight:700;text-align:center;line-height:1.35}
.opt:hover{background:rgba(29,155,240,.1)}
.res{min-height:38px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);line-height:1.35}
.res.win{border-color:var(--rt);background:rgba(0,186,124,.12);font-weight:700}
.res.bad{border-color:var(--ng);background:rgba(244,33,46,.1)}
.res .marks{display:flex;gap:4px;flex:none}
.mark{font-size:12px;border-radius:4px;padding:0 5px;font-weight:700}
.mark.ok{background:var(--rt);color:#fff}
.mark.you{border:1px solid currentColor}
.pmeta{color:var(--sub);font-size:14px;margin-top:6px}
.explain{margin-top:10px;background:var(--raise);border-radius:12px;padding:10px 12px;font-size:14px}
.explain b{display:block;margin-bottom:2px}
.explain.ok b{color:var(--rt)} .explain.ng b{color:var(--ng)}

/* 一問一答（答えのぼかし） */
.reveal{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:16px;padding:12px 14px;position:relative;overflow:hidden;background:var(--raise);cursor:pointer}
.reveal .ans{filter:blur(7px);user-select:none;transition:filter .25s}
.reveal .hint{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;color:var(--text)}
.reveal .hint em{font-style:normal;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:14px}
.reveal.open{cursor:default}
.reveal.open .ans{filter:none;user-select:text}
.reveal.open .hint{display:none}
.ans .big{font-size:19px;font-weight:800;letter-spacing:.02em}
.ans p{margin:6px 0 0;font-size:14px;color:var(--sub)}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.grade button{border:1px solid var(--line);border-radius:999px;min-height:38px;font-weight:700}
.grade .ok{color:var(--rt)} .grade .ng{color:var(--ng)}
.grade button:hover{border-color:currentColor}

/* よくある誤解 */
.myth{border:1px solid var(--line);border-radius:16px;overflow:hidden}
.mrow{display:flex;gap:10px;padding:10px 12px;align-items:flex-start}
.mrow+.mrow{border-top:1px solid var(--line)}
.mk{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff}
.mrow.ng .mk{background:var(--ng)}
.mrow.ng span:last-child{color:var(--sub);text-decoration:line-through;text-decoration-color:rgba(244,33,46,.55)}
.mrow.ok .mk{background:var(--rt)}
.mrow.ok span:last-child{font-weight:700}
.myth .why{margin:0;padding:10px 12px;border-top:1px solid var(--line);background:var(--raise);font-size:14px}

/* 返信欄 */
.replybox{display:flex;gap:12px;padding:6px 0 12px}
.replybox .av{width:32px;height:32px;font-size:13px}
.replybox form{flex:1;display:grid;gap:8px}
.replybox textarea{width:100%;min-height:64px;resize:vertical;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);font:inherit;font-size:16px;padding:8px 10px}
.replybox .send{justify-self:end;background:var(--accent);color:#fff;border-radius:999px;padding:6px 16px;font-weight:700}

/* 読み込み中 */
.skel{border-bottom:1px solid var(--line);padding:14px 16px;display:flex;gap:12px}
.skel .sa{width:40px;height:40px;border-radius:50%;flex:none}
.skel .sb{flex:1;display:grid;gap:9px;padding-top:4px}
.skel i{display:block;height:12px;border-radius:6px}
.skel .sa,.skel i{background:linear-gradient(90deg,var(--line) 0%,var(--raise) 50%,var(--line) 100%);background-size:200% 100%;animation:shim 1.2s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
.gbar{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--sub);font-size:13px;padding:14px 16px;text-align:center}
.loadmore{display:block;margin:18px auto;color:var(--accent);font-weight:700;padding:8px 18px;border-radius:999px}
.loadmore:hover{background:rgba(29,155,240,.1)}
.gnote{padding:20px 24px;text-align:center;color:var(--sub);font-size:14px}
#sentinel{min-height:60px}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid rgba(29,155,240,.25);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
.spin.sm{width:16px;height:16px;border-width:2px}
@keyframes spin{to{transform:rotate(360deg)}}

/* 引っぱって更新 */
.ptr{height:0;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;color:var(--sub);font-size:13px;font-weight:700}
.ptr.anim{transition:height .25s ease}
.ptr-in{display:flex;align-items:center;gap:8px;height:56px;flex:none}
.ptr svg{width:22px;height:22px;transition:transform .2s;color:var(--accent)}
.ptr.ready svg{transform:rotate(180deg)}
.ptr .spin{display:none;width:22px;height:22px;border-width:2.5px}
.ptr.busy .spin{display:block}
.ptr.busy svg{display:none}
.post.fresh{animation:fresh 1.6s ease}
@keyframes fresh{from{background:rgba(29,155,240,.12)}}
.newpill{position:sticky;top:116px;z-index:15;display:flex;justify-content:center;height:0}
.newpill button{background:var(--accent);color:#fff;border-radius:999px;padding:6px 14px;font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.25);display:flex;gap:6px;align-items:center;transform:translateY(8px)}

/* はじめての画面・項目フォーム */
.onb{padding:28px 20px 40px;display:grid;gap:14px}
.onb-logo b{width:52px;height:52px;border-radius:14px;background:var(--text);color:var(--bg);display:grid;place-items:center;font-size:28px;font-weight:800}
.onb h1{margin:4px 0 0;font-size:26px;line-height:1.3}
.onb p{margin:0;color:var(--sub)}
.tform{display:grid;gap:8px}
.tform input,.tform textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);font:inherit;font-size:16px;padding:10px 12px}
.tform input{height:48px}
.tform textarea{resize:vertical}
.tform .btn{justify-self:end}
.btn{border-radius:999px;padding:9px 20px;font-weight:700;border:1px solid var(--line)}
.btn.pri{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn:disabled{opacity:.4;cursor:default}
.btn.big{width:100%;padding:13px 20px;font-size:16px}
.lbl2{font-size:13px;font-weight:700;color:var(--sub);margin-top:4px}
.sugg,.tchips{display:flex;flex-wrap:wrap;gap:8px}
.tchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 12px;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.tchip button{width:26px;height:26px;border-radius:50%;color:var(--sub);font-size:16px;line-height:1}
.tchip button:hover{background:var(--hover);color:var(--ng)}
.onb .fine{font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:6px 16px 16px}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}

/* 他の画面 */
.vhead{padding:12px 16px;font-size:20px;font-weight:800;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--veil);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);z-index:20}
.vhead small{display:block;font-size:13px;color:var(--sub);font-weight:400}
.search{padding:10px 16px;border-bottom:1px solid var(--line)}
.search input{width:100%;height:42px;border-radius:999px;border:1px solid var(--line);background:var(--raise);color:var(--text);font:inherit;font-size:16px;padding:0 18px}
.tfilter{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line);scrollbar-width:none}
.tfilter::-webkit-scrollbar{display:none}
.ditem{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);display:grid;gap:2px;width:100%}
.ditem:hover{background:var(--hover)}
.ditem b{font-size:16px}
.ditem b small{font-weight:400;color:var(--sub);margin-left:8px;font-size:13px}
.ditem span{color:var(--sub);font-size:14px}
.ditem em{font-style:normal;font-size:12px;color:var(--accent)}
.dsec{padding:16px 16px 6px;color:var(--sub);font-size:13px;font-weight:700}
.dhint{font-weight:400;margin-left:8px;font-size:12px}
.empty{padding:40px 24px;text-align:center;color:var(--sub)}
.empty b{display:block;color:var(--text);font-size:22px;margin-bottom:6px}
.empty .btn{margin-top:16px}
.reset{margin:8px 16px 24px;color:var(--ng);font-size:14px;text-align:left}
.svtabs{border-bottom:1px solid var(--line)}
.svnote{padding:8px 16px;color:var(--sub);font-size:13px}
.tsec{padding:14px 16px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.tsec h4{margin:0;font-size:16px}
.trow{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-bottom:1px solid var(--line)}
.trow .dot{margin-top:7px}
.tinfo{flex:1;min-width:0;display:grid;gap:1px}
.tinfo span{color:var(--sub);font-size:14px}
.tinfo small{color:var(--sub);font-size:12.5px}
.tbtns{display:flex;gap:6px;flex:none}
.pill{border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:700}
.pill.sm{padding:4px 12px;font-size:13px}
.pill.pri{background:var(--text);color:var(--bg);border-color:var(--text)}
.pill.ng{color:var(--ng)}
.witem{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.wq{flex:1;text-align:left;padding:10px 0 10px 16px;display:grid;gap:2px;min-width:0}
.wq b{font-weight:500;font-size:14px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.wq span{font-size:12px;color:var(--accent)}
.wx{width:48px;height:48px;color:var(--sub);font-size:18px;flex:none}
.wx:hover{color:var(--ng)}
.seg{display:flex;margin:4px 16px 6px;border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px}
.seg button{flex:1;border-radius:999px;padding:7px 10px;font-weight:700;color:var(--sub)}
.seg button[aria-checked="true"]{background:var(--text);color:var(--bg)}
.about{margin:16px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;color:var(--sub);font-size:13px;display:grid;gap:6px}
.about p{margin:0}

/* 下部ナビ・投稿ボタン */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;background:var(--veil);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav{flex:1;height:53px;display:grid;place-items:center;color:var(--sub)}
.nav svg{width:26px;height:26px}
.nav[aria-current="page"]{color:var(--text)}
.nav span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.fab{position:fixed;right:16px;bottom:72px;z-index:31;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(29,155,240,.4)}
.fab svg{width:24px;height:24px}
body.onbmode .fab,body.onbmode .rpost{display:none!important}

/* ボトムシート・モーダル */
.scrim{position:fixed;inset:0;background:var(--shade);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:600px;border-radius:18px 18px 0 0;padding:8px 20px calc(24px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto;border:1px solid var(--line);border-bottom:0}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 14px}
.sheet h3{margin:0;font-size:22px;line-height:1.35;text-wrap:balance}
.sheet .rd{color:var(--sub);margin-top:2px}
.sheet .src{display:inline-block;margin-top:4px;font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0 8px}
.sheet p{margin:12px 0 0}
.sheet .lbl{display:block;font-size:12px;color:var(--sub);font-weight:700;margin-top:14px}
.sheet .lbl+p{margin-top:2px}
.sheet .row2{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.sheet .tform{margin-top:12px}
.modal{position:fixed;inset:0;z-index:50;background:var(--shade);display:flex;justify-content:center;align-items:flex-start}
.mbox{background:var(--bg);width:100%;max-width:600px;min-height:100%;padding:12px 16px}
.mtop{display:flex;justify-content:space-between;align-items:center;height:44px}
.mtop .x{font-size:15px}
.mtop .post-btn{background:var(--accent);color:#fff;border-radius:999px;padding:6px 18px;font-weight:700}
.mtop .post-btn:disabled{opacity:.5}
.cmp{display:flex;gap:12px;margin-top:8px}
.cmp textarea{flex:1;border:0;background:transparent;color:var(--text);font:inherit;font-size:19px;min-height:150px;resize:none;padding-top:6px}
.cmp textarea:focus-visible{outline:none}
.cto{margin:10px 0 0 52px;display:grid;gap:6px}
.cto>span{font-size:12px;color:var(--sub);font-weight:700}
.tsel{display:flex;flex-wrap:wrap;gap:8px}
.ask{display:flex;gap:8px;align-items:center;margin:14px 0 0 52px;font-size:14px}
.ask input{width:18px;height:18px;accent-color:var(--accent)}
.count{text-align:right;color:var(--sub);font-size:13px;margin-top:8px;font-variant-numeric:tabular-nums}
.count.over{color:var(--ng)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--accent);color:#fff;border-radius:6px;padding:10px 16px;z-index:60;font-size:14px;box-shadow:0 2px 12px rgba(0,0,0,.2);max-width:calc(100% - 32px);width:max-content}

/* 細目の地図 */
.crumb{display:inline-flex;align-items:center;gap:4px;color:var(--sub);font-size:13px;margin-top:1px;max-width:100%;text-align:left}
.crumb svg{width:14px;height:14px;flex:none}
.crumb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb:hover{color:var(--accent)}
.chip small{color:var(--sub);font-size:11px;margin-left:5px}
.chip.added{background:var(--raise);color:var(--text);border-color:var(--line)}
.chip.added small{color:var(--sub)}
.prog{display:grid;gap:6px;margin-top:12px}
.prog.mini2{margin:4px 0 2px;max-width:220px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.prog.mini2 .bar{height:5px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;min-width:0}
.prog span{font-size:13px;color:var(--sub)}
.munit{border:1px solid var(--line);border-radius:14px;margin-top:10px;overflow:hidden}
.muhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:var(--raise)}
.muhead label{display:flex;align-items:center;gap:8px;font-weight:700;min-width:0;cursor:pointer}
.muhead input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.muhead span:last-child{font-size:12px;color:var(--sub);flex:none;font-variant-numeric:tabular-nums}
.munit.off .mitems{opacity:.4}
.mitems{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px}
.mitem{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;text-align:left}
.mitem i{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.mitem.done i{background:var(--rt)}
.mitem small{color:var(--sub);font-size:11px}
.mitem:hover{border-color:var(--accent)}
.pts{margin:6px 0 0;padding-left:20px;display:grid;gap:8px}
.srcs{margin:4px 0 0;padding-left:20px;font-size:13px;display:grid;gap:4px}
.srcs a{color:var(--accent);overflow-wrap:anywhere}
.back{color:var(--accent);font-weight:700;font-size:14px;margin-bottom:8px;display:inline-block}
.small{font-size:12.5px;color:var(--sub);margin-top:6px}
.small summary{cursor:pointer;color:var(--accent)}
.sheet .seg{margin:6px 0 0}

/* 広い画面 */
@media (min-width:700px){
  .bottom,.fab{display:none}
  .col{padding-bottom:0}
  .rail{display:flex;flex-direction:column;align-items:flex-end;gap:4px;width:88px;padding:8px 12px;position:sticky;top:0;height:100vh}
  .rail .nav{flex:none;width:52px;height:52px;border-radius:50%;position:relative}
  .rail .nav:hover{background:var(--hover)}
  .rail .logo{margin:4px 0 8px}
  .rail .logo span{display:none}
  .rail .rpost{width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;margin-top:12px}
  .rail .rpost svg{width:24px;height:24px}
  .toast{bottom:24px}
  .scrim{align-items:center}
  .sheet{border-radius:18px;border:1px solid var(--line)}
  .modal{align-items:flex-start;padding-top:5vh}
  .mbox{min-height:auto;border-radius:16px}
}
@media (min-width:1080px){
  .rail{width:250px;align-items:stretch}
  .rail .nav{width:auto;height:50px;border-radius:999px;display:flex;align-items:center;gap:18px;padding:0 14px;justify-content:flex-start}
  .rail .nav span{position:static;width:auto;height:auto;clip:auto;font-size:19px}
  .rail .nav[aria-current="page"] span{font-weight:800}
  .rail .logo span{display:inline}
  .rail .logo{padding:0 10px}
  .rail .rpost{width:auto;border-radius:999px;font-weight:800;font-size:16px}
  .rail .rpost svg{display:none}
  .side{display:block;width:350px;padding:12px 24px;position:sticky;top:0;height:100vh;overflow:auto}
  .box{border:1px solid var(--line);border-radius:16px;margin-bottom:16px;overflow:hidden}
  .box h2{font-size:20px;margin:0;padding:12px 16px}
  .trend{display:block;width:100%;text-align:left;padding:10px 16px}
  .trend:hover{background:var(--hover)}
  .trend small{display:block;color:var(--sub);font-size:13px}
  .trend b{display:block}
  .trend.addt{color:var(--accent);font-weight:700}
  .mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px 14px}
  .mini div{background:var(--raise);border-radius:12px;padding:8px 10px}
  .mini small{display:block;color:var(--sub);font-size:12px}
  .mini b{font-size:18px;font-variant-numeric:tabular-nums}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>

<script type="application/json" id="fields-data">[{"id":"takken","name":"宅建","full":"宅地建物取引士資格試験","group":"資格試験","desc":"不動産取引の国家資格。民法・宅建業法・法令上の制限・税から50問","asOf":"2026年度試験（2026年4月1日施行の法令）と2026年11月時点の税制に基づく","aliases":["宅地建物取引士","宅建士","宅建試験","宅地建物取引士試験","宅建士試験"],"sources":[{"t":"長野県「令和8年度宅地建物取引士資格試験案内」","u":"https://www.pref.nagano.lg.jp/kenchiku/takkenshiken.html"},{"t":"伊藤塾「2026年度（令和8年度）宅建試験の法改正」","u":"https://column.itojuku.co.jp/takken/basic/houkaisei/"},{"t":"伊藤塾「2025年度 宅建試験の法改正まとめ」","u":"https://column.itojuku.co.jp/takken/detail/houkaisei2025/"},{"t":"全日本不動産協会「空き家等に係る媒介報酬規制の見直し」","u":"https://www.zennichi.or.jp/column/vacant-property-fee/"},{"t":"三井住友トラスト不動産「区分所有法の改正（2026年4月施行）」","u":"https://smtrc.jp/useful/knowledge/sellbuy-law/2025_08.html"},{"t":"財務省「令和8年度税制改正の大綱（国税）」","u":"https://www.mof.go.jp/tax_policy/tax_reform/outline/fy2026/08taikou_01.html"},{"t":"国税庁 タックスアンサーNo.4508 住宅取得等資金の贈与の非課税","u":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/sozoku/4508.htm"},{"t":"国税庁 タックスアンサーNo.3302 マイホームを売ったときの特例","u":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/joto/3302.htm"},{"t":"国税庁 タックスアンサーNo.3355 特定のマイホームを買い換えたときの特例","u":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/joto/3355.htm"},{"t":"国税庁 タックスアンサーNo.7108 不動産譲渡・建設工事請負契約書の印紙税の軽減","u":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/inshi/7108.htm"},{"t":"国税庁 タックスアンサーNo.7191 登録免許税の税額表","u":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/inshi/7191.htm"},{"t":"池田市「新築住宅に対する固定資産税の減額」","u":"https://www.city.ikeda.osaka.jp/material/files/group/43/R9shinchiku.pdf"},{"t":"群馬県「不動産取得税（新築住宅の軽減）」","u":"https://www.pref.gunma.jp/site/tax/5416.html"},{"t":"宅建試験合格塾「宅建業法の解説」","u":"https://takken-success.info/takkengyoho/"},{"t":"宅建試験合格塾「法令上の制限の解説」","u":"https://takken-success.info/horeiseigen/"}],"units":[{"u":"民法総則（意思表示・代理・時効）","items":[{"n":"心裡留保と虚偽表示","p":["心裡留保は原則有効。相手方が真意でないことを知り、または知ることができたときは無効となる。","心裡留保による無効は善意の第三者に対抗できない（2020年改正で明文化）。","通謀虚偽表示は当事者間で無効。善意の第三者には対抗できず、第三者は無過失も登記も不要。","虚偽表示の目的物の善意の転得者や、仮装譲受人から差押えをした善意の債権者も第三者として保護される。"]},{"n":"錯誤","p":["錯誤は無効ではなく取消しの対象（2020年改正）。法律行為の目的と取引上の社会通念に照らし重要なものに限る。","動機の錯誤（基礎事情の錯誤）は、その事情が法律行為の基礎とされていると表示されていたときに限り取り消せる。","表意者に重大な過失があれば取消し不可。ただし相手方が悪意・重過失、または同じ錯誤に陥っていたときは取り消せる。","錯誤による取消しは善意無過失の第三者に対抗できない。","取消権は追認できる時から5年、行為の時から20年で消滅する（詐欺・強迫・制限行為能力でも同じ）。"]},{"n":"詐欺と強迫","p":["詐欺による意思表示は取り消せるが、その取消しは善意無過失の第三者に対抗できない。","第三者による詐欺は、相手方がその事実を知り、または知ることができたときに限り取り消せる。","強迫による意思表示は取り消せ、善意無過失の第三者にも対抗できる。第三者の強迫でも常に取り消せる。","取消し前に現れた第三者とは上記のルールで、取消し後に現れた第三者とは登記の先後で優劣を決する。"]},{"n":"制限行為能力者","p":["成年年齢は18歳（2022年4月施行）。未成年者が法定代理人の同意なく行った法律行為は取り消せる。","未成年者でも、単に権利を得・義務を免れる行為、処分を許された財産の処分、許可された営業は単独で有効にできる。","成年被後見人の行為は日用品の購入等を除き、後見人の同意があっても取り消せる。居住用不動産の処分は家裁の許可が必要。","被保佐人は不動産の売買・借財・保証・新築等に保佐人の同意が必要。被補助人は審判で定めた特定の行為のみ同意を要する。","相手方は1か月以上の期間を定めて催告できる。制限行為能力者が詐術を用いて能力者と信じさせたときは取り消せない。"]},{"n":"代理の基本と復代理","p":["本人のためにすることを示さない（顕名なし）と代理人自身のためにしたとみなす。相手方が知り、または知り得たときは本人に効果。","代理人は行為能力者でなくてよく、制限行為能力者がした代理行為は行為能力の制限を理由に取り消せない。","任意代理人は本人の許諾かやむを得ない事由があるときに限り復代理人を選任できる。法定代理人は自己の責任で選任できる。","代理権は本人の死亡、代理人の死亡・破産手続開始・後見開始で消滅する。任意代理は本人の破産でも消滅する。","自己契約・双方代理・利益相反行為は無権代理とみなす。ただし債務の履行と本人があらかじめ許諾した行為は有効。"]},{"n":"無権代理と表見代理","p":["無権代理行為は本人が追認すれば契約時にさかのぼって有効となる（第三者の権利は害せない）。","相手方の催告に本人が期間内に確答しなければ追認拒絶とみなす。善意の相手方は本人の追認前なら取り消せる。","無権代理人への履行・損害賠償の請求は相手方が善意無過失なら可。代理人が悪意なら相手方に過失があっても請求できる。","無権代理人が本人を単独相続すると当然に有効になる。本人が無権代理人を相続した場合は追認を拒絶できる。","表見代理（代理権授与の表示・権限外の行為・代理権消滅後）は、相手方が善意無過失なら本人に効果が帰属する。"]},{"n":"取得時効と消滅時効","p":["所有の意思をもって平穏・公然に占有し、占有開始時に善意無過失なら10年、それ以外は20年で所有権を時効取得する。","前の占有者の占有期間を併せて主張でき、その場合は前の占有者の善意・悪意や過失も引き継ぐ。","債権は権利を行使できることを知った時から5年、行使できる時から10年のいずれか早い方で時効消滅する。","人の生命・身体の侵害による損害賠償請求権は、行使できる時から20年（知った時から5年）となる。","確定判決等で確定した権利は、もとの時効期間が10年より短くても時効期間が10年となる。"]},{"n":"時効の完成猶予・更新・援用","p":["裁判上の請求等は完成猶予事由。確定判決等で権利が確定すると時効は更新され、新たに進行を始める。","催告は6か月の完成猶予にとどまり、猶予期間中に再度催告しても重ねて猶予されない。","協議を行う旨の書面による合意は最長1年の完成猶予。再度の合意も可能だが通算5年を超えられない。","債務者の承認で時効は更新される。時効完成後に承認した債務者は、信義則上その時効を援用できない。","時効は援用が必要で、保証人・物上保証人・抵当不動産の第三取得者も援用できる。時効の利益は事前に放棄できない。"]}]},{"u":"物権・区分所有・不動産登記","items":[{"n":"物権変動と登記","p":["不動産の物権変動は登記がなければ第三者に対抗できない。二重譲渡では先に登記した者が優先する。","単なる悪意者は第三者に当たるが、背信的悪意者・不法占拠者・無権利者には登記なしで対抗できる。","解除前の第三者は登記を備えれば保護され、解除後の第三者とは登記の先後で優劣を決する。","時効完成前の第三者には登記なしで対抗でき、時効完成後の第三者とは対抗関係（登記の先後）になる。","相続放棄の効果は登記なしで第三者に対抗できる。法定相続分を超える部分の取得は登記がないと第三者に対抗できない。"]},{"n":"共有","p":["各共有者の持分は相等しいと推定される。持分は自由に処分でき、共有物の全部を持分に応じて使用できる。","保存行為は単独で、管理行為と軽微な変更は持分価格の過半数で、形状・効用の著しい変更は全員の同意で行う。","短期の賃借権等（土地5年以内、建物3年以内）の設定は管理行為として持分価格の過半数で決定できる（2023年改正）。","共有者が持分を放棄、または相続人なく死亡したときは、その持分は他の共有者に帰属する（特別縁故者への分与が優先）。","分割請求はいつでも可能で、不分割特約は5年以内（更新可）。所在等不明共有者がいれば裁判所の決定で変更等ができる。"]},{"n":"相隣関係と所有者不明土地","p":["境界付近の建築・修繕や境界標の調査等のため隣地を使用できる。住家に立ち入るには居住者の承諾が必要（2023年改正）。","隣地の竹木の根は自ら切り取れる。枝は所有者に催告しても相当期間内に切除しない場合などに自ら切り取れる。","他の土地に囲まれ公道に通じない土地の所有者は、必要かつ損害が最も少ない場所・方法で囲んでいる土地を通行できる。","所有者不明土地管理命令では利害関係人の請求で裁判所が管理人を選任する。管理人の処分行為には裁判所の許可が必要。","管理不全土地管理命令は、所有者の管理が不適当で他人の権利・法的利益が侵害されるおそれがある場合に発令される。"]},{"n":"区分所有建物の構成","p":["専有部分は構造上・利用上独立した部分。共用部分には法律上当然の法定共用部分と、規約で定める規約共用部分がある。","規約共用部分は登記しなければ第三者に対抗できない。共用部分の持分は原則として専有部分の床面積（内法）の割合による。","共用部分の持分は専有部分と分離して処分できず、専有部分の処分に従う。","敷地利用権は規約に別段の定めがない限り、専有部分と分離して処分できない。","区分所有者は、建物の管理が適正かつ円滑に行われるよう相互に協力する責務を負う（2026年4月施行）。"],"s":[4]},{"n":"管理者・集会・規約","p":["管理者は規約に別段の定めがない限り集会の決議で選任・解任する。不正があれば各区分所有者が裁判所に解任請求できる。","管理者は少なくとも毎年1回集会を招集する。区分所有者の5分の1以上で議決権の5分の1以上を有する者は招集を請求できる。","招集通知は会日の少なくとも1週間前に発する。建替え決議を目的とする集会は2か月前に通知し、1か月前までに説明会を開く。","規約と集会の決議は区分所有者の特定承継人にも効力が及び、占有者も建物の使用方法について同じ義務を負う。","規約は管理者等が保管し、保管場所を建物内の見やすい場所に掲示する。利害関係人は閲覧を請求できる。"]},{"n":"2026年改正の決議要件と再生","p":["建替え等の区分所有権の処分を伴う決議を除き、集会の決議は出席した区分所有者・議決権の多数決で成立する。","裁判所の決定で所在等不明区分所有者を決議の母数から除外できる。管理不全専有部分管理制度や国内管理人制度も新設。","共用部分の重大変更は各4分の3以上が原則。瑕疵の除去やバリアフリー化が目的なら出席者の各3分の2以上に緩和される。","建替え決議は各5分の4以上が原則。耐震性・火災安全性の不足や外壁剥落の危険等があれば各4分の3以上に緩和される。","建物の更新（一棟リノベーション）や建物敷地売却・取壊しも多数決で可能に。建替え決議後の賃貸借は請求から6か月で終了。"],"s":[1,4]},{"n":"登記記録と表示に関する登記","p":["登記記録は表題部（物理的状況）と権利部からなり、権利部は甲区（所有権）と乙区（所有権以外の権利）に分かれる。","表題登記、地目・床面積の変更の登記、滅失の登記は、所有者に1か月以内の申請義務がある。","表示に関する登記は登記官が職権ですることもできる。権利に関する登記は原則として当事者の申請による。","分筆・合筆は表題部所有者または所有権の登記名義人が申請する。所有者や地目が異なる土地等は合筆できない。","登記事項証明書は誰でも手数料を納めて交付を請求でき、利害関係を明らかにする必要はない。"]},{"n":"権利登記の申請と仮登記","p":["権利の登記は登記権利者と登記義務者の共同申請が原則。判決による登記、相続・合併による移転は単独で申請できる。","所有権保存登記は表題部所有者やその相続人、判決で所有権を確認された者、収用で取得した者などが申請できる。","登記名義人の氏名・住所の変更登記や、相続人に対する遺贈による所有権移転登記は単独で申請できる。","仮登記は仮登記義務者の承諾があれば仮登記権利者が単独で申請できる。所有権の本登記には利害関係人の承諾が必要。","共同申請では登記義務者の登記識別情報を提供する。区分建物は表題部所有者から直接取得した者も保存登記を申請できる。"]},{"n":"相続登記と住所等変更登記の義務化","p":["相続で所有権を取得した相続人は、取得を知った日から3年以内に相続登記を申請する義務がある（2024年4月施行）。","正当な理由なく相続登記を怠ると10万円以下の過料。施行前に開始した相続も対象で、施行日から3年の猶予がある。","相続人申告登記をすれば申請義務を果たしたことになる。後の遺産分割で取得した場合は分割の日から3年以内に登記する。","所有権の登記名義人は、氏名・住所等の変更日から2年以内に変更登記を申請する義務がある（2026年4月施行）。","住所等の変更登記を正当な理由なく怠ると5万円以下の過料の対象となる。"],"s":[1,2]}]},{"u":"担保物権と債権総論","items":[{"n":"抵当権の効力と物上代位","p":["抵当権は設定時の従物や付加一体物に及ぶ。果実には被担保債権の不履行後に生じたものに限り及ぶ。","賃料・火災保険金・売買代金・損害賠償金に物上代位できるが、払渡し前に抵当権者自ら差し押さえる必要がある。","後順位抵当権者等がいる場合、利息等は満期となった最後の2年分についてのみ優先弁済を受けられる。","順位は登記の前後による。順位の変更は各抵当権者の合意と利害関係人の承諾が必要で、登記しなければ効力を生じない。","抵当権設定後に土地上に築造された建物は土地と一括競売できるが、優先弁済は土地の代価についてのみ受けられる。"]},{"n":"抵当権と賃借権・第三取得者","p":["抵当権設定登記後に設定された賃借権は、原則として抵当権者や競売の買受人に対抗できない。","競売手続開始前から使用収益している建物の賃借人は、買受人の買受けの時から6か月間、明渡しが猶予される。","登記した賃貸借は、先順位の抵当権者全員が同意し、その同意の登記があれば抵当権者に対抗できる。","代価弁済は、抵当権者の請求に応じて第三取得者が代価を弁済すると抵当権が消滅する制度である。","抵当権消滅請求は第三取得者のみ可（主債務者・保証人は不可）。抵当権者は書面受領後2か月以内に競売を申し立てないと承諾とみなす。"]},{"n":"法定地上権","p":["抵当権設定当時に土地上に建物が存在し、土地と建物が同一の所有者に属していることが成立要件となる。","土地・建物の一方または双方に抵当権が設定され、競売の結果、土地と建物の所有者が別々になると成立する。","更地に抵当権を設定した後に建物を建てた場合は法定地上権は成立しない（一括競売は可能）。","設定当時に同一所有者であれば、その後に一方が譲渡されても成立する。建物が未登記でも成立する（判例）。"]},{"n":"根抵当権","p":["一定の範囲に属する不特定の債権を極度額の限度で担保する。範囲は継続的取引契約等で定め、包括根抵当は認められない。","元本確定前は付従性・随伴性がなく、確定前に被担保債権を譲り受けても根抵当権は移転しない。","確定前の被担保債権の範囲や債務者の変更は後順位抵当権者の承諾不要。極度額の変更には利害関係人の承諾が必要。","確定期日は定めた日から5年以内。定めがなければ設定者は設定から3年経過後に確定請求でき、請求から2週間で確定する。","根抵当権者はいつでも元本の確定を請求でき、請求時に確定する。確定後、設定者は極度額の減額を請求できる。"]},{"n":"留置権・先取特権・質権","p":["留置権は物に関して生じた債権の弁済まで物を留置できる法定担保物権。不動産にも成立し登記は不要、物上代位はない。","留置権は占有を失うと消滅する。造作買取代金債権を理由に建物を留置することはできない（判例）。","不動産の先取特権は保存・工事・売買の3種。保存は保存行為完了後直ちに、工事は工事開始前に登記しなければならない。","質権は目的物の引渡しで効力を生じる。不動産質の存続期間は10年以内で、質権者は使用収益できるが利息は請求できない。"]},{"n":"保証と連帯債務","p":["保証契約は書面（電磁的記録を含む）でしなければ効力を生じない。個人の根保証は極度額を定めなければ無効。","連帯保証人には催告の抗弁権・検索の抗弁権・分別の利益がない。","主たる債務者への履行請求や時効の更新は保証人にも及ぶが、連帯保証人への請求は主たる債務者に及ばない（2020年改正）。","主たる債務者が期限の利益を喪失したとき、債権者は個人保証人にそれを知った時から2か月以内に通知しなければならない。","連帯債務で他の債務者に効力が及ぶのは弁済・更改・相殺・混同など。請求・免除・時効の完成は相対効にとどまる。"]},{"n":"債権譲渡・相殺・弁済","p":["譲渡制限特約があっても債権譲渡は有効。債務者は悪意・重過失の譲受人に対して履行を拒める。","債務者への対抗要件は譲渡人の通知か債務者の承諾。第三者への対抗要件は確定日付のある証書による通知・承諾。","二重譲渡の優劣は、確定日付のある通知が債務者に到達した日時、または確定日付のある承諾の日時の先後で決まる。","悪意による不法行為や人の生命・身体の侵害による損害賠償債務を受働債権として、加害者側から相殺できない。","受領権者としての外観を有する者への弁済は弁済者が善意無過失なら有効。正当な利益のない第三者は債務者の意思に反して弁済できない。"]}]},{"u":"契約・不法行為・相続","items":[{"n":"債務不履行と損害賠償","p":["確定期限は到来時、不確定期限は請求を受けた時か到来を知った時の早い方、期限の定めなしは請求時から履行遅滞となる。","債務者の責めに帰することができない事由による不履行なら損害賠償責任を負わない。金銭債務は不可抗力でも免責されない。","金銭債務の損害賠償は損害の証明が不要で、法定利率（3年ごとに見直す変動制）か、それを超える約定利率による。","違約金は賠償額の予定と推定される。賠償額を予定しても履行の請求や解除は妨げられない。"]},{"n":"契約の解除と危険負担","p":["履行遅滞では相当期間を定めて催告し、その期間内に履行がなければ解除できる。不履行が軽微なら解除できない。","履行不能や明確な履行拒絶では催告なしに解除できる。解除に債務者の帰責事由は不要（2020年改正）。","解除により各当事者は原状回復義務を負い、金銭には受領時からの利息を付ける。双方の返還義務は同時履行の関係。","当事者の一方が複数いるときは、解除は全員から、または全員に対してしなければならない。","双方に帰責事由のない履行不能では債権者は反対給付の履行を拒める。引渡し後の滅失なら買主は代金支払を拒めない。"]},{"n":"手付と同時履行","p":["手付は解約手付と推定される。相手方が履行に着手するまで、買主は手付を放棄し、売主は倍額を現実に提供して解除できる。","自分が履行に着手していても、相手方が履行に着手していなければ手付による解除ができる（判例）。","弁済と受取証書の交付は同時履行。被担保債務の弁済は抵当権設定登記の抹消より先に履行すべきもの。","賃貸借終了時は建物の明渡しが敷金返還より先履行。同時履行の抗弁権がある間は履行遅滞の責任を負わない。"]},{"n":"売買の契約不適合責任","p":["目的物が種類・品質・数量に関し契約内容に適合しないとき、買主は追完・代金減額・損害賠償・解除を請求できる。","代金減額は原則として相当期間を定めて追完を催告し、追完がないときに請求できる。買主に帰責事由があれば追完・減額は不可。","種類・品質の不適合は、買主が知った時から1年以内に通知しないと権利を失う（売主が悪意・重過失なら制限なし）。","数量や移転した権利の不適合には1年の通知期間の制限はなく、消滅時効の一般原則による。","担保責任を負わない特約も有効だが、売主が知りながら告げなかった事実や自ら設定した権利については免責されない。"]},{"n":"請負・委任・贈与","p":["請負人が仕事を完成しない間は、注文者はいつでも損害を賠償して契約を解除できる。","請負の報酬は目的物の引渡しと同時に支払う。注文者が提供した材料や指図による不適合は原則として請負人の責任とならない。","受任者は無償でも善管注意義務を負う。委任は各当事者がいつでも解除でき、相手方に不利な時期の解除は損害賠償が必要。","委任は委任者・受任者の死亡や破産手続開始、受任者の後見開始で終了する。","書面によらない贈与は、履行の終わった部分を除き各当事者が解除できる。"]},{"n":"民法上の賃貸借","p":["存続期間は最長50年。賃貸人は修繕義務を負うが、賃借人の帰責事由で必要となった修繕は除かれる。","必要費は直ちに、有益費は契約終了時に価格の増加が現存する場合に限り、賃貸人の選択で支出額か増価額を償還請求できる。","無断転貸・無断譲渡は解除原因だが、背信的行為と認めるに足りない特段の事情があれば解除できない（判例）。","適法な転貸では転借人が賃貸人に直接義務を負う。賃借人の債務不履行による解除は転借人に対抗できる。","敷金は明渡し時に返還義務が生じ、賃貸人の地位の移転で新賃貸人に承継される。通常損耗・経年変化は原状回復の対象外。"]},{"n":"不法行為","p":["損害と加害者を知った時から3年（生命・身体の侵害は5年）、不法行為の時から20年で損害賠償請求権は消滅する。","損害賠償債務は損害発生と同時に遅滞となる。被害者に過失があれば裁判所は賠償額を減額（過失相殺）できる。","使用者は被用者が事業の執行について加えた損害を賠償する。被用者への求償は信義則上相当な限度に制限される。","土地工作物の瑕疵による損害はまず占有者が責任を負い、占有者が必要な注意をしていれば所有者が無過失責任を負う。","共同不法行為者は連帯して全額を賠償する。胎児は損害賠償請求については既に生まれたものとみなす。"]},{"n":"相続人と法定相続分","p":["配偶者は常に相続人。血族は子（第1順位）、直系尊属（第2順位）、兄弟姉妹（第3順位）の順で相続人となる。","相続分は配偶者と子が各2分の1、配偶者と直系尊属は3分の2と3分の1、配偶者と兄弟姉妹は4分の3と4分の1。","父母の一方のみを同じくする兄弟姉妹の相続分は、父母の双方を同じくする兄弟姉妹の2分の1となる。","代襲相続の原因は死亡・相続欠格・廃除で、相続放棄は含まない。兄弟姉妹の代襲はその子（甥・姪）までに限る。","嫡出子と嫡出でない子の相続分は同じ。胎児は相続については既に生まれたものとみなす。"]},{"n":"相続の承認・放棄と遺産分割","p":["限定承認・相続放棄は、自己のために相続の開始があったことを知った時から3か月以内に家庭裁判所に申述する。","限定承認は共同相続人全員でしなければならない。放棄した者は初めから相続人でなかったものとみなされる。","相続財産の処分や熟慮期間（3か月）の経過があると単純承認したものとみなされる。","遺産分割は相続開始時にさかのぼって効力を生じる。遺言で5年以内の期間を定めて分割を禁止できる。","相続開始から10年経過後の遺産分割では原則として特別受益・寄与分を主張できず、法定相続分等で分ける（2023年4月施行）。"]},{"n":"遺言","p":["遺言は15歳以上で可能。共同遺言は禁止され、前の遺言と抵触する後の遺言があれば抵触部分は撤回したものとみなす。","自筆証書遺言は全文・日付・氏名を自書して押印する。財産目録は自書不要だが、各頁に署名・押印が必要。","法務局で保管された自筆証書遺言は家庭裁判所の検認が不要。公正証書遺言も検認不要。","公正証書遺言は証人2人以上の立会いが必要。2025年10月からウェブ会議による作成などデジタル化が可能になった。"],"s":[1]},{"n":"遺留分と配偶者居住権","p":["遺留分は兄弟姉妹以外の相続人に認められ、直系尊属のみが相続人なら3分の1、それ以外は2分の1。","遺留分侵害額請求は金銭の支払請求。相続開始と侵害を知った時から1年、相続開始から10年で消滅する。","相続開始前の遺留分の放棄には家庭裁判所の許可が必要。放棄しても他の相続人の遺留分は増えない。","配偶者居住権は遺産分割・遺贈等で取得し、存続期間は原則終身。登記が対抗要件で、譲渡はできない。","配偶者短期居住権は無償で居住していた配偶者に認められ、遺産分割で帰属が確定する日等まで（最低6か月）存続する。"]}]},{"u":"借地借家法","items":[{"n":"借地権の存続期間と更新","p":["借地権の存続期間は30年。これより長い期間を定めればその期間となり、短い定めや定めがない場合は30年となる。","合意による更新後の期間は、最初の更新が20年以上、2回目以降は10年以上。","建物がある場合、借地権者の更新請求か期間満了後の使用継続により、従前と同一条件で更新したものとみなされる。","設定者が遅滞なく正当事由ある異議を述べれば更新を拒める。正当事由は土地使用の必要性・従前の経過・立退料等で判断する。"]},{"n":"借地権の対抗力と建物の滅失","p":["借地権は登記がなくても、借地上に借地権者本人名義で登記された建物があれば第三者に対抗できる（家族名義は不可）。","建物が滅失しても、建物を特定する事項等を土地上の見やすい場所に掲示すれば、滅失日から2年間は対抗力が続く。","当初の存続期間中に建物が滅失し、設定者の承諾を得て再築すると、承諾日か築造日の早い日から20年間存続する。","更新後の滅失では借地権者が解約を申し入れられ、無断再築なら設定者が解約を申し入れられる（申入れから3か月で消滅）。"]},{"n":"建物買取請求と裁判所の許可","p":["期間満了で更新がないとき、借地権者は設定者に建物等を時価で買い取るよう請求できる。債務不履行解除の場合は不可。","借地上の建物を取得した第三者は、設定者が借地権の譲渡・転貸を承諾しないとき、建物の買取りを請求できる。","借地権の譲渡・転貸を設定者が承諾しない場合、借地権者は裁判所に承諾に代わる許可を申し立てられる。","競売等で建物を取得した者は、代金支払後2か月以内に限り裁判所に承諾に代わる許可を申し立てられる。","借地条件の変更や増改築についても、協議が調わなければ裁判所が許可等の裁判をすることができる。"]},{"n":"定期借地権等","p":["一般定期借地権は存続期間50年以上。更新・再築による延長・建物買取請求をしない特約を書面（電磁的記録可）で定める。","事業用定期借地権は専ら事業用（居住用は不可）の建物所有が目的で10年以上50年未満。公正証書による契約が必要。","事業用のうち30年未満のものは更新等の規定が当然に適用されず、30年以上50年未満のものは特約で排除する。","建物譲渡特約付借地権は、設定後30年以上経過した日に建物を設定者に相当の対価で譲渡する特約を付ける。書面は不要。","臨時設備の設置など一時使用のためであることが明らかな借地には、存続期間・更新等の規定は適用されない。"]},{"n":"借家の期間・更新・解約","p":["建物賃貸借で1年未満の期間を定めると期間の定めのないものとみなす。民法の50年の上限は適用されない。","期間の定めがあれば満了の1年前から6か月前までに更新拒絶の通知をしないと同一条件で更新（以後期間の定めなし）。","通知をしても期間満了後に賃借人が使用を続け、賃貸人が遅滞なく異議を述べなければ更新したものとみなす。","期間の定めがない場合、賃貸人の解約申入れには正当事由が必要で6か月経過で終了。賃借人からは3か月で終了する。"]},{"n":"借家の対抗力・造作買取・転貸借","p":["建物賃貸借は登記がなくても建物の引渡しがあれば、その後に物権を取得した者に対抗できる。","賃貸人の同意を得て付加した造作は契約終了時に時価での買取りを請求できる。この請求権は特約で排除できる。","賃貸借が期間満了・解約申入れで終了するとき、賃貸人が転借人に通知すれば通知から6か月で転貸借も終了する。","賃貸借の合意解除は原則として転借人に対抗できないが、賃借人の債務不履行による解除は対抗できる（判例）。","借地上建物の賃借人が借地権の期間満了を1年前までに知らなかったときは、裁判所は1年以内の明渡し猶予を与えられる。"]},{"n":"借賃増減額請求と借家権の承継","p":["経済事情の変動等で借賃が不相当になったとき、当事者は将来に向かって増減額を請求できる。","一定期間増額しない特約は有効だが、減額しない特約は無効（普通建物賃貸借の場合）。","増額請求で協議が調わないとき、賃借人は相当と認める額を払えば足りる。裁判確定後の不足額には年1割の利息を付す。","居住用建物の賃借人が相続人なく死亡したときは、事実上の夫婦・養親子関係にあった同居者が権利義務を承継する。","承継者は相続人なしで死亡したことを知った後1か月以内に反対の意思を表示すれば承継しない。"]},{"n":"定期建物賃貸借","p":["公正証書等の書面（電磁的記録も可）で契約し、更新がない旨を定める。1年未満の期間でも有効。","契約前に、更新がなく期間満了で終了する旨を契約書とは別の書面で交付して説明する。説明がないと更新否定の特約は無効。","期間1年以上なら満了の1年前から6か月前までに終了を通知する。通知が遅れても通知から6か月後には終了を対抗できる。","床面積200㎡未満の居住用建物は、転勤・療養・介護等やむを得ない事情で賃借人が解約でき、申入れから1か月で終了する。","借賃改定の特約があれば、借賃増減額請求の規定は適用されない。"]}]},{"u":"宅建業の免許と宅建士","items":[{"n":"宅建業の定義と適用除外","p":["宅地は建物の敷地に供される土地と、用途地域内の土地（道路・公園・河川・広場・水路を除く）をいう。","取引は自ら行う売買・交換と、売買・交換・貸借の代理・媒介。自ら貸主となる貸借（転貸を含む）は取引に当たらない。","業とは不特定多数に反復継続して行うこと。宅建業者に代理・媒介を依頼して分譲する場合も、売主自身に免許が必要。","国・地方公共団体等には宅建業法が適用されない。信託会社・信託銀行は国土交通大臣への届出で宅建業者とみなされる。"]},{"n":"免許の種類・有効期間と届出","p":["2以上の都道府県に事務所を置けば国土交通大臣、1都道府県内なら知事の免許。大臣免許は地方整備局等に直接申請する。","免許の有効期間は5年。更新は満了の90日前から30日前までに申請し、処分があるまでは従前の免許が有効。","事務所の新設・移転・廃止で免許権者が変わるときは免許換えを申請する。免許換え後の有効期間は新たに5年。","商号・名称、事務所の名称・所在地、役員・政令使用人の氏名等が変わったら30日以内に免許権者に届け出る。","廃業等は30日以内に届出。死亡は相続人が知った日から、合併消滅は消滅法人の代表役員、破産は破産管財人が届け出る。"],"s":[2]},{"n":"免許の欠格事由","p":["破産手続開始の決定を受けて復権を得ない者や、心身の故障により業務を適正に営めない者は免許を受けられない。","不正手段による免許取得・業務停止処分違反・情状が特に重いことによる免許取消しから5年を経過しない者は欠格。","拘禁刑以上の刑、または宅建業法違反・傷害・暴行・背任等の罰金刑の執行終了等から5年未満は欠格（2025年6月に拘禁刑へ一本化）。","執行猶予期間が満了すれば直ちに免許を受けられる。控訴・上告中は刑が確定していないため欠格に当たらない。","暴力団員等（でなくなって5年未満を含む）や、役員・政令使用人に欠格者がいる法人も免許を受けられない。"],"s":[1]},{"n":"事務所・案内所の規制","p":["事務所ごとに業務従事者5人に1人以上の成年の専任宅建士を置く。不足したら2週間以内に補充などの措置をとる。","契約締結・申込受付をする案内所等には専任宅建士を1人以上置き、業務開始の10日前までに免許権者と所在地の知事に届け出る。","標識は事務所・案内所等に、報酬額は事務所ごとに掲示する。帳簿は各事業年度末の閉鎖後5年（自ら売主の新築住宅は10年）保存。","従業者名簿は最終記載日から10年保存し、取引関係者の請求で閲覧させる。2025年4月から生年月日・性別の欄は削除された。","2025年4月から標識に専任宅建士の氏名は載らず、代わりに代表者氏名・専任宅建士の数・従事者数を記載する。"],"s":[2]},{"n":"宅建士の登録","p":["合格者が登録を受けるには2年以上の実務経験か国土交通大臣の登録を受けた実務講習の修了が必要。登録先は受験地の知事。","登録の欠格は免許の欠格事由とほぼ共通。事務禁止中に自ら登録の消除を申請した者は禁止期間満了まで登録できない。","氏名・住所・本籍、勤務先の宅建業者の商号や免許証番号が変わったときは、遅滞なく変更の登録を申請する。","死亡は相続人が知った日から30日以内に届け出る。心身の故障の場合は本人・法定代理人・同居の親族が届け出る。","勤務先の事務所が他の都道府県に移るときは、登録の移転を任意で申請できる（事務禁止期間中は不可）。"]},{"n":"宅建士証と宅建士の業務","p":["宅建士証の有効期間は5年。交付申請前6か月以内に知事指定の法定講習を受ける（合格後1年以内の交付なら不要）。","重要事項の説明時は請求がなくても宅建士証を提示する。その他の場面でも取引関係者から請求があれば提示する。","氏名・住所が変わったら書換え交付を申請する。登録の移転後に交付される宅建士証の有効期間は従前の残存期間となる。","事務禁止処分を受けたら交付を受けた知事に速やかに提出し、登録消除・失効のときは速やかに返納する。","宅建士だけができるのは重要事項の説明と、35条書面・37条書面への記名の3つ。専任でない宅建士も行える。"]}]},{"u":"営業保証金・保証協会・媒介","items":[{"n":"営業保証金の供託","p":["主たる事務所1,000万円、その他の事務所1か所ごとに500万円を、主たる事務所の最寄りの供託所に供託する。","金銭のほか有価証券も可。評価額は国債100%、地方債・政府保証債90%、その他の有価証券80%で計算する。","供託して届け出た後でなければ事業を開始できない。免許から3か月以内に届出がないと催告され、その後1か月以内に届出がなければ免許取消可。","事業開始後に事務所を新設したときも、供託・届出の後でなければその事務所で事業を開始できない。","主たる事務所の移転で最寄りの供託所が変わるとき、金銭のみなら保管替えを請求し、有価証券を含むなら新たに供託する。"],"s":[13]},{"n":"営業保証金の還付と取戻し","p":["宅建業に関する取引で生じた債権を有する者（宅建業者を除く）は、供託された営業保証金の範囲内で還付を受けられる。","還付で不足が生じたら、免許権者の通知を受けた日から2週間以内に不足額を供託し、供託から2週間以内に届け出る。","取戻しは6か月以上の期間を定めた公告が原則。取戻し事由の発生から10年を経過したときは公告不要。","保証協会の社員となったときや、主たる事務所の移転で二重に供託したときも公告なしで取り戻せる。"],"s":[13]},{"n":"保証協会と弁済業務保証金分担金","p":["保証協会の社員は営業保証金の供託が免除される。宅建業者は1つの保証協会にしか加入できない。","分担金は主たる事務所60万円、その他の事務所1か所30万円で、加入しようとする日までに金銭で納付する。","加入後に事務所を新設したときは、設置日から2週間以内に分担金を納付しないと社員の地位を失う。","保証協会は納付を受けた日から1週間以内に、同額の弁済業務保証金を法務大臣・国土交通大臣の定める供託所に供託する。","保証協会は苦情の解決・研修・弁済業務を必ず行う。社員の加入や地位の喪失は社員の免許権者に報告する。"],"s":[13]},{"n":"弁済業務と還付充当金","p":["社員と宅建業に関し取引をした者（宅建業者を除く）は、社員でなければ供託すべき営業保証金の額の範囲で還付を受けられる。","還付には保証協会の認証が必要。社員となる前に取引をした者の債権も還付の対象となる。","還付があると、社員は保証協会から通知を受けた日から2週間以内に還付充当金を納付しないと社員の地位を失う。","社員の地位を失った宅建業者は、失った日から1週間以内に営業保証金を供託しなければならない。","社員が地位を失ったとき保証協会は6か月以上の公告を経て弁済業務保証金を取り戻す。一部の事務所廃止なら公告不要。"]},{"n":"媒介契約の規制","p":["専任・専属専任媒介の有効期間は3か月以内で、超える定めは3か月となる。更新は依頼者の申出が必要で自動更新特約は無効。","業務処理状況の報告は専任媒介が2週間に1回以上、専属専任媒介が1週間に1回以上。報告は口頭でもよい。","34条の2の媒介契約の規制は売買・交換の媒介・代理に適用され、貸借の媒介には適用されない。","売買等の申込みがあったときは、一般媒介を含め遅滞なく依頼者に報告しなければならない。","標準媒介契約約款では、建物状況調査を実施する者のあっせんを「無」とするときは理由を記載する（2024年4月から）。"],"s":[2,13]},{"n":"34条の2書面と指定流通機構","p":["媒介契約を締結したら遅滞なく34条の2書面を作成して依頼者に交付する（承諾があれば電磁的方法も可）。宅建士の記名は不要。","書面には物件の特定、価額、媒介契約の種類、有効期間・解除、報酬、指定流通機構への登録、建物状況調査のあっせん等を記載する。","価額や評価額について意見を述べるときは、その根拠を明らかにしなければならない（口頭でもよい）。","指定流通機構への登録は専任が契約日から7日以内、専属専任が5日以内（休業日を除く）。登録を証する書面は遅滞なく依頼者に渡す。","2025年1月から取引の申込みの受付状況も登録事項となった。成約時は登録番号・取引価格・成立年月日を遅滞なく通知する。"],"s":[2,13]},{"n":"広告と業務上の規制","p":["誇大広告は実際に誤認した者や損害がなくても違反。取引態様は広告をするときと注文を受けたときに明示する（口頭も可）。","未完成物件は開発許可・建築確認等の処分後でなければ広告できない（貸借も同じ）。契約締結の時期の制限は貸借には適用されない。","業務上知り得た秘密は正当な理由なく漏らしてはならず、宅建業を営まなくなった後も同じ義務を負う。","手付の貸付け・後払いなどの信用供与による契約の誘引、断定的判断の提供、威迫、深夜など迷惑な時間の勧誘は禁止。","犯罪収益移転防止法により、宅地建物の売買契約の締結やその代理・媒介では取引時確認を行い、記録を7年間保存する。"]}]},{"u":"重要事項説明・37条書面・8種制限","items":[{"n":"重要事項説明の方法","p":["契約成立前に宅建士が買主・借主等に35条書面を交付して説明する。売主・貸主への説明は不要で、説明場所の制限もない。","説明する宅建士は専任でなくてよい。35条書面には宅建士の記名が必要だが、押印は不要（2022年5月から）。","相手方の承諾があれば書面に代えて電磁的方法で提供でき、テレビ会議等を用いたIT重説も可能。","相手方が宅建業者の場合は35条書面の交付だけで足り、宅建士による説明は不要。","1つの取引に複数の宅建業者が関与するときは、全ての業者が重要事項の説明義務を負う。"]},{"n":"重要事項（売買・貸借共通）","p":["登記された権利の種類・内容・名義人、法令上の制限、私道負担（建物の貸借は不要）、飲用水・電気・ガス・排水施設の整備状況。","代金・借賃以外に授受される金銭の額と目的、契約の解除、損害賠償額の予定・違約金、支払金・預り金の保全措置。","造成宅地防災区域・土砂災害警戒区域・津波災害警戒区域内か否かと、水害ハザードマップにおける物件の所在地。","未完成物件は完成時の形状・構造。代金・借賃の額、引渡し時期、移転登記の時期は説明事項ではない（37条書面の事項）。","売買では手付金等の保全措置、ローンのあっせん内容と不成立時の措置、契約不適合責任の履行に関する保険等の措置も説明する。"]},{"n":"重要事項（建物・区分所有建物）","p":["石綿使用調査の結果が記録されていればその内容（調査の実施義務はない）。1981年5月31日以前に着工した建物は耐震診断の内容。","既存建物は建物状況調査の実施の有無と結果の概要。対象は1年以内（RC造等の共同住宅等は2年以内）に実施した調査。","既存建物の売買では設計図書・点検記録等の保存状況、新築住宅の売買では住宅性能評価を受けた旨も説明する。","区分所有建物の売買では敷地利用権、共用部分の規約、専有部分の用途制限、専用使用権、修繕積立金・管理費、管理委託先等。","区分所有建物の貸借では、専有部分の用途その他の利用制限に関する規約と管理の委託先が説明事項となる。"],"s":[2]},{"n":"重要事項（貸借）","p":["契約期間と更新、用途その他の利用制限、敷金など契約終了時に精算する金銭の扱い、管理の委託先の氏名・住所を説明する。","定期借地権・定期建物賃貸借・終身建物賃貸借であればその旨を説明する。","建物の貸借では台所・浴室・便所その他の設備の整備状況を説明する。","宅地の貸借では契約終了時の建物の取壊しに関する事項を説明する。","手付金等の保全措置、ローンのあっせん、契約不適合責任の履行措置は貸借では説明不要。"]},{"n":"37条書面","p":["契約成立後遅滞なく契約の両当事者に交付する。宅建士の記名が必要だが説明は不要。業者間取引でも省略できない。","必ず記載するのは当事者の氏名・住所、物件の特定、代金・借賃の額と支払時期・方法、引渡し時期、移転登記の申請時期（売買）。","既存建物の売買では、構造耐力上主要な部分等の状況について当事者双方が確認した事項も必ず記載する。","代金以外の金銭、契約の解除、損害賠償額の予定、天災等の危険負担、契約不適合責任、租税公課の負担等は定めがあれば記載。","相手方の承諾を得れば電磁的方法で提供できる（2022年5月から）。自ら貸主となる貸借には宅建業法が適用されない。"]},{"n":"8種制限の適用と他人物売買の制限","p":["8種制限は宅建業者が自ら売主となり、宅建業者以外が買主となる場合のみ適用。業者間取引や媒介・代理には適用されない。","8種は他人物等の契約制限、クーリング・オフ、損害賠償額の予定等、手付、担保責任の特約、手付金等保全、割賦の解除、所有権留保。","自己の所有に属しない物件は、取得する契約（予約を含む）を締結していれば売買できる。停止条件付きの取得契約では不可。","未完成物件は手付金等の保全措置を講じていれば売買契約を締結できる。"]},{"n":"クーリング・オフ","p":["事務所等以外の場所で買受けの申込み・契約をした買主は書面で撤回・解除できる。効力は書面を発した時に生じる。","事務所、専任宅建士の設置義務がある土地に定着した案内所、買主が申し出た自宅・勤務先での申込みは対象外。","申込みと契約の場所が異なるときは申込みの場所で判断する。テント張りの案内所や喫茶店での申込みは対象となる。","書面で告げられた日から8日を経過したとき、または引渡しを受け代金全額を支払ったときはできなくなる。","売主業者は損害賠償・違約金を請求できず、受領した手付金等を速やかに返還する。買主に不利な特約は無効。"],"s":[13]},{"n":"損害賠償額の予定・手付・担保責任特約","p":["損害賠償額の予定と違約金の合計が代金の20%を超える部分は無効。定めがなければ実際の損害額を請求できる。","手付は代金の20%を超えて受領できず、どのような名目でも解約手付の性質を持つ。買主に不利な特約は無効。","契約不適合責任の通知期間を引渡しから2年以上とする特約は有効。それ以外で民法より買主に不利な特約は無効。","割賦販売で賦払金の支払いがなくても、30日以上の期間を定めて書面で催告しなければ解除や残額の一括請求はできない。","割賦販売で代金の10分の3を超える額を受け取ったら、原則として所有権移転登記等をしなければならない（所有権留保の禁止）。"]},{"n":"手付金等の保全措置","p":["未完成物件は代金の5%超または1,000万円超、完成物件は10%超または1,000万円超の手付金等を受け取る前に保全措置が必要。","買主への所有権移転登記がされたときは保全措置は不要。","手付金等は契約締結日以後、引渡し前に支払われ代金に充当される金銭で、中間金も含む。","保全方法は銀行等による保証と保険会社の保証保険。指定保管機関による保管は完成物件に限って利用できる。","保全措置が講じられないときは、買主は手付金等を支払わなくても債務不履行にならない。"],"s":[13]}]},{"u":"報酬・監督処分・罰則・履行確保","items":[{"n":"報酬の上限（売買・交換）","p":["媒介の上限（税抜）は代金200万円以下が5%、200万円超400万円以下が4%＋2万円、400万円超が3%＋6万円（速算式）。","課税事業者は上限額の1.1倍、免税事業者は1.04倍まで受領できる。建物代金は消費税を除いた額で計算する。","代理は媒介上限の2倍まで。一方から代理、他方から媒介を受けても、双方から受ける合計は媒介上限の2倍が限度。","交換は価額の多い方を基準に計算する。依頼者の依頼による広告料や特別の依頼による費用は別に受領できる。","例：代金2,000万円の媒介は2,000万円×3%＋6万円＝66万円で、課税事業者は72万6,000円が上限となる。"],"s":[13]},{"n":"報酬の上限（貸借）","p":["貸借の媒介・代理で依頼者双方から受ける報酬の合計は、借賃1か月分（課税事業者は1.1か月分）が上限。","居住用建物の媒介では、依頼者の承諾がない限り一方から受けられるのは借賃の0.5か月分（税込0.55か月分）まで。","居住用建物以外の貸借で権利金の授受があれば、権利金を売買代金とみなして計算した額と借賃1か月分の高い方が上限。","居住用の0.5か月を超えるための承諾は、媒介の依頼を受けるに当たってあらかじめ得ておく必要がある。"],"s":[13]},{"n":"低廉な空家等・長期空家等の特例","p":["価格800万円以下の宅地・建物の売買・交換の媒介は、現地調査等の費用を含め30万円の1.1倍（33万円）まで受領できる。","特例の適用には、媒介契約の締結時にあらかじめ依頼者に説明し、合意を得ておく必要がある。","長期間使用されていない空家等の貸借の媒介では、貸主である依頼者から借賃1か月分の2.2倍まで受領できる。","2024年7月1日施行。改正前の売買の特例は400万円以下の物件で18万円（税抜）が上限だった。"],"s":[3,13]},{"n":"宅建業者への監督処分","p":["指示処分と業務停止処分（1年以内）は免許権者と業務地の知事が、免許取消処分は免許権者のみが行う。","欠格事由への該当、不正手段による免許取得、業務停止処分違反、情状が特に重い場合、1年以上の事業不開始・休止は必要的取消し。","処分には聴聞が必要。業務停止処分と免許取消処分は公告されるが、指示処分は公告されない。","大臣免許業者を重要事項説明等の消費者保護規定違反で処分するときは、あらかじめ内閣総理大臣に協議する。","事務所の所在地を確知できず、公告から30日を経過しても申出がない宅建業者は免許を取り消すことができる。"],"s":[13]},{"n":"宅建士への監督処分と罰則","p":["宅建士への指示と事務禁止（1年以内）は登録知事と行為地の知事が、登録消除は登録知事のみが行う。","不正手段による登録、事務禁止処分違反、情状が特に重い場合などは登録消除処分となる。","無免許営業・名義貸し・業務停止処分違反は3年以下の拘禁刑か300万円以下の罰金（併科可）、法人は1億円以下の罰金。","重要な事実の不告知・不実告知は2年以下の拘禁刑か300万円以下の罰金（併科可）、法人は1億円以下の罰金。","誇大広告は6か月以下の拘禁刑か100万円以下の罰金、37条書面の不交付は50万円以下の罰金、重説時の宅建士証不提示は10万円以下の過料。"],"s":[1]},{"n":"住宅瑕疵担保履行法","p":["宅建業者が自ら売主で宅建業者以外が買主となる新築住宅の売買では、保証金の供託か保険加入による資力確保措置が必要。","対象は構造耐力上主要な部分と雨水の浸入を防止する部分の瑕疵で、引渡しから10年間の担保責任に備える。","保険は保険金額2,000万円以上、有効期間10年以上で、保険料は売主である宅建業者が負担する。","保証金は過去10年間の供給戸数で算定（床面積55㎡以下は2戸で1戸）。契約締結までに供託所の所在地等を書面で説明する。","基準日（毎年3月31日）から3週間以内に状況を届け出ないと、基準日の翌日から50日経過後は新たな売買契約を締結できない。"],"s":[13]}]},{"u":"都市計画法","items":[{"n":"都市計画区域と区域区分","p":["都市計画区域は都道府県が指定し、2以上の都府県にわたる場合は国土交通大臣が指定する。市町村の区域にとらわれない。","準都市計画区域は都市計画区域外に都道府県が指定。区域区分・高度利用地区・特定街区・防火地域・準防火地域は定められない。","市街化区域は既成市街地とおおむね10年以内に優先的・計画的に市街化を図る区域、市街化調整区域は市街化を抑制すべき区域。","区域区分は原則として任意で、区域区分が定められていない都市計画区域を非線引き区域という。"]},{"n":"用途地域と補助的地域地区","p":["用途地域は住居系8・商業系2・工業系3の13種類。市街化区域には少なくとも用途地域を定め、市街化調整区域には原則定めない。","全ての用途地域で容積率を、商業地域以外で建ぺい率を定める。低層住居専用地域・田園住居地域では10mか12mの高さ限度を定める。","特別用途地区・高度地区・高度利用地区は用途地域内に定める。特定用途制限地域は用途地域のない区域（調整区域を除く）に定める。","高度地区は建築物の高さの最高・最低限度、高度利用地区は容積率の最高・最低限度や建ぺい率の最高限度等を定める。","高層住居誘導地区は第一種・第二種住居、準住居、近隣商業、準工業地域のうち容積率40/10か50/10の地域に定める。"]},{"n":"地区計画と都市計画の決定手続","p":["地区計画は用途地域が定められている区域のほか、用途地域が定められていない一定の区域にも定められる。","地区整備計画が定められた区域で土地の区画形質の変更や建築等を行う者は、着手の30日前までに市町村長に届け出る。","都市計画は都道府県または市町村が決定する。両者が抵触するときは都道府県の都市計画が優先する。","都市計画の案は2週間公衆の縦覧に供され、住民・利害関係人は意見書を提出できる。","土地所有者等は0.5ha以上の一団の土地について、所有者等の3分の2以上の同意を得て都市計画の決定等を提案できる。"]},{"n":"都市計画施設等の区域内の制限","p":["都市計画施設の区域・市街地開発事業の施行区域内で建築物を建築するには、原則として知事等の許可が必要。","軽易な行為、非常災害の応急措置、都市計画事業の施行として行う行為は許可不要。","階数2以下で地階がなく、主要構造部が木造等で容易に移転・除却できる建築物なら、知事等は許可しなければならない。","事業地内では、事業の障害となるおそれのある土地の形質変更、建築物の建築、5トン超の物件の設置等に知事等の許可が必要。","事業地内の土地建物等を有償で譲り渡そうとする者は、施行者に届け出なければならない（施行者が先買いできる）。"]},{"n":"開発行為と開発許可の要否","p":["開発行為は主に建築物の建築・特定工作物の建設のための土地の区画形質の変更。許可権者は知事（指定都市等は市長）。","市街化区域1,000㎡未満（三大都市圏の一部は500㎡未満）、非線引き区域・準都市計画区域3,000㎡未満、両区域外1ha未満は不要。","市街化調整区域は規模による例外がない。市街化区域以外では農林漁業用の建築物や農林漁業者の住宅のための開発行為は不要。","駅舎・図書館・公民館・変電所等の公益上必要な建築物、都市計画事業・土地区画整理事業、非常災害の応急措置は許可不要。","第一種特定工作物はコンクリートプラント等。第二種はゴルフコース（規模不問）と1ha以上の野球場・墓園・遊園地等。"],"s":[14]},{"n":"開発許可の手続と建築制限","p":["申請前に関係する公共施設の管理者と協議して同意を得る。新たに設置される公共施設の管理者となる者とも協議する。","許可・不許可は文書で通知する。工事完了公告前は、工事用の仮設建築物等の例外を除き建築物を建築できない。","工事完了公告後は予定建築物等以外の建築は原則不可。ただし用途地域等が定められていれば制限されない。","市街化調整区域の開発区域外で建築物の新築・改築・用途変更をするには知事等の許可が必要（農林漁業用等を除く）。","変更は許可（軽微な変更は届出）、廃止は届出。相続人等の一般承継人は地位を当然に承継し、特定承継は知事の承認が必要。"],"s":[14]}]},{"u":"建築基準法","items":[{"n":"単体規定と適用除外","p":["文化財保護法により国宝・重要文化財等に指定された建築物には建築基準法が適用されない。","改正の際に現存し新規定に適合しない建築物（既存不適格建築物）は違反とならず、増改築等の際に適合させる。","高さ20m超の建築物には避雷設備、高さ31m超の建築物には非常用の昇降機を設ける。","住宅の居室には原則として床面積の7分の1以上の採光、20分の1以上の換気に有効な開口部を設ける。","石綿等の飛散のおそれがある建築材料の使用は禁止。居室のある建築物にはクロルピリホスを添加した建材を使用できない。"]},{"n":"道路と接道義務","p":["道路は原則幅員4m以上（特定行政庁が指定する区域では6m以上）の道路法・都市計画法等による道路や位置指定道路。","幅員4m未満でも特定行政庁が指定した2項道路は道路とみなし、原則として中心線から2m後退した線を道路境界線とする。","敷地は道路に2m以上接しなければならない。周囲に広い空地がある等で特定行政庁の認定・許可を受けた場合は除く。","地方公共団体は条例で接道義務を付加できるが、緩和することはできない。","建築物は道路内に建築できない。地盤面下の建築物や、許可を受けた公衆便所・巡査派出所等は例外となる。"]},{"n":"用途制限","p":["神社・寺院・教会、保育所、診療所、公衆浴場、巡査派出所は全ての用途地域で建築できる。","住宅・共同住宅・図書館・老人ホームは工業専用地域では建築できない。","幼稚園・小中高校は工業地域・工業専用地域で不可。大学・病院は低層住居専用・田園住居・工業・工業専用地域で不可。","敷地が2以上の用途地域にまたがるときは、敷地の過半が属する地域の用途制限が敷地全体に適用される。","特定行政庁が許可すれば、本来建築できない用途地域でも建築できる。"]},{"n":"建ぺい率","p":["建ぺい率は建築面積の敷地面積に対する割合。商業地域は10分の8で、他の用途地域は都市計画で定める。","防火地域内の耐火建築物等、準防火地域内の耐火・準耐火建築物等は10分の1加算。特定行政庁指定の角地も10分の1加算。","建ぺい率10分の8の地域内かつ防火地域内の耐火建築物等は制限なし。巡査派出所・公衆便所等も適用除外。","敷地が建ぺい率の異なる地域にまたがるときは、各部分の面積の割合に応じて加重平均する。","敷地が防火地域の内外にわたり敷地内の建築物が全て耐火建築物等なら、敷地全体を防火地域内とみなして緩和を適用する。"],"s":[14]},{"n":"容積率","p":["前面道路の幅員が12m未満なら、幅員に住居系は10分の4、その他は10分の6を乗じた数値と指定容積率の小さい方となる。","前面道路が2以上あるときは、最も幅員の大きい道路を基準とする。","住宅等の地階は住宅部分の床面積の3分の1まで、共同住宅の共用廊下・階段とエレベーターの昇降路は全て延べ面積に不算入。","自動車車庫等は延べ面積の5分の1まで不算入。敷地が容積率の異なる地域にまたがるときは加重平均で算定する。","幅員15m以上の特定道路に接続する幅員6m以上12m未満の前面道路で、特定道路から70m以内の敷地は容積率が緩和される。"],"s":[14]},{"n":"高さ制限と日影規制","p":["第一種・第二種低層住居専用地域と田園住居地域では、建築物の高さは都市計画で定めた10mか12mを超えられない。","道路斜線制限は全区域に適用される。隣地斜線制限は低層住居専用地域・田園住居地域以外に適用される。","北側斜線制限は低層住居専用・田園住居・中高層住居専用地域に適用（中高層住居専用で日影規制の対象区域は除く）。","日影規制は商業・工業・工業専用地域以外で条例で指定。低層系は軒高7m超か地階を除く3階以上、他は高さ10m超が対象。","対象区域外の高さ10m超の建築物でも、冬至日に対象区域内に日影を生じさせるものは規制を受ける。"]},{"n":"防火地域・準防火地域","p":["防火地域では階数3以上（地階を含む）または延べ面積100㎡超は耐火建築物等、それ以外は準耐火建築物等とする。","準防火地域では地階を除く階数4以上または延べ1,500㎡超は耐火建築物等、500㎡超1,500㎡以下は準耐火建築物等以上。","防火地域・準防火地域内で外壁が耐火構造の建築物は、外壁を隣地境界線に接して設けることができる。","防火地域内の看板等で、屋上に設けるものや高さ3m超のものは主要部分を不燃材料で造るか覆う。","建築物が防火地域・準防火地域・指定のない区域にわたるときは、原則として最も厳しい地域の規定を建築物全体に適用する。"]},{"n":"建築確認（2025年改正後）","p":["2025年4月から、階数2以上または延べ面積200㎡超の建築物は構造を問わず全国で新築・増改築・大規模修繕等に確認が必要。","用途に供する床面積200㎡超の特殊建築物も全国で対象。平屋かつ200㎡以下の建築物は都市計画区域等内の新築等のみ対象。","防火・準防火地域外の10㎡以内の増改築・移転は確認不要。200㎡超の特殊建築物への用途変更は必要（類似用途間は不要）。","審査期間は特殊建築物や階数2以上・200㎡超の建築物が35日以内、平屋200㎡以下の建築物が7日以内。","完了検査は工事完了から4日以内に申請し、受理から7日以内に検査。特殊建築物等は検査済証の交付まで原則使用できない。"],"s":[2,14]}]},{"u":"国土法・農地法・盛土・区画整理","items":[{"n":"国土利用計画法の事後届出","p":["市街化区域2,000㎡以上、その他の都市計画区域5,000㎡以上、都市計画区域外10,000㎡以上の土地売買等の契約で届出が必要。","権利取得者（買主）が契約締結日から2週間以内に市町村長を経由して知事に届け出る。一団の土地は買主の取得面積で判断。","対価のある権利の移転・設定が対象。相続・贈与・時効取得・抵当権設定や、当事者の一方が国等の場合は届出不要。","知事は利用目的について届出から3週間以内に勧告できる。対価の額は勧告対象外で、勧告に従わないときは公表できる。","無届は6か月以下の拘禁刑または100万円以下の罰金。届出がなくても、勧告に従わなくても契約は有効。"],"s":[14]},{"n":"注視区域・監視区域の事前届出","p":["注視区域・監視区域では契約締結前に当事者双方が届け出る（事後届出は不要）。区域の指定期間は5年以内。","注視区域の届出対象面積は事後届出と同じ。監視区域は知事が規則で定める面積で、事後届出より小さい。","知事は届出から6週間以内に契約の中止、予定対価の引下げ、利用目的の変更を勧告できる。","予定対価の増額や利用目的の変更をするときは再度の届出が必要。予定対価の減額のみなら不要。","規制区域では知事の許可が必要で、許可を受けずに締結した契約は無効となる。"],"s":[14]},{"n":"農地法3条の許可","p":["農地・採草放牧地を農地等のまま権利移動するには農業委員会の許可が必要。市街化区域内でも届出による特例はない。","農地か否かは登記簿の地目ではなく現況で判断する。休耕地でもいつでも耕作できる状態なら農地となる。","相続・遺産分割・包括遺贈・相続人への特定遺贈による取得は許可不要だが、遅滞なく農業委員会に届け出る。","抵当権の設定は許可不要。競売による取得、相続人以外への特定遺贈、賃貸借の設定は許可が必要。","許可のない3条の契約は効力を生じない。農地の賃貸借は登記がなくても引渡しがあれば第三者に対抗できる。"],"s":[14]},{"n":"農地法4条・5条の許可","p":["農地の転用は4条、転用目的の権利移動は5条の許可が必要で、許可権者は知事（指定市町村の区域では市町村長）。","市街化区域内では、あらかじめ農業委員会に届け出れば4条・5条の許可は不要となる。","農業者が2アール未満の農地を農業用施設に転用する場合は4条の許可不要。採草放牧地の転用は4条の対象外。","一時的な資材置場としての貸付けも転用目的の権利移動として許可が必要。国・都道府県等は知事との協議成立で許可とみなす。","無許可転用には原状回復命令等。罰則は3年以下の拘禁刑か300万円以下の罰金で、法人の転用違反は1億円以下の罰金。"],"s":[14]},{"n":"盛土規制法の許可","p":["宅地造成等工事規制区域は知事（指定都市・中核市は市長）が指定し、区域内の宅地造成・特定盛土等・土石の堆積は許可制。","許可が必要な規模は、盛土で高さ1m超の崖、切土で2m超の崖、盛土と切土で2m超の崖、崖を生じない高さ2m超の盛土。","盛土・切土の面積が500㎡超の場合も許可が必要。2023年5月施行の改正で宅地以外の農地や森林での盛土等も規制対象となった。","高さ5m超の擁壁や面積1,500㎡超の排水施設は有資格者が設計する。工事完了から4日以内に完了検査を申請する。","無許可工事は3年以下の拘禁刑か1,000万円以下の罰金、法人は3億円以下の罰金。"],"s":[14]},{"n":"盛土規制法の届出と区域","p":["規制区域の指定の際に既に工事中の工事主は、指定日から21日以内に知事に届け出る。","高さ2m超の擁壁や崖面崩壊防止施設、排水施設等の除却工事は、着手の14日前までに届け出る。","公共施設用地を宅地や農地等に転用した者は、転用日から14日以内に届け出る。","特定盛土等規制区域では一定規模の盛土等は工事着手の30日前までに届出、さらに大規模なものは許可が必要となる。","土地の所有者等は土地を常時安全な状態に維持するよう努める。知事は勧告や改善命令ができる。"],"s":[14]},{"n":"区画整理の施行者と建築制限","p":["施行者は個人、土地区画整理組合、区画整理会社、地方公共団体、国土交通大臣、都市再生機構、地方住宅供給公社。","組合は宅地の所有者・借地権者が7人以上共同で設立し、所有者・借地権者それぞれの3分の2以上の同意を得て知事の認可を受ける。","組合が施行する場合、施行地区内の宅地の所有者・借地権者は全て組合員となる。","事業計画の認可等の公告から換地処分の公告まで、事業の障害となる土地の形質変更・建築・5トン超の物件の設置は知事等の許可が必要。"],"s":[14]},{"n":"仮換地と換地処分","p":["仮換地の指定後は仮換地を使用収益でき、従前の宅地は使用収益できなくなる。従前の宅地の売却や抵当権設定はできる。","換地処分は関係権利者への通知で行い、原則として換地計画区域の全部の工事完了後に遅滞なく行う。","公告の翌日から換地は従前の宅地とみなされる。換地を定めなかった従前の宅地の権利は公告日の終了時に消滅する。","保留地は公告の翌日に施行者が取得し、清算金も翌日に確定する。地役権は原則として従前の宅地上に存続する。","公告後は施行者が遅滞なく変動に係る登記を申請（嘱託）し、それまでは原則として他の登記ができない。"],"s":[14]}]},{"u":"税と価格の評定","items":[{"n":"不動産取得税","p":["不動産所在地の都道府県が課税。相続・法人の合併・包括遺贈による取得は非課税だが、贈与や交換による取得は課税される。","課税標準は固定資産課税台帳の価格。宅地評価土地は2027年3月31日までの取得なら課税標準を2分の1とする特例がある。","標準税率は4%で、住宅と土地の取得は2027年3月31日まで3%に軽減される。","免税点は課税標準額で土地10万円未満、家屋の建築23万円未満、売買等によるその他の家屋12万円未満。","新築住宅は1戸1,200万円（認定長期優良住宅は1,300万円）控除。2026年4月以後の新築は床面積40㎡以上240㎡以下が要件。"],"s":[12]},{"n":"固定資産税","p":["市町村（東京23区は都）が課税。賦課期日は1月1日で、その日現在に固定資産課税台帳に登録された所有者が納税義務者。","標準税率は1.4%。免税点は課税標準額で土地30万円未満、家屋20万円未満。","住宅用地は200㎡以下の部分（小規模住宅用地）が価格の6分の1、200㎡を超える部分が3分の1を課税標準とする。","新築住宅は120㎡までの部分の税額を3年度分（中高層耐火住宅等は5年度分）2分の1に減額。2026年4月以後は40〜240㎡が要件。","質権や100年より長い地上権の目的である土地は、質権者・地上権者が納税義務者。価格の不服は固定資産評価審査委員会に審査申出。"],"s":[11]},{"n":"登録免許税","p":["課税標準は固定資産課税台帳の価格（抵当権は債権額）。本則は保存0.4%、売買・贈与等の移転2%、相続0.4%、抵当権設定0.4%。","土地の売買による所有権移転登記は、2029年3月31日までなら1.5%に軽減される（2026年度改正で延長）。","住宅用家屋は保存0.15%、売買・競落による移転0.3%、住宅取得資金の抵当権設定0.1%（2027年3月31日まで）。","住宅用家屋の軽減は、個人が自己の居住用に新築・取得し、床面積50㎡以上で、新築・取得後1年以内に登記する場合に限る。","軽減には市町村等の証明書を申請時に添付する。認定長期優良住宅・認定低炭素住宅は0.1%（長期優良の戸建ての移転は0.2%）。"],"s":[10]},{"n":"印紙税","p":["不動産譲渡契約書（記載金額10万円超）と建設工事請負契約書（100万円超）は2027年3月31日まで軽減税率が適用される。","軽減後は500万円超1,000万円以下が5千円、1,000万円超5,000万円以下が1万円、5,000万円超1億円以下が3万円。","記載金額1万円未満の契約書は非課税。土地の賃貸借契約書は課税文書だが、建物の賃貸借契約書は課税されない。","交換契約書は双方の価額のうち高い方、交換差金のみの記載ならその額が記載金額。贈与契約書は記載金額のない文書で200円。","国・地方公共団体が作成した文書は非課税。印紙を貼らなかったときの過怠税は税額の3倍（自主的に申し出れば1.1倍）。"],"s":[9]},{"n":"譲渡所得と3,000万円特別控除","p":["譲渡した年の1月1日に所有期間5年超なら長期、5年以下なら短期の分離課税。所得税率は長期15%・短期30%（別に住民税）。","居住用財産の3,000万円特別控除は所有期間を問わない。住まなくなった日から3年を経過する年の12月31日までの譲渡が対象。","配偶者・直系血族、生計を一にする親族、内縁関係者、特殊関係法人など特別の関係がある者への譲渡には適用されない。","前年・前々年に同じ特例や損益通算等の特例を受けていると不可。収用等の特別控除など他の特例とも重ねて使えない。","この特例を受けると、入居年とその前2年・後3年の間の譲渡については住宅ローン控除を受けられない。"],"s":[7]},{"n":"軽減税率と買換え特例","p":["所有期間10年超の居住用財産を譲渡したときは、課税長期譲渡所得6,000万円以下の部分の所得税率が10%に軽減される。","軽減税率の特例は3,000万円特別控除と併用できる。前年・前々年に同じ特例を受けていると適用できない。","特定の居住用財産の買換え特例は2027年12月31日までの譲渡が対象（2026年度改正で2年延長）。課税は将来に繰り延べられる。","譲渡資産は居住期間10年以上・所有期間10年超・譲渡対価1億円以下。買換資産は床面積50㎡以上・敷地500㎡以下。","買換資産は譲渡の前年から翌年までに取得する。買換え特例は3,000万円特別控除や軽減税率とは選択適用となる。"],"s":[5,8]},{"n":"住宅ローン控除","p":["2026年度改正で入居期限が2030年12月31日まで延長。控除率は年末残高の0.7%、所得要件は合計所得2,000万円以下。","新築等の借入限度額は認定住宅4,500万円・ZEH水準3,500万円、省エネ基準適合は2027年入居まで2,000万円で、控除期間13年。","子育て・若者夫婦世帯は新築の認定住宅5,000万円・ZEH水準4,500万円・省エネ基準適合3,000万円に上乗せされる。","既存住宅は認定住宅・ZEH水準3,500万円、省エネ基準適合2,000万円で控除期間13年。その他の既存住宅は2,000万円で10年。","床面積は原則50㎡以上。合計所得1,000万円以下の年は40㎡以上50㎡未満も対象（2026年以後の入居）。"],"s":[5]},{"n":"住宅取得等資金の贈与と相続時精算課税","p":["直系尊属からの住宅取得等資金の贈与は、省エネ等住宅1,000万円、その他の住宅500万円まで非課税（2026年12月31日までの贈与）。","受贈者は贈与年の1月1日に18歳以上、合計所得2,000万円以下（床面積40㎡以上50㎡未満なら1,000万円以下）。","床面積40㎡以上240㎡以下で2分の1以上を居住用とし、翌年3月15日までに新築等をして居住（見込みを含む）する必要がある。","非課税額以下でも申告が必要。非課税額は贈与者の相続税の課税価格に加算されず、暦年課税・相続時精算課税と併用できる。","相続時精算課税は60歳以上の父母・祖父母から18歳以上の子・孫への贈与で特別控除2,500万円。住宅取得資金なら贈与者の年齢不問。"],"s":[6]},{"n":"地価公示法","p":["土地鑑定委員会が公示区域内の標準地について毎年1月1日時点の正常価格を判定し、官報で公示する。","公示区域は都市計画区域その他の土地取引が相当程度見込まれる区域で、国土利用計画法の規制区域を除く。","標準地の価格は2人以上の不動産鑑定士の鑑定評価を求め、その結果を審査・調整して判定する。","鑑定評価では近傍類地の取引価格、近傍類地の地代等から算定される推定の価格、同等の効用をもつ土地の造成費の推定額を勘案する。","正常価格は建物や使用収益を制限する権利がないものとした価格。土地取引を行う者は公示価格を指標とするよう努める。"]},{"n":"不動産鑑定評価基準","p":["価格の種類は正常価格・限定価格・特定価格・特殊価格。借地権者による底地の併合や隣接地の併合では限定価格を求める。","特定価格は証券化対象不動産の評価や民事再生法による早期売却等、特殊価格は文化財等の市場性を有しない不動産の価格。","原価法は再調達原価に減価修正を行う。減価修正は耐用年数に基づく方法と観察減価法を併用する。","取引事例比較法は事情補正・時点修正ができる事例を用い、投機的取引の事例は用いない。","収益還元法には直接還元法とDCF法があり、自用の不動産にも適用できる。原則として複数の手法を併用する。"]}]},{"u":"免除科目と試験制度","items":[{"n":"試験の形式と5問免除","p":["四肢択一式50問を2時間（13時〜15時）で解答するマークシート方式。受験資格の制限はない。","出題は権利関係14問、法令上の制限8問、税・価格の評定3問、宅建業法20問、免除科目5問（問46〜50）の構成。","登録講習修了者は問46〜50の5問が免除され、45問を13時10分〜15時の1時間50分で解答する。","2026年度は10月18日（日）実施、受験手数料8,200円、合格発表は11月25日。ネット申込みは7月1日〜31日、郵送は7月15日まで。","合格基準点は毎年の結果を踏まえて決まる。法令はその年の4月1日時点で施行されているものから出題される。"],"s":[0,1]},{"n":"住宅金融支援機構","p":["証券化支援業務（買取型）は民間金融機関の長期固定金利住宅ローン（フラット35）の債権を買い取り、MBSを発行して資金を得る。","買取対象は本人や親族が住む住宅の建設・購入資金で、付随する土地の取得資金も含む。賃貸用住宅の資金は対象外。","直接融資は災害復興住宅、子育て世帯・高齢者向け賃貸住宅、マンション共用部分の改良など民間では困難な分野に限られる。","団体信用生命保険業務を行い、債務者が死亡した場合などに保険金を住宅ローンの弁済に充てる。","高齢者が自ら住む住宅のバリアフリー改良等の融資では、元金を本人の死亡時に一括償還する方法がある。"]},{"n":"不動産の表示に関する公正競争規約","p":["徒歩所要時間は道路距離80mにつき1分で、1分未満の端数は1分に切り上げる。","新築とは建築工事完了後1年未満で居住の用に供されたことがないもの。面積は1㎡未満を切り捨てて表示できる。","取引態様は「売主」「貸主」「代理」「媒介（仲介）」の用語で表示する。","道路に2m以上接していない土地は「再建築不可」等と明示する。セットバック部分が面積のおおむね10%以上なら面積を明示。","二重価格表示の比較価格は値下げ直前に2か月以上公表していた価格に限り、値下げから6か月以内に限り表示できる。"]},{"n":"景品表示法と景品規約","p":["実際のものより著しく優良・有利であると誤認される表示は不当表示として禁止され、故意・過失は問わない。","実在しない物件や取引する意思のない物件の広告（おとり広告）は不当表示に当たる。","違反には消費者庁長官のほか都道府県知事も措置命令を出せる。","懸賞による景品は取引価額の20倍か10万円の低い方が上限で、総額は取引予定総額の2%以内。","懸賞によらない景品（総付景品）は取引価額の10分の1か100万円の低い方が上限。"]},{"n":"統計の出題","p":["問48は地価公示、建築着工統計、法人企業統計、土地白書、宅建業者数などの直近の数値から出題される。","地価公示は全国の全用途平均・住宅地・商業地の変動率の上昇・下落と、それが何年連続かが問われやすい。","建築着工統計は新設住宅着工戸数の総数と、持家・貸家・分譲住宅それぞれの前年比の増減が問われる。","法人企業統計は不動産業の売上高・経常利益の前年度比の増減が、土地白書は土地取引件数の推移が問われる。","宅建業者数は国土交通省が公表する年度末時点の業者数と、前年からの増減が問われる。"]},{"n":"土地","p":["台地・段丘は水はけがよく地盤も安定しており宅地に適する。ただし縁辺部は崖崩れに注意が必要。","低地は洪水や地震に弱い。旧河道・後背湿地・埋立地・干拓地は液状化や浸水の危険が高い。","扇状地は砂礫層で水はけがよいが、谷の出口にあり土石流の危険がある。自然堤防は低地の中では比較的宅地に適する。","丘陵地を切土・盛土した造成地では、盛土部分や切土と盛土の境目で地盤沈下・不同沈下が生じやすい。","崖錐や地すべり地は崩壊の危険がある。地形図では等高線の間隔が狭いほど傾斜が急である。"]},{"n":"建物","p":["木造は湿気に弱く、土台や柱脚部には防腐・防蟻措置が必要。筋かい等の耐力壁はつり合いよく配置する。","鉄筋コンクリート造は鉄筋とコンクリートの熱膨張率がほぼ等しく一体化する。コンクリートのアルカリ性が鉄筋の錆を防ぐ。","鉄骨造は不燃だが高温で強度が落ちるため耐火被覆が必要。鋼材は錆びやすく防錆処理を要する。","免震構造は建物と基礎の間に免震装置を設けて揺れを伝えにくくし、制震構造はダンパー等で揺れを吸収する。","軟弱地盤では杭基礎を用いる。1981年6月施行の新耐震基準は震度6強〜7程度でも倒壊しないことを目標とする。"]}]}]},{"id":"fp2","name":"FP2級","full":"2級ファイナンシャル・プランニング技能検定","group":"資格試験","desc":"家計・保険・金融・税・不動産・相続を横断する国家検定2級","asOf":"2026年6月〜2027年5月実施分の法令基準日（2026年4月1日）に基づき、2026年度税制改正の成立内容を補記","aliases":["FP2級","2級FP技能検定","2級FP技能士","ファイナンシャルプランナー2級","FP技能検定2級"],"sources":[{"t":"日本FP協会「2級FP技能検定（資産設計提案業務）の概要」","u":"https://www.jafp.or.jp/exam/app/howto/files/outline_2fp.pdf"},{"t":"日本FP協会「FP技能検定 試験概要」","u":"https://www.jafp.or.jp/exam/app/howto/files/outline_fp.pdf"},{"t":"金融財政事情研究会「FP技能検定2級」","u":"https://products.kinzai.or.jp/exam/fp-2kyu/"},{"t":"日本FP協会「2026年度CBT試験の実施期間」","u":"https://www.jafp.or.jp/exam/schedule/files/cbt_2026.pdf"},{"t":"LEC「FP2級試験の概要」","u":"https://www.lec-jp.com/fp/2fp_afp/about/"},{"t":"財務省「令和8年度税制改正の概要」","u":"https://www.mof.go.jp/tax_policy/tax_reform/outline/fy2026/explanation/PDF/p0003-0010.pdf"},{"t":"財務省パンフレット「令和8年度税制改正」個人所得課税","u":"https://www.mof.go.jp/tax_policy/publication/brochure/zeisei2026_pdf/zeisei26_01.pdf"},{"t":"財務省パンフレット「令和8年度税制改正」消費課税","u":"https://www.mof.go.jp/tax_policy/publication/brochure/zeisei2026_pdf/zeisei26_03.pdf"},{"t":"財務省広報誌「ファイナンス」2026年4月号","u":"https://www.mof.go.jp/public_relations/finance/202604/202604c.pdf"},{"t":"SmartHR Mag.「令和8年度税制改正と年末調整」","u":"https://mag.smarthr.jp/hr/procedure/nencho_zeiseikaisei_2026/"},{"t":"解決ジャーナル「令和8年度改正による基礎控除の引上げ等（国税庁のお知らせ）」","u":"https://www.kaiketsu-j.com/procedure/21854/"},{"t":"解決ジャーナル「130万円の壁が変わる 2026年改正の契約ベース判定」","u":"https://www.kaiketsu-j.com/procedure/21502/"},{"t":"FP2級実技（生保顧客資産相談業務）公表試験問題","u":"https://fp2-siken.com/pdf/2026_5_seiho.pdf"},{"t":"FP2級実技（個人資産相談業務）公表試験問題","u":"https://fp2-siken.com/pdf/2026_5_kojin.pdf"},{"t":"FP1級学科（応用編）公表試験問題","u":"https://fp1-siken.com/pdf/2026_5_oyo.pdf"}],"units":[{"u":"A：ライフプランと資金計画","items":[{"n":"FP2級試験の形式と法令基準日","p":["2025年度（2025年4月）から学科・実技ともCBT方式に完全移行し、紙試験は原則行わない。休止期間を除き随時受検できる","学科は120分・60問の四答択一式で、60点満点中36点以上が合格。受検手数料は学科5,700円、実技6,000円（非課税）","日本FP協会の実技は資産設計提案業務の1科目で、90分・40問、100点満点中60点以上が合格","きんざいの実技は個人資産・中小事業主資産・生保顧客資産・損保顧客資産相談業務から1つ選び、事例5題で50点満点中30点以上","法令基準日は6〜12月実施分がその年4月1日、1〜5月実施分が前年4月1日。2026年6月〜2027年5月実施分は2026年4月1日"],"s":[0,1,2,3,4,13]},{"n":"FPの職業倫理と関連業法","p":["顧客利益の優先、守秘義務、説明責任（アカウンタビリティ）、顧客の同意（インフォームド・コンセント）が職業倫理の柱","税理士でないFPは有償・無償を問わず個別具体的な税務相談や税務書類の作成ができない。一般的な税制の解説は可能","弁護士でないFPは具体的な法律判断や代理交渉ができないが、公正証書遺言の証人や任意後見人にはなれる","投資助言・代理業の登録がなければ個別の投資判断の助言はできず、保険募集人の登録がなければ保険の募集はできない","社会保険労務士でないFPも年金見込額の試算はできるが、年金請求書など手続書類の作成・提出代行を業として行えない"]},{"n":"キャッシュフロー表と個人BS","p":["可処分所得は年収から所得税・住民税・社会保険料を差し引いた額。生命保険料や住宅ローン返済額は差し引かない","将来の収入・支出は「現在値×（1＋変動率）^経過年数」で求め、物価上昇率や昇給率を反映させる","年末の貯蓄残高は「前年末残高×（1＋運用利率）±その年の年間収支」で計算する","個人バランスシートの資産は時価で計上し、生命保険は解約返戻金相当額で評価する。純資産＝資産－負債"]},{"n":"6つの係数","p":["終価係数は元本を複利運用した将来の元利合計を求め、その逆数の現価係数は目標額に必要な現在の元本を求める","年金終価係数は毎年一定額を積み立てた将来の合計額を求め、その逆数の減債基金係数は目標額のための毎年の積立額を求める","資本回収係数は元本を運用しながら取り崩す毎年の受取額や、借入金の毎年の返済額を求める","年金現価係数は毎年一定額を受け取るのに必要な現在の元本を求める。資本回収係数とは逆数の関係"]},{"n":"教育資金の準備","p":["国の教育ローン（日本政策金融公庫）は学生1人350万円以内（自宅外通学・海外留学等は450万円以内）、返済は最長18年","日本学生支援機構の貸与奨学金は第一種が無利息、第二種が有利息（在学中は無利息）で、学力・家計の基準がある","高等教育の修学支援新制度は授業料等減免と給付型奨学金の組合せ。2025年度から多子世帯は所得制限なしで一定額まで無償","こども（学資）保険は契約者の親が死亡・高度障害になると以後の保険料が免除され、祝金・満期金は予定どおり受け取れる"]},{"n":"住宅ローンの金利と返済","p":["変動金利型は一般に金利を半年ごとに見直し、返済額は5年ごとに見直す。新返済額は従前の1.25倍が上限で未払利息に注意","元利均等返済は毎回の返済額が一定で当初は利息の割合が大きい。元金均等返済は当初の返済額が多いが総返済額は少ない","フラット35は全期間固定金利で、融資額100万〜8,000万円（購入価額以内）、返済期間15年以上35年以内。保証料は不要","繰上げ返済は期間短縮型の方が返済額軽減型より利息の軽減効果が大きく、実行時期が早いほど効果が大きい","団体信用生命保険は債務者の死亡・高度障害で残債が弁済される。フラット35では加入は任意（機構団信の保険料は金利に含む）"]},{"n":"ローン・カードと法人の資金調達","p":["貸金業法の総量規制で貸金業者からの個人の借入は原則年収の3分の1まで。銀行カードローンや住宅ローンは対象外","クレジットカードの所有権はカード会社にあり本人以外は使えない。リボ払いは利用額にかかわらず毎月ほぼ一定額を返済する","中小法人の資金調達は銀行借入などの間接金融と、株式・社債発行などの直接金融に分かれる。少人数私募債は50人未満に発行","信用保証協会の保証には保証料が必要で、融資額の原則80%を保証する責任共有制度がある","ABL（動産・売掛債権担保融資）は在庫や売掛金を担保とする融資で、不動産担保に乏しい企業でも利用しやすい"]}]},{"u":"A：社会保険","items":[{"n":"健康保険の主な給付","p":["医療費の自己負担は小学校入学前2割、70歳未満3割、70〜74歳2割（現役並み所得者は3割）","高額療養費は70歳未満・標準報酬月額28万〜50万円の場合、80,100円＋（総医療費－267,000円）×1%が自己負担限度額","傷病手当金は連続3日の待期の後4日目から支給。日額は直近12か月の標準報酬月額の平均÷30×2/3で、通算1年6か月","出産手当金は産前42日（多胎98日）・産後56日の休業に標準報酬日額相当の2/3。出産育児一時金は原則50万円","国民健康保険には原則として傷病手当金・出産手当金がない。健康保険の埋葬料は5万円"]},{"n":"保険料と被保険者・被扶養者","p":["健康保険料・厚生年金保険料は標準報酬月額と標準賞与額に料率を掛けて労使折半。厚生年金の保険料率は18.3%で固定","標準報酬月額の上限は健康保険139万円、厚生年金65万円。産前産後休業・育児休業中は本人・事業主とも保険料が免除","短時間労働者は従業員51人以上の企業で週20時間以上・月額賃金8.8万円以上などを満たすと加入対象（学生は除く）","被扶養者は原則年収130万円未満（60歳以上・障害者は180万円未満）。2025年10月から19歳以上23歳未満は150万円未満","2026年4月から被扶養者の年収は労働契約の賃金で判定し、契約外の残業代など臨時収入で超えても原則認定が続く"],"s":[11]},{"n":"退職後の医療保険と後期高齢者","p":["任意継続被保険者は資格喪失日の前日まで継続2か月以上の加入が要件で、喪失日から20日以内に申し出て最長2年加入できる","任意継続の保険料は事業主負担がなく全額自己負担。2022年1月から本人の申出により任意に脱退できる","退職後は任意継続・国民健康保険・家族の被扶養者のいずれかを選ぶ。国民健康保険には被扶養者の仕組みがない","後期高齢者医療制度は75歳以上（一定の障害があれば65歳以上）が対象。窓口負担は1割、一定以上所得2割、現役並み3割"]},{"n":"介護保険","p":["第1号被保険者は65歳以上、第2号は40歳以上65歳未満の医療保険加入者。第2号は特定疾病が原因の場合のみ給付を受ける","要介護（1〜5）・要支援（1・2）の認定は市町村が行い、原則として申請から30日以内に結果を通知する","自己負担は原則1割で、一定以上の所得者は2割または3割。ケアプランの作成費用は自己負担がない","第1号の保険料は年金額が年18万円以上なら年金から特別徴収。第2号は医療保険の保険料と合わせて徴収される"],"s":[14]},{"n":"労災保険","p":["保険料は全額事業主負担で、パート・アルバイトを含む全労働者が対象。役員や自営業者は特別加入制度で加入できる","業務災害と通勤災害が対象。療養（補償）給付は労災指定病院なら自己負担なしで治療を受けられる","休業（補償）給付は休業4日目から給付基礎日額の60%で、さらに休業特別支給金20%が上乗せされる","業務災害による休業の初日から3日間は、事業主が労働基準法に基づき平均賃金の60%の休業補償を行う"]},{"n":"雇用保険の基本手当","p":["受給には原則、離職日以前2年間に被保険者期間12か月以上が必要。倒産・解雇等による離職は1年間に6か月以上でよい","自己都合退職の所定給付日数は被保険者期間10年未満90日、10年以上20年未満120日、20年以上150日","待期は7日間。自己都合退職の給付制限は2025年4月から原則1か月（5年間で3回以上の場合は3か月）","受給期間は原則離職日の翌日から1年。65歳以上の離職者には一時金の高年齢求職者給付金（30日分または50日分）","基本手当日額は賃金日額のおおむね50〜80%（60〜64歳は45〜80%）で、年齢区分ごとに上限額がある"]},{"n":"雇用継続・育児・介護の給付","p":["高年齢雇用継続基本給付金は60〜64歳の賃金が60歳時の75%未満で支給。2025年4月以降に60歳になった人は最大で賃金の10%","育児休業給付金は休業開始から180日まで賃金の67%、以後50%。原則子が1歳（延長で最長2歳）になるまで","2025年4月創設の出生後休業支援給付金は両親が14日以上休業すると13%上乗せ（最大28日）。育児時短就業給付は賃金の10%","介護休業給付金は休業開始時賃金日額の67%で、対象家族1人につき通算93日・3回まで分割して受けられる","教育訓練給付は一般教育訓練で受講費用の20%（上限10万円）。専門実践教育訓練は最大80%まで給付される"],"s":[14]}]},{"u":"A：公的年金と企業年金","items":[{"n":"国民年金の被保険者と保険料","p":["第1号は20歳以上60歳未満の自営業者・学生等、第2号は厚生年金加入者、第3号は第2号に扶養される20歳以上60歳未満の配偶者","第2号からは65歳以上で老齢年金の受給権がある者を除く。第3号は本人の保険料負担がない","第1号の保険料は定額で翌月末日が納期限、時効は2年。最大2年分を前納でき、前納期間が長いほど割引が大きい","国民年金保険料は年度ごとに改定され、2025年度は月額17,510円","60歳以降も受給資格期間や満額に不足する者は65歳まで任意加入でき、任意加入中は付加保険料も納付できる"]},{"n":"保険料の免除・猶予と追納","p":["申請免除は全額・4分の3・半額・4分の1の4種類。全額免除期間は2009年4月以降分が年金額に2分の1反映される","学生納付特例（本人の所得で判定）と納付猶予（50歳未満、本人と配偶者の所得）は受給資格期間に算入されるが年金額には反映されない","免除・猶予された保険料は10年以内なら追納でき、3年度目以降の追納には加算額が上乗せされる","第1号の産前産後期間（出産予定月の前月から4か月）は保険料が免除され、保険料納付済期間として扱われる","障害基礎年金の受給者や生活保護の生活扶助の受給者は、届け出により法定免除となる"]},{"n":"老齢基礎年金と繰上げ・繰下げ","p":["受給資格期間は保険料納付済期間・免除期間・合算対象期間の合計10年以上。合算対象期間は年金額に反映されない","年金額は満額×保険料納付済月数等÷480で計算する。満額は毎年度改定され、2025年度は831,700円（67歳以下の場合）","繰上げは60〜64歳で請求でき、減額率は1か月0.4%（1962年4月2日以後生まれ）。60歳0か月なら24%減額","繰下げは66歳以後に申し出て1か月0.7%増額し、75歳まで繰り下げると84%増。老齢厚生年金と別々に繰り下げられる","繰上げは老齢厚生年金と同時に請求する必要があり、減額は生涯続く。繰上げ後は寡婦年金を受けられない"],"s":[12,13]},{"n":"老齢厚生年金と加給年金","p":["65歳からの老齢厚生年金は、老齢基礎年金の受給資格を満たし厚生年金の加入期間が1か月以上あれば受給できる","報酬比例部分は平均標準報酬額×5.481/1000×2003年4月以後の月数（それ以前の期間は平均標準報酬月額×7.125/1000）","特別支給の老齢厚生年金は加入1年以上で支給。男性は1961年4月2日以後、女性は1966年4月2日以後の生まれは対象外","加給年金は厚生年金加入20年以上の者に、生計を維持する65歳未満の配偶者や18歳到達年度末までの子がいると加算","配偶者が65歳になると加給年金は終了し、配偶者が1966年4月1日以前生まれなら配偶者の老齢基礎年金に振替加算がつく"],"s":[14]},{"n":"在職老齢年金","p":["厚生年金に加入して働く場合、基本月額と総報酬月額相当額の合計が支給停止調整額を超えると超過額の2分の1が支給停止","基本月額は加給年金を除く老齢厚生年金の月額。総報酬月額相当額は標準報酬月額＋直近1年の標準賞与額÷12","支給停止調整額は2025年度51万円。2025年の年金制度改正法により2026年4月から62万円（2024年度価格）に引き上げ","老齢基礎年金と経過的加算は在職老齢年金の対象外で全額支給。70歳以上で厚生年金に加入しない在職者にも適用される","繰下げ待機中に在職による支給停止となる部分は、繰下げによる増額の対象にならない"]},{"n":"障害基礎年金・障害厚生年金","p":["初診日要件と保険料納付要件（初診日の前々月までの被保険者期間の3分の2以上が納付・免除期間）を満たす必要がある","納付要件の特例は、初診日が2036年4月1日前で65歳未満なら、初診日の前々月までの直近1年間に未納がないこと","障害認定日は初診日から1年6か月を経過した日（その前に治った場合は治った日）","障害基礎年金の1級は2級の1.25倍で子の加算がある。障害厚生年金は報酬比例で1級は1.25倍、1・2級には配偶者加給","障害厚生年金は加入300月未満なら300月とみなす。3級には最低保障額があり、より軽い障害には一時金の障害手当金"],"s":[14]},{"n":"遺族基礎年金と寡婦年金","p":["遺族基礎年金は子のある配偶者または子が受給する。子は18歳到達年度末まで（障害等級1・2級は20歳未満）の未婚の子","年金額は老齢基礎年金の満額と同額に子の加算額を加えたもの。子のない配偶者には支給されない","寡婦年金は第1号の納付済・免除期間が10年以上の夫が死亡した場合、婚姻10年以上の妻に60〜65歳の間支給される","寡婦年金の額は夫の第1号被保険者期間に基づく老齢基礎年金額の4分の3","死亡一時金は第1号として36月以上納付した者の死亡時、遺族基礎年金を受けられない遺族に支給。寡婦年金とは選択"]},{"n":"遺族厚生年金と中高齢寡婦加算","p":["遺族の範囲は生計を維持されていた配偶者・子、父母、孫、祖父母の順で、最先順位者だけが受給する","夫・父母・祖父母は死亡時55歳以上が要件で支給は60歳から。30歳未満で子のない妻は5年間の有期給付","年金額は死亡者の報酬比例部分の4分の3。在職中の死亡など短期要件では加入月数300月未満を300月とみなす","中高齢寡婦加算は夫の死亡時40歳以上65歳未満で子のない妻などに、40歳から65歳まで遺族厚生年金に加算される","65歳以降に自分の老齢厚生年金を受けられる場合は老齢厚生年金が優先して支給され、遺族厚生年金は差額のみ支給"]},{"n":"自営業者の上乗せ制度","p":["付加保険料は月400円で、付加年金は200円×付加保険料納付月数。国民年金基金の加入者は付加保険料を納付できない","国民年金基金は第1号被保険者等が加入でき、1口目は終身年金。掛金はiDeCoと合わせて月6万8,000円が上限","国民年金基金の掛金は全額が社会保険料控除の対象。加入は任意だが自己都合で脱退することはできない","小規模企業共済は小規模事業の個人事業主・会社役員向けで、掛金は月1,000〜70,000円（500円単位）が全額所得控除","小規模企業共済の共済金は一括受取なら退職所得、分割受取なら公的年金等の雑所得として課税される"],"s":[12]},{"n":"確定給付企業年金と企業型DC","p":["確定給付企業年金（DB）は給付額があらかじめ決まり、運用リスクは企業が負う。規約型と基金型がある","企業型DCは事業主掛金を加入者が自ら運用し、運用リスクは加入者が負う。事業主掛金は全額損金算入","企業型DCの拠出限度額は月5.5万円。2024年12月からDB等を併用する場合は5.5万円から他制度掛金相当額を控除","マッチング拠出の加入者掛金は事業主掛金以下かつ合計が拠出限度額以内で、小規模企業共済等掛金控除の対象","中小企業退職金共済は掛金全額を事業主が負担し、月5,000〜30,000円。新規加入時は国の掛金助成がある"]},{"n":"個人型確定拠出年金（iDeCo）","p":["国民年金の被保険者が65歳未満まで加入できる。保険料の免除・未納者は原則加入できない（障害基礎年金受給者等を除く）","拠出限度額は月額で第1号6.8万円（国民年金基金等と合算）、企業年金のない会社員と第3号は2.3万円","2024年12月から企業年金のある会社員と公務員は月2万円が上限で、企業年金の掛金相当額との合計5.5万円以内","掛金は月5,000円以上1,000円単位。全額が小規模企業共済等掛金控除の対象で、運用益も非課税","老齢給付金は通算加入者等期間10年以上なら60歳から受給でき、75歳までに受給を開始する。一時金は退職所得扱い"],"s":[12]}]},{"u":"B：生命保険","items":[{"n":"契約者保護と保険法・保険業法","p":["生命保険契約者保護機構は破綻時に責任準備金等の90%まで補償する（高予定利率契約を除く）。少額短期保険業者は対象外","ソルベンシー・マージン比率は支払余力を示し200%以上が健全性の目安。下回ると金融庁の早期是正措置の対象となる","クーリング・オフは申込日か書面受領日の遅い日から8日以内に書面等で行う。保険期間1年以内や医師の診査後は不可","保険法の告知義務は保険会社が質問した事項に答える義務。違反による解除権は知った時から1か月、契約から5年で消滅","保険金の請求権の時効は3年。保険募集人が告知を妨げた場合、保険会社は告知義務違反を理由に解除できない"]},{"n":"保険料の仕組みと契約の継続","p":["保険料は予定死亡率・予定利率・予定事業費率で計算する。予定利率が下がると保険料は上がる","保険料は純保険料と付加保険料からなり、配当の源泉は死差益・利差益・費差益の3利源","払込猶予期間は月払で払込期月の翌月末日まで。過ぎると失効し、復活には所定期間内の告知と延滞保険料の払込みが必要","払済保険は保険期間を変えずに保険金額を下げ、延長保険は保険金額を変えずに保険期間を短くする。原則として特約は消滅","契約者貸付は解約返戻金の一定範囲内で受けられ利息がかかる。契約転換は既契約の責任準備金等を新契約の一部に充てる"]},{"n":"主な生命保険商品","p":["定期保険は一定期間の死亡保障で満期保険金はない。更新型は更新時の年齢で保険料が再計算されて上がる","収入保障保険は死亡後に年金形式で受け取り、受取総額は時の経過とともに減る。一時金で受け取ると年金総額より少ない","終身保険は一生涯の死亡保障。低解約返戻金型は払込期間中の解約返戻金を抑えて保険料を割安にしている","養老保険は死亡・高度障害保険金と満期保険金が同額。個人年金の確定年金は生死にかかわらず一定期間支払われる","変額保険は特別勘定で運用し、死亡保険金に最低保証があるが解約返戻金に保証はない。外貨建て保険は為替リスクを負う"]},{"n":"生命保険料控除","p":["2012年以後の契約は一般・介護医療・個人年金の各区分で所得税最高4万円・合計12万円、住民税各2.8万円・合計7万円","2011年以前の旧契約は区分ごとに所得税最高5万円（住民税3.5万円）。同区分に新旧両方あれば合算で上限4万円","2026年分は23歳未満の扶養親族がいると一般生命保険料控除の上限が6万円に上がる（合計上限12万円は据え置き）","個人年金保険料控除の適格要件は受取人が契約者か配偶者で被保険者と同一、払込10年以上、60歳以後10年以上の受取など","少額短期保険、保険期間5年未満の貯蓄保険、団体信用生命保険の保険料は生命保険料控除の対象外"],"s":[9,12]},{"n":"保険金・給付金の課税","p":["死亡保険金は契約者＝被保険者なら相続税、契約者＝受取人なら所得税（一時所得）、三者が異なれば贈与税の対象","相続人が受け取る死亡保険金は500万円×法定相続人の数まで非課税。相続を放棄した者は非課税枠を使えない","満期保険金・解約返戻金は契約者＝受取人なら一時所得。一時払養老保険の5年以内の満期・解約は20.315%の源泉分離課税","入院・手術給付金、高度障害保険金、リビング・ニーズ特約の保険金など身体の傷害・疾病に基づく給付は非課税","個人年金の年金は雑所得で、対応する払込保険料を必要経費として差し引く。契約者と受取人が異なると年金開始時に贈与税"]},{"n":"法人契約の経理（定期保険等）","p":["2019年7月8日以後契約の定期保険・第三分野保険は最高解約返戻率で処理が分かれ、50%以下なら保険料は全額損金","最高解約返戻率50%超70%以下は保険期間の当初4割の期間、保険料の40%を資産に計上し残りを損金とする","70%超85%以下は当初4割の期間に60%を資産計上。85%超は当初10年間に最高解約返戻率の90%（11年目以降70%）を資産計上","資産計上した額は保険期間の75%が経過した後、残りの期間で均等に取り崩して損金に算入する","50%超70%以下の区分でも、被保険者1人当たりの年換算保険料が30万円以下なら全額を損金にできる"],"s":[12]},{"n":"法人契約の経理（養老・終身等）","p":["法人が契約者・保険金受取人の終身保険は、保険料を全額資産計上（保険料積立金）する","養老保険で死亡保険金受取人が被保険者の遺族、満期受取人が法人で全従業員が加入なら、保険料の1/2を資産、1/2を福利厚生費","法人が受け取る死亡保険金や解約返戻金は資産計上額との差額を雑収入（不足なら雑損失）として処理する","総合福祉団体定期保険は法人が契約する1年更新の保険で保険料は損金。役員・従業員の遺族保障に使い本人の同意が必要","役員退職金の適正額の目安は最終報酬月額×役員在任年数×功績倍率。不相当に高額な部分は損金不算入"],"s":[12]}]},{"u":"B：損害保険と第三分野","items":[{"n":"損害保険の基本と火災保険","p":["保険金額が保険価額を下回る一部保険は比例てん補となる。再調達価額（新価）基準なら同等品を再取得する費用まで補償","住宅火災保険は火災・落雷・破裂爆発・風災等を補償し水災は対象外。住宅総合保険は水災・盗難なども補償する","地震・噴火・津波を原因とする火災は火災保険では補償されず、地震保険が必要となる","失火責任法により重大な過失のない失火で隣家を焼いても賠償責任は負わない。ガス爆発などには同法は適用されない","借家人が失火で借家を焼くと家主に債務不履行の賠償責任を負うため、借家人賠償責任特約で備える"]},{"n":"地震保険","p":["地震保険は火災保険に付帯して契約し単独では加入できない。火災保険の契約期間の途中から付帯することは可能","保険金額は主契約の30〜50%の範囲で、上限は建物5,000万円、家財1,000万円","損害区分は全損100%、大半損60%、小半損30%、一部損5%で、保険金額に対するこの割合で支払われる","割引は免震建築物・耐震等級・耐震診断・建築年の4種類（10〜50%）で重複適用できない。保険料は保険会社間で同一","1個または1組30万円を超える貴金属・美術品や自動車は家財の地震保険の対象外"]},{"n":"自動車保険","p":["自賠責保険は対人賠償のみで、被害者1人当たり死亡3,000万円、後遺障害75万〜4,000万円、傷害120万円が限度","任意の対人賠償は自賠責の超過部分を補償する。記名被保険者本人・配偶者・父母・子への賠償は対人・対物とも対象外","人身傷害保険は自分の過失割合にかかわらず、実際の損害額を保険金額の範囲内で示談を待たずに受け取れる","搭乗者傷害保険は定額払い。無保険車傷害保険は賠償資力のない相手との事故による死亡・後遺障害を補償する","車両保険の一般型は単独事故や当て逃げも補償する。ノンフリート等級は事故1件で原則3等級下がる"]},{"n":"傷害保険","p":["傷害保険は急激・偶然・外来の事故によるケガを補償し病気は対象外。保険料は職業・職種で異なり年齢・性別は問わない","普通傷害保険は国内外の日常のケガを補償するが、細菌性・ウイルス性食中毒や地震・噴火・津波によるケガは対象外","家族傷害保険の被保険者の範囲は事故発生時の続柄で判定し、契約後に生まれた子も対象となる","国内旅行傷害保険は細菌性・ウイルス性食中毒を補償し地震等は対象外。海外旅行傷害保険は地震等や病気の治療も補償する"]},{"n":"賠償責任保険","p":["個人賠償責任保険は日常生活の賠償事故を補償し、本人・配偶者・同居親族・別居の未婚の子が被保険者となる","個人賠償責任保険では業務遂行中の事故、自動車事故、他人から借りた物の損壊、同居親族への賠償は対象外","PL保険（生産物賠償責任保険）は製造・販売した製品や仕事の結果の欠陥による事故の賠償に備える","施設所有（管理）者賠償責任保険は施設の欠陥や業務中の事故、受託者賠償責任保険は預かった物の損壊・盗難に備える","労働災害総合保険は政府労災の上乗せと使用者賠償責任を、店舗休業保険は休業による利益の減少を補償する"]},{"n":"損害保険と税金","p":["地震保険料控除は所得税が支払額の全額で最高5万円、住民税が支払額の2分の1で最高2.5万円","2006年末までに契約した保険期間10年以上・満期返戻金付の長期損害保険は旧長期損害保険料として控除できる（所得税最高1.5万円）","火災保険金、車両保険金、賠償責任保険金、ケガの治療費などとして受け取る損害保険金は原則非課税","積立型損害保険の満期返戻金は一時所得。法人が受け取った保険金で同種の資産を取得すれば圧縮記帳ができる"]},{"n":"第三分野の保険","p":["医療保険は1入院の支払限度日数があり、退院後180日以内の同一疾病による再入院は1回の入院とみなされることが多い","がん保険は契約後90日（3か月）程度の待ち期間があり、その間にがんと診断されると保障されない。入院日数は無制限が一般的","先進医療特約は契約時ではなく療養を受けた時点で先進医療に該当する治療の技術料を補償する","特定（三大）疾病保障保険はがん・急性心筋梗塞・脳卒中で所定の状態になると、死亡保険金と同額を生前に受け取れる","所得補償保険は損害保険会社の商品で、病気やケガで働けないとき免責期間の経過後から月額の保険金を支払う"]}]},{"u":"C：経済・預貯金・債券・株式","items":[{"n":"経済指標と市場の変動要因","p":["GDPは内閣府が四半期ごとに公表する。景気動向指数も内閣府が毎月公表し、CIの一致指数で景気の動きを把握する","景気動向指数で新規求人数（除学卒）は先行、有効求人倍率（除学卒）は一致、完全失業率や消費者物価指数は遅行系列","日銀短観は年4回の調査で、業況判断DIは「良い」と答えた企業の割合から「悪い」の割合を差し引いて求める","消費者物価指数は総務省、企業物価指数とマネーストックは日本銀行が公表。マネーストックは金融機関と国の保有分を除く","景気拡大や物価上昇は金利上昇要因。日本の金利が海外より相対的に上がると円高要因、円安は輸入物価の上昇要因"]},{"n":"預貯金の種類と利息","p":["単利は元本にのみ利息がつき、複利は利息を元本に組み入れる。半年複利は年利の2分の1で年2回複利計算する","預貯金の利子は利子所得として20.315%（所得税15.315%・住民税5%）の源泉分離課税で課税関係が終わる","期日指定定期預金は1年据置後、最長3年まで満期日を指定できる1年複利。スーパー定期の3年以上は個人のみ半年複利も選べる","大口定期預金は1,000万円以上の単利型。変動金利定期預金は半年ごとに適用金利を見直す","貯蓄預金は残高に応じて金利が上がるが、公共料金の自動引落しや給与の受取口座には使えない"]},{"n":"債券の利回り計算","p":["直接利回り＝表面利率÷購入価格×100。最終利回り＝｛表面利率＋（額面100－購入価格）÷残存年数｝÷購入価格×100","応募者利回りは発行価格で購入し償還まで保有した場合、所有期間利回りは償還前に売却した場合の利回り","額面を下回る価格での発行がアンダーパー、上回る発行がオーバーパー。割引債は利払いがなく額面との差が収益となる","特定公社債の利子は20.315%の源泉徴収後に申告不要か申告分離を選び、譲渡益・償還差益は申告分離課税となる"]},{"n":"債券のリスクと個人向け国債","p":["市場金利が上昇すると債券価格は下落する。残存期間が長いほど、また表面利率が低いほど価格の変動幅は大きい","格付けBBB（Baa）以上は投資適格債、BB（Ba）以下は投機的格付債。格下げされると価格は下落し利回りは上昇する","個人向け国債は変動10年・固定5年・固定3年の3種類で毎月発行され、1万円単位、最低金利は年0.05%","変動10年の金利は基準金利×0.66で半年ごとに見直す。固定5年は基準金利－0.05%、固定3年は基準金利－0.03%","発行後1年経過すれば中途換金でき、直前2回分の各利子（税引前）×0.79685が差し引かれる"]},{"n":"株式の取引ルール","p":["取引所の売買は価格優先・時間優先の原則で、成行注文は指値注文に優先する。売買単位は原則100株","普通取引の受渡しは約定日を含めて3営業日目。東証の現物取引時間は2024年11月から15時30分までに延長された","東証の市場区分は2022年4月の再編でプライム・スタンダード・グロースの3市場となった","信用取引の委託保証金は約定代金の30%以上かつ最低30万円。制度信用取引の弁済期限は最長6か月"]},{"n":"株式投資指標と株価指数","p":["PER＝株価÷1株当たり純利益、PBR＝株価÷1株当たり純資産。PBR1倍割れは株価が解散価値を下回る状態","ROE＝当期純利益÷自己資本×100で、売上高純利益率×総資本回転率×財務レバレッジに分解できる","配当利回り＝1株当たり配当÷株価×100、配当性向＝配当金総額÷当期純利益×100","日経平均株価はプライム市場の225銘柄の株価平均型で値がさ株の影響が大きい。TOPIXは時価総額加重型の指数","ダウ工業株30種平均は米国の30銘柄、S&P500は米国の大型株500銘柄が対象。株価平均型と時価総額加重型の違いに注意"],"s":[14]}]},{"u":"C：投信・外貨・税制・制度","items":[{"n":"投資信託の仕組みとコスト","p":["契約型投資信託は委託会社が運用を指図し、受託会社（信託銀行）が信託財産を保管・管理する。販売は販売会社が担う","公社債投資信託は株式を一切組み入れられない。株式投資信託は約款上株式を組み入れられれば実際の組入れがなくてもよい","追加型はいつでも購入・換金でき、単位型は募集期間にのみ購入できる。会社型（投資法人）の代表例がJ-REIT","購入時手数料は販売会社ごとに異なり無料のものはノーロード。運用管理費用（信託報酬）は保有中毎日差し引かれる","信託財産留保額は換金時に差し引かれ信託財産に残る費用。運用手法にはトップダウン・ボトムアップ、グロース・バリューがある"]},{"n":"投資信託の分配金とETF","p":["分配後の基準価額が個別元本以上なら普通分配金で課税、個別元本を下回る部分は元本払戻金（特別分配金）で非課税","元本払戻金を受け取るとその分だけ個別元本が下がる","ETFは取引所に上場し、株式と同様に指値・成行注文や信用取引ができる。一般に信託報酬は低い","インデックス（パッシブ）運用はベンチマークへの連動を、アクティブ運用はベンチマークを上回る成果を目指す"]},{"n":"外貨建て金融商品","p":["円を外貨に替えるときはTTS、外貨を円に替えるときはTTBを使う。TTMは仲値で、米ドルの為替手数料は片道1円が一般的","外貨預金は預金保険の対象外。利息は20.315%の源泉分離課税、為替差益は雑所得として総合課税される","預入時に満期時の為替予約を付けた外貨定期預金は、為替差益も含めて20.315%の源泉分離課税となる","外貨建てMMFの譲渡益・為替差益は上場株式等と同様に20.315%の申告分離課税で、損益通算もできる","デュアル・カレンシー債は払込みと利払いが円で償還が外貨。リバース・デュアル・カレンシー債は利払いが外貨"]},{"n":"デリバティブ取引","p":["先物取引は将来の期日に現時点で決めた価格で売買を約束する取引で、証拠金で取引でき差金決済ができる","保有株式の値下がりに備えるには先物の売りヘッジ、将来購入予定の株の値上がりに備えるには買いヘッジを行う","コール・オプションは買う権利、プット・オプションは売る権利。買い手の損失は支払ったプレミアムに限定される","ボラティリティが高いほど、また満期までの期間が長いほど、コール・プットともプレミアムは高くなる","金利スワップは固定金利と変動金利などの金利部分を交換し元本は交換しない。通貨スワップは元本も交換する"]},{"n":"ポートフォリオ理論","p":["ポートフォリオの期待収益率は、各資産の期待収益率を組入比率で加重平均して求める","リスクは標準偏差で測る。相関係数（－1〜＋1）が小さいほど分散効果が大きく、＋1ではリスク低減効果がない","シャープレシオ＝（ポートフォリオの収益率－無リスク資産利子率）÷標準偏差。値が大きいほど効率的な運用","分散投資で減らせるのは個別企業の非システマティック・リスクで、市場全体のシステマティック・リスクは消せない"],"s":[14]},{"n":"金融商品の税金","p":["上場株式等の配当・譲渡益の税率は20.315%。配当は総合課税・申告分離課税・申告不要から選べ、総合課税なら配当控除が可能","発行済株式の3%以上を持つ大口株主が受ける上場株式の配当は、20.42%の源泉徴収後に総合課税の対象となる","上場株式等の譲渡損失は上場株式等の配当（申告分離）や特定公社債の利子と損益通算でき、残りは3年間繰越控除できる","源泉徴収ありの特定口座は確定申告不要を選べる。上場株式等と非上場株式等（一般株式等）の損益は通算できない","2024年度分以後の住民税では、上場株式等の配当等の課税方式を所得税で選んだ方式とそろえる必要がある"]},{"n":"NISA（少額投資非課税制度）","p":["2024年からの新NISAは非課税保有期間が無期限で、1月1日時点で18歳以上の居住者が1人1口座開設できる","年間投資枠はつみたて投資枠120万円・成長投資枠240万円で併用可。非課税保有限度額は1,800万円（うち成長枠1,200万円）","非課税保有限度額は簿価（取得価額）で管理し、売却した分の枠は翌年以降に再利用できる","NISA口座の損失は他口座の利益と損益通算できず繰越控除もできない。上場株式の配当は株式数比例配分方式でのみ非課税","2026年度改正でつみたて投資枠を0〜17歳に拡大（2027年から年60万円・総額600万円、12歳以降は子の同意で払出可）"],"s":[5,6,8,13]},{"n":"セーフティネット","p":["預金保険は1金融機関ごとに預金者1人当たり元本1,000万円とその利息を保護する。外貨預金や譲渡性預金は対象外","無利息・要求払い・決済サービスを提供できるという3条件を満たす決済用預金は全額保護される","外国銀行の在日支店や日本の銀行の海外支店の預金は預金保険の対象外。ゆうちょ銀行の貯金は対象","日本投資者保護基金は証券会社の分別管理が不十分で顧客資産を返還できない場合に1人1,000万円まで補償する","銀行で購入した投資信託は投資者保護基金の対象外だが、信託財産は分別管理されており販売銀行の破綻の影響を受けない"]},{"n":"金融取引の関連法規","p":["金融サービス提供法は元本欠損のおそれなど重要事項の説明義務違反に損害賠償責任を定め、元本欠損額を損害額と推定する","消費者契約法では不実告知や断定的判断の提供などによる契約を取り消せる。取消権は追認できる時から1年、契約から5年","金融商品取引法は適合性の原則、契約締結前交付書面の交付、損失補てんの禁止などの行為規制を定める","特定投資家（プロ）には金融商品取引法の一部の行為規制が適用されない。金融サービス提供法と消費者契約法は併用できる","2024年11月から金融事業者に、顧客の最善の利益を勘案した誠実かつ公正な業務遂行の義務が法定された"]}]},{"u":"D：所得税と各種所得","items":[{"n":"所得税の仕組みと税率","p":["所得税は暦年（1月1日〜12月31日）の所得に課税する申告納税方式で、所得を10種類に分けて計算する","総合課税の税率は5〜45%の7段階の超過累進税率。課税所得195万円以下は5%、4,000万円超は45%","復興特別所得税は所得税額の2.1%。2026年度改正で2027年1月から所得税額の1%の防衛特別所得税を創設し、復興分は1%引下げ","非課税所得には電車等の通勤手当（月15万円まで）、雇用保険の給付、障害・遺族年金、損害保険金、宝くじの当せん金がある","生活用動産の譲渡益は非課税だが、1個または1組30万円超の貴金属・書画・骨とうの譲渡益は課税される"],"s":[5]},{"n":"利子所得・配当所得","p":["利子所得は預貯金・公社債の利子や公社債投資信託の収益分配金で、必要経費は差し引けない","配当所得は収入金額から株式等の取得に要した負債の利子を差し引く。上場株式等の配当は20.315%が源泉徴収される","非上場株式の配当は20.42%が源泉徴収され原則総合課税。1回10万円×配当計算期間÷12以下の少額配当は申告不要を選べる","J-REITや外国株式の配当、外貨建資産の割合が高い投資信託の分配金は配当控除の対象外"]},{"n":"不動産所得・事業所得","p":["不動産所得は地代・家賃、礼金・更新料、返還不要の敷金などが収入。事業的規模（5棟10室）でも事業所得にはならない","必要経費には固定資産税、減価償却費、借入金の利子、修繕費、損害保険料が含まれ、借入金の元本返済分は含まない","食事付きの下宿や保管責任のある駐車場の所得は、不動産所得ではなく事業所得または雑所得となる","個人の法定償却方法は定額法。1998年4月以後取得の建物と2016年4月以後取得の建物附属設備・構築物は定額法のみ","棚卸資産の評価方法は届出がなければ最終仕入原価法。取得価額10万円未満の減価償却資産は全額その年の必要経費"]},{"n":"給与所得","p":["給与所得＝給与収入－給与所得控除額。給与所得控除の最低額は2025年分から65万円、上限は収入850万円超で195万円","2026年度改正で最低保障額を69万円とし、2026・2027年分は5万円上乗せの74万円とした（所得税は2026年12月施行）","給与収入850万円超で23歳未満の扶養親族や特別障害者がいる場合、所得金額調整控除（最大15万円）が受けられる","給与収入2,000万円以下なら年末調整で精算される。特定支出が給与所得控除額の2分の1を超えると特定支出控除が使える"],"s":[5,6,9]},{"n":"退職所得","p":["退職所得＝（収入金額－退職所得控除額）×2分の1。分離課税で、他の所得とは合算しない","退職所得控除は勤続20年以下が40万円×年数（最低80万円）、20年超は800万円＋70万円×（年数－20年）。1年未満は切上げ","障害者になったことによる退職は控除額に100万円を加算する。役員等の勤続5年以下は2分の1課税が適用されない","役員以外の勤続5年以下の短期退職手当等は、控除後の額のうち300万円を超える部分に2分の1課税が適用されない","「退職所得の受給に関する申告書」を出せば源泉徴収で課税が完結し、未提出なら収入金額の20.42%が源泉徴収される"],"s":[12,13]},{"n":"譲渡所得・山林所得","p":["総合課税の譲渡所得は保有5年以内が短期、5年超が長期。特別控除は合計で最高50万円、長期は2分の1が課税対象","土地・建物・株式等の譲渡は分離課税。土地建物は譲渡した年の1月1日時点で所有期間5年超なら長期譲渡所得","ゴルフ会員権や金地金、書画・骨とうの譲渡は総合課税の譲渡所得となる","山林所得は取得から5年超の山林の伐採・譲渡による所得で、特別控除50万円、5分5乗方式で税額を計算する","取得から5年以内の山林の伐採・譲渡は山林所得ではなく事業所得または雑所得となる"]},{"n":"一時所得・雑所得","p":["一時所得＝総収入金額－収入を得るために支出した金額－特別控除（最高50万円）。その2分の1を総所得金額に算入する","一時所得の例は契約者が受け取る満期保険金・解約返戻金、懸賞の賞金、法人からの贈与など","雑所得は公的年金等・業務・その他の3区分。公的年金等の雑所得は収入金額－公的年金等控除額で計算する","公的年金等控除の最低額
