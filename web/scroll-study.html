ロパティに代入すると AttributeError: property 'f' of 'T' object has no setter","実際の値は self._c のような別名に保存し、プロパティ自身に代入して無限再帰しないようにする","一度だけ計算して結果を保持したいなら functools.cached_property を使う"]},{"n":"dataclass","s":[5],"p":["@dataclass は型注釈付きのクラス変数から __init__・__repr__・__eq__ を自動生成する","可変のデフォルト x: list = [] は ValueError になり、field(default_factory=list) を使う","デフォルト付きのフィールドの後にデフォルト無しのフィールドを置くと TypeError になる","frozen=True で代入が FrozenInstanceError になりハッシュ可能になる。order=True で大小比較が加わる","__post_init__ で生成後の処理、asdict() で辞書化、replace(obj, qty=3) で一部を変えた複製を作る"]},{"n":"Enum","s":[5],"p":["class Color(Enum): RED = 1 で列挙型を作り、Color.RED.name は 'RED'、.value は 1","Color(1) は値から、Color['RED'] は名前からメンバーを引き、無い値は ValueError になる","メンバーはシングルトンで is で比較でき、Color.RED == 1 は False（IntEnum なら True）","通常の Enum は < で比較できず TypeError になる。auto() は値を自動で割り振る","StrEnum（3.11）は str として振る舞い、Flag は | で組み合わせ、@unique は値の重複を禁止する"]}]},{"u":"イテレータとジェネレータ","items":[{"n":"イテレータプロトコル","s":[0,1],"p":["for 文は iter() でイテレータを得て next() を繰り返し、StopIteration で終了する","イテレータは __next__ と自分自身を返す __iter__ を持ち、イテラブルは __iter__ を持つ","リストはイテラブルだがイテレータではなく、__next__ を持たない","next(it, 'end') と既定値を渡すと、尽きたとき StopIteration の代わりにその値を返す","iter(callable, sentinel) は callable の戻り値が sentinel になるまで呼び続ける"]},{"n":"イテレータは使い捨て","s":[0,1],"p":["イテレータは一度最後まで進むと空になり、同じ it に list(it) を2回行うと2回目は [] になる","map・filter・zip・ジェネレータ式の戻り値もイテレータで、使い回すと空になる","値が必要になった時点で計算する遅延評価のため、巨大な列や無限の列も扱える","何度も走査するなら list() で具体化するか、itertools.tee で独立したイテレータに分ける"]},{"n":"イテレータクラスの実装","s":[0],"p":["__iter__ で self を返し、__next__ で次の値を返し、尽きたら raise StopIteration する","チュートリアルの Reverse クラスは self.index を減らしながら、末尾から要素を返す","同じ処理はジェネレータなら yield で短く書け、__iter__ と __next__ が自動で用意される","__getitem__ だけを持つクラスも、0 から順に添字を渡し IndexError で止まる形で反復できる"]},{"n":"ジェネレータ関数と yield","s":[0],"p":["yield を含む関数を呼ぶと本体は実行されず、ジェネレータオブジェクトが返る","next() のたびに次の yield まで進み、局所変数と実行位置は呼び出しの間も保存される","関数の終わりで StopIteration が送出され、return した値は例外の value 属性に入る","yield from iterable は別のイテラブルの要素を順に送り出す（処理を委譲する）","send(v) で値を送ると yield 式の値になり、最初は next() で最初の yield まで進めておく"]},{"n":"ジェネレータ式","s":[0],"p":["(x*x for x in range(10)) は丸括弧の内包表記で、リストを作らず1つずつ値を生成する","関数の唯一の引数なら括弧を省けて、sum(i*i for i in range(10)) は 285 になる","全要素を保持しないためリスト内包表記より省メモリだが、一度しか走査できない","sum(x*y for x, y in zip(a, b)) のように、内積なども1行で書ける"]}]},{"u":"型ヒント","items":[{"n":"型ヒントの基本","s":[0,5],"p":["def greet(name: str) -> str: のように引数と戻り値に注釈を付け、__annotations__ で参照できる","実行時に型は強制されず add('x', 'y') も動く。検査は型チェッカーや IDE が行う","変数にも count: int = 0 と注釈でき、list[int] や dict[str, int] と組み込み型を総称型に使える","Optional[X] は X | None と同じ意味で、3.10以降は X | Y の記法が勧められる","Any はあらゆる型と相互に代入でき、注釈の無い関数は Any として扱われる"]},{"n":"主な特殊型","s":[5],"p":["Literal['r', 'w'] は特定の値だけ、Final は再代入禁止、ClassVar はクラス変数を表す","Callable[[int], str] は int を受け取り str を返す呼び出し可能オブジェクトを表す","TypedDict はキーごとに型を決めた辞書で、NotRequired で省略可能なキーを示す。実行時は dict","Protocol は構造的部分型を表し、継承していなくても必要なメソッドを持てば適合する","Self（3.11）は自身のクラス型を、Never は戻らない関数などに使うボトム型を表す"]},{"n":"型エイリアスとジェネリクス","s":[5,10,11],"p":["3.12から type Vector = list[float] で型エイリアスを宣言でき、右辺は遅延評価される","3.12から def first[T](xs: list[T]) -> T: や class Box[T]: で型変数を宣言できる（PEP 695）","T: str は上限、T: (str, bytes) は制約を表し、上限と制約は同時に指定できない","3.12より前は T = TypeVar('T') と class Box(Generic[T]) で書いた","3.13から class Box[T = int]: のように型パラメータに既定値を付けられる（PEP 696）"]},{"n":"型チェッカーと絞り込み","s":[5,10,11],"p":["型の検査は mypy や pyright などの静的型チェッカーが行い、Python 本体は注釈を検査しない","isinstance による分岐で型が絞り込まれ、独自の判定関数は TypeIs（3.13）で絞り込みを伝えられる","@typing.override（3.12）を付けると、基底に同名メソッドが無い場合にチェッカーがエラーにする","@warnings.deprecated（3.13）は非推奨であることを型チェッカーと実行時の警告の両方に伝える","NewType('UserId', int) はチェッカー上だけ別の型になり、実行時は引数をそのまま返す"]},{"n":"注釈の遅延評価（3.14）","s":[12],"p":["3.14から関数・クラス・モジュールの注釈は定義時に評価されず、必要なときに評価される（PEP 649）","後で定義するクラスを前方参照するときに、'Node' のように引用符で囲む必要がなくなった","annotationlib.get_annotations は VALUE・FORWARDREF・STRING の形式で注釈を取り出せる","未定義の名前を含む注釈は、VALUE 形式では NameError、FORWARDREF 形式では ForwardRef になる","from __future__ import annotations を使うコードはこの変更の影響を受けない"]}]},{"u":"標準ライブラリ","items":[{"n":"Counter と defaultdict","s":[5],"p":["Counter('abracadabra').most_common(2) は [('a', 5), ('b', 2)] で、無いキーは KeyError でなく 0","Counter 同士は + - & | で演算でき、- は正のカウントだけを残す。total() は合計を返す（3.10）","defaultdict(list) は無いキーの参照時に list() で初期化し、d[k].append(v) でグループ化できる","defaultdict の初期化は d[k] のときだけ起こり、d.get(k) は None を返してキーも作らない","OrderedDict は move_to_end() や順序を考慮した == が必要なときに使う"]},{"n":"namedtuple と deque","s":[5],"p":["Point = namedtuple('Point', ['x', 'y']) は p.x でも p[0] でも参照できる不変のタプル型を作る","_asdict() で辞書に、_replace(x=9) で一部を変えた新インスタンスにでき、属性への代入はできない","deque は両端の追加・削除が O(1) だが、中央へのアクセスは O(n) になる","deque(maxlen=3) は満杯で追加すると反対側の要素を捨てるため、直近 N 件の保持に使える","appendleft・popleft・rotate(1)（右回転）・extendleft（逆順で追加）などを持つ"]},{"n":"itertools","s":[5],"p":["count(10)・cycle('AB')・repeat(x) は無限に値を生み、islice(it, 3) で必要な分だけ切り出す","chain('ABC', 'DEF') は連結、chain.from_iterable([[1], [2]]) は入れ子を1段平らにする","groupby は連続する同じキーだけをまとめるので、全体をまとめるには先に同じキーでソートする","product・permutations・combinations は組合せを生成し、combinations('ABCD', 2) は6通り","batched('ABCDEFG', 3) は ABC・DEF・G に分け（3.12）、pairwise('ABC') は AB・BC を返す（3.10）"]},{"n":"functools","s":[5],"p":["@cache（3.9）は引数ごとの結果を無制限に記憶し、@lru_cache(maxsize=128) は上限付きで記憶する","キャッシュする関数の引数はハッシュ可能である必要があり、リストを渡すと TypeError になる","f.cache_info() で hits・misses などを確認し、f.cache_clear() で記憶を消す","partial(int, base=2) は引数を固定した関数を作り、その関数に '10010' を渡すと 18 を返す","reduce(f, xs, initial) は左から畳み込み、空の入力で initial が無いと TypeError になる"]},{"n":"datetime","s":[5],"p":["date・time・datetime・timedelta・timezone を提供し、いずれも不変でハッシュ可能である","タイムゾーン情報の無い naive と有る aware があり、両者の大小比較や引き算は TypeError","現在の UTC は datetime.now(UTC) で得る。datetime.utcnow() は3.12で非推奨になった","strftime('%Y-%m-%d') で文字列化し、strptime(s, '%d/%m/%y %H:%M') や fromisoformat(s) で解析する","timedelta は days・seconds・microseconds だけを持ち、全体の秒数は total_seconds() で得る"]},{"n":"json","s":[0,5],"p":["json.dumps(obj) で文字列化、json.loads(s) で解析し、json.dump と json.load はファイルを扱う","dict は object、list・tuple は array、None は null に変換され、読み戻すと tuple は list になる","既定の ensure_ascii=True は日本語を \\uXXXX に変換し、ensure_ascii=False でそのまま出力する","indent=2 で整形し、sort_keys=True でキー順に出力する。set は TypeError: not JSON serializable","数値のキーは文字列になり、json.loads(json.dumps({1: 'a'})) は {'1': 'a'} になる"]},{"n":"re（正規表現）","s":[5],"p":["パターンは r'\\d+' のように raw 文字列で書き、バックスラッシュの二重解釈を避ける","search は全体から最初の一致、match は先頭のみ、fullmatch は全体一致を調べ、失敗時は None","findall はグループが無ければ文字列、グループが2つ以上ならタプルのリストを返す","(?P<year>\\d{4}) は名前付きグループで、m['year'] や m.groupdict() で取り出せる","<.*> は貪欲で最長一致、<.*?> は非貪欲で最短一致する。re.sub は \\1 や関数で置換できる"]},{"n":"logging","s":[0,5],"p":["モジュールごとに logger = logging.getLogger(__name__) を作るのが推奨される","レベルは DEBUG(10)・INFO(20)・WARNING(30)・ERROR(40)・CRITICAL(50) で、ルートの既定は WARNING","basicConfig(level=..., format=...) はルートにハンドラが既にあると何もせず、force=True で再設定する","logger.info('x=%s', x) と引数を分けて渡すと、出力されるときだけ文字列が組み立てられる","logger.exception('msg') は except 節の中で、ERROR レベルにトレースバックを付けて記録する"]},{"n":"random","s":[0,5],"p":["random はメルセンヌ・ツイスタによる決定的な乱数で、セキュリティ用途には secrets を使う","random() は 0.0 以上 1.0 未満、randint(a, b) は両端を含み、randrange(a, b) は b を含まない","choice は1つ、choices(xs, k=5) は重複ありで、sample(xs, k) は重複なしで選ぶ","shuffle(x) はその場で並べ替えて None を返し、不変の列には sample(x, k=len(x)) を使う","random.seed(42) で同じ乱数列を再現でき、3.13から python -m random で CLI も使える"]},{"n":"math","s":[5],"p":["floor・ceil・trunc は int を返すが、ほかの多くの関数は float を返す","math.sqrt(-1) は ValueError になり、複素数の計算には cmath を使う","isqrt(17) は 4、comb(5, 2) は 10、perm(5, 2) は 20、factorial(5) は 120 を返す","math.log(8, 2) は 3.0 で、log2(x)・log10(x) は通常 log(x, 2)・log(x, 10) より正確","定数 pi・e・tau・inf・nan があり、NaN の判定は == ではなく math.isnan で行う"]}]},{"u":"テストと非同期処理","items":[{"n":"unittest の基本","s":[5],"p":["unittest.TestCase を継承したクラスの、名前が test で始まるメソッドがテストとして実行される","assertEqual・assertTrue・assertIn・assertIsNone などで検証し、結果は集計されて報告される","with self.assertRaises(TypeError): のブロック内でその例外が送出されることを検証する","assertAlmostEqual は差を小数第7位で丸めて0か調べるため、浮動小数点の比較に使う","if __name__ == '__main__': unittest.main() で、ファイル単体からテストを実行できる"]},{"n":"unittest の実行と準備処理","s":[5],"p":["python -m unittest test_mod でモジュールを指定し、-v で詳細表示、引数なしでは test*.py を探索する","setUp は各テストの前、tearDown は後に呼ばれ、テストごとに新しいインスタンスが作られる","setUpClass と tearDownClass は、クラスごとに一度だけ呼ばれる classmethod である","@unittest.skip・skipIf でスキップし、@unittest.expectedFailure で失敗を想定どおりと記録する","with self.subTest(i=i): とするとループ内の各ケースが個別に報告され、失敗後も続行する"]},{"n":"pytest の基本","s":[5],"p":["pytest は外部ライブラリで、assert inc(3) == 5 のように素の assert 文でテストを書ける","test_*.py か *_test.py にある test で始まる関数と、Test で始まるクラスのメソッドを集めて実行する","失敗すると assert 4 == 5 と where 4 = inc(3) のように、式の中の値まで表示される","with pytest.raises(ZeroDivisionError): で例外を、pytest.approx(0.3) で浮動小数点を比べる","unittest 形式で書いたテストも、そのまま pytest で実行できる"]},{"n":"pytest のフィクスチャと引数化","s":[5],"p":["@pytest.fixture を付けた関数の名前をテスト関数の引数に書くと、その戻り値が渡される","tmp_path はテストごとの一時ディレクトリを pathlib.Path で渡す組み込みフィクスチャである","@pytest.mark.parametrize('x, expected', [(1, 2), (2, 3)]) で1つのテストを複数の入力で回す","pytest -q で簡潔表示、-x で最初の失敗で停止、-k 式 で名前に一致するテストだけを実行する"]},{"n":"asyncio とコルーチン","s":[5],"p":["async def の関数を呼ぶとコルーチンオブジェクトが返るだけで、本体はまだ実行されない","await されずに捨てられたコルーチンは RuntimeWarning: coroutine ... was never awaited を出す","asyncio.run(main()) がイベントループを用意して、最上位のコルーチンを実行する","asyncio は async/await で並行処理を書くライブラリで、I/O 待ちの多い処理に向く","python -m asyncio で、await を直接書ける対話モードが起動する"]},{"n":"タスクと並行実行","s":[5],"p":["await を順に書くと逐次実行になり、1秒と2秒の待ちは合計約3秒かかる","asyncio.create_task() で先にタスク化すると並行に進み、同じ例が約2秒で終わる","gather(...) は結果を引数の順にリストで返し、return_exceptions=True で例外も結果に含める","async with asyncio.TaskGroup() as tg:（3.11）は1つが失敗すると残りを取り消し、ExceptionGroup を送出","イベントループはタスクを弱参照で持つため、投げっぱなしのタスクは自分で参照を保持する"]},{"n":"タイムアウトとブロッキング","s":[5],"p":["async with asyncio.timeout(10):（3.11）で時間を制限し、超過時の TimeoutError はブロックの外で捕まえる","asyncio.wait_for(aw, timeout=1.0) もタイムアウト時に aw をキャンセルし TimeoutError を送出する","コルーチン内で time.sleep() などを呼ぶとイベントループ全体が止まるため、asyncio.sleep() を使う","ブロッキングする関数は await asyncio.to_thread(func)（3.9以降）で別スレッドに逃がす","CancelledError は BaseException の子で、捕まえたら後片付けの後に再送出するのが原則である"]}]},{"u":"よくある落とし穴","items":[{"n":"同一性と等価性","s":[1,2,4],"p":["== は値が等しいか、is は同じオブジェクトかを調べ、[1, 2] == [1, 2] は True でも is は False","None・True・False などのシングルトンは is で比べ、x is None と書く","小さな整数や短い文字列で is が True になるかは実装依存で、値の比較に is を使ってはならない","x is 1 のようにリテラルに is を使うと SyntaxWarning: \"is\" with 'int' literal が出る","id(x) はオブジェクトの生存中は一意の整数で、CPython ではメモリ上のアドレスである"]},{"n":"浅いコピーと深いコピー","s":[5,0],"p":["b = a は複製しない。a[:]・list(a)・a.copy()・copy.copy(a) は外側だけを複製する浅いコピー","浅いコピーは内側のリストを共有するので、a[0].append(99) がコピー側にも反映される","copy.deepcopy(a) は中身まで再帰的に複製し、自己参照するオブジェクトも memo 辞書で処理する","dict.copy() も浅いコピーで、値のリストを変更すると元の辞書からも変化が見える","3.13の copy.replace(obj, y=9) は namedtuple や dataclass の一部を変えた複製を作る"]},{"n":"掛け算で作る入れ子リスト","s":[2],"p":["[[]] * 3 や [[0] * 2] * 2 は同じ内側リストへの参照を並べるだけで、複製はしない","lists = [[]] * 3 で lists[0].append(3) とすると [[3], [3], [3]] になる","独立した行を作るには [[0] * 2 for _ in range(2)] のように内包表記を使う","[0] * 3 のように要素が不変なら、参照を共有していても問題は起きない"]},{"n":"浮動小数点の誤差","s":[0,1,10],"p":["0.1 * 3 == 0.3 は False、1.1 + 2.2 は 3.3000000000000003 になる","round(2.675, 2) が 2.67 になるのは、2.675 が2進では 2.67499… として保持されるためである","round は偶数への丸めで、round(0.5) は 0、round(2.5) は 2、round(1.5) は 2 になる","0.1 を + で10回足しても 1.0 にならないが、sum([0.1] * 10) は3.12以降の補償加算で 1.0","Decimal は文字列から作る。Decimal(0.1) は float の誤差まで含んだ長い値になる"]},{"n":"整数除算と負の数","s":[2,4],"p":["// は負の無限大方向へ切り捨て -7 // 2 は -4、int(-7 / 2) は0方向で -3 と結果が違う","% の結果は右辺と同じ符号になり、-7 % 3 は 2、7 % -3 は -2","/ は割り切れても float を返し 10 / 5 は 2.0 になる。整数が必要なら // を使う","float は 2**53 を超える整数を正確に表せず、float(2**53 + 1) == float(2**53) は True"]}]},{"u":"新しいバージョンの変更","items":[{"n":"リリースとサポート期間","s":[10,11,12,13,14],"p":["3.12は2023年10月2日、3.13は2024年10月7日、3.14は2025年10月7日、3.15は2026年10月9日に公開","2026年11月時点の最新安定版は3.15系で、3.15.2が2026年10月25日に緊急のセキュリティ修正版として出た","3.13以降は2年間のフルサポートの後、3年間はセキュリティ修正のみが提供される","3.9〜3.12は1年半のフルサポートと3年半のセキュリティ修正という区分だった","3.14から公式リリースへの PGP 署名の提供は終了した（PEP 761）"]},{"n":"Python 3.12 の主な変更","s":[10],"p":["PEP 695 の型パラメータ構文 def max[T](args: Iterable[T]) -> T: と type 文が導入された","PEP 701 で f文字列が正式な文法になり、f'{'-'.join(xs)}' のように同じ引用符を中で再利用できる","distutils が削除され（PEP 632）、asynchat・asyncore・imp モジュールも削除された","内包表記のインライン化（PEP 709）で、リスト・辞書・集合の内包表記が最大2倍速くなった","itertools.batched()、Path.walk()、python -m sqlite3 と python -m uuid の CLI が追加された"]},{"n":"エラーメッセージの改善","s":[10,11,12,13],"p":["3.12：import 忘れに Did you forget to import 'sys'?、メソッド内では 'self.blech' を候補に出す","3.13：トレースバックが既定で色付きになり、PYTHON_COLORS・NO_COLOR・FORCE_COLOR で制御する","3.13：誤ったキーワード引数 max_split に対し Did you mean 'maxsplit'? と候補を示す","3.14：whille True: に Did you mean 'while'?、else の後の elif にも専用のメッセージを出す","3.15：[1, 2].push(4) に Did you mean '.append'? のように、他言語由来の書き方に代替を示す"]},{"n":"Python 3.13 の主な変更","s":[11],"p":["PyPy 由来の新しい対話型インタプリタが既定になり、複数行の編集・履歴・色付きプロンプトに対応した","REPL では F1 でヘルプ、F2 で履歴閲覧、F3 で貼り付けモードになり、exit や quit は括弧なしで使える","PEP 594 で cgi・telnetlib・crypt など19の古いモジュールと、2to3・lib2to3 が削除された","関数内の locals() は独立したスナップショットを返すと定められた（PEP 667）","copy.replace()、python -m random の CLI、dbm の既定バックエンドとなる dbm.sqlite3 が加わった"]},{"n":"free-threading と JIT","s":[11,12],"p":["3.13で GIL を無効にした free-threaded ビルド（PEP 703）が実験的に入り、python3.13t などで起動する","PYTHON_GIL=1 や -X gil=1 で GIL を再有効化でき、sys._is_gil_enabled() で状態を確かめられる","3.14で free-threaded 版が公式サポートとなり（PEP 779）、単一スレッドの性能低下は約5〜10%に縮んだ","3.13で copy-and-patch 方式の実験的 JIT（PEP 744）がビルド時オプションとして入った","3.14から実験的 JIT が Windows と macOS の公式バイナリで利用できるようになった"]},{"n":"テンプレート文字列 t-string","s":[12,5],"p":["3.14の t'Hello {name}' は str ではなく string.templatelib.Template を返す（PEP 750）","反復すると静的な文字列と Interpolation が順に得られ、空の文字列は飛ばされる","Interpolation は value・expression・conversion・format_spec を持ち、変換や書式は自動適用されない","静的部分と埋め込み値を実行時に区別できるため、入力の無害化や安全な SQL 組み立て、DSL に使える","Template 同士は + で連結できるが str とは連結できず、Template(...) などで包む必要がある"]},{"n":"Python 3.14 のその他の変更","s":[12,5],"p":["as を使わない場合、except TimeoutError, ConnectionRefusedError: と括弧を省略できる（PEP 758）","REPL が構文を色分けし、import co の後で Tab を押すとモジュール名を補完する","argparse のヘルプや python -m json の出力、unittest の結果などが既定で色付きになった","Zstandard の compression.zstd（PEP 784）とサブインタプリタの concurrent.interpreters（PEP 734）が追加","int() が __trunc__ に委譲しなくなり、map() に strict 引数、uuid に uuid7() などが加わった"]},{"n":"Python 3.15 の遅延インポート","s":[13],"p":["lazy import json や lazy from pathlib import Path で、名前を初めて使うまで読み込みを遅らせる（PEP 810）","lazy はソフトキーワードでモジュール直下専用。関数内・クラス本体・try ブロック内では SyntaxError","読み込みの失敗は import 文の時点ではなく、その名前を初めて使った時点で例外になる","-X lazy_imports=all か PYTHON_LAZY_IMPORTS=all で、多くの import をまとめて遅延にできる","lazy from module import * と lazy from __future__ import ... は書けない"]},{"n":"Python 3.15 のその他の新機能","s":[13],"p":["組み込み型 frozendict（PEP 814）は変更不可の辞書で dict のサブクラスではなく、中身次第でハッシュ可能","組み込みの sentinel（PEP 661）で一意な番兵値を作れ、コピーしても同一性が保たれる","[*L for L in lists] や {**d for d in dicts} のように、内包表記で * と ** が使える（PEP 798）","encoding 省略時の既定が UTF-8 になり（PEP 686）、旧動作は PYTHONUTF8=0 か -X utf8=0 で戻せる","profiling パッケージと統計的サンプリングプロファイラ Tachyon（profiling.sampling）が追加された"]}]}]}]</script>
<script>
'use strict';
(function(){

/* ---------- 小道具 ---------- */
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hashStr(str){ let h = 2166136261 >>> 0; for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed){ let a = seed >>> 0; return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = Math.random;
const ri = (a, b) => a + Math.floor(R() * (b - a + 1));
const pick = arr => arr[Math.floor(R() * arr.length)];
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(R() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function fmtNum(n){ if (n >= 10000){ const v = n / 10000; return (v >= 100 ? Math.round(v) : v.toFixed(1).replace(/\.0$/, '')) + '万'; } return n.toLocaleString('ja-JP'); }
const clone = o => JSON.parse(JSON.stringify(o));
const newId = () => 'p' + Date.now().toString(36) + Math.floor(R() * 1e6).toString(36);
const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '—';

/* ---------- 保存（この端末＋アカウント） ---------- */
const KEY = 'manabi-tl-v1', LKEY = 'manabi-tl-list-v1';
const S_DEF = () => ({topics:[], stats:{}, weak:[], seen:{}, terms:[], cov:{}, mode:'default', onboarded:false, rr:0, daily:null, saved:{like:[], bm:[], mine:[]}, updatedAt:0, termsAt:0, synced:0});
const S = Object.assign(S_DEF(), (function(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } })());
let LIST = (function(){ try { const v = JSON.parse(localStorage.getItem(LKEY)); return Array.isArray(v) ? v : []; } catch(e){ return []; } })();
function saveLocal(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
let listT;
function persistList(){ clearTimeout(listT); listT = setTimeout(() => { try { localStorage.setItem(LKEY, JSON.stringify(LIST.slice(0, 150))); } catch(e){} }, 400); }
function touchPrefs(){ S.updatedAt = Date.now(); saveLocal(); queuePrefs(); renderSide(); }

function today(){ const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function D(){ if (!S.daily || S.daily.d !== today()) S.daily = {d:today(), n:0, q:0, qc:0, c:0, w:0}; return S.daily; }
function TS(tid){ return S.stats[tid] || (S.stats[tid] = {n:0, q:0, qc:0, c:0, cc:0}); }

const SAVE = {db:null, uid:null, live:false, like:new Map(), bm:new Map(), mine:new Map()};
['like', 'bm', 'mine'].forEach(k => ((S.saved || {})[k] || []).forEach(x => { if (x && x.spec && x.spec.id) SAVE[k].set(x.spec.id, x); }));
const byNew = m => [...m.values()].sort((a, b) => (b.at || 0) - (a.at || 0));
function mirrorLocal(){ S.saved = {like:byNew(SAVE.like), bm:byNew(SAVE.bm), mine:byNew(SAVE.mine)}; saveLocal(); }
const KP = {like:'L~', bm:'B~', mine:'M~'};
const PEND = {};
function dbWrite(key, body){
  if (!SAVE.db) return;
  PEND[key] = (PEND[key] || Promise.resolve()).then(() => {
    const ref = SAVE.db.collection('data/users/' + SAVE.uid).doc(key);
    return body ? ref.set(body) : ref.delete();
  }).catch(e => {
    const c = e && e.code;
    if (c === 'quota_exceeded') toast('保存できる数の上限に達しました。いくつか外してください');
    else if (c === 'invalid_argument' || c === 'revoked' || c === 'not_granted' || c === 'permission_denied'){ SAVE.db = null; renderSyncNote(); toast('アカウントに保存できませんでした。この端末にだけ保存します'); }
  });
}
function setSaved(kind, sp, on){
  const map = SAVE[kind]; const old = map.get(sp.id); const at = old ? old.at : Date.now();
  const c = clone(sp);
  if (on) map.set(sp.id, {spec:c, at}); else map.delete(sp.id);
  mirrorLocal();
  dbWrite(KP[kind] + sp.id, on ? {kind, at, json:JSON.stringify(c)} : null);
}
const prefsBody = () => ({kind:'prefs', updatedAt:S.updatedAt, topics:S.topics, stats:S.stats, weak:S.weak, seen:S.seen, cov:S.cov, mode:S.mode, onboarded:!!S.onboarded, rr:S.rr || 0, daily:S.daily || null});
const termsBody = () => ({kind:'terms', updatedAt:S.termsAt, list:S.terms});
let prefT, termT;
function queuePrefs(){ if (!SAVE.db || !SAVE.live) return; clearTimeout(prefT); prefT = setTimeout(() => dbWrite('prefs', prefsBody()), 1200); }
function queueTerms(){ if (!SAVE.db || !SAVE.live) return; clearTimeout(termT); termT = setTimeout(() => dbWrite('terms', termsBody()), 1500); }
function adoptPrefs(p){
  const before = JSON.stringify(S.topics);
  S.topics = Array.isArray(p.topics) ? p.topics : []; S.stats = p.stats || {}; S.weak = Array.isArray(p.weak) ? p.weak : [];
  S.seen = p.seen || {}; S.cov = p.cov || {}; S.mode = p.mode === 'quick' ? 'quick' : 'default'; S.onboarded = !!p.onboarded; S.rr = p.rr || 0;
  if (p.daily) S.daily = p.daily; S.updatedAt = p.updatedAt || 0;
  autoLink(); saveLocal();
  if (JSON.stringify(S.topics) !== before){
    LIST = LIST.filter(sp => sp.type === 'mine' || topicById(sp.topic)); persistList();
    if (TAB !== 'all' && !topicById(TAB)) TAB = 'all';
    renderAll();
  } else { renderSide(); if (VIEW === 'topics') renderTopics(); }
}
function adoptTerms(t){ S.terms = Array.isArray(t.list) ? t.list : []; S.termsAt = t.updatedAt || 0; saveLocal(); if (VIEW === 'dict') renderDict(); }
async function initSync(){
  if (!window.claude || typeof window.claude.use !== 'function') return;
  let db = null, uid = null;
  try { db = await window.claude.use('db'); const u = await window.claude.use('user'); uid = u ? await u.id() : null; } catch(e){ return; }
  if (!db || !uid) return;
  SAVE.db = db; SAVE.uid = uid;
  let first = true;
  try {
    db.collection('data/users/' + uid).where('kind', 'in', ['prefs', 'terms', 'like', 'bm', 'mine']).onSnapshot(snap => {
      const fromCache = !!(snap.metadata && snap.metadata.fromCache);
      if (first && fromCache) return;
      const maps = {like:new Map(), bm:new Map(), mine:new Map()}; let prefs = null, terms = null;
      snap.docs.forEach(d => {
        const v = d.data(); if (!v) return;
        if (v.kind === 'prefs') prefs = v;
        else if (v.kind === 'terms') terms = v;
        else if (maps[v.kind] && v.json){ try { const sp = JSON.parse(v.json); if (sp && sp.id) maps[v.kind].set(sp.id, {spec:sp, at:v.at || 0}); } catch(e){} }
      });
      if (first){
        first = false; SAVE.live = true;
        if (!S.synced){
          ['like', 'bm', 'mine'].forEach(k => SAVE[k].forEach((x, id) => { if (!maps[k].has(id)){ maps[k].set(id, x); dbWrite(KP[k] + id, {kind:k, at:x.at || Date.now(), json:JSON.stringify(x.spec)}); } }));
          S.synced = 1;
        }
        if (prefs && (prefs.updatedAt || 0) > (S.updatedAt || 0)) adoptPrefs(prefs); else if (S.updatedAt) dbWrite('prefs', prefsBody());
        if (terms && (terms.updatedAt || 0) > (S.termsAt || 0)) adoptTerms(terms); else if (S.termsAt) dbWrite('terms', termsBody());
      } else {
        if (prefs && (prefs.updatedAt || 0) > (S.updatedAt || 0)) adoptPrefs(prefs);
        if (terms && (terms.updatedAt || 0) > (S.termsAt || 0)) adoptTerms(terms);
      }
      SAVE.like = maps.like; SAVE.bm = maps.bm; SAVE.mine = maps.mine;
      mirrorLocal(); paintSaved(); renderSyncNote();
    }, () => { SAVE.db = null; SAVE.live = false; renderSyncNote(); });
  } catch(e){ SAVE.db = null; }
}

/* ---------- 項目とアカウント ---------- */
const PAL = ['#5a4fcf','#0f7c63','#2a5f9e','#b3332b','#c25a12','#7d3c98','#13806b','#1f6fa8','#4a7a12','#0b6f85','#a3201d','#3d4b5c'];
const FIELDS = (function(){ try { const v = JSON.parse(document.getElementById('fields-data').textContent); return Array.isArray(v) ? v : []; } catch(e){ return []; } })();
FIELDS.forEach(f => {
  f.flat = []; f.sources = f.sources || [];
  f.units.forEach((u, ui) => (u.items || []).forEach((it, ii) => f.flat.push({k:ui + '.' + ii, ui, u:u.u, n:it.n, p:it.p || [], s:it.s || []})));
  f.byK = Object.fromEntries(f.flat.map(x => [x.k, x]));
});
const FBY = Object.fromEntries(FIELDS.map(f => [f.id, f]));
const GROUPS = ['資格試験', '教養・専門'];
const fieldOf = t => t && t.cat ? FBY[t.cat] || null : null;
const normName = s => String(s || '').replace(/[\s（）()・、]/g, '').toLowerCase();
function covOf(t){ const f = fieldOf(t); if (!f) return null; const c = S.cov[t.id] || {}; const done = f.flat.filter(x => c[x.k]).length; return {done, total:f.flat.length}; }
const MAX_TOPICS = 8;
const topicById = id => S.topics.find(t => t.id === id);
const topicName = id => { const t = topicById(id); return t ? t.name : ''; };
const firstChar = s => { const c = Array.from(String(s).replace(/[\s（）()「」]/g, ''))[0] || '学'; return c.toUpperCase(); };
const FIXED = {
  owl:   {name:'フクロウ先生', handle:'owl_sensei', av:'🦉', bg:'#5b4636', verified:true},
  suzume:{name:'スズメさん', handle:'suzume_san', av:'🐦', bg:'#a8743a'},
  me:    {name:'あなた', handle:'you', av:'私', bg:'#536471'}
};
const ROLES = {
  sensei:{suf:'の先生', h:'sensei', verified:true, off:0},
  bot:   {suf:'bot', h:'bot', bot:true, off:3},
  note:  {suf:'ノート', h:'note', off:6},
  quiz:  {suf:'クイズ', h:'quiz', off:2, av:'Q'},
  card:  {suf:'一問一答', h:'ichimon', bot:true, off:5, av:'問'},
  myth:  {suf:'の誤解ハンター', h:'gokai', off:8, av:'誤'}
};
function acct(k, tid){
  if (FIXED[k]) return FIXED[k];
  const t = topicById(tid) || {id:'x', name:'学び', ci:11, color:'#536471'};
  const r = ROLES[k] || ROLES.sensei;
  return {name:t.name + r.suf, handle:r.h + '_' + (hashStr(t.id) % 9000 + 1000), av:r.av || firstChar(t.name),
          bg:k === 'sensei' ? (t.color || PAL[0]) : PAL[((t.ci || 0) + r.off) % PAL.length], verified:r.verified, bot:r.bot};
}
function addTopic(name, note, cat){
  name = String(name || '').trim().replace(/\s+/g, ' ').slice(0, 30); note = String(note || '').trim().slice(0, 120);
  if (!name) return null;
  if (S.topics.length >= MAX_TOPICS){ toast('項目は' + MAX_TOPICS + 'つまでです'); return null; }
  if (S.topics.some(t => t.name === name) || (cat && S.topics.some(t => t.cat === cat))){ toast('「' + name + '」はもう入っています'); return null; }
  if (!cat){ const f = FIELDS.find(x => normName(x.name) === normName(name) || (x.aliases || []).some(a => normName(a) === normName(name))); if (f && !S.topics.some(t => t.cat === f.id)) cat = f.id; }
  const used = new Set(S.topics.map(t => t.ci)); let ci = 0; while (used.has(ci) && ci < PAL.length) ci++;
  ci = ci % PAL.length;
  const t = {id:'t' + Date.now().toString(36) + Math.floor(R() * 1296).toString(36), name, note, ci, color:PAL[ci], at:Date.now()};
  if (cat && FBY[cat]){ t.cat = cat; t.off = []; t.order = 'seq'; }
  S.topics.push(t); touchPrefs();
  return t;
}
function removeTopic(id){
  S.topics = S.topics.filter(t => t.id !== id);
  delete S.stats[id]; delete S.seen[id]; delete S.cov[id];
  S.weak = S.weak.filter(w => w.topic !== id);
  const nT = S.terms.length; S.terms = S.terms.filter(t => t.topic !== id); if (S.terms.length !== nT){ S.termsAt = Date.now(); queueTerms(); }
  LIST = LIST.filter(sp => sp.topic !== id || sp.type === 'mine'); persistList();
  if (TAB === id) TAB = 'all';
  if (!S.topics.length) S.onboarded = false;
  touchPrefs(); renderAll();
}

function autoLink(){
  let changed = false;
  S.topics.forEach(t => {
    if (t.cat) return;
    const f = FIELDS.find(x => normName(x.name) === normName(t.name) || (x.aliases || []).some(a => normName(a) === normName(t.name)));
    if (f && !S.topics.some(o => o.cat === f.id)){ t.cat = f.id; t.off = []; t.order = 'seq'; changed = true; }
  });
  return changed;
}

/* ---------- 文章の装飾 ---------- */
// #タグは色付き（項目のタブへ）、用語は点線（タップで意味）
function fmt(text, terms, tid){
  const raw = String(text == null ? '' : text);
  const parts = []; let last = 0, m; const re = /[#＃][^\s#＃、。，．,!?！？「」『』（）()]+/g;
  while ((m = re.exec(raw))){ if (m.index > last) parts.push({t:raw.slice(last, m.index)}); parts.push({tag:m[0]}); last = m.index + m[0].length; }
  if (last < raw.length) parts.push({t:raw.slice(last)});
  const ts = (terms || []).filter(x => x && x.w).slice().sort((a, b) => b.w.length - a.w.length);
  const used = new Set();
  return parts.map(p => {
    if (p.tag) return `<button class="tag" data-act="tag" data-tag="${esc(p.tag)}">${esc(p.tag)}</button>`;
    const segs = [{t:p.t}];
    ts.forEach(term => {
      if (used.has(term.w)) return;
      for (let i = 0; i < segs.length; i++){
        const sg = segs[i]; if (sg.hl) continue; const k = sg.t.indexOf(term.w); if (k < 0) continue;
        used.add(term.w); segs.splice(i, 1, {t:sg.t.slice(0, k)}, {hl:term.w}, {t:sg.t.slice(k + term.w.length)}); break;
      }
    });
    return segs.map(sg => sg.hl ? `<span class="g" data-act="g" data-w="${esc(sg.hl)}" data-t="${esc(tid || '')}" role="button" tabindex="0">${esc(sg.hl)}</span>` : esc(sg.t)).join('');
  }).join('').replace(/\n/g, '<br>');
}

function pickTargets(tab){
  if (tab !== 'all'){ const t = topicById(tab); return t ? [t] : []; }

  const out = []; const n = S.topics.length; const start = (S.rr || 0) % n;
  for (let i = 0; i < 3; i++) out.push(S.topics[(start + i) % n]);

// 細目マップのある項目は、まだ少ししか扱っていない細目から順に選ぶ
function pickItems(t, k){
  const f = fieldOf(t); if (!f) return [];
  const off = new Set(t.off || []);
  let cands = f.flat.filter(x => !off.has(x.ui)); if (!cands.length) cands = f.flat.slice();
  if (t.order === 'rand') cands = shuffle(cands.slice());
  const cov = S.cov[t.id] || {};
  return cands.map((x, i) => ({x, i, c:cov[x.k] || 0})).sort((a, b) => a.c - b.c || a.i - b.i).slice(0, k).map(o => o.x);
}
function makePlan(n, focus){
  if (focus){
    const t = topicById(focus.tid); const f = fieldOf(t); const it = f && f.byK[focus.k];

  }
  const targets = pickTargets(TAB); if (!targets.length) return [];
  const plan = [];
  targets.forEach((t, i) => {
    const c = Math.floor(n / targets.length) + (i < n % targets.length ? 1 : 0); if (!c) return;
    const items = pickItems(t, Math.ceil(c / 2));
    if (!items.length){ plan.push({t, c}); return; }
    let left = c;
    items.forEach((it, j) => { const cc = j === items.length - 1 ? left : Math.min(2, left); if (cc > 0) plan.push({t, it, c:cc}); left -= cc; });

    return `${head} の細目 item:"${e.it.k}"「${e.it.u} › ${e.it.n}」：${how}。\n  ${itemLines(e.t, e.it)}`;

  const seen = topics.map(t => { const k = (S.seen[t.id] || []).slice(-40); return k.length ? `- ${t.id}: ${k.join('、')}` : ''; }).filter(Boolean).join('\n');

async function streamReply(p, sp, who, prompt){
  const th = $('.thread', p);
  th.insertAdjacentHTML('beforeend', replyRow(who, sp.topic, '<span class="typing" aria-label="返信を書いています"><i></i><i></i><i></i></span>', {to:'me', tm:'たった今'}));
  th.hidden = false; const tl = $('.avcol > .tline', p); if (tl) tl.hidden = false;
  const row = th.lastElementChild; const tx = $('.txt', row);
  const sample = await getSample();
  if (!sample){ tx.textContent = 'この画面ではClaudeを呼び出せないため、返信できません。'; return; }
  try {
    const r = await sample(prompt, {cache:false, modelTier:S.mode === 'quick' ? 'quick' : 'default', onText:({text}) => { tx.textContent = text; }});
    const ans = r.text.trim(); tx.innerHTML = fmt(ans, sp.terms, sp.topic) + (r.truncated ? '<div class="cut">（長くなったので途中で止めました）</div>' : '');
    sp.replies.push([who, ans]); afterSpecChange(sp);

}

/* ---------- 引っぱって更新（タッチ・ホイール） ---------- */
const PTR = $('#ptr');
const PULL_MAX = 120, PULL_GO = 72;
let pullH = 0, ptrBusy = false;
const atTop = () => (window.scrollY || document.documentElement.scrollTop || 0) <= 0;
const pullable = () => VIEW === 'home' && !feed.hidden && $('#scrim').hidden && $('#compose').hidden;
function setPull(h){
  pullH = h; PTR.style.height = h + 'px';
  const ready = h >= PULL_GO; PTR.classList.toggle('ready', ready && !ptrBusy);
  if (!ptrBusy) $('.ptrtxt', PTR).textContent = ready ? '離して更新' : '引っぱって更新';
}
function collapse(){ PTR.classList.add('anim'); setPull(0); setTimeout(() => PTR.classList.remove('anim'), 260); }
function refresh(){
  if (ptrBusy) return;
  if (GEN.busy){ collapse(); toast('いま書いています。少しお待ちください'); return; }
  if (GEN.disabled){ collapse(); toast(GEN.disabled); return; }
  ptrBusy = true; PTR.classList.add('anim', 'busy'); PTR.classList.remove('ready'); setPull(56); $('.ptrtxt', PTR).textContent = 'Claudeが書いています…';
  window.scrollTo(0, 0);
  let done = false;
  const end = () => { if (done) return; done = true; ptrBusy = false; PTR.classList.remove('busy'); collapse(); };
  generate('top', 4, {onFirst:end, onEnd:end});
}
let ty0 = null, pulling = false;
window.addEventListener('touchstart', e => {
  if (ptrBusy || !pullable() || !atTop() || e.touches.length !== 1){ ty0 = null; return; }
  ty0 = e.touches[0].clientY; pulling = false; PTR.classList.remove('anim');
}, {passive:true});
window.addEventListener('touchmove', e => {
  if (ty0 == null || ptrBusy) return;
  const dy = e.touches[0].clientY - ty0;
  if (dy <= 0 || !atTop()){ if (pulling){ pulling = false; setPull(0); } return; }
  pulling = true; if (e.cancelable) e.preventDefault();
  setPull(Math.min(PULL_MAX, dy * 0.5));
}, {passive:false});
function touchEnd(){ if (ty0 == null) return; ty0 = null; if (!pulling) return; pulling = false; if (pullH >= PULL_GO) refresh(); else collapse(); }
window.addEventListener('touchend', touchEnd); window.addEventListener('touchcancel', touchEnd);
let wAcc = 0, wTimer, topSince = 0;
window.addEventListener('scroll', () => { if (atTop()){ if (!topSince) topSince = performance.now(); } else topSince = 0; }, {passive:true});
window.addEventListener('wheel', e => {
  if (ptrBusy || !pullable() || !atTop() || e.deltaY >= 0) return;
  if (topSince && performance.now() - topSince < 120) return;
  wAcc += -e.deltaY * (e.deltaMode === 1 ? 33 : 1);
  PTR.classList.remove('anim'); setPull(Math.min(PULL_MAX, wAcc * 0.3));
  clearTimeout(wTimer);
  if (pullH >= PULL_MAX){ wAcc = 0; refresh(); return; }
  wTimer = setTimeout(() => { wAcc = 0; if (!ptrBusy) collapse(); }, 280);
}, {passive:true});

/* ---------- トースト ---------- */
let tt;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => { t.hidden = true; }, 2600); }

/* ---------- クリック処理 ---------- */
function afterAddTopic(t, go){
  if (!t) return;
  renderSide();
  if (!S.onboarded){ renderOnb(); const i = $('#onb input[name="name"]'); if (i) i.focus(); return; }
  if (go){ closeSheet(); if (VIEW !== 'home') show('home'); setTab(t.id); return; }
  renderTabs(); if (VIEW === 'topics') renderTopics();
  toast('「' + t.name + '」を追加しました。タブから開けます');
}
document.addEventListener('click', e => {
  const rv = e.target.closest('.reveal'); if (rv && !rv.classList.contains('open')){ doReveal(rv); return; }
  const el = e.target.closest('[data-act],[data-view],[data-tab]'); if (!el) return;
  if (el.dataset.view && !el.dataset.act){
    if (el.dataset.view === VIEW && VIEW === 'home'){ if (atTop() && pullable()) refresh(); else window.scrollTo({top:0, behavior:'smooth'}); return; }
    show(el.dataset.view); return;
  }
  if (el.classList.contains('tab') && el.dataset.tab && !el.dataset.act){
    if (TAB === el.dataset.tab){ if (atTop()) refresh(); else window.scrollTo({top:0, behavior:'smooth'}); return; }
    setTab(el.dataset.tab); return;
  }
  const act = el.dataset.act; const ctx = postOf(el);
  switch (act){
    case 'noop': return;
    case 'more': { const t = $('.txt', ctx.p); t.classList.remove('clamp'); el.remove(); return; }
    case 'thread': return openThread(ctx.p, ctx.sp);
    case 'like': {
      const on = !SAVE.like.has(ctx.sp.id); setSaved('like', ctx.sp, on); paintSaved();
      if (on && !S.likeHint){ S.likeHint = 1; saveLocal(); toast('いいねしたポストは「保存」に残ります'); }
      return; }
    case 'rt': { const on = !el.classList.contains('on'); el.classList.toggle('on', on); const n = $('.n', el); const base = ctx.sp.type === 'mine' ? 0 : metrics(ctx.sp.id).rt; n.textContent = (base + (on ? 1 : 0)) ? fmtNum(base + (on ? 1 : 0)) : ''; toast(on ? 'リポストしました' : 'リポストを取り消しました'); return; }
    case 'bm': { const on = !SAVE.bm.has(ctx.sp.id); setSaved('bm', ctx.sp, on); paintSaved(); toast(on ? 'ブックマークに追加しました' : 'ブックマークから外しました'); return; }
    case 'share': {
      const txt = postPlain(ctx.sp) + tagLine(ctx.sp);
      try { navigator.clipboard.writeText(txt).then(() => toast('テキストをコピーしました'), () => toast('コピーできませんでした')); } catch(err){ toast('コピーできませんでした'); }
      return; }
    case 'reply': return openReply(ctx);
    case 'vote': return votePoll(ctx, +el.dataset.i);
    case 'grade': return gradeCard(ctx, el.dataset.g);
    case 'g': return termSheet(el.dataset.w, el.dataset.t);
    case 'ask-term': closeSheet(); return openCompose('「' + el.dataset.w + '」について、もっと詳しく教えてください。', el.dataset.t);
    case 'tag': {
      const name = el.dataset.tag.replace(/^[#＃]/, ''); const norm = s => s.replace(/\s+/g, '').toLowerCase();
      const t = S.topics.find(x => norm(x.name) === norm(name)) || S.topics.find(x => norm(x.name).includes(norm(name)) || norm(name).includes(norm(x.name)));
      if (t){ if (VIEW !== 'home') show('home'); if (TAB !== t.id) setTab(t.id); else window.scrollTo({top:0, behavior:'smooth'}); }
      else toast(el.dataset.tag + ' は学ぶ項目にありません');
      return; }
    case 'gen': if (GEN.disabled){ toast(GEN.disabled); return; } GEN.needClick = false; return generate('bottom', 6);
    case 'stop': return stopGen();
    case 'newposts': $('#newpill').hidden = true; window.scrollTo(0, 0); return refresh();
    case 'start': if (!S.topics.length) return; S.onboarded = true; TAB = 'all'; touchPrefs(); renderHome(); return generate('bottom', 6);
    case 'sugg': { const t = addTopic(el.dataset.n, ''); return afterAddTopic(t, el.dataset.go === '1'); }
    case 'addcat': {
      const f = FBY[el.dataset.id]; if (!f) return;
      const ex = S.topics.find(t => t.cat === f.id);
      if (ex){ if (!S.onboarded) return removeTopic(ex.id); closeSheet(); if (VIEW !== 'home') show('home'); return setTab(ex.id); }
      return afterAddTopic(addTopic(f.name, '', f.id), el.dataset.go === '1'); }
    case 'map': return mapSheet(el.dataset.t);
    case 'item': return itemSheet(el.dataset.t, el.dataset.k);
    case 'focus': {
      if (GEN.busy){ toast('いま書いています。終わってからもう一度どうぞ'); return; }
      if (GEN.disabled){ toast(GEN.disabled); return; }
      const tid = el.dataset.t, k = el.dataset.k; closeSheet();
      if (VIEW !== 'home') show('home');
      if (TAB !== tid) setTab(tid, true);
      window.scrollTo(0, 0);
      return generate('top', 4, {focus:{tid, k}}); }
    case 'ask-item': { const t = topicById(el.dataset.t); const f = fieldOf(t); const it = f && f.byK[el.dataset.k]; if (!it) return; closeSheet(); return openCompose('「' + it.n + '」（' + it.u + '）について、ポイントをわかりやすく教えてください。', t.id); }
    case 'unit': {
      const t = topicById(el.dataset.t); if (!t) return; const ui = +el.dataset.u; const off = new Set(t.off || []);
      if (el.checked) off.delete(ui); else off.add(ui);
      const f = fieldOf(t); if (f && off.size >= f.units.length){ el.checked = true; off.delete(ui); toast('少なくとも1つの単元は残してください'); }
      t.off = [...off].sort((a, b) => a - b); touchPrefs();
      const mu = el.closest('.munit'); if (mu) mu.classList.toggle('off', off.has(ui));
      return; }
    case 'order': {
      const t = topicById(el.dataset.t); if (!t) return; t.order = el.dataset.o === 'rand' ? 'rand' : 'seq'; touchPrefs();
      $$('[data-act="order"]', el.parentNode).forEach(b => b.setAttribute('aria-checked', String(b.dataset.o === t.order)));
      return; }
    case 'rm-topic': return removeTopic(el.dataset.id);
    case 'add-topic': return addTopicSheet();
    case 'open-tab': if (VIEW !== 'home') show('home'); closeSheet(); return setTab(el.dataset.id);
    case 'edit-topic': return editTopicSheet(el.dataset.id);
    case 'del-topic': {
      if (el.dataset.confirm !== '1'){ el.dataset.confirm = '1'; el.textContent = 'もう一度押すと削除します（この項目のポストと記録も消えます）'; return; }
      closeSheet(); const name = topicName(el.dataset.id); removeTopic(el.dataset.id); toast('「' + name + '」を削除しました'); return; }
    case 'weak': return weakSheet(+el.dataset.i);
    case 'weak-rm': { S.weak.splice(+el.dataset.i, 1); touchPrefs(); closeSheet(); if (VIEW === 'topics') renderTopics(); toast('苦手リストから外しました'); return; }
    case 'weak-ask': { const w = S.weak[+el.dataset.i]; if (!w) return; closeSheet(); return openCompose('「' + w.q.slice(0, 80) + '」の答えが「' + w.a.slice(0, 60) + '」になる理由を教えてください。', w.topic); }
    case 'mode': S.mode = el.dataset.m === 'quick' ? 'quick' : 'default'; touchPrefs(); renderTopics(); toast(S.mode === 'quick' ? '「はやい」で書きます' : '「ていねい」に書きます'); return;
    case 'svtab': SVTAB = el.dataset.k; renderSaved(); return;
    case 'dtopic': DTOPIC = el.dataset.id; renderDict(); return;
    case 'compose': return openCompose();
    case 'ctopic': CTOPIC = el.dataset.id; renderCTopics(); return;
    case 'close-compose': $('#compose').hidden = true; return;
    case 'close-sheet': return closeSheet();
    case 'reset': {
      if (el.dataset.confirm !== '1'){ el.dataset.confirm = '1'; el.textContent = 'もう一度押すと、正答率・苦手リスト・今日の記録を消します（項目と保存は残ります）'; return; }
      S.stats = {}; S.weak = []; S.daily = null; touchPrefs(); renderTopics(); toast('記録をリセットしました'); return; }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ closeSheet(); $('#compose').hidden = true; }
  const t = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && t.classList && t.classList.contains('g')){ e.preventDefault(); termSheet(t.dataset.w, t.dataset.t); }
  if ((e.key === 'Enter' || e.key === ' ') && t.classList && t.classList.contains('reveal') && !t.classList.contains('open')){ e.preventDefault(); doReveal(t); }
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && t.tagName === 'TEXTAREA'){
    const f = t.closest('form'); if (f){ e.preventDefault(); f.requestSubmit ? f.requestSubmit() : f.dispatchEvent(new Event('submit', {cancelable:true, bubbles:true})); }
    else if (t.id === 'ctext' && !$('#cpost').disabled){ e.preventDefault(); postMine(); }
  }
});
document.addEventListener('submit', e => {
  e.preventDefault(); const f = e.target;
  if (f.dataset.form === 'reply'){ const uid = +f.dataset.uid; const p = document.getElementById('p' + uid); if (p) askReply({p, uid, sp:ST.get(uid)}, $('textarea', f).value); return; }
  if (f.dataset.form === 'topic'){ const t = addTopic(f.elements.name.value, f.elements.note.value); if (t){ f.reset(); afterAddTopic(t, f.dataset.go === '1'); } else if (!f.elements.name.value.trim()) f.elements.name.focus(); return; }
  if (f.dataset.form === 'edit'){
    const t = topicById(f.dataset.id); if (!t) return;
    const name = f.elements.name.value.trim().replace(/\s+/g, ' ').slice(0, 30);
    if (!name){ f.elements.name.focus(); return; }
    if (S.topics.some(x => x.id !== t.id && x.name === name)){ toast('同じ名前の項目があります'); return; }
    t.name = name; t.note = f.elements.note.value.trim().slice(0, 120);
    touchPrefs(); closeSheet(); renderAll(); toast('保存しました'); return;
  }
});
$('#scrim').addEventListener('click', e => { if (e.target.id === 'scrim') closeSheet(); });
$('#q').addEventListener('input', () => renderDict());
$('#ctext').addEventListener('input', updCount);
$('#cpost').addEventListener('click', postMine);

/* ---------- 起動 ---------- */
LIST = LIST.filter(sp => sp && sp.id && BUILD[sp.type] && (sp.type === 'mine' || topicById(sp.topic)));
if (autoLink()) saveLocal();
renderHome(); renderSide(); armPill(); getSample(); initSync();
})();
</script>
