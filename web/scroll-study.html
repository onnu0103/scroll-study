は65歳未満60万円、65歳以上110万円（年金以外の合計所得が1,000万円以下の場合）","公的年金等の収入400万円以下で他の所得が20万円以下なら所得税の確定申告は不要。障害年金・遺族年金は非課税"]},{"n":"損益通算と損失の繰越","p":["損益通算できるのは不動産所得・事業所得・山林所得・譲渡所得の損失のみ。一時所得や雑所得の損失は通算できない","不動産所得の損失のうち、土地の取得に要した借入金の利子に対応する部分は損益通算できない（建物分は可）","別荘・ゴルフ会員権など生活に通常必要でない資産の譲渡損失や、土地建物の譲渡損失は原則として通算できない","青色申告者の純損失は翌年以後3年間繰越控除でき、前年分の所得税の繰戻還付も受けられる","雑損失は白色申告でも3年間繰り越せる。居住用財産の譲渡損失も一定の要件で損益通算と3年間の繰越ができる"]}]},{"u":"D：所得控除・法人税・消費税","items":[{"n":"基礎控除（2025・2026年改正）","p":["2025年分から基礎控除の本則は合計所得2,350万円以下で58万円。2,350万円超は段階的に減り、2,500万円超はゼロ","2025年分は合計所得655万円以下に特例加算があり、132万円以下は37万円加算で95万円、336万円以下は30万円加算など","2026年度改正（2026年3月31日成立）で本則を62万円とし、2026・2027年分は合計所得489万円以下に42万円加算し最大104万円","改正後は基礎控除104万円と給与所得控除74万円の合計178万円が所得税の課税最低限。2026年分から年末調整で適用","2026年度改正の所得税部分は原則2026年12月1日施行で、法令基準日の2026年4月1日時点では施行前"],"s":[5,6,8,9,10]},{"n":"配偶者控除・扶養控除等","p":["配偶者控除は本人の合計所得1,000万円以下が要件で最高38万円（70歳以上は48万円）。本人900万円超で段階的に減る","2025年分から控除対象配偶者・扶養親族の合計所得要件は58万円以下（給与収入123万円以下）。2026年度改正で62万円以下","配偶者特別控除は配偶者の合計所得58万円超133万円以下で最高38万円。2026年度改正で下限は62万円超となる","扶養控除は16歳以上が対象で一般38万円、19歳以上23歳未満の特定扶養親族63万円、70歳以上48万円（同居老親等58万円）","特定親族特別控除（2025年分〜）は19歳以上23歳未満の親族の合計所得58万円超123万円以下で、最高63万円を段階的に控除"],"s":[9]},{"n":"医療費控除などの所得控除","p":["医療費控除は（支払医療費－保険金等の補てん額）－10万円（総所得金額等の5%の方が低ければその額）で上限200万円","セルフメディケーション税制は対象医薬品の購入費のうち1万2,000円超の部分を最高8万8,000円控除し、医療費控除と選択","社会保険料控除は生計を一にする親族の分を本人が払えば全額対象。iDeCoや小規模企業共済の掛金は本人分のみ控除","雑損控除は災害・盗難・横領が対象で詐欺・恐喝は対象外。寄附金控除は特定寄附金－2,000円（総所得金額等の40%が上限）","障害者控除27万円（特別障害者40万円・同居特別障害者75万円）、寡婦控除27万円、ひとり親控除35万円（2027年分〜38万円）"],"s":[6]},{"n":"配当控除と住宅ローン控除","p":["配当控除は総合課税を選んだ配当所得が対象で、課税総所得金額等1,000万円以下の部分は10%、超える部分は5%","住宅ローン控除は年末残高×0.7%を控除し、期間は新築13年・既存10年。合計所得2,000万円以下、借入期間10年以上が要件","床面積は原則50㎡以上で、合計所得1,000万円以下なら40㎡以上も可。2026年度改正で40㎡の特例を既存住宅にも拡大","所得税から控除しきれない額は、住民税から課税総所得金額等の5%（最高9.75万円）まで控除できる","2026年度改正で適用期限を2030年入居分まで5年延長し、省エネ基準適合以上の既存住宅の控除期間を13年に拡充"],"s":[6,8]},{"n":"確定申告と青色申告","p":["確定申告期間は翌年2月16日〜3月15日。給与収入2,000万円超や給与以外の所得が20万円超の給与所得者は申告が必要","納税者が死亡した場合、相続人は相続開始を知った日の翌日から4か月以内に準確定申告を行う","青色申告の承認申請はその年の3月15日まで（1月16日以後の開業は開業日から2か月以内）。対象は不動産・事業・山林所得","青色申告特別控除は事業的規模で正規の簿記とe-Tax等の要件を満たせば65万円、e-Taxなし55万円、それ以外は10万円","青色事業専従者給与は届け出た範囲内で全額必要経費になる。専従者は配偶者控除や扶養控除の対象外"],"s":[12]},{"n":"住民税と個人事業税","p":["住民税は前年の所得に基づき1月1日の住所地で課税する。所得割は一律10%（道府県民税4%・市町村民税6%）","均等割の標準税率は道府県民税1,000円・市町村民税3,000円で、国税の森林環境税1,000円が併せて徴収される","住民税の基礎控除は43万円（合計所得2,400万円以下）で、所得税より人的控除額が小さい","給与所得者は6月から翌年5月までの12回で特別徴収、事業者等は原則年4回の普通徴収で納める","個人事業税は事業主控除290万円を差し引き、業種に応じて3〜5%で課税する。青色申告特別控除は適用されない"]},{"n":"法人税の仕組みと税率","p":["法人税の所得は益金－損金。別表四で当期利益に損金不算入額などを加算し、益金不算入額などを減算して求める","普通法人の税率は23.2%。資本金1億円以下の中小法人は年800万円以下の所得部分に軽減税率15%が適用される","申告期限は事業年度終了日の翌日から2か月以内。青色申告法人の欠損金は10年間繰り越せ、中小法人は所得の全額まで控除","2026年4月以後に開始する事業年度から防衛特別法人税が課される","流動比率＝流動資産÷流動負債、自己資本比率＝自己資本÷総資本。損益分岐点売上高＝固定費÷限界利益率"],"s":[5,14]},{"n":"法人税の損金算入","p":["資本金1億円以下の法人の交際費は年800万円の定額控除か接待飲食費の50%を選んで損金算入。1人1万円以下の飲食費は交際費外","役員給与で損金になるのは定期同額給与・事前確定届出給与・業績連動給与。不相当に高額な部分は損金不算入","事業税・固定資産税・印紙税は損金算入、法人税・住民税・延滞税・加算税・罰金は損金不算入","取得価額10万円未満の減価償却資産は全額損金、20万円未満は一括償却資産として3年均等償却を選べる","中小企業者等の少額減価償却資産の特例（30万円未満を年300万円まで即時損金）は2026年度改正で取得価額の基準を引上げ"],"s":[5]},{"n":"会社と役員間の取引","p":["役員が会社に時価の2分の1未満で資産を譲渡すると、役員は時価で譲渡したものとみなされて譲渡所得が課税される","会社が役員に資産を低額で譲渡すると、時価との差額は役員給与（賞与）とされ会社では原則損金不算入になる","役員が会社に時価より高く資産を売ると、時価を超える部分は役員の給与所得となる","役員が会社から無利息で借りると通常の利息との差額が役員給与となるが、会社が役員から無利息で借りても課税関係は生じない"]},{"n":"消費税の仕組みと納税義務","p":["標準税率10%（国7.8%・地方2.2%）。軽減税率8%は酒類・外食を除く飲食料品と週2回以上発行の定期購読の新聞","土地の譲渡・貸付、住宅の貸付（1か月未満を除く）、有価証券の譲渡、利子・保険料、社会保険医療などは非課税","基準期間（個人は前々年、法人は前々事業年度）の課税売上高が1,000万円以下なら原則として免税事業者となる","特定期間（前年または前事業年度の上半期）の課税売上高と給与等の額がともに1,000万円超なら課税事業者となる","資本金1,000万円以上の新設法人は基準期間のない設立1・2期目も納税義務がある。個人事業者の申告期限は翌年3月31日"]},{"n":"簡易課税とインボイス制度","p":["簡易課税は基準期間の課税売上高5,000万円以下で選択でき、適用する課税期間の開始前に届け出て2年間継続適用する","みなし仕入率は卸売業90%、小売業80%、製造業70%、その他60%、サービス業50%、不動産業40%","インボイス制度は2023年10月開始。仕入税額控除には原則として適格請求書発行事業者が交付したインボイスの保存が必要","免税事業者から登録した事業者の2割特例は2026年9月30日を含む課税期間まで。個人事業者は2027・2028年分に3割特例","免税事業者からの仕入れの控除割合は80%から2026年10月70%、2028年10月50%、2030年10月30%と縮減し2031年9月末で終了"],"s":[5,7]}]},{"u":"E：不動産の法令と取引","items":[{"n":"不動産登記","p":["表題部は所在・地番・地目・地積など物理的状況、権利部の甲区は所有権、乙区は抵当権など所有権以外の権利を記録する","登記には対抗力があるが公信力はない。仮登記には対抗力がなく、本登記の順位を保全する効力のみがある","登記事項証明書は利害関係がなくても誰でも交付請求できる。公図は精度が低く、14条地図の方が精度が高い","2024年4月から相続登記が義務化され、取得を知った日から3年以内の申請が必要（正当な理由なく怠ると10万円以下の過料）","2026年4月から住所等の変更登記が義務化され、変更日から2年以内に申請しなければならない"],"s":[14]},{"n":"不動産の価格と鑑定評価","p":["公示価格は国土交通省土地鑑定委員会が毎年1月1日時点、基準地価は都道府県が7月1日時点の価格を公表する","相続税路線価は1月1日時点で公示価格の約8割、固定資産税評価額は公示価格の約7割が目安で3年ごとに評価替えする","原価法は再調達原価に減価修正して積算価格を、取引事例比較法は事情補正・時点修正をして比準価格を求める","収益還元法の直接還元法は1期間の純収益÷還元利回り、DCF法は将来の純収益と復帰価格を現在価値に割り引いて合計する"]},{"n":"宅建業法と売買契約","p":["専任媒介は2週間に1回以上、専属専任媒介は1週間に1回以上の業務報告が必要で、有効期間はともに3か月以内","宅地建物取引士は契約成立前に重要事項を説明し書面を交付する（電磁的方法も可）。自ら貸主となる賃貸は宅建業に当たらない","売買の仲介報酬の上限は400万円超で取引価格×3%＋6万円（別途消費税）。800万円以下の低廉な空家等は30万円（税別）まで","解約手付は相手方が履行に着手するまで、買主は手付放棄、売主は倍額を現実に提供して解除できる。業者売主の手付は2割まで","契約不適合責任で買主は追完・代金減額・損害賠償・解除を請求でき、種類・品質の不適合は知った時から1年以内に通知する"]},{"n":"借地権","p":["普通借地権の存続期間は30年以上で、定めがないか30年未満なら30年。更新後は1回目20年以上、2回目以降10年以上","普通借地権は地主に正当事由がなければ更新を拒絶できず、更新されない場合は借地人に建物買取請求権がある","一般定期借地権は存続期間50年以上で用途制限がなく、書面（電磁的記録可）で契約し、更新・建物買取請求はない","事業用定期借地権等は10年以上50年未満の事業用建物に限り、公正証書での契約が必要。居住用建物には使えない","建物譲渡特約付借地権は30年以上で、期間満了時に地主が建物を買い取ることで借地権が消滅する"]},{"n":"借家権","p":["普通借家契約の期間は1年以上とし、1年未満の定めは期間の定めがない契約とみなされる","普通借家で貸主が更新を拒絶するには、期間満了の1年前から6か月前までの通知と正当事由が必要","定期借家契約は書面（電磁的記録可）で結び、事前に更新がない旨を書面で説明する。1年未満の期間も定められる","期間1年以上の定期借家では、貸主が期間満了の1年前から6か月前までに終了を通知しないと終了を借主に対抗できない","床面積200㎡未満の居住用定期借家は、転勤等やむを得ない事情があれば借主が中途解約でき、申入れから1か月で終了"],"s":[14]},{"n":"区分所有法","p":["専有部分と敷地利用権は原則として分離して処分できない。共用部分の持分は専有部分の床面積（内法）の割合による","区分所有者は全員が管理組合の構成員となり任意に脱退できない。管理者は少なくとも年1回集会を招集する","規約の設定・変更・廃止は特別決議（4分の3以上）、建替え決議は原則5分の4以上の多数が必要","規約や集会の決議は区分所有者の特定承継人にも効力が及び、賃借人等の占有者も建物の使用方法については規約に従う"]},{"n":"都市計画法と農地法","p":["市街化区域は既成市街地とおおむね10年以内に優先的に市街化を図る区域、市街化調整区域は市街化を抑制する区域","用途地域は13種類で、市街化区域には必ず定め、市街化調整区域には原則として定めない","開発許可は市街化区域で原則1,000㎡以上、非線引き区域3,000㎡以上、区域外1ha以上で必要。市街化調整区域は規模を問わない","農地の権利移動は3条（農業委員会の許可）、転用は4条、転用目的の権利移動は5条（都道府県知事等の許可）","市街化区域内の農地転用は農業委員会への届出で足りる。相続による農地の取得は許可不要だが農業委員会への届出が必要"]},{"n":"建築基準法（道路・用途・高さ）","p":["建築物の敷地は原則として幅員4m以上の道路に2m以上接しなければならない（接道義務）","幅員4m未満の2項道路は道路中心線から2m後退した線が道路境界とみなされ、セットバック部分は敷地面積に算入しない","敷地が複数の用途地域にまたがる場合、敷地の過半が属する用途地域の用途制限が敷地全体に適用される","第一種・第二種低層住居専用地域と田園住居地域には10mまたは12mの絶対高さ制限があり、隣地斜線制限は適用されない","建築物が防火地域と準防火地域にまたがる場合、原則として厳しい防火地域の規制が建物全体に適用される"]},{"n":"建ぺい率と容積率","p":["建ぺい率は特定行政庁指定の角地で＋10%、防火地域内の耐火建築物等や準防火地域内の耐火・準耐火建築物等で＋10%","建ぺい率80%の地域内かつ防火地域内の耐火建築物等は建ぺい率の制限がない。複数地域にまたがれば加重平均する","前面道路の幅員が12m未満なら、容積率は幅員×法定乗数（住居系4/10、その他6/10）と指定容積率の小さい方","幅員15m以上の特定道路から70m以内の敷地は、前面道路の幅員が6m以上12m未満なら容積率が緩和される","地階の住宅部分は住宅全体の床面積の3分の1まで、自動車車庫は全体の5分の1まで延べ面積に算入しない"],"s":[13,14]}]},{"u":"E：不動産の税金と活用","items":[{"n":"不動産取得税と登録免許税","p":["不動産取得税は都道府県税で、相続や包括遺贈による取得は非課税、贈与による取得は課税される","不動産取得税の税率は本則4%、土地と住宅は3%。宅地の課税標準を固定資産税評価額の2分の1とする特例がある","床面積50㎡以上240㎡以下の新築住宅は、課税標準から1,200万円（認定長期優良住宅は1,300万円）を控除できる","登録免許税の本則税率は所有権保存0.4%、売買による移転2%、相続0.4%、贈与2%、抵当権設定0.4%","土地売買の所有権移転登記の軽減税率（1.5%）は2026年度改正で3年延長。住宅用家屋の保存・移転等にも軽減税率がある"],"s":[5,14]},{"n":"固定資産税・都市計画税・印紙税","p":["固定資産税は1月1日時点の所有者に市町村が課税し、標準税率は1.4%。免税点は土地30万円、家屋20万円","住宅用地の課税標準は200㎡以下の部分が6分の1、200㎡超の部分が3分の1（都市計画税はそれぞれ3分の1、3分の2）","都市計画税は原則として市街化区域内の土地・家屋に課され、制限税率は0.3%","新築住宅は床面積120㎡までの部分の固定資産税が一定期間2分の1に軽減される（一般住宅3年、中高層耐火住宅5年）","印紙を貼らなくても契約は有効だが、過怠税（原則として本来の税額の3倍）が課される。電子契約には印紙税がかからない"]},{"n":"土地建物の譲渡所得","p":["譲渡所得＝譲渡収入－（取得費＋譲渡費用）－特別控除。取得費が不明なら譲渡収入の5%を概算取得費にできる","譲渡した年の1月1日時点で所有期間5年超は長期で20.315%、5年以下は短期で39.63%の分離課税","相続・贈与で取得した資産は被相続人等の取得日・取得費を引き継ぐ。仲介手数料や立退料は譲渡費用になる","相続税の申告期限の翌日以後3年以内に相続財産を譲渡すると、納めた相続税のうち一定額を取得費に加算できる"]},{"n":"居住用財産の譲渡の特例","p":["居住用財産の3,000万円特別控除は所有期間を問わない。配偶者・直系血族等への譲渡や前年・前々年の適用者は対象外","住まなくなった日から3年を経過する日の属する年の12月31日までの譲渡なら、3,000万円特別控除を受けられる","所有期間10年超なら軽減税率の特例で課税長期譲渡所得6,000万円以下の部分が14.21%となり、3,000万円控除と併用できる","特定居住用財産の買換え特例は所有期間10年超・居住期間10年以上・譲渡対価1億円以下が要件で、課税が繰り延べられる","居住用財産の譲渡の特例を受けると、居住年とその前2年・後3年の間は住宅ローン控除を受けられない"],"s":[13]},{"n":"空き家特例と交換特例","p":["被相続人の居住用財産（空き家）の3,000万円特別控除は1981年5月31日以前建築の家屋で、譲渡対価1億円以下が要件","空き家特例は相続開始から3年を経過する日の属する年の12月31日までの譲渡で、耐震改修か家屋の取壊しが必要","2024年以後は譲渡後、翌年2月15日までの耐震改修・取壊しも対象。相続人が3人以上なら1人当たり2,000万円","固定資産の交換特例は同種資産の交換で双方が1年以上所有し、交換差金が高い方の時価の20%以内などが要件"],"s":[13]},{"n":"土地の有効活用と投資判断","p":["等価交換方式は土地の一部を提供し建物の一部を取得する方式で、土地所有者は建設資金が不要","事業受託方式は企画から管理までデベロッパーに任せ、土地信託方式は信託銀行に土地を信託して配当を受け取る","定期借地権方式は資金負担なしに地代収入を得る。建設協力金方式はテナントから預かる建設協力金を建設資金に充てる","純収益（NOI）利回り＝（年間賃料－諸経費）÷投資額。表面利回りは諸経費を考慮しない","DCF法ではNPV（正味現在価値）が0を上回るか、IRR（内部収益率）が期待収益率を上回れば投資適格と判断する"]},{"n":"不動産の証券化とJ-REIT","p":["J-REITは投資法人が不動産に投資して賃料収入などを分配する上場商品で、取引所で株式と同様に売買できる","J-REITは配当可能利益の90%超を分配するなどの要件を満たすと分配金を損金算入でき、実質的に法人税がかからない","J-REITの分配金は配当所得だが配当控除の対象外。譲渡益は上場株式等の譲渡所得として申告分離課税","レバレッジ効果は投資の利回りが借入金利を上回るとき自己資金の利回りを高めるが、下回ると逆に低下させる"]}]},{"u":"F：贈与・相続の民法","items":[{"n":"贈与契約の種類","p":["贈与は当事者の合意で成立する諾成契約。書面によらない贈与は履行が終わった部分を除き各当事者が解除できる","定期贈与は当事者の一方の死亡で効力を失う。負担付贈与では贈与者は負担の限度で売主と同様の担保責任を負う","死因贈与は贈与者の死亡で効力が生じ、遺贈と同じく相続税の課税対象となる","個人間の負担付贈与で取得した土地・建物は、相続税評価額ではなく通常の取引価額で評価して贈与税を計算する"]},{"n":"相続人と法定相続分","p":["配偶者は常に相続人。血族は第1順位が子、第2順位が直系尊属、第3順位が兄弟姉妹で、先順位者がいれば後順位は相続しない","法定相続分は配偶者と子が各2分の1、配偶者と直系尊属が3分の2と3分の1、配偶者と兄弟姉妹が4分の3と4分の1","子の代襲は孫・ひ孫と再代襲できるが、兄弟姉妹の代襲は甥・姪まで。相続放棄は代襲相続の原因にならない","非嫡出子の相続分は嫡出子と同じ。父母の一方のみを同じくする兄弟姉妹の相続分は、父母双方が同じ兄弟姉妹の2分の1","普通養子は実親との親族関係も続き双方の相続人となる。特別養子は実親との親族関係が終了する"]},{"n":"相続の承認・放棄と遺産分割","p":["相続放棄・限定承認は相続開始を知った時から3か月以内に家庭裁判所へ申述する。限定承認は相続人全員の共同が必要","相続放棄は単独でできるが生前にはできない。3か月以内に手続きしないか相続財産を処分すると単純承認とみなされる","遺産分割は遺言による指定分割が優先し、協議分割は相続人全員の合意があれば法定相続分と異なる分割もできる","代償分割は特定の相続人が財産を取得し他の相続人に代償金を払う方法。換価分割は財産を売却して代金を分ける","配偶者居住権は遺産分割や遺贈で取得し、原則終身で自宅に無償で住める。第三者に対抗するには登記が必要"]},{"n":"遺言","p":["遺言は15歳以上で作成でき、いつでも遺言の方式で撤回できる。前の遺言と抵触する部分は後の遺言で撤回したとみなされる","自筆証書遺言は全文・日付・氏名を自書して押印する。財産目録はパソコン作成や通帳の写しでもよい（各頁に署名押印）","法務局の自筆証書遺言書保管制度を利用すれば家庭裁判所の検認が不要。公正証書遺言も検認は不要","公正証書遺言と秘密証書遺言は証人2人以上が必要。推定相続人・受遺者とその配偶者・直系血族は証人になれない"]},{"n":"遺留分","p":["遺留分権利者は兄弟姉妹以外の相続人。総体的遺留分は直系尊属のみが相続人なら3分の1、それ以外は2分の1","遺留分侵害額請求は金銭の支払請求で、相続開始と侵害を知った時から1年、相続開始から10年で行使できなくなる","遺留分の算定では、相続人への生前贈与は相続開始前10年以内の特別受益、相続人以外への贈与は1年以内のものを加える","相続開始前の遺留分の放棄には家庭裁判所の許可が必要。遺留分を放棄しても相続人の地位は失わない"]}]},{"u":"F：贈与税と相続税","items":[{"n":"贈与税の課税と申告","p":["暦年課税は1月1日〜12月31日に受けた贈与の合計から基礎控除110万円を引き、10〜55%の超過累進税率で課税する","直系尊属から1月1日時点で18歳以上の者への贈与は、一般税率より低い特例税率で計算する","申告期間は翌年2月1日〜3月15日。延納は5年以内で認められるが、物納はできない","契約者と受取人が異なる保険金、著しく低い価額での譲受け、債務免除はみなし贈与財産として課税される","法人からの贈与は一時所得、扶養義務者からの通常必要な生活費・教育費は非課税。離婚の財産分与も原則非課税"]},{"n":"贈与税の配偶者控除と非課税特例","p":["贈与税の配偶者控除は婚姻期間20年以上の配偶者から居住用不動産か取得資金の贈与を受けた場合に最高2,000万円を控除","配偶者控除は同じ配偶者からは一生に一度で、税額がゼロでも申告が必要。基礎控除と合わせて2,110万円まで非課税","住宅取得等資金の非課税は直系尊属からの贈与が対象で、省エネ等住宅1,000万円、その他500万円（2026年12月31日まで）","住宅取得等資金の受贈者は1月1日時点で18歳以上・合計所得2,000万円以下、床面積40㎡以上240㎡以下。50㎡未満なら所得1,000万円以下","教育資金の一括贈与の非課税措置は2026年度改正で延長されず、2026年3月31日で終了した"],"s":[5,8]},{"n":"相続時精算課税","p":["60歳以上の父母・祖父母から18歳以上の子・孫への贈与で選択でき、贈与者ごとに選ぶ。一度選ぶと撤回できない","特別控除は累計2,500万円で、超えた部分に一律20%を課税。2024年1月以後は別に毎年110万円の基礎控除がある","精算課税の基礎控除110万円以下の贈与は申告不要で、相続時にも加算されない。暦年課税の110万円とは別枠","相続時には贈与時の価額（基礎控除後）で相続財産に加算し、納めた贈与税は相続税から控除、控除しきれなければ還付","選択するには最初の贈与の翌年2月1日〜3月15日に相続時精算課税選択届出書を提出する"]},{"n":"相続税の課税財産と非課税財産","p":["死亡保険金や死亡後3年以内に支給が確定した死亡退職金は、みなし相続財産として相続税の課税対象になる","死亡保険金と死亡退職金はそれぞれ500万円×法定相続人の数まで非課税。相続人以外が受け取る場合は適用されない","弔慰金は業務上の死亡なら普通給与の3年分、業務外の死亡なら6か月分まで非課税","墓地・墓石・仏壇などは非課税だが、骨とう的価値のあるものや投資目的で保有するものは課税される","相続財産を申告期限までに国・地方公共団体などに寄附すると、その財産は相続税の課税対象から外れる"]},{"n":"債務控除と生前贈与加算","p":["債務控除できるのは借入金、未払いの税金、葬式費用（通夜・本葬・火葬・納骨・戒名料など）","香典返し、初七日などの法要費用、墓地の購入未払金、遺言執行費用は債務控除の対象外","暦年課税の生前贈与加算は2024年1月以後の贈与から相続開始前7年以内に拡大され、延長した4年分は総額100万円を控除","加算期間は2026年までの相続開始なら3年で、2027年から段階的に延び、2031年1月以後の相続開始で7年となる","生前贈与加算は相続・遺贈で財産を取得した者が対象。贈与税の配偶者控除や住宅取得等資金の非課税分は加算しない"]},{"n":"相続税の計算","p":["遺産に係る基礎控除額は3,000万円＋600万円×法定相続人の数。相続を放棄した者も法定相続人の数に含める","法定相続人の数に含める養子は実子がいれば1人、いなければ2人まで。特別養子や配偶者の実子である養子は実子扱い","課税遺産総額を法定相続分で按分して税率を掛け、合計した相続税の総額を実際の取得割合で各人に按分する","相続税の税率は10〜55%の8段階で、法定相続分に応ずる取得金額1,000万円以下は10%、6億円超は55%"]},{"n":"2割加算と税額控除","p":["配偶者と1親等の血族（代襲相続人の孫を含む）以外が財産を取得すると相続税額が2割加算される。孫養子も対象","配偶者の税額軽減は取得額が1億6,000万円か法定相続分相当額の多い方まで相続税がかからない。適用には申告が必要","未分割でも申告期限から3年以内に分割すれば配偶者の税額軽減を適用でき、分割後4か月以内に更正の請求をする","未成年者控除は10万円×（18歳－相続時の年齢）、障害者控除は10万円（特別障害者20万円）×（85歳－年齢）","10年以内に続けて相続があれば相次相続控除、生前贈与加算した財産に課された贈与税は贈与税額控除で差し引く"],"s":[14]},{"n":"相続税の申告と納付","p":["相続税の申告期限は相続開始を知った日の翌日から10か月以内で、被相続人の死亡時の住所地の税務署に提出する","課税価格の合計が基礎控除以下なら申告不要。ただし配偶者の税額軽減や小規模宅地等の特例を使う場合は申告が必要","延納は税額10万円超で金銭一括納付が困難な場合に担保を提供して認められ、期間は原則5年","物納は延納でも納付が困難な場合に限られる。第1順位は不動産・船舶・国債・地方債・上場株式等で、収納価額は相続税評価額"]}]},{"u":"F：財産評価と事業承継","items":[{"n":"宅地の評価","p":["宅地は市街地では路線価方式、それ以外の地域では固定資産税評価額×倍率で求める倍率方式で評価する","路線価方式は路線価×奥行価格補正率×地積。路線価は1㎡当たり千円単位で、付された記号は借地権割合（A90%〜G30%）","角地は側方路線影響加算、表と裏に道路がある土地は二方路線影響加算を行う。正面路線は補正後の価額が高い方","宅地は登記上の1筆ごとではなく、利用の単位となっている1画地ごとに評価する"]},{"n":"借地権・貸家建付地・家屋の評価","p":["借地権＝自用地評価額×借地権割合、貸宅地（底地）＝自用地評価額×（1－借地権割合）","貸家建付地＝自用地評価額×（1－借地権割合×借家権割合×賃貸割合）。借家権割合は全国一律30%","家屋は固定資産税評価額×1.0、貸家は固定資産税評価額×（1－借家権割合×賃貸割合）で評価する","親族間の使用貸借（無償）で貸している土地には借地権がなく、自用地として評価する","2024年1月以後の居住用マンションは、評価額が市場価格理論値の60%未満なら60%相当まで引き上げて評価する"],"s":[14]},{"n":"小規模宅地等の特例","p":["特定居住用宅地等は330㎡まで80%減額。配偶者が取得すれば無条件、同居親族は申告期限まで所有と居住の継続が要件","特定事業用宅地等と特定同族会社事業用宅地等は400㎡まで80%減額、貸付事業用宅地等は200㎡まで50%減額","特定居住用と特定事業用等は併用で最大730㎡まで適用できる。貸付事業用を含む場合は調整計算で200㎡を限度とする","配偶者や同居相続人がいない場合、持ち家のない別居親族（家なき子）も一定の要件で特定居住用宅地等の適用を受けられる","適用には申告が必要で、原則申告期限までに遺産分割が済んでいることが要件。相続開始前3年以内の新規貸付は原則対象外"],"s":[12,14]},{"n":"上場株式・金融資産の評価","p":["上場株式は課税時期の終値と、課税時期の月・前月・前々月の終値の月平均額のうち最も低い額で評価する","預貯金は元本に既経過利息（源泉税相当額控除後）を加えて評価する。普通預金は既経過利息が少額なら元本のみでよい","生命保険契約に関する権利は、課税時期の解約返戻金相当額で評価する","証券投資信託は課税時期に解約した場合の手取額で評価する。取引相場のあるゴルフ会員権は取引価格の70%で評価する"]},{"n":"取引相場のない株式の評価","p":["同族株主等が取得した株式は原則的評価方式、同族株主以外の少数株主が取得した株式は配当還元方式で評価する","原則的評価は大会社が類似業種比準方式、中会社が類似業種比準方式と純資産価額方式の併用、小会社が純資産価額方式","類似業種比準方式は配当・利益・純資産の3要素を類似業種と比べる。斟酌率は大会社0.7、中会社0.6、小会社0.5","純資産価額方式では、相続税評価額と帳簿価額による評価差額に37%を掛けた法人税等相当額を控除する","配当還元価額＝年配当金額÷10%×1株当たり資本金等の額÷50円。年配当金額が2円50銭未満なら2円50銭とする"]},{"n":"相続対策と生命保険の活用","p":["死亡保険金は受取人固有の財産で遺産分割の対象外となり、納税資金や代償分割の代償金の原資として活用できる","代償分割に保険を使う場合は、代償金を支払う相続人を死亡保険金の受取人にしておく","賃貸建物を建てると土地は貸家建付地、建物は貸家として評価が下がるが、借入金そのものに評価を下げる効果はない","2022年4月の最高裁判決では、評価通達による評価が著しく不適当な場合に鑑定評価額で課税した処分が適法とされた"]},{"n":"事業承継税制（納税猶予）","p":["特例措置は特例承継計画の提出を前提に、2027年12月31日までの贈与・相続で取得した全株式の贈与税・相続税を100%猶予する","一般措置は発行済議決権株式総数の3分の2までが対象で、相続税の猶予割合は80%（贈与税は100%）","特例措置は後継者最大3人が対象で、雇用確保要件を満たさなくても理由の報告などで猶予が継続する","後継者は会社の代表者で、同族関係者で議決権の過半数を持ち、その中で筆頭株主であることなどが要件","贈与税の納税猶予を受けた株式は贈与者の死亡時に相続で取得したとみなされ、相続税の納税猶予に切り替えられる"]},{"n":"自社株対策と事業承継の手法","p":["役員退職金の支給や高収益部門の分社化で利益や純資産を減らすと、類似業種比準価額や純資産価額が下がる","経営承継円滑化法の遺留分の特例では、推定相続人全員の合意で自社株を遺留分算定の基礎財産から除外（除外合意）できる","固定合意は自社株の価額を合意時の価額に固定する。合意後は経済産業大臣の確認と家庭裁判所の許可が必要","相続した非上場株式を申告期限の翌日以後3年以内に発行会社へ譲渡すると、みなし配当課税されず譲渡所得となる","議決権制限株式や拒否権付株式（黄金株）などの種類株式を使い、後継者に議決権を集中させることができる"]}]}]},{"id":"boki","name":"簿記（3級・2級）","full":"商工会議所簿記検定試験（日商簿記）3級・2級","group":"資格試験","desc":"日商簿記3級・2級の商業簿記と工業簿記の論点地図","asOf":"2026年度試験（2022年度適用の出題区分表）に基づく。2027年4月適用の改定点も併記","aliases":["簿記","日商簿記","簿記3級","簿記2級","日商簿記検定"],"sources":[{"t":"日本商工会議所「出題区分表などの改定について【暫定版】」（2027年度適用）","u":"https://www.kentei.ne.jp/wp/wp-content/uploads/2025/12/2027setsumeishiryo.pdf"},{"t":"日本商工会議所「2027年度適用 出題区分表 改定の趣旨」","u":"https://www.kentei.ne.jp/wp/wp-content/uploads/2014/10/2027_kaitei_shushi_fixed.pdf"},{"t":"日本商工会議所「2022年度 出題区分表改定の趣旨（収益認識基準対応）」","u":"https://www.kentei.ne.jp/wp/wp-content/uploads/2021/12/2022_kaitei_shushi.pdf"},{"t":"日本商工会議所「2021年度 出題区分表改定の趣旨」","u":"https://www.kentei.ne.jp/wp/wp-content/uploads/2021/03/2021_kaitei_shushi.pdf"},{"t":"日本商工会議所「2019年度 出題区分表の改定について」","u":"https://www.kentei.ne.jp/wp/wp-content/uploads/2018/03/2019_kaitei2.pdf"},{"t":"日本商工会議所「平成25年度 出題区分表改定の趣旨」","u":"https://www.kentei.ne.jp/wp/wp-content/uploads/2014/10/h25_shushi.pdf"},{"t":"日本商工会議所「平成28年度以降の出題に関する補足（為替手形等）」","u":"https://www.kentei.ne.jp/wp/wp-content/uploads/2015/10/h28_kaitei-2.pdf"},{"t":"日本商工会議所「第147回簿記検定試験2級 出題の意図・講評」","u":"https://www.kentei.ne.jp/wp/wp-content/uploads/2018/01/147-02-kouhyou.pdf"},{"t":"京都商工会議所「2026年度 日商簿記検定試験 実施要項」","u":"https://www.kyo.or.jp/kyoto/examination/pdf/2026_bokiyoukou.pdf"},{"t":"名古屋商工会議所「2026年度 簿記検定試験（1級）要項」","u":"https://www.nagoya-cci.or.jp/file/kenteikentei_boki2026.pdf"},{"t":"TAC「日商簿記のネット試験とは」","u":"https://www.tac-school.co.jp/kouza_boki/boki_sk_idx/CBT.html"},{"t":"スタディング「日商簿記ネット試験の出題形式と配点」","u":"https://studying.jp/boki/about-more/cbt03.html"},{"t":"TAC「日商簿記2級の難易度・出題範囲」","u":"https://www.tac-school.co.jp/kouza_boki/boki_sk_idx/contents_2q_nanido.html"},{"t":"企業会計審議会「外貨建取引等会計処理基準」（金融庁）","u":"https://www.fsa.go.jp/p_mof/singikai/kaikei/tosin/1a924c.htm"},{"t":"EY新日本「外貨建取引 第2回：為替予約等の処理」","u":"https://www.ey.com/ja_jp/corporate-accounting/commentary/foreign-currency-overseas-subsidiary/commentary-foreign-currency-overseas-subsidiary-2010-09-09"}],"units":[{"u":"共通：試験形式と出題区分","items":[{"n":"統一試験とネット試験","p":["統一試験はペーパー方式で、2・3級は年3回（6月・11月・2月）、1級は6月・11月の年2回だけ実施する。","2026年度の統一試験は第173回6月14日、第174回11月15日、第175回2027年2月28日（2・3級のみ）。","ネット試験（CBT）は2・3級のみ。テストセンターの空きがあれば随時受験できるが、施行休止期間がある。","ネット試験は終了直後に合否が出る。統一試験は結果判明まで2〜3週間程度かかる。","統一・団体・ネット試験はどれも同じ出題区分表に基づき、難易度と合格基準（70点以上）も同じ。"],"s":[1,8,10,11]},{"n":"3級の試験時間と配点","p":["3級は商業簿記のみ。試験時間60分、100点満点中70点以上で合格。","第1問は仕訳15問で45点。1問あたり3点の計算になる。","第2問は補助簿・勘定記入と語句などの穴埋め（理論）で20点。","第3問は精算表・財務諸表・決算整理後残高試算表の作成など決算の問題で35点。","受験料は3,300円（税込）。ネット試験は別に事務手数料550円がかかる。"],"s":[8,10,11]},{"n":"2級の試験時間と配点","p":["2級は商業簿記と工業簿記で試験時間90分、70点以上で合格。配点は商業簿記60点・工業簿記40点。","第1問は商業簿記の仕訳5問で20点、第2問は連結会計・株主資本等変動計算書などで20点。","第3問は損益計算書・貸借対照表・本支店会計など決算の総合問題で20点。","第4問は工業簿記の仕訳3問と個別・総合・部門別原価計算で28点、第5問は標準・直接原価計算で12点。","受験料は5,500円（税込）。相対評価ではなく70点以上で合格のため、回ごとの難易度で合格率が変わる。"],"s":[8,11,12]},{"n":"受験の持ち物とネット試験の操作","p":["電卓は計算機能のみに限り、印刷・音・辞書・プログラム機能付きは不可。日数・時間計算、換算、税計算、音の出ない検算機能は可。","統一試験は顔写真付き身分証明書、HBかBの黒鉛筆またはシャープペンシル、消しゴム、受験票が必要。時計は腕時計のみ。","ネット試験は勘定科目をプルダウンから選び金額を入力する。計算用紙と筆記具は会場で渡され回収される。","ネット試験は登録問題の数値などを変えてランダムに出題され、予約の変更・取消は受験日3日前まで。","出題は毎年4月1日時点で施行されている会計基準・法令に準拠する。"],"s":[8,9,10,11]},{"n":"出題区分表と2027年度改定","p":["2026年度（2027年3月末まで）の試験は、2022年度適用の出題区分表に基づいて出題される。","新区分表は2027年4月1日から適用。紙の手形・小切手の廃止に伴い、手形・小切手の論点を削除する。","2027年度から定率法、固定資産の除却・廃棄、販売のつど売上原価に振り替える方法が2級から3級へ移る。","2級のリースは新リース会計基準に合わせ、借手のファイナンス／オペレーティングの区分をなくす。","区分表で「※」印の付いた項目は、簡易な内容に限って出題される。"],"s":[0,1,2]}]},{"u":"3級：簿記の基本と帳簿","items":[{"n":"簿記の目的と前提","p":["簿記は取引を記録・計算・整理し、財政状態と経営成績を明らかにする技術である。","3級は小規模な株式会社を前提とし、決算月は3月が基本。2019年度に個人商店の前提から改められた。","一定時点の財政状態は貸借対照表、一会計期間の経営成績は損益計算書で示す。","会計期間の初めを期首、終わりを期末（決算日）、その間を期中という。"],"s":[4]},{"n":"5要素と財務諸表の関係","p":["資産は現金・売掛金・建物などの財産や権利、負債は買掛金・借入金などの支払義務。","純資産＝資産−負債。株式会社では資本金・利益準備金・繰越利益剰余金などが該当する。","収益（売上・受取利息など）−費用（仕入・給料など）＝当期純利益。マイナスなら当期純損失。","資産・費用は借方（左）、負債・純資産・収益は貸方（右）が増える側になる。"]},{"n":"簿記上の取引と仕訳のルール","p":["資産・負債・純資産・収益・費用が増減するものが簿記上の取引。契約や注文だけでは取引にならない。","火災や盗難による損失は日常語では取引と呼ばないが、資産が減るので簿記上の取引になる。","資産の増加・費用の発生は借方、資産の減少は貸方に書く。負債・純資産・収益はその逆。","1つの仕訳で借方合計と貸方合計は必ず一致する（貸借平均の原理）。","例：商品10,000円を掛けで仕入れた→（借）仕入10,000（貸）買掛金10,000。"]},{"n":"転記と総勘定元帳","p":["仕訳帳の仕訳を勘定ごとの総勘定元帳へ書き写す作業を転記という。","借方の金額はその勘定の借方へ、貸方の金額は貸方へ転記し、摘要には相手勘定科目を書く。","相手勘定科目が2つ以上あるときは、摘要に「諸口」と書く。","仕訳帳と総勘定元帳は主要簿、それ以外の明細を記録する帳簿は補助簿である。"]},{"n":"試算表の種類","p":["試算表は転記の正しさを確かめる一覧表で、合計・残高・合計残高試算表の3種類がある。","合計試算表は各勘定の借方・貸方の合計を、残高試算表は貸借の差額（残高）を集める。","貸借が一致しても、仕訳の漏れ、二重転記、勘定科目の誤りは発見できない。","決算整理後残高試算表は2019年度に3級の範囲として加わり、財務諸表作成のもとになる。"],"s":[4]},{"n":"補助簿の種類と元帳","p":["補助記入帳：現金出納帳・当座預金出納帳・小口現金出納帳・仕入帳・売上帳・受取（支払）手形記入帳。","補助元帳：商品有高帳・売掛金元帳・買掛金元帳・固定資産台帳（有形固定資産が対象）。","取引ごとの補助簿選択は、仕訳を書き、使った勘定科目から記入する補助簿を判断する。","売掛金勘定（統制勘定）の残高は、売掛金元帳の各得意先残高の合計と一致する。","例：商品を掛けで売り送料を現金で払う→売上帳・売掛金元帳・商品有高帳・現金出納帳に記入。"],"s":[4]},{"n":"商品有高帳","p":["商品の種類ごとに受入・払出・残高を数量・単価・金額で記録する補助元帳。金額は原価で記入する。","払出単価は先入先出法か移動平均法で決める。","移動平均法は受入のつど（残高金額＋受入金額）÷（残高数量＋受入数量）で単価を計算し直す。","払出欄の合計が売上原価になり、売上高との差額で売上総利益を求められる。"]}]},{"u":"3級：商品売買と現金預金","items":[{"n":"三分法","p":["商品売買を仕入（費用）・売上（収益）・繰越商品（資産）の3つの勘定で処理する方法。","仕入れたら仕入勘定に原価で、売り上げたら売上勘定に売価で記録する。","分記法（商品勘定と商品売買益で処理する方法）は2021年度に区分表から削除された。","販売のつど売上原価に振り替える方法は現行は2級の範囲で、2027年度から3級に移る。"],"s":[0,1,3]},{"n":"仕入諸掛と発送費","p":["当社負担の引取運賃など仕入時の付随費用は仕入原価に含め、仕入勘定に加える。","例：商品50,000円を掛仕入、引取運賃1,000円を現金払い→（借）仕入51,000（貸）買掛金50,000・現金1,000。","売手が負担する送料は発送費（費用）で処理する。3級ではこの方法だけが出題される。","送料を買手に請求して売掛金・立替金に含める処理は1級の範囲。","送料込みで販売した売上は、商品を引き渡した時に計上する。"],"s":[2,3]},{"n":"返品","p":["品違いなどによる返品は、仕入時・売上時の仕訳を逆にして取り消す。","例：掛仕入の商品2,000円を返品→（借）買掛金2,000（貸）仕入2,000。","例：掛売上の商品3,000円が返品された→（借）売上3,000（貸）売掛金3,000。","値引の処理は2019年度改定で3級・2級の範囲から外された。"],"s":[3,4]},{"n":"クレジット売掛金","p":["クレジット払いで販売した代金は、通常の売掛金と分けてクレジット売掛金（資産）で処理する。","信販会社への手数料は販売時に支払手数料（費用）とし、その分を債権から差し引く。","例：10,000円をクレジット販売、手数料2%→（借）クレジット売掛金9,800・支払手数料200（貸）売上10,000。","クレジット売掛金は2019年度に2級から3級へ移った。","2027年度区分表では、キャッシュレス決済で生じる債権もクレジット売掛金に含むと明記される。"],"s":[0,1,4]},{"n":"前払金・前受金と受取商品券","p":["商品代金の手付金を払ったら前払金（資産）、受け取ったら前受金（負債）で処理する。","例：手付金5,000円を現金で受け取った→（借）現金5,000（貸）前受金5,000。引渡し時に売上に充てる。","商店街や自治体など他者が発行した商品券を受け取ったら受取商品券（資産）とする。","自社発行の商品券は3級の範囲外（1級）で、他店商品券ではなく受取商品券を標準の勘定科目とする。"],"s":[4]},{"n":"簿記上の現金","p":["通貨のほか、他人振出小切手・送金小切手・普通為替証書・配当金領収証などの通貨代用証券も現金とする。","期限の到来した公社債の利札も現金として扱う。","自分が振り出した小切手を受け取ったときは、現金ではなく当座預金の増加とする。","2027年度の新区分表では小切手の論点が削除される。"],"s":[0,1]},{"n":"現金過不足","p":["帳簿残高と実際有高が違うときは、帳簿を実際に合わせ、差額を現金過不足で一時処理する。","例：実際が1,000円少ない→（借）現金過不足1,000（貸）現金1,000。原因判明時に正しい勘定へ振り替える。","決算まで原因不明の借方残高は雑損（費用）、貸方残高は雑益（収益）に振り替える。","決算日当日に過不足が見つかった場合は、現金過不足を使わず直接雑損・雑益とする。"]},{"n":"当座預金・当座借越と複数口座","p":["当座借越契約があれば残高を超えて引き出せ、期中は当座預金の貸方残高として記録する。","決算で貸方残高を当座借越（または借入金）へ振り替え、翌期首に再振替する。","例：決算時の当座預金貸方残高20,000円→（借）当座預金20,000（貸）当座借越20,000。","複数口座は「普通預金A銀行」のように口座種別と銀行名を勘定科目にして管理することがある。","2027年度区分表では「現金預金」に普通預金が明記され、当座預金も引き続き範囲に残る。"],"s":[0,1,4]},{"n":"小口現金","p":["少額の経費支払いのため用度係に前渡しする現金を小口現金（資産）で処理する。","定額資金前渡法（インプレスト・システム）では、使った額と同額を補給して一定額を保つ。","報告時は（借）旅費交通費・通信費など（貸）小口現金、補給時は（借）小口現金（貸）当座預金など。","報告と同時に補給する場合は、費用を借方、当座預金などを貸方とする1本の仕訳にできる。","用度係の支払いの記録は補助簿の小口現金出納帳に記入する。"]}]},{"u":"3級：手形・債権債務・貸倒れ","items":[{"n":"約束手形と手形貸付・借入","p":["約束手形を受け取ったら受取手形（資産）、振り出したら支払手形（負債）で処理する。","為替手形は平成28年度以降2・3級で出題されず、約束手形だけが前提になっている。","金銭の貸し借りで手形を使ったら手形貸付金・手形借入金とし、商品売買の手形と区別する。","例：600,000円を貸付け利息36,000円を差し引いて現金を渡す→（借）手形貸付金600,000（貸）受取利息36,000・現金564,000。","手形の裏書譲渡・割引は2019年度から2級の範囲。2027年度からは手形の論点自体が削除される。"],"s":[0,1,4,6]},{"n":"電子記録債権・債務","p":["発生記録をすると、債権者は電子記録債権（資産）、債務者は電子記録債務（負債）を計上する。","例：買掛金30,000円について電子記録債務の発生記録→（借）買掛金30,000（貸）電子記録債務30,000。","支払期日に口座間で決済されたら、債権者は預金の増加と電子記録債権の減少を記録する。","電子記録債権・債務は2019年度に2級から3級へ移った。","2027年度区分表では「売掛金および買掛金ならびに電子記録債権等」の項目にまとめられる。"],"s":[0,1,4]},{"n":"貸付金・借入金と利息","p":["お金を貸したら貸付金（資産）、借りたら借入金（負債）とし、利息は受取利息・支払利息で処理する。","役員との貸し借りは役員貸付金・役員借入金として区別する。","利息は「元本×年利率×月数÷12」で月割計算する。","例：100,000円を年3%で6か月借り、返済時に利息とともに現金払い→（借）借入金100,000・支払利息1,500（貸）現金101,500。"]},{"n":"未収入金・未払金","p":["商品以外（備品・土地・有価証券など）の売買代金の未決済分は未収入金（資産）・未払金（負債）とする。","商品売買の掛けは売掛金・買掛金、それ以外の掛けは未収入金・未払金と使い分ける。","例：備品200,000円を購入し代金は月末払い→（借）備品200,000（貸）未払金200,000。"]},{"n":"立替金・預り金と給料","p":["従業員のために立て替えた額は従業員立替金（資産）、預かった額は預り金（負債）とする。","給料から差し引いた源泉所得税は所得税預り金、従業員負担の社会保険料は社会保険料預り金とする。","社会保険料の会社負担分は法定福利費（費用）で処理する。2019年度に3級の範囲に加わった。","例：給料300,000円から所得税20,000円を差し引き現金払い→（借）給料300,000（貸）所得税預り金20,000・現金280,000。","個人事業主自身の所得税の処理は2019年度に範囲外となった（従業員の源泉所得税は残る）。"],"s":[4]},{"n":"仮払金・仮受金","p":["内容や金額が未確定の支出は仮払金（資産）、入金は仮受金（負債）で一時処理し、確定時に振り替える。","例：出張の旅費概算30,000円を現金で渡す→（借）仮払金30,000（貸）現金30,000。","精算で旅費25,000円・残金5,000円返金→（借）旅費交通費25,000・現金5,000（貸）仮払金30,000。","交通系ICカードへの入金を仮払金で処理し、使った時に旅費交通費などへ振り替える方法がある。","内容不明の入金が後で売掛金の回収と分かったら、（借）仮受金（貸）売掛金と振り替える。"]},{"n":"差入保証金","p":["店舗や事務所を借りる際に払う敷金などは差入保証金（資産）で処理する。2019年度に追加された。","不動産会社への仲介手数料は支払手数料、家賃は支払家賃（費用）とし、敷金とは分ける。","例：敷金100,000円・仲介手数料50,000円・家賃50,000円を普通預金で払う→借方は差入保証金・支払手数料・支払家賃。","契約終了で敷金が返還されたら差入保証金を減らす。"],"s":[4]},{"n":"貸倒れと貸倒引当金","p":["前期以前の債権が貸し倒れたら貸倒引当金を取り崩し、不足分は貸倒損失（費用）とする。","当期に発生した債権の貸倒れは、引当金を使わず全額貸倒損失とする。","決算は差額補充法：期末債権×設定率と引当金残高の差を補充。例：売掛金500,000円×2%、残高4,000円→繰入6,000円。","見積額より引当金残高が多いときは、差額を貸倒引当金戻入（収益）とする。","前期以前に貸倒処理した債権を回収したら償却債権取立益（収益）とする。"],"s":[5]}]},{"u":"3級：固定資産・純資産・税金","items":[{"n":"有形固定資産の取得","p":["建物・備品・車両運搬具・土地などは、購入代価に付随費用を加えた額を取得原価とする。","付随費用には仲介手数料、登記料、引取運賃、据付費、整地費用などがある。","例：土地5,000,000円を仲介手数料200,000円とともに普通預金で支払う→（借）土地5,200,000。","土地は使っても価値が減らないので減価償却しない。","固定資産台帳は2019年度に3級に加わり、対象は有形固定資産に限られる。"],"s":[4]},{"n":"減価償却（定額法・間接法）","p":["定額法の年額＝（取得原価−残存価額）÷耐用年数。期中に取得したら月割で計算する。","例：取得原価360,000円、耐用年数6年、残存価額0、使用7か月→減価償却費35,000円。","3級の記帳は間接法：（借）減価償却費（貸）減価償却累計額。直接法は2019年度から2級の範囲。","月次決算では年間の見積額を月割にして毎月計上する（2019年度に2級から簡易な形で移行）。","定率法は現行2級だが、2027年度から3級に移り、償却率を示す簡易な出題に限られる。"],"s":[0,1,4]},{"n":"固定資産の売却","p":["取得原価と減価償却累計額を減らし、帳簿価額と売却価額の差を固定資産売却益・売却損とする。","期中に売却したら、期首から売却時までの減価償却費を月割で計上する。","例：取得原価500,000円・累計額300,000円の備品を150,000円で売却→固定資産売却損50,000円。","代金を後日受け取る場合は売掛金ではなく未収入金とする。","除却・廃棄は現行2級の範囲で、2027年度から3級に移る。"],"s":[0,1]},{"n":"株式の発行と資本金","p":["株式会社は株式を発行して資金を集め、3級では払込金額の全額を資本金とする処理を扱う。","例：設立時に1株50,000円で100株発行、普通預金に払込→（借）普通預金5,000,000（貸）資本金5,000,000。","株式会社の資本金・利益剰余金の基本的な処理は2019年度に2級から3級へ移った。","払込金額の一部を資本準備金とする処理は2級の範囲で扱う。"],"s":[4]},{"n":"損益振替と繰越利益剰余金","p":["決算で収益・費用の残高を損益勘定へ振り替え、損益勘定で当期純利益を計算する。","当期純利益は（借）損益（貸）繰越利益剰余金で純資産へ振り替える。","当期純損失なら（借）繰越利益剰余金（貸）損益となる。","2019年度改定で、純損益の振替先が資本金から繰越利益剰余金に変わった。"],"s":[4]},{"n":"剰余金の配当","p":["株主総会で配当が決まったら、繰越利益剰余金を減らし未払配当金（負債）と利益準備金を計上する。","例：配当100,000円、利益準備金10,000円→（借）繰越利益剰余金110,000（貸）未払配当金100,000・利益準備金10,000。","配当金を支払ったら（借）未払配当金（貸）普通預金などとする。","3級の配当は繰越利益剰余金からに限られ、準備金の積立額の計算は2級で扱う。"],"s":[4]},{"n":"法人税等","p":["法人税・住民税・事業税は、まとめて「法人税、住民税及び事業税」（法人税等）で処理する。","中間申告で納付した額は仮払法人税等（資産）とする。","決算で年税額を計上し、中間納付額との差を未払法人税等（負債）とする。例：年税額300,000円・中間120,000円→未払180,000円。","3級では税引前当期純利益に税率を掛けて税額を求める簡単な計算に限られる。","確定申告で納付したら（借）未払法人税等（貸）普通預金などとする。"],"s":[4]},{"n":"消費税（税抜方式）","p":["3級の消費税は税抜方式のみ。支払った税額は仮払消費税、受け取った税額は仮受消費税とする。","例：商品100,000円（税10%）を掛仕入→（借）仕入100,000・仮払消費税10,000（貸）買掛金110,000。","決算で仮受消費税と仮払消費税を相殺し、差額を未払消費税（負債）とする。","簡易課税制度や免税事業者は出題されない。税込方式は2021年度に2級からも削除された。"],"s":[3,4]}]},{"u":"3級：決算・伝票・証ひょう","items":[{"n":"決算の手順と帳簿の締切","p":["決算整理前残高試算表→決算整理→精算表・決算整理後残高試算表→帳簿の締切→財務諸表作成の順で進める。","主な決算整理は売上原価、貸倒引当金、減価償却、経過勘定、貯蔵品、現金過不足、当座借越、法人税等、消費税。","収益・費用の勘定は損益勘定への振替で残高をゼロにして締め切る。","資産・負債・純資産の勘定は「次期繰越」で締め、翌期首に「前期繰越」と書く。","繰越試算表は2019年度改定で3級の範囲から外れた。"],"s":[4]},{"n":"売上原価の算定","p":["売上原価＝期首商品棚卸高＋当期商品仕入高−期末商品棚卸高。","仕入勘定で計算する場合：（借）仕入（貸）繰越商品で期首分、（借）繰越商品（貸）仕入で期末分を振り替える。","売上原価勘定で計算する方法もあり、期首・期末の棚卸高と当期仕入高を売上原価勘定に集める。","例：期首2,000円、当期仕入30,000円、期末3,000円→売上原価29,000円。","売上総利益＝売上高−売上原価。"]},{"n":"費用・収益の前払い・前受け","p":["当期に払った費用のうち次期分は前払費用（前払家賃・前払保険料など、資産）に振り替える。","例：12月1日に1年分の保険料12,000円を支払い、決算3月31日→（借）前払保険料8,000（貸）支払保険料8,000。","当期に受け取った収益のうち次期分は前受収益（前受家賃・前受地代など、負債）に振り替える。","翌期首に逆の仕訳（再振替仕訳）をして元の費用・収益の勘定に戻す。","2019年度に「繰延」の名称が「前払い・前受け」に改められた。"],"s":[4]},{"n":"費用・収益の未払い・未収","p":["当期に発生したがまだ払っていない費用は未払費用（未払利息・未払家賃など、負債）として計上する。","例：借入金の利息3か月分3,000円が未払い→（借）支払利息3,000（貸）未払利息3,000。","当期に発生したがまだ受け取っていない収益は未収収益（未収利息・未収地代など、資産）として計上する。","商品以外の売買代金の未決済を表す未払金・未収入金とは区別する。","翌期首に再振替仕訳を行う。"]},{"n":"貯蔵品と租税公課","p":["固定資産税・印紙税・自動車税など費用となる税金は租税公課（費用）で処理する。","郵便切手は通信費、収入印紙は租税公課として購入時に費用にする。","決算時に未使用の切手・収入印紙は貯蔵品（資産）へ振り替え、翌期首に再振替する。","消耗品は購入時に消耗品費とする方法に限られる。"],"s":[4]},{"n":"8桁精算表","p":["残高試算表・修正記入・損益計算書・貸借対照表の各借方・貸方、計8欄で構成する。6桁精算表は範囲外。","修正記入後、収益・費用は損益計算書欄、資産・負債・純資産は貸借対照表欄に移す。","当期純利益は損益計算書欄の借方と貸借対照表欄の貸方に書いて、貸借を一致させる。","仕入勘定で売上原価を計算すると、仕入の行の金額が売上原価、繰越商品の行が期末商品を表す。"],"s":[4]},{"n":"財務諸表の表示","p":["損益計算書では「売上」を売上高、「仕入」を売上原価と表示する。","貸借対照表では貸倒引当金は売掛金などから、減価償却累計額は各固定資産から控除する形で示す。","繰越商品は「商品」、前払保険料などは「前払費用」、未払利息などは「未払費用」と表示する。","繰越利益剰余金は、決算整理前の残高に当期純利益を加えた額で表示する。"]},{"n":"3伝票制と仕訳日計表","p":["入金伝票（借方が現金）、出金伝票（貸方が現金）、振替伝票（現金以外）の3種類で起票する。","一部現金取引は、取引を分解して起票する方法と、全額を掛取引とみなして起票する方法がある。","例：商品10,000円を売り3,000円を現金受取→分解なら入金伝票3,000円（売上）と振替伝票7,000円。","みなす方法では振替伝票（売掛金／売上10,000円）と入金伝票（売掛金3,000円）を起票する。","仕訳日計表は1日分の伝票を勘定ごとに集計した表で、総勘定元帳へはここから合計転記する。"]},{"n":"証ひょうからの記帳","p":["納品書・請求書・領収書・通帳の入出金明細などの証ひょうから、取引を読み取って仕訳する。","受け取った請求書では消費税額を仮払消費税、当社負担の送料を仕入原価に含めて処理する。","自社が発行した請求書（控え）からは売上と売掛金、受け取った請求書からは仕入や費用を記帳する。","通帳の明細では、引落しや振込入金から預金の増減と相手勘定科目を判断する。"]}]},{"u":"2級商簿：債権・商品・収益認識","items":[{"n":"銀行勘定調整表","p":["当座預金の帳簿残高と銀行の残高証明書の金額の違いを、原因ごとに調整する表である。","時間外預入と未取付小切手は銀行側の調整項目で、当社の修正仕訳は要らない。","誤記入・連絡未通知（引落し・振込）・未渡小切手は当社側の修正仕訳が必要。","未渡小切手は振出時の相手勘定に戻す。買掛金の支払いなら（借）当座預金（貸）買掛金、費用なら貸方は未払金。","作成方法には両者区分調整法・企業残高基準法・銀行残高基準法がある。"]},{"n":"手形・電子記録債権の譲渡と割引","p":["手形を裏書譲渡したら受取手形を減らす。銀行で割り引いたら割引料を手形売却損（費用）とする。","例：受取手形100,000円を割引、割引料2,000円を引かれ当座預金へ→（借）当座預金98,000・手形売却損2,000（貸）受取手形100,000。","電子記録債権の譲渡・割引も同様に処理し、差額は電子記録債権売却損とする。","偶発債務を評価勘定法・対照勘定法で処理させる問題は出題されない。","2027年度区分表では手形の規定が削除され、売掛債権の譲渡（ファクタリング、買取型）が明示される。"],"s":[0,1,4,6]},{"n":"不渡手形と営業外手形","p":["受取手形が不渡りになったら、額面に償還請求の費用を加えた額を不渡手形（資産）に振り替える。","例：受取手形50,000円が不渡、請求費用1,000円を現金払い→（借）不渡手形51,000（貸）受取手形50,000・現金1,000。","固定資産の売買など営業以外の取引の手形は、営業外受取手形・営業外支払手形で処理する。","例：土地を売り約束手形を受け取った→借方は営業外受取手形とし、受取手形とは区別する。"],"s":[5]},{"n":"売上原価対立法","p":["仕入時に商品（資産）を原価で記録し、販売のつど売上と売上原価を計上する方法。","例：原価6,000円の商品を10,000円で掛売上→（借）売掛金10,000（貸）売上10,000、（借）売上原価6,000（貸）商品6,000。","決算で売上原価を計算する整理仕訳が不要で、商品勘定の残高が期末帳簿棚卸高を表す。","現行は2級の範囲だが、2027年度から3級へ移る。"],"s":[0,1]},{"n":"棚卸減耗損と商品評価損","p":["棚卸減耗損＝（帳簿棚卸数量−実地棚卸数量）×原価。","商品評価損＝（原価−正味売却価額）×実地棚卸数量。正味売却価額が原価を下回るときに計上する。","例：帳簿100個・実地95個、原価@200円、正味売却価額@180円→減耗損1,000円、評価損1,900円。","貸借対照表の商品は正味売却価額×実地数量（例では17,100円）となる。","商品評価損は原則売上原価に含め、原価性のある棚卸減耗損は売上原価か販売費に表示する。"],"s":[7]},{"n":"収益認識の基本","p":["5ステップ：契約の識別→履行義務の識別→取引価格の算定→取引価格の配分→履行義務充足時に収益認識。","履行義務には一時点で充足されるものと一定期間にわたり充足されるものがあり、2級は用語と基本概念を問う。","商品の販売は、取引条件に応じ出荷基準・着荷基準・検収基準などのタイミングで売上を計上する。","商品販売と保守サービスなど複数の履行義務を含む契約は、取引価格を配分する簡易な問題に限られる。","収益認識基準は2022年度から検定に反映され、仕入割引は1級の範囲へ移った。"],"s":[2]},{"n":"役務収益と役務原価","p":["サービス業では、サービスの提供に応じて役務収益（収益）と対応する役務原価（費用）を計上する。","提供前に発生した給料などの費用は仕掛品（資産）に振り替え、提供時に役務原価へ振り替える。","例：作業済みの給料50,000円を仕掛品へ→（借）仕掛品50,000（貸）給料50,000。","一定期間にわたる役務の進捗度は、単純な経過期間や%で示される出題に限られる。","原価回収基準は1級の範囲である。"],"s":[2]},{"n":"契約資産・契約負債と変動対価","p":["対価を受け取る権利が他の履行義務の充足を条件とする場合、その権利は契約資産とする。","例：商品A・Bを販売し、B引渡し後に代金請求できる契約でAを先に渡したら、A分を契約資産に計上。","履行前に受け取った対価は契約負債とする（前受金に相当）。","売上割戻などの変動対価は、返金が見込まれる額を売上に含めず返金負債（負債）とする。","返品権付き販売は1級の範囲。返品調整引当金・売上割戻引当金は区分表から削除された。"],"s":[2,3]}]},{"u":"2級商簿：有価証券","items":[{"n":"有価証券の分類と取得","p":["保有目的で、売買目的有価証券・満期保有目的債券・子会社株式および関連会社株式・その他有価証券に分ける。","取得原価は購入代価に売買手数料などの付随費用を加えた額。","期末評価は、売買目的とその他は時価、満期保有は償却原価、子会社・関連会社株式は取得原価。","有価証券は2019年度に3級の範囲から外れ、すべて2級以上の範囲になった。"],"s":[4]},{"n":"売買目的有価証券","p":["決算で時価に評価替えし、差額を有価証券評価益・評価損（有価証券評価損益）とする。","評価替えには切放法と洗替法があり、洗替法では翌期首に逆仕訳で取得原価に戻す。","売却時は帳簿価額との差額を有価証券売却益・売却損とする。複数回取得なら平均単価で払出額を求める。","例：帳簿価額@500円の株式100株を@550円で売却→有価証券売却益5,000円。","株式の配当は受取配当金、公社債の利息は有価証券利息で処理する。"]},{"n":"端数利息","p":["利払日の途中で公社債を売買したら、前回利払日の翌日から売買日までの利息を買主が売主に払う。","端数利息は1年365日の日割計算。買主は有価証券利息の借方、売主は有価証券利息の貸方に記録する。","例：額面1,000,000円・年利率3.65%・経過73日→端数利息7,300円。","買主は次の利払日に利払期間分の利息全額を受け取るため、差し引きで保有期間分が収益に残る。"]},{"n":"満期保有目的債券と償却原価法","p":["額面と取得価額の差が金利の調整と認められる場合、償却原価法（2級は定額法）で帳簿価額を毎期調整する。","例：額面1,000,000円を980,000円で取得、償還まで5年→毎期（借）満期保有目的債券4,000（貸）有価証券利息4,000。","期中に取得したら、償却額は保有月数で月割計算する。","時価評価はせず、償却原価を貸借対照表価額とする。"],"s":[7]},{"n":"子会社株式とその他有価証券","p":["子会社株式・関連会社株式は取得原価で評価し、期末に時価評価しない。","その他有価証券は時価評価し、差額は全部純資産直入法でその他有価証券評価差額金（純資産）とする。","評価差額は損益に計上せず、翌期首に再振替して取得原価に戻す。","税効果を適用すると、評価差額のうち税率分を繰延税金負債（資産）、残りを評価差額金とする。"]}]},{"u":"2級商簿：固定資産とリース","items":[{"n":"固定資産の取得の諸形態","p":["割賦購入では現金購入価額を取得原価とし、割賦代金との差額（利息相当）は支払利息か前払利息で処理する。","建設中の支払額は建設仮勘定に集め、完成・引渡し時に建物などへ振り替える。","価値を高める改良（資本的支出）は資産に加え、現状を維持する修繕（収益的支出）は修繕費とする。","固定資産台帳で取得日・取得原価・償却累計額などの明細を管理する。"],"s":[7]},{"n":"定率法・200%定率法・生産高比例法","p":["定率法の年額＝（取得原価−期首減価償却累計額）×償却率。初めの年ほど償却額が大きい。","200%定率法の償却率は定額法の償却率（1÷耐用年数）の2倍。例：耐用年数5年→0.4。","償却額が償却保証額（取得原価×保証率）を下回った年から、改定償却率で均等に償却する。","例：取得原価1,000,000円、償却率0.4→1年目400,000円、2年目240,000円。","生産高比例法＝（取得原価−残存価額）×当期利用量÷総利用可能量。例：総10万km中1万km走行→1割を償却。"],"s":[0,1]},{"n":"除却・廃棄・買換え","p":["除却では見積処分価額を貯蔵品とし、帳簿価額との差額を固定資産除却損とする。","廃棄では処分価値がないため、帳簿価額（と廃棄費用）を固定資産廃棄損とする。","買換えは旧資産を下取価格で売ったと考え、下取価格と帳簿価額の差を売却損益とする。","例：帳簿価額80,000円の旧車両を100,000円で下取り、新車両500,000円→売却益20,000円、支払400,000円。"]},{"n":"火災と未決算","p":["保険をかけた資産が焼失したら、保険金が確定するまで帳簿価額を未決算（火災未決算）に振り替える。","保険金が帳簿価額を上回れば差額を保険差益、下回れば火災損失とする。","保険をかけていなければ、帳簿価額をすぐに火災損失とする。","例：帳簿価額300,000円の建物が焼失し、保険金250,000円が確定→火災損失50,000円。"],"s":[7]},{"n":"圧縮記帳","p":["国庫補助金を受け取ったら国庫補助金受贈益（収益）を計上する。","補助金で資産を取得したら、補助金相当額を固定資産圧縮損とし、取得原価から直接減らす（直接減額方式）。","例：補助金300,000円で機械1,000,000円を取得→（借）固定資産圧縮損300,000（貸）機械装置300,000。","減価償却は圧縮後の帳簿価額（例では700,000円）をもとに計算する。"]},{"n":"リース取引（現行区分）","p":["ファイナンス・リース取引は売買に準じてリース資産とリース債務を計上し、オペレーティング・リースは支払リース料で処理する。","利子込み法はリース料総額で資産・負債を計上し、利息を区別しない。","利子抜き法は見積現金購入価額で計上し、利息相当額は定額法で各期に配分する。","例：年100,000円×5年、見積現金購入価額450,000円→利子抜き法の支払利息は毎年10,000円。","所有権移転外のリース資産は、リース期間を耐用年数、残存価額ゼロで減価償却する。"],"s":[1,7]},{"n":"リースの2027年度改定","p":["新リース会計基準（企業会計基準第34号）は2027年4月1日以後開始する事業年度から強制適用される。","借手はファイナンス／オペレーティングの区分がなくなり、リースの定義を満たせば原則として資産計上する。","2級は借手側のみ出題し、利子込み法・利子抜き法（利息配分は定額法）は引き続き出題される。","短期リース（12か月以内など）・少額リースは賃貸借処理を容認。不動産賃借は両方の処理が出題対象。","3級はリースを出題せず、支払家賃・支払地代は従来どおり賃貸借処理で出題される。"],"s":[0,1]},{"n":"無形固定資産とソフトウェア","p":["のれん・特許権・商標権・ソフトウェアなどは残存価額ゼロの定額法で、直接法により償却する。","のれんは20年以内のその効果が及ぶ期間で償却する。","自社利用のソフトウェアは将来の収益獲得や費用削減が確実なら資産計上し、原則5年以内で償却する。","制作途中の支出はソフトウェア仮勘定に集め、完成時にソフトウェアへ振り替える。","保守料などの維持費用は資産に含めず保守費（費用）とする。研究開発費は発生時に費用処理する。"],"s":[4,7]}]},{"u":"2級商簿：引当金・外貨・税効果","items":[{"n":"貸倒引当金（個別評価・一括評価）","p":["倒産などで回収が危ぶまれる債権は個別に評価し、その他の債権はまとめて実績率で見積る。","例：取引先の経営悪化で売掛金200,000円の50%を個別に見積る→繰入額100,000円（他の債権と別に計算）。","売上債権への繰入額は販売費及び一般管理費、貸付金など営業外債権への繰入額は営業外費用に表示する。","税法の限度額を超えた繰入額は損金不算入となり、税効果会計の対象になる。"]},{"n":"その他の引当金","p":["修繕引当金：次期の修繕費のうち当期負担分を見積計上し、修繕時に取り崩す。不足分は修繕費とする。","賞与引当金：次期に支給する賞与のうち当期負担分を賞与引当金繰入で計上する。","退職給付引当金：退職給付費用を計上して積み増し、退職金の支払時に取り崩す。","商品（製品）保証引当金：保証期間中の無料修理費を見積る。仕様どおりである保証のみが出題対象。","その他の引当金は2021年度改定で2級の区分表から削除されて1級の範囲となり、2級では賞与引当金が独立の項目になった。"],"s":[3,5]},{"n":"外貨建取引の発生と決済","p":["外貨建取引は、取引発生時の直物為替相場で円に換算して記録する。","決済時の相場との差は為替差損益（為替差益・為替差損）とする。","例：買掛金10ドル（@110円）を@115円で決済→支払1,150円、為替差損50円。","前払金・前受金がある取引では、前払・前受分はその時の相場、残りは取引時の相場で換算する。","為替差益と為替差損は相殺し、純額を営業外収益または営業外費用に表示する。"],"s":[13]},{"n":"決算時の換算替え","p":["外国通貨と外貨建の金銭債権債務（売掛金・買掛金・借入金など）は決算時の相場で換算替えする。","前払金・前受金や商品、固定資産などの非貨幣項目は換算替えしない。","例：売掛金100ドル（@110円）、決算時@105円→（借）為替差損益500（貸）売掛金500。","換算差額は原則として当期の為替差損益とする。子会社株式は取得時の相場のまま。"],"s":[13]},{"n":"為替予約（振当処理）","p":["為替予約を付すと、振当処理で外貨建債権債務を予約レート（先物相場）で円換算できる。","取引前に予約していれば、取引と債権債務を最初から予約レートで記録する。","取引後に予約したら、債権債務を予約レートに換算替えする。予約後は決算時の換算替えをしない。","基準上は直々差額を予約期の損益、直先差額を決済日まで期間配分するが、期間配分は1級で扱う。"],"s":[13,14]},{"n":"税効果会計の仕組み","p":["会計上の利益と税法上の課税所得のずれ（一時差異）を調整し、法人税等を税引前利益に対応させる。","将来減算一時差異×税率を繰延税金資産とし、相手勘定は法人税等調整額とする。","例：損金不算入の貸倒引当金繰入10,000円、税率30%→（借）繰延税金資産3,000（貸）法人税等調整額3,000。","差異が解消したら逆仕訳で繰延税金資産を取り崩す。","繰延税金資産と繰延税金負債は相殺し、投資その他の資産または固定負債に表示する。"],"s":[12]},{"n":"税効果の対象となる差異","p":["2級では貸倒引当金の繰入限度超過額、減価償却の償却限度超過額、その他有価証券の評価差額を扱う。","減価償却の限度超過額は会計と税法の耐用年数の違いなどで生じ、売却や除却で解消する。","その他有価証券は法人税等調整額を使わず、評価差額から税効果分を直接差し引く。","例：時価上昇100,000円、税率30%→（借）その他有価証券100,000（貸）繰延税金負債30,000・評価差額金70,000。","交際費の損金不算入のように将来も解消しない差異は、税効果の対象にならない。"]},{"n":"課税所得と法人税等の計算","p":["課税所得＝税引前当期純利益＋損金不算入額（加算）−益金不算入額など（減算）。","法人税等＝課税所得×税率。中間納付額を差し引いた残りを未払法人税等とする。","例：税引前利益1,000,000円、損金不算入20,000円、税率30%→法人税等306,000円。","損益計算書では法人税等の次に法人税等調整額を加減して当期純利益を示す。"]}]},{"u":"2級商簿：純資産と組織再編","items":[{"n":"株式の発行（2級）","p":["払込金額は原則全額を資本金とするが、2分の1を超えない額は資本金にしないことができる。","資本金にしない部分は資本準備金（株式払込剰余金）とする。","例：1株60,000円で100株発行し資本金を最低額にする→資本金3,000,000円・資本準備金3,000,000円。","設立の費用は創立費、開業準備の費用は開業費、増資時の株式発行費用は株式交付費（原則費用処理）。"]},{"n":"剰余金の配当と準備金積立","p":["配当額の10分の1を、資本準備金と利益準備金の合計が資本金の4分の1に達するまで積み立てる。","繰越利益剰余金からの配当は利益準備金、その他資本剰余金からの配当は資本準備金を積み立てる。","例：資本金10,000,000円、準備金合計2,400,000円、配当500,000円→積立額50,000円（上限まで残り100,000円）。","任意積立金（新築積立金・別途積立金など）の積立・取崩は、繰越利益剰余金との間で振り替える。","準備金積立額の計算と任意積立金は、2019年度に2級の項目として明記された。"],"s":[4]},{"n":"株主資本等変動計算書","p":["純資産の各項目について、当期首残高・当期変動額・当期末残高を示す財務諸表。","株主資本は資本金、資本剰余金（資本準備金・その他資本剰余金）、利益剰余金（利益準備金・その他利益剰余金）。","変動事由には新株の発行、剰余金の配当、任意積立金の積立、当期純利益などがある。","剰余金の配当では、繰越利益剰余金欄に配当額と準備金積立額の合計をマイナスで記入する。","その他有価証券評価差額金など株主資本以外の項目は、当期変動額を純額で記載する。"],"s":[11]},{"n":"合併","p":["吸収合併では、消滅会社の資産・負債を時価で受け入れ、交付した株式の時価を取得の対価とする。","対価が受け入れた純資産を上回る差額はのれん、下回る差額は負ののれん発生益（特別利益）とする。","例：資産時価5,000,000円・負債2,000,000円、交付株式の時価3,500,000円→のれん500,000円。","増加する資本金・資本準備金などの内訳は、合併契約（問題の指示）に従って計上する。"],"s":[7]},{"n":"事業譲渡","p":["他社の事業を現金などで買い取ったら、受け入れた資産・負債を時価で計上する。","支払った対価と受け入れた純資産の時価との差額をのれん（または負ののれん発生益）とする。","例：資産時価800,000円・負債300,000円の事業を600,000円で取得→のれん100,000円。","株式を交付しないため、合併と違って資本金は増えない。"]}]},{"u":"2級商簿：本支店会計と連結","items":[{"n":"本支店会計の基本","p":["支店独立会計制度では本店に支店勘定、支店に本店勘定を設け、両者の残高は貸借逆で一致する。","例：本店が支店へ現金100,000円を送った→本店（借）支店（貸）現金、支店（借）現金（貸）本店。","支店間の取引を本店を通したとみなして記録する方法を本店集中計算制度という。","支店の純利益は、支店（借）損益（貸）本店、本店（借）支店（貸）損益（または総合損益）で本店に振り替える。"]},{"n":"本支店合併財務諸表","p":["本店と支店の財務諸表を合算して、会社全体の外部報告用の財務諸表を作る。","本店勘定と支店勘定は内部の貸借なので相殺し、財務諸表には表示しない。","連絡が届いていない送金や商品発送などの未達取引は、合算前に整理して残高を一致させる。","第3問で損益計算書・貸借対照表とあわせて出題される論点である。"],"s":[11]},{"n":"連結会計の基本","p":["親会社は、子会社を含む企業集団全体の連結財務諸表を作成する。","他社の議決権の過半数を持てば、原則としてその会社は子会社になる。","連結財務諸表は親会社と子会社の個別財務諸表を合算し、連結修正仕訳を加えて作る。","連結会計（子から親へのアップストリームを含む）は、2016年度から段階的に1級から2級へ移った。"],"s":[12]},{"n":"投資と資本の相殺消去","p":["支配獲得日に、親会社の子会社株式と子会社の資本（資本金・資本剰余金・利益剰余金）を相殺消去する。","子会社の資本のうち親会社持分以外は非支配株主持分（純資産）とする。","投資額が親会社持分を上回る差額はのれんとする。","例：子会社資本1,000,000円の80%を900,000円で取得→非支配株主持分200,000円、のれん100,000円。"]},{"n":"支配獲得後の連結修正","p":["前期までの連結修正仕訳は開始仕訳として毎期やり直し、利益剰余金は「利益剰余金当期首残高」で処理する。","のれんは20年以内で定額法償却し、のれん償却（販売費及び一般管理費）とする。","子会社の当期純利益の非支配株主分→（借）非支配株主に帰属する当期純利益（貸）非支配株主持分。","例：子会社配当100,000円、親会社持分80%→（借）受取配当金80,000・非支配株主持分20,000（貸）剰余金の配当100,000。"]},{"n":"内部取引と債権債務の相殺","p":["親子会社間の売上高と売上原価（仕入高）は相殺消去する。","親子会社間の売掛金と買掛金、貸付金と借入金、受取利息と支払利息なども相殺する。","相殺した債権に設定していた貸倒引当金も修正する。","例：親会社の子会社向け売掛金100,000円（引当2%）→相殺に加え（借）貸倒引当金2,000（貸）貸倒引当金繰入2,000。"]},{"n":"未実現利益の消去","p":["親子会社間で売買した商品が期末に残っていれば、含まれる利益を未実現利益として消去する。","ダウンストリーム（親→子）は親会社が全額負担。例：利益10,000円→（借）売上原価10,000（貸）商品10,000。","アップストリーム（子→親）は、消去額を持分比率に応じて非支配株主持分にも負担させる。","親子会社間の土地売買で生じた売却益も未実現利益として消去する。","期首商品に含まれる未実現利益は開始仕訳で消去し、当期に販売されて実現した分を戻す。"]},{"n":"連結精算表と連結財務諸表","p":["連結精算表は個別財務諸表欄・修正消去欄・連結財務諸表欄で構成する。","連結損益計算書は当期純利益から非支配株主に帰属する当期純利益を引き、親会社株主に帰属する当期純利益を示す。","連結貸借対照表の純資産の部に非支配株主持分を表示する。","第2問で連結精算表や連結財務諸表の作成として出題される。"],"s":[11]}]},{"u":"2級工簿：費目別・個別・部門別","items":[{"n":"原価の分類と勘定連絡","p":["製造原価は形態別に材料費・労務費・経費、製品との関係で製造直接費・製造間接費に分ける。","直接費は仕掛品勘定へ賦課し、間接費は製造間接費勘定に集めてから仕掛品へ配賦する。","完成品は仕掛品から製品へ、販売した分は製品から売上原価へ振り替える。","製造原価に販売費及び一般管理費を加えたものが総原価。異常な仕損などは非原価項目。","操業度の増減に比例するものを変動費、一定のものを固定費と分ける。"]},{"n":"材料費の計算","p":["材料の購入原価は購入代価に引取運賃などの材料副費を加えた額。","消費単価は先入先出法か平均法（移動平均法・総平均法）で計算する。","予定消費価格を使うと、（予定価格−実際価格）×実際消費量が材料消費価格差異になる。","例：予定@100円、実際@105円、消費1,000kg→差異5,000円の借方（不利）差異。","主要材料費・買入部品費は直接材料費。補助材料費・工場消耗品費・消耗工具器具備品費は間接材料費。"]},{"n":"労務費の計算","p":["直接工の直接作業時間分の賃金が直接労務費、間接作業・手待時間分は間接労務費。","間接工の賃金、工場事務員の給料、賞与、退職給付費用、法定福利費は間接労務費。","当月の消費賃金（要支払額）＝当月支払額−前月未払額＋当月未払額。","予定賃率を使うと、予定消費額と実際消費額の差が賃率差異になる。","例：予定@1,000円×800時間＝800,000円、実際820,000円→賃率差異20,000円（借方・不利）。"]},{"n":"経費の計算","p":["外注加工賃・特許権使用料は直接経費、減価償却費・修繕費・電力料・保険料などは間接経費。","支払経費は支払額、月割経費（減価償却費など）は年額の月割額で消費額を計算する。","測定経費（電力料・ガス代・水道料）は測定した消費量、発生経費（棚卸減耗費など）は発生額による。","例：外注加工賃を支払う→直接経費なので仕掛品に賦課する。"]},{"n":"製造間接費の予定配賦","p":["予定配賦率＝年間製造間接費予算額÷年間基準操業度（直接作業時間・機械運転時間など）。","予定配賦額＝予定配賦率×実際操業度で仕掛品へ配賦する。","製造間接費配賦差異＝予定配賦額−実際発生額。マイナスなら借方（不利）差異。","例：予定配賦率@500円×実際1,000時間＝500,000円、実際発生510,000円→借方差異10,000円。","原価差異は会計年度末に売上原価に加減し、借方差異は売上原価に加える。"],"s":[7]},{"n":"配賦差異の分析","p":["予算差異＝実際操業度での予算許容額−実際発生額。","公式法変動予算の予算許容額＝変動費率×実際操業度＋固定費予算額。","操業度差異＝固定費率×（実際操業度−基準操業度）。固定予算では予算額を操業度によらず一定とする。","例：変動費率@200円、固定費予算300,000円、基準1,000時間、実際900時間、実際発生490,000円。","上の例では予算差異−10,000円、操業度差異−30,000円（ともに不利）、合計−40,000円。"]},{"n":"個別原価計算と仕損","p":["注文ごとに製造指図書を出し、指図書別に原価を集計する受注生産向けの方法。","原価計算表で、完成・引渡し済みの指図書は製品・売上原価、未完成は月末仕掛品となる。","補修で直せる仕損は、補修指図書に集めた原価を仕損費とする。","全部が仕損となり代品を作る場合は、旧指図書の原価から仕損品評価額を引いた額を仕損費とする。","仕損費は元の製造指図書に直接経費として賦課する。"]},{"n":"部門別計算","p":["製造間接費を製造部門（切削部・組立部など）と補助部門（動力部・修繕部・工場事務部など）に集める。","部門個別費は直接賦課し、部門共通費は床面積・従業員数などの基準で配賦する（第1次集計）。","補助部門費は製造部門へ配賦する（第2次集計）。直接配賦法は補助部門間のやり取りを無視する。","相互配賦法（簡便法）は第1次配賦で補助部門間にも配り、第2次配賦は製造部門だけに配る。","部門別の予定配賦率を使えば、部門ごとに配賦差異を把握できる。"]},{"n":"製造原価報告書","p":["当期の製造費用を材料費・労務費・経費に分けて示し、仕掛品の増減を加減して当期製品製造原価を表す。","当期製品製造原価＝当期総製造費用＋期首仕掛品棚卸高−期末仕掛品棚卸高。","予定配賦の場合、実際発生額で示した製造間接費に配賦差異を加減して予定配賦額にそろえる。","売上原価＝期首製品棚卸高＋当期製品製造原価−期末製品棚卸高（原価差異を加減）。"]},{"n":"本社工場会計","p":["工場の帳簿を本社から独立させ、本社に工場勘定、工場に本社勘定を設ける。","工場に置く勘定（材料・賃金・製造間接費・仕掛品など）は問題文の指示で判断する。","例：本社が材料を掛けで買い工場へ直送→本社（借）工場（貸）買掛金、工場（借）材料（貸）本社。","工場勘定と本社勘定の残高は貸借逆で一致する。"],"s":[7]}]},{"u":"2級工簿：総合・標準・直接原価","items":[{"n":"単純総合原価計算","p":["同じ製品を連続生産する場合に使い、一定期間の製造原価を完成品と月末仕掛品に分ける。","始点投入の直接材料費は数量の比で、加工費は完成品換算量（数量×加工進捗度）の比で配分する。","平均法は月初仕掛品原価と当月製造費用の合計を、完成品量と月末換算量の比で配分する。","先入先出法は月初仕掛品から先に完成したとみなし、当月製造費用だけを当月投入量で配分する。","例：月初0、当月加工費90,000円、完成800個、月末200個（進捗50%）→月末加工費10,000円。"]},{"n":"仕損・減損（度外視法）","p":["正常仕損・正常減損の費用は良品に負担させる。度外視法では仕損の数量を計算から除いて負担させる。","月末仕掛品が仕損の発生点を過ぎていれば完成品と月末仕掛品の両者負担、過ぎていなければ完成品のみ負担。","例：始点で発生なら両者負担、終点で発生なら完成品のみ負担となる。","仕損品に評価額があれば、その額を負担させる原価から差し引く。","異常仕損費は非原価項目として、製品原価に含めない。"]},{"n":"工程別総合原価計算","p":["製品が複数の工程を経て完成する場合、工程ごとに原価を計算する。","累加法では前工程の完成品原価を前工程費として次工程に振り替え、次工程の始点投入材料と同じに扱う。","例：第1工程の完成品原価500,000円を次工程へ→（借）第2工程仕掛品（貸）第1工程仕掛品。","第1工程の完成品をいったん倉庫に保管する場合は、半製品勘定を経由させる。"]},{"n":"組別総合原価計算","p":["種類の異なる製品（組）を同じ工場で連続生産する場合に使う。","組直接費は各組に直接賦課し、組間接費は機械作業時間などの基準で各組に配賦する。","その後は組ごとに単純総合原価計算と同じ手順で完成品と月末仕掛品に配分する。"]},{"n":"等級別総合原価計算","p":["同じ種類で大きさや品質が違う製品（等級製品）を連続生産する場合に使う。","各等級製品の完成品量に等価係数を掛けた積数の比で、完成品原価を配分する。","例：完成品原価600,000円、1級品100個（係数1）・2級品200個（係数0.5）→積数100対100で各300,000円。"]},{"n":"標準原価計算と勘定記入","p":["原価標準（製品1単位の標準原価）に実際生産量を掛けて標準原価を求め、実際原価との差異を分析する。","原価標準は標準消費量×標準価格、標準作業時間×標準賃率、標準操業度×標準配賦率で設定する。","パーシャル・プランは仕掛品勘定の借方に実際原価を記入し、仕掛品勘定で差異を出す。","シングル・プランは仕掛品勘定の借方も標準原価で記入し、材料・賃金・製造間接費の各勘定で差異を出す。","標準原価差異は会計年度末に売上原価に加減する。借方差異は売上原価に加える。"],"s":[7]},{"n":"直接材料費差異と直接労務費差異","p":["価格差異＝（標準価格−実際価格）×実際消費量。数量差異＝（標準消費量−実際消費量）×標準価格。","賃率差異＝（標準賃率−実際賃率）×実際作業時間。作業時間差異＝（標準時間−実際時間）×標準賃率。","計算結果がマイナスなら不利差異（借方差異）、プラスなら有利差異（貸方差異）。","例：標準@100円×4,000kg、実際@102円×4,100kg→価格差異8,200円不利、数量差異10,000円不利。"]},{"n":"製造間接費差異","p":["総差異＝標準製造間接費（標準配賦率×標準操業度）−実際発生額。","公式法変動予算では予算差異・能率差異・操業度差異に分ける。","予算差異＝（変動費率×実際操業度＋固定費予算額）−実際発生額。","能率差異は標準操業度と実際操業度の差から生じ、操業度差異は基準操業度との差から生じる。","能率差異を変動費だけで計算するかなど、差異の分け方は問題の指示に従う。"]},{"n":"直接原価計算","p":["変動製造原価だけで製品原価を計算し、固定製造原価はその期の費用（期間原価）とする。","売上高−変動売上原価＝変動製造マージン、−変動販売費＝貢献利益、−固定費＝営業利益。","全部原価計算との営業利益の差は、期首・期末在庫に含まれる固定製造原価の差から生じる。","固定費調整：直接原価計算の営業利益＋期末在庫の固定製造原価−期首在庫の固定製造原価＝全部原価計算の営業利益。","期首・期末に在庫がなければ、両方法の営業利益は一致する。"],"s":[11]},{"n":"CVP分析と固変分解","p":["損益分岐点売上高＝固定費÷貢献利益率（貢献利益÷売上高）。","目標営業利益を達成する売上高＝（固定費＋目標営業利益）÷貢献利益率。","安全余裕率＝（売上高−損益分岐点売上高）÷売上高。損益分岐点比率との合計は100%。","例：売上高1,000,000円、変動費600,000円、固定費300,000円→損益分岐点750,000円、安全余裕率25%。","高低点法は最高・最低操業度の原価差を操業度差で割って変動費率を出す。正常操業圏外のデータは除く。"],"s":[11]}]}]},{"id":"ipass","name":"ITパスポート","full":"ITパスポート試験","group":"資格試験","desc":"ITを利活用する社会人・学生に必要なITの基礎知識を問う国家試験","asOf":"ITパスポート試験シラバスVer.6.5（2026年1月掲載）・試験要綱Ver.5.6に基づく（2026年11月時点）","aliases":["iパス","ITパス","ITパスポート試験","IP試験"],"sources":[{"t":"IPA「ITパスポート試験 シラバス Ver.6.5」","u":"https://www.ipa.go.jp/shiken/syllabus/omgdg50000005kn1-att/syllabus_ip_ver6_5.pdf"},{"t":"IPA「情報処理技術者試験・情報処理安全確保支援士試験 試験要綱 Ver.5.6」","u":"https://www.ipa.go.jp/shiken/syllabus/rcu1hd00000141gq-att/youkou_ver5_6.pdf"},{"t":"IPA「試験要綱・シラバス」一覧ページ","u":"https://www.ipa.go.jp/shiken/syllabus/gaiyou.html"},{"t":"IPA パンフレット（iパス・情報セキュリティマネジメント・基本情報）","u":"https://www.ipa.go.jp/shiken/about/gmcbt8000000cy3n-att/pamphlet_IP-SG-FE.pdf"},{"t":"IPA「ITパスポート試験における生成AIに関するシラバスの変更」（2023年8月）","u":"https://www.ipa.go.jp/shiken/syllabus/henkou/2023/20230807.html"},{"t":"IPA「情報処理技術者試験・情報処理安全確保支援士試験の見直し」（2026年3月公開）","u":"https://www.ipa.go.jp/shiken/syllabus/henkou/2025/20260331.html"},{"t":"IPA「新試験制度のシラバス案」掲載ページ","u":"https://www.ipa.go.jp/shiken/syllabus/henkou/2026/20260630.html"},{"t":"IPA「ITパスポート試験 シラバス（案）Ver.0.1」（2027年度新制度）","u":"https://www.ipa.go.jp/shiken/syllabus/minaoshi/rcu1hd000001ffp5-att/syllabus_ip_ver0_1.pdf"},{"t":"成美堂出版「ITパスポート シラバスVer.6.5 変更点」","u":"https://seibidoshuppan.co.jp/seibidopub-hp/public/storage/support/image/it_v6.5.pdf"},{"t":"成美堂出版「ITパスポート シラバスVer.6.4 変更点」","u":"https://www.seibidoshuppan.co.jp/seibidopub-hp/public/storage/support/image/it_v6.4.pdf"},{"t":"公正取引委員会九州事務所「取適法（改正下請法）の概要」（長崎県掲載資料）","u":"https://www.pref.nagasaki.jp/shared/uploads/2025/11/1764136904.pdf"},{"t":"@IT「ITパスポートは非IT企業にこそ人気 2027年の大変化」","u":"https://atmarkit.itmedia.co.jp/ait/spv/2606/09/news055.html"},{"t":"アガルート「ITパスポート試験の内容」","u":"https://www.agaroot.jp/it_passport/column/exam-content/"}],"units":[{"u":"試験制度と出題範囲","items":[{"n":"試験方式と出題数","p":["CBT方式で全国の会場で通年随時実施され、受験日の3か月先まで日時と会場を選んで申し込める。","試験時間は120分、出題数・解答数は100問で、すべて四肢択一の多肢選択式である。","分野別の出題数の目安はストラテジ系35問程度、マネジメント系20問程度、テクノロジ系45問程度。","受験手数料は7,500円（税込）。身体の不自由等でCBT受験が困難な者はペーパー方式で受験できる。","2025年度の応募者数は307,266人で2年連続30万人超、合格率は48.6%だった。"],"s":[1,3,11,12]},{"n":"採点方式と合格基準","p":["評価点はIRT（項目応答理論）に基づいて算出するため、1問何点という配点割合は設定されていない。","総合評価点600点以上（1,000点満点）かつ3分野すべての分野別評価点300点以上（各1,000点満点）で合格。","総合点が600点を超えていても、1分野でも分野別評価点が300点未満なら不合格になる。","100問中92問で総合評価を行い、残り8問は今後出題する問題の評価用。分野別評価は32問・18問・42問で行う。","試験終了後その場で結果を確認でき、合格発表は受験翌月中旬、合格者には合格証書が交付される。"],"s":[1,3]},{"n":"シラバスの構成と改訂点","p":["現行のシラバスVer.6.5（2026年1月掲載）は、3分野・9大分類・23中分類・63小分類で構成される。","Ver.6.5では取引関連法規から「下請法」が削除され、「中小受託取引適正化法」が追加された。","Ver.6.4（2025年4月）では「プロバイダ責任制限法」が「情報流通プラットフォーム対処法」に置き換えられた。","Ver.6.2で生成AIの仕組み・活用例・留意事項の項目と用語例が加わり、2024年4月の試験から適用された。"],"s":[0,2,4,8,9]},{"n":"2027年度からの新試験制度","p":["IPAは新試験制度を2027年度春頃に開始する予定で、現行制度は2026年度の試験をもって終了する予定。","新しいITパスポート試験も試験時間120分・出題数100問とされ、新制度の全試験はCBT方式で実施される予定。","出題分野は「ストラテジ系・マネジメント系・テクノロジ系」から「ビジネス」「テクノロジ」「セキュリティ・倫理」に再整理される。","DXで求められるマインド・スタンスとデータマネジメントの基礎が加わり、AI時代のセキュリティと倫理が強化される。","新シラバス案Ver.0.1は2026年8月31日掲載の検討段階の案で、今後変更される可能性がある。"],"s":[5,6,7,11]}]},{"u":"企業活動と会計・財務","items":[{"n":"経営理念と企業の社会的責任","p":["経営理念は企業の存在意義や価値観を示すもので、MVVはミッション・ビジョン・バリューの略である。","CSR（企業の社会的責任）は、利益追求だけでなく環境・社会・ステークホルダへの責任を果たす考え方。","ステークホルダは株主・顧客・従業員・取引先・地域社会など、企業活動の利害関係者を指す。","SRI（社会的責任投資）は、企業の社会的責任への取組みを投資先選定の判断材料にする投資である。","人的資本経営は人材を「資本」と捉えてその価値を最大限に引き出し、中長期的な企業価値向上につなげる経営。"],"s":[0]},{"n":"経営管理とBCP","p":["経営資源はヒト・モノ・カネ・情報の4つで表される。","PDCAは計画（Plan）・実行（Do）・評価（Check）・改善（Act）を繰り返し、業務を継続的に改善する手法。","OODAループは観察・状況判断・意思決定・行動を素早く回し、変化の激しい状況に対応する手法である。","BCP（事業継続計画）は災害やシステム障害の発生時に、重要業務を継続・早期復旧するための計画である。","BCM（事業継続管理）は、BCPの策定・訓練・見直しを含む事業継続のための継続的な管理活動全体を指す。"],"s":[0]},{"n":"人材育成と経営組織","p":["OJTは実務を通じた職場内訓練、Off-JTは職場を離れて行う研修。リスキリングは新しい業務に必要なスキルの学び直し。","目標による管理（MBO）は、本人が上司と目標を設定し達成度で評価する手法で、経営陣による買収のMBOとは別物。","職能別（機能別）組織は営業・製造など機能ごとに、事業部制組織は製品や地域ごとに編成し各事業部が利益責任を負う。","マトリックス組織は機能別と事業別など2系統の指揮命令系統を持ち、命令が二重になりやすい。","プロジェクト組織は特定の目的のために一時的に編成し、目的を達成したら解散する。CIOは情報戦略の最高責任者。"],"s":[0]},{"n":"社会におけるIT利活用の動向","p":["Society 5.0は、サイバー空間と現実空間を高度に融合させ、経済発展と社会課題の解決を両立する人間中心の社会。","DXはデータとデジタル技術を活用して製品・サービスやビジネスモデル、組織を変革し、競争上の優位を確立すること。","GXは化石燃料中心の産業・社会構造をクリーンエネルギー中心へ転換し、カーボンニュートラルと経済成長の両立を目指す。","第4次産業革命は、IoT・ビッグデータ・AI・ロボットなどの技術による産業構造の変革を指す。","データ駆動型社会では、現実世界から集めたデータを分析し、その結果を現実の課題解決に生かす。"],"s":[0]},{"n":"業務分析の図表と手法","p":["パレート図は値の大きい順に並べた棒グラフと累積比率の折れ線を組み合わせ、重点的に対処すべき項目を見つける。","ABC分析はパレート図を使って累積比率の上位からA・B・Cの3群に分け、A群を重点的に管理する手法である。","特性要因図（フィッシュボーン図）は、結果（特性）とそれに影響する要因の関係を魚の骨の形に整理する。","散布図は2つの変数の関係を点の分布で表し、相関の有無や強さを確認するのに使う。","管理図は時系列データに上方・下方の管理限界線を引き、工程が異常な状態にないかを判断する。"],"s":[0]},{"n":"データ利活用と統計の注意","p":["量的データ（数値）と質的データ（分類）、表形式の構造化データと文章・画像などの非構造化データを区別する。","分析の前に、欠損値や外れ値の処理、表記ゆれの統一などのデータの前処理（クレンジング）を行う。","標本調査では母集団から偏りなく標本を抽出する必要があり、抽出の偏りは統計的バイアスの原因になる。","相関関係があっても因果関係があるとは限らない。第三の要因による見かけの相関（擬似相関）に注意する。","BIツールは蓄積データを分析・可視化して意思決定を支援し、データマイニングは大量データから規則性を発見する。"],"s":[0]},{"n":"意思決定と問題解決手法","p":["デシジョンツリーは選択肢と起こりうる結果を木構造で表し、各案の期待値（確率×金額の合計）を比較して選ぶ。","ブレーンストーミングは批判厳禁・自由奔放・質より量・結合便乗の4原則で、多くのアイデアを出す。","親和図法は、言語データを意味の近いもの同士でグループ化し、問題の構造を明らかにする手法である。","定量発注方式は在庫が発注点を下回ったら一定量を発注し、定期発注方式は決まった間隔で必要量を算出して発注する。"],"s":[0]},{"n":"損益分岐点と利益の計算","p":["固定費は売上高に関係なく一定（家賃・人件費など）、変動費は売上高に比例して増える（材料費など）。","損益分岐点売上高＝固定費÷（1－変動費率）で、変動費率＝変動費÷売上高。利益がちょうど0になる売上高である。","計算例：固定費300万円、変動費率0.4なら損益分岐点売上高は300÷（1－0.4）＝500万円となる。","売上総利益＝売上高－売上原価、営業利益＝売上総利益－販売費及び一般管理費である。","経常利益＝営業利益＋営業外収益－営業外費用。さらに特別損益と税金を加減して当期純利益となる。"],"s":[0]},{"n":"財務諸表と財務指標","p":["貸借対照表は決算日時点の資産・負債・純資産を示し、資産＝負債＋純資産が成り立つ。","損益計算書は一定期間の収益・費用・利益を示し、キャッシュフロー計算書は営業・投資・財務活動ごとの現金の増減を示す。","ROE（自己資本利益率）＝当期純利益÷自己資本、ROA（総資産利益率）＝利益÷総資産で、収益性を測る。","流動比率＝流動資産÷流動負債は短期の支払能力、自己資本比率＝自己資本÷総資本は経営の安全性を示す。","インボイス制度では、消費税の仕入税額控除を受けるために原則として適格請求書（インボイス）の保存が必要。"],"s":[0]}]},{"u":"法務：知財・セキュリティ法規","items":[{"n":"著作権法の基本","p":["著作権は著作物を創作した時点で自動的に発生し、登録や申請は不要である（無方式主義）。","プログラムは保護対象だが、プログラム言語・規約（プロトコル）・解法（アルゴリズム）は保護されない。","違法にアップロードされたものと知りながら、音楽・映像などをダウンロードする行為も違法となる。","保護期間は原則として著作者の死後70年。引用は出所の明示や、自分の著作物が主で引用部分が従などの条件で認められる。","社員が職務上作成したプログラムは、別段の定めがなければ法人が著作者。委託開発では契約で定めない限り受託者に帰属する。"],"s":[0]},{"n":"著作権と生成AI","p":["シラバスは、AIが学習に使うデータとAIが生成したデータについて、著作権・産業財産権の観点で留意が必要としている。","情報解析など著作物の表現を享受しない目的の利用（AI学習など）は原則許諾不要だが、著作権者の利益を不当に害する場合は除く。","AI生成物でも、既存の著作物との類似性と依拠性が認められれば著作権侵害となりうる。","人の創作的な寄与がなく、AIが自律的に生成しただけのものは、一般に著作物に当たらないと考えられている。"],"s":[0]},{"n":"産業財産権の4つの権利","p":["産業財産権は特許権・実用新案権・意匠権・商標権の4つで、特許庁に出願し登録されることで権利が発生する。","特許権は高度な発明を保護し、存続期間は原則として出願から20年。ビジネスの方法を含むビジネスモデル特許もある。","実用新案権は物品の形状・構造などの考案を保護し、存続期間は出願から10年。実体審査なしで登録される。","意匠権は物品などのデザインを保護し、存続期間は出願から25年である。","商標権は商品のマーク（トレードマーク）や役務のマーク（サービスマーク）を保護し、登録から10年で更新できる。"],"s":[0]},{"n":"不正競争防止法とライセンス","p":["不正競争防止法は、著作権法や産業財産権法では守られない営業秘密や限定提供データを不正な取得・使用から守る。","営業秘密として保護されるには、秘密管理性・有用性・非公知性の3要件をすべて満たす必要がある。","ソフトウェアライセンスは権利者が使用を許諾する契約で、利用者が得るのは著作権ではなく使用権である。","ボリュームライセンスは多数の使用権を一括で購入する契約、サイトライセンスは特定の施設や組織内での利用を一括許諾する。","肖像権やパブリシティ権は明文の法律はないが、判例で認められた権利である。"],"s":[0,7]},{"n":"個人情報保護法の定義","p":["個人情報は生存する個人に関する情報で、氏名・生年月日などにより特定の個人を識別できるものをいう。","顔や指紋の特徴データ、マイナンバー、旅券番号などの個人識別符号は、それ単体で個人情報に当たる。","要配慮個人情報は人種・信条・病歴・犯罪の経歴など不当な差別につながる情報で、取得には原則として本人同意が必要。","個人情報データベース等を事業に使う者は、扱う件数にかかわらず個人情報取扱事業者として法の義務を負う。","匿名加工情報は個人を識別できず復元もできないよう加工したもの、仮名加工情報は他の情報と照合しない限り識別できないもの。"],"s":[0,7]},{"n":"個人情報の取扱いとGDPR","p":["利用目的をできる限り特定し、取得時に本人へ通知または公表する。目的外の利用には原則として本人同意が必要。","個人データの第三者提供は原則として事前の本人同意（オプトイン）が必要。業務委託先への提供は第三者提供に当たらない。","本人の求めで提供を停止するオプトアウト方式は個人情報保護委員会への届出が必要で、要配慮個人情報には使えない。","要配慮個人情報を含む漏えいや1,000人超の漏えいなどでは、個人情報保護委員会への報告と本人への通知が義務となる。","EUのGDPRはEU域内の個人データを扱う域外企業にも適用され、忘れられる権利（消去権）を定める。"],"s":[0]},{"n":"不正アクセス禁止法","p":["他人のID・パスワードを無断で使う、または脆弱性を突いてアクセス制御を回避し、権限のないコンピュータを利用する行為を禁じる。","情報の窃取や改ざんなどの実害が生じなくても、不正アクセス行為そのものが処罰の対象となる。","他人の識別符号（ID・パスワード）を不正に取得・保管したり、正当な理由なく第三者に提供したりする行為も禁止される。","フィッシングサイトなどで利用者に識別符号の入力を求める行為（不正入力要求）も処罰対象である。","対象はネットワークに接続されアクセス制御機能をもつコンピュータで、ネットワークを経由しない単独機の無断使用は対象外。"],"s":[0,7]},{"n":"その他のセキュリティ関連法規","p":["サイバーセキュリティ基本法は、国のサイバーセキュリティ施策の基本理念と、国・地方公共団体・事業者などの責務を定める。","特定電子メール法は、広告宣伝メールの送信に原則として受信者の事前同意（オプトイン）を求め、送信者表示を義務付ける。","刑法の不正指令電磁的記録に関する罪（ウイルス作成罪）は、正当な理由なくマルウェアを作成・提供・取得・保管する行為を罰する。","2027年度の新シラバス案では、これらに加えて「サイバー対処能力強化法」も用語例に挙がっている。"],"s":[0,7]}]},{"u":"法務：労働・取引・倫理","items":[{"n":"労働基準法と労働関連法","p":["労働基準法は労働時間・休日・賃金など、労働条件の最低基準を定める法律である。","法定労働時間を超えて働かせるには36協定の締結・届出が必要で、時間外労働の上限は原則月45時間・年360時間。","フレックスタイム制は一定期間の総労働時間の範囲内で、始業・終業時刻を労働者が自ら決められる制度である。","裁量労働制は業務の進め方を労働者の裁量に委ね、実際の労働時間にかかわらず労使で定めた時間を働いたとみなす。","労働契約法は労働契約の基本ルール、労働安全衛生法は職場の安全と健康、労働施策総合推進法はパワハラ防止措置を定める。"],"s":[0,7]},{"n":"労働者派遣と請負・準委任","p":["労働者派遣では派遣元が労働者を雇用し、派遣先が派遣労働者に直接指揮命令する。","請負では請負事業者が自社の労働者に指揮命令し、仕事の完成に対して報酬が支払われる。発注者は直接指示できない。","発注者が請負事業者の労働者に直接指揮命令すると偽装請負となり違法。派遣先が別会社へ再派遣する二重派遣も禁止。","準委任契約は仕事の完成ではなく事務処理の遂行を目的とする契約で、受託者は善良な管理者の注意義務を負う。","守秘義務契約（NDA）は、取引の過程で知り得た秘密情報を第三者に開示・漏えいしないことを約束する契約である。"],"s":[0,7]},{"n":"中小受託取引適正化法","p":["下請法を改正した法律で2026年1月1日施行。通称は取適法で、委託事業者から中小受託事業者への代金支払遅延などを防ぐ。","呼称が親事業者→委託事業者、下請事業者→中小受託事業者、下請代金→製造委託等代金に変わった。","資本金基準に加え従業員基準（製造委託やプログラム作成委託などは300人、一部の役務・情報成果物は100人）が追加された。","発荷主が運送事業者に物品の運送を委託する「特定運送委託」が対象に加わり、手形払や協議に応じない一方的な代金決定も禁止。","委託事業者は発注内容の明示、取引記録の作成・2年保存、受領後60日以内の支払期日設定、遅延利息年14.6%の支払義務を負う。"],"s":[0,8,10]},{"n":"その他の取引関連法規","p":["独占禁止法は私的独占・不当な取引制限（カルテル）・不公正な取引方法を禁止し、公正で自由な競争を促す。","景品表示法は品質や価格の不当表示と過大な景品を規制し、2023年10月からはステルスマーケティングも不当表示として規制。","特定商取引法は訪問販売などのクーリング・オフや通信販売の表示義務を定める。通信販売にはクーリング・オフ制度はない。","PL法は製造物の欠陥による損害について、過失がなくても製造業者に賠償責任を負わせる。ソフトウェア単体は製造物でない。","資金決済法は電子マネーなどの前払式支払手段や暗号資産交換業を規制し、特定デジタルプラットフォーム透明化法は大規模モール等に取引条件の開示を求める。"],"s":[0,7]},{"n":"情報倫理とコンプライアンス","p":["情報流通プラットフォーム対処法は2024年改正でプロバイダ責任制限法から改められ、大規模事業者に削除対応の迅速化と運用の透明化を求める。","フィルターバブルは自分の好みに合う情報ばかり表示され異なる意見に触れにくくなる現象で、ファクトチェックは情報の真偽を検証すること。","コンプライアンスは法令だけでなく、社内規程や企業倫理、社会規範を守ることまで含む。","公益通報者保護法は、組織の法令違反を通報した労働者などを解雇や降格などの不利益な取扱いから守る。","情報公開法により、誰でも国の行政機関に対して行政文書の開示を請求できる。"],"s":[0,9]},{"n":"標準化と標準化団体","p":["デジュレスタンダードは標準化機関が定めた公的な標準、デファクトスタンダードは市場競争の結果として事実上の標準になったもの。","フォーラム標準は、関心のある企業などが集まってフォーラムを作り合意して定める標準である。","ISOは工業・サービス分野、IECは電気・電子分野の国際標準化機関。IEEEはLAN規格など、W3CはWeb技術を標準化する。","ISO 9000は品質、ISO 14000は環境、ISO/IEC 27000は情報セキュリティのマネジメントシステム規格群である。JISは日本の国家規格。","JANコードは商品識別用の1次元バーコード、QRコードは縦横に情報をもつ2次元コードで、1次元より多くの情報を記録できる。"],"s":[0]}]},{"u":"経営戦略とマーケティング","items":[{"n":"経営環境の分析手法","p":["SWOT分析は内部環境の強み（S）・弱み（W）と、外部環境の機会（O）・脅威（T）を整理して戦略を考える。","自社の技術力や人材は内部環境、法改正・景気・競合の動きは外部環境に分類する。分類の取り違えが典型的な誤り。","3C分析は顧客（市場）・競合・自社の3つの観点から事業環境を分析する手法である。","VRIO分析は経済的価値・希少性・模倣困難性・組織の4つの観点で、経営資源が競争優位を生むかを評価する。"],"s":[0]},{"n":"PPM","p":["PPMは市場成長率と市場占有率の2軸で事業や製品を4つに分類し、経営資源の配分を検討する手法である。","花形は高成長・高シェア、金のなる木は低成長・高シェア、問題児は高成長・低シェア、負け犬は低成長・低シェア。","金のなる木は少ない投資で多くの資金を生むため、その資金を問題児や花形に投資するのが基本。","問題児はシェア拡大に多くの投資が必要で、育成するか撤退するかの判断が求められる。負け犬は撤退を検討する。"],"s":[0]},{"n":"競争戦略と提携・買収","p":["コアコンピタンスは他社がまねできない中核的な強み、ニッチ戦略は大手が狙わない隙間市場に集中する戦略である。","ブルーオーシャン戦略は競争のない新しい市場を創出する戦略。同質化戦略は上位企業が下位企業の差別化策を模倣して無力化する。","M&Aは企業の合併・買収、TOBは株式の公開買付け、MBOは経営陣が自社の株式を買い取って独立することである。","OEMは相手先のブランドで製品を製造すること、ファブレスは自社工場を持たず製造を外部に委託する形態である。","規模の経済は生産量の増加で単位コストが下がること。カニバリゼーションは自社製品同士が市場を奪い合う現象である。"],"s":[0]},{"n":"マーケティングの基礎","p":["4Pは売り手視点の製品・価格・流通・販売促進、4Cは買い手視点の顧客価値・顧客コスト・利便性・コミュニケーション。","RFM分析は最終購買日（Recency）・購買頻度（Frequency）・累計購買金額（Monetary）で顧客をランク分けする。","アンゾフの成長マトリクスは製品と市場を既存・新規で分け、市場浸透・製品開発・市場開拓・多角化の4戦略を示す。","プロダクトライフサイクルは導入期・成長期・成熟期・衰退期の4段階で、段階に応じて販売戦略を変える。","オムニチャネルは実店舗・EC・SNSなどの販売チャネルを統合し、どこでも一貫した購買体験を提供する手法である。"],"s":[0]},{"n":"Webマーケティングと価格設定","p":["SEOは検索結果で自社サイトが上位に表示されるよう工夫する施策、リスティング広告は検索語句に連動して表示される広告。","アフィリエイトは紹介先サイト経由で購入などの成果があったときに報酬を払う成果報酬型広告である。","A/Bテストは2つのパターンのWebページや広告を比べ、より効果の高い方を採用する手法である。","スキミングプライシングは高価格で早期に開発費を回収し、ペネトレーションプライシングは低価格で短期にシェアを獲得する。","ダイナミックプライシングは需要と供給の状況に応じて価格を変動させる手法で、航空券やホテルの料金などで使われる。"],"s":[0]},{"n":"目標設定と評価指標","p":["BSC（バランススコアカード）は財務・顧客・業務プロセス・学習と成長の4つの視点で戦略を具体化し、業績を評価する。","CSFは目標達成のために特に重要な成功要因、KGIは最終目標の達成度を測る重要目標達成指標である。","KPIはKGIの達成に向けたプロセスの進み具合を測る中間指標で、KPIツリーでKGIを分解して関連付ける。","SMARTは目標設定の要件で、具体的・測定可能・達成可能・関連性・期限の頭文字を取ったものである。","バリューエンジニアリングは、製品やサービスの価値を機能とコストの関係で捉え、価値の向上を図る手法である。"],"s":[0]},{"n":"経営管理システム","p":["CRMは顧客情報を一元管理して長期的な関係を築き、顧客満足度と収益の向上を図る経営手法である。","SCMは調達・生産・物流・販売のサプライチェーン全体を最適化し、在庫の削減やリードタイムの短縮を図る。","ERPは販売・生産・会計・人事などの基幹業務を統合的に管理する考え方で、ERPパッケージとして提供される。","TQMは品質管理を経営全体に広げた取組み、シックスシグマは統計的手法で業務プロセスのばらつきを減らす手法である。","ナレッジマネジメントは個人の知識を組織で共有・活用する手法で、SECIモデルは暗黙知と形式知の変換過程を示す。"],"s":[0]}]},{"u":"技術戦略とビジネス産業","items":[{"n":"技術開発戦略とイノベーション","p":["MOT（技術経営）は技術を経営資源として捉え、研究開発の成果を事業化して利益につなげるための経営である。","魔の川は研究から製品開発、死の谷は開発から事業化、ダーウィンの海は事業化から産業化に至る段階の障壁を指す。","キャズムは新製品が初期採用者から多数派へ普及する際の深い溝、イノベーションのジレンマは優良企業が破壊的技術に敗れる現象。","オープンイノベーションは社外の技術やアイデアを積極的に取り入れ、自社の資源と組み合わせて革新を生み出す手法である。","デザイン思考は利用者への共感から課題を定義し試作と検証を繰り返す手法。PoCは新しいアイデアの実現可能性の検証。"],"s":[0]},{"n":"業務分野・行政の情報システム","p":["POSシステムは販売時点で商品情報を収集し、売上分析や在庫管理、発注に活用するシステムである。","RFIDは電波を使ってICタグの情報を非接触で読み書きする技術で、複数のタグをまとめて読み取れる。","GISは地図上に位置情報と各種データを重ねて表示・分析し、トレーサビリティは製品の生産から消費までの履歴を追跡可能にする。","マイナンバーは住民票を有する個人に付される12桁の番号で、社会保障・税・災害対策の分野で利用される。","マイナポータルは政府が運営するオンラインサービス、ガバメントクラウドは国や地方公共団体が共通利用するクラウド基盤。"],"s":[0]},{"n":"エンジニアリングシステム","p":["CADはコンピュータで設計・製図を行うシステムで、設計データを再利用して作業を効率化しやすくする。","JIT（ジャストインタイム）は必要なものを必要なときに必要な量だけ生産し、在庫を最小限にする生産方式である。","かんばん方式は後工程が前工程へ部品を引き取りに行き、かんばんで生産と運搬を指示するJIT実現の手段である。","MRP（資材所要量計画）は生産計画と部品構成表から、必要な資材の量と手配時期を算出する手法である。","コンカレントエンジニアリングは、設計や生産準備など複数の工程を同時並行で進めて開発期間を短縮する。"],"s":[0]},{"n":"電子商取引とフィンテック","p":["EDIは企業間で受発注などの取引データを、取り決めた標準形式で電子的に交換する仕組みである。","O2Oはオンラインから実店舗へ顧客を誘導する施策、OMOはオンラインとオフラインを融合して顧客体験を高める考え方。","ロングテールは販売数の少ない多数の商品の売上合計が大きな割合を占める現象で、在庫制約の小さいネット販売で顕著。","フリーミアムは基本機能を無料で提供し高度な機能を有料にするモデル、エスクローは仲介者が代金を一時預かる取引方式。","NFTはブロックチェーンでデジタルデータに唯一性を持たせる技術、CBDCは中央銀行が発行するデジタル通貨である。"],"s":[0]},{"n":"IoTと組込みシステム","p":["IoTはさまざまなモノがネットワークにつながり、センサで収集したデータを分析・活用する仕組みである。","CASEは自動車の変革を示すConnected・Autonomous・Shared & Services・Electricの頭文字である。","MaaSは複数の交通手段を一つのサービスとして統合し、検索・予約・決済を一括で行えるようにする考え方である。","デジタルツインは現実の設備や環境をサイバー空間に再現し、シミュレーションや故障予測などに活用する。","組込みシステムは家電や自動車などの機器に組み込まれ、特定の機能を実現するシステムで、ファームウェアで制御する。"],"s":[0]}]},{"u":"AIと生成AI","items":[{"n":"AIと機械学習の種類","p":["ルールベースのAIは人が定めたルールで推論し、機械学習はデータから規則性やパターンを自動で学習する。","教師あり学習は正解ラベル付きのデータで学習し、売上予測・離反予測などの予測や分類に使う。","教師なし学習は正解のないデータから構造を見つけ、顧客セグメンテーションなどのグルーピングに使う。","強化学習は試行錯誤を通じて報酬が最大になる行動を学習し、自動運転や建築物の揺れの制御などに使う。","特徴量はデータの特徴を数値で表したもので、ディープラーニングでは特徴量をデータから自動的に抽出できる。"],"s":[0]},{"n":"ニューラルネットワーク","p":["ニューラルネットワークは脳の神経回路をモデル化したもので、入力層・中間層（隠れ層）・出力層からなる。","ディープラーニング（深層学習）は、中間層を多層にしたニューラルネットワークによる機械学習である。","バックプロパゲーション（誤差逆伝播法）は、出力と正解の誤差を出力層から入力層へ逆向きに伝えて重みを調整する。","活性化関数は、各ニューロンが受け取った入力の総和から出力値を決める関数である。"],"s":[0]},{"n":"学習手法と代表的なモデル","p":["過学習は訓練データに過度に適合し、未知のデータに対する予測精度が下がる状態である。","事前学習は大量のデータで汎用的なモデルを作ること、ファインチューニングはそれを特定用途のデータで追加学習すること。","転移学習はあるタスクで学習済みのモデルを別のタスクに応用し、少ないデータでも学習できるようにする手法である。","CNN（畳み込みニューラルネットワーク）は画像認識、RNN（リカレントニューラルネットワーク）は文章など時系列データに向く。","GAN（敵対的生成ネットワーク）は、生成器と識別器を競わせて本物らしい画像などを生成する。"],"s":[0]},{"n":"生成AIと大規模言語モデル","p":["生成AIは学習したデータを基に、文章・画像・音声・プログラムなどの新しいコンテンツを生成するAIである。","大規模言語モデル（LLM）は膨大なテキストで事前学習し、入力に続く語を確率的に予測して文章を生成する。","生成AIの出力にはランダム性があり、同じ指示を入力しても毎回同じ結果になるとは限らない。","プロンプトエンジニアリングは、目的・条件・出力形式などを明示して、望む出力を得られるよう指示文を工夫する技術である。","マルチモーダルAIは文章・画像・音声など複数の種類のデータを組み合わせて扱えるAIである。"],"s":[0,4]},{"n":"AIの活用領域と活用例","p":["AIは研究開発・製造・物流・販売・金融・ヘルスケア・公共など幅広い領域で使われ、判断支援や活動代替などが目的となる。","特化型AIは画像認識など特定の課題に特化したAI、汎用AIは人間のように多様な課題に対応できるAIを指す。","生成AIの活用例には、文章の添削・要約、アイデアの提案、プログラミング支援、画像生成などがある。","AIサービスが提供するAPIを自社のシステムから呼び出し、AIの機能を組み込んで活用できる。","AIOpsはIT運用へのAI活用、MLOpsは機械学習モデルの開発から運用・改善までを継続的に回す仕組みである。"],"s":[0]},{"n":"AI利活用の原則と指針","p":["人間中心のAI社会原則は政府が2019年に策定し、人間中心の原則や公平性・説明責任・透明性の原則などを示す。","AI利活用ガイドラインはAIの利用者が留意すべき事項をAI利活用原則として整理したものである。","信頼できるAIのための倫理ガイドライン（Ethics guidelines for trustworthy AI）は欧州で策定された指針である。","2027年度の新シラバス案では、AI事業者ガイドライン、AIエージェント、RAG（検索拡張生成）も用語例に挙がる。","新シラバス案には、人工知能関連技術の研究開発及び活用の推進に関する法律（AI基本法）も挙がっている。"],"s":[0,7]},{"n":"AI利用上の留意点","p":["ハルシネーションはAIが事実と異なる内容をもっともらしく生成する現象で、出力の事実確認が欠かせない。","AIの出力には、誤った情報・偏った情報・古い情報・悪意ある情報・学習元が不明な情報が含まれる可能性がある。","説明可能なAI（XAI）は判断の根拠を人が理解できる形で示すAI、ヒューマンインザループは判断過程に人間が関与する仕組み。","学習データの偏りによるアルゴリズムのバイアスや、利用者の関与によるバイアスで、出力が不公平になることがある。","ディープフェイクはAIで本物そっくりの偽の画像・動画・音声を作る技術で、偽情報の拡散や詐欺に悪用される。"],"s":[0]}]},{"u":"システム戦略と企画","items":[{"n":"情報システム戦略とEA","p":["情報システム戦略は経営戦略に基づいて策定し、全体最適の観点から情報システムの目標や計画を定める。","EA（エンタープライズアーキテクチャ）は業務とシステムを体系的に整理して、組織全体の最適化を図る手法である。","SoRは取引などの記録を目的とする基幹系システム、SoEは顧客や利用者とのつながりを重視するシステムである。","エンタープライズサーチは、企業内に分散した文書やデータを一括して検索できるようにする仕組みである。"],"s":[0]},{"n":"業務プロセスの可視化と改善","p":["DFDはデータの流れと処理を、プロセス・データフロー・データストア・外部実体の4つの記号で表す。","BPMNは業務プロセスをイベント・アクティビティ・ゲートウェイなどの記号で表す、国際標準の表記法である。","BPRは業務プロセスを根本から見直して再設計すること、BPMは業務プロセスを継続的に分析・改善する管理手法。","RPAはソフトウェアロボットにより、PC上で行う定型的な事務作業を自動化する技術である。","BYODは私物の端末を業務に使うこと、M2Mは機器同士が人を介さずに通信して制御を行うことである。"],"s":[0]},{"n":"クラウドとソリューション形態","p":["SaaSはアプリケーション、PaaSはアプリケーションの実行基盤、IaaSはサーバやストレージなどのインフラを提供する。","パブリッククラウドは不特定多数で共用、プライベートクラウドは自社専用、ハイブリッドクラウドは複数形態を組み合わせる。","オンプレミスは設備を自社で保有・運用する形態。ハウジングは事業者の施設に自社機器を置き、ホスティングは事業者の機器を借りる。","SI（システムインテグレーション）は、システムの企画から設計・開発・運用までを一括して請け負うサービスである。","DaaSはデスクトップ環境をネットワーク経由で提供するサービスである。"],"s":[0]},{"n":"システム活用促進と評価","p":["デジタルリテラシーはデジタル技術やデータを理解し、業務や生活で適切に活用できる能力である。","デジタルディバイドは情報技術を使える人と使えない人の間に生じる、情報や機会の格差である。","ゲーミフィケーションは、ポイントやランキングなどゲームの要素を業務や学習に取り入れて意欲を高める手法である。","導入後も費用対効果や利用者満足度で情報システムを評価し、レガシーシステムは廃棄や刷新を検討する。"],"s":[0]},{"n":"シェアリングと個人データ活用","p":["シェアリングエコノミーは、個人などが持つ遊休資産をインターネットを介して貸し借りする経済の形態である。","情報銀行は本人の同意に基づいて個人データを預かり、本人に代わって第三者に提供する事業である。","PDS（パーソナルデータストア）は、個人が自らの意思で自分のデータを蓄積・管理する仕組みである。","ライフログは、日々の行動や体験をデジタルデータとして記録したものである。"],"s":[0]},{"n":"システム化計画と要件定義","p":["システム化計画では、対象業務の範囲、スケジュール、体制、費用対効果、リスクなどを明確にする。","要件定義では利用者の要求を調査して業務要件をまとめ、関係者の間で合意する。","機能要件はシステムが実現すべき機能、非機能要件は性能・信頼性・セキュリティ・運用性など機能以外の要件である。","要件定義の誤りは後の工程で見つかるほど手戻りが大きくなるため、早い段階での合意形成が重要になる。"],"s":[0]},{"n":"調達の流れ","p":["調達は一般に、RFI（情報提供依頼）→RFP（提案依頼書）の提示→提案書・見積書の受領→評価・選定→契約の順に進む。","RFIはベンダに技術動向や製品情報の提供を求める文書、RFPはシステムの要件や条件を示して具体的な提案を求める文書。","RFPを受け取ったベンダが提出するのが提案書で、RFPと提案書を取り違えるのが典型的な誤りである。","ベンダの選定は、あらかじめ定めた評価基準で提案内容と見積金額を比較して行う。","グリーン調達は、環境への負荷が少ない製品やサービスを優先して調達することである。"],"s":[0]}]},{"u":"開発技術","items":[{"n":"システム開発のプロセス","p":["開発は一般に、要件定義→設計→プログラミング→テスト→導入・受入れ→保守の順に進む。","各工程の成果物はレビューで確認し、共同レビューでは発注者と開発者が一緒に成果物を確認する。","受入れテストは発注者（利用者）が主体となり、システムが要件どおりに動くかを確認する。","保守は稼働後のシステムに対して、不具合の修正や機能の変更、環境の変化への対応を行う工程である。"],"s":[0]},{"n":"テストの種類と技法","p":["ホワイトボックステストはプログラムの内部構造に着目し、命令や分岐を網羅するようにテストケースを作る。","ブラックボックステストは内部構造を見ず、入力と出力の仕様に基づいてテストする。同値分割や限界値分析を使う。","テストは単体テスト→結合（統合）テスト→システムテスト→受入れテストの順に、対象範囲を広げて行う。","回帰テスト（リグレッションテスト）は、プログラムの修正によって他の部分に悪影響が出ていないかを確認する。","性能テストは応答時間や処理能力を、負荷テストは大量のデータやアクセスに耐えられるかを確認する。"],"s":[0]},{"n":"ソフトウェアの見積り","p":["ファンクションポイント法は、外部入出力やファイルなどの機能の数と複雑さから開発規模を見積もる。","類推見積法は、過去の類似プロジェクトの実績を基にして見積もる方法である。","相対見積は、作業同士の大きさを比較して相対的に見積もる方法で、アジャイル開発で使われる。"],"s":[0]},{"n":"ソフトウェア開発モデル","p":["ウォーターフォールモデルは工程を上流から順に進め、原則として前の工程に戻らない。要件が明確な開発に向く。","プロトタイピングモデルは早い段階で試作品を作って利用者に確認してもらい、要求のくい違いを防ぐ。","スパイラルモデルはシステムを分割し、設計・開発・評価のサイクルを繰り返して段階的に完成度を高める。","RADは少人数のチームで開発ツールなどを活用し、短期間でシステムを開発する手法である。","リバースエンジニアリングは、既存のソフトウェアを解析してその仕様や設計を明らかにすることである。"],"s":[0]},{"n":"アジャイルとXP","p":["アジャイルは短い期間で開発とリリースを繰り返し、変化する要求に柔軟に対応する開発手法の総称である。","ユーザーストーリーは、利用者の視点で「誰が・何を・なぜしたいか」を簡潔に記述した要求である。","XPのテスト駆動開発は、プログラムより先にテストを作成し、そのテストに合格するようにコードを書く。","ペアプログラミングは2人1組で、1人がコードを書きもう1人がその場で確認しながら開発する。","リファクタリングは外部から見た動作を変えずにプログラムの内部構造を改善すること。CIは変更を頻繁に統合・自動テストする。"],"s":[0]},{"n":"スクラム","p":["スクラムはアジャイル開発の代表的なフレームワークで、スプリントと呼ぶ1か月以内の短い期間を繰り返す。","スクラムチームはプロダクトオーナー・開発者・スクラムマスターで構成される。","プロダクトオーナーはプロダクトバックログの並び順（優先順位）を決め、プロダクトの価値に責任を持つ。","スクラムマスターはスクラムの理解と実践を支援し、チームの進行を妨げる障害を取り除く役割を担う。","スプリントバックログはスプリントで行う項目と作業計画で、スプリントの最後にふりかえり（レトロスペクティブ）を行う。"],"s":[0]},{"n":"開発手法とプロセスの標準","p":["オブジェクト指向はデータと手続をオブジェクトとしてまとめ（カプセル化）、継承などで再利用性を高める。","UMLはオブジェクト指向設計で使う図の表記法で、ユースケース図・クラス図・シーケンス図などがある。","DevOpsは開発（Development）と運用（Operations）が連携し、ソフトウェアを迅速かつ継続的にリリースする取組みである。","共通フレーム（SLCP）はソフトウェアのライフサイクルにおける作業と用語を標準化し、発注者と受注者の共通認識をつくる。","CMMIは組織の開発プロセスの成熟度を5段階のレベルで評価・改善するためのモデルである。"],"s":[0]}]},{"u":"PM・サービス管理・監査","items":[{"n":"プロジェクトと管理対象","p":["プロジェクトは独自の成果を生み出すための有期的な活動で、明確な開始と終了がある。","プロジェクト憲章はプロジェクトを正式に認可する文書で、目的や概要、プロジェクトマネージャの権限などを記す。","管理対象にはスコープ・スケジュール・コスト・品質・資源・リスク・コミュニケーション・調達・ステークホルダなどがある。","ステークホルダはプロジェクトに影響を与える、または影響を受ける個人や組織で、顧客や経営者、メンバーも含む。"],"s":[0]},{"n":"WBSとスケジュール管理","p":["スコープはプロジェクトで作る成果物と、そのために必要な作業の範囲である。","WBSはプロジェクトの作業を階層的に細かく分解したもので、最下位の管理単位をワークパッケージという。","WBSで作業の漏れを防ぎ、ワークパッケージ単位で見積りや担当の割当てを行う。","ガントチャートは作業を縦軸、時間を横軸にとって予定と実績を帯で表す。進捗は見やすいが作業間の依存関係は表しにくい。"],"s":[0]},{"n":"アローダイアグラムと日程計算","p":["アローダイアグラムは作業を矢印、作業の区切り（結合点）を丸で表し、作業の順序関係と所要日数を示す。","最早結合点時刻は開始点から順に先行作業の日数を足し、合流する結合点では最も大きい値を採って求める。","クリティカルパスは開始から終了までの最も長い経路で、その合計日数がプロジェクト全体の最短所要期間になる。","クリティカルパス上の作業が遅れると全体が遅れる。全体を短縮するにはクリティカルパス上の作業を短縮する。","ダミー作業は点線の矢印で表し、所要日数0で作業の順序関係だけを示す。"],"s":[0]},{"n":"リスク対応の4戦略","p":["プロジェクトのマイナスのリスクへの対応策には、回避・軽減・転嫁・受容の4つがある。","回避はリスクの原因を取り除くなどしてリスクそのものをなくすこと、軽減は発生確率や影響度を下げることである。","転嫁は保険への加入や外部委託などで、リスクの影響を第三者に移すことである。","受容はリスクを受け入れることで、発生時に備えて予備費や予備の日程を確保しておく方法もある。"],"s":[0]},{"n":"ITサービスマネジメントとSLA","p":["ITサービスマネジメントは利用者の要求に合ったITサービスを、効率的かつ安定的に提供・改善するための管理手法である。","ITILはITサービスマネジメントのベストプラクティス（成功事例）を体系的にまとめたフレームワークである。","SLAはサービス提供者と利用者の間でサービスの内容と品質の水準（稼働率や応答時間など）を合意した文書である。","SLOはサービスレベルの目標値、SLIはサービスレベルを測定するための指標である。","サービスレベル管理（SLM）は、合意したサービスレベルを監視・報告し、PDCAで維持・改善する活動である。"],"s":[0]},{"n":"インシデント管理と問題管理","p":["インシデント管理は、サービスの中断などの影響を最小限に抑え、できるだけ早くサービスを復旧させることを目的とする。","問題管理はインシデントの根本原因を突き止めて取り除き、再発を防止することを目的とする。","暫定的な回避策で復旧させるのがインシデント管理、原因の究明と恒久対策を行うのが問題管理で、両者の混同に注意する。","変更管理は変更を評価・承認して安全に実施し、リリース及び展開管理は承認された変更を本番環境に展開する。","構成管理は、ハードウェア・ソフトウェア・文書などの構成品目の情報を正確に記録・維持する。"],"s":[0]},{"n":"サービスデスクとファシリティ","p":["サービスデスクは利用者からの問合せや障害の連絡を一元的に受け付ける単一窓口（SPOC）である。","サービスデスクで解決できない問合せは、専門部署や上位者へエスカレーションして対応を引き継ぐ。","FAQやチャットボット、AIを活用した運用で、問合せ対応の効率化や利用者の自己解決を図る。","ファシリティマネジメントは、建物や電源・空調などの設備を最適な状態で保有・運用・維持する活動である。","UPSは停電時に一時的に電力を供給して安全な停止を可能にし、サージ防護は落雷などの過電圧から機器を守る。"],"s":[0]},{"n":"システム監査","p":["システム監査は、独立した立場のシステム監査人が情報システムを点検・評価し、助言や勧告を行う活動である。","システム監査人は監査対象から独立していなければならず、自分が担当した業務やシステムは監査できない。","監査は監査計画の策定→予備調査→本調査→評価・結論→監査報告→フォローアップの流れで行う。","監査人は監査証拠を入手・評価して結論を導き、その過程を監査調書に記録して保管する。","改善を実施するのは被監査部門で、監査人は改善提案の実施状況をフォローアップで確認する。"],"s":[0]},{"n":"内部統制とITガバナンス","p":["内部統制は業務を適正かつ効率的に行うために組織内に整備・運用する仕組みで、整備・運用の責任は経営者にある。","内部統制の実現には、業務プロセスの明確化、職務分掌、実施ルールの設定、チェック体制の確立が必要である。","職務分掌は担当者の権限と職責を分けて不正や誤りを防ぐこと。例として発注担当と承認担当を別の人にする。","内部統制の基本的要素は、統制環境・リスクの評価と対応・統制活動・情報と伝達・モニタリング・ITへの対応の6つである。","ITガバナンスは経営陣がIT活用の方針を示し、IT戦略の策定と実行を指導・統制する仕組みで、JIS Q 38500が規格である。"],"s":[0]}]},{"u":"基礎理論とアルゴリズム","items":[{"n":"2進数と基数変換","p":["10進数を2進数にするには、2で割った余りを順に記録し、最後の商から余りを逆順に読み上げる。","2進数を10進数にするには、各桁に桁の重み（2の累乗）を掛けて合計する。例：1011は8＋2＋1＝11。","小数部は2を掛けて整数部を取り出す操作を繰り返して変換する。0.5は0.1、0.25は0.01、0.75は0.11（2進数）。","16進数は2進数の4桁ごと、8進数は3桁ごとにまとめて変換できる。例：2進数1111 1010は16進数FA。","2進数を左に1ビットシフトすると値は2倍、右に1ビットシフトすると2分の1になる。"],"s":[0]},{"n":"ビット数と表現範囲","p":["nビットで表せる値は2のn乗通りで、8ビットなら256通りである。","符号なし8ビット整数は0〜255、2の補数表現の8ビット整数は−128〜127を表せる。","2の補数は全ビットを反転（0と1を入れ替え）して1を加えて求め、負の数を表すのに使う。","計算手順：100種類を区別するのに必要なビット数は、2のn乗が100以上となる最小のnで7ビット（128通り）。"],"s":[0]},{"n":"集合と論理演算","p":["AND（論理積）は両方が1のとき1、OR（論理和）は少なくとも一方が1なら1、NOT（否定）は値を反転する。","XOR（排他的論理和）は2つの入力が異なるとき1、同じとき0になる。","真理値表は入力の全組合せに対する出力の一覧、ベン図は集合の関係を円の重なりで表す図である。","ド・モルガンの法則により、NOT（A AND B）＝（NOT A）OR（NOT B）、NOT（A OR B）＝（NOT A）AND（NOT B）が成り立つ。","解き方：論理式は括弧の中から計算し、入力の組合せごとに真理値表を作って選択肢と照合する。"],"s":[0]},{"n":"順列・組合せと確率","p":["n個からr個を選んで並べる順列はnPr＝n!÷（n−r）!、並び順を区別しない組合せはnCr＝n!÷{r!×（n−r）!}。","例：5人から2人を選ぶ組合せは5×4÷2＝10通り、選んだ2人に順番をつけると5×4＝20通りになる。","確率は「求める事象の場合の数÷起こりうるすべての場合の数」で求める。","独立した事象が続けて起こる確率は各確率の積。「少なくとも1回」は1から「1回も起こらない確率」を引いて求める。"],"s":[0]},{"n":"代表値と散らばり","p":["平均値は合計÷個数、中央値は大きさ順に並べたときの中央の値（偶数個なら中央2つの平均）、最頻値は最も多く現れる値。","中央値は極端な外れ値の影響を受けにくく、所得のように偏りのある分布の代表値に適している。","分散は各データと平均との差（偏差）を2乗した値の平均で、標準偏差は分散の正の平方根である。","偏差値＝50＋10×（得点−平均点）÷標準偏差。平均点と同じ得点なら偏差値は50になる。","正規分布では、平均±1標準偏差の範囲にデータの約68％が含まれる。"],"s":[0]},{"n":"相関・回帰と尺度","p":["相関係数は−1から1の値をとり、1に近いほど強い正の相関、−1に近いほど強い負の相関、0に近いほど相関が弱い。","回帰分析は、説明変数から目的変数を予測する式（回帰式）を求める手法である。","尺度には名義尺度（性別など）・順序尺度（順位など）・間隔尺度（温度など）・比例尺度（重さなど）がある。","仮説検定は帰無仮説を立て、データから得た確率が有意水準を下回るかで帰無仮説を棄却するかを判断する。"],"s":[0]},{"n":"情報量とデジタル化","p":["1バイトは8ビット。接頭語はk＝10の3乗、M＝6乗、G＝9乗、T＝12乗、P＝15乗、m・μ・n・pは−3・−6・−9・−12乗。","アナログ信号は標本化（一定間隔で値を取り出す）→量子化（段階的な値に近似）→符号化（2進数で表す）の順でデジタル化する。","音声のデータ量＝サンプリング周波数×量子化ビット数×秒数（×チャンネル数）÷8でバイト数を求める。","画像のデータ量＝画素数×1画素あたりのビット数で求める。フルカラーはRGB各8ビットの24ビットである。","文字コードにはJISコード、シフトJISコード、世界の文字を統一的に扱うUnicodeなどがある。"],"s":[0]},{"n":"データ構造","p":["配列は同じ型のデータを並べたもので、添字（番号）を指定して任意の要素を直接参照できる。","リストはポインタで次の要素をつなぐ構造で、要素の挿入・削除はポインタの付け替えだけで済む。","スタックは後入れ先出し（LIFO）でプッシュとポップで操作し、キューは先入れ先出し（FIFO）である。","木構造は階層関係を表すデータ構造で、各節点が最大2つの子をもつものを2分木という。"],"s":[0]},{"n":"探索と整列のアルゴリズム","p":["線形探索は先頭から順に探す方法で、データがn個なら最大n回の比較が必要になる。","2分探索は整列済みのデータで中央の値と比較して探索範囲を半分ずつに絞る方法で、整列されていないと使えない。","バブルソートは隣り合う要素を比較・交換し、選択ソートは未整列部分の最小（最大）値を選んで先頭と交換する。","クイックソートは基準値より小さい群と大きい群に分ける操作を繰り返す高速な整列法。マージは整列済みの列を1つに併合する。"],"s":[0]},{"n":"疑似言語とプログラム言語","p":["アルゴリズムの基本構造は順次・選択（分岐）・繰返しの3つで、流れ図や疑似言語で表現する。","疑似言語の問題は、変数の値の変化を表（トレース表）に書き出しながら1行ずつ処理を追うと解きやすい。","関数は引数を受け取って処理を行い、結果を戻り値として返す。","Pythonは機械学習やデータ分析、JavaScriptはWebブラウザ上の動的な処理、Rは統計解析によく使われる。","HTMLはタグでWebページの構造を記述するマークアップ言語、XMLは利用者が独自のタグを定義できるマークアップ言語。"],"s":[0]}]},{"u":"コンピュータシステム","items":[{"n":"CPUと処理性能","p":["CPUは制御装置と演算装置からなり、主記憶から命令を読み出し、解読して実行する。","クロック周波数が高いほど1秒間に実行できる命令数が増える。例：1GHzで1命令平均4クロックなら毎秒2.5億命令。","マルチコアプロセッサは1つのCPUに複数のコア（処理装置）を持ち、並行して処理することで性能を高める。","GPUは画像処理向けの大量の並列演算に優れ、GPGPUとしてAIの学習などにも利用される。"],"s":[0,7]},{"n":"メモリと記憶階層","p":["RAMは読み書きでき電源を切ると内容が消える揮発性メモリ、ROMは電源を切っても内容が残る不揮発性メモリである。","DRAMはリフレッシュが必要だが安価で大容量なため主記憶に、SRAMは高速だが高価なためキャッシュメモリに使う。","キャッシュメモリはCPUと主記憶の速度差を埋める高速なメモリで、1次・2次などの階層をもつ。","記憶装置はレジスタ→キャッシュ→主記憶→補助記憶の順に低速・大容量になり、容量あたりの価格は安くなる。","フラッシュメモリは電気的に書き換えられる不揮発性メモリで、SSD・USBメモリ・SDカードに使われる。"],"s":[0,7]},{"n":"補助記憶と入出力インタフェース","p":["HDDは磁気ディスクを回転させて読み書きし、SSDはフラッシュメモリを使うため高速で衝撃に強い。","USBは周辺機器を接続するシリアルインタフェースで、ハブで複数の機器をつなげ、ケーブル経由で給電もできる。","HDMIは映像と音声をデジタル信号で1本のケーブルで伝送するインタフェースである。","Bluetoothは近距離の無線通信規格、NFCは機器をかざす程度のごく近い距離で通信し、電子マネー決済などに使う。","デバイスドライバは周辺機器をOSから制御するためのソフトウェアで、プラグアンドプレイは接続すると自動で設定する機能。"],"s":[0,7]},{"n":"システムの構成と処理形態","p":["クライアントサーバシステムは、サービスを要求するクライアントと提供するサーバに役割を分けた構成である。","デュアルシステムは2系統で同じ処理を行い結果を照合する方式、デュプレックスシステムは待機系を用意し障害時に切り替える。","シンクライアントは端末に最小限の機能だけを持たせ、アプリケーションの実行やデータの管理をサーバ側で行う。","仮想化は1台の物理サーバ上で複数の仮想サーバを動かす技術で、ホスト型・ハイパーバイザー型・コンテナ型がある。","スケールアップはサーバの性能を高めて、スケールアウトはサーバの台数を増やして処理能力を向上させる。"],"s":[0,7]},{"n":"RAIDと高信頼化設計","p":["RAID0（ストライピング）はデータを複数のディスクに分散して書き込み高速化するが、冗長性はない。","RAID1（ミラーリング）は同じデータを2台のディスクに書き込み、1台が故障してもデータを保てる。","RAID5はデータと誤り訂正用のパリティを複数のディスクに分散して記録し、1台の故障ならデータを復元できる。","フェールセーフは障害時に安全側に動作させ、フェールソフトは機能を縮小して稼働を続け、フォールトトレラントは正常稼働を続ける。","フールプルーフは、利用者が誤った操作をしても危険が生じない、または誤操作ができないようにする設計である。"],"s":[0,7]},{"n":"稼働率の計算","p":["稼働率＝MTBF÷（MTBF＋MTTR）。MTBFは平均故障間隔、MTTRは平均修復時間である。","直列システムの稼働率は各装置の稼働率の積で、装置が増えるほど低下する。例：0.9×0.9＝0.81。","並列システムの稼働率は1−（1−A）×（1−B）で、どちらかが動けばよい。例：1−0.1×0.1＝0.99。","直列と並列の組合せは、並列部分を先に1つの装置の稼働率に置き換えてから、直列として掛け合わせる。","MTBFを長く（故障しにくく）し、MTTRを短く（すぐ直せるように）するほど稼働率は高くなる。"],"s":[0,7]},{"n":"性能と信頼性の評価指標","p":["レスポンスタイムは処理要求を出してから最初の応答が返るまでの時間、スループットは単位時間あたりの処理量である。","ターンアラウンドタイムは、処理を依頼してから結果をすべて受け取るまでの時間である。","RASISは信頼性・可用性・保守性・完全性・安全性（機密性）の5つの評価項目の頭文字を取ったものである。","TCO（総所有コスト）は導入費用だけでなく、運用・保守・教育などの費用まで含めた総コストである。"],"s":[0,7]},{"n":"OSとファイル管理","p":["OSはハードウェアや資源を管理し、アプリケーションに共通の機能を提供する基本ソフトウェアである。","仮想記憶は補助記憶の一部を主記憶のように使い、実際の主記憶容量より大きなプログラムを実行できるようにする。","絶対パスはルートディレクトリから目的のファイルまでの経路、相対パスはカレントディレクトリを起点とした経路である。","相対パスで「..」は1つ上の親ディレクトリ、「.」はカレントディレクトリを表す。","差分バックアップは前回のフルバックアップ以降、増分バックアップは前回のバックアップ以降に変更されたデータを保存する。"],"s":[0,7]},{"n":"表計算ソフトとOSS","p":["表計算ソフトの相対参照はコピー先に応じてセル番地がずれ、絶対参照（$A$1）はコピーしても番地が固定される。","複合参照（$A1やA$1）は、列または行の一方だけを固定する参照方法である。","OSSはソースコードが公開され、利用・改変・再配布が認められたソフトウェアで、LinuxやApacheなどがある。","OSSでも著作権は放棄されておらず、ライセンス条件を守る必要がある。GPLでは改変物を配布する際にソースの公開が必要。","OSSは一般に無保証で提供されるため、商用サポートを提供する事業者を利用することもある。"],"s":[0,7]}]},{"u":"情報デザイン・メディア・DB","items":[{"n":"UIとユーザビリティ","p":["UIは利用者とシステムの接点、UXは製品やサービスを通じて利用者が得る体験全体を指す。","ユーザビリティは、特定の利用者が特定の目的を有効に、効率よく、満足して達成できる度合い（使いやすさ）である。","ラジオボタンは複数の選択肢から1つだけを選ぶとき、チェックボックスは複数を選べるときに使う。","ピクトグラムは情報や注意を文字ではなく単純な図記号で伝えるもので、言語に依存せずに意味を伝えられる。"],"s":[0,7]},{"n":"ユニバーサルデザインと情報デザイン","p":["ユニバーサルデザインは、年齢・能力・国籍などにかかわらず、誰もが利用しやすいように最初から設計する考え方である。","アクセシビリティは、高齢者や障害者を含む多様な人が情報やサービスを利用できる度合いである。","デザインの基本原則には、近接・整列・反復・対比がある。","インフォグラフィックは、情報やデータを図・グラフ・イラストなどを用いて視覚的にわかりやすく表現したものである。"],"s":[0,7]},{"n":"マルチメディアのファイル形式","p":["JPEGは写真向けの非可逆圧縮形式、GIFは256色までの可逆圧縮でアニメーションも可能、PNGはフルカラーの可逆圧縮形式である。","MP3は非可逆圧縮の音声形式、WAVは主に非圧縮の音声形式、MIDIは音そのものではなく演奏情報を記録する形式である。","MPEGは動画の圧縮規格で、H.265は高圧縮で4K・8K映像の配信などに使われる。","可逆圧縮は完全に元のデータに戻せる圧縮、非可逆圧縮は元に戻せないが圧縮率を高くできる圧縮である。ZIPは可逆圧縮。"],"s":[0,7]},{"n":"色・画像表現とXR","p":["RGBは光の三原色で、重ねるほど明るくなり白に近づく（加法混色）。ディスプレイの表示に使う。","CMYは色の三原色で、重ねるほど暗くなる（減法混色）。印刷では黒（K）を加えたCMYKを使う。","ラスターデータは画素の集まりで表し拡大するとぼやけ、ベクターデータは座標と数式で表すため拡大しても劣化しない。","VRは仮想空間への没入、ARは現実の映像にデジタル情報を重ねる技術、MRは現実と仮想を融合させて相互に作用させる技術。"],"s":[0,7]},{"n":"関係データベースとキー","p":["関係データベースはデータを行（レコード）と列（項目）からなる表で管理し、DBMSが整合性を保つ。","主キーは表の中で行を一意に識別する列で、値の重複も空値（NULL）も許されない。","外部キーは他の表の主キーを参照する列で、参照先に存在しない値は登録できない（参照制約）。","E-R図はエンティティ（実体）とリレーションシップ（関連）、その多重度（1対多など）でデータの構造を表す。"],"s":[0,7]},{"n":"正規化","p":["正規化は表を分割してデータの重複をなくし、更新時の矛盾（更新異常）を防ぐための手順である。","第1正規形は繰り返し項目を排除した表、第2正規形は主キーの一部だけに従属する項目を別表に分けた表である。","第3正規形は、主キー以外の項目に従属する項目（推移的関数従属）を別表に分けた表である。","正規化で表が増えると結合処理が必要になるため、性能を優先して意図的に正規化を崩す場合もある。"],"s":[0,7]},{"n":"関係演算とSQL","p":["選択は条件に合う行を取り出す演算、射影は特定の列を取り出す演算、結合は共通の列で複数の表をつなぐ演算である。","選択（行）と射影（列）を取り違えるのが典型的な誤りである。","SQLでは「SELECT 列名 FROM 表名 WHERE 条件」の形でデータを検索し、ORDER BYで並べ替える。","GROUP BYで指定した列ごとにグループ化し、SUM・AVG・COUNTなどの集計関数で集計する。"],"s":[0,7]},{"n":"トランザクションと障害回復","p":["トランザクションは一連の処理のまとまりで、すべて成功してコミットするか、すべて取り消すかのどちらかになる。","排他制御は複数の利用者が同時に同じデータを更新しても矛盾が起きないよう、ロックをかけて制御する仕組みである。","デッドロックは複数のトランザクションが互いに相手のロック解除を待ち、処理が進まなくなる状態である。","ロールバックは更新前の状態に戻して処理を取り消すこと、ロールフォワードはバックアップと更新後ログで障害直前まで復旧すること。"],"s":[0,7]}]},{"u":"ネットワークとセキュリティ","items":[{"n":"LANとネットワーク機器","p":["LANは建物内など限られた範囲のネットワーク、WANは離れた拠点同士を通信事業者の回線で結ぶネットワークである。","無線LANのアクセスポイントはSSIDという識別名で区別し、通信の暗号化にはWPA2やWPA3を使う。","スイッチングハブはMACアドレスに基づいて宛先の機器にだけデータを送り、ルータはIPアドレスに基づいて経路を選択する。","プロキシサーバは内部の端末に代わってWebサーバにアクセスする中継サーバで、アクセス制御やキャッシュに使う。"],"s":[7]},{"n":"IPアドレスとNAT","p":["IPv4アドレスは32ビット、IPv6アドレスは128ビットで、IPv6はアドレス枯渇の対策として普及が進む。","グローバルIPアドレスはインターネット上で一意のアドレス、プライベートIPアドレスは組織内でのみ使うアドレスである。","NATはプライベートIPアドレスとグローバルIPアドレスを相互に変換し、内部の端末がインターネットにアクセスできるようにする。","サブネットマスクは、IPアドレスのうちネットワーク部とホスト部の境界を示すビット列である。"],"s":[7]},{"n":"TCP/IPと主要プロトコル","p":["TCPは確認応答や再送で信頼性の高い通信を行い、UDPは確認を省いて高速に送るため音声や動画の配信に向く。","ポート番号は通信相手のアプリケーションを識別する番号で、例えばHTTPは80番、HTTPSは443番を使う。","DNSはドメイン名とIPアドレスを対応付け、DHCPは接続した端末にIPアドレスなどを自動で割り当てる。","メールの送信と転送はSMTP、受信はPOP3（端末にダウンロード）やIMAP（サーバ上で管理）を使う。","MIMEは電子メールで日本語や画像などの添付ファイルを扱うための規格、HTTPSはHTTPの通信をTLSで暗号化する。"],"s":[7]},{"n":"モバイル・IoT通信","p":["5Gは高速大容量・超低遅延・多数同時接続を特徴とする移動通信システムで、ローカル5Gは企業や自治体が自営で構築する。","LPWAは消費電力が小さく数km以上の広い範囲で通信できる方式で、通信速度は低いがIoTのセンサ通信に向く。","テザリングはスマートフォンを中継機にしてPCなどをインターネットに接続する機能である。","eSIMは端末に内蔵され、物理的なSIMカードを差し替えずに通信事業者の契約情報を書き込める。"],"s":[7]},{"n":"情報セキュリティの要素","p":["情報セキュリティの3要素は機密性（許可された者だけが利用）・完全性（正確で改ざんがない）・可用性（必要なときに使える）。","例：Webサイトの改ざんは完全性、DDoS攻撃によるサービス停止は可用性、情報漏えいは機密性が損なわれた状態である。","ゼロトラストは社内外を問わずすべての通信を信頼せず、アクセスのたびに検証するという考え方である。","不正のトライアングルでは、機会・動機・正当化の3つがそろうと内部不正が起きやすいとされる。"],"s":[7]},{"n":"マルウェアと人を狙う攻撃","p":["ランサムウェアはデータを暗号化するなどして使えなくし、復旧と引き換えに金銭を要求するマルウェアである。","ボットは攻撃者のC&Cサーバから遠隔操作され、トロイの木馬は有用なソフトを装って侵入する。スパイウェアは情報を盗む。","ソーシャルエンジニアリングは、なりすましの電話やのぞき見など、人の心理や隙を突いて情報を盗む手口である。","標的型攻撃は特定の組織を狙って業務を装ったメールでマルウェアに感染させ、BECは取引先などを装って送金させる詐欺である。"],"s":[7]},{"n":"代表的なサイバー攻撃","p":["パスワードリスト攻撃は他サイトから流出したIDとパスワードの組で不正ログインを試み、使い回しが被害を広げる。","SQLインジェクションは入力欄に不正なSQL文を入れてデータベースを不正操作し、XSSは悪意のスクリプトを閲覧者のブラウザで実行させる。","DDoS攻撃は多数の機器から大量の通信を送りつけてサービスを停止させ、ゼロデイ攻撃は修正プログラム公開前の脆弱性を突く。","中間者攻撃は通信の間に割り込んで盗聴・改ざんし、ドライブバイダウンロードはWebサイトの閲覧だけでマルウェアに感染させる。","プロンプトインジェクションは、生成AIに悪意ある指示を入力して開発者の意図しない出力や動作をさせる攻撃である。"],"s":[7]},{"n":"リスクマネジメントとISMS","p":["リスクアセスメントは、リスクの特定→リスク分析→リスク評価の順に行う。","リスク対応には、リスク回避・リスク低減・リスク共有（移転）・リスク保有がある。保険の加入はリスク共有（移転）の例。","ISMSは情報セキュリティを組織的に管理する仕組みで、JIS Q 27001を基準にPDCAサイクルで継続的に改善する。","情報セキュリティポリシーは、基本方針・対策基準・実施手順の3階層で構成されることが多い。"],"s":[7]},{"n":"セキュリティの組織と制度","p":["CSIRTはセキュリティインシデント発生時に対応する組織、SOCはネットワークや機器を監視して攻撃を検知・分析する組織である。","SECURITY ACTIONは、中小企業が情報セキュリティ対策に取り組むことを自ら宣言する制度である。","ISMAPは政府が利用するクラウドサービスのセキュリティを評価・登録する制度である。","PCI DSSはクレジットカード会員情報を保護するためのセキュリティ基準で、カード情報を扱う事業者が対象となる。"],"s":[7]},{"n":"暗号技術とデジタル署名","p":["共通鍵暗号方式は暗号化と復号に同じ鍵を使い高速だが、鍵の受け渡しが課題で、n人では n(n−1)/2 個の鍵が必要。","公開鍵暗号方式では、送信者が受信者の公開鍵で暗号化し、受信者は自分の秘密鍵で復号する。代表例はRSA。","デジタル署名は送信者が自分の秘密鍵で署名し、受信者が送信者の公開鍵で検証することで、なりすましと改ざんを検知する。","ハッシュ関数は任意のデータから固定長の値を生成し、元に戻せない性質をもつため改ざんの検知に使う。","PKIでは認証局（CA）がデジタル証明書を発行して公開鍵の持ち主を証明し、失効した証明書はCRLで公開する。"],"s":[7]},{"n":"利用者認証と生体認証","p":["認証の3要素は知識（パスワード）・所持（ICカードやスマートフォン）・生体（指紋や顔）である。","多要素認証は異なる要素を組み合わせる認証で、パスワードと秘密の質問のように同じ知識要素を2つ使っても多要素ではない。","シングルサインオンは一度の認証で複数のシステムを利用できる仕組み、ワンタイムパスワードは一度しか使えないパスワード。","生体認証ではFRR（本人拒否率）とFAR（他人受入率）がトレードオフの関係にあり、一方を下げると他方が上がりやすい。","パスキーは端末に保存した鍵と生体認証などを組み合わせる認証方式で、パスワードを使わずにログインできる。"],"s":[7]},{"n":"技術的なセキュリティ対策","p":["ファイアウォールは通信を許可・遮断して内部ネットワークを守り、WAFはSQLインジェクションなどWebアプリへの攻撃を防ぐ。","IDSは不正な通信を検知して管理者に通知し、IPSは検知に加えて通信を遮断して防御する。","DMZは外部と内部の間に設ける区域で、Webサーバなど外部に公開するサーバを置く。","EDRは端末の挙動を監視して不審な動きを検知し、感染後の調査や封じ込めを支援する。","イミュータブルバックアップは書き換えや削除ができないバックアップで、ランサムウェアによる暗号化への対策となる。"],"s":[7]}]}]},{"id":"fe","name":"基本情報技術者","full":"情報処理技術者試験 基本情報技術者試験（FE）","group":"資格試験","desc":"IT人材の基礎知識とアルゴリズム・セキュリティの技能を問う国家試験","asOf":"シラバスVer.9.2（2026年1月）・試験要綱Ver.5.6（2026年7月）に基づく（2026年11月時点）","aliases":["基本情報","FE","基本情報技術者試験","FE試験","第二種情報処理技術者試験（旧称）"],"sources":[{"t":"IPA 試験要綱・シラバスなど（概要）","u":"https://www.ipa.go.jp/shiken/syllabus/gaiyou.html"},{"t":"IPA 情報処理技術者試験・情報処理安全確保支援士試験 試験要綱 Ver.5.6","u":"https://www.ipa.go.jp/shiken/syllabus/rcu1hd00000141gq-att/youkou_ver5_6.pdf"},{"t":"IPA 基本情報技術者試験（レベル2）シラバス Ver.9.2","u":"https://www.ipa.go.jp/shiken/syllabus/omgdg50000005kpe-att/syllabus_fe_ver9_2.pdf"},{"t":"IPA 基本情報技術者試験 科目Bサンプル問題","u":"https://www.ipa.go.jp/shiken/syllabus/ps6vr7000000oett-att/fe_kamoku_b_sample.pdf"},{"t":"IPA 基本情報技術者試験 科目B サンプル問題（20問セット）","u":"https://www.ipa.go.jp/shiken/syllabus/henkou/2022/gmcbt80000007cfs-att/fe_kamoku_b_set_sample_qs.pdf"},{"t":"IPA 基本情報技術者試験 令和8年度 公開問題 科目B","u":"https://www.ipa.go.jp/shiken/mondai-kaiotu/sg_fe/koukai/rcu1hd0000012qj6-att/2026r08_fe_kamoku_b_qs.pdf"},{"t":"IPA 基本情報技術者試験 令和7年度 公開問題 科目B","u":"https://www.ipa.go.jp/shiken/mondai-kaiotu/sg_fe/koukai/tbl5kb0000005r9r-att/2025r07_fe_kamoku_b_qs.pdf"},{"t":"IPA 基本情報技術者試験・情報セキュリティマネジメント試験の通年化と出題構成の変更","u":"https://www.ipa.go.jp/shiken/syllabus/henkou/2022/20220425.html"},{"t":"IPA 試験スケジュール・受験手数料","u":"https://www.ipa.go.jp/shiken/mousikomi/schedule.html"},{"t":"IPA CBT方式の受験申込み（情報セキュリティマネジメント試験・基本情報技術者試験）","u":"https://www.ipa.go.jp/shiken/mousikomi/cbt_sg_fe.html"},{"t":"IPA 試験要綱・シラバスの改訂（シラバスVer.9.0、2023年12月公表）","u":"https://www.ipa.go.jp/shiken/syllabus/henkou/2023/20231225.html"},{"t":"IPA 基本情報技術者試験 科目A試験免除制度の概要","u":"https://www.IPA.go.jp/shiken/about/gmcbt800000077l9-att/summary_fe_menjo.pdf"},{"t":"IPA 新試験制度のシラバス案（概要）","u":"https://www.ipa.go.jp/shiken/syllabus/henkou/2026/20260630.html"},{"t":"IPA 基本情報技術者試験 シラバス（案）Ver.0.1","u":"https://www.ipa.go.jp/shiken/syllabus/minaoshi/rqr7mi00000068ss-att/syllabus_fe_ver0_1.pdf"},{"t":"IPA プレスリリース 情報処理技術者試験等の見直し（2026年3月31日）","u":"https://www.ipa.go.jp/pressrelease/2025/press20260331.html"}],"units":[{"u":"試験制度と出題形式","items":[{"n":"試験形式と合格基準","p":["CBT方式で通年随時実施。科目Aは90分・60問の四肢択一、科目Bは100分・20問の多肢選択式である","科目A60問のうち評価対象は56問、科目B20問のうち19問。残りは今後の出題に向けた評価用の問題である","採点はIRT（項目応答理論）による。科目A・Bとも1,000点満点で、両方が600点以上なら合格となる","同日に科目A、科目Bの順に受験し、CBTでは科目A終了後に最長10分の休憩を取れる。受験手数料は7,500円（税込）","2023年4月の通年化で午前・午後試験が科目A・Bとなり、時間短縮、選択問題の廃止、擬似言語への一本化が行われた"],"s":[1,7,8,9]},{"n":"科目Bの出題範囲と配分","p":["科目B20問は、アルゴリズムとプログラミング分野16問（8割）と情報セキュリティ分野4問（2割）で構成される","プログラミング分野は「プログラムの基本要素」「データ構造及びアルゴリズム」「プログラミングの諸分野への適用」の3カテゴリ","諸分野への適用では数理・データサイエンス・AIなどを題材にしたプログラム（疎行列、文字の出現割合等）が出る","セキュリティ分野はセキュリティ要求、マルウェア対策、バックアップ、ログの取得と監視、脆弱性管理、利用者アクセス管理が対象","セキュリティの問題は事例文を読み、委託先・クラウド事業者の責任分界や職務分離の妥当性を判断させる形式が多い"],"s":[1,3,4]},{"n":"受験手続と科目A免除制度","p":["試験日時と会場は申込み時に自分で選ぶ。申込みはIPAの委託先（シー・ビー・ティ・ソリューションズ）のサイトで行う","合格発表は受験月の翌月（例：2026年9月受験分は10月21日）の正午で、受験者マイページでも合否を確認できる","IPA認定講座を修了し修了試験に合格すると、修了認定日から1年間、科目Aが免除され科目Bだけを受験する","身体の不自由などでCBTで受験できない人には、証明書類を付けて申し込む筆記の特別措置試験がある"],"s":[9,11]},{"n":"シラバス改訂と2027年度新制度","p":["現行はシラバスVer.9.2（2026年1月掲載。下請法を削除し中小受託取引適正化法を追加）と試験要綱Ver.5.6である","シラバスVer.9.0（CBTは2024年10月試験から適用）で、生成AIを含むAI利活用、デザイン、データ利活用の知識が加わった","2027年度春頃に新制度の基本情報技術者試験へ移行し、通年実施は継続する予定。シラバス案Ver.0.1は2026年9月に公表","新案の科目Aは7大分類に再編され、「システムの開発・運用」（アルゴリズム・プログラミング等を含む）が重点分野となる","CBT試験はシステムリプレースのため2026年12月28日から休止し、2027年1月下旬に再開する予定である"],"s":[0,9,10,12,13,14]}]},{"u":"基礎理論","items":[{"n":"基数変換","p":["10進整数を2進にするには2で割り続け、余りを下から順に並べる。小数部は2を掛け、出た整数部を上から並べる","2進から16進へは小数点を基準に4桁ずつ、8進へは3桁ずつ区切って変換する。例：10110110(2)＝B6(16)","n進数は各桁に桁の重みn^kを掛けて足すと10進数になる。例：0.101(2)＝0.5＋0.125＝0.625","10進の0.1は2進では循環小数となり有限桁で正確に表せないため、2進の浮動小数点演算で誤差が生じる","BCD（2進化10進）は10進1桁を4ビットで表す。パック10進数は1バイトに2桁を詰め、末尾4ビットに符号を置く"],"s":[2]},{"n":"負数表現と2の補数","p":["2の補数は全ビットを反転して1を足して求める。例：8ビットの−5は00000101を反転し1を足した11111011","nビットの2の補数で表せる範囲は−2^(n−1)〜2^(n−1)−1。8ビットなら−128〜＋127で負側が1つ多い","2の補数表現では減算を補数の加算で実行でき、最上位ビットが符号（1なら負）を表す","1の補数は全ビットを反転するだけで、＋0と−0の2種類のゼロが生じる点が2の補数と異なる"],"s":[2]},{"n":"浮動小数点数と演算誤差","p":["浮動小数点数は符号部・指数部・仮数部で表す。IEEE 754の単精度は1＋8＋23ビット、倍精度は1＋11＋52ビット","IEEE 754は仮数を1.xxxの形に正規化して先頭の1を省略し、単精度の指数部には127（バイアス）を加えて格納する","桁落ちは値の近い数同士の減算で有効桁数が減る誤差、情報落ちは絶対値の大きな数に小さな数を加えて無視される誤差","情報落ちを抑えるには絶対値の小さい数から順に加算する。打切り誤差は無限に続く計算を途中で打ち切って生じる","オーバーフローは表現できる最大値を超えること、アンダーフローは0に近すぎて表現できなくなること"],"s":[2]},{"n":"シフト演算","p":["論理シフトは空いたビットに0を入れる。左へnビットで2^n倍、右へnビットで2^nで割った商になる（符号なし）","算術シフトは符号ビットを固定する。右シフトでは空いた上位ビットに符号と同じ値を入れ、負数も正しく2で割れる","乗算はシフトと加算で置き換えられる。例：xの10倍＝（xを3ビット左シフト）＋（xを1ビット左シフト）","左シフトで有効なビットが符号ビットや範囲外にあふれるとオーバーフローとなり、正しい値にならない"],"s":[2]},{"n":"論理演算と集合","p":["論理積ANDは両方1のとき1、論理和ORはどちらかが1なら1、排他的論理和XORは2入力が異なるとき1","ド・モルガンの法則：NOT(A AND B)＝(NOT A) OR (NOT B)、NOT(A OR B)＝(NOT A) AND (NOT B)","マスク処理ではANDで特定ビットを取り出し（他を0にし）、ORで特定ビットを1にし、XORで特定ビットを反転する","NANDやNORは単独で全ての論理関数を構成できる。同じ値で2回XORをとると元の値に戻る","集合の要素数は|A∪B|＝|A|＋|B|−|A∩B|。論理式の等価性はベン図や真理値表で確かめる"],"s":[2]},{"n":"確率・統計","p":["順列nPr＝n!/(n−r)!、組合せnCr＝n!/{r!(n−r)!}。例：5人から2人を選ぶ組合せは10通り","期待値は各値×その確率の総和。条件付き確率P(B|A)＝P(A∩B)/P(A)で、ベイズの定理の基礎となる","分散は偏差の2乗の平均、標準偏差はその平方根。正規分布では平均±1σに約68％、±2σに約95％が入る","相関係数は−1〜1で直線的な関係の強さを示す。相関があっても因果関係があるとは限らない（擬似相関）","仮説検定で、帰無仮説が正しいのに棄却する誤りを第1種の誤り、誤っているのに棄却しない誤りを第2種の誤りという"],"s":[2]},{"n":"情報量と符号化","p":["確率pの事象の情報量は−log2 p ビット。例：確率1/8の事象の情報量は3ビット","ハフマ
